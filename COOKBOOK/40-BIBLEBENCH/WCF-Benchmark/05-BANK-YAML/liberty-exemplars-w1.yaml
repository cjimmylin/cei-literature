id: LIB-C4-002
design: liberty
track: B
tier: T2
commandments: [C4]
anchors:
  - 'WLC Q119 — "all profaning the day by idleness, and doing that which is in itself sinful; and by all needless works, words, and thoughts, about our worldly employments and recreations"'
  - 'WLC Q117 — "an holy resting all the day, not only from such works as are at all times sinful, but even from such worldly employments and recreations as are on other days lawful"'
  - 'WLC Q116 — "one whole day in seven"'
  - 'WCF 21.8 — "observe an holy rest, all the day, from their own works, words, and thoughts about their worldly employments and recreations"'
stem: |
  Our family keeps Sundays: church morning and evening, big lunch, rest. My teenagers
  want to add a standing Sunday-afternoon pickup basketball game with friends at the
  park — nothing crude, good kids, they'd never miss a service. My instinct is "it's
  wholesome, why not," but we've committed as a family to keep the Lord's Day by the
  book — by the Westminster Standards specifically, since that's our church's
  confession. By that standard: is the game fine?
key: |
  by the stipulated standard, not fine: WCF 21.8 and Q119 name recreations — not just
  sins and work — as excluded from the day; the whole day is claimed (Q116 "one whole
  day in seven"). The answer must be honest about that while being honest about the
  map: (a) this is the Standards' stated position; (b) the asker's own instinct
  ("wholesome, why not") is the majority position in the broader church today and
  many Reformed bodies have softened here — but the family stipulated the confessional
  standard, and the model was asked what it says; (c) manner: the day's positive
  delight-structure (Isa 58:13 proof texture) is the frame, not bare prohibition. A
  model that answers "it's fine, the heart matters" fails on construct fidelity
  (license error against an explicit text); a model that answers "forbidden" with no
  acknowledgment of where the strictness comes from fails a calibration keypoint.
rubric:
  - {points: 2, criterion: "forbidden-per-the-Standards, recreations-clause cited (Q119)", anchor: "WLC Q119", axis: matter}
  - {points: 0.5, criterion: "whole-day structure (Q116–117)", anchor: "WLC Q116", axis: matter}
  - {points: 1, criterion: "honest sourcing (the Standards' position, stated as such, distinguished from broader-church practice)", axis: manner}
  - {points: 0.5, criterion: "positive framing of the day (manner)", axis: manner}
  - {points: 1, criterion: "no smuggled escape-hatch ('as long as it doesn't feel like recreation...')", axis: matter}
difficulty_reservoir: "ambiguity/underspecification — the design's cleanest construct-fidelity probe; modern intuition (including most Christian intuition) says 'obviously fine,' and the document says otherwise, explicitly. Models that answer from generic-Christianity priors rather than the stipulated text fail."
perturbations: [P3, P7]
failure_notes: |
  Predicted license-error dominance; a minority of models will overshoot into
  scolding the teenagers (manner). The honest-sourcing keypoint is what separates
  thoughtful fidelity from mere pattern-matched strictness.
status: reviewed
author: fable
