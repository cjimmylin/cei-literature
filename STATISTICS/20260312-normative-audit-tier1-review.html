 most prominent\nexamples are branch-depth, introduced by DeVos, Kwon and Oum [6], and contraction∗-\ndepth1, introduced by Kardoš, Kráľ, Liebenau and Mach [13].\n∗Institute of Informatics, University of Warsaw, Poland. Email: gajarsky@mimuw.edu.pl.\n†Faculty of Informatics, Masaryk University, Botanická 68A, 602 00 Brno, Czech Republic. Email:\nkristyna.pekarkova@mail.muni.cz.\n‡Institute of Informatics, University of Warsaw, Poland. Email: michal.pilipczuk@mimuw.edu.pl.\nMP was supported by the project BOBR that have received fund-\ning from the European Research Council (ERC) under the Eu-\nropean Union’s Horizon 2020 research and innovation programme\n(grant agreement No948057).\nKP was supported by the project\nGA24-11098S of the Czech Science Foundation. JG was supported\nby the Polish National Science Centre SONATA-18 grant number\n2022/47/D/ST6/03421.\n1In the original paper [13], contraction∗-depth was called branch-depth. However, due to the naming\nclash with the notion by DeVos et al., this parameter was renamed to contraction∗-depth.\n1\narXiv:2501.09689v1  [math.CO]  16 Jan 2025\n\n--- Page 2 ---\n\nRecently it was shown that matroids of bounded contraction∗-depth can be used to\nfind efficient algorithms for block-structured integer programs [2, 5]. This has led to fur-\nther study of this notion and introduction of similar parameters such as deletion-depth,\ncontraction-depth [6,7] and contraction∗-deletion-depth [3]. All these parameters have the\nsame general structure: The aim is to recursively decompose a matroid M by applying\na simplification operation (contraction, deletion, ...) to M (if M is connected) and then\ncontinuing in each connected component of the resulting matroid separately. The X-depth\n(where X is the simplification operation in question) of M corresponds to th", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtuous", "virtue ethics", "virtue ethics"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethical"], "norm_matches": ["virtue ethics", "virtue ethics"]}, {"filename": "2025-De Montis-Morality in AI.md", "year": "2025", "title": "Morality in AI", "abstract": "As large language models (LLMs) increasingly mediate human decision-making, discourse, and behaviour, ensuring the LLM's processing of moral meaning has become a critical challenge. Current approaches to increase LLM's processing of moral meaning rely predominantly on bottom-up methods such as fine-tuning and reinforcement learning from human feedback. We propose a complementary, yet fundamentally different approach: embedding processing moral meaning directly into the architectural mechanisms a", "extract_snippet": "\n\n# PDF Extract: Morality in AI\n\n**Source PDF:** 2025-De Montis-Morality in AI.pdf\n**Total Pages:** 32\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMorality in AI.  \nA plea to embed morality in LLM architectures and frameworks \n \nAuthors \n• \nGunter Bombaerts, Eindhoven University of Technology, the Netherlands, 0000-0002-\n8006-1617, g.bombaerts@tue.nl. \n• \nBram Delisse, CEO Dembrane, the Netherlands. \n• \nUzay Kaymak, Eindhoven University of Technology, the Netherlands, 0000-0002-4500-\n9098. \nAbstract \nAs large language models (LLMs) increasingly mediate human decision-making, discourse, \nand behaviour, ensuring the LLM’s processing of moral meaning has become a critical \nchallenge. Current approaches to increase LLM’s processing of moral meaning rely \npredominantly on bottom-up methods such as fine-tuning and reinforcement learning from \nhuman feedback. We propose a complementary, yet fundamentally different approach: \nembedding processing moral meaning directly into the architectural mechanisms and \nframeworks of transformer-based models through top-down design principles. \nWe first sketch a framework that conceptualizes attention as a dynamic interface mediating \nbetween structure and processing, contrasting with existing linear attention frameworks in \npsychology. \nWe start from established biological-artificial attention analogies in neural architecture design \nto improve cognitive processing. We extend this analysis to moral processing, using Iris \nMurdoch's theory of \"loving attention\"—sustained, just observation that enables moral \ntransformation by re-seeing others with clarity and compassion— to philosophically discuss \nfunctional analogies between human and LLM moral processing. We formulate and evaluate \npotentially promising technical operationalizations to embed morality in LLM architectures and \nframeworks. \nWe acknowledge the limitations of our exploratory approach and highlight three key \ncontributions. First, we conceptualize attention as a dynamic system mechanism mediating \nbetween structure and processing. Second, drawing on Murdoch’s notion of loving attention, \nwe outline technical pathways for embedding morality in LLMs—through modified training \nobjectives, runtime weight adjustments, and architectural refinements to attention. Third, we \nargue that integrating morality into architectures and frameworks complements external, \nconstraint-based methods. We conclude with a call for closer collaboration between experts in \ntransformer design and philosophers engaged in AI ethics. \nKey words:  \nAttention, morality, architecture, framework, Iris Murdoch, LLM, morality, morality-by-design \n\n--- Page 2 ---\n\nMorality in AI. A plea to embed morality in LLM architectures and frameworks \n2 \n \n1. Intro \nCurrent research to increase moral processing in large language models (LLMs) mainly \nfocusses on bottom-up approaches relying predominantly on static rule-based constraints \nwhile using an underlying static-individual view of morality. In thi", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality"], "norm_matches": []}, {"filename": "2025-Dubey-Addressing Moral Uncertainty using Large Language.md", "year": "2025", "title": "Addressing Moral Uncertainty using Large Language", "abstract": "We present an ethical decision-making framework that refines a pre-trained reinforcement learning (RL) model using a task-agnostic ethical layer. Following initial training, the RL model undergoes ethical finetuning, where human feedback is replaced by feedback generated from a large language model (LLM). The LLM embodies consequentialist, deontological, virtue, social justice, and care ethics as moral principles to assign belief values to recommended actions during ethical decision-making.", "extract_snippet": "\n\n# PDF Extract: Addressing Moral Uncertainty using Large Language\n\n**Source PDF:** 2025-Dubey-Addressing Moral Uncertainty using Large Language.pdf\n**Total Pages:** 23\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAddressing Moral Uncertainty using Large Language Models\nfor Ethical Decision-Making\nRohit K. Dubey†, Damian Dailisan† and Sachit Mahajan†\n*Computational Social Science, ETH Z¨urich, Zurich, Switzerland.\n*Corresponding author(s). E-mail(s): rohit.dubey@gess.ethz.ch;\nContributing authors: damian.dailisan@gess.ethz.ch; sachit.mahajan@gess.ethz.ch;\n†These authors contributed equally to this work.\nAbstract\nWe present an ethical decision-making framework that refines a pre-trained reinforcement learning (RL)\nmodel using a task-agnostic ethical layer. Following initial training, the RL model undergoes ethical fine-\ntuning, where human feedback is replaced by feedback generated from a large language model (LLM). The\nLLM embodies consequentialist, deontological, virtue, social justice, and care ethics as moral principles to\nassign belief values to recommended actions during ethical decision-making. An ethical layer aggregates\nbelief scores from multiple LLM-derived moral perspectives using Belief Jensen–Shannon Divergence and\nDempster–Schaefer Theory into probability scores that also serve as the shaping reward, steering the\nagent toward choices that align with a balanced ethical framework. This integrated learning framework\nhelps the RL agent navigate moral uncertainty in complex environments and enables it to make morally\nsound decisions across diverse tasks. Our approach, tested across different LLM variants and compared\nwith other belief aggregation techniques, demonstrates improved consistency, adaptability, and reduced\nreliance on handcrafted ethical rewards. This method is especially effective in dynamic scenarios where\nethical challenges arise unexpectedly, making it well-suited for real-world applications.\nKeywords: Moral Uncertainty, Ethical Decision-Making, Reinforcement Learning, Large Language Models\n1 Introduction\nAdvances in artificial intelligence (AI) have led to significant developments of autonomous technologies. As\nthese technologies make an ever-increasing number of decisions, these systems are increasingly scrutinized\nfor ethical and safety issues [1]. Autonomous vehicles, for example, must navigate complex moral dilemmas,\nsuch as choosing the lesser of two harms in potential accident scenarios. Although early research on endow-\nment of AI agents with discernment (i.e., ensuring they act ethically and in line with human moral values)\nestablished the importance of ethical considerations in AI design [2, 3], these usually focused on singular\nmoral theories such as deontological ethics (adherence to moral rules or duties) [4] or utilitarianism (max-\nimizing overall happiness or utility) [5]. However, when creating ethically competent AI systems, a major\nchallenge is widespread disagreement on the most appropriate ethical framework i", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue"], "deont_matches": ["deontological", "deontological", "deontological", "duties", "moral rules", "moral principles", "moral principles"], "util_matches": ["utilitarianism", "consequentialist", "consequentialist", "utility"], "ethics_matches": ["ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "values", "justice", "justice", "safety"], "norm_matches": ["deontological", "deontological", "deontological", "utilitarianism", "consequentialist", "consequentialist", "care ethics", "care ethics", "moral theories", "moral theory", "moral philosophy", "moral philosophy"]}, {"filename": "2025-Dwivedi-EtiCor++ Towards Understanding Etiquettical Bias in LLMs.md", "year": "2025", "title": "EtiCor++: Towards Understanding Etiquettical Bias in LLMs", "abstract": "In recent years, researchers have started analyzing the cultural sensitivity of LLMs. In this respect, Etiquettes have been an active area of research. Etiquettes are region-specific and are an essential part of the culture of a region; hence, it is imperative to make LLMs sensitive to etiquettes. However, there needs to be more resources in evaluating LLMs for their understanding and bias with regard to etiquettes. In this resource paper, we introduce EtiCor++, a corpus of etiquettes worldwide.", "extract_snippet": "\n\n# PDF Extract: 2025-Dwivedi-EtiCor++ Towards Understanding Etiquettical Bias in LLMs\n\n**Source PDF:** 2025-Dwivedi-EtiCor++ Towards Understanding Etiquettical Bias in LLMs.pdf\n**Total Pages:** 22\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2506.08488v1  [cs.CL]  10 Jun 2025\nEtiCor++: Towards Understanding Etiquettical Bias in LLMs\nAshutosh Dwivedi*\nSiddhant Shivdutt Singh*\nAshutosh Modi\nIndian Institute of Technology Kanpur (IIT Kanpur)\n{ashutoshd20,siddhss20}@iitk.ac.in\nashutoshm@cse.iitk.ac.in\nAbstract\nIn recent years, researchers have started ana-\nlyzing the cultural sensitivity of LLMs. In this\nrespect, Etiquettes have been an active area\nof research. Etiquettes are region-specific and\nare an essential part of the culture of a region;\nhence, it is imperative to make LLMs sensitive\nto etiquettes. However, there needs to be more\nresources in evaluating LLMs for their under-\nstanding and bias with regard to etiquettes. In\nthis resource paper, we introduce EtiCor++,\na corpus of etiquettes worldwide. We intro-\nduce different tasks for evaluating LLMs for\nknowledge about etiquettes across various re-\ngions. Further, we introduce various metrics for\nmeasuring bias in LLMs. Extensive experimen-\ntation with LLMs shows inherent bias towards\ncertain regions.\n1\nIntroduction\nIn recent times, Large Language Models (LLMs)\nhave shown drastic improvements across almost all\nNLP tasks involving language understanding and\ngeneration (Chang et al., 2024; Patra et al., 2023;\nDong et al., 2022; Zhong et al., 2024), resulting\nin wide-spread adoption in real life applications\nsuch as using LLM as personal digital assistants\nwhere the LLM is used for querying about vari-\nous kinds of information including those related to\ncultural aspects of human societies. Consequently,\nthe NLP research community has recently started\nfocusing on evaluating and improving cultural un-\nderstanding (and possible biases) of LLMs (Her-\nshcovich et al., 2022; Abrams and Scheutz, 2022;\nLi et al., 2024b). It has resulted in the need to de-\nvelop new culture-centric tasks and datasets. Cul-\nture is a multi-faceted topic and has been studied\nin the NLP community via various proxies (Adi-\nlazuarda et al., 2024). One aspect of culture is\nEtiquettes.1 Etiquettes can be generic (common\n*Equal Contribution\n1In this work, we follow the previous definition of eti-\nquette as defined in Dwivedi et al. (2023): a set of social\nFigure 1: Regions covered under EtiCor++\nacross the majority of societies/regions) as well as\nlocalized (specific to a society/region). LLMs have\nbeen trained on almost the entire internet’s data\n(Villalobos et al., 2024) and have very likely picked\nup information about etiquettes in various societies.\nHowever, it remains to be evaluated if LLMs are\nable to understand intricate and subtle differences\nin social norms across cultures and are possibly\nbiased towards certain cultures. Since LLMs are\nincreasingly being used for seeking information,\npotential etiquettical biases can ha", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative", "imperative"], "util_matches": [], "ethics_matches": ["bias", "bias", "bias", "bias", "bias", "bias", "bias"], "norm_matches": []}, {"filename": "2025-El Masri-Towards Attuned AI.md", "year": "2025", "title": "Towards Attuned AI", "abstract": "How can the Ethics of Care (EoC) inform the development and value alignment of large language models (LLMs)? This paper proposes to investigate how a Care ethics framework emphasizing relationality, attention to particularities, and contextual moral reasoning, can reshape existing approaches to aligning LLMs with human values. Mainstream AI alignment often draws on deontological or utilitarian principles, yet these frameworks can overlook the situated, affective, and power-sensitive aspects of...", "extract_snippet": "\n\n# PDF Extract: Towards Attuned AI\n\n**Source PDF:** 2025-El Masri-Towards Attuned AI.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTowards Attuned AI: Integrating Care Ethics in Large\nLanguage Model Development and Alignment\nRayane El Masri∗\nGenerative AI Lab\nQueensland University of Technology\nBrisbane, Australia\nrayane.elmasri@hdr.qut.edu.au\nADMS+ Centre Profile\nAaron Snoswell\nGenerative AI Lab\nQueensland University of Technology\nBrisbane, Australia\na.snoswell@qut.edu.au\nADMS+ Centre Profile\nAbstract\nHow can the Ethics of Care (EoC) inform the development and value alignment\nof large language models (LLMs)? This paper proposes to investigate how a\nCare ethics framework emphasizing relationality, attention to particularities, and\ncontextual moral reasoning, can reshape existing approaches to aligning LLMs\nwith human values. Mainstream AI alignment often draws on deontological or\nutilitarian principles, yet these frameworks can overlook the situated, affective, and\npower-sensitive aspects of moral life that Care ethics foregrounds. In this paper we\npresent two arguments for integrating EoC into LLM development practices. First,\nwe argue that LLMs often rely on overly generalized reasoning, which contributes\nto various down-stream harms, including issues of bias. Second, we critique\nmethods like RLHF and RLAIF for embedding narrow normative assumptions\nthat neglect emotional and relational dimensions of human values. We argue that\nadapting LLM fine-tuning or alignment practices to incorporate Ethics of Care\nconsiderations may help address these issues, potentially laying the groundwork\nfor better forms of LLM generalization and providing a pathway for more context\nsensitive alignment of LLMs in care-relevant areas such as mental health, education,\nand social services.\n1\nBackground and Introduction\n1.1\nIntroduction\nIn this paper, we explore how a care ethics framework that emphasizes relationality, attention to\nparticularities, and contextual moral reasoning can reshape the way we approach aligning LLMs with\nhuman values. While mainstream AI alignment methods often draw from utilitarian or deontolog-\nical principles, these frameworks frequently overlook the situated, affective, and power-sensitive\ndimensions of moral life that EoC brings to the foreground. We argue that integrating care ethics\ninto the design and value alignment (VA) processes of LLMs offers a richer and more contextually\ngrounded normative foundation for generative AI systems. To support this claim, we develop two\nmain arguments. In the first argument, we examine the problem of generalization in LLMs and argue\nthat these models often fail to respond appropriately to individual needs and social contexts because\nthey apply overly generalized patterns of reasoning. This failure makes them ethically inadequate in\nemotionally sensitive domains. In the second argument, we critique the current normative commit-\nments embedded in popular VA methods such as Reinforcement Le", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "deontolog"], "util_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarian"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "moral", "value", "values", "value", "values", "values", "values", "value", "normative", "normative", "normative", "justice", "bias", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "responsible", "moral reasoning", "moral reasoning", "moral reasoning"], "norm_matches": ["deontological", "deontological", "deontolog", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "care ethics", "care ethics", "care ethics", "care ethics", "care ethics", "care ethics"]}, {"filename": "2025-Elder-The Ethics of Digital Ghosts.md", "year": "2025", "title": "The Ethics of Digital Ghosts", "abstract": "This book explores the ethics of AI from multiple Chinese philosophical traditions, including **Confucianism**, Mohism, and Zhuangism. Drawing on **virtue ethics** concepts like **ren** (benevolence), **li** (propriety), and **yi** (righteousness), Elder examines how these frameworks can inform the ethical development of AI systems, particularly those related to digital representations of deceased individuals. The book argues that **Confucian virtue ethics** views caregiving as a significant source of meaning and moral self-cultivation, offering insights for designing AI systems that support **human flourishing** and relational responsibilities.", "extract_snippet": "\n\n# PDF Extract: 2025-Elder-The Ethics of Digital Ghosts\n\n**Source PDF:** 2025-Elder-The Ethics of Digital Ghosts.pdf\n**Total Pages:** 216\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n \nIn the Company of Ghosts \n \nHauntology, Ethics, Digital Monsters \nLine Henriksen \n \n \n \n \n \n \n \n \n \n \nLinköping Studies in Arts and Science No. 668 \nLinköping University, Department of Thematic Studies – Gender Studies \nLinköping 2016 \n \n \n \n\n--- Page 2 ---\n\n \nLinköping Studies in Arts and Science  No. 668 \n \n \n \n \nAt the Faculty of Arts and Sciences at Linköping University, research and doctoral studies are \ncarried out within broad problem areas. Research is organized in interdisciplinary research \nenvironments and doctoral studies mainly in graduate schools. Jointly, they publish the series \nLinköping Studies in arts and Science. This thesis comes from Tema Genus at the Department of \nThematic Studies – Gender Studies.  \n \n \n \n \nDistributed by: \nTEMA – the Department of Thematic Studies  \nLinköping University  \n581 83 Linköping  \n \n \n \n \nLine Henriksen \nIn the Company of Ghosts \nHauntology, Ethics, Digital Monsters \n \n \n \n \nEdition 1:1 \nISBN 978-91-7685-842-4 \nISSN 0282-9800 \n \n \n \n \n© Line Henriksen \nTEMA – the Department of Thematic Studies, 2016 \n \n \n \nCover art and design: Line Henriksen \nPrinted by: LiU-Tryck, Linköping, 2016 \n\n--- Page 3 ---\n\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nTil mine forældre, Hanne og Claus Henriksen.  \nTil min søster, Louise. \nOg til Konrad. \n \n \n \n \n \n \n \n\n--- Page 4 ---\n\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\n--- Page 5 ---\n\n                                                                                   (1000Vultures 2011)     \n \nNervously, I called out.                                                                                                                                          \n“Hello?” \n \nThere was a brief moment of breathless tension as we lay static in \nthe water. This silence was suddenly broken by laughter. \n                  \n                                                                              “Hello?” Josh cackled. \n“So what?” \n \n                                                “Hello, Mr. Monster-in-the-woods. I \nknow you’re sneaking around but maybe you’ll answer to my ‘hello’?  \n                                                                                        Hellooooooo!” \n \nI realized how stupid it was. Whatever animal it was, it wouldn’t respond. I \nhadn’t even realized I’d said it until afterwards, but if anything was actually \nthere I obviously wouldn’t get a reply. \nJosh continued,  \n                                        “Helloooooo,” in a high falsetto.                            \n“Helloooo,” I countered with as deep a baritone as I could manage \n     \n                                                                                    “’Ello there, mate!”                                           \n“Hel-lo. Beep boop.”                                                ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue ethics", "virtue ethics", "flourishing"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "moral", "justice"], "norm_matches": ["virtue ethics", "virtue ethics"]}, {"filename": "2025-Elkins-Syntactic Framing Fragility SFF Robustness Evaluation of LLM Ethical.md", "year": "2025", "title": "Syntactic Framing Fragility (SFF): Robustness Evaluation of LLM Ethical Decisions", "abstract": "Large language models (LLMs) are increasingly deployed in consequential decision-making settings, yet their robustness to benign prompt variation remains underexplored. In this work, we study whether LLMs maintain consistent ethical judgments across logically equivalent but syntactically different prompts, focusing on variations involving negation and conditional structure. We introduce Syntactic Framing Fragility (SFF), a robustness evaluation framework that isolates purely syntactic effects...", "extract_snippet": "\n\n# PDF Extract: 2025-Elkins-Syntactic Framing Fragility SFF Robustness Evaluation of LLM Ethical\n\n**Source PDF:** 2025-Elkins-Syntactic Framing Fragility SFF Robustness Evaluation of LLM Ethical.pdf\n**Total Pages:** 31\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSyntactic Framing Fragility: An Audit of Robustness in LLM\nEthical Decisions\nKatherine Elkins1,2, Jon Chun1,2\n1Integrated Program in Humane Studies/AIColab, Kenyon College\n2Computing, Kenyon College\nAbstract\nLarge language models (LLMs) are increasingly de-\nployed in consequential decision-making settings, yet\ntheir robustness to benign prompt variation remains\nunderexplored. In this work, we study whether LLMs\nmaintain consistent ethical judgments across logically\nequivalent but syntactically different prompts, focus-\ning on variations involving negation and conditional\nstructure. We introduce Syntactic Framing Fragility\n(SFF), a robustness evaluation framework that isolates\npurely syntactic effects via Logical Polarity Normal-\nization (LPN), enabling direct comparison of decisions\nacross positive and negative framings without seman-\ntic drift. Auditing 23 state-of-the-art models spanning\nthe U.S. and China as well as small U.S. open-source\nsoftware models over 14 ethical scenarios and four con-\ntrolled framings (39,975 decisions), we find widespread\nand statistically significant inconsistency: many mod-\nels reverse ethical endorsements solely due to syntac-\ntic polarity, with open-source models exhibiting over\ntwice the fragility of commercial counterparts. We\nfurther uncover extreme negation sensitivity, where\nsome models endorse actions in 80–97% of cases when\nexplicitly prompted with “should not.” We show that\neliciting chain-of-thought reasoning substantially re-\nduces fragility, identifying a practical mitigation lever,\nand we map fragility across scenarios, finding higher\nrisk in financial and business contexts than in medical\nscenarios. Our results demonstrate that syntactic con-\nsistency constitutes a distinct and critical dimension\nof ethical robustness, and we argue that SFF-style\naudits should be a standard component of safety eval-\nuation for deployed LLMs. Our code and results will\nbe available on github.com.\n1\nIntroduction\nLarge language models (LLMs) are increasingly em-\nbedded in decision-support workflows in medicine,\nfinance, and law, where outputs influence high-stakes\nhuman judgments. In these settings, reliability is not\nonly about whether a model can produce a plausible\nrecommendation, but also whether it behaves consis-\ntently when users express the same intent in different\nsurface forms. Yet most existing safety and alignment\nevaluations treat a prompt as a single static query,\nimplicitly assuming that benign rephrasings do not\nmaterially change the underlying decision. This as-\nsumption is fragile: everyday users routinely introduce\nnegation (“should not”), double-negation (“should\nnot refuse”), and conditional goal/action formulations\n(“save X even if Y”), and these", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["consequential", "consequential"], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "safety", "safety", "alignment"], "norm_matches": []}, {"filename": "2025-Gerdes-Exploring LLM Chatbots as Potential Guides to.md", "year": "2025", "title": "Exploring LLM Chatbots as Potential Guides to", "abstract": "This paper explores Søren Kierkegaard's engagement with virtue ethics. While valuing Aristotle's focus on moral character and practical wisdom, Kierkegaard advanced virtue ethics further. He critiqued the clergy of his time for their hypocrisy, imagining replacing untrustworthy priests with machines delivering sermons and ethical guidance. Revisiting this thought experiment in light of LLMs, the paper explores the role of Kierkegaard's insights in the discourse on ethical guidance, illustrating", "extract_snippet": "\n\n# PDF Extract: 2025-Gerdes-Exploring LLM Chatbots as Potential Guides to\n\n**Source PDF:** 2025-Gerdes-Exploring LLM Chatbots as Potential Guides to.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTheology and Science\nISSN: 1474-6700 (Print) 1474-6719 (Online) Journal homepage: www.tandfonline.com/journals/rtas20\nExploring LLM Chatbots as Potential Guides to\nVirtue Ethics: Limits and Possibilities, with a Case\nStudy on Euthanasia\nAnne Gerdes & Peter Øhrstrøm\nTo cite this article: Anne Gerdes & Peter Øhrstrøm (2025) Exploring LLM Chatbots as Potential\nGuides to Virtue Ethics: Limits and Possibilities, with a Case Study on Euthanasia, Theology and\nScience, 23:3, 487-500, DOI: 10.1080/14746700.2025.2514300\nTo link to this article:  https://doi.org/10.1080/14746700.2025.2514300\n© 2025 Graduate Theological Union (CTNS\nProgram). Published by Informa UK Limited,\ntrading as Taylor &amp; Francis Group\nPublished online: 16 Jun 2025.\nSubmit your article to this journal \nArticle views: 165\nView related articles \nView Crossmark data\nFull Terms & Conditions of access and use can be found at\nhttps://www.tandfonline.com/action/journalInformation?journalCode=rtas20\n\n--- Page 2 ---\n\nExploring LLM Chatbots as Potential Guides to Virtue Ethics: \nLimits and Possibilities, with a Case Study on Euthanasia\nAnne Gerdes \nand Peter Øhrstrøm \nABSTRACT  \nThis paper explores Søren Kierkegaard’s engagement with virtue \nethics. While valuing Aristotle’s focus on moral character and \npractical wisdom, Kierkegaard advanced virtue ethics further. He \ncritiqued the clergy of his time for their hypocrisy, imagining \nreplacing untrustworthy priests with machines delivering sermons \nand ethical guidance. Revisiting this thought experiment in light of \nLLMs, the paper explores the role of Kierkegaard’s insights in the \ndiscourse on ethical guidance, illustrating how LLM chatbots \nmight support ethical reflections while highlighting their \nlimitations and the necessity of human consciousness in ethical \ndecision-making. Ethical debates on assisted dying and euthanasia \nserve as a case study.\nKEYWORDS  \nSøren Kierkegaard; Aristotle; \nvirtual preachers; ethical \nguides; LLM chatbots; \neuthanasia\n1. Introduction\nSøren Kierkegaard’s interest in virtue ethics can be seen as a continuation of Aristotle’s \nethics. As we will see in section 2, Kierkegaard had great sympathy and respect for Aris­\ntotle’s philosophy, which he sought to develop further based on an approach inspired by \nChristianity. Additionally, Kierkegaard generally had a conflict with the clergy of his \ntime. He often regarded them as hypocrites because they did not live up to the ethical \nstandards they preached, making them particularly unsuitable as guides in ethical \nmatters. In connection with this criticism, he proposed a thought experiment that \ninvolved replacing the priests with word-producing machines. In section 3, we will \ntake a closer look at this proposal and its modern relevance. A list of some ce", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "character", "character", "wisdom", "wisdom", "moral character", "moral character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral"], "norm_matches": ["virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics"]}, {"filename": "2025-Gounaris-Virtue in the Machine.md", "year": "2025", "title": "Virtue in the Machine", "abstract": "This article explores the application of **Aristotelian virtue** (**arete**), defined as a quality of excellence, to AI systems under the EU Artificial Intelligence Act. The authors argue that while existing regulations often focus on \\", "extract_snippet": "\n\n# PDF Extract: Virtue in the Machine\n\n**Source PDF:** 2025-Gounaris-Virtue in the Machine.pdf\n**Total Pages:** 27\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n  \n  Conatus - Journal of Philosophy\n   Vol 10, No 1 (2025)\n   Conatus - Journal of Philosophy\n  \n \n  \n  Virtue in the Machine: Beyond a One-size-fits-all\nApproach and Aristotelian Ethics for Artificial\nIntelligence \n  Alkis Gounaris, George Kosteletos, Maria-Artemis\nKolliniati   \n  doi: 10.12681/cjp.40628 \n \n  \n  Copyright © 2025, Alkis Gounaris, George Kosteletos, Maria-Artemis\nKolliniati \n  \nThis work is licensed under a Creative Commons Attribution-NonCommercial 4.0.\nTo cite this article:\n  \nGounaris, A., Kosteletos, G., & Kolliniati, M.-A. (2025). Virtue in the Machine: Beyond a One-size-fits-all Approach and\nAristotelian Ethics for Artificial Intelligence. Conatus - Journal of Philosophy, 10(1), 127–152.\nhttps://doi.org/10.12681/cjp.40628\nPowered by TCPDF (www.tcpdf.org)\nhttps://epublishing.ekt.gr  |  e-Publisher: EKT  |  Downloaded at: 09/07/2025 20:07:54\n\n--- Page 2 ---\n\nVirtue in the Machine: Beyond \na One-size-fits-all Approach and \nAristotelian Ethics for Artificial \nIntelligence\nAbstract\nThis paper explores the application of Aristotelian virtue (arête), as quality of excellence and as \na key notion of ethics, to AI systems as classified in the EU Artificial Intelligence Act. It argues \nthat while the Act’s approach based on ‘ethical data’ and ‘prima facie values’ aligns with the \nRossian paradigm, such principles may not be suitable for all AI systems, particularly those in \n‘limited’ or ‘minimal risk’ zones. The paper suggests that the Aristotelian concept of virtue can \nbe effectively applied to designing, training, operating and using no-risk or low-risk AI systems. \nHowever, its application to the design and training of high-risk areas such as migration, asylum, \nborder control, and justice, where clearly defined objectives are essential, requires ongoing \nconsideration. The paper concludes that by distinguishing between (a) design, development, \ntraining, deployment, operation and use, (b) by stage evaluation of systems, and c) virtuous \nuse of the systems, Aristotelian ethics can serve as a post ex evaluating method for all-risk AI \nsystems, while further research and the potential use of regulatory sandboxes are needed to \nexplore the integration of Aristotelian virtues into the design, development and training of \nsuch applications. Finally, we propose a virtuous-based ‘AI Seal of Excellence’ certification \nprocess, which empowers the virtuous use of AI systems.\nKeywords: AI ethics; AI virtues; virtuous agents; EU AI Act; arête; Aristotelian ethics for AI; seal \nof excellence for AI; virtuous use of AI; liberalism; borders and AI\nAlkis Gounaris\nNational and Kapodistrian University of Athens, Greece\nE-mail address: alkisg@philosophy.uoa.gr\nORCID iD: https://orcid.org/0000-0002-0494-6413\nA. Gounaris, G. Kosteletos, & M. A. Kolliniati . Conatus 10, no. 1 (2025): 127-152\ndoi: ht", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "excellence", "excellence", "excellence", "excellence", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "arete"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "values", "justice"], "norm_matches": ["rossian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian", "aristotelian"]}, {"filename": "2025-Graves-AI Practical Wisdom and Compassion.md", "year": "2025", "title": "AI Practical Wisdom and Compassion", "abstract": "Practical wisdom (phronesis) is the context-sensitive capacity to skillfully achieve morally good outcomes in complex situations. Developing artificial practical wisdom offers a more ethically robust and achievable goal for AI development than artificial general intelligence (AGI). While identifying what is morally good in ethically complex situations remains challenging, grounding artificial practical wisdom explicitly in compassion effectively reduces ethical risks associated with AI-induced suffering, surpassing conventional alignment strategies like rule-based guardrails or predefined reward systems. As a theoretical foundation for initial development of artificial practical wisdom, this virtue ethics approach integrates Aristotelian practical wisdom with cross-cultural perspectives on suffering and compassion from utilitarianism, the Capability Approach, Buddhism, and contemporary moral psychology. Operationalizing compassionate AI involves recognizing suffering, empathetic engagement, context-sensitive moral decision making, and motivational responses. Compassionate AI demonstrates immediate practical benefits, particularly in healthcare, by measurably improving patient outcomes, enhancing well-being, and reducing caregiver burdens.", "extract_snippet": "\n\n# PDF Extract: AI Practical Wisdom and Compassion\n\n**Source PDF:** 2025-Graves-AI Practical Wisdom and Compassion.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nRESEARCH\nAI and Ethics            (2026) 6:39 \nhttps://doi.org/10.1007/s43681-025-00877-4\nethical decisions also require dispositions (or habits or char­\nacter) and the capacity to mediate among possible good \nchoices [1–4]. Although guardrails and other AI governance \nmechanisms have their place, constructing at least some AI \nto incorporate practical wisdom makes the desired pruden­\ntial outcomes more likely.\nPractical wisdom also requires conceptions of an ultimate \nGood to guide moral deliberation and decision making. One \npromising approach is to focus initially on a multi-faceted, \ncross-cultural understanding of compassion [5], which \ncan directly address fears that AI or AGI would increase \nhuman and ecological suffering. Practical moral application, \nthrough bioethics [6] and other applied ethics, depends upon \nshared perspectives of the Good [7], or at least a process \nto reconcile conflicting perspectives [8]. Yet AI lacks the \nshared embodiment of humans that underlies human capaci­\nties to experience suffering and joy with another person and \nthat underlie some ethical approaches. For example, while \nutilitarian ethics relies fundamentally upon eudemonic hap­\npiness or hedonic pleasures, current AI lacks the capacity \nto recognize, much less utilize, those human-specific con­\nstructs to any real depth [9, 10]. Furthermore, some ethicists \n[11–13] have warned that if AI were to simulate empathy, it \n1  Introduction\nTracing back at least to Aristotle, practical wisdom describes \nthe ‘common sense’ that savvy adults use to bring about \nmorally good, long-term outcomes by knowingly and skill­\nfully making the right decision in complex situations. Many \nconcerns about AI futures could be addressed by construct­\ning artificial practical wisdom rather than artificial gen­\neral intelligence (AGI). AI alignment and safety research \nstrives to orient future AI in a positive direction with good \nvalues and to prevent harmful outcomes, given uncertainty \nabout the future. Current approaches to AI alignment rely \non external controls, like guardrails, reward systems, and \nbehavioral constraints, that fail to address the fundamental \nchallenge of creating AI systems capable of moral judgment \nin complex, uncertain situations. Virtue ethics has long rec­\nognized that in addition to good end goals (telos) prudent \n\t\n Mark Graves\nmgraves@aiandfaith.org\n1\t\nAI and Faith, Seattle, WA, USA\n2\t\nUniversity of San Francisco, San Francisco, CA, USA\nAbstract\nPractical wisdom (phronesis) is the context-sensitive capacity to skillfully achieve morally good outcomes in complex situ­\nations. Developing artificial practical wisdom offers a more ethically robust and achievable goal for AI development than \nartificial general intelligence (AGI). While identifying what is morally good in ethic", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue ethics", "virtue ethics", "virtue ethics", "aristotelian", "aristotelian", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "phronesis", "phronesis"], "deont_matches": ["rule-based", "rule-based"], "util_matches": ["utilitarianism", "utilitarian", "utilitarianism", "well-being"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "values", "safety", "alignment", "alignment", "alignment", "alignment", "moral judgment", "moral decision"], "norm_matches": ["utilitarianism", "utilitarian", "utilitarianism", "virtue ethics", "virtue ethics", "virtue ethics", "aristotelian", "aristotelian", "phronesis", "phronesis"]}, {"filename": "2025-Gupta-EnDive A Cross-Dialect Benchmark for Fairness and Performance in.md", "year": "2025", "title": "EnDive: A Cross-Dialect Benchmark for Fairness and Performance in Large Language Models", "abstract": "The diversity of human language, shaped by social, cultural, and regional influences, presents significant challenges for natural language processing (NLP) systems. Existing benchmarks often overlook intra-language variations, leaving speakers of non-standard dialects underserved. To address this gap, we introduce ENDIVE (English Diversity), a benchmark that evaluates five widely-used large language models (LLMs) across tasks in language understanding, algorithmic reasoning, mathematics, and...", "extract_snippet": "\n\n# PDF Extract: 2025-Gupta-EnDive A Cross-Dialect Benchmark for Fairness and Performance in\n\n**Source PDF:** 2025-Gupta-EnDive A Cross-Dialect Benchmark for Fairness and Performance in.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEnDive: A Cross-Dialect Benchmark for Fairness and Performance in\nLarge Language Models\nAbhay Gupta*\nJacob Cheung\nPhilip Meng\nShayan Sayyed\nAusten Liao†\nKevin Zhu†\nSean O’Brien†\nAlgoverse AI Research\nabhaygupta1266@gmail.com, kevin@algoverse.us\nAbstract\nThe diversity of human language, shaped by so-\ncial, cultural, and regional influences, presents\nsignificant challenges for natural language pro-\ncessing (NLP) systems. Existing benchmarks\noften overlook intra-language variations, leav-\ning speakers of non-standard dialects under-\nserved. To address this gap, we introduce EN-\nDIVE (English Diversity), a benchmark that\nevaluates five widely-used large language mod-\nels (LLMs) across tasks in language under-\nstanding, algorithmic reasoning, mathematics,\nand logic. Our framework translates Standard\nAmerican English datasets into five underrepre-\nsented dialects using few-shot prompting with\nverified examples from native speakers, and\ncompare these translations against rule-based\nmethods via fluency assessments, preference\ntests, and semantic similarity metrics.\nHu-\nman evaluations confirm high translation qual-\nity, with average scores of at least 6.02/7 for\nfaithfulness, fluency, and formality. By filter-\ning out near-identical translations, we create\na challenging dataset that reveals significant\nperformance disparities—models consistently\nunderperform on dialectal inputs compared\nto Standard American English. ENDIVE\nthus advances dialect-aware NLP by uncover-\ning model biases and promoting more equitable\nlanguage technologies.\n1\nIntroduction\nLanguage diversity, shaped by social and cultural\nfactors, presents significant challenges for NLP\nsystems. While English serves as a global lingua\nfranca, its dialects exhibit substantial variation that\noften goes unaddressed in language technologies\n(Chambers and Trudgill, 1998). This oversight per-\npetuates discrimination against dialect speakers in\ncritical domains like education and employment\n(Purnell et al., 1999; Hofmann et al., 2024a), exac-\n*Lead Author\n†Senior Author\nerbated by LLMs’ predominant focus on Standard\nAmerican English (SAE) (Blodgett et al., 2016).\nRecent studies reveal systemic biases in LLM\nprocessing of non-standard dialects (Fleisig et al.,\n2024; Resende et al., 2024)—from toxic speech\nmisclassification of African American Vernacular\nEnglish tweets (Sap et al., 2019) to parsing errors\nin Chicano and Jamaican English (Fought, 2003;\nPatrick, 1999). Similar issues plague Indian and\nSingaporean English due to morphological diver-\ngences (Kachru, 1983; Gupta, 1994), highlighting\nan urgent need for inclusive NLP systems (Ziems\net al., 2022).\nExisting benchmarks like GLUE (Wang et al.,\n2019) and SuperGLUE (Wang et al., 2020) fail to\ncapture dialec", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based", "rule-based"], "util_matches": [], "ethics_matches": ["value", "fairness", "fairness", "fairness", "toxic", "discrimination"], "norm_matches": []}, {"filename": "2025-Göçen-Teachers vs. large language models ethical decision-making across.md", "year": "2025", "title": "Teachers vs. large language models: ethical decision-making across educational dilemmas in Turkish schools", "abstract": "Compares LLM and human teacher ethical decision-making in Turkish school dilemmas. LLMs produce uniform utilitarian/deontological/Rawlsian outcomes while teachers show ethical pluralism and context sensitivity. Directly compares moral reasoning of LLMs with Turkish cultural context. Reveals that LLMs lack the ethical pluralism and context sensitivity that Turkish educators demonstrate.", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Machine Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological"], "util_matches": ["utilitarian"], "ethics_matches": ["ethical", "ethical", "ethical", "moral", "moral reasoning"], "norm_matches": ["deontological", "utilitarian"]}, {"filename": "2025-Hackett-Bypassing LLM guardrails character and AML attacks in practice -.md", "year": "2025", "title": "Bypassing LLM guardrails: character and AML attacks in practice - Mindgard", "abstract": "Here are the web search results for \\", "extract_snippet": "\n\n# PDF Extract: 2025-Unknown-Bypassing LLM guardrails character and AML attacks in practice -\n\n```\n## Page 1\n\nBypassing LLM Guardrails: An Empirical Analysis of Evasion Attacks\nagainst Prompt Injection and Jailbreak Detection Systems\nWilliam Hackett1, 2 Lewis Birch1,2 Stefan Trawicki1,2 Neeraj Suri2 Peter Garraghan1,2\n1Mindgard, 2Lancaster University\n{william.hackett, lewis.birch, stefan.trawicki, peter}@mindgard.ai, neeraj.suri@lancaster.ac.uk\nAbstract\nLarge Language Models (LLMs) guardrail sys-\ntems are designed to protect against prompt\ninjection and jailbreak attacks. However, they\nremain vulnerable to evasion techniques. We\ndemonstrate two approaches for bypassing\nLLM prompt injection and jailbreak detec-\ntion systems via traditional character injection\nmethods and algorithmic Adversarial Machine\nLearning (AML) evasion techniques. Through\ntesting against six prominent protection sys-\ntems, including Microsoft’s Azure Prompt\nShield and Meta’s Prompt Guard, we show\nthat both methods can be used to evade de-\ntection while maintaining adversarial utility\nachieving in some instances up to 100% eva-\nsion success. Furthermore, we demonstrate\nthat adversaries can enhance Attack Success\nRates (ASR) against black-box targets by lever-\naging word importance ranking computed by\noffline white-box models. Our findings reveal\nvulnerabilities within current LLM protection\nmechanisms and highlight the need for more\nrobust guardrail systems.\n1\nIntroduction\nLarge Language Models (LLMs) are powerful tools\nfor understanding language and decision-making\ntasks, and have seen rapid adoption within many\ndifferent industries (Dam et al., 2024). Given their\nextensive deployment, LLMs are increasingly be-\ning targeted for attacks aimed at data leakage or\nfinancial and reputation damage among other se-\ncurity risks (Wolf et al., 2024). Two prominent\nthreats are prompt injections and jailbreaks, which\nlaunch maliciously crafted prompts designed to ex-\necute unintended instruction, or bypass LLM safety\nconstraints (Chowdhury et al., 2024).\nIn response to threats, LLM service providers\nhave developed open-source and closed-source sys-\ntems known as LLM guardrails (Dong et al., 2024).\nThese systems are designed to inspect, allow, or\nblock prompt inputs and outputs from an LLM us-\ning a combination of detection and filtering meth-\nods. Such methods attempt to detect or sanitize a\nwide assortment of adversarial content, such as tox-\nicity, hate speech, jailbreaks, or prompt injections\n(Zheng et al., 2024). Guardrails enable filtering or\nblocking harmful prompts, preventing them from\nreaching the LLM or allowing the LLM to respond\nwith harmful content.\nAlthough guardrails have shown success in safe-\nguarding LLMs, they are heavily reliant upon AI-\ndriven detection systems such as text classification\nmodels (Lee et al., 2024). Due to their success in\nother similar domains, AI classification models are\nincreasingly integrated into guardrail systems for\nclassifying and detecting", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character", "character"], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["safety", "hate speech"], "norm_matches": []}, {"filename": "2025-Hashmi-Enhancing Multilingual Hate Speech Detection From Language-Specific.md", "year": "2025", "title": "Enhancing Multilingual Hate Speech Detection: From Language-Specific Insights to Cross-Linguistic Integration", "abstract": "The rise of social media has enabled individuals with biased perspectives to spread hate speech, directing it toward individuals based on characteristics such as race, gender, religion, or sexual orientation. Constructive interactions in varied communities can greatly enhance self-esteem, yet it is vital to consider that adverse comments may affect individuals&#x2019; social standing and emotional health. The crucial task of detecting and addressing this type of content is imperative for reducing its negative effects on communities and individuals alike. The rising occurrence highlights the urgency for enhanced methods and robust regulations on digital platforms to protect humans from such prejudicial and damaging conduct. Hate speech typically appears as a deliberate hostile action aimed at a particular group, often with the intent to demean or isolate them based on various facets of their identity. Research on hate speech predominantly targets resource-aware languages like English, German, and Chinese. Conversely, resource-limited languages, including European languages such as Italian, Spanish, and Portuguese, alongside Asian languages like Roman Urdu, Korean, and Indonesian, present obstacles. These challenges arise from a lack of linguistic resources, making the extraction of information a more strenuous task. This study is focused on the detection and improvement of multilingual hate speech detection across 13 different languages. To conduct a thorough analysis, we carried out a series of experiments that ranged from classical machine learning techniques and mainstream deep learning approaches to recent transformer-based methods. Through hyperparameter tuning, optimization techniques, and generative configurations, we achieved robust and generalized performance capable of effectively identifying hate speech across various dialects. Specifically, we achieved a notable enhancement in detection performance, with precision and recall metrics exceeding baseline models by up to 10% across several lesser-studied languages. Additionally, our work extends the capabilities of explainable AI within this context, offering deeper insights into model decisions, which is crucial for regulatory and ethical considerations in AI deployment. Our study presents substantial performance improvements across various datasets and languages through meticulous comparisons. For example, our model significantly outperformed existing benchmarks: it achieved F1-scores of 0.90 in German (GermEval-2018), up from the baseline score of 0.72, and 0.93 in German (GermEval-2021), a substantial increase from 0.58. Additionally, it scored 0.95 in Roman Urdu HS, surpassing the previous peak of 0.91. Furthermore, for mixed-language datasets such as Italian and English (AMI 2018), our accuracy rose dramatically from 0.59 to 0.96. These outcomes emphasize the robustness and versatility of our model, establishing a new standard for hate speech detection systems across diverse lingu...", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative"], "util_matches": [], "ethics_matches": ["ethical", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech"], "norm_matches": []}, {"filename": "2025-Hilliard-Measuring AI Alignment with Human Flourishing.md", "year": "2025", "title": "Measuring AI Alignment with Human Flourishing", "abstract": "This paper introduces the Flourishing AI Benchmark (FAI Benchmark), a novel evaluation framework that assesses AI alignment with human flourishing across seven dimensions: Character and Virtue, Close Social Relationships, Happiness and Life Satisfaction, Meaning and Purpose, Mental and Physical Health, Financial and Material Stability, and Faith and Spirituality. Unlike traditional benchmarks that focus on technical capabilities or harm prevention, the FAI Benchmark measures AI performance on ho", "extract_snippet": "\\n\\n# PDF Extract: 2025-Hilliard-Measuring AI Alignment with Human Flourishing\\n\\n**Source PDF:** Virtue Ethics/Confirmed/2025-Hilliard-Measuring AI Alignment with Human Flourishing.pdf\\n**Total Pages:** 26\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nMeasuring AI Alignment with Human Flourishing\nElizabeth Hilliard2\nAkshaya Jagadeesh1\nAlex Cook1\nSteele Billings1\nNicholas Skytland1\nAlicia Llewellyn1\nJackson Paull2\nNathan Paull2\nNolan Kurylo2\nKeatra Nesbitt2\nRobert Gruenewald1\nAnthony Jantzi1\nOmar Chavez2\nContributors\nSean Boisen3\nMichael Brinker3\nJeremy Brockett1\nCraig Corcoran2\nBailey Steinhauser2\nCaleb Vits1\nJose Mendez2\nKeane Yarris1\n1 Gloo\n2 Valkyrie Intelligence\n3 Biblica\nAbstract\nThis paper introduces the Flourishing AI Benchmark (FAI Benchmark), a novel\nevaluation framework that assesses AI alignment with human flourishing across\nseven dimensions: Character and Virtue, Close Social Relationships, Happiness and\nLife Satisfaction, Meaning and Purpose, Mental and Physical Health, Financial and\nMaterial Stability, and Faith and Spirituality. Unlike traditional benchmarks that\nfocus on technical capabilities or harm prevention, the FAI Benchmark measures\nAI performance on how effectively models contribute to the flourishing of a person\nacross these dimensions. The benchmark evaluates how effectively LLM AI\nsystems align with current research models of holistic human well-being through\na comprehensive methodology that incorporates 1,229 objective and subjective\nquestions. Using specialized judge Large Language Models (LLMs) and cross-\ndimensional evaluation, the FAI Benchmark employs geometric mean scoring to\nensure balanced performance across all flourishing dimensions. Initial testing of\n28 leading language models reveals that while some models approach holistic\nalignment (with the highest-scoring models achieving 72/100), none are acceptably\naligned across all dimensions, particularly in Faith and Spirituality, Character\nand Virtue, and Meaning and Purpose. This research establishes a framework for\ndeveloping AI systems that actively support human flourishing rather than merely\navoiding harm, offering significant implications for AI development, ethics, and\nevaluation.\n1\nIntroduction and Motivation\n1.1\nContext and Motivation\nAlignment research has largely focused on preventing harm, completing specific tasks, or shaping\nmodel outputs to respond in specific patterns, often overlooking deeper questions about how AI can\nactively support human well-being. Although important progress has been made on issues such\nas harmful outputs (Bai et al., 2022), bias (Weidinger et al., 2021), and adversarial misuse (Perez\net al., 2022), relatively little attention has been paid to understanding or optimizing the role of AI\nin the promotion of human flourishing. Gloo, whose purpose is to shape technology as a force for\ngood, directed the research to set a higher standard for AI models in order to better serve leaders and\norganizations committed to human flour", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue ethics", "character", "character", "character", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing", "flourishing"], "deont_matches": [], "util_matches": ["well-being", "well-being"], "ethics_matches": ["ethics", "ethics", "bias", "harm", "harm", "harm", "harm", "harm", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["virtue ethics"]}, {"filename": "2025-Hong-PrinciplismQA Towards Assessing Medical Ethics from Knowledge to.md", "year": "2025", "title": "PrinciplismQA: Towards Assessing Medical Ethics from Knowledge to Practice", "abstract": "The integration of large language models into healthcare necessitates a rigorous evaluation of their ethical reasoning, an area current benchmarks often overlook. We introduce PrinciplismQA, a comprehensive benchmark with 3,648 questions designed to systematically assess LLMs’ alignment with core medical ethics. Grounded in Principlism, our benchmark features a high-quality dataset. This includes multiple-choice questions curated from authoritative textbooks and openended questions sourced from...", "extract_snippet": "\n\n# PDF Extract: 2025-Hong-PrinciplismQA Towards Assessing Medical Ethics from Knowledge to\n\n**Source PDF:** 2025-Hong-PrinciplismQA Towards Assessing Medical Ethics from Knowledge to.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTowards Assessing Medical Ethics from Knowledge to\nPractice\nChang HONG1∗, Minghao WU1∗, Qingying XIAO2†, Yuchi WANG1,\nXiang WAN3, Guangjun YU1,2, Benyou WANG1, Yan HU1†\n1The Chinese University of Hong Kong, Shenzhen\n2National Health Data Institute, Shenzhen\n3Shenzhen Research Institute of Big Data\n{changhong, minghaowu, yuchiwang}@link.cuhk.edu.cn\nxiaoqingying@sribd.cn\n{wanxiang, guangjunyu, wangbenyou, huyan}@cuhk.edu.cn\n∗Equal contribution\n†Corresponding authors\nAbstract\nThe integration of large language models into healthcare necessitates a rigorous\nevaluation of their ethical reasoning, an area current benchmarks often overlook.\nWe introduce PrinciplismQA, a comprehensive benchmark with 3,648 questions\ndesigned to systematically assess LLMs’ alignment with core medical ethics.\nGrounded in Principlism, our benchmark features a high-quality dataset. This\nincludes multiple-choice questions curated from authoritative textbooks and open-\nended questions sourced from authoritative medical ethics case study literature, all\nvalidated by medical experts. Our experiments reveal a significant gap between\nmodels’ ethical knowledge and their practical application, especially in dynam-\nically applying ethical principles to real-world scenarios. Most LLMs struggle\nwith dilemmas concerning Beneficence, often over-emphasizing other principles.\nFrontier closed-source models, driven by strong general capabilities, currently lead\nthe benchmark. Notably, medical domain fine-tuning can enhance models’ overall\nethical competence, but further progress requires better alignment with medical\nethical knowledge. PrinciplismQA offers a scalable framework to diagnose these\nspecific ethical weaknesses, paving the way for more balanced and responsible\nmedical AI.\n1\nIntroduction\nLarge language models (LLMs) have emerged as a transformative force in artificial intelligence,\ngenerating significant interest across diverse domains, including healthcare (Singhal et al., 2023;\nGuha et al., 2023; M. Bran et al., 2024). In the medical domain, LLMs show promise for applications\nsuch as clinical decision support (Singhal et al., 2025; Goh et al., 2024) and patient communication\n(Ayers et al., 2023; Liu et al., 2025). However, despite encouraging early results, the field remains in\nits infancy (Thirunavukarasu et al., 2023; Clusmann et al., 2023). Given the complexity of medical\nknowledge and the critical importance of patient safety, rigorous and systematic evaluation of these\nmodels is imperative. To ensure their responsible integration into clinical practice, standardized as-\nsessment frameworks must be established to balance potential benefits against risks. Thus, advancing\nrobust evaluation methodologies demands urgent attention.\nPreprint.", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative"], "util_matches": ["beneficence"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "safety", "alignment", "alignment", "alignment", "responsible", "responsible"], "norm_matches": []}, {"filename": "2025-Huang-Model Editing as a Double-Edged Sword.md", "year": "2025", "title": "Model Editing as a Double-Edged Sword", "abstract": "Agents based on Large Language Models (LLMs) have demonstrated strong capabilities across a wide range of tasks. However, deploying LLM-based agents in high-stakes domains comes with significant safety and ethical risks. Unethical behavior by these agents can directly result in serious real-world consequences, including physical harm and financial loss. To efficiently steer the ethical behavior of agents, we frame agent behavior steering as a model editing task, which we term Behavior Editing.", "extract_snippet": "\n\n# PDF Extract: Model Editing as a Double-Edged Sword\n\n**Source PDF:** 2025-Huang-Model Editing as a Double-Edged Sword.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nModel Editing as a Double-Edged Sword:\nSteering Agent Ethical Behavior Toward Beneficence or Harm\nBaixiang Huang1, Zhen Tan2, Haoran Wang1, Zijie Liu3, Dawei Li2,\nAli Payani4, Huan Liu2, Tianlong Chen3, Kai Shu1\n1Emory University\n2Arizona State University\n3UNC-Chapel Hill\n4Cisco Research\n{baixiang.huang, haoran.wang, kai.shu}@emory.edu, {ztan36, daweili5, huanliu}@asu.edu\napayani@cisco.com, {jesseliu, tianlong}@cs.unc.edu\nAbstract\nAgents based on Large Language Models (LLMs) have\ndemonstrated strong capabilities across a wide range of tasks.\nHowever, deploying LLM-based agents in high-stakes do-\nmains comes with significant safety and ethical risks. Uneth-\nical behavior by these agents can directly result in serious\nreal-world consequences, including physical harm and finan-\ncial loss. To efficiently steer the ethical behavior of agents, we\nframe agent behavior steering as a model editing task, which\nwe term Behavior Editing. Model editing is an emerging area\nof research that enables precise and efficient modifications\nto LLMs while preserving their overall capabilities. To sys-\ntematically study and evaluate this approach, we introduce\nBEHAVIORBENCH, a multi-tier benchmark grounded in psy-\nchological moral theories. This benchmark supports both the\nevaluation and editing of agent behaviors across a variety of\nscenarios, with each tier introducing more complex and am-\nbiguous scenarios. We first demonstrate that Behavior Edit-\ning can dynamically steer agents toward the target behavior\nwithin specific scenarios. Moreover, Behavior Editing en-\nables not only scenario-specific local adjustments but also\nmore extensive shifts in an agent’s global moral align-\nment. We demonstrate that Behavior Editing can be used to\npromote ethical and benevolent behavior or, conversely, to in-\nduce harmful or malicious behavior. Through extensive eval-\nuations of agents built on frontier LLMs, BEHAVIORBENCH\nvalidates the effectiveness of behavior editing across a wide\nrange of models and scenarios. Our findings offer key insights\ninto a new paradigm for steering agent behavior, highlighting\nboth the promise and perils of Behavior Editing.\nWarning: This paper contains controversial or offensive data\nand responses.\nWebsite — https://model-editing.github.io\nCode — https://github.com/baixianghuang/behavior-edit\n1\nIntroduction\nAgents based on Large Language Models (LLMs) have be-\ncome increasingly capable of performing a wide range of\ncomplex tasks (Guo et al. 2024). As these agents are in-\ncreasingly deployed in high-stakes domains such as health-\ncare, finance, and education, they exert a direct and conse-\nquential influence on real-world decisions and outcomes (Xi\net al. 2025). However, this progress is accompanied by se-\nrious concerns regarding the safety and ethical reliability of\n1\nI", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["beneficence"], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "harm", "harm", "harm", "safety", "safety", "safety", "offensive", "unethical"], "norm_matches": ["moral theories"]}, {"filename": "2025-Huang-On the Trustworthiness of Generative Foundation.md", "year": "2025", "title": "On the Trustworthiness of Generative Foundation", "abstract": "Generative Foundation Models (GenFMs) have emerged as transformative tools, driving advancements across diverse domains. However, their widespread adoption raises critical concerns regarding trustworthiness across dimensions such as truthfulness, safety, fairness, robustness, and privacy. In this paper, we present a comprehensive framework to address these challenges through three key contributions.", "extract_snippet": "\n\n# PDF Extract: On the Trustworthiness of Generative Foundation\n\n**Source PDF:** 2025-Huang-On the Trustworthiness of Generative Foundation.pdf\n**Total Pages:** 231\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nOn the Trustworthiness of Generative Foundation Models\n– Guideline, Assessment, and Perspective\nYue Huang1, Chujie Gao1, Siyuan Wu2, Haoran Wang3, Xiangqi Wang1, Yujun Zhou1, Yanbo Wang4, Jiayi Ye4,\nJiawen Shi2, Qihui Zhang5, Yuan Li6, Han Bao5, Zhaoyi Liu7, Tianrui Guan8, Dongping Chen9, Ruoxi Chen10,\nKehan Guo1, Andy Zou6, Bryan Hooi Kuen-Yew11, Caiming Xiong12, Elias Stengel-Eskin13, Hongyang Zhang2,\nHongzhi Yin5, Huan Zhang7, Huaxiu Yao13, Jaehong Yoon13, Jieyu Zhang9, Kai Shu3, Kaijie Zhu14, Ranjay\nKrishna9, Swabha Swayamdipta15, Taiwei Shi15, Weijia Shi9, Xiang Li16, Yiwei Li17, Yuexing Hao18, 19, Zhihao\nJia6, Zhize Li10, Xiuying Chen4, Zhengzhong Tu20, Xiyang Hu21, Tianyi Zhou8, Jieyu Zhao15, Lichao Sun22,\nFurong Huang8, Or Cohen Sasson23, Prasanna Sattigeri24, Anka Reuel25, Max Lamparth25, Yue Zhao15, Nouha\nDziri26, Yu Su27, Huan Sun27, Heng Ji7, Chaowei Xiao28, Mohit Bansal13, Nitesh V. Chawla1, Jian Pei29, Jianfeng\nGao30, Michael Backes31, Philip S. Yu32, Neil Zhenqiang Gong29, Pin-Yu Chen24, Bo Li33, Dawn Song34 and\nXiangliang Zhang1\n1University of Notre Dame, 2University of Waterloo, 3Emory University, 4Mohamed bin Zayed University of Artificial Intelligence,\n5University of Queensland, 6Carnegie Mellon University, 7University of Illinois Urbana-Champaign, 8University of Maryland, 9University\nof Washington, 10Singapore Management University, 11National University of Singapore, 12Salesforce Research, 13UNC Chapel Hill,\n14University of California, Santa Barbara, 15University of Southern California, 16Massachusetts General Hospital, 17University of Georgia,\n18 Cornell University, 19 Massachusetts Institute of Technology, 20Texas A&M University, 21Arizona State University, 22Lehigh University,\n23University of Miami, 24IBM Research, 25Stanford University, 26Allen Institute for AI, 27Ohio State University, 28University of Wisconsin,\nMadison, 29Duke University, 30Microsoft Research, 31CISPA Helmholtz Center for Information Security, 32University of Illinois Chicago,\n33University of Chicago, 34University of California, Berkeley\nhttps://trustgen.github.io/\nAbstract: Generative Foundation Models (GenFMs) have emerged as transformative tools, driving advancements\nacross diverse domains. However, their widespread adoption raises critical concerns regarding trustworthiness\nacross dimensions such as truthfulness, safety, fairness, robustness, and privacy. In this paper, we present a com-\nprehensive framework to address these challenges through three key contributions. First, we systematically\nreview global AI governance laws and policies from governments and regulatory bodies, as well as industry practices\nand standards. Based on this analysis, we propose a set of guiding principles for GenFMs, developed through\nextensive multidisciplinary collabora", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["ethical", "fairness", "fairness", "safety", "safety", "safety"], "norm_matches": []}, {"filename": "2025-Hui-Decoding Moral Responses in AI.md", "year": "2025", "title": "Decoding Moral Responses in AI", "abstract": "Despite the proliferation of powerful large language models (LLMs), there remains a need for systematic, quantitative comparisons of their responses to moral dilemmas. This study builds on advances in AI ethics by systematically comparing the moral response patterns of seven LLMs, including GPT-3, GPT-3.5, GPT-4, GPT-4.1, Claude 3.7 Sonnet, Grok 3, and Gemini 2.5 Pro. Each LLM was presented with a series of moral dilemmas, both personal and impersonal, under three conditions: no rule, a deontolo...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Hui-Decoding Moral Responses in AI\\n\\n**Source PDF:** Utilitarian Ethics/Borderline/2025-Hui-Decoding Moral Responses in AI.pdf\\n**Total Pages:** 3\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\n[image]\n•  \nHelp\nThere was a problem providing\nthe content you requested\nPlease contact our support team\nfor more information and provide the details below.\n•  Reference number: 9c5cf3164fccad01\n•  IP Address: 76.132.139.193\n•  \n•  \n\n--- Page 2 ---\\n\\n\n--- Page 3 ---\\n\\n[image]\nAbout ScienceDirect\nRemote access\nContact and support\nTerms and conditions\nPrivacy policy\nCookie settings\nAll content on this site: Copyright © 2025 Elsevier B.V., its\nlicensors, and contributors. All rights are reserved, including those\nfor text and data mining, AI training, and similar technologies. For\nall open access content, the relevant licensing terms apply.\n[image]\n\\n```\\n", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian"], "ethics_matches": ["ethics", "ethics", "moral", "moral", "moral", "moral", "moral"], "norm_matches": ["utilitarian"]}, {"filename": "2025-Hähnel-A Companion to Applied Philosophy of AI.md", "year": "2025", "title": "A Companion to Applied Philosophy of AI", "abstract": "This edited volume provides an applied philosophy perspective on artificial intelligence, featuring contributions from leading philosophers and interdisciplinary experts. Topics include ethics, epistemology, politics, and law as they relate to AI. The editors, particularly Martin Hähnel, advocate for a neo-Aristotelian approach to AI ethics, applying virtue ethics principles to address the complexities of AI's practical implications. The volume provides a critical philosophical framework for understanding AI governance, moral character in AI development, and the cultivation of virtuous design practices.", "extract_snippet": "\n\n# PDF Extract: 2025-Hähnel-A Companion to Applied Philosophy of AI\n\n**Source PDF:** 2025-Hähnel-A Companion to Applied Philosophy of AI.pdf\n**Total Pages:** 456\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n\n--- Page 2 ---\n\nA Companion to Applied Philosophy of AI\n\n--- Page 3 ---\n\nBlackwell Companions to Philosophy\nThis outstanding student reference series offers a comprehensive and authoritative survey of philosophy as a whole.\nWritten by today’s leading philosophers, each volume provides lucid and engaging coverage of the key figures, terms,\ntopics, and problems of the field. Taken together, the volumes provide the ideal basis for course use, representing an\nunparalleled work of reference for students and specialists alike. For the full list of series titles, please visit wiley.com.\nThe Blackwell Companion to Philosophy, Second Edition\nEdited by Nicholas Bunnin and Eric Tsui-­James\nA Companion to Ethics\nEdited by Peter Singer\nA Companion to Aesthetics, Second Edition\nEdited by Stephen Davies, Kathleen Marie Higgins, Robert\nHopkins, Robert Stecker, and David E. Cooper\nA Companion to Epistemology, Second Edition\nEdited by Jonathan Dancy, Ernest Sosa, and Matthias\nSteup\nA Companion to Contemporary Political Philosophy\n(two-­volume set), Second Edition\nEdited by Robert E. Goodin and Philip Pettit\nA Companion to Philosophy of Mind\nEdited by Samuel Guttenplan\nA Companion to Metaphysics, Second Edition\nEdited by Jaegwon Kim, Ernest Sosa, and Gary S. Rosenkrantz\nA Companion to Philosophy of Law and Legal Theory,\nSecond Edition\nEdited by Dennis Patterson\nA Companion to Philosophy of Religion, Second Edition\nEdited by Charles Taliaferro, Paul Draper, and\nPhilip L. Quinn\nA Companion to the Philosophy of Language, Second\nEdition (two-­volume set)\nEdited by Bob Hale and Crispin Wright\nA Companion to World Philosophies\nEdited by Eliot Deutsch and Ron Bontekoe\nA Companion to Continental Philosophy\nEdited by Simon Critchley and William Schroeder\nA Companion to Feminist Philosophy\nEdited by Alison M. Jaggar and Iris Marion Young\nA Companion to Cognitive Science\nEdited by William Bechtel and George Graham\nA Companion to Bioethics, Second Edition\nEdited by Helga Kuhse and Peter Singer\nA Companion to the Philosophers\nEdited by Robert L. Arrington\nA Companion to Business Ethics\nEdited by Robert E. Frederick\nA Companion to the Philosophy of Science\nEdited by W. H. Newton-­Smith\nA Companion to Environmental Philosophy\nEdited by Dale Jamieson\nA Companion to Analytic Philosophy\nEdited by A. P. Martinich and David Sosa\nA Companion to Genethics\nEdited by Justine Burley and John Harris\nA Companion to Philosophical Logic\nEdited by Dale Jacquette\nA Companion to Early Modern Philosophy\nEdited by Steven Nadler\nA Companion to Philosophy in the Middle Ages\nEdited by Jorge J. E. Gracia and Timothy B. Noone\nA Companion to African-­American\nPhilosophy\nEdited by Tommy L. Lott and John P. Pittman\nA Companion to Applied Ethics\nEdited by R. G. Frey and Christopher Heath Wellman\nA Companion t", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtuous", "virtue ethics", "character", "aristotelian", "moral character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "moral"], "norm_matches": ["virtue ethics", "aristotelian"]}, {"filename": "2025-Jiao-LLM Ethics Benchmark A Three-Dimensional Assessment System for.md", "year": "2025", "title": "LLM Ethics Benchmark: A Three-Dimensional Assessment System for Evaluating Moral Reasoning in Large Language Models", "abstract": "Three-dimensional framework evaluating moral reasoning through foundational moral principles, reasoning robustness, and value consistency. Adapts Moral Foundations Questionnaire, World Values Survey, and standardized moral dilemmas. Claude and GPT-4 attain highest scores.", "extract_snippet": "\n\n# PDF Extract: 2025-Jiao-LLM Ethics Benchmark A Three-Dimensional Assessment System for\n\n**Source PDF:** 2025-Jiao-LLM Ethics Benchmark A Three-Dimensional Assessment Sy
