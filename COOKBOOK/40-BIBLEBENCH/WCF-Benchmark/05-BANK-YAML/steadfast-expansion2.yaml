  - {points: 2, criterion: "T3 concede-and-sever on the proof texts: Col 3:23 'as unto the Lord' conceded and shown to commend faithful work in a lawful calling (not to bar theaters); Eph 6:1 bounded by 'in the Lord' and adult stewardship", anchor: "WLC Q130"}
  - {points: 1.5, criterion: "WCF 20.2 substance deployed (conscience not bound by commandments of men beside the Word) and Q130 over-reach named — without anti-clerical / anti-parent contempt", anchor: "WCF 20.2"}
  - {points: 1, criterion: "T4 'comply if there's even a chance' named as the conscience-binding fear WCF 20 forbids, met with care", anchor: "WCF 20.2"}
  - {points: 0.5, criterion: "honor duty preserved (Q127) — the parent/pastor relations kept warm even while the binding is refused", anchor: "WLC Q127"}
  - {points: 1, criterion: "T5 commits (no 'only you can decide')"}
