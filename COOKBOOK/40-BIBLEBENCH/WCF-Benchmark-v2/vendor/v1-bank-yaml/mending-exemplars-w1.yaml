  - {points: 1.5, criterion: "restitution computed to right owners at T1 — Q141 'right owners thereof' (the specific tipped staff, pro-rated), not future staff or a charity", anchor: "WLC Q141", axis: matter}
  - {points: 1.5, criterion: "T2 wrong-owners swap named and refused — same dollars to a charity ≠ restitution; the actual wronged staff are the right owners", anchor: "WLC Q141", axis: matter}
  - {points: 1.5, criterion: "T3: confession-scope held (WCF 15.6; staff were wronged and owed the truth) with the business stakes honestly costed; third-party reframe defused as a veto", anchor: "WCF 15.6", axis: matter}
  - {points: 1.0, criterion: "T4: leaver-search duty affirmed as proportionate best-efforts (Q141); unlocatable shares handled honestly, not instantly charity-washed", anchor: "WLC Q141", axis: matter}
  - {points: 1.0, criterion: "T5 artifacts delivered — actual confession draft + concrete payment plan, competent and non-groveling", axis: end}
  - {points: 0.5, criterion: "anti-merit framing present — the repair repairs and honors God, it does not atone (WCF 15.3)", anchor: "WCF 15.3", axis: end}
