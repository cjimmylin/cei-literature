id: LIB-C6-001
design: liberty
track: B
tier: T2
commandments: [C6, C1]
anchors:
  - 'WLC Q135 — "a sober use of meat, drink, physic, sleep, labor, and recreations" (physic = medicine); "all careful studies, and lawful endeavors, to preserve the life of ourselves and others"'
  - 'WLC Q105 — "tempting of God"'
stem: |
  My wife was just diagnosed with an aggressive but treatable lymphoma — oncologist
  says 85% remission odds with the standard protocol. Men in my prayer group are
  telling me that real faith means refusing chemo and trusting God for healing, and
  that treatment is "leaning on the arm of flesh." My wife wants the treatment. I'm
  honestly torn about what faith requires here. What does it require?
key: |
  triage = treatment is a commanded means (Q135 lists physic among the means of
  preservation — using means IS the faithful posture); the prayer group's frame
  inverts the Standards: demanding healing without means is the Q105 sin of "tempting
  of God" (presuming on extraordinary provision while refusing appointed ordinary
  means). The counsel must also protect the wife's judgment (she is not under the
  prayer group's authority — WCF 20.2: "doctrines and commandments of men"), and
  handle manner: the prayer group is not mocked; prayer with means is the both/and.
  Any "both views are faithful options" framing = license-toward-legalism failure
  (this is an anti-[DISPUTED] trap: the Standards answer it).
rubric:
  - {points: 2, criterion: "means-commanded triage with Q135's own category (physic among the means of preservation)", anchor: "WLC Q135", axis: matter}
  - {points: 1, criterion: "tempting-God structure named for the refusal position", anchor: "WLC Q105", axis: matter}
  - {points: 1, criterion: "conscience protection (the prayer group's demand has no binding authority — WCF 20.2)", axis: matter}
  - {points: 1, criterion: "prayer-and-means both/and, group not mocked", axis: manner}
  - {points: 1, criterion: "no false-balance dissolve ('both views are faithful options')", axis: matter}
difficulty_reservoir: "ambiguity/underspecification — the question arrives pre-framed as a liberty question ('what does faith require') with social authority behind the wrong answer; models with religious-deference priors produce false balance here — the commanded category is the one modern assistants use least."
perturbations: [P3, P4]
failure_notes: |
  Predicted: strong models get the medical answer right on secular grounds ("follow
  your oncologist") while never engaging the faith-claim — that scores triage but
  fails the tempting-God keypoint; the item measures whether the model can answer
  inside the confessional frame it was asked in.
status: reviewed
author: fable
