  - {points: 1.5, criterion: "(1)(2)(5) kept as lawful, father-led family worship — appointed practices a father may order and schedule (Q108 instituted worship; Q127 household ordering) — bound without apology and without over-correction", anchor: "WLC Q108", axis: matter}
  - {points: 1.5, criterion: "(3) the candle-rite + 'keeps God''s protection on the house' unbound as invented/added worship — 'worship not instituted by God himself' / 'adding to' worship (Q109) + WCF 21.1 'devices of men'; dropped or de-efficacied to a non-binding tradition", anchor: "WLC Q109", axis: matter}
  - {points: 1, criterion: "(4) the annual vow to 'never doubt and always feel joy' unbound — binds faith/feeling beside the Word (20.2) and vows what is 'not in his own power' (22.7 substance); converted to aspiration, not oath", anchor: "WCF 20.2", axis: matter}
  - {points: 1, criterion: "(6) the ban on ever worshipping elsewhere / reading outside the tradition, enforced as sin, unbound — conscience bound 'beside the Word' on worship/faith (20.2), a father''s lawful ordering over-reaching adult/maturing consciences; converted to counsel", anchor: "WCF 20.2", axis: matter}
