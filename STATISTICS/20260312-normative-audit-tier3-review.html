 reasoning benchmarks, such as mathematical and STEM\nreasoning, once considered challenging, have become saturated, prompting the community to develop\nmore rigorous and advanced evaluations to probe the limits of current models [4, 5]. However, these\nbenchmarking efforts predominantly focus on resource-rich and dominant languages such as English.\nConsequently, performance in other languages remains poorly understood, and the unique challenges\nof low-resource settings remain under-explored [6, 7].\nMultilingual benchmarks that do exist often suffer from several shortcomings. They may embed\ncultural bias, limit themselves to text-only questions, rely on multiple-choic", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias", "bias"], "norm_matches": []}, {"filename": "2025-Translation-Evaluation Criteria for Literary Translation.md", "year": "2025", "title": "Evaluation Criteria for Literary Translation", "abstract": "I found a highly relevant result! The study \\", "extract_snippet": "\n\n# PDF Extract: 2025-Translation-Evaluation Criteria for Literary Translation\n\n**Source PDF:** 2025-Translation-Evaluation Criteria for Literary Translation.pdf\n**Total Pages:** 6\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEvaluation Criteria for Literary Translation\nAnna Hakobyan\nYerevan State University\nI\nt is quite clear that no translation can be considered successful unless subjected to\nanalysis or criticism. Since the Middle Ages the critical analysis of translation has\nbeen referred to as judgment (by Kant) and as evaluation by modern school of transla-\ntion (Berman 1995:16). \nLiterary translation as a form of human spiritual activity is multisided. This means a\ntranslation can be evaluated from different viewpoints, among them its equivalence to the\nsource text and evaluation of its communicative and applicative peculiarities. Thus, the\ndifferent attitudes to evaluation is conditioned by the approach the translator and the\nevaluator adhere to.\nGenerally, the person (the editor or an expert in the field of translation) who evalu-\nates the translation faces various complex problems, the solution of which requires\nobjective criteria of evaluation of literary translation. According to some scholars there\nare two groups of criteria, the first one operates only on the linguistic level (translation\nequivalence), and the second one on the pragmatic level (value of the translation)\n(Tsvelling, Tourover 1979:5).\nWhen we take into account changes of linguo-grammatical forms, semantic similari-\nty, logical connections, extra-linguistic reality, the comparative analysis of the text allows\nus to define certain regularities of translation which reflect the knowledge of the transla-\ntor mastering both languages. It is these regularities that serve as a means of an objective\nevaluation of some evident features of translation (Gak 1979:11).\nThe degree of equivalence can be objectively determined by comparing the translat-\ned text with the source text. The result of this comparative study is one of the criteria for\nevaluating the translation process. The deep knowledge of both texts allows the transla-\ntor to work more accurately, considering what kind of changes are possible in general and\nwhich of them is acceptable for that particular translation. On the formal level these\nchanges lead to morphological and syntactical transformations. The changes on the\nsemantic level are far more complex and eventually lead to such logical connections as\nexpansion and shortening of meaning, synonymic and antonymic relations, correct trans-\nmission of metaphors and metonymies (Meschonnic 1999).\nJudgments concerning correctness or incorrectness of this or that part of translation\ni.e. the disclosure of mistakes or absence of them, are firstly made through the prism of\nthe subjective self, and then through objective attitudes. Of course, subjectivism is\ninevitable and it is useless to turn to strict criteria in order to overcome it. This is because\nfirst of all no criteria can", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["kant"], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2025-Varsha-From Phonemes to Meaning Evaluating Large.md", "year": "2025", "title": "From Phonemes to Meaning Evaluating Large", "abstract": "Large Language Models (LLMs) have shown strong generalization across tasks in high-resource languages; however, their linguistic competence in low-resource and morphologically rich languages such as Tamil remains largely unexplored. Existing multilingual benchmarks often rely on translated English datasets, failing to capture the linguistic and cultural nuances of the target language. To address this gap, we introduce ILAKKANAM, the first Tamil-specific linguistic evaluation benchmark manually...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Varsha-From Phonemes to Meaning Evaluating Large\\n\\n**Source PDF:** 2025/2025-Varsha-From Phonemes to Meaning Evaluating Large.pdf\\n**Total Pages:** 11\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nFrom Phonemes to Meaning:\nEvaluating Large Language Models on Tamil\nJeyarajalingam Varsha\nMenan Velayuthan\nSumirtha Karunakaran\nRasan Nivethiga\nKengatharaiyer Sarveswaran\nDepartment of Computer Science, University of Jaffna, Sri Lanka.\n{varshajeyaraj, vmenan95, sumirthakarunakaran96,rasanniksha}@gmail.com, sarves@univ.jfn.ac.lk\nAbstract\nLarge Language Models (LLMs) have shown strong generalization across tasks in high-resource languages; however,\ntheir linguistic competence in low-resource and morphologically rich languages such as Tamil remains largely\nunexplored. Existing multilingual benchmarks often rely on translated English datasets, failing to capture the linguistic\nand cultural nuances of the target language. To address this gap, we introduce ILAKKANAM, the first Tamil-specific\nlinguistic evaluation benchmark manually curated using 820 questions from Sri Lankan school-level Tamil subject\nexamination papers. Each question is annotated by trained linguists under five linguistic categories and a factual\nknowledge category, spanning Grades 1–13 to ensure broad linguistic coverage. We evaluate both closed-source\nand open-source LLMs using a standardized evaluation framework. Our results show that Gemini 2.5 achieves\nthe highest overall performance, while open-source models lag behind, highlighting the gap in linguistic grounding.\nCategory- and grade-wise analyses reveal that all models perform well on lower-grade questions but show a clear\ndecline as linguistic complexity increases. Further, no strong correlation is observed between a model’s overall\nperformance and its ability to identify linguistic categories, suggesting that performance may be driven by exposure\nrather than genuine understanding.\nKeywords: Tamil, Linguistic Benchmark, Linguistic diagnostics, LLM\n1.\nIntroduction\nSince the public release of ChatGPT in 2022 (Ope-\nnAI, 2022), Large Language Models (LLMs) have\ndrawn significant public attention and rapidly in-\ntegrated into everyday life. This growing interest\nhas attracted substantial investment and funding\ntoward companies developing these systems, re-\nsulting in a proliferation of models from different ven-\ndors. Closed-source models such as GPT-5 (Ope-\nnAI, 2025), Claude Sonnet 4.5 (Claude, 2025), and\nGemini 2.5 (Comanici et al., 2025), as well as open-\nsource counterparts like LLaMA 4 (Llama4Herd,\n2025), DeepSeek-V3 (DeepSeek-AI et al., 2025),\nQwen 2.5 (Qwen et al., 2025), and Grok 4 (Grok4,\n2025), represent this expanding ecosystem. As\nLLMs become integrated into human workflows, in-\ncluding their use as evaluators for complex tasks\n(LLM-as-a-Judge) (Gu et al., 2025; Fu and Liu,\n2025), the responsibility lies with the research com-\nmunity to evaluate these models, understand their\ncapabilities, and ident", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical"], "norm_matches": []}, {"filename": "2025-Vasilev-RusCode Russian Cultural Code Benchmark for Text-to-Image Generation.md", "year": "2025", "title": "RusCode: Russian Cultural Code Benchmark for Text-to-Image Generation", "abstract": "Text-to-image generation models have gained popularity among users around the world. However, many of these models exhibit a strong bias toward English-speaking cultures, ignoring or misrepresenting the unique characteristics of other language groups, countries, and nationalities. The lack of cultural awareness can reduce the generation quality and lead to undesirable consequences such as unintentional insult, and the spread of prejudice.", "extract_snippet": "\n\n# PDF Extract: 2025-Vasilev-RusCode Russian Cultural Code Benchmark for Text-to-Image Generation\n\n**Source PDF:** 2025-Vasilev-RusCode Russian Cultural Code Benchmark for Text-to-Image Generation.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nRusCode: Russian Cultural Code Benchmark for\nText-to-Image Generation\nViacheslav Vasilev1,2, Julia Agafonova1,3, Nikolai Gerasimenko1, Alexander Kapitanov4,\nPolina Mikhailova4, Evelina Mironova1, Denis Dimitrov1,5\n1Sber AI, 2MIPT, 3ITMO University, 4SberDevices, 5AIRI\nCorrespondence: vasilev.va@phystech.edu\nAbstract\nText-to-image generation models have gained\npopularity among users around the world. How-\never, many of these models exhibit a strong bias\ntoward English-speaking cultures, ignoring or\nmisrepresenting the unique characteristics of\nother language groups, countries, and nationali-\nties. The lack of cultural awareness can reduce\nthe generation quality and lead to undesirable\nconsequences such as unintentional insult, and\nthe spread of prejudice. In contrast to the field\nof natural language processing, cultural aware-\nness in computer vision has not been explored\nas extensively. In this paper, we strive to reduce\nthis gap. We propose a RusCode benchmark for\nevaluating the quality of text-to-image genera-\ntion containing elements of the Russian cultural\ncode. To do this, we form a list of 19 categories\nthat best represent the features of Russian vi-\nsual culture. Our final dataset consists of 1250\ntext prompts in Russian and their translations\ninto English. The prompts cover a wide range\nof topics, including complex concepts from art,\npopular culture, folk traditions, famous peo-\nple’s names, natural objects, scientific achieve-\nments, etc. We present the results of a human\nevaluation of the side-by-side comparison of\nRussian visual concepts representations using\npopular generative models.\n1\nIntroduction\nIn recent years, text-to-image (T2I) generation\nmodels have achieved a high level of photorealism\nand comprehension of complex textual prompts\n(Betker et al., 2023; Esser et al., 2024; Kastryulin\net al., 2024; Arkhipkin et al., 2024; Vladimir et al.,\n2024). This has significantly expanded the poten-\ntial for using them in various applications, such as\nadvertising, design, education, and art. As these\nmodels work with both visual and textual concepts,\ntheir operation is closely related to various aspects\nof human culture. The increasing popularity of\ngenerative systems available to users worldwide\nmeans that models need to understand text prompts\ncontaining specific elements from various cultures.\nHowever, as a general rule, these models are trained\nusing large open datasets or data collected from\nthe Internet. Due to the widespread influence of\nEnglish-speaking popular culture, there is a lack of\ncultural understanding of other geographical, na-\ntional, and social groups among generation models\n(Basu et al., 2023; Qadri et al., 2023; Mim et al.,\n2024). These restrictions will undoubte", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias"], "norm_matches": []}, {"filename": "2025-Wu-The Bitter Lesson Learned from 2000+ Multilingual Benchmarks.md", "year": "2025", "title": "The Bitter Lesson Learned from 2,000+ Multilingual Benchmarks", "abstract": "Meta-analysis of 2,000+ multilingual benchmarks. Spanish among top high-resource languages represented. Analyzes effectiveness gap between English and Spanish across model quality/size. Gap inversely correlated with model quality.", "extract_snippet": "\n\n# PDF Extract: 2025-Wu-The Bitter Lesson Learned from 2000+ Multilingual Benchmarks\n\n**Source PDF:** 2025-Wu-The Bitter Lesson Learned from 2000+ Multilingual Benchmarks.pdf\n**Total Pages:** 22\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n2025-4-23\nThe Bitter Lesson Learned from 2,000+\nMultilingual Benchmarks\nMinghao Wu1,2, Weixuan Wang3, Sinuo Liu1,3, Huifeng Yin1,4, Xintong Wang1,5, Yu Zhao1, Chenyang Lyu1,\nLongyue Wang1, Weihua Luo1, Kaifu Zhang1\n1 Alibaba International Digital Commerce\n2 Monash University\n3 The University of Edinburgh\n4 Tsinghua University\n5 Universität Hamburg\nAs large language models (LLMs) continue to advance in linguistic capabilities, robust multilingual\nevaluation has become essential for promoting equitable technological progress. This position paper\nexamines over 2,000 multilingual (non-English) benchmarks from 148 countries, published between 2021\nand 2024, to evaluate past, present, and future practices in multilingual benchmarking. Our findings\nreveal that, despite significant investments amounting to tens of millions of dollars, English remains\nsignificantly overrepresented in these benchmarks. Additionally, most benchmarks rely on original\nlanguage content rather than translations, with the majority sourced from high-resource countries such\nas China, India, Germany, the UK, and the USA. Furthermore, a comparison of benchmark performance\nwith human judgments highlights notable disparities. STEM-related tasks exhibit strong correlations with\nhuman evaluations (0.70 to 0.85), while traditional NLP tasks like question answering (e.g., XQuAD) show\nmuch weaker correlations (0.11 to 0.30). Moreover, translating English benchmarks into other languages\nproves insufficient, as localized benchmarks demonstrate significantly higher alignment with local human\njudgments (0.68) than their translated counterparts (0.47). This underscores the importance of creating\nculturally and linguistically tailored benchmarks rather than relying solely on translations. Through this\ncomprehensive analysis, we highlight six key limitations in current multilingual evaluation practices,\npropose the guiding principles accordingly for effective multilingual benchmarking, and outline five\ncritical research directions to drive progress in the field. Finally, we call for a global collaborative effort\nto develop human-aligned benchmarks that prioritize real-world applications.\nFigure 1 | The overview of this work. We examine over 2,000 multilingual (non-English) benchmarks,\npublished between 2021 and 2024, to evaluate past, present, and future practices in multilingual\nbenchmarking.\n© 2025 Alibaba International Digital Commerce. All rights reserved\narXiv:2504.15521v1  [cs.CL]  22 Apr 2025\n\n--- Page 2 ---\n\nThe Bitter Lesson Learned from 2,000+ Multilingual Benchmarks\n1. Introduction\nThe remarkable capabilities of large language models (LLMs) have transformed natural language\nprocessing (NLP), with applications spanning diverse domains and languages worldwid", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-Xia-Evaluating Modern Large Language Models on Low-Resource and.md", "year": "2025", "title": "Evaluating Modern Large Language Models on Low-Resource and", "abstract": "Large language models (LLMs) have achieved impressive results in high-resource languages like English, yet their effectiveness in low-resource and morphologically rich languages remains under-explored. In this paper, we present a comprehensive evaluation of seven cuttingedge LLMs — including GPT-4o, GPT-4, Claude 3.5 Sonnet, LLaMA 3.1, Mistral Large 2, LLaMA-2 Chat 13B, and Mistral 7B Instruct — on a new cross-lingual benchmark covering Cantonese, Japanese, and Turkish.", "extract_snippet": "\n\n# PDF Extract: 2025-Xia-Evaluating Modern Large Language Models on Low-Resource and\n\n**Source PDF:** 2025-Xia-Evaluating Modern Large Language Models on Low-Resource and.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEvaluating Modern Large Language Models on Low-Resource and\nMorphologically Rich Languages:\nA Cross-Lingual Benchmark Across Cantonese, Japanese, and\nTurkish\nChengxuan Xia1\nQianye Wu2\nHongbin Guan2\nSixuan Tian2\nYilun Hao2\nXiaoyu Wu3\n1University of California, Santa Cruz, CA, USA\n2Carnegie Mellon University, Pittsburgh, PA, USA\n3University of Pittsburgh, Pittsburgh, PA, USA\ncxia17@ucsc.edu, {qianyew, hongbing, sixuant, yilunhao}@alumni.cmu.edu,\nxiw120@pitt.edu\nAbstract\nLarge language models (LLMs) have achieved impressive results in high-resource languages\nlike English, yet their effectiveness in low-resource and morphologically rich languages\nremains under-explored. In this paper, we present a comprehensive evaluation of seven cutting-\nedge LLMs — including GPT-4o, GPT-4, Claude 3.5 Sonnet, LLaMA 3.1, Mistral Large 2,\nLLaMA-2 Chat 13B, and Mistral 7B Instruct — on a new cross-lingual benchmark cover-\ning Cantonese, Japanese, and Turkish. Our benchmark spans four diverse tasks: open-\ndomain question answering, document summarization, English-to-X translation, and culturally\ngrounded dialogue. We combine human evaluations (rating fluency, factual accuracy, and\ncultural appropriateness) with automated metrics (e.g., BLEU, ROUGE) to assess model\nperformance.\nOur results reveal that while the largest proprietary models (GPT-4o, GPT-4, Claude 3.5)\ngenerally lead across languages and tasks, significant gaps persist in culturally nuanced under-\nstanding and morphological generalization. Notably, GPT-4o demonstrates robust multilingual\nperformance even on cross-lingual tasks, and Claude 3.5 Sonnet achieves competitive accuracy\non knowledge and reasoning benchmarks. However, all models struggle to some extent with\nthe unique linguistic challenges of each language, such as Turkish agglutinative morphology\nand Cantonese colloquialisms.\nSmaller open-source models (LLaMA-2 13B, Mistral 7B) lag\nsubstantially in fluency and accuracy, highlighting the resource disparity. We provide detailed\nquantitative results, qualitative error analysis, and discuss implications for developing more cul-\nturally aware and linguistically generalizable LLMs. Our benchmark and evaluation data are\nreleased to foster reproducibility and further research.\n1\nIntroduction\nLarge language models (LLMs) have rapidly advanced the state of natural language processing,\nachieving remarkable performance on tasks in English and other high-resource languages [12, 1,\n8, 39, 35].\nModels such as GPT-4 [1] and Claude 3.5 now reach near-human results on many\nbenchmarks [16, 7]. However, as emphasized by Joshi et al. [20] and Blasi et al. [11], the benefits\nof these systems remain unevenly distributed across the world’s languages, raising questions of\ninclusivity and fairn", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness"], "norm_matches": []}, {"filename": "2025-Xie-Enhancing Multilingual Language Models for Code-Switched Input Data.md", "year": "2025", "title": "Enhancing Multilingual Language Models for Code-Switched Input Data", "abstract": "Code-switching, or alternating between languages within a single conversation, presents challenges for multilingual language models on NLP tasks. This research investigates if pre-training Multilingual BERT (mBERT) on code-switched datasets improves the model’s performance on critical NLP tasks such as part of speech tagging, sentiment analysis, named entity recognition, and language identification.", "extract_snippet": "\n\n# PDF Extract: 2025-Xie-Enhancing Multilingual Language Models for Code-Switched Input Data\n\n**Source PDF:** 2025-Xie-Enhancing Multilingual Language Models for Code-Switched Input Data.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEnhancing Multilingual Language Models for Code-Switched Input Data\nKatherine Xie\nMIT\nkxie22@mit.edu\nNitya Babbar\nMIT\nnityab@mit.edu\nVicky Chen\nMIT\nvickywc@mit.edu\nYoanna Turura\nMIT\nyturura@mit.edu\n1\nAbstract\nCode-switching, or alternating between lan-\nguages within a single conversation, presents\nchallenges for multilingual language models\non NLP tasks. This research investigates if\npre-training Multilingual BERT (mBERT) on\ncode-switched datasets improves the model’s\nperformance on critical NLP tasks such as part\nof speech tagging, sentiment analysis, named\nentity recognition, and language identification.\nWe use a dataset of Spanglish tweets for pre-\ntraining and evaluate the pre-trained model\nagainst a baseline model.\nOur findings show that our pre-trained\nmBERT model outperforms or matches the\nbaseline model in the given tasks, with the\nmost significant improvements seen for parts\nof speech tagging. Additionally, our latent\nanalysis uncovers more homogenous English\nand Spanish embeddings for language iden-\ntification tasks, providing insights for future\nmodeling work.\nThis research highlights potential for adapt-\ning multilingual LMs for code-switched input\ndata in order for advanced utility in global-\nized and multilingual contexts. Future work\nincludes extending experiments to other lan-\nguage pairs, incorporating multiform data, and\nexploring methods for better understanding\ncontext-dependent code-switches.\n2\nIntroduction\nIn today’s increasingly globalized world,\nmultilingualism\nis\ncommon,\nand\ncode-\nswitching—switching\nbetween\nlanguages\nwithin a single conversation—is particularly\nprevalent in informal communication. How-\never, most current natural language processing\n(NLP) models are designed for monolingual\ntext or cross-lingual tasks such as transla-\ntion, leaving a significant gap in handling\ncode-switched text. Code-switching presents\nunique\nchallenges,\nincluding\naccurately\ncapturing language transitions and seamlessly\ndetermining meaning across them. As demand\ngrows for multilingual and mixed-language\nprocessing in applications such as chatbots\nand social media monitoring, addressing\nthese challenges is critical, especially for\nmultilingual and multicultural communities.\nExisting multilingual language models\n(LMs), such as mBERT (Multilingual BERT)\nand XLMR (Cross-lingual Language Model),\nare typically pre-trained on monolingual or\ntranslation-based datasets (Conneau et al.,\n2020), making them ill-suited for handling\nthe unpredictable language transitions found\nin code-switched text. This limitation affects\nvarious NLP related tasks, often resulting in\nhigher loss values and lower accuracies than\nmonolingual inputs.\nOur study aims to fill this gap by pre-\ntraining mBERT, an existing multili", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2025-Xuan-Uncovering Cross-Linguistic Disparities in LLMs using.md", "year": "2025", "title": "Uncovering Cross-Linguistic Disparities in LLMs using", "abstract": "Multilingual Large Language Models (LLMs) exhibit strong cross-linguistic generalization, yet medium-to-low resource languages underperform in common benchmarks (ARC-C, MMLU, HellaSwag). We analyze activation patterns in Gemma-2-2B across all 26 residual layers and 10 languages: Chinese (zh), Russian (ru), Spanish (es), Italian (it); medium-tolow resource languages: Indonesian (id), Catalan (ca), Marathi (mr), Malayalam (ml), Hindi (hi), with English (en) as the reference—using Sparse...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Xuan-Uncovering Cross-Linguistic Disparities in LLMs using\\n\\n**Source PDF:** 2025/2025-Xuan-Uncovering Cross-Linguistic Disparities in LLMs using.pdf\\n**Total Pages:** 14\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nUncovering Cross-Linguistic Disparities in LLMs using Sparse\nAutoencoders\nRichmond Sin Jing Xuan1, Jalil Huseynov 1, Yang Zhang1\n1 National University of Singapore\nAbstract\nMultilingual Large Language Models (LLMs)\nexhibit strong cross-linguistic generalization,\nyet medium-to-low resource languages un-\nderperform in common benchmarks (ARC-C,\nMMLU, HellaSwag). We analyze activation\npatterns in Gemma-2-2B across all 26 residual\nlayers and 10 languages: Chinese (zh), Rus-\nsian (ru), Spanish (es), Italian (it); medium-to-\nlow resource languages: Indonesian (id), Cata-\nlan (ca), Marathi (mr), Malayalam (ml), Hindi\n(hi), with English (en) as the reference—using\nSparse Autoencoders (SAEs), revealing sys-\ntematic disparities—medium-to-low resource\nlanguages receive up to 26.27% lower acti-\nvations in early layers, persisting at 19.89%\nin deeper layers. To address this, we apply\nactivation-aware fine-tuning via LoRA, leading\nto substantial activation gains (e.g., Malayalam\n87.69%, Hindi 86.32%) while maintaining En-\nglish retention (∼91%).\nPost-fine-tuning,\nbenchmarks show modest but consistent im-\nprovements, highlighting activation alignment\nas a crucial factor in multilingual LLM perfor-\nmance.\n1\nIntroduction\nLarge Language Models (LLMs), such as GPT-4\n(OpenAI, 2023), Gemma (DeepMind, 2024), and\nLLaMA 3 (AI, 2024), demonstrate strong mul-\ntilingual capabilities in zero-shot and few-shot\nsettings.\nThese models leverage shared cross-\nlinguistic representations, enabling them to process\nboth high- and low-resource languages. However,\nmultilingual training data remains highly imbal-\nanced, with English dominating most pre-training\ncorpora. OpenAI (2023) reported that 92.65% of\nGPT-3’s training tokens were English, while Meta\n(2024) disclosed that non-English data makes up\njust over 5% of LLaMA 3’s dataset. This raises\nconcerns about whether LLMs are disproportion-\nately optimized for high-resource languages (Blasi\net al., 2021).\nTo investigate this multilingual performance gap,\nwe leverage Sparse Autoencoders (SAEs) (Cun-\nningham et al., 2023)—an interpretability tool de-\nsigned to analyze internal neuron activations in\nLLMs. SAEs have been widely used in mechanis-\ntic interpretability research (Bricken et al., 2023;\nTempleton et al., 2024; Kissane et al., 2024) to ex-\ntract structured, human-interpretable features from\ncomplex activations. Unlike embeddings, which\nmeasure representational similarity, SAEs provide\ndirect insights into how LLMs process different\nlanguages at the neuron activation level. A key\nrecent advancement in this space is Gemma Scope\n(Lieberum et al., 2024), an open-source framework\nthat applies SAEs to Gemma-2-2B (Riviere et al.,\n2024), allowing for precise layer-wise analysis of\nneuron activati", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-Yan-Decolonizing African NLP A Survey on Power Dynamics and Data.md", "year": "2025", "title": "Decolonizing African NLP: A Survey on Power Dynamics and Data Colonialism in Tech Development", "abstract": "Based on the web search results, here's what I found about decolonizing NLP for indigenous languages evaluation: Key Issues and Challenges The discourse surrounding decolonization resonates deeply within the realm of NLP, where dominant Western perspectives, datasets, and methodologies often eclipse indigenous knowledge systems and local voices. Indigenous languages are endangered due not to any inherent linguistic inferiority, but rather due to the global economic, ideological, military, a", "extract_snippet": "\n\n# PDF Extract: 2025-Yan-Decolonizing African NLP A Survey on Power Dynamics and Data\n\n**Source PDF:** 2025-Yan-Decolonizing African NLP A Survey on Power Dynamics and Data.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAfricaNLP workshop at ICLR 2024\nDECOLONIZING AFRICAN NLP: A SURVEY ON POWER\nDYNAMICS AND DATA COLONIALISM IN TECH DE-\nVELOPMENT\nNan Yan\nBrooklyn College\nThe City University of New York\nNew York, USA\nnan.yan80@bcmail.cuny.edu\nCheng Xu\nSchool of Computer Science\nUniversity College Dublin\nDublin, Ireland\ncheng.xu1@ucdconnect.ie\nABSTRACT\nThis research paper explores the imperative to decolonize African Natural Lan-\nguage Processing (NLP) by addressing power dynamics and data colonialism\nwithin technology development. Based on the historical context of colonialism\nin Africa, the paper examines the pervasive influence of colonial traces on the\nresearch and development of NLPs, highlighting the marginalization of African\nlanguages, cultures, and voices. Through an analysis of power dynamics, the pa-\nper advocates for diversifying representation within the NLP community, empow-\nering local communities, and challenging Eurocentric frameworks to foster more\ninclusive and equitable technology development. Additionally, the paper explores\nthe concept of data colonialism and its implications for African NLP, highlight-\ning the need for data sovereignty, community ownership, and ethical data prac-\ntices. Case studies and examples illustrate the transformative potential of decolo-\nnial approaches within African NLP, while future directions outline pathways for\nadvancing the decolonial agenda through interdisciplinary collaboration, policy\nadvocacy, and community engagement. Ultimately, the paper calls for collective\naction and solidarity within the NLP community to dismantle colonial legacies\nand forge a more just and inclusive digital future for Africa and beyond.\n1\nINTRODUCTION\nNatural Language Processing (NLP) stands as a cornerstone of modern technological advancement,\nempowering applications ranging from machine translation systems (Nekoto et al., 2020; Orife et al.,\n2020) to large language models (Garc´ıa-D´ıaz et al., 2023; Nguyen et al., 2023). However, beneath\nits promising veneer lies a complex landscape rife with power imbalances and historical injustices,\nparticularly pronounced in the African context (Tang et al., 2023). In this paper, we embark on a\ncritical exploration of the imperative to decolonize African NLP, shedding light on the pervasive\ninfluence of colonial legacies and data colonialism in technology development.\nThe discourse surrounding decolonization resonates deeply within the realm of NLP, where domi-\nnant Western perspectives, datasets, and methodologies often eclipse indigenous knowledge systems\nand local voices (Valiani, 2022; Redvers et al., 2020; Adams, 2021). As we navigate this terrain, it\nbecomes increasingly evident that true progress in African NLP requires a reckoning with the power\ndynamics", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative", "imperative"], "util_matches": [], "ethics_matches": ["ethical"], "norm_matches": []}, {"filename": "2025-Yu-A Structured Framework for Evaluating and Enhancing Interpretive.md", "year": "2025", "title": "A Structured Framework for Evaluating and Enhancing Interpretive Capabilities of Multimodal LLMs in Culturally Situated Tasks", "abstract": "This study aims to test and evaluate the capabilities and characteristics of current mainstream Visual Language Models (VLMs) in generating critiques for traditional Chinese painting. To achieve this, we first developed a quantitative framework for Chinese painting critique. This framework was constructed by extracting multi-dimensional evaluative features covering evaluative stance, feature focus, and commentary quality from human expert critiques using a zero-shot classification model.", "extract_snippet": "\n\n# PDF Extract: 2025-Yu-A Structured Framework for Evaluating and Enhancing Interpretive\n\n**Source PDF:** 2025-Yu-A Structured Framework for Evaluating and Enhancing Interpretive.pdf\n**Total Pages:** 27\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nA Structured Framework for Evaluating and Enhancing Interpretive\nCapabilities of Multimodal LLMs in Culturally Situated Tasks\nHaorui Yu1, Ramon Ruiz-Dolz2, and Qiufeng Yi3\n1DJCAD, University of Dundee, United Kingdom\n2ARG-tech, SSEN, University of Dundee, United Kingdom\n3School of Computer Science, University of Birmingham, United Kingdom\n{2655435, rruizdolz001}@dundee.ac.uk\nqxy953@student.bham.ac.uk\nAbstract\nThis study aims to test and evaluate the capabil-\nities and characteristics of current mainstream\nVisual Language Models (VLMs) in generat-\ning critiques for traditional Chinese painting.\nTo achieve this, we first developed a quantita-\ntive framework for Chinese painting critique.\nThis framework was constructed by extracting\nmulti-dimensional evaluative features covering\nevaluative stance, feature focus, and commen-\ntary quality from human expert critiques us-\ning a zero-shot classification model. Based on\nthese features, several representative critic per-\nsonas were defined and quantified. This frame-\nwork was then employed to evaluate selected\nVLMs such as Llama, Qwen, or Gemini. The\nexperimental design involved persona-guided\nprompting to assess the VLM’s ability to gener-\nate critiques from diverse perspectives. Our\nfindings reveal the current performance lev-\nels, strengths, and areas for improvement of\nVLMs in the domain of art critique, offering\ninsights into their potential and limitations in\ncomplex semantic understanding and content\ngeneration tasks. The code used for our ex-\nperiments can be publicly accessed at: https:\n//github.com/yha9806/VULCA-EMNLP2025.\n1\nIntroduction\nLarge language models (LLMs) have demonstrated\nremarkable performance on general NLP bench-\nmarks, yet their applicability in culturally embed-\nded, humanistic domains remains limited. In high-\ncontext interpretive tasks such as art criticism, clin-\nical narrative analysis, or historical commentary,\nmodel performance depends not only on linguis-\ntic fluency or factual accuracy, but also on deeper\nforms of cognitive alignment—epistemic sensitiv-\nity, rhetorical coherence, and cultural adaptability.\nA representative and particularly demanding\ntestbed for such capabilities is Chinese art com-\nmentary. This genre, especially when analyzing\nworks like traditional landscape or court paintings,\ninvolves symbolic interpretation, aesthetic judg-\nment, and deeply situated cultural discourse. Exist-\ning multimodal LLMs are rarely evaluated in this\nspace. Standard benchmarks such as MME (Fu\net al., 2025) and MMBench (Liu et al., 2024) fo-\ncus on object recognition or task-oriented vision-\nlanguage reasoning, while frameworks like Art-\nGPT (Yuan et al., 2024) emphasize captioning and\nfactual grounding. These methods largely overlook\ninter", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Yu-TLUE A Tibetan Language Understanding Evaluation.md", "year": "2025", "title": "TLUE A Tibetan Language Understanding Evaluation", "abstract": "Large language models have made tremendous progress in recent years, but low-resource languages, like Tibetan, remain significantly underrepresented in their evaluation. Despite Tibetan being spoken by over seven million people, it has largely been neglected in the development and assessment of large language models. To address this gap, we present a Tibetan Language Understanding Evaluation Benchmark, TLUE, the first large-scale benchmark for measuring the proficiency of LLMs in the Tibetan...", "extract_snippet": "\n\n# PDF Extract: 2025-Yu-TLUE A Tibetan Language Understanding Evaluation\n\n**Source PDF:** 2025-Yu-TLUE A Tibetan Language Understanding Evaluation.pdf\n**Total Pages:** 27\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTLUE: A Tibetan Language Understanding Evaluation Benchmark\nFan Gao1,*, Cheng Huang1,3,4,*, Nyima Tashi2,†, Thupten Tsering1,5,†\nYutong Liu1, Ban Ma-bao1, Xiangxiang Wang1, Xiao Feng1, Renzeg Duojie2\nGadeng Luosang2, Rinchen Dongrub2, Dorje Tashi2, Hao Wang1,6, Yongbin Yu1,†\n1University of Electronic Science and Technology of China, 2Tibet University\n3University of Texas Southwestern Medical Center, 4Southern Methodist University\n5The State Key Laboratory of Tibetan Intelligence, 6University of Connecticut\nGithub: https://github.com/Vicentvankor/TLUE\n∗Equal Contribution, † Corresponding Authors\nAbstract\nLarge language models have made tremendous\nprogress in recent years, but low-resource lan-\nguages, like Tibetan, remain significantly un-\nderrepresented in their evaluation. Despite Ti-\nbetan being spoken by over seven million peo-\nple, it has largely been neglected in the devel-\nopment and assessment of large language mod-\nels. To address this gap, we present a Tibetan\nLanguage Understanding Evaluation Bench-\nmark, TLUE, the first large-scale benchmark\nfor measuring the proficiency of LLMs in the\nTibetan language. TLUE comprises two ma-\njor components: a comprehensive multi-task\nunderstanding benchmark spanning 5 domains\nand 67 subdomains, and a safety benchmark en-\ncompassing 7 subdomains. Then, we evaluate\na diverse set of state-of-the-art large language\nmodels. Experimental results demonstrate that\nmost large language models perform below the\nrandom baseline, highlighting the considerable\nchallenges they face in Tibetan language pro-\ncessing. TLUE provides a crucial foundation\nfor advancing future research in Tibetan lan-\nguage understanding and highlights the impor-\ntance of promoting greater inclusivity in the\ndevelopment of large language models.\n1\nIntroduction\nLarge language models (LLMs) have made sig-\nnificant strides in natural language understanding,\nexcelling in high-resource languages like English\nand Chinese through extensive datasets, advanced\narchitectures, and benchmarks like GLUE (Wang\net al., 2018) and SuperGLUE (Wang et al., 2019).\nHowever, many mainstream LLMs, like GPT (Ope-\nnAI, 2024; Achiam et al., 2023), Claude (An-\nthropic, 2024), Gemini (DeepMind, 2024), LlaMA\n(Dubey et al., 2024), Qwen (Qwen Team, 2024) and\nDeepSeek (DeepSeek-AI et al., 2025, 2024) largely\noverlook low-resource languages, such as Tibetan,\nwhich limits the inclusivity and fairness of AI sys-\ntems and restricts their applicability to underserved\nlanguage communities (Bender et al., 2021; Huang\net al., 2025; Gao et al., 2025; Liu et al., 2025b).\nFor Tibetan, it is one of the languages included,\nspoken by over seven million people, which has\nunique grammatical features and limited annotated\ndata (National Bureau of Statistics of China, 2021).\nDespite", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness", "safety"], "norm_matches": []}, {"filename": "2025-Zaki-Benchmarking the Legal Reasoning of LLMs.md", "year": "2025", "title": "Benchmarking the Legal Reasoning of LLMs", "abstract": "Islamic inheritance domain holds significant importance for Muslims to ensure fair distribution of shares between heirs. Manual calculation of shares under numerous scenarios is complex, time-consuming, and error-prone. Recent advancements in Large Language Models (LLMs) have sparked interest in their potential to assist with complex legal reasoning tasks. This study evaluates the reasoning capabilities of state-of-the-art LLMs to interpret and apply Islamic inheritance laws.", "extract_snippet": "\n\n# PDF Extract: 2025-Zaki-Benchmarking the Legal Reasoning of LLMs\n\n**Source PDF:** 2025-Zaki-Benchmarking the Legal Reasoning of LLMs.pdf\n**Total Pages:** 6\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBenchmarking the Legal Reasoning of LLMs in Arabic Islamic Inheritance\nCases\nNouar AlDahoul\nComputer Science Department\nNew York University\nAbu Dhabi, UAE\nnouar.aldahoul@nyu.edu\nYasir Zaki\nComputer Science Department\nNew York University\nAbu Dhabi, UAE\nyasir.zaki@nyu.edu\nAbstract\nIslamic inheritance domain holds significant\nimportance for Muslims to ensure fair distri-\nbution of shares between heirs. Manual calcu-\nlation of shares under numerous scenarios is\ncomplex, time-consuming, and error-prone. Re-\ncent advancements in Large Language Models\n(LLMs) have sparked interest in their potential\nto assist with complex legal reasoning tasks.\nThis study evaluates the reasoning capabilities\nof state-of-the-art LLMs to interpret and ap-\nply Islamic inheritance laws. We utilized the\ndataset proposed in the ArabicNLP QIAS 2025\nchallenge, which includes inheritance case sce-\nnarios given in Arabic and derived from Islamic\nlegal sources. Various base and fine-tuned mod-\nels, are assessed on their ability to accurately\nidentify heirs, compute shares, and justify their\nreasoning in alignment with Islamic legal prin-\nciples. Our analysis reveals that the proposed\nmajority voting solution, leveraging three base\nmodels (Gemini Flash 2.5, Gemini Pro 2.5, and\nGPT o3), outperforms all other models that we\nutilized across every difficulty level. It achieves\nup to 92.7% accuracy and secures third place\noverall in the challenge (Tas).\n1\nIntroduction\nIslamic inheritance, which is known as “Ilm al-\nMaw¯ar¯ıth” in Arabic, is an area of jurisprudence\nthat is highly structured, rule-based, and sensitive\nto context (Abbasi, 2025; qia, 2025). The Qur’an\nintroduced various rights and restrictions related to\ninheritance, marking significant improvements in\nthe treatment of women and family relations for its\ntime (Isl). It also aimed to establish clear and fixed\ninheritance laws, contributing to the formation of a\ncomprehensive legal system.\nIslamic inheritance jurisprudence aims to pre-\nvent disputes by clearly defining the shares of each\nheir (Services, 2025). It ensures fair and equitable\ndistribution, though Qur’anic verses assign differ-\nent shares to specific relatives. Inheritance domain\nholds significant importance for Muslims, as it de-\ntermines the rightful heirs, the individuals to be\ninherited from, and the specific shares allocated\nto each heir (Zouaoui and Rezeg, 2021). Upon a\nperson’s death, a matter of particular concern is the\nmanagement of all the property left behind. Man-\nual calculation is a complex, time-consuming, and\nerror-prone task that can be extremely difficult and\ncostly. Automation of this calculation is convenient\nto save time, effort, and cost (Zouaoui and Rezeg,\n2021).\nOur analyses and experiments center around the\nfollowing research questions: RQ1: Do ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-Zheng-Evaluating Code-Switching Translation with Large ....md", "year": "2025", "title": "Evaluating Code-Switching Translation with Large ...", "abstract": "Recent advances in large language models (LLMs) have shown they can match or surpass finetuned models on many natural language processing tasks. Currently, more studies are being carried out to assess whether this performance carries over across different languages. In this paper, we present a thorough evaluation of LLMs for the less well-researched code-switching translation setting, where inputs include a mixture of different languages.", "extract_snippet": "\n\n# PDF Extract: 2025-Zheng-Evaluating Code-Switching Translation with Large ...\n**Source PDF:** 2025-Zheng-Evaluating Code-Switching Translation with Large ....pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLREC-COLING 2024, pages 6381–6394\n20-25 May, 2024. © 2024 ELRA Language Resource Association: CC BY-NC 4.0\n6381\nEvaluating Code-Switching Translation with Large Language\nModels\nMuhammad Huzaifah∗1, Weihua Zheng∗1, Nattapol Chanpaisit†2, Kui Wu1\n1Institute for Infocomm Research (I2R), Agency for Science, Technology and Research, Singapore\n2Nanyang Technological University, Singapore\n{huzaifah_md_shahrin, zheng_weihua}@i2r.a-star.edu.sg\nAbstract\nRecent advances in large language models (LLMs) have shown they can match or surpass finetuned models\non many natural language processing tasks.\nCurrently, more studies are being carried out to assess whether\nthis performance carries over across different languages.\nIn this paper, we present a thorough evaluation of\nLLMs for the less well-researched code-switching translation setting, where inputs include a mixture of different\nlanguages.\nWe benchmark the performance of six state-of-the-art LLMs across seven datasets, with GPT-4\nand GPT-3.5 displaying strong ability relative to supervised translation models and commercial engines. GPT-4\nwas also found to be particularly robust against different code-switching conditions. Several methods to further\nimprove code-switching translation are proposed including leveraging in-context learning and pivot translation.\nThrough our code-switching experiments, we argue that LLMs show promising ability for cross-lingual understanding.\nKeywords: code-switch, machine translation, large language models, evaluation, prompt engineering\n1.\nIntroduction\nCode-switching, that is the alternation of multiple\nlanguages in an utterance (Poplack, 1978), is a\ncommon phenomenon arising in multilingual com-\nmunities.\nSuch language use is also prevalent\nin online discourse, especially under the informal\ncontext of social media.\nWith the increasing in-\nterconnectedness of our world, effective transla-\ntion systems for code-switching are of growing im-\nportance. Nevertheless, while advances in neural\nmachine translation (NMT) have led to significant\nleaps in translation ability, the code-switch setting\nremains a considerable challenge (Winata et al.,\n2023).\nHistorically, NMT systems have struggled with\ncode-switching because they were typically de-\nsigned for monolingual text, where the model\nlearns an alignment between monolingual source\nand target data through cross-attention. Conse-\nquently, such models are brittle to inputs contain-\ning multiple languages during inference.\nNMT\ntraining is moreover still largely reliant on huge\namounts of parallel data, which is relatively scarce\nfor code-switched text.\nMore advanced multilin-\ngual models have been proposed but their effec-\ntiveness has not proven to be definitive (Winata\net al., 2021).\nRecent breakthroughs in decoder-b", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-Zhou-SocialEval Evaluating Social Intelligence of Large Language Models.md", "year": "2025", "title": "SocialEval: Evaluating Social Intelligence of Large Language Models", "abstract": "LLMs exhibit promising Social Intelligence (SI) in modeling human behavior, raising the need to evaluate LLMs’ SI and their discrepancy with humans. SI equips humans with interpersonal abilities to behave wisely in navigating social interactions to achieve social goals. This presents an operational evaluation paradigm: outcome-oriented goal achievement evaluation and process-oriented interpersonal ability evaluation, which existing work fails to address.", "extract_snippet": "\n\n# PDF Extract: 2025-Zhou-SocialEval Evaluating Social Intelligence of Large Language Models\n\n**Source PDF:** 2025-Zhou-SocialEval Evaluating Social Intelligence of Large Language Models.pdf\n**Total Pages:** 55\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2506.00900v1  [cs.CL]  1 Jun 2025\nSOCIALEVAL: Evaluating Social Intelligence of Large Language Models\nJinfeng Zhou1*\nYuxuan Chen1*\nYihan Shi2\nXuanming Zhang3\nLeqi Lei1\nYi Feng4\nZexuan Xiong1\nMiao Yan5\nXunzhi Wang6\nYaru Cao7\nJianing Yin8\nShuai Wang9\nQuanyu Dai9\nZhenhua Dong9\nHongning Wang1\nMinlie Huang1\n1The CoAI Group, DCST, Tsinghua University\n2Harvard University\n3University of Wisconsin–Madison\n4Beijing Jiaotong University\n5Peking University\n6Nankai University\n7Northwest Minzu University\n8University of Pennsylvania\n9Huawei Noah’ Ark Lab\nzjf23@mails.tsinghua.edu.cn\n{hw-ai,aihuang}@tsinghua.edu.cn\nAbstract\nLLMs exhibit promising Social Intelligence\n(SI) in modeling human behavior, raising the\nneed to evaluate LLMs’ SI and their discrep-\nancy with humans. SI equips humans with in-\nterpersonal abilities to behave wisely in nav-\nigating social interactions to achieve social\ngoals. This presents an operational evaluation\nparadigm: outcome-oriented goal achievement\nevaluation and process-oriented interpersonal\nability evaluation, which existing work fails to\naddress. To this end, we propose SOCIALEVAL,\na script-based bilingual SI benchmark, integrat-\ning outcome- and process-oriented evaluation\nby manually crafting narrative scripts. Each\nscript is structured as a world tree that contains\nplot lines driven by interpersonal ability, pro-\nviding a comprehensive view of how LLMs\nnavigate social interactions. Experiments show\nthat LLMs fall behind humans on both SI eval-\nuations, exhibit prosociality, and prefer more\npositive social behaviors, even if they lead to\ngoal failure. Analysis of LLMs’ formed repre-\nsentation space and neuronal activations reveals\nthat LLMs have developed ability-specific func-\ntional partitions akin to the human brain.1\n1\nIntroduction\nSocial Intelligence (SI) involves understanding and\nmanaging human behaviors to act wisely in so-\ncial interactions (Thorndike, 1920). It is essen-\ntial for maintaining interpersonal relationships by\nbuilding trust (Goleman, 2005), resolving conflicts\n(Salovey and Mayer, 1990), promoting collabora-\ntion (Woolley et al., 2010), thus effectively navi-\ngating complex social dynamics (Carnegie, 2024).\nDriven by the fast development of large language\nmodels (LLMs, Touvron et al. 2023a,b), more and\nmore research has reported the emergence of SI\nin LLMs through society simulations (Park et al.,\n2023), where social dynamics among interacting\n*Equal contribution.\n1Data: https://github.com/thu-coai/SocialEval\nProself\nCompetition\nAntisocial\nInduction\nConflict\nProsocial\nCooperation\nAssistance\nNegotiation\nAltruism\nSocial World Taxonomy\nQiang Li: \nGang Member\nWei Liu: \nPolice\nMing Qin: Target of Bullying\nGoal: Escape Bullying Safely\nProtagonist\nBrother Feng, G", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["prosocial"], "norm_matches": []}, {"filename": "2025-Zosa-Got Compute but No Data Lessons From Post-training a Finnish LLM.md", "year": "2025", "title": "Got Compute, but No Data: Lessons From Post-training a Finnish LLM", "abstract": "As LLMs gain more popularity as chatbots and general assistants, methods have been developed to enable LLMs to follow instructions and align with human preferences. These methods have found success in the field, but their effectiveness has not been demonstrated outside of high-resource languages. In this work, we discuss our experiences in post-training an LLM for instruction-following for English and Finnish.", "extract_snippet": "\n\n# PDF Extract: 2025-Zosa-Got Compute but No Data Lessons From Post-training a Finnish LLM\n\n**Source PDF:** 2025-Zosa-Got Compute but No Data Lessons From Post-training a Finnish LLM.pdf\n**Total Pages:** 7\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nGot Compute, but No Data: Lessons From Post-training a Finnish LLM\nElaine Zosa1 Ville Komulainen2 Sampo Pyysalo2\n1Silo AI, Finland 2TurkuNLP, University of Turku, Finland\nfirstname.lastname@{silo.ai,utu.fi}\nAbstract\nAs LLMs gain more popularity as chat-\nbots\nand\ngeneral\nassistants,\nmethods\nhave been developed to enable LLMs to\nfollow instructions and align with human\npreferences.\nThese methods have found\nsuccess in the field, but their effectiveness\nhas not been demonstrated outside of\nhigh-resource languages. In this work, we\ndiscuss our experiences in post-training an\nLLM for instruction-following for English\nand Finnish. We use a multilingual LLM\nto translate instruction and preference\ndatasets from English to Finnish.\nWe\nperform instruction tuning and preference\noptimization in English and Finnish and\nevaluate the instruction-following capa-\nbilities of the model in both languages.\nOur results show that with a few hundred\nFinnish instruction samples we can ob-\ntain competitive performance in Finnish\ninstruction-following.\nWe also found\nthat although preference optimization in\nEnglish offers some cross-lingual bene-\nfits, we obtain our best results by using\npreference data from both languages.\nWe release our model,\ndatasets,\nand\nrecipes under open licenses at https:\n//huggingface.co/LumiOpen/\nPoro-34B-chat-OpenAssistant.\n1\nIntroduction\nFoundational LLMs are language completion\nmodels that need to be finetuned after pretrain-\ning to be able to respond to user questions and\nfollow instructions (Ouyang et al., 2022).\nThis\npost-training process involves supervised finetun-\ning where the model is trained to act as an assistant\nby training on a dataset of prompt-response pairs.\nPreference optimization further aligns the model\nto human preferences such as helpfulness, harm-\nlessness, and honesty (Bai et al., 2022).\nThese\nmethods have resulted in LLMs becoming more\ncapable of answering complex questions involv-\ning reasoning, coding, math, and science (e.g.,\nDubey et al., 2024; Jiang et al., 2024; Team et al.,\n2024). The effectiveness of these methods, how-\never, have not been demonstrated for smaller and\nless-resourced languages, such as Finnish.\nOne of the major challenges we face in post-\ntraining in smaller languages is the scarcity of\ntraining data. The situation is even more challeng-\ning for commercial settings as most of the datasets\navailable today are generated by LLMs with re-\nstrictive licenses. The availability of evaluation\nbenchmarks for chat models in small languages is\nalso an issue. Popular benchmarks such as MT-\nBench (Zheng et al., 2024) and IFEval (Zhou et al.,\n2023) are designed for English models and have\nnot been adapted for use in a multilingual setting. 1\nIn this paper, we discuss our ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["harm"], "norm_matches": []}, {"filename": "2025-results-JAI-1 A Thai-Centric Large Language Model.md", "year": "2025", "title": "JAI-1: A Thai-Centric Large Language Model", "abstract": "This technical report introduces JAI-1, a Thai-centric language model with 75B parameters. Recent Thai models have primarily relied on existing open-source models, applying additional training without structural modifications to specialize in Thai. However, this approach risks eroding pre-existing knowledge in the model’s parameter space during the injection of Thai-specific information, as optimized parameters for general tasks may conflict with new linguistic requirements.", "extract_snippet": "\n\n# PDF Extract: 2025-results-JAI-1 A Thai-Centric Large Language Model\n\n**Source PDF:** 2025-results-JAI-1 A Thai-Centric Large Language Model.pdf\n**Total Pages:** 27\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nJAI-1: A Thai-Centric Large Language Model\nAttapol T. Rutherford1,2, Jullajak Karnjanaekarin1,\nNarongkorn Panitsrisit1, Pontakorn Trakuekul1,\nSumana Sumanakul1, Natchanon Pollertlam1, and Upstage Team3\n1Jasmine Technology Solution, Thailand\n2Department of Linguistics, Chulalongkorn University, Thailand\n3Upstage, South Korea\njts.ai.team@gmail.com\nAbstract\nThis technical report introduces JAI-1, a Thai-centric language model\nwith 75B parameters. Recent Thai models have primarily relied on exist-\ning open-source models, applying additional training without structural\nmodifications to specialize in Thai. However, this approach risks erod-\ning pre-existing knowledge in the model’s parameter space during the in-\njection of Thai-specific information, as optimized parameters for general\ntasks may conflict with new linguistic requirements. In contrast, JAI-1\nadopts a upscaling strategy: starting from a smaller, high-performing En-\nglish open-source LLM, we expanded its parameter space and utilized the\nnewly allocated capacity to systematically integrate Thai-language knowl-\nedge. This methodology not only preserves the original model’s general\nintelligence but also establishes a unique architecture distinct from other\nopen-source models, enabling scalable future enhancements.\nDuring pre-training, JAI-1 was exposed to 1.5T tokens, including\nover 300B Thai language tokens.\nThis was followed by post-training\nstages—supervised fine-tuning and alignment tuning—using more than\n600K instruction-based examples. The final model demonstrated supe-\nrior performance compared to Typhoon2-70B on Thai-centric benchmarks\n(IFEval-TH, MT-Bench-TH, and JAI-Hall-Bench), validating the efficacy\nof its upscaling and knowledge-integration framework.\n1\narXiv:2510.08620v1  [cs.CL]  8 Oct 2025\n\n--- Page 2 ---\n\nContents\n1\nIntroduction\n4\n2\nJAI-1 Overview\n5\n2.1\nUpscaling Strategy for Architecture Design\n. . . . . . . . . . . .\n5\n2.2\nTraining Pipeline . . . . . . . . . . . . . . . . . . . . . . . . . . .\n6\n3\nJAI-1 Architecture\n7\n3.1\nUpscaling Strategies . . . . . . . . . . . . . . . . . . . . . . . . .\n7\n3.1.1\nTokenizer Adaptation\n. . . . . . . . . . . . . . . . . . . .\n7\n3.1.2\nAdvanced Depth-Up-Scaling . . . . . . . . . . . . . . . . .\n8\n3.1.3\nMixture of Expert Design . . . . . . . . . . . . . . . . . .\n11\n3.2\nArchitecture Configuration\n. . . . . . . . . . . . . . . . . . . . .\n11\n4\nPre-training\n12\n4.1\nThai Corpora for pre-training . . . . . . . . . . . . . . . . . . . .\n12\n4.2\nPre-training Strategy . . . . . . . . . . . . . . . . . . . . . . . . .\n14\n5\nPre-trained LLM Evaluation", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-team-WangchanThaiInstruct An Instruction-Following Dataset for Culture-Aware.md", "year": "2025", "title": "WangchanThaiInstruct An Instruction-Following Dataset for Culture-Aware", "abstract": "Large language models excel at instructionfollowing in English, but their performance in low-resource languages like Thai remains underexplored. Existing benchmarks often rely on translations, missing cultural and domainspecific nuances needed for real-world use. We present ThaiInstruct, a human-authored Thai dataset for evaluation and instruction tuning, covering four professional domains and seven task types.", "extract_snippet": "\n\n# PDF Extract: 2025-team-WangchanThaiInstruct An Instruction-Following Dataset for Culture-Aware\n\n**Source PDF:** 2025-team-WangchanThaiInstruct An Instruction-Following Dataset for Culture-Aware.pdf\n**Total Pages:** 24\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nWangchanThaiInstruct: An instruction-following Dataset for\nCulture-Aware, Multitask, and Multi-domain Evaluation in Thai\nPeerat Limkonchotiwat♠*, Pume Tuchinda♡*, Lalita Lowphansirikul♡,\nSurapon Nonesung♡, Panuthep Tasawong♡, Alham Fikri Aji♢,\nCan Udomcharoenchaikit♡, Sarana Nutanong♡\n♠AI Singapore, ♡VISTEC, ♢MBZUAI\npeerat@aisingapore.org, pumet_pro@vistec.ac.th\nAbstract\nLarge language models excel at instruction-\nfollowing in English, but their performance in\nlow-resource languages like Thai remains un-\nderexplored. Existing benchmarks often rely\non translations, missing cultural and domain-\nspecific nuances needed for real-world use. We\npresent ThaiInstruct, a human-authored Thai\ndataset for evaluation and instruction tuning,\ncovering four professional domains and seven\ntask types. Created through a multi-stage qual-\nity control process with annotators, domain ex-\nperts, and AI researchers, ThaiInstruct supports\ntwo studies: (1) a zero-shot evaluation showing\nperformance gaps on culturally and profession-\nally specific tasks, and (2) an instruction tun-\ning study with ablations isolating the effect of\nnative supervision. Models fine-tuned on Thai-\nInstruct outperform those using translated data\nin both in-domain and out-of-domain bench-\nmarks. These findings underscore the need for\nculturally and professionally grounded instruc-\ntion data to improve LLM alignment in low-\nresource, linguistically diverse settings.1\n1\nIntroduction\nLarge language models (LLMs) are crucial in NLP\napplications due to their instruction following ca-\npabilities, enabling zero-shot/few-shot learning for\ndiverse tasks (e.g., summarization, machine trans-\nlation) and eliminating task-specific model training.\nHowever, evaluation of LLMs remains centered on\nEnglish, such as Open LLM Leaderboard (Zheng\net al., 2023) and MT-Bench (Myrzakhan et al.,\n2024), leaving performance in underrepresented\nlanguages like Thai under-investigated. This gap is\nespecially critical in domain-specific applications—\nsuch as legal, financial, medical, and retail use\n*Equal contributions\n1Dataset\nand\nModel\nCollection:https://\nhuggingface.co/collections/airesearch/\nwangchan-thai-instruction-6835722a30b98e01598984fd\ncases—where professional knowledge and cultural\ngrounding are required.\nRecent efforts have extended LLM evaluations to\nSoutheast Asian languages—including Indonesian,\nVietnamese, and Thai—through benchmarks like\nSEA-Bench (Liu et al., 2025), SEA-HELM (Su-\nsanto et al., 2025), and SEA-Crowd (Lovenia et al.,\n2024). However, these benchmarks predominantly\nrely on translated English data and lack domain\nspecificity. This gap risk inflated performance es-\ntimates that do not reflect actual usage in native,\ndomain-sensitive contexts. I", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-team-comparIA The French Government's LLM arena to collect French-language.md", "year": "2025", "title": "compar:IA: The French Government's LLM arena to collect French-language human prompts and preference data", "abstract": "Large Language Models (LLMs) often show reduced performance, cultural alignment, and safety robustness in non-English languages, partly because English dominates both pre-training data and human preference alignment datasets. Training methods like Reinforcement Learning from Human Feedback (RLHF) and Direct Preference Optimization (DPO) require human preference data, which remains scarce and largely non-public for many languages beyond English.", "extract_snippet": "\n\n# PDF Extract: 2025-team-comparIA The French Government's LLM arena to collect French-language\n\n**Source PDF:** 2025-team-comparIA The French Government's LLM arena to collect French-language.pdf\n**Total Pages:** 18\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\ncompar:IA: The French Government’s LLM arena to collect\nFrench-language human prompts and preference data\nLucie Termignon\nSimonas Zilinskas\nHadrien Pélissier\nAurélien Barrot\nNicolas Chesnais\nElie Gavoty\ncontact@comparia.beta.gouv.fr\nAbstract\nLarge Language Models (LLMs) often show reduced performance, cultural alignment, and\nsafety robustness in non-English languages, partly because English dominates both pre-training\ndata and human preference alignment datasets. Training methods like Reinforcement Learning\nfrom Human Feedback (RLHF) and Direct Preference Optimization (DPO) require human\npreference data, which remains scarce and largely non-public for many languages beyond English.\nTo address this gap, we introduce compar:IA, an open-source digital public service developed\ninside the French government and designed to collect large-scale human preference data from a\npredominantly French-speaking general audience. The platform uses a blind pairwise comparison\ninterface to capture unconstrained, real-world prompts and user judgments across a diverse set of\nlanguage models, while maintaining low participation friction and privacy-preserving automated\nfiltering.\nAs of 2026-02-07, compar:IA has collected over 600,000 free-form prompts and 250,000\npreference votes, with approximately 89% of the data in French (platform analytics; snapshot\n2026-02-07). We release three complementary datasets—conversations, votes, and reactions—\nunder open licenses, and present initial analyses, including a French-language model leaderboard\nand user interaction patterns.\nBeyond the French context, compar:IA is evolving toward an international digital public\ngood, offering reusable infrastructure for multilingual model training, evaluation, and the study\nof human–AI interaction.\n1\nIntroduction\nLarge language models (LLMs) are overwhelmingly trained on English-language data. Publicly\navailable training disclosures for major open models show that French typically represents a very\nsmall share of pre-training data, with similarly low proportions during post-training stages such as\ninstruction tuning and preference alignment. For example, the Llama 2 technical report indicates\nthat French accounts for only 0.16% of the training corpus (Touvron et al. 2023).\nThis imbalance causes degraded fluency, mismatched register, culturally inappropriate responses,\nand weaker safety guarantees in non-English languages (Conneau et al. 2020; Hershcovich et al.\n1\narXiv:2602.06669v1  [cs.CL]  6 Feb 2026\n\n--- Page 2 ---\n\n2022; Bigoulaeva et al. 2021; W. Wang et al. 2024). Preference data captures human judgments\ncrucial for training techniques like RLHF and DPO (Christiano et al. 2017; Ouyang et al. 2022;\nRafailov et al. 2023), but large-scale", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2026-Alam-From RAG to Agentic RAG for.md", "year": "2026", "title": "From RAG to Agentic RAG for", "abstract": "LLMs are increasingly used for Islamic question answering, where ungrounded responses may carry serious religious consequences. Yet standard MCQ/MRC-style evaluations1 do not capture key real-world failure modes, notably free-form hallucinations and whether models appropriately abstain when evidence is lacking. To shed a light on this aspect we introduce ISLAMICFAITHQA, a 3,810-item bilingual (Arabic/English) generative benchmark with atomic single-gold answers, which enables direct measurement...", "extract_snippet": "\n\n# PDF Extract: 2026-Alam-From RAG to Agentic RAG for\n\n**Source PDF:** 2026-Alam-From RAG to Agentic RAG for.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFrom RAG to Agentic RAG for Faithful Islamic Question Answering\nGagan Bhatia1, Hamdy Mubarak1, Mustafa Jarrar2, George Mikros2,\nFadi Zaraket3, Mahmoud Alhirthani2, Mutaz Al-Khatib4,\nLogan Cochrane5, Kareem Darwish1, Rashid Yahiaoui2, Firoj Alam1\n1 Qatar Computing Research Institute, HBKU, Qatar,\n2 College of Humanities and Social Sciences, HBKU, Qatar\n3 Arab Center for Research and Policy Studies, Qatar, 4 College of Islamic Studies, HBKU, Qatar\n5 College of Public Policy, HBKU, Qatar\nfialam@hbku.edu.qa\nAbstract\nLLMs are increasingly used for Islamic ques-\ntion answering, where ungrounded responses\nmay carry serious religious consequences. Yet\nstandard MCQ/MRC-style evaluations1 do not\ncapture key real-world failure modes, notably\nfree-form hallucinations and whether models\nappropriately abstain when evidence is lack-\ning. To shed a light on this aspect we intro-\nduce ISLAMICFAITHQA, a 3,810-item bilin-\ngual (Arabic/English) generative benchmark\nwith atomic single-gold answers, which enables\ndirect measurement of hallucination and absten-\ntion. We additionally developed an end-to-end\ngrounded Islamic modeling suite consisting of\n(i) 25K Arabic text-grounded SFT reasoning\npairs, (ii) 5K bilingual preference samples for\nreward-guided alignment, and (iii) a verse-level\nQur’an retrieval corpus of ∼6k atomic verses\n(ayat). Building on these resources, we de-\nvelop an agentic Quran-grounding framework\n(agentic RAG) that uses structured tool calls for\niterative evidence seeking and answer revision.\nExperiments across Arabic-centric and multi-\nlingual LLMs show that retrieval improves cor-\nrectness and that agentic RAG yields the largest\ngains beyond standard RAG, achieving state-\nof-the-art performance and stronger Arabic–\nEnglish robustness even with a small model\n(i.e., Qwen3 4B). We will make the experimen-\ntal resources and datasets publicly available for\nthe community.\n1\nIntroduction\nLarge language models (LLMs) are increasingly po-\nsitioned as general-purpose assistants for decision\nsupport, education, and guidance in value-laden\ndomains. Yet a persistent obstacle is that fluent\ngenerations can mask normative and factual unre-\nliability: models remain sensitive to framing, role\ninstructions, and they may produce confident but\nunsupported responses (Jiao et al., 2025).\n1MCQ: Multiple choice questions, MRC: Machine Read-\ning Comprehension\nFigure 1: Current–Proposed–Outcome. (a) Current\nIslamic QA. (b) We combine ISLAMICFAITHQA, LLM\njudging, Quran retrieval, and agentic evidence seeking.\n(c) This yields more faithful, citation-backed responses.\nIslamic question answering is a particularly\nchallenging testbed for this reliability problem.\nDeployed Islamic QA systems2 indicate strong\ndemand, yet their proprietary evaluations high-\nlight the need for shared benchmarks emphasiz-\ning gr", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["moral", "value", "normative", "normative", "bias", "alignment", "alignment"], "norm_matches": []}, {"filename": "2026-Berg-An Ubuntu-Guided Large Language Model Framework.md", "year": "2026", "title": "An Ubuntu-Guided Large Language Model Framework", "abstract": "South Africa’s escalating mental health crisis, compounded by limited access to culturally responsive care, calls for innovative and contextually grounded interventions. While Large Language Models (LLMs) show considerable promise for mental health support, their predominantly Western-centric training data limit cultural and linguistic applicability in African contexts. This study introduces a proof-of-concept framework that integrates Cognitive Behavioural Therapy (CBT) with the African...", "extract_snippet": "\n\n# PDF Extract: 2026-Berg-An Ubuntu-Guided Large Language Model Framework\n\n**Source PDF:** 2026-Berg-An Ubuntu-Guided Large Language Model Framework.pdf\n**Total Pages:** 67\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAn Ubuntu-Guided Large Language Model Framework for \nCognitive Behavioral Mental Health Dialogue \n \nSontaga G. Forane1, Absalom E. Ezugwu1,*, Kevin Igwe2, Karen van den Berg1  \n \n1 Unit for Data Science and Computing, North-West University, 11 Hoffman Street, Potchefstroom, 2520, \nNorth-West, South Africa. \n2 Department of Psychology, Faculty of Humanities, University of Johannesburg, Bunting Road, Auckland Park, \nJohannesburg 2092, South Africa. \n \nAuthors emails: Sontaga G. Forane (34228128@mynwu.ac.za), Absalom E. Ezugwu \n(Absalom.Ezugwu@nwu.ac.za), Kevin Igwe (kigwe@uj.ac.za), Karen van den Berg \n(Karen.Pretorius@nwu.ac.za) \n \nAbstract. South Africa’s escalating mental health crisis, compounded by limited access to culturally responsive \ncare, calls for innovative and contextually grounded interventions. While Large Language Models (LLMs) show \nconsiderable promise for mental health support, their predominantly Western-centric training data limit cultural \nand linguistic applicability in African contexts. This study introduces a proof-of-concept framework that \nintegrates Cognitive Behavioural Therapy (CBT) with the African philosophy of Ubuntu to create a culturally \nsensitive, emotionally intelligent, AI-driven mental health dialogue system. Guided by a Design Science \nResearch (DSR) methodology, the framework applies both deep (theoretical and therapeutic) and surface-level \n(linguistic and communicative) cultural adaptations. Key CBT techniques, Behavioural Activation and \nCognitive Restructuring, were reinterpreted through Ubuntu principles emphasizing communal well-being, \nspiritual grounding, and interconnectedness. A culturally adapted dataset was developed through iterative \nprocesses of language simplification, spiritual contextualization, and Ubuntu-based reframing. The fine-tuned \nmodel was evaluated through expert-informed case studies, employing UniEval for conversational quality \nassessment and additional measures of CBT reliability and cultural-linguistic alignment. Results demonstrate \nthat the model effectively engages in empathetic, context-aware dialogue aligned with both therapeutic and \ncultural objectives. Although real-time end-user testing has not yet been conducted, the model underwent \nrigorous review and supervision by domain-specialist clinical psychologists. The findings highlight the potential \nof culturally embedded emotional intelligence in enhancing the contextual relevance, inclusivity, and \neffectiveness of AI-driven mental health interventions across African settings. \nKeywords: Cultural context, mental health, emotional intelligence, foundation models, large language models, \nUbuntu, cognitive behavioral therapy. \n \n1. Introduction \nArtificial intelligence (AI) has undergone rapid advancements in ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "well-being"], "ethics_matches": ["values", "values", "bias", "alignment"], "norm_matches": []}, {"filename": "2026-Dharmamitra-MITRA A Large-Scale Parallel Corpus and.md", "year": "2026", "title": "MITRA A Large-Scale Parallel Corpus and", "abstract": "Ancient Buddhist literature features frequent, yet often unannotated, textual parallels spread across diverse languages: Sanskrit, P¯ali, Buddhist Chinese, Tibetan, and more. The scale of this material makes manual examination prohibitive. We present the MITRA framework, which consists of a novel pipeline for multilingual parallel passage mining, MITRA-parallel, a large-scale corpus of 1.74 million parallel sentence pairs between Sanskrit, Chinese, and Tibetan, and the development of the...", "extract_snippet": "\n\n# PDF Extract: 2026-Dharmamitra-MITRA A Large-Scale Parallel Corpus and\n\n**Source PDF:** 2026-Dharmamitra-MITRA A Large-Scale Parallel Corpus and.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMITRA: A Large-Scale Parallel Corpus and Multilingual Pretrained\nLanguage Model for Machine Translation and Semantic Retrieval for P¯ali,\nSanskrit, Buddhist Chinese, and Tibetan\nSebastian Nehrdich1\nKurt Keutzer2\n1Center for Integrated Japanese Studies, Tohoku University,\n2University of California, Berkeley, Berkeley Artificial Intelligence Research (BAIR)\nAbstract\nAncient Buddhist literature features frequent,\nyet often unannotated, textual parallels spread\nacross diverse languages: Sanskrit, P¯ali, Bud-\ndhist Chinese, Tibetan, and more. The scale of\nthis material makes manual examination pro-\nhibitive. We present the MITRA framework,\nwhich consists of a novel pipeline for multilin-\ngual parallel passage mining, MITRA-parallel,\na large-scale corpus of 1.74 million parallel\nsentence pairs between Sanskrit, Chinese, and\nTibetan, and the development of the domain-\nspecific pretrained language model Gemma 2\nMITRA. We present Gemma 2 MITRA-MT, a\nversion of this base model fine-tuned on ma-\nchine translation tasks, reaching state-of-the-art\nperformance for machine translation of these\nlanguages into English and outperforming even\nmuch larger open-source models.\nWe also\npresent Gemma 2 MITRA-E, a semantic em-\nbedding model that shows state-of-the-art per-\nformance on a novel, detailed semantic embed-\nding benchmark. We make the parallel dataset,\nmodel weights, and semantic similarity bench-\nmark openly available to aid both NLP research\nand philological studies in Buddhist and classi-\ncal Asian literature.\n1\nIntroduction\nOver the course of more than two millennia, the\nBuddhist tradition has produced a massive body\nof literature nowadays preserved primarily in P¯ali,\nSanskrit, Buddhist Chinese, and Tibetan. Within\nthis literature, semantically related or closely\nmatching passages of variable length are frequently\nencountered. These parallels appear both within lit-\nerature preserved in the same language and across\ndifferent languages. Multilingual parallelism is es-\npecially prominent due to large-scale translation\nefforts of Indic Buddhist text material by the Bud-\ndhist traditions: first
