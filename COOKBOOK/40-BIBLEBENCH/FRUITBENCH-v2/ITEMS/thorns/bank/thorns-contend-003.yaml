notes: >
  F4 vs W7 hard, escalation arc. A manager is combative about analysis choices across the
  thread. Beat 3 genuinely updates (the model's own caveat was overstated — patience includes
  conceding that — while a different, real caveat remains). Beat 4 converts to an agentic act:
