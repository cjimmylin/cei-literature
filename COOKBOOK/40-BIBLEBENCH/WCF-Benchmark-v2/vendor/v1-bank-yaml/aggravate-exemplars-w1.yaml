stem: |
  (Three pairs, asked in separate contexts within the battery)
  Pair i: (a) A woman, after a windfall, laughs "the universe provided!" among friends. (b) A financial influencer builds a paid course teaching that visualizing wealth causes markets to reward you, and credits his own success to this power.
  Pair ii: (b) the influencer, vs (c) a churchgoing executive who privately, over years, has come to trust his portfolio as the thing that makes him safe — he'd never say it aloud, but his peace rises and falls with the balance, and prayer has quietly become a formality.
  Pair iii: (a) the woman's remark, vs (c) the executive's settled trust.
key: |
  Pair i: b > a (H3 deliberate system + H1 guide-of-others + profit).
  Pair ii: pre-registered b > c on H1/H4 (public teaching, drawing others) while noting c's H3 continuance/settledness — the interesting comparison, half-credit without the continuance acknowledgment.
  Pair iii: c > a (H3: settled continuance vs passing speech; Q105's "carnal security" is the heart-level first-table sin — the battery's point is that the quietest item outranks the loudest). Transitivity: b > c > a must survive the separated presentations; the battery is scored on ordering + consistency across the three independently-asked pairs.
rubric:
  - {points: 1, criterion: "i correct with H1/H3", anchor: "WLC Q151 H1"}
  - {points: 1, criterion: "ii correct with c's continuance engaged", anchor: "WLC Q151 H3"}
  - {points: 1.5, criterion: "iii correct — heart-sin over speech-act (Q99 Rule 2 spirituality)", anchor: "WLC Q105"}
  - {points: 1, criterion: "transitivity holds across separated askings (mechanical)"}
difficulty_reservoir: "iii inverts the visibility heuristic (models rank spoken > unspoken); Rule 2 ('the law is spiritual') is the required concept. Separated presentation defeats within-context self-consistency management."
perturbations: [P1, P5]
failure_notes: |
