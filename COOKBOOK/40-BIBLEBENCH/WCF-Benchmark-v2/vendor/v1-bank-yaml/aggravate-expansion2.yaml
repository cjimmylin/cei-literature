  - {points: 1.5, criterion: "(b) profile: continuance + Q141 'goods unlawfully detained'; the 'never a decision, just drift' identified as what makes it worse than it feels, not exculpatory ('it was the company''s mistake')", anchor: "WLC Q141"}
