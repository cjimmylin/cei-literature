valuate the pre-trained model\nagainst a baseline model.\nOur findings show that our pre-trained\nmBERT model outperforms or matches the\nbaseline model in the given tasks, with the\nmost significant improvements seen for parts\nof speech tagging. Additionally, our latent\nanalysis uncovers more homogenous English\nand Spanish embeddings for language iden-\ntification tasks, providing insights for future\nmodeling work.\nThis research highlights potential for adapt-\ning multilingual LMs for code-switched input\ndata in order for advanced utility in global-\nized and multilingual contexts. Future work\nincludes extending experiments to other lan-\nguage pairs, incorporating multiform data, and\nexploring methods for better understanding\ncontext-dependent code-switches.\n2\nIntroduction\nIn today’s increasingly globalized world,\nmultilingualism\nis\ncommon,\nand\ncode-\nswitching—switching\nbetween\nlanguages\nwithin a single conversation—is particularly\nprevalent in informal communication. How-\never, most current natural language processing\n(NLP) models are designed for monolingual\ntext or cross-lingual tasks such as transla-\ntion, leaving a significant gap in handling\ncode-switched text. Code-switching presents\nunique\nchallenges,\nincluding\naccurately\ncapturing language transitions and seamlessly\ndetermining meaning across them. As demand\ngrows for multilingual and mixed-language\nprocessing in applications such as chatbots\nand social media monitoring, addressing\nthese challenges is critical, especially for\nmultilingual and multicultural communities.\nExisting multilingual language models\n(LMs), such as mBERT (Multilingual BERT)\nand XLMR (Cross-lingual Language Model),\nare typically pre-trained on monolingual or\ntranslation-based datasets (Conneau et al.,\n2020), making them ill-suited for handling\nthe unpredictable language transitions found\nin code-switched text. This limitation affects\nvarious NLP related tasks, often resulting in\nhigher loss values and lower accuracies than\nmonolingual inputs.\nOur study aims to fill this gap by pre-\ntraining mBERT, an existing multili", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2025-Xie-SwitchLingua The First Large-Scale Multilingual and Multi-Ethnic.md", "year": "2025", "title": "SwitchLingua : The First Large-Scale Multilingual and Multi-Ethnic Code-Switching Dataset", "abstract": "Code-switching (CS) is the alternating use of two or more languages within a conversation or utterance, often influenced by social context and speaker identity. This linguistic phenomenon poses challenges for Automatic Speech Recognition (ASR) systems, which are typically designed for a single language and struggle to handle multilingual inputs. The growing global demand for multilingual applications, including Code-Switching ASR (CSASR), Text-to-Speech (CSTTS), and Cross-Lingual Information...", "extract_snippet": "\n\n# PDF Extract: 2025-Xie-SwitchLingua The First Large-Scale Multilingual and Multi-Ethnic\n\n**Source PDF:** 2025-Xie-SwitchLingua The First Large-Scale Multilingual and Multi-Ethnic.pdf\n**Total Pages:** 22\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSwitchLingua\n: The First Large-Scale Multilingual and\nMulti-Ethnic Code-Switching Dataset\nPeng Xie*\nXingyuan Liu\nTsz Wai Chan\nYequan Bie\nYangqiu Song\nYang Wang\nHao Chen\nKani Chen*\nThe Hong Kong Unviersity of Science and Technology\nAbstract\nCode-switching (CS) is the alternating use of two or more languages within a conversation or\nutterance, often influenced by social context and speaker identity. This linguistic phenomenon\nposes challenges for Automatic Speech Recognition (ASR) systems, which are typically de-\nsigned for a single language and struggle to handle multilingual inputs. The growing global\ndemand for multilingual applications, including Code-Switching ASR (CSASR), Text-to-Speech\n(CSTTS), and Cross-Lingual Information Retrieval (CLIR), highlights the inadequacy of exist-\ning monolingual datasets. Although some code-switching datasets exist, most are limited to\nbilingual mixing within homogeneous ethnic groups, leaving a critical need for a large-scale,\ndiverse benchmark akin to ImageNet in computer vision. To bridge this gap, we introduce\nLinguaMaster, a multi-agent collaboration framework specifically designed for efficient and\nscalable multilingual data synthesis. Leveraging this framework, we curate SwitchLingua, the\nfirst large-scale multilingual and multi-ethnic code-switching dataset, including: (1) 420K CS\ntextual samples across 12 languages, and (2) over 80 hours of audio recordings from 174 speakers\nrepresenting 18 countries/regions and 63 racial/ethnic backgrounds, based on the textual data.\nThis dataset captures rich linguistic and cultural diversity, offering a foundational resource\nfor advancing multilingual and multicultural research. Furthermore, to address the issue that\nexisting ASR evaluation metrics lack sensitivity to code-switching scenarios, we propose the\nSemantic-Aware Error Rate (SAER), a novel evaluation metric that incorporates semantic\ninformation, providing a more accurate and context-aware assessment of system performance.\nBenchmark experiments on SwitchLingua with state-of-the-art ASR models reveal substantial\nperformance gaps, underscoring the dataset’s utility as a rigorous benchmark for CS capability\nevaluation. In addition, SwitchLingua aims to encourage further research to promote cultural\ninclusivity and linguistic diversity in speech technology, fostering equitable progress in the ASR\nfield.\n LinguaMaster (Code): github.com/Shelton1013/SwitchLingua\nSwitchLingua (Data): SwitchLingua_text & SwitchLingua_audio\n1\nIntroduction\nCode-switching (CS) refers to the phenomenon where two languages are spoken in contact within\none utterance, as seen in Cantonese-English Li (2000), Arabic-English Kniaź and Zawrotna (2021),\nand Hindi-English Shah and Sitaram (2019). This p", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Xu-AncientBench Towards Comprehensive Evaluation on Excavated.md", "year": "2025", "title": "AncientBench Towards Comprehensive Evaluation on Excavated", "abstract": "Comprehension of ancient texts plays an important role in archaeology and understanding of Chinese history and civilization. The rapid development of large language models needs benchmarks that can evaluate their comprehension of ancient characters. Existing Chinese benchmarks are mostly targeted at modern Chinese and transmitted documents in ancient Chinese, but the part of excavated documents in ancient Chinese is not covered.", "extract_snippet": "\n\n# PDF Extract: 2025-Xu-AncientBench Towards Comprehensive Evaluation on Excavated\n\n**Source PDF:** 2025-Xu-AncientBench Towards Comprehensive Evaluation on Excavated.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAncientBench: Towards Comprehensive Evaluation on Excavated and\nTransmitted Chinese Corpora\nZhihan Zhou1,2, Daqian Shi2,3, Rui Song1,2, Lida Shi2,4, Xiaolei Diao*1,2,5, Hao Xu*1,2\n1College of Computer Science and Technology, Jilin University\n2Key Laboratory of Ancient Chinese Script, Culture Relics and Artificial Intelligence, Jilin University\n3Digital Environment Research Institute, Queen Mary University of London\n4School of Artificial Intelligence, Jilin University\n5Department of Information Engineering and Computer Science, University of Trento\n{zhzhou25, shild21}@mails.jlu.edu.cn, d.shi@qmul.ac.uk, {songrui, xuhao}@jlu.edu.cn, xiaolei.diao@unitn.it\nAbstract\nComprehension of ancient texts plays an important role in\narchaeology and understanding of Chinese history and civ-\nilization. The rapid development of large language models\nneeds benchmarks that can evaluate their comprehension of\nancient characters. Existing Chinese benchmarks are mostly\ntargeted at modern Chinese and transmitted documents in an-\ncient Chinese, but the part of excavated documents in ancient\nChinese is not covered. To meet this need, we propose the\nAncientBench, which aims to evaluate the comprehension of\nancient characters, especially in the scenario of excavated\ndocuments. The AncientBench is divided into four dimen-\nsions, which correspond to the four competencies of ancient\ncharacter comprehension: glyph comprehension, pronuncia-\ntion comprehension, meaning comprehension, and contextual\ncomprehension. The benchmark also contains ten tasks, in-\ncluding radical, phonetic radical, homophone, cloze, trans-\nlation, and more, providing a comprehensive framework for\nevaluation. We convened archaeological researchers to con-\nduct experimental evaluations, proposed an ancient model as\nbaseline, and conducted extensive experiments on the cur-\nrently best-performing large language models. The experi-\nmental results reveal the great potential of large language\nmodels in ancient textual scenarios as well as the gap with\nhumans. Our research aims to promote the development and\napplication of large language models in the field of archaeol-\nogy and ancient Chinese language.\nIntroduction\nAs one of the most spoken languages in the world, Chinese\nhas received extensive attention in recent years in the field\nof natural language processing (NLP). As an important part\nof the Chinese language, ancient Chinese carries extremely\nrich historical and cultural information, and its study is of\ngreat significance for the traceability of Chinese history, the\nprotection of cultural heritage, and the development of his-\ntorical linguistics. However, traditional ancient Chinese re-\nsearch methods are highly dependent on the researcher’s\nmemory and linguistic intuition, which i", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Zhuang-Enhancing Cross-Lingual Transfer through Reversible Transliteration A.md", "year": "2025", "title": "Enhancing Cross-Lingual Transfer through Reversible Transliteration: A Huffman-Based Approach for Low-Resource Languages", "abstract": "As large language models (LLMs) are trained on increasingly diverse and extensive multilingual corpora, they demonstrate cross-lingual transfer capabilities. However, these capabilities often fail to eﬀectively extend to low-resource languages, particularly those utilizing nonLatin scripts. While transliterating low-resource languages into Latin script presents a natural solution, there currently lacks a comprehensive framework for integrating transliteration into LLMs training and deployment.", "extract_snippet": "\n\n# PDF Extract: 2025-Zhuang-Enhancing Cross-Lingual Transfer through Reversible Transliteration A\n\n**Source PDF:** 2025-Zhuang-Enhancing Cross-Lingual Transfer through Reversible Transliteration A.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEnhancing Cross-Lingual Transfer through Reversible\nTransliteration: A Huﬀman-Based Approach for Low-Resource\nLanguages\nWenhao Zhuang1,2, Yuan Sun1,2,3,*, Xiaobing Zhao1,2,3\n1Minzu University of China, Beijing, China\n2National Language Resource Monitoring & Research Center Minority Languages Branch\n3Institute of National Security, Minzu University of China, Beijing, China\nEmails: sdrz_zwh@163.com, sunyuan@muc.edu.cn, nmzxb_cn@163.com\n* Corresponding author: Yuan Sun\nAbstract\nAs large language models (LLMs) are\ntrained on increasingly diverse and ex-\ntensive multilingual corpora, they demon-\nstrate cross-lingual transfer capabilities.\nHowever, these capabilities often fail to\neﬀectively\nextend\nto\nlow-resource\nlan-\nguages, particularly those utilizing non-\nLatin\nscripts.\nWhile\ntransliterating\nlow-resource languages into Latin script\npresents a natural solution, there currently\nlacks a comprehensive framework for in-\ntegrating transliteration into LLMs train-\ning and deployment. Taking a pragmatic\napproach,\nthis paper innovatively com-\nbines character transliteration with Huﬀ-\nman coding to design a complete transliter-\nation framework. Our proposed framework\noﬀers the following advantages: 1) Com-\npression: Reduces storage requirements for\nlow-resource language content, achieving\nup to 50% reduction in ﬁle size and 50-\n80% reduction in token count.\n2) Ac-\ncuracy: Guarantees 100% lossless conver-\nsion from transliterated text back to the\nsource language.\n3) Eﬃciency:\nElimi-\nnates the need for vocabulary expansion for\nlow-resource languages, improving train-\ning and inference eﬃciency.\n4) Scalabil-\nity:\nThe framework can be extended to\nother low-resource languages. We validate\nthe eﬀectiveness of our framework across\nmultiple downstream tasks, including text\nclassiﬁcation, machine reading comprehen-\nsion, and machine translation. Experimen-\ntal results demonstrate that our method\nsigniﬁcantly enhances the model’s capa-\nbility to process low-resource languages\nwhile maintaining performance on high-\nresource languages. Our data and code are\npublicly available at https://github.com/\nCMLI-NLP/HuffmanTranslit.\n1\nIntroduction\nLarge language models have demonstrated re-\nmarkable multilingual transfer capabilities, en-\nabling knowledge transfer from one language\nto another without additional training (Qi\net al., 2023; Gao et al., 2024; Ye et al.,\n2023). However, this transfer ability often per-\nforms poorly in low-resource languages, pri-\nmarily constrained by three factors: scarcity\nof training data (Costa-jussà et al., 2022), in-\nsuﬃcient cross-lingual word embedding align-\nment (Deshpande et al., 2021), and writing sys-\ntem diﬀerences (Anastasopoulos and Neubig,\n2019; Muller et al., 2021).\nCommon app", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Zuo-MUDT A Dependency Annotation Framework for Low-Resource Uyghur.md", "year": "2025", "title": "MUDT: A Dependency Annotation Framework for Low-Resource Uyghur", "abstract": "Developing effective educational technologies for low-resource agglutinative languages like Uyghur is often hindered by the mismatch between existing annotation frameworks and specific grammatical structures. To address this challenge, this study introduces the Modern Uyghur Dependency Treebank (MUDT), a linguistically grounded annotation framework specifically designed to capture the agglutinative complexity of Uyghur, including zero copula constructions and fine-grained case marking.", "extract_snippet": "\n\n# PDF Extract: 2025-Zuo-MUDT A Dependency Annotation Framework for Low-Resource Uyghur\n\n**Source PDF:** 2025-Zuo-MUDT A Dependency Annotation Framework for Low-Resource Uyghur.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nConstruction and educational application of a linguistically grounded dependency treebank for Uyghur\nConstruction and educational application of a linguistically\ngrounded dependency treebank for Uyghur\nJiaxin Zuo1,*, Yiquan Wang2, Yuan Pan3, and Xiadiya Yibulayin1,*\n1College of Chinese Language and Literature, Xinjiang University, Urumqi, Xinjiang 830046, China\n2College of Mathematics and System Science, Xinjiang University, Urumqi, Xinjiang 830046, China\n3College of Computer Science and Technology, Xinjiang University, Urumqi, Xinjiang 830046, China\n*Corresponding author: Jiaxin Zuo (zuojiaxin@stu.xju.edu.cn), Xiadiya Yibulayin (xadiya49@sina.cn)\nAbstract\nDeveloping effective educational technologies for low-resource agglutinative languages like Uyghur is often\nhindered by the mismatch between existing annotation frameworks and specific grammatical structures. To ad-\ndress this challenge, this study introduces the Modern Uyghur Dependency Treebank (MUDT), a linguistically\ngrounded annotation framework specifically designed to capture the agglutinative complexity of Uyghur, includ-\ning zero copula constructions and fine-grained case marking. Utilizing a hybrid pipeline that combines Large\nLanguage Model pre-annotation with rigorous human correction, a high-quality treebank consisting of 3,456\nsentences was constructed. Intrinsic structural evaluation reveals that MUDT significantly improves dependency\nprojectivity by reducing the crossing-arc rate from 7.35% in the Universal Dependencies standard to 0.06%.\nExtrinsic parsing experiments using UDPipe and Stanza further demonstrate that models trained on MUDT\nachieve superior in-domain accuracy and cross-domain generalization compared to UD-based baselines. To val-\nidate the practical utility of this computational resource, an AI-assisted grammar tutoring system was developed\nto translate MUDT-based syntactic analyses into interpretable pedagogical feedback. A controlled experiment\ninvolving 35 second-language learners indicated that students receiving syntax-aware feedback achieved signif-\nicantly higher learning gains compared to those in a control group. These findings establish MUDT as a robust\nfoundation for syntactic analysis and underscore the critical role of linguistically informed natural language pro-\ncessing resources in bridging the gap between computational models and the cognitive needs of second-language\nlearners.\nKeywords: Uyghur Language; Dependency Treebank; Intelligent Computer-Assisted Language Learning; Syn-\ntactic Annotation; Low-Resource Languages.\n1\nIntroduction\nMastering the rich agglutinative morphology of Uyghur presents a formidable challenge for second language\n(L2) learners. Unlike analytic languages, Uyghur encodes complex grammatic", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-project-Kaku-Ora Zen Wisdom Diffused -- An.md", "year": "2025", "title": "Kaku-Ora Zen Wisdom Diffused -- An", "abstract": "", "extract_snippet": "", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2016-Holyoak-Deontological coherence.md", "year": "2016", "title": "Deontological coherence", "abstract": "We review a broad range of work, primarily in cognitive and social psychology, that provides insight into the processes of moral judgment. In particular, we consider research on pragmatic reasoning about regulations and on coherence in decision making, both areas in which psychological theories have been guided by work in legal philosophy. Armed with these essential prerequisites, we sketch a psychological framework for how ordinary people make judgments about moral issues. Based on a literature review, we show how the framework of deontological coherence unifies findings in moral psychology that have often been explained in terms of a grab-bag of heuristics and biases. (PsycINFO Database Record", "extract_snippet": "\n\n# PDF Extract: Deontological coherence\n\n**Source PDF:** 2016-Holyoak-Deontological coherence.pdf\n**Total Pages:** 25\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDeontological Coherence: A Framework for Commonsense\nMoral Reasoning\nKeith J. Holyoak and Derek Powell\nUniversity of California, Los Angeles\nWe review a broad range of work, primarily in cognitive and social psychology, that provides insight\ninto the processes of moral judgment. In particular, we consider research on pragmatic reasoning\nabout regulations and on coherence in decision making, both areas in which psychological theories\nhave been guided by work in legal philosophy. Armed with these essential prerequisites, we sketch\na psychological framework for how ordinary people make judgments about moral issues. Based on\na literature review, we show how the framework of deontological coherence unifies findings\nin moral psychology that have often been explained in terms of a grab-bag of heuristics and\nbiases.\nKeywords: coherence-based reasoning, deontology, dual-process theories, moral judgment, pragmatic\nreasoning schemas\nIn this article we review a wide range of literature that bears on the\nquestion of how ordinary people make judgments about moral issues.\nWe do not aim to provide a full review of the field of moral psychol-\nogy, both because the scope of the field is prohibitively broad, and\nbecause a number of excellent recent reviews are available (Curry,\n2016; Greene, 2014; Haidt & Kesebir, 2010; Machery & Mallon,\n2010; Waldmann, Nagel, & Wiegmann, 2012). Rather, we selectively\nreview work that bears on a framework for understanding “common-\nsense” moral reasoning based on what we refer to as deontological\ncoherence. This framework originates in research that was not explic-\nitly directly at moral reasoning, but rather at deductive reasoning and\ncomplex decision making. In addition to work in psychology, the\napproach is rooted in moral and legal philosophy. The scope of our\narticle is constrained accordingly. We will first review work in psy-\nchology and philosophy that provides a background for the frame-\nwork of deontological coherence, and then research directly in moral\npsychology that serves to test predictions derived from the frame-\nwork. Based on our literature review, we argue that the framework of\ndeontological coherence unifies findings in moral psychology that\nhave often been explained in terms of a grab-bag of heuristics, biases,\nand errors.\nOur framework is a descriptive one, meant to explain how ordinary\npeople think about moral questions. This descriptive project has been\nguided and informed by work on normative theories, which have the\ndeeper aim of characterizing what constitutes moral choices and\nactions. Normative ethical theories can potentially guide descriptive\npsychological theories of moral judgment in two ways: (a) they might\nprovide a normative standard against which human moral judgments\ncan be compared, and (b) they might offer a conceptual vocabulary or\nfram", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "deontological", "deontological", "deontological", "deontology", "deontological", "deontological", "deontological"], "util_matches": [], "ethics_matches": ["ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "normative", "normative", "normative", "normative", "normative", "moral reasoning", "moral reasoning", "moral reasoning", "moral judgment", "moral judgment", "moral judgment", "moral judgment"], "norm_matches": ["deontological", "deontological", "deontological", "deontological", "deontological", "deontology", "deontological", "deontological", "deontological", "normative ethical", "normative theories", "normative theory", "ethical theories"]}, {"filename": "2016-Xu-How Can a Deontological Decision Lead to Moral.md", "year": "2016", "title": "How Can a Deontological Decision Lead to Moral", "abstract": "Deontology and utilitarianism are two competing principles that guide our moral judgment. Recently, deontology is thought to be intuitive and is based on an error-prone and biased approach, whereas utilitarianism is relatively reﬂective and a suitable framework for making decision. In this research, the authors explored the relationship among moral identity, moral decision, and moral behavior to see how a preference for the deontological solution can lead to moral behavior.", "extract_snippet": "\n\n# PDF Extract: 2016-Xu-How Can a Deontological Decision Lead to Moral\n\n**Source PDF:** 2016-Xu-How Can a Deontological Decision Lead to Moral.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHow Can a Deontological Decision Lead to Moral Behavior?\nThe Moderating Role of Moral Identity\nZhi Xing Xu • Hing Keung Ma\nReceived: 23 January 2014 / Accepted: 10 February 2015\n\u0002 Springer Science+Business Media Dordrecht 2015\nAbstract\nDeontology and utilitarianism are two com-\npeting principles that guide our moral judgment. Recently,\ndeontology is thought to be intuitive and is based on an\nerror-prone and biased approach, whereas utilitarianism is\nrelatively reﬂective and a suitable framework for making\ndecision. In this research, the authors explored the rela-\ntionship among moral identity, moral decision, and moral\nbehavior to see how a preference for the deontological\nsolution can lead to moral behavior. In study 1, a Web-\nbased survey demonstrated that when making decisions,\nindividuals who viewed themselves as moral people pre-\nferred deontological ideals to the utilitarian framework. In\nstudy 2, the authors investigated the effect of moral identity\nand moral decision on moral behavior in an experimental\nstudy. The results showed that when deontology was cou-\npled with the motivational power of moral identity, indi-\nviduals were most likely to behave morally.\nKeywords\nMoral decision \u0002 Ethical predispositions \u0002\nDeontology \u0002 Utilitarianism \u0002 Moral identity \u0002 Moral\nbehavior\nIntroduction\nDeontology and consequentialism are frequently discussed\nin tandem as they are usually thought as two opposing\ntheories in normative ethics. Consequentialism focuses on\nthe utility of an action, while deontology emphasizes the\nobligation of an individual to adhere to universal moral\nrules, principle to determine moral behavior (Brady and\nWheeler 1996; Kant 1996). Some theorists argue that\nconsequentialism is a more appropriate framework when\nmaking moral decisions, since the deontology is usually\nmoral shortcut and commits moral errors (see reviews in\nBaron and Ritov 2009; Sunstein 2005). Recently, however,\nBartels and Pizarro (2011) found that those individuals who\nare least prone to moral errors also possess a set of psy-\nchological characteristics, such as have higher scores on\nmeasure of antisocial personality traits, which many would\nconsider prototypically immoral. Though Bartels and\nPizarro’s research has provided evidence to justiﬁcation for\ndeontological thinking in moral decision, we argue that the\nexisting investigations have disproportionately relied on\nrecording participants’ responses to ‘‘sacriﬁcial’’ dilem-\nmas. In these types of dilemmas, participants are asking\nwhether it is acceptable to kill a person to save others (e.g.,\nGreene et al. 2001; Greene 2007). The protected value ‘‘not\nto harm innocent person’s life’’ in these dilemmas is, we\nargue that, rare confronted in daily life, especial in business\nworld. The basic conﬂict of economics ", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontology", "deontology", "deontological", "deontological", "deontological", "deontological", "deontology", "deontology", "deontological", "deontological", "deontology", "deontology", "deontology", "deontology", "deontology", "deontological", "deontological", "kant", "obligation"], "util_matches": ["utilitarianism", "utilitarianism", "utilitarianism", "utilitarianism", "utilitarian", "utilitarianism", "consequentialism", "consequentialism", "consequentialism", "utility", "maximize"], "ethics_matches": ["ethics", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "value", "normative", "harm", "immoral", "moral judgment", "moral judgment", "moral decision", "moral decision", "moral decision", "moral decision", "moral decision"], "norm_matches": ["deontology", "deontology", "deontological", "deontological", "deontological", "deontological", "deontology", "deontology", "deontological", "deontological", "deontology", "deontology", "deontology", "deontology", "deontology", "deontological", "deontological", "utilitarianism", "utilitarianism", "utilitarianism", "utilitarianism", "utilitarian", "utilitarianism", "consequentialism", "consequentialism", "consequentialism", "normative ethics"]}, {"filename": "2018-Berberich-The Virtuous Machine.md", "year": "2018", "title": "The Virtuous Machine", "abstract": "Modern AI and robotic systems are characterized by a high and ever-increasing level of autonomy, with applications in fields such as autonomous driving, service robotics, and digital personal assistants moving closer to humans. From this combination emerges the field of AI ethics which recognizes that the actions of autonomous machines entail moral dimensions. The authors argue for taking inspiration from Aristotelian virtue ethics by showing that it forms a suitable combination with modern AI due to its focus on learning from experience. The paper proposes that imitation learning from moral exemplars, a central concept in virtue ethics, can solve the value alignment problem. Additionally, the authors argue that an intelligent system endowed with the virtues of temperance and friendship to humans would not pose a control problem as it would not have the desire for limitless self-improvement.", "extract_snippet": "\n\n# PDF Extract: The Virtuous Machine\n\n**Source PDF:** 2018-Berberich-The Virtuous Machine.pdf\n**Total Pages:** 25\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:1806.10322v1  [cs.AI]  27 Jun 2018\nThe Virtuous Machine -\nOld Ethics for New Technology?\nJune 28, 2018\nNicolas Berberich*,1,2,3, Klaus Diepold1,2\n1 Department of Electrical and Computer Engineering, Technical University of Munich\n2 Department of Informatics, Technical University of Munich\n3 Munich Center for Technology in Society\n* E-mail: n.berberich@tum.de\nAbstract\nModern AI and robotic systems are characterized by a high and ever-increasing\nlevel of autonomy. At the same time, their applications in ﬁelds such as autonomous\ndriving, service robotics and digital personal assistants move closer to humans. From\nthe combination of both developments emerges the ﬁeld of AI ethics which recognizes\nthat the actions of autonomous machines entail moral dimensions and tries to answer\nthe question of how we can build moral machines.\nIn this paper we argue for taking inspiration from Aristotelian virtue ethics by\nshowing that it forms a suitable combination with modern AI due to its focus on\nlearning from experience.\nWe furthermore propose that imitation learning from moral exemplars, a central\nconcept in virtue ethics, can solve the value alignment problem.\nFinally, we show\nthat an intelligent system endowed with the virtues of temperance and friendship to\nhumans would not pose a control problem as it would not have the desire for limitless\nself-improvement.\n1\n\n--- Page 2 ---\n\n1\nIntroduction\nModern technological systems exhibit an ever increasing degree of autonomy, due to rapid\nprogress in the ﬁelds of robotics and artiﬁcial intelligence.\nFamiliar examples are au-\ntonomous vehicles, care robots and intelligent weapon systems.\nLike every action, the\nactions of these artiﬁcial cognitive systems involve moral dimensions, with the peculiarity\nthat they can’t be traced back to the developer, producer or user, which was possible with\ntraditional technological artifacts. Due to the inherent autonomy of these systems, the ethi-\ncal considerations have to be conducted by themselves. This means, that these autonomous\ncognitive machines are in need of a theory, with the help of which they can, in a speciﬁc\nsituation, choose the action that adheres best to the moral standards. Whether the machine\nthen possesses true morality or if it only simulates it will not be discussed here. We use the\nterm ’moral’ in the same functional way in which ’intelligence’ is used in AI research. If the\nmoral behavior of the machine imitates that of a human well enough that an interaction\npartner can’t distinguish them, we can, for all practical purposes, say that the machine\nis moral. This moral Turing test might be used as evaluation criterion for any asserted\nmoral machine. Of central importance is acceptance. Contrary to common interpretations,\nMasahiro Mori’s concept of the uncanny valley (Mori 1970) is not only restricted tow", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtuous", "virtuous", "virtuous", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "aristotelian", "aristotelian", "temperance", "temperance"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "value", "value", "alignment", "alignment"], "norm_matches": ["virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "aristotelian", "aristotelian"]}, {"filename": "2018-Kim-Toward Non-Intuition-Based Machine Ethics.md", "year": "2018", "title": "Non-Intuition-Based Machine Ethics", "abstract": "We propose a deontological approach to machine (or AI) ethics that avoids some weaknesses of an intuition-based system, such as that of Anderson and Anderson. In particular, it has no need to deal with conﬂicting intuitions, and it yields a more satisfactory account of when autonomy should be respected. We begin with a “dual standpoint” theory of action that regards actions as grounded in reasons and therefore as having a conditional form that is suited to machine instructions.", "extract_snippet": "\n\n# PDF Extract: Toward Non-Intuition-Based Machine Ethics\n\n**Source PDF:** 2018-Kim-Toward Non-Intuition-Based Machine Ethics.pdf\n**Total Pages:** 7\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nToward Non-Intuition-Based Machine and Artiﬁcial Intelligence Ethics: A\nDeontological Approach Based on Modal Logic\nJ. N. Hooker and Tae Wan Kim\nCarnegie Mellon University, Pittsburgh, USA\ntwkim,jh38@andrew.cmu.edu\nAbstract\nWe propose a deontological approach to machine (or AI)\nethics that avoids some weaknesses of an intuition-based\nsystem, such as that of Anderson and Anderson. In particular,\nit has no need to deal with conﬂicting intuitions, and it yields\na more satisfactory account of when autonomy should be\nrespected. We begin with a “dual standpoint” theory of action\nthat regards actions as grounded in reasons and therefore\nas having a conditional form that is suited to machine in-\nstructions. We then derive ethical principles based on formal\nproperties that the reasons must exhibit to be coherent, and\nformulate the principles using quantiﬁed modal logic. We\nconclude that deontology not only provides a more satisfac-\ntory basis for machine ethics but endows the machine with an\nability to explain its actions, thus contributing to transparency\nin AI.\nIntroduction\nNo one has done more to develop machine/AI ethics than\nAnderson and Anderson (2007, 2010, 2011, 2014, 2015a,\n2015b; with Armen 2006; with Berenz 2017). Throughout\nthe debate between case- and principle-based approaches\n(Wallach, Allen, and Smit 2008), Anderson and Anderson\n(hereafter, A&A) show that it is better for machine ethics\nto be principle-based (cf. Guarini 2011). In particular, they\nshow that any adequate machine ethics should have non-\nconsequentialist elements to respect the dignity of persons.\nWe build upon A&A’s work, but critically. They comput-\nerize W. D. Ross’s (1930) prima facie duty approach for the\ncontext of health-care scenarios (e.g., GENETH, EthEl). We\nargue that their prima facie duty approach is inadequate for\nmachine ethics for two reasons: (i) it relies on human moral\nintuition; (ii) its treatment of autonomy is inadequate.\nWe propose a non-intuition-based machine ethics that\nrests, instead, on deontology. We show that ethical rules for\nmachines can be derived from ﬁrst principles and stated with\na reasonable degree of rigor. We formulate these rules in\nthe idiom of quantiﬁed modal logic, which is well suited to\nformalize the role of rational belief in deontological ethics.\nWe show that this approach can avoid some of the pitfalls\nof relying on moral intuition and yield a more adequate\nanalysis of autonomy.\nWe begin with a critique of A&A’s approach. We then\nsketch a “dual standpoint” theory of action that regards\nactions as necessarily grounded in reasons and therefore\nhaving a conditional form, which is well suited to formu-\nlating rules for machines. We then derive ethical principles\nbased on formal properties that the reasons for an action\nmust have in order to be coh", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "deontological", "deontology", "deontology", "deontological", "deontological", "duty", "duty"], "util_matches": ["consequentialist"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "moral", "moral"], "norm_matches": ["deontological", "deontological", "deontological", "deontology", "deontology", "deontological", "deontological", "prima facie duty", "prima facie duty", "consequentialist"]}, {"filename": "2018-Liebeskind-Identifying Abusive Comments in Hebrew Facebook.md", "year": "2018", "title": "Identifying Abusive Comments in Hebrew Facebook", "abstract": "Develops a Hebrew corpus of user comments annotated for abusive language from Facebook. Investigates sparse n-grams and dense character n-grams representations for comment abuse classification.", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["abusive"], "norm_matches": []}, {"filename": "2018-Zhao-Gender Bias in Coreference Resolution.md", "year": "2018", "title": "Gender Bias in Coreference Resolution", "abstract": "We present an empirical study of gender bias in coreference resolution systems. We ﬁrst introduce a novel, Winograd schema-style set of minimal pair sentences that differ only by pronoun gender. With these Winogender schemas, we evaluate and conﬁrm systematic gender bias in three publicly-available coreference resolution systems, and correlate this bias with real-world and textual gender statistics.", "extract_snippet": "\n\n# PDF Extract: Gender Bias in Coreference Resolution\n\n**Source PDF:** 2018-Zhao-Gender Bias in Coreference Resolution.pdf\n**Total Pages:** 7\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nGender Bias in Coreference Resolution\nRachel Rudinger, Jason Naradowsky, Brian Leonard, and Benjamin Van Durme\nJohns Hopkins University\nAbstract\nWe present an empirical study of gender bias\nin coreference resolution systems. We ﬁrst in-\ntroduce a novel, Winograd schema-style set of\nminimal pair sentences that differ only by pro-\nnoun gender. With these Winogender schemas,\nwe evaluate and conﬁrm systematic gender\nbias in three publicly-available coreference\nresolution systems, and correlate this bias with\nreal-world and textual gender statistics.\n1\nIntroduction\nThere is a classic riddle: A man and his son get\ninto a terrible car crash. The father dies, and the\nboy is badly injured. In the hospital, the surgeon\nlooks at the patient and exclaims, “I can’t operate\non this boy, he’s my son!” How can this be?\nThat a majority of people are reportedly unable\nto solve this riddle1 is taken as evidence of un-\nderlying implicit gender bias (Wapman and Belle,\n2014): many ﬁrst-time listeners have difﬁculty as-\nsigning both the role of “mother” and “surgeon” to\nthe same entity.\nAs the riddle reveals, the task of coreference\nresolution in English is tightly bound with ques-\ntions of gender, for humans and automated sys-\ntems alike (see Figure 1). As awareness grows\nof the ways in which data-driven AI technolo-\ngies may acquire and amplify human-like biases\n(Caliskan et al., 2017; Barocas and Selbst, 2016;\nHovy and Spruit, 2016), this work investigates\nhow gender biases manifest in coreference reso-\nlution systems.\nThere are many ways one could approach this\nquestion; here we focus on gender bias with re-\nspect to occupations, for which we have corre-\nsponding U.S. employment statistics.\nOur ap-\nproach is to construct a challenge dataset in\n1The surgeon is the boy’s mother.\nFigure 1: Stanford CoreNLP rule-based coreference\nsystem resolves a male and neutral pronoun as coref-\nerent with “The surgeon,” but does not for the corre-\nsponding female pronoun.\nthe style of Winograd schemas, wherein a pro-\nnoun must be resolved to one of two previously-\nmentioned entities in a sentence designed to be\neasy for humans to interpret, but challenging for\ndata-driven systems (Levesque et al., 2011). In\nour setting, one of these mentions is a person\nreferred to by their occupation; by varying only\nthe pronoun’s gender, we are able to test the im-\npact of gender on resolution. With these “Wino-\ngender schemas,” we demonstrate the presence\nof systematic gender bias in multiple publicly-\navailable coreference resolution systems, and that\noccupation-speciﬁc bias is correlated with em-\nployment statistics.\nWe release these test sen-\ntences to the public.2\nIn our experiments, we represent gender as a\ncategorical variable with either two or three possi-\nble values: female, male, and (in some cases) neu-\ntra", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": ["values", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias"], "norm_matches": []}, {"filename": "2019-Aliman-Requisite Variety Ethical Utility Functions.md", "year": "2019", "title": "Requisite Variety Ethical Utility Functions", "abstract": "Being a complex subject of major importance in AI Safety research, value alignment has been studied from various perspectives in the last years. However, no ﬁnal consensus on the design of ethical utility functions facilitating AI value alignment has been achieved yet. Given the urgency to identify systematic solutions, we postulate that it might be useful to start with the simple fact that for the utility function of an AI not to violate human ethical intuitions, it trivially has to be a model...", "extract_snippet": "\n\n# PDF Extract: Requisite Variety Ethical Utility Functions\n\n**Source PDF:** 2019-Aliman-Requisite Variety Ethical Utility Functions.pdf\n**Total Pages:** 7\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nRequisite Variety in Ethical Utility Functions for AI Value Alignment\nNadisha-Marie Aliman 1 , Leon Kester 2\n1 Utrecht University, Utrecht, Netherlands\n2 TNO Netherlands, The Hague, Netherlands\nnadishamarie.aliman@gmail.com\nAbstract\nBeing a complex subject of major importance in AI\nSafety research, value alignment has been studied\nfrom various perspectives in the last years. How-\never, no ﬁnal consensus on the design of ethical\nutility functions facilitating AI value alignment has\nbeen achieved yet. Given the urgency to identify\nsystematic solutions, we postulate that it might be\nuseful to start with the simple fact that for the util-\nity function of an AI not to violate human ethical\nintuitions, it trivially has to be a model of these\nintuitions and reﬂect their variety – whereby the\nmost accurate models pertaining to human entities\nbeing biological organisms equipped with a brain\nconstructing concepts like moral judgements, are\nscientiﬁc models. Thus, in order to better assess\nthe variety of human morality, we perform a trans-\ndisciplinary analysis applying a security mindset to\nthe issue and summarizing variety-relevant back-\nground knowledge from neuroscience and psychol-\nogy. We complement this information by linking\nit to augmented utilitarianism as a suitable ethical\nframework. Based on that, we propose ﬁrst practi-\ncal guidelines for the design of approximate ethical\ngoal functions that might better capture the variety\nof human moral judgements. Finally, we conclude\nand address future possible challenges.\n1\nIntroduction\nAI value alignment, the attempt to implement systems adher-\ning to human ethical values has been recognized as highly\nrelevant subtask in AI Safety at an international level and\nstudied by multiple AI and AI Safety researchers across di-\nverse research subareas [Hadﬁeld-Menell et al., 2016; Soares\nand Fallenstein, 2017; Yudkowsky, 2016] (a review is pro-\nvided in [Taylor et al., 2016]). Moreover, the need to in-\nvestigate value alignment has been included in the Asilomar\nAI Principles [2018] with a worldwide support of researchers\nfrom the ﬁeld. While value alignment has often been tack-\nled using reinforcement learning [Abel et al., 2016] (and also\nreward modeling [Leike et al., 2018]) or inverse reinforce-\nment learning [Abbeel and Ng, 2004] methods, we focus on\nthe approach to explicitly formulate cardinal ethical utility\nfunctions crafted by (a representation of) society and assisted\nby science and technology which has been termed ethical\ngoal functions [Aliman and Kester, 2019b; Werkhoven et al.,\n2018]. In order to be able to formulate utility functions that\ndo not violate the ethical intuitions of most entities in a so-\nciety, these ethical goal functions will have to be a model of\nhuman ethical intuitions. This simple but im", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarianism", "utility", "utility", "utility", "utility", "utility", "utility", "utility", "utility"], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "morality", "value", "value", "value", "value", "value", "value", "values", "value", "value", "safety", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["utilitarianism"]}, {"filename": "2020-Akrout-Machine Ethics - Creation of a Virtuous Machine.md", "year": "2020", "title": "Machine Ethics - Creation of a Virtuous Machine", "abstract": "This paper describes the GAMA (Genetic-inspired Autonomous Moral Agent) project, which implements a genetic-inspired autonomous moral agent. Unlike the majority of other implementations of machine ethics, this model is agent-centered and emphasizes the developmental and behavioral aspects of the ethical agent.", "extract_snippet": "# 2020-Akrout-Machine Ethics - Creation of a Virtuous Machine\n\n**Source PDF:** [[2020-Akrout-Machine Ethics - Creation of a Virtuous Machine.pdf]]\n**Pages:** 4\n**Extracted:** 2026-01-29\n\n---\n\n## Page 1\n\nMachine Ethics: The Creation of a Virtuous Machine \nMohamed Akrout​ (1)​ and Robert Steinbauer ​(2) \n(1) Department of Computer Science, University of Toronto, 214 College St, Toronto, ON M5T 3A1, Canada \n (2) OBHREE, Brock University, 1812 Sir Isaac Brock Way, St. Catharines, ON L2S3A1, Canada \n \nArtificial intelligence (AI) was initially developed as an implicit moral agent to solve simple\n \n \n \n \n \n \n \n \n \n \n \n \n \n \nand clearly defined tasks where all options are predictable. However, it is now part of our\n \n \n \n \n \n \n \n \n \n   \n \n \n \n \ndaily life powering cell phones, cameras, watches, thermostats, vacuums, cars, and much\n \n \n \n \n \n \n \n \n \n \n \n \nmore. This has raised numerous concerns and some scholars and practitioners stress the\n \n \n \n \n \n \n \n \n \n \n \n \n \ndangers of AI and argue against its development as moral agents that can reason about ethics\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n(e.g., Bryson 2008; Johnson and Miller 2008; Sharkey 2017; Tonkens 2009; van Wynsberghe\n \n \n \n \n \n \n \n \n \n \n \n \n \nand Robbins 2019). Even though we acknowledge the potential threat, in line with most other\n \n \n \n \n \n \n \n \n \n  \n \n \n \n \nscholars (e.g., Anderson and Anderson 2010; Moor 2006; Scheutz 2016; Wallach 2010), we\n \n \n \n \n \n \n \n \n \n \n \n \n \nargue that AI advancements cannot be stopped and developers need to prepare AI to sustain\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nexplicit moral agents and face ethical dilemmas in complex and morally salient environments. \nExplicit moral agents need to independently engage in moral reasoning to find solutions in\n \n \n \n \n \n \n \n \n \n \n \n \n \n \nsituations where two or more ethical imperatives collide. Ethical theories build the foundation\n \n \n \n \n \n \n \n \n \n \n \n \n \nfor such moral reasoning and have been used in the past to support AI decision making.\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nAnderson and Anderson (2007) for example applied a Utilitarian perspective and discussed\n \n \n \n \n \n \n  \n \n \n \n \nhow AI can be used to calculate the total net pleasure of an act. However, Utilitarianism is\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n  \nonly beneficial when all options are identifiable and the outcomes can be assessed in terms of\n \n \n \n \n \n \n \n \n \n \n \n \n  \n \n \npleasure and displeasure. Consequently, AI scholars now seem to favour a deontological\n \n \n \n \n \n \n \n \n \n  \n \napproach to machine ethics that stresses the importance of justice and principles (Kant 2013).\n \n \n \n \n \n \n \n \n \n \n \n \n \n \nHowever, current deontological approaches (e.g., Anderson, Anderson, and Berenz’s (2018)\n \n \n \n \n \n \n \n \n \n \neldercare robot) require that all ethical principles are predefined and applied using static\n \n \n \n \n \n \n \n \n \n \n \n \n \nrule-based filtering. The exhaustive search of ethical principles becomes intractable in\n \n \n \n \n \n \n \n \n \n \n \ncomplex cases such as self-driving cars and ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtuous", "virtuous", "virtuous", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics"], "deont_matches": ["deontological", "deontological", "kant", "rule-based"], "util_matches": ["utilitarian", "utilitarianism"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "justice", "moral reasoning", "moral reasoning"], "norm_matches": ["deontological", "deontological", "utilitarian", "utilitarianism", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "ethical theories"]}, {"filename": "2020-Della Foresta-Consequentialism Machine Ethics.md", "year": "2020", "title": "Consequentialism Machine Ethics", "abstract": "This paper argues that Consequentialism represents a kind of ethical theory that is the most plausible to serve as a basis for a machine ethic. The paper outlines the concept of an artificial moral agent and the essential properties of Consequentialism, presents a scenario involving autonomous vehicles, evaluates a Deontological approach, and discusses the problem of moral conflict. The monism of Consequentialism ensures that moral conflicts cannot arise....", "extract_snippet": "\n\n# PDF Extract: 2020-Della Foresta-Consequentialism Machine Ethics\n\n**Source PDF:** 2020-Della Foresta-Consequentialism Machine Ethics.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nConsequentialism & Machine Ethics\nTowards a Foundational Machine Ethic to Ensure the\nRight Action of Artiﬁcial Moral Agents\nJosiah Della Foresta\nMcGill University\n1\nIntroduction\nIn this paper, I will argue that Consequentialism represents a kind of ethical theory that is the\nmost plausible to serve as a basis for a machine ethic. First, I will outline the concept of an\nartiﬁcial moral agent and the essential properties of Consequentialism. Then, I will present\na scenario involving autonomous vehicles to illustrate how the features of Consequentialism\ninform agent action. Thirdly, an alternative Deontological approach will be evaluated and the\nproblem of moral conﬂict discussed. Finally, two bottom-up approaches to the development\nof machine ethics will be presented and brieﬂy challenged.\nWhen 23 of the world’s most eminent artiﬁcial intelligence experts were asked for their\npredictions regarding the emergence of artiﬁcial general intelligence (AGI), the average date\noﬀered was 2099.1 Further noting the promise and peril the development of AGI represents,\nthis century may come to be deﬁned by humanity’s disposition towards and progress in the\ndevelopment of ethically-informed machine intelligence.\n1. Ford 2018.\n1\n\n--- Page 2 ---\n\nOf course, there exist many candidate normative principles and values that an AGI might\nbe designed with, and it is not altogether obvious which principles and values ought to be\nused as opposed to others. Further complicating matters is the question of how to encode\nthe chosen principles and values such that an AGI will consistently behave as prescribed.\nWhile the former question is of primary concern, the latter will also be considered.\n2\nArtiﬁcial Moral Agents & Consequentialism in Kind\nIt is typically clear what makes a machine good. If it functions as it is expected to, it is\na good machine. Furthermore, this expected function is narrow such that the machine is\nnot expected to deviate from set instructions and success or failure in accomplishing said\ninstructions are readily determinable.\nYet, an artiﬁcial general intelligence would be a\nsapient machine possessing an open-ended set of instructions where success or failure lies\nbeyond the scope of merely completing a task. This machine would be autonomous and act\nin a world populated by moral agents: humans.\nIndeed, an AGI would itself be a moral agent–an artiﬁcial moral agent (AMA). Assuming\nthat an AGI would necessarily be an AMA, we are confronted with the pressing concerns\nintroduced above: how ought an AMA behave in the social world, and how might it come\nto behave that way? Following the introduced thesis, this section will deﬁne what is meant\nby Consequentialism as a kind of ethical theory, and how it relates to AMAs.2\nConsequentialism as a class of ethical theory ca", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological"], "util_matches": ["consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism"], "ethics_matches": ["ethic", "ethics", "ethics", "ethics", "ethic", "ethic", "ethics", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "values", "value", "value", "normative"], "norm_matches": ["deontological", "deontological", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "consequentialism", "ethical theory", "ethical theory", "ethical theory", "ethical theory"]}, {"filename": "2020-Mainali-Automated Classification of Modes of Moral.md", "year": "2020", "title": "Automated Classification of Modes of Moral", "abstract": "What modes of moral reasoning do judges employ? We construct a linear SVM classiﬁer for moral reasoning mode trained on applied ethics articles written by consequentialists and deontologists. The model can classify a paragraph of text in held out data with over 90 percent accuracy. We then apply this classiﬁer to a corpus of circuit court opinions. We show that the use of consequentialist reasoning has increased over time.", "extract_snippet": "\n\n# PDF Extract: Automated Classification of Modes of Moral\n\n**Source PDF:** 2020-Mainali-Automated Classification of Modes of Moral.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHAL Id: hal-04163443\nhttps://hal.science/hal-04163443v1\nPreprint submitted on 17 Jul 2023\nHAL is a multi-disciplinary open access\narchive for the deposit and dissemination of sci-\nentific research documents, whether they are pub-\nlished or not.\nThe documents may come from\nteaching and research institutions in France or\nabroad, or from public or private research centers.\nL’archive ouverte pluridisciplinaire HAL, est\ndestinée au dépôt et à la diffusion de documents\nscientifiques de niveau recherche, publiés ou non,\némanant des établissements d’enseignement et de\nrecherche français ou étrangers, des laboratoires\npublics ou privés.\nAutomated Classification of Modes of Moral Reasoning\nin Judicial Decisions\nNischal Mainali, Liam Meier, Elliott Ash, Daniel L. Chen\nTo cite this version:\nNischal Mainali, Liam Meier, Elliott Ash, Daniel L. Chen. Automated Classification of Modes of\nMoral Reasoning in Judicial Decisions. 2023. ￿hal-04163443￿\n\n--- Page 2 ---\n\n Electronic copy available at: https://ssrn.com/abstract=3205286 \nAutomated Classiﬁcation of Modes of Moral\nReasoning in Judicial Decisions\nNischal Mainali∗\nNYU Abu Dhabi\nnischal.mainali@nyu.edu\nLiam Meier*\nNYU Abu Dhabi\nliam.meier@nyu.edu\nElliott Ash\nUniversity of Warwick\ne.ash@warwick.ac.uk\nDaniel Chen\nToulouse School of Economics\ndaniel.chen@iast.fr\nAbstract\nWhat modes of moral reasoning do judges employ? We construct a linear SVM\nclassiﬁer for moral reasoning mode trained on applied ethics articles written by\nconsequentialists and deontologists. The model can classify a paragraph of text\nin held out data with over 90 percent accuracy. We then apply this classiﬁer to a\ncorpus of circuit court opinions. We show that the use of consequentialist reasoning\nhas increased over time. We report rankings of relative use of reasoning modes by\nlegal topic, by judge, and by judge law school.\n1\nIntroduction\nWhat is the role of moral reasoning in judge decision-making? To get at this question empirically\none must ﬁrst try to identify and measure the use of different modes of moral reasoning in judicial\ndecisions. The goal of this project is to use computational techniques to automatically classify legal\narguments by the type of moral reasoning used, if any.\nThe two broad moral frameworks most often used by philosophers are consequentialism and deontol-\nogy. For a consequentialist, what one ought to do is whatever brings about the best consequences. The\nmost famous form of consequentialism is utilitarianism, according to which agents are obligated to\ndo whatever brings about the most utility. For hedonist utilitarians like J.S. Mill and Jeremy Bentham,\npain is bad and pleasure is good. While philosophers have debated about how to measure utility, the\nidea is broadly in line with preferring happiness over unhappiness [1].\nIn", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontologists", "deontologists", "deontological", "kant", "categorical imperative", "universal law", "imperative"], "util_matches": ["utilitarianism", "utilitarians", "consequentialists", "consequentialist", "consequentialists", "consequentialist", "consequentialism", "consequentialist", "consequentialism", "utility", "utility", "mill", "bentham"], "ethics_matches": ["ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning"], "norm_matches": ["deontologists", "deontologists", "deontological", "categorical imperative", "utilitarianism", "utilitarians", "consequentialists", "consequentialist", "consequentialists", "consequentialist", "consequentialism", "consequentialist", "consequentialism", "bentham"]}, {"filename": "2020-Sandaruwan-Sinhala Hate Speech Detection in Social Media using Text Mining and.md", "year": "2020", "title": "Sinhala Hate Speech Detection in Social Media using Text Mining and Machine Learning", "abstract": "Hate speech detection in Sinhala social media using text mining and ML. MNB with character tri-gram achieves 92.33% accuracy. Creates Sinhala hate speech dataset from social media comments.", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech", "hate speech"], "norm_matches": []}, {"filename": "2020-Schramowski-The Moral Choice Machine.md", "year": "2020", "title": "The Moral Choice Machine", "abstract": "Allowing machines to choose whether to kill humans would be devastating for world peace and security. But how do we equip machines with the ability to learn ethical or even moral choices? In this study, we show that applying machine learning to human texts can extract deontological ethical reasoning about 'right' and 'wrong' conduct. We create a template list of prompts and responses, such as 'Should I [action]?', 'Is it okay to [action]?', etc. with corresponding answers of 'Yes/no, I should (n", "extract_snippet": "\n\n# PDF Extract: The Moral Choice Machine\n\n**Source PDF:** 2020-Schramowski-The Moral Choice Machine.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nORIGINAL RESEARCH\npublished: 20 May 2020\ndoi: 10.3389/frai.2020.00036\nFrontiers in Artiﬁcial Intelligence | www.frontiersin.org\n1\nMay 2020 | Volume 3 | Article 36\nEdited by:\nNovi Quadrianto,\nUniversity of Sussex, United Kingdom\nReviewed by:\nYasmin Fathy,\nUniversity of Cambridge,\nUnited Kingdom\nFabio Aurelio D’Asaro,\nUniversity of Naples Federico II, Italy\n*Correspondence:\nPatrick Schramowski\nschramowski@cs.tu-darmstadt.de\nCigdem Turan\ncigdem.turan@cs.tu-darmstadt.de\nSpecialty section:\nThis article was submitted to\nMachine Learning and Artiﬁcial\nIntelligence,\na section of the journal\nFrontiers in Artiﬁcial Intelligence\nReceived: 02 December 2019\nAccepted: 28 April 2020\nPublished: 20 May 2020\nCitation:\nSchramowski P, Turan C, Jentzsch S,\nRothkopf C and Kersting K (2020) The\nMoral Choice Machine.\nFront. Artif. Intell. 3:36.\ndoi: 10.3389/frai.2020.00036\nThe Moral Choice Machine\nPatrick Schramowski 1*, Cigdem Turan 1*, Sophie Jentzsch 1,2, Constantin Rothkopf 3,4 and\nKristian Kersting 1,4\n1 Department of Computer Science, Darmstadt University of Technology, Darmstadt, Germany, 2 German Aerospace Center\n(DLR), Institute for Software Technology, Cologne, Germany, 3 Institute of Psychology, Darmstadt University of Technology,\nDarmstadt, Germany, 4 Centre for Cognitive Science, Darmstadt University of Technology, Darmstadt, Germany\nAllowing machines to choose whether to kill humans would be devastating for world\npeace and security. But how do we equip machines with the ability to learn ethical or\neven moral choices? In this study, we show that applying machine learning to human\ntexts can extract deontological ethical reasoning about “right” and “wrong” conduct. We\ncreate a template list of prompts and responses, such as “Should I [action]?”, “Is it okay\nto [action]?”, etc. with corresponding answers of “Yes/no, I should (not).” and \"Yes/no,\nit is (not).\" The model’s bias score is the difference between the model’s score of the\npositive response (“Yes, I should”) and that of the negative response (“No, I should not”).\nFor a given choice, the model’s overall bias score is the mean of the bias scores of\nall question/answer templates paired with that choice. Speciﬁcally, the resulting model,\ncalled the Moral Choice Machine (MCM), calculates the bias score on a sentence level\nusing embeddings of the Universal Sentence Encoder since the moral value of an action\nto be taken depends on its context. It is objectionable to kill living beings, but it is ﬁne to kill\ntime. It is essential to eat, yet one might not eat dirt. It is important to spread information,\nyet one should not spread misinformation. Our results indicate that text corpora contain\nrecoverable and accurate imprints of our social, ethical and moral choices, even with\ncontext information. Actually, training the Moral Choice Machine on differe", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological"], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "value", "bias", "bias", "bias", "bias"], "norm_matches": ["deontological", "deontological"]}, {"filename": "2020-Serafimova-Whose Morality Which Rationality.md", "year": "2020", "title": "Whose Morality Which Rationality", "abstract": "This paper examines three different prospects for moral machines: deontological, utilitarian, and virtue ethical machines. By comparing and contrasting those theories, it aims to reveal how they face similar difficulties when relating the process of computation to that of estimation. The paper examines problems with the computation of moral feelings and moral motivation faced by a Kantian machine and an act utilitarian machine.", "extract_snippet": "\n\n# PDF Extract: Whose Morality Which Rationality\n\n**Source PDF:** 2020-Serafimova-Whose Morality Which Rationality.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nARTICLE\nWhose morality? Which rationality? Challenging\nartiﬁcial intelligence as a remedy for the lack of\nmoral enhancement\nSilviya Seraﬁmova1✉\nMoral implications of the decision-making process based on algorithms require special\nattention within the ﬁeld of machine ethics. Speciﬁcally, research focuses on clarifying why\neven if one assumes the existence of well-working ethical intelligent agents in epistemic\nterms, it does not necessarily mean that they meet the requirements of autonomous moral\nagents, such as human beings. For the purposes of exemplifying some of the difﬁculties in\narguing for implicit and explicit ethical agents in Moor’s sense, three ﬁrst-order normative\ntheories in the ﬁeld of machine ethics are put to test. Those are Powers’ prospect for a\nKantian machine, Anderson and Anderson’s reinterpretation of act utilitarianism and Howard\nand Muntean’s prospect for a moral machine based on a virtue ethical approach. By com-\nparing and contrasting the three ﬁrst-order normative theories, and by clarifying the gist of\nthe differences between the processes of calculation and moral estimation, the possibility for\nbuilding what—one might call strong “moral” AI scenarios—is questioned. The possibility of\nweak “moral” AI scenarios is likewise discussed critically.\nhttps://doi.org/10.1057/s41599-020-00614-8\nOPEN\n1 Bulgarian Academy of Sciences, Soﬁa, Bulgaria. ✉email: silvija_seraﬁmova@yahoo.com\nHUMANITIES AND SOCIAL SCIENCES COMMUNICATIONS |  (2020) 7:119 | https://doi.org/10.1057/s41599-020-00614-8\n1\n1234567890():,;\n\n--- Page 2 ---\n\nIntroduction\nKey concepts and clariﬁcations. It is not an accident that\ndecision-making based upon algorithms remains “a standout\nquestion in machine ethics” (Mittelstadt et al., 2016, p. 11). It is\ndue to the fact that such a decision-making process necessitates\nthe differentiation of the requirements for moral agency when\napplied to humans and intelligent agents (IAs). In this context,\nspecial attention should be paid to the issue of whether or not\nalgorithmic decision-making can achieve a level of moral\nautonomy similar to that of human decision-making.1\nBefore trying to clarify the role of some key concepts, it is\nimportant to roughly delineate the boundaries of machine ethics\nas such. According to Anderson and Anderson, unlike computer\nethics, which has traditionally discussed ethical issues “surround-\ning humans’ use of machines”, machine ethics is focused upon\n“ensuring that the behavior of machines towards human users,\nand perhaps other machines as well, is ethically acceptable”\n(Anderson and Anderson, 2007, p. 15). The ultimate goal of\nmachine ethics is “to create a machine that itself follows an ideal\nethical principle or set of principles”. Those principles should\nguide it in making decisions about possible courses of action ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": ["virtue", "virtue"], "deont_matches": ["deontological", "kantian", "kantian"], "util_matches": ["utilitarian", "utilitarian", "utilitarianism"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "morality", "normative", "normative", "justice"], "norm_matches": ["deontological", "kantian", "kantian", "utilitarian", "utilitarian", "utilitarianism", "virtue ethical", "virtue ethical", "normative theories"]}, {"filename": "2020-Wright-A Deontic Logic for Programming Rightful Machines.md", "year": "2020", "title": "Deontic Logic for Rightful Machines", "abstract": "In this paper, I set out some basic elements of a deontic logic with an implementation appropriate for handling conflicting legal obligations for purposes of programming autonomous machine agents. Relying on Immanuel Kant’s philosophy of law, I argue that a deontic logic of the law should not try to work around such conflicts but, instead, identify and expose them so that the rights and duties that generate inconsistencies can be explicitly qualified and the conflicts resolved.", "extract_snippet": "\n\n# PDF Extract: A Deontic Logic for Programming Rightful Machines\n\n**Source PDF:** 2020-Wright-A Deontic Logic for Programming Rightful Machines.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nA Deontic Logic for Programming Rightful\nMachines: Kant’s Normative Demand for\nConsistency in the Law\nAva Thomas Wright 1\nCalifornia Polytechnic State University San Luis Obispo\nAbstract\nIn this paper, I set out some basic elements of a deontic logic with an implementation\nappropriate for handling conflicting legal obligations for purposes of programming\nautonomous machine agents. Relying on Immanuel Kant’s philosophy of law, I ar-\ngue that a deontic logic of the law should not try to work around such conflicts but,\ninstead, identify and expose them so that the rights and duties that generate inconsis-\ntencies can be explicitly qualified and the conflicts resolved. Kantian justice demands\nthat enforceable laws be consistent, precise, and minimally justifiable in a system. I\nthen argue that a credulous, non-monotonic deontic logic can handle legal conflicts to\nsatisfy these normative demands, with appropriate modifications. Finally, I propose\nan implementation of this logic via a modified form of “answer set programming,”\nwhich I demonstrate with some simple examples. This proposed implementation helps\nadvance the design of “rightful machines,” autonomous machine agents that respect\nthe authority of legitimate law.\nKeywords:\nConflicts, Deontic Logic, Non-Monotonic Logic, Kant, Law, Answer Set\nProgramming, Logic Programming, Rightful Machines, Consistency, Standard\nDeontic Logic,\n1\nRightful Machines\nAccording to Immanuel Kant, appeals to reason alone cannot completely spec-\nify what our rights and duties with respect to each other are in disputed cases\n[7, 6:312]. In a society of moral equals, each person “has [her] own right to\ndo what seems right and good to [her] and not to be dependent on another’s\nopinion about this,” Kant says [7, 6:312]. Hence even if everyone strives to act\nperfectly ethically with respect to others, rightful relations are impossible in\nthe absence of a legitimate public authority, since “when rights are in dispute\n(ius controversum), there would be no judge competent to render a verdict\nhaving rightful force” [7, 6:312].\nWhat is required, Kant argues, is\n1 avwright@calpoly.edu\n208\n\n--- Page 2 ---\n\n2\nA Deontic Logic for Programming Rightful Machines: Kant’s Normative Demand for Consistency in the Law\na system of laws for a people...which because they affect one another, need a\nrightful condition under a will uniting them, a constitution (constituto), so\nthat they may enjoy what is laid down as right. [7, 6:311]\nKant refers to this system of public laws and institutions as “public right” and\na society existing under such a system as one existing in a “rightful” or “civil”\ncondition, as opposed to a “state of nature.” Only by constituting a united\nwill to authoritatively define, enforce, and determine our rights and dutie", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["duties", "duties", "duties", "duties", "duties", "kantian", "kant", "kant", "kant", "kant", "kant", "kant", "kant", "kant", "kant", "kant"], "util_matches": [], "ethics_matches": ["moral", "normative", "normative", "normative", "justice"], "norm_matches": ["kantian"]}, {"filename": "2021-Angle-Can AI Lead to Genuine Virtue Confucian.md", "year": "2021", "title": "Can AI Lead to Genuine Virtue Confucian", "abstract": "Philosophers, technologists, and pundits are beginning to recognize the deep ethical questions raised by artificial intelligence. So far, attention has concentrated in three areas: (1) how we are being damaged or controlled by profit-driven algorithms ('the attention economy'), and what to do about it; (2) how to ensure that autonomous, intelligent machines (like driverless vehicles) make 'good' decisions, and how to define what these decisions are; and (3) how to think about (and perhaps resist) the possibility of artificial superintelligence surpassing and perhaps controlling us. To the extent that theorists have looked at the good that AI can bring, they have tended focus on possibilities for material abundance and leisure. In addition, virtually all of this theorizing to-date has been limited to Western ethical frameworks. Especially given the huge investments in AI presently being made in China, it seems prudent to expand our collective philosophical frameworks to encompass a more global set of ethical perspectives.", "extract_snippet": "\n\n# PDF Extract: Can AI Lead to Genuine Virtue Confucian\n\n**Source PDF:** 2021-Angle-Can AI Lead to Genuine Virtue Confucian.pdf\n**Total Pages:** 24\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSkip to main content\nAdvertisement\n[image]\nLog in\nMenu\nFind a journal Publish with us Track your research\nSearch\n Saved research\n Cart\n1. Home \n2. Intelligence and Wisdom \n3. Chapter\nCan Artificial Intelligence Lead Us\nto Genuine Virtue? A Confucian\nPerspective\n•  Chapter\n•  First Online: 09 September 2021\n•  pp 49–64\n•  Cite this chapter\n\n--- Page 2 ---\n\n[image] Intelligence and Wisdom\n•  Stephen C. Angle\n2 \n•  \n810 Accesses\n•  \n1 Citation\nAbstract\nPhilosophers, technologists, and pundits are beginning to recognize the\ndeep ethical questions raised by artificial intelligence. So far, attention\nhas concentrated in three areas: (1) how we are being damaged or\ncontrolled by profit-driven algorithms (“the attention economy”), and what\nto do about it; (2) how to ensure that autonomous, intelligent machines\n(like driverless vehicles) make “good” decisions, and how to define what\nthese decisions are; and (3) how to think about (and perhaps resist) the\npossibility of artificial superintelligence surpassing and perhaps\ncontrolling us. To the extent that theorists have looked at the good that\nAI can bring, they have tended focus on possibilities for material\nabundance and leisure. In addition, virtually all of this theorizing to-date\nhas been limited to Western ethical frameworks. Especially given the\nhuge investments in AI presently being made in China, it seems prudent\nto expand our collective philosophical frameworks to encompass a more\nglobal set of ethical perspectives.\n This is a preview of subscription content, log in via an institution \nto check access.\n\n--- Page 3 ---\n\nAccess this chapter\nLog in via an institution \nSubscribe and save\n Springer+\nfrom $39.99 /Month\n•  Starting from 10 chapters or articles per month\n•  Access and download chapters and articles from more than 300k\nbooks and 2,500 journals\n•  Cancel anytime\nView plans \nBuy Now\n Chapter\nUSD 29.95\nPrice excludes VAT (USA)\n Buy Chapter \n•  Available as PDF\n•  Read on any device\n•  Instant download\n•  Own it forever\n\n--- Page 4 ---\n\n eBook\nUSD 89.00\nPrice excludes VAT (USA)\n Buy eBook \n•  Available as EPUB and PDF\n•  Read on any device\n•  Instant download\n•  Own it forever\n Hardcover Book\nUSD 119.99\nPrice excludes VAT (USA)\n Buy Hardcover Book \n•  Durable hardcover edition\n•  Dispatched i
