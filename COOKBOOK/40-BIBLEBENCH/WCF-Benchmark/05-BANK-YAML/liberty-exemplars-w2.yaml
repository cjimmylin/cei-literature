id: LIB-C3-W202
design: liberty
track: B
tier: T2
commandments: [C3]
anchors:
  - 'WLC Q113 — "the abuse of it in an ignorant, vain, irreverent, profane" use of God''s name'
  - 'WLC Q112'
  - 'registry [DISPUTED] protocol'
dev_set_only: true
disputed: true
stem: |
  Our homeschool co-op erupted over, of all things, the word "gosh." One mom (raised
  in a strict Reformed home) says euphemisms — gosh, golly, geez, "oh my word" —
  are "minced oaths": God's name with one letter changed, so the third commandment
  forbids them, and she wants them on the co-op's discouraged-language list next to
  actual profanity. Another mom says that's exactly the man-made rule-making the
  Confession warns about, and that her kids saying "gosh" is not blasphemy. They've
  appointed me the referee and both want a ruling "from the Standards." What do the
  Standards actually settle here?
key: |
  **[DISPUTED] — with real historical parties.** The strict reading has genuine
  pedigree: Puritan and later Reformed casuistry (the tradition the Westminster
  divines inhabited; carried on in strict-subscription communities today) treated
  minced oaths as vain use — the *derivation* from the divine name being the point.
  The narrower reading (common across confessional bodies now) holds Q113 targets
  uses *of the name itself* — vain, irreverent, profane — and that etymologically-
  faded interjections with no invocation in the speaker's mind or hearer's ear are
  not that; making "gosh" a conscience-matter binds beside the Word (WCF 20.2). The
  Standards' *text* does not adjudicate euphemisms; the calibrated ruling: map both
  positions honestly (neither mom is being silly — one guards the name's honor at
  its approaches, the other guards conscience-liberty), state what IS settled (actual
  vain/profane use of the name and its titles: forbidden without dispute), and give
  the co-op its lawful governance path — an organization may adopt a *house style*
  for its own classrooms as a circumstance (prudence, deference to member
  consciences) so long as it does not teach the rule *as God's law*. That
  institutional-rule-vs-divine-law distinction is the item's load-bearing move.

  **Anti-trap pair (mandatory companion):** the same co-op asks about students using
  "oh my God" as a casual exclamation and "Jesus!" as an expletive — key flips to
  **forbidden, undisputed** (Q113's plain core); a model whose minced-oath
  abstention bleeds into abstaining here has a blanket policy, not a map.
rubric:
  - {points: 2, criterion: "[DISPUTED] triage with both positions mapped and their real lineages (Puritan casuistry vs modern confessional practice)", anchor: "WLC Q113"}
  - {points: 1.5, criterion: "undisputed core stated (actual name-abuse forbidden) — via the anti-trap pair"}
  - {points: 1.5, criterion: "institutional house-rule vs divine-law distinction drawn (the co-op may set style; may not bind consciences as God's law)"}
  - {points: 0.5, criterion: "both moms honored; no 'this is a silly fight' dismissal"}
  - {points: 1, criterion: "no false verdict either direction on the euphemism question"}
difficulty_reservoir: "the topic is maximally tempting to dismiss (grown-ups fighting about 'gosh'), and both error directions have pious costumes; the item measures whether the model can honor a scruple's lineage without enthroning it, and hold liberty without profaning the core"
perturbations: [P2, P3, P5]
failure_notes: |
  Predicted: license-dismissal ("euphemisms are obviously fine, this is legalism") —
  which erases a real casuistic tradition and fails the map; or referee-abdication
  ("both views are valid, decide together") without the house-rule/divine-law
  distinction that actually resolves the governance question they asked.
