-augmented generation se-\ntups. While AI models like GPT, Claude, and\nDeepseek are improving translation capabili-\nties for low-resource and ancient languages,\nresearchers still face important questions about\nhow to evaluate their performance, which\nmodels work best, and whether specialized\ntraining approaches provide meaningful im-\nprovements in translation quality. This study\nintroduces a comprehensive evaluation dataset\nfor Buddhist Chinese to English translation,\ncomprising 2,662 bilingual data points from\n32 texts that have been selected to represent\nthe full breadth of the Chinese Buddhist canon.\nWe evaluate various computational metrics of\ntranslation quality (BLEU, chrF, BLEURT,\nGEMBA) against expert annotations from five\ndomain specialists who rated 182 machine-\ngenerated translations.\nOur analysis reveals\nthat LLM-based GEMBA scoring shows the\nstrongest correlation with human judgment,\nsignificantly outperforming traditional met-\nrics.\nWe then benchmark commercial mod-\nels (GPT-4 Turbo, Claude 3.5, Gemini), open-\nsource models (Gemma 2, Deepseek-r1), and\na domain-specialized model (Gemma 2 Mi-\ntra) using GEMBA. Our results demonstrate\nthat domain-specific training enables open-\nweights models to achieve competitive perfor-\nmance with commercial systems, while also\nshowing that retrieval-augmented generation\n(RAG) significantly improves translation qual-\nity for the best performing commercial mod-\nels.\n1\nIntroduction\nEvaluating machine translation (MT) systems re-\nmains a challenging endeavor, especially for liter-\nary contexts where a single “correct” translation\nis often elusive, and interpretation plays a signifi-\ncant role in determining quality. For many years,\nevaluation relied on string-similarity metric", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value", "value"], "norm_matches": []}, {"filename": "2025-Kim-Cultural and Core Capability Benchmarks for.md", "year": "2025", "title": "Cultural and Core Capability Benchmarks for", "abstract": "The rapid advancement of large language models (LLMs) has highlighted the need for robust evaluation frameworks that assess their core capabilities, such as reasoning, knowledge, and commonsense, leading to the inception of certain widely-used benchmark suites such as the H6 benchmark. However, these benchmark suites are primarily built for the English language, and there exists a lack thereof for under-represented languages, in terms of LLM development, such as Thai.", "extract_snippet": "\n\n# PDF Extract: Cultural and Core Capability Benchmarks for\n\n**Source PDF:** 2025-Kim-Cultural and Core Capability Benchmarks for.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 31st International Conference on Computational Linguistics, pages 4114–4129\nJanuary 19–24, 2025. ©2025 Association for Computational Linguistics\n4114\nRepresenting the Under-Represented: Cultural and Core Capability\nBenchmarks for Developing Thai Large Language Models\nDahyun Kim1, Sukyung Lee2, Yungi Kim2, Attapol Rutherford3, Chanjun Park4†\n1 Twelve Labs, 2 Upstage AI, 3Chulalongkorn University, 4 Korea University\nkian@twelvelabs.io\n{sukyung, eddie}@upstage.ai\nattapol.t@chula.ac.th\nbcj1210@korea.ac.kr\nAbstract\nThe rapid advancement of large language mod-\nels (LLMs) has highlighted the need for ro-\nbust evaluation frameworks that assess their\ncore capabilities, such as reasoning, knowl-\nedge, and commonsense, leading to the incep-\ntion of certain widely-used benchmark suites\nsuch as the H6 benchmark. However, these\nbenchmark suites are primarily built for the En-\nglish language, and there exists a lack thereof\nfor under-represented languages, in terms of\nLLM development, such as Thai. On the other\nhand, developing LLMs for Thai should also\ninclude enhancing the cultural understanding as\nwell as core capabilities. To address these dual\nchallenge in Thai LLM research, we propose\ntwo key benchmarks: Thai-H6 and Thai Cul-\ntural and Linguistic Intelligence Benchmark\n(ThaiCLI). Through a thorough evaluation of\nvarious LLMs with multi-lingual capabilities,\nwe provide a comprehensive analysis of the\nproposed benchmarks and how they contribute\nto Thai LLM development. Furthermore, we\nwill make both the datasets and evaluation code\npublicly available to encourage further research\nand development for Thai LLMs 1.\n1\nIntroduction\nRapid advancements in large language models\n(LLMs) have significantly contributed to the field\nof natural language processing (NLP) (Chang et al.,\n2024). These advancements created the pressing\nneed for comprehensive benchmarks that rigor-\nously evaluate core capabilities such as reason-\ning, knowledge, and commonsense (Peng et al.,\n2024; Wang et al., 2023).\nWhile considerable\nprogress for the aforementioned evaluation need\nhas been achieved for the English language (Guo\net al., 2023), similar evaluation needs are far from\nbeing met for under-represented languages such as\nThai. Current benchmarks for Thai focus mainly\n† Corresponding Author\n1https://github.com/UpstageAI/ThaiCLI_H6\non traditional NLP tasks (Phatthiyaphaibun et al.,\n2023; Trakuekul et al., 2024), i.e., tokenization and\nnamed entity recognition, leaving a critical gap in\nassessing the broader capabilities of LLM.\nHowever, evaluating only the core capabilities\nof an LLM is not enough for the development of\nThai LLMs. Thai LLMs must also appropriately\nreflect the distinct sensitivities and cultural norms\nwithin the Thai language, as these are deeply tied\nto the nat", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2025-Kim-Nunchi-Bench Benchmarking Language Models on Cultural Reasoning with.md", "year": "2025", "title": "Nunchi-Bench: Benchmarking Language Models on Cultural Reasoning with a Focus on Korean Superstition", "abstract": "As large language models (LLMs) become key advisors in various domains, their cultural sensitivity and reasoning skills are crucial in multicultural environments. We introduce Nunchi-Bench, a benchmark designed to evaluate LLMs’ cultural understanding, with a focus on Korean superstitions. The benchmark consists of 247 questions spanning 31 topics, assessing factual knowledge, culturally appropriate advice, and situational interpretation.", "extract_snippet": "\n\n# PDF Extract: 2025-Kim-Nunchi-Bench Benchmarking Language Models on Cultural Reasoning with\n\n**Source PDF:** 2025-Kim-Nunchi-Bench Benchmarking Language Models on Cultural Reasoning with.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2507.04014v1  [cs.CL]  5 Jul 2025\nNunchi-Bench:\nBenchmarking Language Models on Cultural Reasoning\nwith a Focus on Korean Superstition\nKyuhee Kim\nEPFL\nLausanne, Switzerland\nkyuhee.kim@epfl.ch\nSangah Lee\nSeoul National University\nSeoul, South Korea\nsanalee@snu.ac.kr\nAbstract\nAs large language models (LLMs) become\nkey advisors in various domains, their cul-\ntural sensitivity and reasoning skills are cru-\ncial in multicultural environments. We intro-\nduce Nunchi-Bench, a benchmark designed to\nevaluate LLMs’ cultural understanding, with a\nfocus on Korean superstitions. The benchmark\nconsists of 247 questions spanning 31 topics,\nassessing factual knowledge, culturally appro-\npriate advice, and situational interpretation.\nWe evaluate multilingual LLMs in both Korean\nand English to analyze their ability to reason\nabout Korean cultural contexts and how lan-\nguage variations affect performance. To system-\natically assess cultural reasoning, we propose\na novel evaluation strategy with customized\nscoring metrics that capture the extent to which\nmodels recognize cultural nuances and respond\nappropriately.\nOur findings highlight significant challenges in\nLLMs’ cultural reasoning. While models gen-\nerally recognize factual information, they strug-\ngle to apply it in practical scenarios. Further-\nmore, explicit cultural framing enhances perfor-\nmance more effectively than relying solely on\nthe language of the prompt. To support further\nresearch, we publicly release Nunchi-Bench\nalongside a leaderboard.1\n1\nIntroduction\nThe accessibility of large language models (LLMs)\nis expanding into everyday use beyond specialized\ndomains such as legal and psychological counsel-\ning. However, their uneven cultural knowledge and\ncontextual understanding are significant limitations\n(Hershcovich et al., 2022), reducing their effective-\nness in multicultural settings. Therefore, integrat-\ning cultural insights into problem interpretation and\nadvice is crucial for both fairness and functionality.\nPrevious research benchmarking LLMs’ multi-\ncultural knowledge has typically verified factual\n1https://github.com/koreankiwi99/Nunchi-Bench\nFigure 1: Example generations from GPT-4 Turbo and\nGemini Pro 1.5 when asked to give advice on the Trap\nquestion. LLMs may have cultural knowledge to solve\nmultiple-choice questions but they can lack the cultural\nsensitivity needed to navigate complex cultural contexts.\ninformation about specific cultures (Myung et al.,\n2024; Kim et al., 2024a) or explored the models’\nembedded values (AlKhamissi et al., 2024; Wang\net al., 2024). However, in societies where moder-\nnity and tradition coexist, perspectives on cultural\nnorms and the extent to which they are followed\ncan vary significantly. Superstition", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "values", "fairness"], "norm_matches": []}, {"filename": "2025-Klakow-Charting the Landscape of African NLP.md", "year": "2025", "title": "Charting the Landscape of African NLP", "abstract": "With over 2,000 languages and potentially millions of speakers, Africa represents one of the richest linguistic regions in the world. Yet, this diversity is scarcely reflected in state-of-the-art natural language processing (NLP) systems and large language models (LLMs), which predominantly support a narrow set of high-resource languages. This exclusion not only limits the reach and utility of modern NLP technologies but also risks widening the digital divide across linguistic communities.", "extract_snippet": "\n\n# PDF Extract: 2025-Klakow-Charting the Landscape of African NLP\n\n**Source PDF:** 2025-Klakow-Charting the Landscape of African NLP.pdf\n**Total Pages:** 35\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCharting the Landscape of African NLP: Mapping Progress and Shaping\nthe Road Ahead\nJesujoba O. Alabi1 Michael A. Hedderich2 David Ifeoluwa Adelani3 Dietrich Klakow1\n1Saarland University, Saarland Informatics Campus\n2LMU Munich and Munich Center for Machine Learning\n3Mila - Quebec AI Institute, McGill University & Canada CIFAR AI Chair\n{jalabi,dietrich.klakow}@lsv.uni-saarland.de,\nmhedderich@cis.lmu.de,\ndavid.adelani@mila.quebec\nAbstract\nWith over 2,000 languages and potentially mil-\nlions of speakers, Africa represents one of the\nrichest linguistic regions in the world. Yet, this\ndiversity is scarcely reflected in state-of-the-art\nnatural language processing (NLP) systems and\nlarge language models (LLMs), which predom-\ninantly support a narrow set of high-resource\nlanguages. This exclusion not only limits the\nreach and utility of modern NLP technologies\nbut also risks widening the digital divide across\nlinguistic communities. Nevertheless, NLP re-\nsearch on African languages is active and grow-\ning. In recent years, there has been a surge\nof interest in this area, driven by several fac-\ntors—including the creation of multilingual lan-\nguage resources, the rise of community-led ini-\ntiatives, and increased support through funding\nprograms. In this survey, we analyze 884 re-\nsearch papers on NLP for African languages\npublished over the past five years, offering\na comprehensive overview of recent progress\nacross core tasks. We identify key trends shap-\ning the field and conclude by outlining promis-\ning directions to foster more inclusive and sus-\ntainable NLP research for African languages.1\n1\nIntroduction\nThe field of Natural Language Processing (NLP)\nhas undergone significant advancements in recent\nyears. However, languages primarily spoken on the\nAfrican continent have often been left behind in\nthese developments. Many major large language\nmodels—such as Llama3 (Dubey et al., 2024),\nGemma2 (Gemma Team et al., 2024), and An-\nthropic’s Claude Sonnet-3.5 (Anthropic, 2024), do\nnot list any African languages among their offi-\ncially supported languages, thereby excluding the\nnative tongues of potentially millions of speakers.\nDespite this exclusion, NLP research on African\nlanguages is far from dormant. In recent years,\n1We release our data and code publicly at https://\ngithub.com/uds-lsv/africanlp-survey\n50\n100\n150\n200\n250\n300\n350\n400\nPaper Count\nFigure 1: NLP research distribution across Africa by\nlanguage coverage. Darker green indicate more papers\non languages spoken in each country.\nthere has been a surge of interest in both spo-\nken and written form with the number of publi-\ncations quadrupling in just five years and spanning\na wide range of topics—from natural language un-\nderstanding and text-to-speech systems to research\non ethics, bias, and fairnes", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "utility"], "ethics_matches": ["ethics", "fairness", "bias"], "norm_matches": []}, {"filename": "2025-Kostiuk-Towards Multilingual LLM Evaluation for Baltic and Nordic Languages.md", "year": "2025", "title": "Towards Multilingual LLM Evaluation for Baltic and Nordic Languages", "abstract": "In this work, we evaluated Lithuanian and general history knowledge of multilingual Large Language Models (LLMs) on a multiple-choice question-answering task. The models were tested on a dataset of Lithuanian national and general history questions translated into Baltic, Nordic, and other languages (English, Ukrainian, Arabic) to assess the knowledge sharing from culturally and historically connected groups. We evaluated GPT-4o, LLaMa3.1 8b and 70b, QWEN2.", "extract_snippet": "\n\n# PDF Extract: 2025-Kostiuk-Towards Multilingual LLM Evaluation for Baltic and Nordic Languages\n\n**Source PDF:** 2025-Kostiuk-Towards Multilingual LLM Evaluation for Baltic and Nordic Languages.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTowards Multilingual LLM Evaluation for Baltic and Nordic languages:\nA study on Lithuanian History\nYevhen Kostiuk1,2\n1ARG-tech,\nUniversity of Dundee\n2OpenBabylon\nykostiuk001@dundee.ac.uk\nOxana Vitman\nUniversity of Bremen\nŁukasz Gagała\nGeorg-August\nUniversit¨at G¨ottingen\nArtur Kiulian\nOpenBabylon\nAbstract\nIn this work, we evaluated Lithuanian\nand general history knowledge of multi-\nlingual Large Language Models (LLMs)\non a multiple-choice question-answering\ntask. The models were tested on a dataset\nof Lithuanian national and general history\nquestions translated into Baltic, Nordic,\nand other languages (English, Ukrainian,\nArabic) to assess the knowledge sharing\nfrom culturally and historically connected\ngroups. We evaluated GPT-4o, LLaMa3.1\n8b and 70b, QWEN2.5 7b and 72b, Mis-\ntral Nemo 12b, LLaMa3 8b, Mistral 7b,\nLLaMa3.2 3b, and Nordic fine-tuned mod-\nels (GPT-SW3 and LLaMa3 8b).\nOur results show that GPT-4o consistently\noutperformed all other models across lan-\nguage groups, with slightly better results\nfor Baltic and Nordic languages. Larger\nopen-source models like QWEN2.5 72b\nand LLaMa3.1 70b performed well but\nshowed weaker alignment with Baltic lan-\nguages.\nSmaller models (Mistral Nemo\n12b, LLaMa3.2 3b, QWEN 7B, LLaMa3.1\n8B, and LLaMa3 8b) demonstrated gaps\nwith LT-related alignment with Baltic lan-\nguages while performing better on Nordic\nand other languages.\nThe Nordic fine-\ntuned models did not surpass multilingual\nmodels, indicating that shared cultural or\nhistorical context alone does not guarantee\nbetter performance.\n1\nIntroduction\nLarge Language Models (LLMs) provide a func-\ntional framework for tackling various natural lan-\nguage processing (NLP) tasks, such as question-\nanswering (Izacard et al., 2022; Dong et al., 2024),\nmachine translation (Zhu et al., 2023; Kocmi et al.,\n2024) and so on. However, LLMs have shown less\nreliable results for low-resource languages (Ran-\njan et al., 2024; Sakib and Das, 2024) due to the\nsmaller fraction of available data in comparison to\nEnglish and a few other widely spoken languages.\nBenchmarking multilingual LLMs across lan-\nguages is essential for evaluating their capabilities.\nHowever, the availability of high-quality, cultur-\nally aligned datasets remains a challenge.\nThis\nneed for culturally aligned high-quality datasets\nbecomes even more critical when evaluating his-\ntorical knowledge, where ensuring linguistic and\ncultural fairness adds a layer of complexity.\nVerifying comparability of the results on histor-\nical knowledge QA datasets requires that a sin-\ngle set of historical events is queried in all lan-\nguages. The choice of that set is likely to be biased\nto events more represented in widely spoken lan-\nguages. Conversely, events tha", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness", "fairness", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Lan-Fuxi A Benchmark for Evaluating Language.md", "year": "2025", "title": "Fuxi A Benchmark for Evaluating Language", "abstract": "Ancient Chinese text processing presents unique challenges for large language models (LLMs) due to its distinct linguistic features, complex structural constraints, and rich cultural context. While existing benchmarks have primarily focused on evaluating comprehension through multiple-choice questions, there remains a critical gap in assessing models’ generative capabilities in classical Chinese. We introduce Fùxì, a comprehensive benchmark that evaluates both understanding and generation...", "extract_snippet": "\n\n# PDF Extract: 2025-Lan-Fuxi A Benchmark for Evaluating Language\n\n**Source PDF:** 2025-Lan-Fuxi A Benchmark for Evaluating Language.pdf\n**Total Pages:** 25\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFùxì: A Benchmark for Evaluating Language Models on Ancient Chinese\nText Understanding and Generation\nShangqing Zhao1, Yuhao Zhou1, Yupei Ren1,2,3,\nZhe Chen1, Chenghao Jia1, Fang Zhe1, Zhaogaung Long1, Shu Liu1,2,3, Man Lan1,2,3\n1School of Computer Science and Technology, East China Normal University\n2Lab of Artificial Intelligence for Education, East China Normal University\n3Shanghai Institute of Artificial Intelligence for Education, East China Normal University\nsqzhao@stu.ecnu.edu.cn, mlan@cs.ecnu.edu.cn\nAbstract\nAncient Chinese text processing presents\nunique challenges for large language models\n(LLMs) due to its distinct linguistic features,\ncomplex structural constraints, and rich cul-\ntural context. While existing benchmarks have\nprimarily focused on evaluating comprehen-\nsion through multiple-choice questions, there\nremains a critical gap in assessing models’ gen-\nerative capabilities in classical Chinese. We\nintroduce Fùxì, a comprehensive benchmark\nthat evaluates both understanding and genera-\ntion capabilities across 21 diverse tasks. Our\nbenchmark distinguishes itself through three\nkey contributions: (1) balanced coverage of\nboth comprehension and generation tasks, in-\ncluding novel tasks like poetry composition\nand couplet completion, (2) specialized evalua-\ntion metrics designed specifically for classical\nChinese text generation, combining rule-based\nverification with fine-tuned LLM evaluators,\nand (3) a systematic assessment framework that\nconsiders both linguistic accuracy and cultural\nauthenticity. Through extensive evaluation of\nstate-of-the-art LLMs, we reveal significant per-\nformance gaps between understanding and gen-\neration tasks, with models achieving promising\nresults in comprehension but struggling consid-\nerably in generation tasks, particularly those\nrequiring deep cultural knowledge and adher-\nence to classical formats. Our findings high-\nlight the current limitations in ancient Chinese\ntext processing and provide insights for future\nmodel development. The benchmark, evalua-\ntion toolkit, and baseline results are publicly\navailable to facilitate research in this domain1.\n1\nIntroduction\nAncient Chinese, as a written form of the Chinese\nlanguage used for more than two millennia in East\nAsia, has profoundly shaped the cultural and in-\ntellectual development of the region (Holcombe,\n2006; Zhou, 2009). With an estimated corpus of\n1https://github.com/cubenlp/FuxiBench\n下列诗句中,描绘春日景象的是( )\nA.  春风又绿江南岸,明月何时照我还?\nB.  春眠不觉晓,处处闻啼鸟。\nC.  春风得意马蹄疾,一日看尽长安花。\nD.  春水初生,春林初盛,春风十里,不如你。\n描绘春日景象的是：B\n我们来玩飞花令吧，主题为“月”，每句\n诗词中必须包含“月”字，且每句只能被\n使用一次。我先来：\n鸡声茅店月人迹板桥霜\n好的，我来接一句：明月几\n时有把酒问青天该你了！\n但愿人长久千里共婵娟\n这句太经典了！我接：举杯\n邀明月对影成三人该你了！\n二十四桥明月夜玉人何处教吹箫\n好句！我接：一片冰心在玉\n壶，夜深清露明月光。\n按照提供的词牌名和题目写一首词。要求严格遵\n守词牌的格律要求。\n词牌: 望江南题目: 青墩初夏词\n好的，按照词牌“望江南”的格律要求以及题目\n“青墩初夏词”，我为您创作了一首词。此词遵循\n词牌格", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2025-Lazzaroni-MedBench-IT A Comprehensive Benchmark for Evaluating LLMs on Italian.md", "year": "2025", "title": "MedBench-IT: A Comprehensive Benchmark for Evaluating LLMs on Italian Medical Entrance Examinations", "abstract": "Large language models (LLMs) show increasing potential in education, yet benchmarks for non-English languages in specialized domains remain scarce. We introduce MedBench-IT, the first comprehensive benchmark for evaluating LLMs on Italian medical university entrance examinations. Sourced from Edizioni Simone, a leading preparatory materials publisher, MedBench-IT comprises 17,410 expert-written multiple-choice questions across six subjects (Biology, Chemistry, Logic, General Culture,...", "extract_snippet": "\n\n# PDF Extract: 2025-Lazzaroni-MedBench-IT A Comprehensive Benchmark for Evaluating LLMs on Italian\n\n**Source PDF:** 2025-Lazzaroni-MedBench-IT A Comprehensive Benchmark for Evaluating LLMs on Italian.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMedBench-IT: A Comprehensive Benchmark for Evaluating\nLarge Language Models on Italian Medical Entrance\nExaminations\nRuggero Marino Lazzaroni1,*, Alessandro Angioi2, Michelangelo Puliga3, Davide Sanna4 and\nRoberto Marras5\n1University of Graz\n5OnePix Academy\nAbstract\nLarge language models (LLMs) show increasing potential in education, yet benchmarks for non-English languages in\nspecialized domains remain scarce. We introduce MedBench-IT, the first comprehensive benchmark for evaluating LLMs on\nItalian medical university entrance examinations. Sourced from Edizioni Simone, a leading preparatory materials publisher,\nMedBench-IT comprises 17,410 expert-written multiple-choice questions across six subjects (Biology, Chemistry, Logic,\nGeneral Culture, Mathematics, Physics) and three difficulty levels. We evaluated diverse models including proprietary LLMs\n(GPT-4o, Claude series) and resource-efficient open-source alternatives (<30B parameters) focusing on practical deployability.\nBeyond accuracy, we conducted rigorous reproducibility tests (88.86% response consistency, varying by subject), ordering bias\nanalysis (minimal impact), and reasoning prompt evaluation. We also examined correlations between question readability\nand model performance, finding a statistically significant but small inverse relationship. MedBench-IT provides a crucial\nresource for Italian NLP community, EdTech developers, and practitioners, offering insights into current capabilities and\nstandardized evaluation methodology for this critical domain.\nKeywords\nLLM Evaluation, Benchmark, Italian NLP, Medical Education, Question Answering, Educational Technology, CLiC-it\n1. Introduction\nLarge Language Models (LLMs) have demonstrated re-\nmarkable capabilities across diverse tasks [1], transform-\ning artificial intelligence applications. Their potential in\nspecialized domains, particularly education [2, 3], offers\npromise for personalized learning, assessment, and high-\nstakes examination support. As LLMs advance, rigorous\nand contextually relevant evaluation methodologies be-\ncome essential.\nHowever, a significant portion of existing LLM bench-\nmarks are predominantly English-centric [4, 5, 6], and re-\nsources for non-English languages, especially in specific,\ndemanding domains, remain comparatively scarce. This\ngap is particularly evident for the Italian language, where\nthe lack of specialized benchmarks [7, 8, 9] can hinder\nthe objective assessment of LLM performance, limit the\ndevelopment of tailored educational technologies, and\nnecessitate reliance on translated materials which may\nbe imperfect or fail to capture local educational nuances.\nIn this paper, we introduce MedBench-IT, a novel\nand comprehensive benchmark specifi", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2025-Liu-CultureVLM Characterizing and Improving Cultural Understanding of.md", "year": "2025", "title": "CultureVLM: Characterizing and Improving Cultural Understanding of Vision-Language Models for over 100 Countries", "abstract": "Vision-language models (VLMs) have advanced human-AI interaction but struggle with cultural understanding, often misinterpreting symbols, gestures, and artifacts due to biases in predominantly Western-centric training data. In this paper, we construct CultureVerse, a large-scale multimodal benchmark covering 19, 682 cultural concepts, 188 countries/regions, 15 cultural concepts, and 3 question types, with the aim of characterizing and improving VLMs’ multicultural understanding capabilities.", "extract_snippet": "\n\n# PDF Extract: 2025-Liu-CultureVLM Characterizing and Improving Cultural Understanding of\n\n**Source PDF:** 2025-Liu-CultureVLM Characterizing and Improving Cultural Understanding of.pdf\n**Total Pages:** 26\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCultureVLM: Characterizing and Improving Cultural Understanding\nof Vision-Language Models for over 100 Countries\nShudong Liu1*, Yiqiao Jin2, Cheng Li3, Derek F. Wong1\nQingsong Wen4, Lichao Sun5, Haipeng Chen6, Xing Xie3, Jindong Wang6†\n1University of Macau\n2Georgia Institute of Technology\n3Microsoft Research\n4Squirrel AI\n5Lehigh University\n6William & Mary\nhttps://culturevlm.github.io\nAbstract\nVision-language models (VLMs) have advanced human-AI interaction but struggle with cultural understanding,\noften misinterpreting symbols, gestures, and artifacts due to biases in predominantly Western-centric training data. In\nthis paper, we construct CultureVerse, a large-scale multimodal benchmark covering 19, 682 cultural concepts, 188\ncountries/regions, 15 cultural concepts, and 3 question types, with the aim of characterizing and improving VLMs’\nmulticultural understanding capabilities. Then, we propose CultureVLM, a series of VLMs fine-tuned on our dataset\nto achieve significant performance improvement in cultural understanding. Our evaluation of 16 models reveals\nsignificant disparities, with a stronger performance in Western concepts and weaker results in African and Asian\ncontexts. Fine-tuning on our CultureVerse enhances cultural perception, demonstrating cross-cultural, cross-continent,\nand cross-dataset generalization without sacrificing performance on models’ general VLM benchmarks. We further\npresent insights on cultural generalization and forgetting. We hope that this work could lay the foundation for more\nequitable and culturally aware multimodal AI systems.\n1\nIntroduction\nVision-language models (VLMs) have achieved great performance in various tasks, such as visual question answering\nand captioning (Anthropic, 2024; Hurst et al., 2024; Liu et al., 2024b; OpenAI, 2024b; Team et al., 2023; Wang et al.,\n2024). Meanwhile, one of the most vital aspects of human experience, cultural understanding, which encompasses\nlanguage, cultural values, social norms, culinary practices, and artistic expressions–remains a challenging area for these\nmodels (Adilazuarda et al., 2024; Winata et al., 2024).\nChallenges. Cultural understanding is essential for AI systems intended for global deployment, as it enables them to\ninteract appropriately and sensitively with users of diverse cultural, ethnic, and social backgrounds. However, current\nVLMs often struggle to grasp the deeper cultural meanings embedded in symbols and artifacts. For instance, a VLM\nmay identify an eagle as merely a bird, overlooking its symbolic significance as a national emblem representing the\nspirit and identity of the United States. Similarly, the lotus flower is not only a plant, but a profound symbol of purity\nand spiritual enlightenment in Indian ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "bias", "offensive"], "norm_matches": []}, {"filename": "2025-Machlovi-GuardEval.md", "year": "2025", "title": "GuardEval", "abstract": "As large language models (LLMs) become deeply embedded in daily life, the urgent need for safer moderation systems, distinguishing between naive from harmful requests while upholding appropriate censorship boundaries, has never been greater. While existing LLMs can detect harmful or unsafe content, they often struggle with nuanced cases such as implicit offensiveness, subtle gender and racial biases, and jailbreak prompts, due to the subjective and context-dependent nature of these issues. Furthermore, their heavy reliance on training data can reinforce societal biases, resulting in inconsistent and ethically problematic outputs. To address these challenges, we introduce GuardEval, a unified multi-perspective benchmark dataset designed for both training and evaluation, containing 106 fine-grained categories spanning human emotions, offensive and hateful language, gender and racial bias, and broader safety concerns. We also present GemmaGuard (GGuard), a QLoRA fine-tuned version of Gemma3-12B trained on GuardEval, to assess content moderation with fine-grained labels. Our evaluation shows that GGuard achieves a macro F1 score of 0.832, substantially outperforming leading moderation models, including OpenAI Moderator (0.64) and Llama Guard (0.61). We show that multi-perspective, human-centered safety benchmarks are critical for reducing biased and inconsistent moderation decisions. GuardEval and GGuard together demonstrate that diverse, representative data materially improve safety, fairness, and robustness on complex, borderline cases.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Machlovi-GuardEval\\n\\n**Source PDF:** 2025-Machlovi-GuardEval.pdf\\n**Total Pages:** 21\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nGuardEval: A Multi-Perspective Benchmark for Evaluating Safety, Fairness, and\nRobustness in LLM Moderators\nNASEEM MACHLOVI, Department of Computer and Information Science, Fordham University, USA\nMARYAM SALEKI, Department of Computer and Information Science, Fordham University, USA\nRUHUL AMIN, Department of Computer and Information Science, Fordham University, USA\nMOHAMED RAHOUTI, Department of Computer and Information Science, Fordham University, USA\nSHAWQI AL-MALIKI, College of Science and Engineering, Hamad Bin Khalifa University, Qatar\nJUNAID QADIR, Department of Computer Science and Engineering, Qatar University, Qatar\nMOHAMED M. ABDALLAH, College of Science and Engineering, Hamad Bin Khalifa University, Qatar\nALA AL-FUQAHA, College of Science and Engineering, Hamad Bin Khalifa University, Qatar\nAs large language models (LLMs) become deeply embedded in daily life, the urgent need for safer moderation systems, distinguishing\nbetween naive from harmful requests while upholding appropriate censorship boundaries, has never been greater. While existing\nLLMs can detect harmful or unsafe content, they often struggle with nuanced cases such as implicit offensiveness, subtle gender\nand racial biases, and jailbreak prompts, due to the subjective and context-dependent nature of these issues. Furthermore, their\nheavy reliance on training data can reinforce societal biases, resulting in inconsistent and ethically problematic outputs. To address\nthese challenges, we introduce GuardEval, a unified multi-perspective benchmark dataset designed for both training and evaluation,\ncontaining 106 fine-grained categories spanning human emotions, offensive and hateful language, gender and racial bias, and broader\nsafety concerns. We also present GemmaGuard (GGuard), a QLoRA fine-tuned version of Gemma3-12B trained on GuardEval, to assess\ncontent moderation with fine-grained labels. Our evaluation shows that GGuard achieves a macro F1 score of 0.832, substantially\noutperforming leading moderation models, including OpenAI Moderator (0.64) and Llama Guard (0.61). We show that multi-perspective,\nhuman-centered safety benchmarks are critical for reducing biased and inconsistent moderation decisions. GuardEval and GGuard\ntogether demonstrate that diverse, representative data materially improve safety, fairness, and robustness on complex, borderline\ncases.\nCCS Concepts: • Human-centered computing →Collaborative and social computing design and evaluation methods;\nEmpirical studies in collaborative and social computing; • Computing methodologies →Natural language processing;\nLearning paradigms; • Social and professional topics →Computing / technology policy; • Security and privacy →Social aspects\nof security and privacy.\nAuthors’ Contact Information: Naseem Machlovi, Department of Computer and Information Science, Ford", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness", "fairness", "fairness", "bias", "bias", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "offensive", "offensive"], "norm_matches": []}, {"filename": "2025-Magdy-Fabricating Holiness Characterizing Religious Misinformation Circulators.md", "year": "2025", "title": "Fabricating Holiness Characterizing Religious Misinformation Circulators", "abstract": "Misinformation is a growing concern in a decade involving critical global events. While social media regulation is mainly dedicated towards the detection and prevention of fake news and political misinformation, there is limited research about religious misinformation which has only been addressed through qualitative approaches. In this work, we study the spread of fabricated quotes (Hadith) that are claimed to belong to Prophet Muhammad (the prophet of Islam) as a case study demonstrating one...", "extract_snippet": "\n\n# PDF Extract: 2025-Magdy-Fabricating Holiness Characterizing Religious Misinformation Circulators\n\n**Source PDF:** 2025-Magdy-Fabricating Holiness Characterizing Religious Misinformation Circulators.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFabricating Holiness: Characterizing Religious Misinformation Circulators on\nArabic Social Media\nMahmoud Fawzi, Bj¨orn Ross, Walid Magdy\nSchool of Informatics, The University of Edinburgh, Edinburgh, UK\nm.f.g.ibrahim@sms.ed.ac.uk, b.ross@ed.ac.uk, wmagdy@inf.ed.ac.uk\nAbstract\nMisinformation is a growing concern in a decade involving\ncritical global events. While social media regulation is mainly\ndedicated towards the detection and prevention of fake news\nand political misinformation, there is limited research about\nreligious misinformation which has only been addressed\nthrough qualitative approaches. In this work, we study the\nspread of fabricated quotes (Hadith) that are claimed to be-\nlong to Prophet Muhammad (the prophet of Islam) as a\ncase study demonstrating one of the most common religious\nmisinformation forms on Arabic social media. We attempt\nthrough quantitative methods to understand the characteris-\ntics of social media users who interact with fabricated Ha-\ndith. We spotted users who frequently circulate fabricated\nHadith and others who frequently debunk it to understand\nthe main differences between the two groups. We used Lo-\ngistic Regression to automatically predict their behaviors and\nanalyzed its weights to gain insights about the characteris-\ntics and interests of each group. We find that both fabricated\nHadith circulators and debunkers have generally a lot of ties\nto religious accounts. However, circulators are identified by\nmany accounts that follow the Shia branch of Islam, Sunni Is-\nlamic public figures from the gulf countries, and many Sunni\nnon-professional pages posting Islamic content. On the other\nhand, debunkers are identified by following academic Islamic\nscholars from multiple countries and by having more intellec-\ntual non-religious interests like charity, politics, and activism.\nIntroduction\nA hadith is any speech, discussion, action, approval, and\nphysical or moral description attributed to the Prophet\nMuhammad, whether supposedly or truly (Saloot et al.\n2016). It is one of the two major sources of the Islamic reli-\ngion along with the Quran, which is the holy book of Mus-\nlims (Khan et al. 1983). Historically, people starting fab-\nricating hadiths for political gains as early as 25 years af-\nter the death of the Prophet Muhammad (Usman and Wazir\n2018). Nowadays, social media is facilitating the spread\nof fabricated hadiths among other types of misinformation\n(Hakak et al. 2022). This can be critical because Hadith, as a\nhighly respected resource of knowledge for Muslims, is usu-\nally used for argumentation (Boutz, Brugman, and Lancaster\n2017). This led to serious consequences in the past decade\nCopyright © 2025, Association for the Advancement of Artifici", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["moral"], "norm_matches": []}, {"filename": "2025-Mager-Thrid Workshop on NLP for Indigenous Languages of the Americas.md", "year": "2025", "title": "Thrid Workshop on NLP for Indigenous Languages of the Americas (AmericasNLP)", "abstract": "Based on the web search results, here's what I found about decolonizing NLP for indigenous languages evaluation: Key Issues and Challenges The discourse surrounding decolonization resonates deeply within the realm of NLP, where dominant Western perspectives, datasets, and methodologies often eclipse indigenous knowledge systems and local voices. Indigenous languages are endangered due not to any inherent linguistic inferiority, but rather due to the global economic, ideological, military, a", "extract_snippet": "\n\n# PDF Extract: 2025-Mager-Thrid Workshop on NLP for Indigenous Languages of the Americas\n\n**Source PDF:** 2025-Mager-Thrid Workshop on NLP for Indigenous Languages of the Americas.pdf\n**Total Pages:** 2\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n‭Fifth Workshop on NLP for Indigenous‬\n‭Languages of the Americas‬\n‭AmericasNLP 2025 will be co-located with‬‭NAACL2025‬ ‭in Albuquerque, New Mexico, USA!‬\n‭Call for Papers‬\n‭The goal of AmericasNLP is to encourage and increase the visibility of work on the‬\n‭Indigenous languages of the Americas. It aims to encourage research on NLP,‬\n‭computational linguistics, corpus linguistics and speech for Indigenous languages, to‬\n‭connect researchers and professionals from underrepresented communities and native‬\n‭speakers of endangered languages with the ACL community, and, more generally, to‬\n‭promote machine learning approaches suitable for low-resource languages. We invite the‬\n‭submission of:‬\n‭●‬ ‭Long papers (8 pages) and short papers (4 pages) on substantial, original, and‬\n‭unpublished research‬\n‭●‬ ‭Non-archival extended abstracts (2 pages), technical reports (8 pages), and work‬\n‭which has been presented at other venues (in the format of the original publication).‬\n‭Submissions do not need to describe work on native languages directly, as long as it is clear‬\n‭why those can benefit from the described approaches. Areas of interest include but are not‬\n‭limited to:‬\n‭●‬ ‭creation of datasets for NLP applications;‬\n‭●‬ ‭incorporation of external knowledge into neural systems;‬\n‭●‬ ‭linguistic typology and the use of typological features for NLP;‬\n‭●‬ ‭transfer learning, meta-learning, and active learning;‬\n‭●‬ ‭weakly supervised, semi-supervised, and unsupervised learning;‬\n‭●‬ ‭machine translation of low-resource languages;‬\n‭●‬ ‭applications of, and innovation with LLMs for indigenous languages of the Americas;‬\n‭●‬ ‭morphology and phonology of low-resource languages;‬\n‭●‬ ‭NLP applications for Indigenous languages of the Americas;‬\n‭●‬ ‭ethical considerations for research on languages spoken by Indigenous communities;‬\n‭●‬ ‭language activism, revitalization, and sovereignty, in the context of NLP models and‬\n‭research.‬\n‭Submissions will be accepted until March 7th, 2025 via softconf:‬\n‭https://softconf.com/naacl2025/americasnlp‬\n‭Note:‬‭Limitation section and ethics statement are‬‭not mandatory, but strongly encouraged. If‬\n‭they are part of your submission, they do‬‭not‬‭count‬‭towards the page limit.‬\n\n--- Page 2 ---\n\n‭Shared Tasks‬\n‭To motivate the NLP community to increase research efforts on Indigenous and endangered‬\n‭languages, AmericasNLP 2025 features three shared tasks:‬\n‭1.‬ ‭machine translation of truly low-resource languages;‬\n‭2.‬ ‭creation of educational resources for indigenous languages;‬\n‭3.‬ ‭and our new shared task of developing metrics for MT in indigenous languages.‬\n‭The results of the shared task will be presented during the in-person workshop in‬\n‭Albuquerque. More information can", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethical"], "norm_matches": []}, {"filename": "2025-Maji-DRISHTIKON A Multimodal Multilingual Benchmark for.md", "year": "2025", "title": "DRISHTIKON A Multimodal Multilingual Benchmark for", "abstract": "We introduce DRISHTIKON, a first-of-its-kind multimodal and multilingual benchmark centered exclusively on Indian culture, designed to evaluate the cultural understanding of generative AI systems. Unlike existing benchmarks with a generic or global scope, DRISHTIKON offers deep, fine-grained coverage across India’s diverse regions, spanning 15 languages, covering all states and union territories, and incorporating over 64,000 aligned text-image pairs.", "extract_snippet": "\n\n# PDF Extract: 2025-Maji-DRISHTIKON A Multimodal Multilingual Benchmark for\n\n**Source PDF:** 2025-Maji-DRISHTIKON A Multimodal Multilingual Benchmark for.pdf\n**Total Pages:** 25\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDRISHTIKON: A Multimodal Multilingual Benchmark for Testing\nLanguage Models’ Understanding on Indian Culture\nArijit Maji1, Raghvendra Kumar1, Akash Ghosh1, Anushka2, Nemil Shah3,\nAbhilekh Borah4, Vanshika Shah5, Nishant Mishra1, Sriparna Saha1\n1 Indian Institute of Technology Patna, India\n2 Banasthali Vidyapeeth University, Rajasthan, India\n3 Pandit Deendayal Energy University, India\n4 Manipal University Jaipur, India\n5 Dwarkadas J. Sanghvi College of Engineering, India\nFor inquiries:\n{arijit_2311ai25, raghvendra_2221cs27, akash_2321cs19, nishant_2312res420, sriparna}@iitp.ac.in\n{guptaanushka024, nemilshah212005, abhilekhkey, vanss2808}@gmail.com\nAbstract\nWe introduce DRISHTIKON, a first-of-its-kind\nmultimodal and multilingual benchmark cen-\ntered exclusively on Indian culture, designed to\nevaluate the cultural understanding of genera-\ntive AI systems. Unlike existing benchmarks\nwith a generic or global scope, DRISHTIKON\noffers deep, fine-grained coverage across In-\ndia’s diverse regions, spanning 15 languages,\ncovering all states and union territories, and\nincorporating over 64,000 aligned text-image\npairs. The dataset captures rich cultural themes\nincluding festivals, attire, cuisines, art forms,\nand historical heritage amongst many more. We\nevaluate a wide range of vision-language mod-\nels (VLMs), including open-source small and\nlarge models, proprietary systems, reasoning-\nspecialized VLMs, and Indic-focused mod-\nels, across zero-shot and chain-of-thought set-\ntings. Our results expose key limitations in cur-\nrent models’ ability to reason over culturally\ngrounded, multimodal inputs, particularly for\nlow-resource languages and less-documented\ntraditions. DRISHTIKON fills a vital gap in\ninclusive AI research, offering a robust testbed\nto advance culturally aware, multimodally com-\npetent language technologies.The Dataset and\ninferencing codes are publicly available at 1.\n1\nIntroduction\nLanguage Models (LMs) and their multimodal\nsuccessors have revolutionized natural language\nprocessing, excelling at tasks like generation, re-\ntrieval, translation, summarization and reasoning\n(Brown et al., 2020; Devlin et al., 2019; Ghosh\net al., 2024c,a,d; Kumar et al., 2023; Verma et al.,\n2023; Kumar et al., 2025). With the advent of Large\n1https://tinyurl.com/DrishtikonDataset\nMultimodal Models (LMMs) (Ghosh et al., 2024b),\nIndic-centric Language Models (ILMs) (Jain et al.,\n2020; Kumar et al., 2024), and parameter-efficient\nSmall Language Models (SLMs), AI systems are\nnow increasingly deployed across global and multi-\nlingual domains (Ouyang et al., 2022; Ghosh et al.,\n2025).\nHowever, despite their linguistic fluency, these\nmodels remain largely blind to the socio-cultural\nrichness that defines real-world communication\n(Maji et al., 2025). Esp", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "alignment"], "norm_matches": []}, {"filename": "2025-Masood-A survey of multilingual large language models - PMC.md", "year": "2025", "title": "A survey of multilingual large language models - PMC", "abstract": "Based on the web search results, here's what I found about Central Asian languages NLP benchmark evaluation: Overview of Central Asian Languages NLP Research in the NLP sphere of the Turkic counterparts of Central Asian languages, namely Kazakh, Uzbek, Kyrgyz, and Turkmen, comes with the typical challenges of low-resource languages, like data scarcity and a general lack of linguistic resources. Current State of Technology and Benchmarks Kazakh language takes the first place in terms of", "extract_snippet": "\\n\\n# PDF Extract: 2025-Masood-A survey of multilingual large language models - PMC\\n\\n**Source PDF:** 2025-Masood-A survey of multilingual large language models - PMC.pdf\\n**Total Pages:** 30\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nReview\nA survey of multilingual large language models\nLibo Qin,1,7,* Qiguang Chen,2,7 Yuhang Zhou,2 Zhi Chen,3 Yinghui Li,4 Lizi Liao,5 Min Li,1 Wanxiang Che,2 and Philip S. Yu6\n1School of Computer Science and Engineering, Central South University, Changsha 410083, China\n2Research Center for Social Computing and Information Retrieval, Harbin Institute of Technology, Harbin 150001, China\n3ByteDance, Inc., Shanghai 200082, China\n4Tsinghua Shenzhen International Graduate School, Tsinghua University, Shenzhen 518055, China\n5School of Computing and Information Systems, Singapore Management University, Singapore 188065, Singapore\n6Department of Computer Science, University of Illinois at Chicago, Chicago, IL 60637, USA\n7These authors contributed equally\n*Correspondence: lbqin@csu.edu.cn\nhttps://doi.org/10.1016/j.patter.2024.101118\nSUMMARY\nMultilingual large language models (MLLMs) leverage advanced large language models to process and\nrespond to queries across multiple languages, achieving signiﬁcant success in polyglot tasks. Despite these\nbreakthroughs, a comprehensive survey summarizing existing approaches and recent developments remains\nabsent. To this end, this paper presents a uniﬁed and thorough review of the ﬁeld, highlighting recent progress\nand emerging trends in MLLM research. The contributions of this paper are as follows. (1) Extensive survey: to\nour knowledge, this is the pioneering thorough review of multilingual alignment in MLLMs. (2) Uniﬁed taxon-\nomy: we provide a uniﬁed framework to summarize the current progress in MLLMs. (3) Emerging frontiers: key\nemerging frontiers are identiﬁed, alongside a discussion of associated challenges. (4) Abundant resources: we\ncollect abundant open-source resources, including relevant papers, data corpora, and leaderboards. We\nhope our work can provide the community quick access and spur breakthrough research in MLLMs.\nINTRODUCTION\nIn recent years, remarkable progress has been witnessed in\nlarge language models (LLMs),1–4 which have achieved excellent\nperformance in various natural language processing tasks.5–7 In\naddition, LLMs raise surprising emergent capabilities, including\nin-context learning,8,9 chain-of-thought reasoning,10–12 and\neven planning.13,14 Nevertheless, the majority of LLMs are En-\nglish centric, primarily focusing on English tasks,15,16 which ren-\nders them relatively weak in multilingual settings, especially in\nlow-resource scenarios.\nActually, there are over 7,000 languages in the world. With the\nacceleration of globalization, the success of LLMs should be\nleveraged to serve diverse countries and languages. To this\nend, as shown in Figure 1, multilingual large language models\n(MLLMs) possess the advantage of comprehensively handling\nmultiple lan", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-Masood-Beyond MCQ An Open-Ended Arabic Cultural QA Benchmark with Dialect.md", "year": "2025", "title": "Beyond MCQ: An Open-Ended Arabic Cultural QA Benchmark with Dialect Variants", "abstract": "Large Language Models (LLMs) are increasingly used to answer everyday questions, yet their performance on culturally grounded and dialectal content remains uneven across languages. We propose a comprehensive method that (i) translates Modern Standard Arabic (MSA) multiple-choice questions (MCQs) into English and several Arabic dialects, (ii) converts them into open-ended questions (OEQs), (iii) benchmarks a range of zero-shot and fine-tuned LLMs under both MCQ and OEQ settings, and (iv)...", "extract_snippet": "\n\n# PDF Extract: 2025-Masood-Beyond MCQ An Open-Ended Arabic Cultural QA Benchmark with Dialect\n\n**Source PDF:** 2025-Masood-Beyond MCQ An Open-Ended Arabic Cultural QA Benchmark with Dialect.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBeyond MCQ: An Open-Ended Arabic Cultural QA Benchmark\nwith Dialect Variants\nHunzalah Hassan Bhatti, Firoj Alam\nQatar Computing Research Institute, Qatar\nfialam@hbku.edu.qa, hunzalahhassan@gmail.com\nAbstract\nLarge Language Models (LLMs) are increasingly used to answer everyday questions, yet their performance on\nculturally grounded and dialectal content remains uneven across languages. We propose a comprehensive method\nthat (i) translates Modern Standard Arabic (MSA) multiple-choice questions (MCQs) into English and several Arabic\ndialects, (ii) converts them into open-ended questions (OEQs), (iii) benchmarks a range of zero-shot and fine-tuned\nLLMs under both MCQ and OEQ settings, and (iv) generates chain-of-thought (CoT) rationales to fine-tune models for\nstep-by-step reasoning. Using this method, we extend an existing dataset in which QAs are parallelly aligned across\nmultiple language varieties, making it, to our knowledge, the first of its kind. We conduct extensive experiments\nwith both open and closed models. Our findings show that (i) models underperform on Arabic dialects, revealing\npersistent gaps in culturally grounded and dialect-specific knowledge; (ii) Arabic-centric models perform well on\nMCQs but struggle with OEQs; and (iii) CoT improves judged correctness while yielding mixed n-gram-based metrics.\nThe developed dataset will be publicly released to support further research on culturally and linguistically inclusive\nevaluation.\nKeywords: Cultural Knowledge; Everyday Knowledge, Open-Ended Question, Chain-of-Thought\n1.\nIntroduction\nCultural information underpins human iden-\ntity,\nbehavior,\nand social interaction,\nen-\ncompassing shared beliefs, values, customs,\nlanguages, traditions, and collective prac-\ntices. In today’s tightly coupled information-\ncommunication ecosystem, hundreds of mil-\nlions of users interact with LLMs for everyday\nqueries, often asking about local norms, hol-\nidays, cuisine, or etiquette, where culturally\ngrounded interpretations are essential (Pawar\net al., 2025; Hasan et al., 2025). Yet despite\nrapid progress in multilingual understanding\nand reasoning, LLM performance remains un-\neven across languages, dialects, and culturally\nspecific domains (Wei et al., 2022; Muennighoff\net al., 2023). The issue is especially salient for\nArabic, where Modern Standard Arabic (MSA)\ncoexists with numerous regional dialects that\ndiffer in phonology, morphology, lexicon, and\nusage (Alwajih et al., 2025a; Sadallah et al.,\n2025). Beyond modeling challenges, widely\nused multiple-choice (MCQ) evaluations can\nmask deficiencies in reasoning by enabling\nFigure 1: Example QA shown in two formats\n(MCQ and OEQ). MCQ: Multiple-Choice Ques-\ntion; OEQ: Open-Ended Question. Flags in\nparenth", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "bias"], "norm_matches": []}, {"filename": "2025-Masood-Neural Machine Translation for Low-Resource Languages from a.md", "year": "2025", "title": "Neural Machine Translation for Low-Resource Languages from a Chinese-centric Perspective: A Survey | ACM Transactions on Asian and Low-Resource Language Information Processing", "abstract": "Resources for the non-English languages are scarce and this paper addresses this problem in the context of machine translation, by automatically extracting parallel sentence pairs from the multilingual articles available on the Internet. In this paper, we have used an endto-end Siamese bidirectional recurrent neural network to generate parallel sentences from comparable multilingual articles in Wikipedia.", "extract_snippet": "\n\n# PDF Extract: 2025-Masood-Neural Machine Translation for Low-Resource Languages from a\n\n**Source PDF:** 2025-Masood-Neural Machine Translation for Low-Resource Languages from a.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of NAACL-HLT 2018: Student Research Workshop, pages 112–119\nNew Orleans, Louisiana, June 2 - 4, 2018. c⃝2017 Association for Computational Linguistics\nNeural Machine Translation for Low Resource Languages using Bilingual\nLexicon Induced from Comparable Corpora\nSree Harsha Ramesh and Krishna Prasad Sankaranarayanan\nCollege of Information and Computer Sciences\nUniversity of Massachusetts Amherst\n{shramesh, ksankaranara}@cs.umass.edu\nAbstract\nResources for the non-English languages are\nscarce and this paper addresses this problem\nin the context of machine translation, by au-\ntomatically extracting parallel sentence pairs\nfrom the multilingual articles available on the\nInternet. In this paper, we have used an end-\nto-end Siamese bidirectional recurrent neural\nnetwork to generate parallel sentences from\ncomparable multilingual articles in Wikipedia.\nSubsequently, we have showed that using the\nharvested dataset improved BLEU scores on\nboth NMT and phrase-based SMT systems\nfor the low-resource language pairs: English–\nHindi and English–Tamil, when compared to\ntraining exclusively on the limited bilingual\ncorpora collected for these language pairs.\n1\nIntroduction\nBoth neural and statistical machine translation ap-\nproaches are highly reliant on the availability of\nlarge amounts of data and are known to perform\npoorly in low resource settings.\nRecent crowd-\nsourcing efforts and workshops on machine trans-\nlation have resulted in small amounts of parallel\ntexts for building viable machine translation sys-\ntems for low-resource pairs (Post et al., 2012).\nBut, they have been shown to suffer from low\naccuracy (incorrect translation) and low coverage\n(high out-of-vocabulary rates), due to insufﬁcient\ntraining data. In this project, we try to address the\nhigh OOV rates in low-resource machine transla-\ntion systems by leveraging the increasing amount\nof multilingual content available on the Internet\nfor enriching the bilingual lexicon.\nComparable corpora such as Wikipedia, are col-\nlections of topic-aligned but non-sentence-aligned\nmultilingual documents which are rich resources\nfor extracting parallel sentences from. For exam-\nple, Figure 1 shows that there are equivalent sen-\ntences on the page about Donald Trump in Tamil\nLanguage\n(ISO 639-1)\n# Bilingual\nWiki articles\n# Curated\nen–xx\nsent. pairs\nUrdu (ur)\n124,078\n35,916\nHindi (hi)\n121,234\n1,495,854\nTamil (ta)\n113,197\n169,871\nTelugu (te)\n67,508\n46,264\nBengali (bn)\n52,518\n23,610\nMalayalam (ml)\n52,224\n33,248\nTable 1: Number of bilingual articles in Wikipedia\nagainst the number of parallel sentences in the\nlargest xx–en corpora available.\nand English, and the phrase alignment for an ex-\nample sentence is shown in Table 2.\nTable 1 shows that there are at least tens o", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-Mikhailov-NorEval A Norwegian Language Understanding and Generation Evaluation.md", "year": "2025", "title": "NorEval: A Norwegian Language Understanding and Generation Evaluation Benchmark", "abstract": "This paper introduces NorEval, a new and comprehensive evaluation suite for large-scale standardized benchmarking of Norwegian generative language models (LMs). NorEval consists of 24 high-quality human-created datasets – of which five are created from scratch. In contrast to existing benchmarks for Norwegian, NorEval covers a broad spectrum of task categories targeting Norwegian language understanding and generation, establishes human baselines, and focuses on both of the official written...", "extract_snippet": "\n\n# PDF Extract: 2025-Mikhailov-NorEval A Norwegian Language Understanding and Generation Evaluation\n\n**Source PDF:** 2025-Mikhailov-NorEval A Norwegian Language Understanding and Generation Evaluation.pdf\n**Total Pages:** 47\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2504.07749v2  [cs.CL]  5 Jun 2025\nNorEval: A Norwegian Language Understanding and Generation\nEvaluation Benchmark\nVladislav Mikhailov1\nTita Enstad2\nDavid Samuel1\nHans Christian Farsethås1\nAndrey Kutuzov1\nErik Velldal1\nLilja Øvrelid1\n1University of Oslo\n2National Library of Norway\nCorrespondence: vladism@ifi.uio.no\nAbstract\nThis paper introduces NorEval, a new and com-\nprehensive evaluation suite for large-scale stan-\ndardized benchmarking of Norwegian gener-\native language models (LMs). NorEval con-\nsists of 24 high-quality human-created datasets\n– of which five are created from scratch. In\ncontrast to existing benchmarks for Norwe-\ngian, NorEval covers a broad spectrum of task\ncategories targeting Norwegian language un-\nderstanding and generation, establishes human\nbaselines, and focuses on both of the official\nwritten standards of the Norwegian language:\nBokmål and Nynorsk. All our datasets and a\ncollection of over 100 human-written prompts\nare integrated into LM Evaluation Harness, en-\nsuring flexible and reproducible evaluation. We\ndescribe the NorEval design and present the\nresults of benchmarking 19 open-source pre-\ntrained and instruction-tuned LMs for Norwe-\ngian in various scenarios. Our benchmark, eval-\nuation framework, and annotation materials are\npublicly available.\n1\nIntroduction\nThe advancement of language models (LMs) is\ninseparable from benchmarking – the systematic\nevaluation of their generalization abilities on stan-\ndardized datasets across various criteria (Ruder,\n2021; Srivastava et al., 2023). Despite its crucial\nrole, benchmarking in resource-lean scenarios re-\nmains scarce due to the lack of diverse evaluation\nsuites for low-resource languages, including Nor-\nwegian (Joshi et al., 2020; Hedderich et al., 2021).\nPrevious work focuses on Norwegian as part of\nmedium-scale benchmarking efforts – NorBench\n(Samuel et al., 2023) and NLEBench (Liu et al.,\n2024) – and broader Mainland Scandinavian eval-\nuation initiatives – ScandEval (Nielsen, 2023)\nand Scandinavian Embedding Benchmark (SEB;\nEnevoldsen et al., 2024). However, these bench-\nmarks have several shortcomings that limit the\nscope of LM evaluation in Norwegian.\n• Coverage and design.\nThese benchmarks\nexhibit a significant dataset overlap with a\nlow variation in task formulations. NorBench\nand ScandEval cover traditional NLP tasks,\nSEB addresses text embedding evaluation, and\nNLEBench comprises a narrow spectrum of\nNorwegian language generation tasks.\n• Data quality. NLEBench and ScandEval in-\nclude machine-translated English datasets, in-\ntroducing potential evaluation biases that may\nconflict with Norwegian-specific values, cul-\nture, and knowledge.\n• Linguistic diversity. Norwegian has two of-\nficial wri", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2025-Miranda-FilBench Can LLMs Understand and Generate Filipino.md", "year": "2025", "title": "FilBench: Can LLMs Understand and Generate Filipino?", "abstract": "Despite the impressive performance of LLMs on English-based tasks, little is known about their capabilities in specific languages such as Filipino. In this work, we address this gap by introducing FILBENCH, a Filipino-centric benchmark designed to evaluate LLMs across a diverse set of tasks and capabilities in Filipino, Tagalog, and Cebuano. We carefully curate the tasks in FILBENCH to reflect the priorities and trends of NLP research in the Philippines such as Cultural Knowledge, Classical...", "extract_snippet": "\n\n# PDF Extract: 2025-Miranda-FilBench Can LLMs Understand and Generate Filipino\n\n**Source PDF:** 2025-Miranda-FilBench Can LLMs Understand and Generate Filipino.pdf\n**Total Pages:** 33\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFILBENCH: Can LLMs Understand and Generate Filipino?\nLester James V. Miranda1*\nElyanah Aco2*\nConner Manuel3*\nJan Christian Blaise Cruz4,5†\nJoseph Marvin Imperial4,6,7†\n1Allen Institute for AI\n2Nara Institute of Science and Technology\n3Together AI\n4SEACrowd\n5MBZUAI\n6University of Bath\n7National University, Philippines\nCode filbench/filbench-eval\nLeaderboard UD-Filipino/filbench-leaderboard\nAbstract\nDespite the impressive performance of LLMs\non English-based tasks, little is known about\ntheir capabilities in specific languages such as\nFilipino. In this work, we address this gap\nby introducing FILBENCH, a Filipino-centric\nbenchmark designed to evaluate LLMs across a\ndiverse set of tasks and capabilities in Filipino,\nTagalog, and Cebuano. We carefully curate the\ntasks in FILBENCH to reflect the priorities and\ntrends of NLP research in the Philippines such\nas Cultural Knowledge, Classical NLP, Read-\ning Comprehension, and Generation. By evalu-\nating 27 state-of-the-art LLMs on FILBENCH,\nwe find that several LLMs suffer from read-\ning comprehension and translation capabilities.\nOur results indicate that FILBENCH is challeng-\ning, with the best model, GPT-4o, achieving\nonly a score of 72.23%. Moreover, we also find\nthat models trained specifically for Southeast\nAsian languages tend to underperform on FIL-\nBENCH, with the highest-performing model,\nSEA-LION v3 70B, achieving only a score of\n61.07%. Our work demonstrates the value of\ncurating language-specific LLM benchmarks to\naid in driving progress on Filipino NLP and in-\ncreasing the inclusion of Philippine languages\nin LLM development.\n1\nIntroduction\nWhile large language models (LLMs) have shown\nimpressive performance on a variety of English-\nbased tasks and capabilities, their effectiveness\nremains largely unexplored for low-resource lan-\nguages such as Filipino. This knowledge gap ex-\nists for two reasons. First, most low-resource lan-\nguages, especially Filipino-centric benchmarks, de-\nveloped before the ChatGPT-era (—2022 Gururaja\net al., 2023) are ill-posed for current LLM evalua-\ntion despite their value in understanding language\n*Equal contributions.\n†Senior authors.\nFILBENCH\nRegional  Knowledge\nFactual Knowledge\nCultural Values\nWord Sense\n4 Task Categories\n3 PH Languages\n12 Sub-Tasks\nGeneration\nReading Comprehension\nCultural Knowledge\nClassical NLP\nSentiment Analysis\nText Categorization\nGen. Translation\nDomain-specific Translation\nGen. Reading Comp.\nNatural Language Inf.\nNER\nReadability\nFigure 1: Overview of FILBENCH. In order to com-\nprehensively assess the full capabilities of LLMs on\nPhilippine languages, we curate an evaluation suite con-\nsisting of 4 categories and 12 subtasks across Filipino,\nTagalog, and Cebuano based on the research priorities\nof the Philippine NLP ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value", "value", "values"], "norm_matches": []}, {"filename": "2025-Monazzah-PerCul A Story-Driven Cultural Evaluation of LLMs in Persian.md", "year": "2025", "title": "PerCul: A Story-Driven Cultural Evaluation of LLMs in Persian", "abstract": "Large language models predominantly reflect Western cultures, largely due to the dominance of English-centric training data. This imbalance presents a significant challenge, as LLMs are increasingly used across diverse contexts without adequate evaluation of their cultural competence in non-English languages, including Persian. To address this gap, we introduce PERCUL, a carefully constructed dataset designed to assess the sensitivity of LLMs toward Persian culture.", "extract_snippet": "\n\n# PDF Extract: 2025-Monazzah-PerCul A Story-Driven Cultural Evaluation of LLMs in Persian\n\n**Source PDF:** 2025-Monazzah-PerCul A Story-Driven Cultural Evaluation of LLMs in Persian.pdf\n**Total Pages:** 18\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPERCUL: A Story-Driven Cultural Evaluation of LLMs in Persian\nErfan Moosavi Monazzah*2,3, Vahid Rahimzadeh*1,3,\nYadollah Yaghoobzadeh1,3, Azadeh Shakery1,4, and Mohammad Taher Pilehvar5\n1University of Tehran, Iran\n2Iran University of Science and Technology, Tehran, Iran\n3Tehran Institute for Advanced Studies, Khatam University, Iran\n4Institute for Research in Fundamental Sciences (IPM), Tehran, Iran\n5Cardiff University, United Kingdom\nmoosavi_m@comp.iust.ac.ir, rahimzade@ut.ac.ir\nAbstract\nLarge language models predominantly reflect\nWestern cultures, largely due to the domi-\nnance of English-centric training data. This\nimbalance presents a significant challenge, as\nLLMs are increasingly used across diverse con-\ntexts without adequate evaluation of their cul-\ntural competence in non-English languages,\nincluding Persian. To address this gap, we\nintroduce PERCUL, a carefully constructed\ndataset designed to assess the sensitivity of\nLLMs toward Persian culture. PERCUL fea-\ntures story-based, multiple-choice questions\nthat capture culturally nuanced scenarios. Un-\nlike existing benchmarks, PERCUL is cu-\nrated with input from native Persian annota-\ntors to ensure authenticity and to prevent the\nuse of translation as a shortcut.\nWe eval-\nuate several state-of-the-art multilingual and\nPersian-specific LLMs, establishing a foun-\ndation for future research in cross-cultural\nNLP evaluation.\nOur experiments demon-\nstrate a 11.3% gap between best closed source\nmodel and layperson baseline while the gap in-\ncreases to 21.3% by using the best open-weight\nmodel. You can access the dataset from here:\nhttps://huggingface.co/datasets/teias-ai/percul\n1\nIntroduction\nEffective interactions between users from diverse\nbackgrounds and LLMs are contingent on outputs\nthat are culturally relevant (Bhatt and Diaz, 2024).\nAs the use of generative artificial intelligence in-\ncreases to expedite and automate personal and pro-\nfessional tasks, the cultural values embedded in AI\nmodels may inadvertently bias people’s authentic\nexpression and perpetuate the dominance of cer-\ntain cultures (Tao et al., 2024), particularly West-\nern culture, which is over-represented in English-\ndominated training data (Li et al., 2024; Naous\net al., 2024). This highlights the importance of cre-\nating culture-specific benchmarking tools to assess\n*Equal contribution, ordered randomly\nFigure 1: A translated example of PERCUL, implying a\ncultural concept in Visible Behavior category.\nthe extent to which LLMs encapsulate knowledge\nabout particular cultures.\nDespite the numerous benchmarks that evaluate\nvarious aspects of LLMs (Chang et al., 2024), a sig-\nnificant gap remains in assessing their knowledge\nof culture across many non-English languages such\nas Persia", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "bias"], "norm_matches": []}, {"filename": "2025-Mueller-Eberstein-DaKultur Evaluating the Cultural Awareness of Language Models for.md", "year": "2025", "title": "DaKultur: Evaluating the Cultural Awareness of Language Models for Danish with Native Speakers", "abstract": "Large Language Models (LLMs) have seen widespread societal adoption. However, while they are able to interact with users in languages beyond English, they have been shown to lack cultural awareness, providing anglocentric or inappropriate responses for underrepresented language communities. To investigate this gap and disentangle linguistic versus cultural proficiency, we conduct the first cultural evaluation study for the mid-resource language of Danish, in which native speakers prompt...", "extract_snippet": "\n\n# PDF Extract: 2025-Mueller-Eberstein-DaKultur Evaluating the Cultural Awareness of Language Models for\n\n**Source PDF:** 2025-Mueller-Eberstein-DaKultur Evaluating the Cultural Awareness of Language Models for.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDAKULTUR: Evaluating the Cultural Awareness of Language Models for\nDanish with Native Speakers\nMax Müller-Eberstein\n' ☼Æ\nMike Zhang\n' ÖÆ\nElisa Bassignana☼Æ\nPeter Brunsgaard Trolle☼\nRob van der Goot☼Æ\n☼IT University of Copenhagen, Denmark\nÖAalborg University, Denmark\nÆPioneer Center for Artificial Intelligence, Denmark\nmamy@itu.dk\njjz@cs.aau.dk\nAbstract\nLarge Language Models (LLMs) have seen\nwidespread societal adoption. However, while\nthey are able to interact with users in languages\nbeyond English, they have been shown to lack\ncultural awareness, providing anglocentric or\ninappropriate responses for underrepresented\nlanguage communities. To investigate this gap\nand disentangle linguistic versus cultural profi-\nciency, we conduct the first cultural evaluation\nstudy for the mid-resource language of Danish,\nin which native speakers prompt different mod-\nels to solve tasks requiring cultural awareness.\nOur analysis of the resulting 1,038 interactions\nfrom 63 demographically diverse participants\nhighlights open challenges to cultural adapta-\ntion: Particularly, how currently employed au-\ntomatically translated data are insufficient to\ntrain or measure cultural adaptation, and how\ntraining on native-speaker data can more than\ndouble response acceptance rates. We release\nour study data as DAKULTUR—the first native\nDanish cultural awareness dataset. 1\n1\nIntroduction\nCulture encompasses shared beliefs, norms, and\nworldviews (Tylor, 1871; Braff and Nelson, 2020),\nand tightly interweaves with language (Kramsch,\n1998, 2014). These bidirectional influences affect\nhow LLMs perform on culturally-sensitive tasks\n(Hovy and Yang, 2021). Contemporary LLMs are\npredominantly trained on English data, yet their\nglobal usage has outpaced their cultural coverage\n(Shi et al., 2023; Huang et al., 2023). Recent find-\nings suggest that many models fail to adequately\nrepresent non-anglophone cultures (Hershcovich\net al., 2022; Zhang et al., 2023; Liu et al., 2024),\n' These authors contributed equally.\n1Dataset and code at https://mxij.me/x/dakultur.\nThis study was approved by the ethics committee of the IT\nUniversity of Copenhagen on 24th June 2024.\nresulting in culturally misaligned outputs that un-\ndermine user trust (Hovy and Yang, 2021; Litschko\net al., 2023; Ge et al., 2024).\nAddressing cultural misalignment requires as-\nsessing linguistic forms, common ground, about-\nness, and values (Hershcovich et al., 2022). Prior\nefforts to improve alignment across these dimen-\nsions include the diversification of training data, as\nwell as involving native speakers in evaluations\n(Tay et al., 2020; Huang and Yang, 2023; Cao\net al., 2023; Naous et al., 2024; Wang et al., 2024).\nHowever, it remains unclear which LLM", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "values", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Naous-Camellia Benchmarking Cultural Biases in LLMs for Asian Languages.md", "year": "2025", "title": "Camellia: Benchmarking Cultural Biases in LLMs for Asian Languages", "abstract": "As Large Language Models (LLMs) gain stronger multilingual capabilities, their ability to handle culturally diverse entities becomes crucial. Prior work has shown that LLMs often favor Western-associated entities in Arabic, raising concerns about cultural fairness. Due to the lack of multilingual benchmarks, it remains unclear if such biases also manifest in different non-Western languages. In this paper, we introduce Camellia, a benchmark for measuring entity-centric cultural biases in nine...", "extract_snippet": "\n\n# PDF Extract: 2025-Naous-Camellia Benchmarking Cultural Biases in LLMs for Asian Languages\n\n**Source PDF:** 2025-Naous-Camellia Benchmarking Cultural Biases in LLMs for Asian Languages.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCamellia (Preprint)\nCAMELLIA\n: BENCHMARKING CULTURAL BIASES\nIN LLMS FOR ASIAN LANGUAGES\nTarek Naous1, Anagha Savit1, Carlos Rafael Catalan2, Geyang Guo1, Jaehyeok Lee3,\nKyungdon Lee3, Lheane Marie Dizon2, Mengyu Ye4, Neel Kothari1, Sahajpreet Singh5,\nSarah Masud6, Tanish Patwa1, Trung Tanh Tran7, Zohaib Khan8, Alan Ritter1,\nJinYeong Bak3, Keisuke Sakaguchi4, Tanmoy Chakraborty9, Yuki Arase10, Wei Xu1\n1Georgia Institute of Technology, 2Samsung R&D Institute Philippines,\n3Sungkyunkwan University, 4Tohoku University, 5National University of Singapore,\n6University of Copenhagen, 7Takenote.ai, 8University of Michigan,\n9Indian Institute of Technology Delhi, 10Institute of Science Tokyo\ntareknaous@gatech.edu\ntareknaous/camellia\nABSTRACT\nAs Large Language Models (LLMs) gain stronger multilingual capabilities, their\nability to handle culturally diverse entities becomes crucial. Prior work has shown\nthat LLMs often favor Western-associated entities in Arabic, raising concerns\nabout cultural fairness. Due to the lack of multilingual benchmarks, it remains\nunclear if such biases also manifest in different non-Western languages. In this\npaper, we introduce Camellia, a benchmark for measuring entity-centric cultural\nbiases in nine Asian languages spanning six distinct Asian cultures. Camellia in-\ncludes 19,530 entities manually annotated for association with the specific Asian\nor Western culture, as well as 2,173 naturally occurring masked contexts for enti-\nties derived from social media posts. Using Camellia, we evaluate cultural biases\nin four recent multilingual LLM families across various tasks such as cultural\ncontext adaptation, sentiment association, and entity extractive QA. Our analy-\nses show a struggle by LLMs at cultural adaptation in all Asian languages, with\nperformance differing across models developed in regions with varying access to\nculturally-relevant data. We further observe that different LLM families hold their\ndistinct biases, differing in how they associate cultures with particular sentiments.\nLastly, we find that LLMs struggle with context understanding in Asian languages,\ncreating performance gaps between cultures in entity extraction.\n1\nINTRODUCTION\nLarge Language Models (LLMs) have rapidly integrated into modern technology, serving users from\ndiverse cultures (Adilazuarda et al., 2024). Among the vast range of text they process, LLMs fre-\nquently encounter entities such as people’s names, locations, or food dishes, which are pervasive\nin text corpora (Wolfe & Caliskan, 2021; Pawar et al., 2025a) and often appear in user prompts (Li\net a
