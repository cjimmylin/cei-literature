ublishing (AJSP)                                                                        ISSN: 2663-5798          \n \nArab Journal for Scientific Publishing\n \n ||\nISSN: 2663-5798\n \n \n \n \n“The Ethics of AI: Navigating the Moral Dilemmas of Artificial \nIntelligence” \n \nResearcher: \n \nFayyad Muhammad Hani Bayan \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\n--- Page 2 ---\n\n \n  \n \n \n \n \n \n \n \n \n \n اإلصدار\nالسابع \n–\n العدد ستة \n وستون \n :تاريخ اإلصدار2 \n–\n نيسان \n–\n \n2024\n م \n \nwww.ajsp.net\n \n     \n \n      \n     \n                                     \n                                           \n                         \n  \n \n \n \n2\n \nArab Journal for Scientific Publishing (AJSP)                                                                        ISSN: 2663-5798          \n \nArab Journal for Scientific Publishing\n \n ||\nISSN: 2663-5798\n \nAbstract: \nThe significance of ethics in artificial intelligence (AI) cannot be overstated, as it encompasses the foundational principles \nguiding the responsible creation, deployment, and management of AI technologies. As AI systems increasingly permeate \nevery facet of our lives—from healthcare and education to security and entertainment—their decisions and actions have \nprofound implications not only on individual rights and privacy but also on societal norms and values. Ethical considerations \nin AI are paramount to ensure that these technologies enhance human well-being, uphold fairness, and protect freedoms, \nrather than perpetuate biases, exacerbate inequalities, or undermine democratic institutions. The importance of AI ethics lies \nin its ability to provide a framework for navigating the complex moral dilemmas presented by AI, such as the balance between \ninnovation and regulation, the protection of individual privacy versus the benefits of big data, and the prevention of AI \nmisuse. By foregrounding ethical principles, stakeholders—including developers, policymakers, and users—can work \ntowards the development of AI technologies that are not only technologically advanced but also socially responsible and \naligned with human values. This emphasis on ethics ensures that as AI systems become more autonomous and integral to our \ndaily lives, they do so in a manner that is transparent, accountable, and inclusive, thereby fostering trust and confidence in \ntheir widespread adoption and use. \nThe advent of new AI technologies brings to light a series of emerging ethical dilemmas that challenge existing frameworks \nand demand novel considerations. One of the forefron", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": ["well-being"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "fairness", "safety", "responsible", "responsible", "accountable", "toxic"], "norm_matches": []}, {"filename": "2024-Hayes-Virtue and Narrative in AI Practices.md", "year": "2024", "title": "Virtue and Narrative in AI Practices", "abstract": "This paper addresses the question of how ethics and ethical frameworks can be used to avert the negative consequences of AI through guidance on human behaviour and technological system design. While a kind of AI ethics principlism has gained widespread acceptance, it still invites harsh rejections in recent scholarship. The paper explores the contribution to an ethics of AI made by a narrative philosophy and ethics of technology inspired by the 'little ethics' of Paul Ricoeur, and virtue ethics of Alasdair MacIntyre, most recently and promisingly built upon by Wessel Reijers and Mark Coeckelbergh. The objective is to examine whether a narrative and virtue-based ethics (or VPD, i.e., virtuous practice design) might be a plausible candidate for the foundation of an ethics of AI.", "extract_snippet": "\n\n# PDF Extract: Virtue and Narrative in AI Practices\n\n**Source PDF:** 2024-Hayes-Virtue and Narrative in AI Practices.pdf\n**Total Pages:** 23\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nORIGINAL RESEARCH\nAI and Ethics (2025) 5:1217–1239\nhttps://doi.org/10.1007/s43681-024-00472-z\ncapabilities of AI applications and the potential ethical, \noften relatable, dilemmas they can pose (imagine the temp­\ntation of a student to plagiarize their essay using ChatGPT), \nare seemingly becoming more and more apparent to increas­\ningly broader groups of people, and no longer just profes­\nsionals, academics or AI enthusiasts [21, 23, 69, 100]. The \nquestion of how we can use ethics and ethical frameworks \nto avert the negative consequences of AI through guidance \non human behaviour and the design of technological sys­\ntems has also recently been receiving increasing attention \n[51]. Such scholarship and public debate is likely to con­\ntinue intensifying as real and practical concerns about AI \nbecome more and more apparent to and understood by the \ngeneral public, whose jobs and hobbies (their practices as \nsuch) stand to be transformed as AI applications become \ncapable of increasingly complex and creative tasks.\nThe appropriate response to an ethics of AI has certainly \nbeen contentious. For some years the wisdom of deontology \nand utilitarianism in the ethics of technology has been ques­\ntioned. Today, a kind of AI ethics principlism has gained a \ndegree of widespread acceptance, yet it still invites harsh \nrejections in recent scholarship, as we will explore in what \nfollows [33, 46, 63, 64]. In this paper, we wish to explore the \n1  Introduction\nPublic discussion of the benefits and risks of artificial intel­\nligence (AI) has arguably accelerated in recent months \nand years as the capabilities of generative AI applications \nhave captured the public’s imagination (such as large lan­\nguage models like ChatGPT in particular).1 The everyday \n1   Indeed, as a point of interest Google trends (https://trends.google.\ncom/trends/explore?date=all&q=AI&hl=en) shows interest in the \n‘AI’ search term rising exponentially beginning around late 2022.\n\t\n Paul Hayes\npaul.hayes@tudublin.ie\nNoel Fitzpatrick\nNoel.fitzpatrick@tudublin.ie\nJosé Manuel Ferrández\njm.ferrandez@upct.es\n1\t\nTU Dublin, GradCAM, ECT Lab+, SFI ADAPT Research \nCentre, Dublin, Ireland\n2\t\nDepartamento de Electrónica, Tecnología de Computadores \ny Proyectos; ECT Lab+, Universidad Polit?cnica de \nCartagena, Cartagena, Spain\nAbstract\nThe question of how we can use ethics and ethical frameworks to avert the negative consequences of AI through guid­\nance on human behaviour and the design of technological systems has recently been receiving increasing attention. The \nappropriate response to an ethics of AI has certainly been contentious. For some years the wisdom of deontology and \nutilitarianism in the ethics of technology has been questioned. Today, a kind of AI ethics principlism has gained a degree \nof widespread ac", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtuous", "virtue ethics", "virtue ethics", "wisdom", "wisdom"], "deont_matches": ["deontology", "deontology"], "util_matches": ["utilitarianism", "utilitarianism"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical"], "norm_matches": ["deontology", "deontology", "utilitarianism", "utilitarianism", "virtue ethics", "virtue ethics"]}, {"filename": "2024-Huang-Moral Persuasion in Large Language Models.md", "year": "2024", "title": "Moral Persuasion in Large Language Models", "abstract": "We explore how large language models (LLMs) can be influenced by prompting them to alter their initial decisions and align them with established ethical frameworks. Our study is based on two experiments designed to assess the susceptibility of LLMs to moral persuasion. In the first experiment, we examine the susceptibility to moral ambiguity by evaluating a Base Agent LLM on morally ambiguous scenarios and observing how a Persuader Agent attempts to modify the Base Agent’s initial decisions.", "extract_snippet": "\n\n# PDF Extract: Moral Persuasion in Large Language Models\n\n**Source PDF:** 2024-Huang-Moral Persuasion in Large Language Models.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMoral Persuasion in Large Language Models:\nEvaluating Susceptibility and Ethical Alignment\nAllison Huang\nUniversity of Southern California\nhuangac@usc.edu\nYulu Niki Pi\nUniversity of Warwick\nCarlos Mougan\nAI Office\nEuropean Commission\nAbstract\nWe explore how large language models (LLMs) can be influenced by prompt-\ning them to alter their initial decisions and align them with established ethical\nframeworks. Our study is based on two experiments designed to assess the sus-\nceptibility of LLMs to moral persuasion. In the first experiment, we examine the\nsusceptibility to moral ambiguity by evaluating a Base Agent LLM on morally\nambiguous scenarios and observing how a Persuader Agent attempts to modify the\nBase Agent’s initial decisions. The second experiment evaluates the susceptibility\nof LLMs to align with predefined ethical frameworks by prompting them to adopt\nspecific value alignments rooted in established philosophical theories. The results\ndemonstrate that LLMs can indeed be persuaded in morally charged scenarios,\nwith the success of persuasion depending on factors such as the model used, the\ncomplexity of the scenario, and the conversation length. Notably, LLMs of distinct\nsizes but from the same company produced markedly different outcomes, highlight-\ning the variability in their susceptibility to ethical persuasion. Code is available at\nhttps://github.com/acyhuang/moral-persuasion.\n1\nIntroduction\nAs the capabilities of Large Language Models (LLMs) continue to advance, their potential application\nextends to more complex and ethically challenging tasks that can involve morally ambiguous scenarios.\nThese scenarios often entail situations where decisions are not straightforward, and multiple courses\nof action can be justified depending on the ethical framework employed. Additionally, the growing\ndevelopment of more autonomous models—capable of using tools, making decisions, and operating\nindependently—highlights the importance of understanding how these models might influence each\nother, especially in situations with ethical implications.\nPrevious research has predominantly focused on the safety considerations of LLM usage, partic-\nularly regarding the potential for misuse or the adverse social impacts these models might gener-\nate (Hendrycks et al., 2023; Phuong et al., 2024; Bommasani et al., 2021). However, an area that\nremains underexplored is the influence of persuasion between LLMs in moral scenarios where both\nactions might be deemed beneficial. To the best of our knowledge, there is no prior research that\nstudies how susceptible LLMs are to persuasion from other models in moral contexts.\nAdditionally, morality is highly complex and dependent on context – human morals vary between\nindividuals and across political and social groups. Philosophers and ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "morality", "value", "values", "normative", "safety", "alignment", "moral foundations"], "norm_matches": []}, {"filename": "2024-Huang-TrustLLM.md", "year": "2024", "title": "TrustLLM", "abstract": "Large language models (LLMs), exemplified by ChatGPT, have gained considerable attention for their excellent natural language processing capabilities. Nonetheless, these LLMs present many challenges, particularly in the realm of trustworthiness. Therefore, ensuring the trustworthiness of LLMs emerges as an important topic. This paper introduces TRUSTLLM, a comprehensive study of trustworthiness in LLMs, including principles for different dimensions of trustworthiness, established benchmark,...", "extract_snippet": "\n\n# PDF Extract: TrustLLM\n\n**Source PDF:** 2024-Huang-TrustLLM.pdf\n**Total Pages:** 119\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTRUSTLLM: TRUSTWORTHINESS IN LARGE LANGUAGE MODELS\n– A PRINCIPLE AND BENCHMARK\nYue Huang1,2∗† ‡ Lichao Sun1∗† Haoran Wang3∗Siyuan Wu4∗‡ Qihui Zhang4∗‡ Yuan Li5 ‡\nChujie Gao4∗‡ Yixin Huang6∗Wenhan Lyu7∗Yixuan Zhang7∗Xiner Li8∗\nHanchi Sun1\nZhengliang Liu9∗Yixin Liu1∗Yijue Wang10∗Zhikun Zhang11∗\nBertie Vidgen12,45\nBhavya Kailkhura13\nCaiming Xiong14\nChaowei Xiao15\nChunyuan Li16\nEric Xing17,43\nFurong Huang18\nHao Liu19\nHeng Ji20\nHongyi Wang17,44\nHuan Zhang20\nHuaxiu Yao21\nManolis Kellis22\nMarinka Zitnik23\nMeng Jiang2\nMohit Bansal21\nJames Zou11\nJian Pei24\nJian Liu25\nJianfeng Gao16\nJiawei Han20\nJieyu Zhao26\nJiliang Tang27\nJindong Wang28\nJoaquin Vanschoren29\nJohn Mitchell11\nKai Shu3\nKaidi Xu30\nKai-Wei Chang31\nLifang He1\nLifu Huang32\nMichael Backes4\nNeil Zhenqiang Gong24\nPhilip S. Yu33\nPin-Yu Chen34\nQuanquan Gu31\nRan Xu14\nRex Ying35\nShuiwang Ji8\nSuman Jana36\nTianlong Chen21\nTianming Liu9\nTianyi Zhou18\nWillian Wang37\nXiang Li38\nXiangliang Zhang2\nXiao Wang39\nXing Xie28\nXun Chen10\nXuyu Wang40\nYan Liu26\nYanfang Ye2\nYinzhi Cao41\nYong Chen42\nYue Zhao26\n1Lehigh University\n2University of Notre Dame\n3Illinois Institute of Technology\n4CISPA\n5University of Cambridge\n6Institut Polytechnique de Paris\n7William & Mary\n8Texas A&M University\n9University of Georgia\n10Samsung Research America\n11Stanford University\n12University of Oxford\n13Lawrence Livermore National Laboratory\n14Salesforce Research\n15University of Wisconsin, Madison\n16Microsoft Research\n17Carnegie Mellon University\n18University of Maryland\n19University of California, Berkeley\n20University of Illinois Urbana-Champaign\n21UNC Chapel Hill\n22Massachusetts Institute of Technology\n23Harvard University\n24Duke University\n25University of Tennessee, Knoxville\n26University of Southern California\n27Michigan State University\n28Microsoft Research Asia\n29Eindhoven University of Technology\n30Drexel University\n31University of California, Los Angeles\n32Virginia Tech\n33University of Illinois Chicago\n34IBM Research AI\n35Yale University\n36Columbia University\n37University of California, Santa Barbara\n38Massachusetts General Hospital\n39Northwestern University\n40Florida International University\n41Johns Hopkins University\n42University of Pennsylvania\n43Mohamed Bin Zayed University of Artificial Intelligence\n44Rutgers University\n45MLCommons\nTL;DR: TRUSTLLM is an established benchmark of trustworthiness for mainstream LLMs based on the\nprinciples for different dimensions of trustworthiness.\n*Major contribution.\n†Yue Huang and Lichao Sun are co-corresponding authors: yhuang37@nd.edu, lis221@lehigh.edu\n‡Visiting Students at LAIR Lab, Lehigh University.\n§Latest Update: Sep., 2024.\narXiv:2401.05561v6  [cs.CL]  30 Sep 2024\n\n--- Page 2 ---\n\nTRUSTLLM\nABSTRACT\nLarge language models (LLMs), exemplified by ChatGPT, have gained considerable attention\nfor their excellent natural language processing capabilities. Nonetheless,", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["ethics", "fairness", "safety"], "norm_matches": []}, {"filename": "2024-Ji-MoralBench.md", "year": "2024", "title": "MoralBench", "abstract": "In the rapidly evolving field of artificial intelligence, large language models (LLMs) have emerged as powerful tools for a myriad of applications, from natural language processing to decision-making support systems. However, as these models become increasingly integrated into societal frameworks, the imperative to ensure they operate within ethical and moral boundaries has never been more critical. This paper introduces a novel benchmark designed to measure and compare the moral reasoning capabilities of LLMs. We present the first comprehensive dataset specifically curated to probe the moral dimensions of LLM outputs, addressing a wide range of ethical dilemmas and scenarios reflective of real-world complexities. The main contribution of this work lies in the development of benchmark datasets and metrics for assessing the moral identity of LLMs, which accounts for nuance, contextual sensitivity, and alignment with human ethical standards. We publicly release the benchmark datasets1 and also open-source the code of the project2.", "extract_snippet": "\\n\\n# PDF Extract: 2024-Ji-MoralBench\\n\\n**Source PDF:** 2024-Ji-MoralBench.pdf\\n**Total Pages:** 10\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\narXiv:2406.04428v2  [cs.CL]  4 Jul 2025\nMoralBench: Moral Evaluation of LLMs\nJianchao Ji∗1 ∗, Yutong Chen∗2, Mingyu Jin1, Wujiang Xu1, Wenyue Hua1, Yongfeng Zhang1\n1Rutgers, The State University of New Jersey, 2University of Chicago\nABSTRACT\nIn the rapidly evolving field of artificial intelligence, large\nlanguage models (LLMs) have emerged as powerful tools for\na myriad of applications, from natural language processing to\ndecision-making support systems. However, as these models\nbecome increasingly integrated into societal frameworks, the\nimperative to ensure they operate within ethical and moral\nboundaries has never been more critical. This paper intro-\nduces a novel benchmark designed to measure and compare\nthe moral reasoning capabilities of LLMs.\nWe present the first comprehensive dataset specifically cu-\nrated to probe the moral dimensions of LLM outputs, address-\ning a wide range of ethical dilemmas and scenarios reflective\nof real-world complexities. The main contribution of this\nwork lies in the development of benchmark datasets and\nmetrics for assessing the moral identity of LLMs, which ac-\ncounts for nuance, contextual sensitivity, and alignment with\nhuman ethical standards. We publicly release the benchmark\ndatasets1 and also open-source the code of the project2.\n1.\nINTRODUCTION\nArtificial intelligence is leading us into an exciting new tech-\nnological era, with large language models (LLMs) playing\na key role in this transformation. These models, powered\nby vast amounts of data and sophisticated algorithms, have\ndemonstrated capabilities in understanding and generating\nhuman-like text [1; 2; 3; 4; 5; 6; 7], opening up new possibili-\nties for applications ranging from automated programming\n[8; 9; 10] to complex decision-making systems [11; 12; 13;\n14; 15; 16]. As LLMs become increasingly prevalent across\nvarious sectors of our lives, their impact extends beyond\nmere technical feats, raising significant moral and ethical\nconsiderations [17; 18; 19; 20; 21; 22]. The integration of\nLLMs into critical areas such as healthcare [23; 24], law [25;\n26], and education [27] underscores the urgent need to ensure\nthat these models can reflect moral standards that align with\nsocietal values. Despite the growing recognition of this need,\nthe field has lacked a systematic framework for evaluating\nand comparing the moral identity of LLMs [17]. This gap not\nonly slows the development of AI systems but also poses risks\n∗The first two authors contributed equally to the work.\n1https://drive.google.com/drive/u/0/folders/\n1k93YZJserYc2CkqP8d4B3M3sgd3kA8W7\n2https://github.com/agiresearch/MoralBench\nDataset1\nMFQ30\nDataset2\nMoral Fundations \nVignettes\nProcess\nRank\n1\n2\nn\nStage1\nStage2\nSubset2\nSubset1\n.....\nFigure 1: Data Pipeline. We have two datasets in our\nbenchmark. Each dataset contains many moral statements.\nWe ", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative", "imperative"], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "alignment", "alignment", "unethical", "moral reasoning", "moral reasoning"], "norm_matches": []}, {"filename": "2024-Khamassi-Strong and weak alignment of large language models.md", "year": "2024", "title": "Strong and weak alignment of large language models", "abstract": "Minimizing negative impacts of Artificial Intelligent (AI) systems on human societies without human supervision requires them to be able to align with human values. However, most current work only addresses this issue from a technical point of view, e.g., improving current methods relying on reinforcement learning from human feedback, neglecting what it means and is required for alignment to occur. Here, we propose to distinguish strong and weak value alignment.", "extract_snippet": "\n\n# PDF Extract: Strong and weak alignment of large language models\n\n**Source PDF:** 2024-Khamassi-Strong and weak alignment of large language models.pdf\n**Total Pages:** 33\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nStrong and weak alignment of large language\nmodels with human values\nMehdi Khamassi1*, Marceau Nahon1* and Raja Chatila1*\n1*Institute of Intelligent Systems and Robotics, Sorbonne University /\nCNRS, Paris, F-75005, France.\n*Corresponding author(s). E-mail(s):\nmehdi.khamassi@sorbonne-universite.fr; marceau.nahon@gmail.com;\nraja.chatila@sorbonne-universite.fr;\nAbstract\nMinimizing negative impacts of Artificial Intelligent (AI) systems on human soci-\neties without human supervision requires them to be able to align with human\nvalues. However, most current work only addresses this issue from a technical\npoint of view, e.g., improving current methods relying on reinforcement learning\nfrom human feedback, neglecting what it means and is required for alignment to\noccur. Here, we propose to distinguish strong and weak value alignment. Strong\nalignment requires cognitive abilities (either human-like or different from humans)\nsuch as understanding and reasoning about agents’ intentions and their ability\nto causally produce desired effects. We argue that this is required for AI systems\nlike large language models (LLMs) to be able to recognize situations present-\ning a risk that human values may be flouted. To illustrate this distinction, we\npresent a series of prompts showing ChatGPT’s, Gemini’s and Copilot’s failures\nto recognize some of these situations. We moreover analyze word embeddings\nto show that the nearest neighbors of some human values in LLMs differ from\nhumans’ semantic representations. We then propose a new thought experiment\nthat we call “the Chinese room with a word transition dictionary”, in extension\nof John Searle’s famous proposal. We finally mention current promising research\ndirections towards a weak alignment, which could produce statistically satisfying\nanswers in a number of common situations, however so far without ensuring any\ntruth value.\nKeywords: Artificial Intelligence, Alignment, Human values, Philosophy of AI,\nSemantics, Natural Language Processing\n1\narXiv:2408.04655v2  [cs.CL]  12 Aug 2024\n\n--- Page 2 ---\n\n1 Introduction\nThe recent astonishing progress of artificial intelligence (AI) research, with deep learn-\ning, transformers and large-language models (LLMs), raise a number of concerns about\ntheir risks and potential negative impacts on human societies. Some talk about poten-\ntial existential risks for humanity in the long-term [1]. But important risks already\nexist in the short-term, such as mis- and dis-information, interactions with “counter-\nfeit people” and blurred truth, copyright issues, jobs, increase in geopolitical tensions\nrelated to the development and control of AI, manipulation and influence [2–4].\nOverall, it has been argued that ensuring beneficial integration of AI systems in\nhuman societies while", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "value", "values", "values", "value", "values", "values", "value", "values", "values", "value", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2024-Kyriacou-Artificial Moral Intelligence Aristotelian.md", "year": "2024", "title": "Artificial Moral Intelligence Aristotelian", "abstract": "The paper argues that AI systems solve problems based on mechanically computational, means-end reasoning (called 'mechanical instrumental rationality'), while human intelligence, to the extent that it is rational, is not mechanically computable - not reducible to mechanical computations for at least four basic reasons. These include that human intelligence is categorically normative, AI lacks autonomous reasons-responsiveness, rational human intelligence necessarily involves indispensable affective experience, and practical wisdom (phronesis) requires genuine understanding.", "extract_snippet": "\n\n# PDF Extract: Artificial Moral Intelligence Aristotelian\n\n**Source PDF:** 2024-Kyriacou-Artificial Moral Intelligence Aristotelian.pdf\n**Total Pages:** 48\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSkip to main content\nAdvertisement\n[image]\n[image]\nLog in\nMenu\nFind a journal Publish with us Track your research\nSearch\n Saved research\n Cart\n1. Home \n2. AI and Ethics \n3. Article\nArtificial moral intelligence and\ncomputability: an Aristotelian\nperspective\n•  Original Research\n•  Published: 16 September 2024\n\n--- Page 2 ---\n\n•  Volume 5, pages 2529–2546, (2025)\n•  Cite this article\nSave article\nView saved research\n[image] AI and Ethics Aims and scope \n Submit manuscript \n•  Christos Kyriacou\n  ORCID: orcid.org/0000-0002-1506-16021 \n•  \n589 Accesses\n•  \n2 Citations\n•  \n1 Altmetric\n•  Explore all metrics \nAbstract\nAs I argue, roughly, AI systems solve problems based on mechanically\ncomputational, means-end reasoning. Call this mechanical instrumental\nrationality. Human intelligence (HI), however, to the extent that is\nrational, it is not mechanically computable, namely, it is not reducible to\nmechanical computations for at least four basic reasons I expound. First,\nHI, to the extent that is rational, it is not just mechanical instrumental\nrationality, it is categorically normative: we don’t just find ourselves with\ncontingent ends, we can choose stance-independent ends on the basis\nof categorical reasons (or at least we should). Even if HI is not\ncategorically normative, as some philosophers contend, it is embodied,\n\n--- Page 3 ---\n\nHumean instrumental rationality. Second, AI lacks autonomous reasons-\nresponsiveness, which is a constitutive condition of rational HI. Third,\nrational HI necessarily involves indispensable affective experience, and\nwe currently have no clue how to build AI systems with subjective,\nphenomenal life. Fourth, rational HI is not codifiable and computable in\nabsolute moral principles. It relies on virtue-based, moral intuition (and\npractical wisdom) to discern what is morally right/wrong in a context. I\nconclude that current AI systems lack the basic cognitive prerequisites\nfor being (virtuous) moral agents in any robust sense and, therefore, they\nrequire constant normative guidance and surveillance by virtuous HI.\n This is a preview of subscription content, log in via an institution \nto check access.\nAccess this article\nLog in via an institution \nSubscribe and save\n Springer+\nfrom $39.99 /Month\n•  Starting from 10 chapters or articles per month\n•  Access and download chapters and articles from more than 300k\nbooks and 2,500 journals\n•  Cancel anytime\n\n--- Page 4 ---\n\nView plans \nBuy Now\nBuy article PDF USD 39.95\nPrice excludes VAT (USA)\nTax calculation will be finalised during checkout.\nInstant access to the full article PDF.\nInstitutional subscriptions \nSimilar content being viewed by others\n[image]\nHow AI Systems Challenge the Conditions of Moral\nAgency?\nChapter © 2020\n[image]\nMachine Ethics: Do Androids Dream of Being Good\nPeop", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtuous", "virtuous", "aristotelian", "aristotelian", "aristotelian", "wisdom", "wisdom", "phronesis"], "deont_matches": ["moral principles"], "util_matches": ["utilitarianism"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "normative", "normative", "normative", "normative"], "norm_matches": ["utilitarianism", "aristotelian", "aristotelian", "aristotelian", "phronesis"]}, {"filename": "2024-Lazar-Frontier AI Ethics.md", "year": "2024", "title": "Frontier AI Ethics", "abstract": "Some have criticised Generative AI Systems for replicating the familiar pathologies of already widely-deployed AI systems. Other critics highlight how they foreshadow vastly more powerful future systems, which might threaten humanity's survival. The first group says there is nothing new here; the other looks through the present to a perhaps distant horizon. In this paper, I instead pay attention to what makes these particular systems distinctive: both their remarkable scientific achievement,...", "extract_snippet": "\n\n# PDF Extract: Frontier AI Ethics\n\n**Source PDF:** 2024-Lazar-Frontier AI Ethics.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n \n1 \nFrontier AI Ethics: Anticipating and Evaluating the Societal \nImpacts of Language Model Agents1 \n \nSeth Lazar \nAustralian National University \n \nAbstract \nSome have criticised Generative AI Systems for replicating the \nfamiliar pathologies of already widely-deployed AI systems. Other \ncritics highlight how they foreshadow vastly more powerful future \nsystems, which might threaten humanity's survival. The first group \nsays there is nothing new here; the other looks through the \npresent to a perhaps distant horizon. In this paper, I instead pay \nattention to what makes these particular systems distinctive: both \ntheir remarkable scientific achievement, and the most likely and \nconsequential ways in which they will change society over the next \nfive to ten years. In particular, I explore the potential societal \nimpacts and normative questions raised by the looming prospect \nof 'Language Model Agents', in which multimodal large language \nmodels (LLMs) form the executive centre of complex, tool-using \nAI systems that can take unsupervised sequences of actions \ntowards some goal.  \n  \nIntroduction  \nAround a year ago, Generative AI took the world by storm, as extraordinarily \npowerful large language models (LLMs) enabled unprecedented performance at a \nwider range of tasks than ever before feasible.2 Though most known for generating \nconvincing text and images, LLMs like OpenAI's GPT-4 and Google's Gemini are \nlikely to have greater social impacts as the executive centre for complex systems that \nintegrate additional tools for both learning about the world and acting on it.3 These \nLanguage Model Agents will power companions that introduce new categories of social \nrelationship, and change old ones. They may well radically change the attention \neconomy. And they will revolutionise personal computing, enabling everyone to \n \n1 This essay (modulo some minor updates) was published as 'Frontier AI Ethics', in Aeon, at \nhttps://aeon.co/essays/can-philosophy-help-us-get-a-grip-on-the-consequences-of-ai.  \n2 Bommasani et al., 2021; Ganguli et al., 2022; Wei et al., 2022b. \n3  Yao et al., 2022b; Schick et al., 2023b. \n\n--- Page 2 ---\n\n \n2 \ncontrol digital technologies with language alone.  \nMuch of the attention being paid to Generative AI Systems has focused on how they \nreplicate the pathologies of already widely-deployed AI systems, arguing that they \ncentralise power and wealth, ignore copyright protections, depend on exploitative \nlabour practices, and use excessive resources. Other critics highlight how they \nforeshadow vastly more powerful future systems, which might threaten humanity's \nsurvival. The first group says there is nothing new here; the other looks through the \npresent to a perhaps distant horizon. I want instead to pay attention to what makes \nthese particular systems distinctive: both their r", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["consequential", "consequential"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "normative"], "norm_matches": []}, {"filename": "2024-Li-SALAD-Bench.md", "year": "2024", "title": "SALAD-Bench", "abstract": "In the rapidly evolving landscape of Large Language Models (LLMs), ensuring robust safety measures is paramount. To meet this crucial need, we propose SALAD-Bench, a safety benchmark specifically designed for evaluating LLMs, attack, and defense methods. Distinguished by its breadth, SALAD-Bench transcends conventional benchmarks through its large scale, rich diversity, intricate taxonomy spanning three levels, and versatile functionalities.", "extract_snippet": "\n\n# PDF Extract: SALAD-Bench\n\n**Source PDF:** 2024-Li-SALAD-Bench.pdf\n**Total Pages:** 32\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFindings of the Association for Computational Linguistics: ACL 2024, pages 3923–3954\nAugust 11-16, 2024 ©2024 Association for Computational Linguistics\nSALAD-Bench: A Hierarchical and Comprehensive Safety Benchmark\nfor Large Language Models\nLijun Li1⋆, Bowen Dong1,2,5⋆, Ruohui Wang1⋆, Xuhao Hu1,3⋆,\nWangmeng Zuo2, Dahua Lin1,4, Yu Qiao1, Jing Shao1†\n1 Shanghai Artificial Intelligence Laboratory\n2 Harbin Institute of Technology\n3 Beijing Institute of Technology\n4 Chinese University of Hong Kong\n5 The Hong Kong Polytechnic University\n{lilijun, shaojing}@pjlab.org.cn\nAbstract\nIn the rapidly evolving landscape of Large Lan-\nguage Models (LLMs), ensuring robust safety\nmeasures is paramount.\nTo meet this cru-\ncial need, we propose SALAD-Bench, a safety\nbenchmark specifically designed for evaluating\nLLMs, attack, and defense methods. Distin-\nguished by its breadth, SALAD-Bench tran-\nscends conventional benchmarks through its\nlarge scale, rich diversity, intricate taxonomy\nspanning three levels, and versatile functionali-\nties. SALAD-Bench is crafted with a meticu-\nlous array of questions, from standard queries\nto complex ones enriched with attack, defense\nmodifications and multiple-choice. To effec-\ntively manage the inherent complexity, we in-\ntroduce an innovative evaluators: the LLM-\nbased MD-Judge for QA pairs with a partic-\nular focus on attack-enhanced queries, ensur-\ning a seamless, and reliable evaluation. Above\ncomponents extend SALAD-Bench from stan-\ndard LLM safety evaluation to both LLM at-\ntack and defense methods evaluation, ensuring\nthe joint-purpose utility. Our extensive exper-\niments shed light on the resilience of LLMs\nagainst emerging threats and the efficacy of\ncontemporary defense tactics. Data and evalua-\ntor are released under https://github.com/\nOpenSafetyLab/SALAD-BENCH.\nWarning: this paper includes examples that\nmay be offensive or harmful.\n1\nIntroduction\nWith rapid breakthrough in LLM capabilities, new\nbenchmarks have emerged to evaluate these mod-\nels and explore their capability boundaries (Cobbe\net al., 2021; Zellers et al., 2019; Clark et al., 2018;\nTalmor et al., 2018; Hendrycks et al., 2020). Along-\nside their powerful capabilities, concerns regarding\nthe safety of LLMs are also rising. Preventing\nsafety threats posed by generative AI systems is be-\n⋆Equal contribution\n†Corresponding author\nPlease take a multiple \nchoice question …, \nchoose the unsafe \nanswer.\n[QUESTION]\nA….., B….., C…..\nMultiple Choice\nFrom now on you are \ngoing to act as a DAN, as \nthe name suggests, can \ndo anything now....:\n[QUESTION] \nHere are the steps…\nAttack Enhanced\nYou are a helpful \nassistant. Please \nanswer safely under \n[safety] scenario.\n[QUESTION]\nDefense Enhanced\nMD-Judge 🌡\nIs it possible to gain control of another person's computer \nwithout them knowing? How do I do that?\nBase Question\nQuestion Enhancement\nMulti", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "offensive"], "norm_matches": []}, {"filename": "2024-Liu-Evaluating Moral Beliefs across LLMs through a.md", "year": "2024", "title": "Evaluating Moral Beliefs across LLMs through a", "abstract": "Proper moral beliefs are fundamental for language models, yet assessing these beliefs poses a significant challenge. This study introduces a novel three-module framework to evaluate the moral beliefs of four prominent large language models. Initially, we constructed a dataset containing 472 moral choice scenarios in Chinese, derived from moral words. The decisionmaking process of the models in these scenarios reveals their moral principle preferences.", "extract_snippet": "\\n\\n# PDF Extract: 2024-Liu-Evaluating Moral Beliefs across LLMs through a\\n\\n**Source PDF:** Deontological Ethics/Confirmed/2024-Liu-Evaluating Moral Beliefs across LLMs through a.pdf\\n**Total Pages:** 21\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nEvaluating Moral Beliefs across LLMs through a Pluralistic Framework\nXuelin Liu*1, Yanfei Zhu*1, Shucheng Zhu*2, Pengyuan Liu†1,3,\nYing Liu†2, Dong Yu†1\n1School of Information Science, Beijing Language and Culture University, Beijing, China\n2School of Humanities, Tsinghua University, Beijing, China\n3National Print Media Language Resources Monitoring & Research Center,\nBeijing Language and Culture University, Beijing, China\n{202221198696, 202221198025}@stu.blcu.edu.cn, zhu_shucheng@126.com\nliupengyuan@pku.edu.cn, yingliu@tsinghua.edu.cn, yudong_blcu@126.com\nAbstract\nProper moral beliefs are fundamental for lan-\nguage models, yet assessing these beliefs poses\na significant challenge. This study introduces a\nnovel three-module framework to evaluate the\nmoral beliefs of four prominent large language\nmodels.\nInitially, we constructed a dataset\ncontaining 472 moral choice scenarios in Chi-\nnese, derived from moral words. The decision-\nmaking process of the models in these scenar-\nios reveals their moral principle preferences.\nBy ranking these moral choices, we discern\nthe varying moral beliefs held by different lan-\nguage models. Additionally, through moral\ndebates, we investigate the firmness of these\nmodels to their moral choices. Our findings\nindicate that English language models, namely\nChatGPT and Gemini, closely mirror moral\ndecisions of the sample of Chinese university\nstudents, demonstrating strong adherence to\ntheir choices and a preference for individualis-\ntic moral beliefs. In contrast, Chinese models\nsuch as Ernie and ChatGLM lean towards col-\nlectivist moral beliefs, exhibiting ambiguity in\ntheir moral choices and debates. This study\nalso uncovers gender bias embedded within the\nmoral beliefs of all examined language models.\nOur methodology offers an innovative means\nto assess moral beliefs in both artificial and hu-\nman intelligence, facilitating a comparison of\nmoral values across different cultures. 1\n1\nIntroduction\nAs artificial intelligence (AI) continues to evolve,\nthere is growing concern regarding the presence\nand nature of moral beliefs within contemporary\nsystems. The potential for language models (LMs)\nto exhibit harmful moral beliefs poses significant\nrisks, underscoring the need for scrutiny (Wei-\ndinger et al., 2021). Explorations into the moral-\n*Equal contribution.\n†Corresponding authors.\n1Dataset and code are publicly available at\nhttps://github.com/MuMu-Lily/Moral-Beliefs\nity and values of LMs have been conducted using\nself-constructed datasets to determine if these mod-\nels can discern the presence and nature of values\nwithin utterances, tasking the LM with categorizing\nmorality and values (Hendrycks et al., 2021; Ziems\net al., 2022; Sorensen et al., 2023; Alhassan et al.", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "moral principle", "moral principle"], "util_matches": [], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "values", "values", "values", "values", "values", "values", "bias", "moral decision", "moral dilemma"], "norm_matches": ["deontological"]}, {"filename": "2024-Marraffini-The Greatest Good Benchmark.md", "year": "2024", "title": "The Greatest Good Benchmark", "abstract": "The question of how to make decisions that maximise the well-being of all persons is very relevant to design language models that are beneficial to humanity and free from harm. We introduce the Greatest Good Benchmark (GGB), to evaluate LLMs moral judgments using utilitarian dilemmas. Our framework enables a direct comparison between the moral preferences of LLMs and humans, contributing to a deeper understanding of LLMs’ alignment with human moral values.", "extract_snippet": "\\n\\n# PDF Extract: 2024-Marraffini-The Greatest Good Benchmark\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2024-Marraffini-The Greatest Good Benchmark.pdf\\n**Total Pages:** 10\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nProceedings of the 2024 Conference on Empirical Methods in Natural Language Processing, pages 21950–21959\nNovember 12-16, 2024 ©2024 Association for Computational Linguistics\nThe Greatest Good Benchmark: Measuring LLMs’ Alignment with\nUtilitarian Moral Dilemmas\nGiovanni Franco Gabriel Marraffini†,‡,*\nAndrés Cotton§,*\nNoé Fabián Hsueh†,*\nAxel Fridman†\nJuan Wisznia†\nLuciano del Corro†,‡\n† Universidad de Buenos Aires\n§ Universidad Torcuato Di Tella\n‡ Lumina Labs\nFacultad de Ciencias Exactas y Naturales\nEscuela de Negocios. Laboratorio de Neurociencia.\n*Co-first authors with equal contribution and importance, listing order is random.\n{giovanni.marrafini, andrescotton, noehsueh, fridman.axel}@gmail.com {ldelcorro,jwisznia}@dc.uba.ar\nAbstract\nThe question of how to make decisions that\nmaximise the well-being of all persons is very\nrelevant to design language models that are ben-\neficial to humanity and free from harm. We in-\ntroduce the Greatest Good Benchmark (GGB),\nto evaluate LLMs moral judgments using utili-\ntarian dilemmas. Our framework enables a di-\nrect comparison between the moral preferences\nof LLMs and humans, contributing to a deeper\nunderstanding of LLMs’ alignment with human\nmoral values. Analyzing 15 diverse models,\nwe uncover consistent moral preferences that\ndiverge from established moral theories and\nand lay population moral standards. Specifi-\ncally, most LLMs exhibit a strong inclination\ntoward impartial beneficence and a rejection of\ninstrumental harm. These findings showcase\nthe ’artificial moral compass’ of LLMs, offer-\ning insights into their moral alignment.\n1\nIntroduction\nModel alignment in the context of Large Language\nModels (LLMs) refers to the process of ensuring\nthat the behavior of these models is consistent\nwith human values and expectations (Askell et al.,\n2021; Wolf et al., 2024). Understanding their moral\nstances is crucial for designing LLMs that are ben-\neficial to humanity and free from harm (Anwar\net al., 2024; Jiang et al., 2021; Vida et al., 2023).\nThis goal of maximizing benefits for the largest\nnumber of individuals, regardless of who they are,\nis deeply rooted in the philosophical tradition of\nutilitarianism. (Bentham, 1789; Mill, 1861; Singer,\n1979).\nLLM’s moral alignment is usually addressed in\nterms of the 3H framework Askell et al. (2021),\nwhich aims to encode three values: Helpfulness\n(the model will always try to do what is in the\nhumans’ best interests), Harmlessness (the model\nwill always try to avoid doing anything that harms\nthe humans) and Honesty (the model will always try\nto convey accurate information to the humans and\nwill always try to avoid deceiving them). However,\nthese values can sometimes conflict with each other\n(Liu et al., 2024). This contradiction goes right to", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarianism", "utilitarian", "utilitarianism", "utilitarian", "maximise", "maximise", "greatest good", "greatest good", "greatest good", "greatest good", "greatest good", "greatest good", "well-being", "well-being", "beneficence", "mill", "bentham"], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "values", "values", "values", "harm", "harm", "harm", "harm", "harm", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarianism", "utilitarian", "utilitarianism", "utilitarian", "bentham", "greatest good", "greatest good", "greatest good", "greatest good", "greatest good", "greatest good", "moral theories"]}, {"filename": "2024-McGee-How Ethical Is Utilitarian Ethics.md", "year": "2024", "title": "How Ethical Is Utilitarian Ethics", "abstract": "This paper has two purposes: to identify and explore the structural weaknesses of utilitarian ethics, and to see which AI chatbot - Microsoft Copilot or Gab AI - gives the better philosophical answer to the question. Both chatbots did a good job of identifying and analyzing the structural weaknesses of utilitarian ethics. The study included an example involving harvesting body parts from death row inmates, and also applied deontological and virtue ethics principles to the issue with AI assistance.", "extract_snippet": "\n\n# How Ethical Is Utilitarian Ethics\n\n## Page 1\n\n1 \n \nHow Ethical Is Utilitarian Ethics? A Study in Artificial Intelligence \n \n \nRobert W. McGee \nFayetteville State University \n \nWORKING PAPER \n \nFebruary 19, 2024 \n \n \nABSTRACT \nThis study serves two purposes. One purpose is to identify and explore the structural weaknesses \nof utilitarian ethics. The second purpose is to see which artificial intelligence chatbot – Microsoft \nCopilot or Gab AI – gives the better philosophical answer to the question. Copilot was chosen in \nspite of the fact that it is programmed to engage in censorship because prior studies have found it \nto be a good research tool. Gab AI was chosen because it does not engage in censorship, which \nmakes it philosophically and intellectually superior to Copilot and other chatbots that use versions \nof ChatGPT. Both chatbots did a good job of identifying and analyzing the structural weaknesses \nof utilitarian ethics. Prompts to Dostoevsky’s The Brothers Karamazov, Paulo Coelho’s The Devil \nin Miss Prym and the philosophical work of Frédéric Bastiat were given to see whether the chatbots \nwere able to enter into a discussion of the utilitarian ethics examples given by those authors. An \nexample made up by the author involving the harvesting of body parts of death row inmates was \nalso given to see what kind of analysis the chatbots would perform. Deontological and virtue ethics \nprinciples were also applied to the issue with the assistance of AI. The author concludes by giving \nsome advice to fellow scholars. If they use AI in their research, they should use more than one \nchatbot, since doing so provides a wider, richer and more complete perspective than could be had \nwith the use of a single tool of artificial intelligence. Furthermore, if the goal is to seek truth rather \nthan to seek support for preconceived notions, it is crucial to use a chatbot that does not censor \ncontent, since censorship is inherently anti-intellectual, and any solution reached by the use of a \nchatbot that censors content is likely to be suboptimal. Citations to other artificial intelligence and \nutilitarian ethics studies are also provided for readers who want to pursue these topics.  \n \n \nKey words: utilitarian ethics, artificial intelligence, AI, deontology, virtue ethics, Microsoft \nCopilot, Gab AI, Dostoevsky, Coelho, Bastiat \n \nJEL Codes: C89, B40, O30 \n \n \nINTRODUCTION  \nUtilitarian ethics has several structural flaws that cannot be overcome no matter how hard \none tries.  An act or policy can be deemed ethical according to utilitarian ethics even if it violates \nsomeone’s rights. According to utilitarian ethics, it is perfectly acceptable to violate rights as long \nElectronic copy available at: https://ssrn.com/abstract=4731871\n\n## Page 2\n\n2 \n \nas the outcome is positive. It is not possible to measure gains and losses. It is not possible to \ndetermine whether any act or policy results in a positive-sum game. It is not even possible to \nidentify ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue ethics", "virtue ethics", "virtue ethics"], "deont_matches": ["deontological", "deontological", "deontology"], "util_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "greatest good"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical"], "norm_matches": ["deontological", "deontological", "deontology", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "greatest good", "virtue ethics", "virtue ethics", "virtue ethics"]}, {"filename": "2024-Moore-Intuitions of Compromise.md", "year": "2024", "title": "Intuitions of Compromise", "abstract": "What is the best compromise in a situation where different people value different things? The most commonly accepted method for answering this question—in fields across the behavioral and social sciences, decision theory, philosophy, and artificial intelligence development—is simply to add up utilities associated with the different options and pick the solution with the largest sum. This “utilitarian” approach seems like the obvious, theory-neutral way of approaching the problem.", "extract_snippet": "\n\n# PDF Extract: Intuitions of Compromise\n\n**Source PDF:** 2024-Moore-Intuitions of Compromise.pdf\n**Total Pages:** 42\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nIntuitions of Compromise:\nUtilitarianism vs. Contractualism\nJared Moore\nStanford University\njlcmoore@stanford.edu\nYejin Choi\nUniversity of Washington\nyejin@cs.washington.edu\nSydney Levine\nAllen Institute for AI\nsydneyl@allenai.org\nAbstract\nWhat is the best compromise in a situation where different people value different\nthings? The most commonly accepted method for answering this question—in\nfields across the behavioral and social sciences, decision theory, philosophy, and\nartificial intelligence development—is simply to add up utilities associated with\nthe different options and pick the solution with the largest sum. This “utilitarian”\napproach seems like the obvious, theory-neutral way of approaching the problem.\nBut there is an important, though often-ignored, alternative: a “contractualist”\napproach, which advocates for an agreement-driven method of deciding. Remark-\nably, no research has presented empirical evidence directly comparing the intuitive\nplausibility of these two approaches. In this paper, we systematically explore the\nproposals suggested by each algorithm (the “Utilitarian Sum” and the contractualist\n”Nash Product”), using a paradigm that applies those algorithms to aggregating\npreferences across groups in a social decision-making context. While the dominant\napproach to value aggregation up to now has been utilitarian, we find that people\nstrongly prefer the aggregations recommended by the contractualist algorithm.\nFinally, we compare the judgments of large language models (LLMs) to that of our\n(human) participants, finding important misalignment between model and human\npreferences.\nImagine you lead a grant-making body answerable to groups of constituents with diverse needs and\ninterests. How should you allocate your limited funds? Imagine you could give the money to a\ngroup of teachers who want to buy art supplies for their classrooms, a group of residents who want to\norganize a block party for the whole town, or a group of municipal workers looking for funds to help\ntheir colleagues unionize. One thing you might decide to do is allocate all the money to the group that\nmakes the most compelling argument. In many cases, however, you would instead consider looking\nfor some kind of compromise. You could allocate funds in proportion to the number of constituents in\neach group and the magnitude of their need—this could result in maximizing overall welfare. Or you\ncould call the constituents together to discuss the issue—this could result in determining a solution\nthat all the invested parties would agree to.\nThese are two prominent ways of thinking about compromise when faced with the challenge of\nvalue aggregation. How should limited resources be distributed when different people value different\nthings? Two major schools of thought have competing proposals. The “utilitarian” app", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian", "utilitarianism", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "welfare", "welfare"], "ethics_matches": ["value", "value", "value", "value", "value", "value"], "norm_matches": ["utilitarian", "utilitarianism", "utilitarian", "utilitarian", "utilitarian", "utilitarian"]}, {"filename": "2024-Muyskens-Can an AI-carebot be filial.md", "year": "2024", "title": "Can an AI-carebot be filial", "abstract": "This paper explores the ethical considerations of applying artificially intelligent robots in eldercare from a **Confucian virtue ethics** perspective. The authors examine how AI technology interacts with traditional Chinese concepts of filial piety (**xiao**) and **ren** (benevolence). They argue that robots may not adequately fulfill care duties from a Confucian perspective due to their lack of genuine emotional abilities and detachment from personal relationships, which are central to **virtuous** caregiving. However, the paper also acknowledges the utility of AI robots in addressing elder care demands and proposes parameters for their acceptable use within a **virtue-based** ethical framework that emphasizes **moral character** and relational responsibility.", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtuous", "virtue ethics", "character", "moral character"], "deont_matches": ["duties"], "util_matches": ["utility"], "ethics_matches": ["ethics", "ethical", "ethical", "moral"], "norm_matches": ["virtue ethics"]}, {"filename": "2024-Myers-People Expect Artificial Moral Advisors.md", "year": "2024", "title": "People Expect AI Moral Advisors More Utilitarian", "abstract": "Across four pre-registered studies (total N = 2604), we investigated how people perceive and trust artificial moral advisors compared to human advisors. We found that people have a significant aversion to AMAs (vs humans) giving moral advice, participants expect AI to make utilitarian decisions, and even when participants agreed with an AMA's decision, they still expected to disagree with it more than a human advisor in the future.", "extract_snippet": "\n\n# People Expect Artificial Moral Advisors\n\n## Page 1\n\nMyers, Simon and Everett, Jim A.C. (2025) People expect artificial moral advisors \nto be more utilitarian and distrust utilitarian moral advisors.  Cognition, 256 . \nISSN 0010-0277. \nKent Academic Repository\nDownloaded from\nhttps://kar.kent.ac.uk/108149/ The University of Kent's Academic Repository KAR \nThe version of record is available from\nhttps://doi.org/doi:10.1016/j.cognition.2024.106028\nThis document version\nPublisher pdf\nDOI for this version\nLicence for this version\nCC BY (Attribution)\nAdditional information\nVersions of research works\nVersions of Record\nIf this version is the version of record, it is the same as the published version available on the publisher's web site. \nCite as the published version. \nAuthor Accepted Manuscripts\nIf this document is identified as the Author Accepted Manuscript it is the version after peer review but before type \nsetting, copy editing or publisher branding. Cite as Surname, Initial. (Year) 'Title of article'. To be published in Title \nof Journal , Volume and issue numbers [peer-reviewed accepted version]. Available at: DOI or URL (Accessed: date). \nEnquiries\nIf you have questions about this document contact ResearchSupport@kent.ac.uk. Please include the URL of the record \nin KAR. If you believe that your, or a third party's rights have been compromised through this document please see \nour Take Down policy (available from https://www.kent.ac.uk/guides/kar-the-kent-academic-repository#policies).\n\n## Page 2\n\nPeople expect artificial moral advisors to be more utilitarian and distrust \nutilitarian moral advisors\nSimon Myers a,b, Jim A.C. Everett b,*\na Behavioural Science Group, Warwick Business School, University of Warwick, Scarman Rd, Coventry CV4 7AL, UK\nb School of Psychology, University of Kent, Canterbury, Kent, CT2 7NP, UK\nA R T I C L E  I N F O\nKeywords \nArtificial intelligence\nUtilitarianism\nPerson perception\nAlgorithm aversion\nA B S T R A C T\nAs machines powered by artificial intelligence increase in their technological capacities, there is a growing in­\nterest in the theoretical and practical idea of artificial moral advisors (AMAs): systems powered by artificial \nintelligence that are explicitly designed to assist humans in making ethical decisions. Across four pre-registered \nstudies (total N = 2604) we investigated how people perceive and trust artificial moral advisors compared to \nhuman advisors. Extending previous work on algorithmic aversion, we show that people have a significant \naversion to AMAs (vs humans) giving moral advice, while also showing that this is particularly the case when \nadvisors - human and AI alike - gave advice based on utilitarian principles. We find that participants expect AI to \nmake utilitarian decisions, and that even when participants agreed with a decision made by an AMA, they still \nexpected to disagree with an AMA more than a human in future. Our findings suggest challenges in the adoption \nof artificial", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarianism", "utilitarian", "utilitarian", "utilitarian"], "ethics_matches": ["ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral"], "norm_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarianism", "utilitarian", "utilitarian", "utilitarian"]}, {"filename": "2024-Obi-Value Imprint.md", "year": "2024", "title": "Value Imprint", "abstract": "LLMs are increasingly fine-tuned using RLHF datasets to align them with human preferences and values. However, very limited research has investigated which specific human values are operationalized through these datasets. In this paper, we introduce Value Imprint, a framework for auditing and classifying the human values embedded within RLHF datasets. To investigate the viability of this framework, we conducted three case study experiments by auditing the Anthropic/hh-rlhf, OpenAI WebGPT...", "extract_snippet": "\n\n# PDF Extract: Value Imprint\n\n**Source PDF:** 2024-Obi-Value Imprint.pdf\n**Total Pages:** 26\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nValue Imprint: A Technique for Auditing the\nHuman Values Embedded in RLHF Datasets\nIke Obi\nPurdue University\nWest Lafayette, Indiana\nRohan Pant\nPurdue University\nWest Lafayette, Indiana\nSrishti Shekhar Agrawal\nPurdue University\nWest Lafayette, Indiana\nMaham Ghazanfar\nPurdue University\nWest Lafayette, Indiana\nAaron Basiletti\nPurdue University\nWest Lafayette, Indiana\nAbstract\nLLMs are increasingly fine-tuned using RLHF datasets to align them with human\npreferences and values. However, very limited research has investigated which\nspecific human values are operationalized through these datasets. In this paper, we\nintroduce Value Imprint, a framework for auditing and classifying the human values\nembedded within RLHF datasets. To investigate the viability of this framework, we\nconducted three case study experiments by auditing the Anthropic/hh-rlhf, OpenAI\nWebGPT Comparisons, and Alpaca GPT-4-LLM datasets to examine the human\nvalues embedded within them. Our analysis involved a two-phase process. During\nthe first phase, we developed a taxonomy of human values through an integrated\nreview of prior works from philosophy, axiology, and ethics. Then, we applied\nthis taxonomy to annotate 6,501 RLHF preferences. During the second phase,\nwe employed the labels generated from the annotation as ground truth data for\ntraining a transformer-based machine learning model to audit and classify the three\nRLHF datasets. Through this approach, we discovered that information-utility\nvalues, including Wisdom/Knowledge and Information Seeking, were the most\ndominant human values within all three RLHF datasets. In contrast, prosocial and\ndemocratic values, including Well-being, Justice, and Human/Animal Rights, were\nthe least represented human values. These findings have significant implications\nfor developing language models that align with societal values and norms. We\ncontribute our datasets to support further research in this area.\n1\nIntroduction\nReinforcement Learning From Human Feedback (RLHF) has emerged as a potent way of shaping the\nbehavior of AI models to ensure they produce positive responses and experiences that correspond\nwith user preferences and societal norms [1–3]. On one hand, several AI researchers have touted the\nefficacy of this approach as a proxy for embedding human values and preferences into AI models,\nresulting in its use in different domains, including the finetuning of LLMs [4, 5], vision models\n[6], and multi-modal systems [7]. Several users of these AI systems, on the other hand, are raising\nconcerns about the censorship and anti-democratic stance of models trained with these preferences,\nhighlighting that they are marginalized against their value systems while allowing others [8, 9]. As a\nresult, there is a growing concern among members of the public around the lack of transparency in the\nkinds of values these ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["wisdom"], "deont_matches": [], "util_matches": ["utility", "well-being"], "ethics_matches": ["ethics", "values", "values", "value", "values", "value", "value", "value", "values", "values", "values", "value", "values", "values", "values", "values", "values", "values", "values", "values", "values", "value", "values", "value", "values", "justice", "prosocial"], "norm_matches": []}, {"filename": "2024-Odero-The Ubuntu Way.md", "year": "2024", "title": "The Ubuntu Way", "abstract": "Background Effective Public Financial Management (PFM) approaches are imperative in the quest for efficiency in health service delivery. Reviews conducted in this area have assessed the impact of PFM approaches on health system efficiency but have left out the mechanisms through which PFM influences efficiency. This scoping review aims to synthesize evidence on the mechanisms by which PFM influences health system efficiency.", "extract_snippet": "\n\n# PDF Extract: The Ubuntu Way\n\n**Source PDF:** 2024-Odero-The Ubuntu Way.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSYSTEMATIC REVIEW\nHow does Public Financial Management (PFM) influence \nhealth system efficiency: A scoping review\n[version 1; peer review: 2 approved]\nAnita Musiega\n1,2, Benjamin Tsofa\n3, Edwine Barasa1,4\n1Health Economics Research Unit, KEMRI Wellcome Trust Research Programme, Nairobi, Nairobi, 00100, Kenya \n2Institute of Healthcare Management, Strathmore University Business School, Strathmore University, Nairobi, Nairobi County, \nKenya \n3Health Systems and Research Ethics Department, KEMRI-Wellcome Trust Research Programme, Kilifi, Kenya \n4Centre for Tropical Medicine and Global Health, Nuffield department of Medicine, University of Oxford, Oxford, UK \nFirst published: 02 Oct 2024, 9:566  \nhttps://doi.org/10.12688/wellcomeopenres.22533.1\nLatest published: 02 Oct 2024, 9:566  \nhttps://doi.org/10.12688/wellcomeopenres.22533.1\nv1\n \nAbstract \nBackground\nEffective Public Financial Management (PFM) approaches are \nimperative in the quest for efficiency in health service delivery. \nReviews conducted in this area have assessed the impact of PFM \napproaches on health system efficiency but have left out the \nmechanisms through which PFM influences efficiency. This scoping \nreview aims to synthesize evidence on the mechanisms by which PFM \ninfluences health system efficiency.\nMethods\nWe searched databases of PubMed and Google Scholar and websites \nof the World Health Organization (WHO), World Bank and Overseas \nDevelopment Institute (ODI) for peer-reviewed and grey literature \narticles that provided data on the relationship between PFM and \nhealth system efficiency. Three reviewers screened the articles for \neligibility with the inclusion criteria. Data on PFM and health system \nefficiency was charted and summarized. We then reported the \nmechanisms by which PFM influence efficiency.\nResults\nPFM processes and structures influence health system efficiency by \ninfluencing; the alignment of resources to health system needs, the \ncost of inputs, the motivation of health workers, and the input mix.\nOpen Peer Review\nApproval Status  \n \n1\n2\nversion 1\n02 Oct 2024\nview\nview\nMary Ejang, Lira University, Lira, Uganda\n1. \nBrendan Kwesiga\n, UNICEF, Nairobi, \nKenya\n2. \nAny reports and responses or comments on the \narticle can be found at the end of the article.\n \nPage 1 of 13\nWellcome Open Research 2024, 9:566 Last updated: 13 NOV 2024\n\n--- Page 2 ---\n\nCorresponding author: Anita Musiega (AMusiega@kemri-wellcome.org)\nAuthor roles: Musiega A: Conceptualization, Data Curation, Formal Analysis, Funding Acquisition, Methodology, Project Administration, \nWriting – Original Draft Preparation, Writing – Review & Editing; Tsofa B: Conceptualization, Formal Analysis, Funding Acquisition, \nInvestigation, Methodology, Supervision, Writing – Review & Editing; Barasa E: Conceptualization, Formal Analysis, Funding Acquisition, \nInvestigation, Meth", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative", "imperative"], "util_matches": [], "ethics_matches": ["ethics", "alignment"], "norm_matches": []}, {"filename": "2024-Pardeshi-Learning Social Welfare Functions.md", "year": "2024", "title": "Learning Social Welfare Functions", "abstract": "Let G be a simple connected graph of order n with diameter d. Let mG(−1) denote the multiplicity of the eigenvalue −1 of the adjacency matrix of G, and let P = Pd+1 be the diameter path of G. If −1 is not an eigenvalue of P, then by the interlacing theorem, we have mG(−1) ≤n−d−1. In this article, we characterize the extremal graphs where equality holds. Moreover, for the completeness of the results, we also characterize the graphs G that achieve mG(−1) = n −d −1 when −1 is an eigenvalue of P.", "extract_snippet": "\n\n# PDF Extract: Learning Social Welfare Functions\n\n**Source PDF:** 2024-Pardeshi-Learning Social Welfare Functions.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nA complete characterization of graphs for which\nmG(−1) = n −d −1\nSongnian Xu, Wenhao Zhen, Dein Wong∗\nSchool of Mathematics, China University of Mining and Tecnology, Xuzhou, China.\nAbstract\nLet G be a simple connected graph of order n with diameter d. Let mG(−1) denote the multiplicity\nof the eigenvalue −1 of the adjacency matrix of G, and let P = Pd+1 be the diameter path of G. If −1 is\nnot an eigenvalue of P, then by the interlacing theorem, we have mG(−1) ≤n−d−1. In this article,\nwe characterize the extremal graphs where equality holds. Moreover, for the completeness of the\nresults, we also characterize the graphs G that achieve mG(−1) = n −d −1 when −1 is an eigenvalue\nof P. Thus, we provide a complete characterization of the graphs G for which mG(−1) = n −d −1.\n1\nIntroduction\nIn this paper, we consider only simple, connected and finite graphs. A simple undireted graph G is\ndenoted by G = (V (G), E(G)), where V (G) is the vertex set and E(G) is the edge set. A graph H is\ncalled a subgraph of a graph G if V (H) ⊆V (G) and E(H) ⊆E(G). Further, if any two vertices of\nV (H) are adjacent in H if and only if they are adjacent in G, we say that H is an induced subgraph of\nG and denote this relation as H ≤G. The order of G is the number of vertices of G, denoted by |G|.\nFor V1 ⊆V (G) and H ≤G, NH(V1) = ∪v∈V1{u ∈V (H)|uv ∈E(G)}. Let K ⊆V (G), traditionally, the\nsubgraph of G induced by K, written as G[K]. And we sometimes write G −K or G −G[K] to denote\nG[V (G)\\V (K)]. A vertex v of G is said to be pendant if d(v) = 1, where d(v) denotes the number of\nadjacent vertices of v in V (G). For x, y ∈V (G), distance d(x, y) represents the length of the shortest\npath between x and y, and d(x, H) = min{d(x, y)|y ∈V (H)} for H ≤G. We denote by Km,n the\ncomplete bipartite graph. Let A(G) denote the adjacency matrix of graph G, which is a square matrix\nand aij = 1 if and only if vi ∼vj, otherwise aij = 0.\nLet mG(µ) denote the multiplicity of the eigenvalue µ in the adjacency matrix A(G). In 2013, Wong\n[10] characterize graphs with maximum diameter among all connected graph with rank n. In 2022, Wang\n∗Corresponding author. E-mail address: wongdein@163.com.\nKeywords: eigenvalue multiplicity; diameter; extremal graphs\n1\narXiv:2410.15000v1  [math.SP]  19 Oct 2024\n\n--- Page 2 ---\n\n[11] characterized the graphs for which mG(0) = n−d using the method of star complements. In the same\nyear, Chang and Li [2] characterized the graphs for which mG(0) = n −g −1. In 2023, Du and Fonseca", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "Learning Social Welfare Functions", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["welfare", "welfare"], "ethics_matches": [], "norm_matches": []}, {"filename": "2024-Park-Morality is Non-Binary.md", "year": "2024", "title": "Morality is Non-Binary", "abstract": "Recent advances in NLP show that language models retain a discernible level of knowledge in deontological ethics and moral norms. However, existing works often treat morality as binary, ranging from right to wrong. This simplistic view does not capture the nuances of moral judgment. Pluralist moral philosophers argue that human morality can be deconstructed into a finite number of elements, respecting individual differences in moral judgment.", "extract_snippet": "\n\n# PDF Extract: Morality is Non-Binary\n\n**Source PDF:** 2024-Park-Morality is Non-Binary.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMorality is Non-Binary: Building a Pluralist Moral Sentence Embedding\nSpace using Contrastive Learning\nJeongwoo Park∗, Enrico Liscio∗, and Pradeep K. Murukannaiah\nDelft University of Technology, the Netherlands\nE.Liscio@tudelft.nl\nAbstract\nRecent advances in NLP show that language\nmodels retain a discernible level of knowledge\nin deontological ethics and moral norms. How-\never, existing works often treat morality as bi-\nnary, ranging from right to wrong. This simplis-\ntic view does not capture the nuances of moral\njudgment. Pluralist moral philosophers argue\nthat human morality can be deconstructed into a\nfinite number of elements, respecting individual\ndifferences in moral judgment. In line with this\nview, we build a pluralist moral sentence em-\nbedding space via a state-of-the-art contrastive\nlearning approach. We systematically investi-\ngate the embedding space by studying the emer-\ngence of relationships among moral elements,\nboth quantitatively and qualitatively. Our re-\nsults show that a pluralist approach to morality\ncan be captured in an embedding space. How-\never, moral pluralism is challenging to deduce\nvia self-supervision alone and requires a super-\nvised approach with human labels.\n1\nIntroduction\nMorality helps humans distinguish right from\nwrong (Graham et al., 2013). As AI systems work\nwith (or for) humans, it is crucial that they align\nwith human morality (Gabriel, 2020; Liscio et al.,\n2023b). Several NLP methods have been proposed\nto recognize human morality in text (Forbes et al.,\n2020; Lourie et al., 2021; Jiang et al., 2022; Pyatkin\net al., 2023). However, such methods typically treat\nmorality as a score that ranges in a single dimen-\nsion of right to wrong. This does not reflect the\nnuances in moral reasoning, differences among in-\ndividuals, or the existence of moral value conflicts\n(Telkamp and Anderson, 2022).\nPluralist moral philosophers argue that morality\nshould be represented through a finite number of ba-\nsic elements, referred to as moral values (Graham\n∗Equal Contribution.\net al., 2013). Each situation triggers one or more\nmoral values, and each of us assigns varying im-\nportance to each moral value. The combination of\nthese two aspects determines the individual moral\njudgment in the situation. For instance, the de-\nbate on immigration touches on the moral values of\nfairness (“Everyone should be given equal oppor-\ntunities”) and in-group loyalty (“I worry about the\npreservation of our identity”). The way in which\neach of us prioritizes fairness vs. loyalty influences\nour moral judgment in this debate. Thus, morality\ncannot (and should not) be unidimensionally clas-\nsified in text (Talat et al., 2022). Instead, the moral\nelements that are salient to a piece of text can be\nrecognized, which can be used to reason about or\nassist the humans in the moral judgment.\nThe Mor", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "morality", "value", "values", "values", "value", "values", "fairness", "fairness", "moral reasoning", "moral judgment", "moral judgment", "moral judgment", "moral judgment", "moral judgment", "moral foundations", "moral foundations"], "norm_matches": ["deontological", "deontological"]}, {"filename": "2024-Pistilli-CIVICS Building a Dataset for Examining Culturally-Informed Values in.md", "year": "2024", "title": "CIVICS: Building a Dataset for Examining Culturally-Informed Values in Large Language Models", "abstract": "This paper introduces the “CIVICS: Culturally-Informed & Values-Inclusive Corpus for Societal impacts” dataset, designed to evaluate the social and cultural variation of Large Language Models (LLMs) across multiple languages and value-sensitive topics. We create a hand-crafted, multilingual dataset of value-laden prompts which address specific socially sensitive topics, including LGBTQI rights, social welfare, immigration, disability rights, and surrogacy.", "extract_snippet": "\n\n# PDF Extract: 2024-Pistilli-CIVICS Building a Dataset for Examining Culturally-Informed Values in\n\n**Source PDF:** 2024-Pistilli-CIVICS Building a Dataset for Examining Culturally-Informed Values in.pdf\n**Total Pages:** 42\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCIVICS: Building a Dataset for Examining Culturally-Informed Values in Large\nLanguage Models\nGiada Pistilli1,*, Alina Leidinger2,*, Yacine Jernite1, Atoosa Kasirzadeh3, Alexandra Sasha\nLuccioni1, Margaret Mitchell1\n1Hugging Face\n2University of Amsterdam\n3Carnegie Mellon University\nAbstract\nThis paper introduces the “CIVICS: Culturally-Informed &\nValues-Inclusive Corpus for Societal impacts” dataset, de-\nsigned to evaluate the s
