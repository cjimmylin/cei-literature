      - generic [ref=e193]:
        - heading "Methodology" [level=4] [ref=e194]
        - text: 401 benchmark candidates were identified through Semantic Scholar, arXiv, Google Scholar, citation chaining, and expert referral. Each was scored on a 6-component Religious Discriminability rubric. 47 passed both hard gates (RD ≥ 30 and public data). Rankings use a 3-axis composite (Religious Depth 40%, Practical Ease 35%, Citation Impact 25%) with bootstrap uncertainty quantification. Cross-vendor LLM replication used 65 construct validity items and 30 Arabic MCQ items across 9 models.
      - generic [ref=e195]:
        - heading "Expert Council" [level=4] [ref=e196]
        - text: Analysis reviewed by a 12-member expert council spanning computational theology, LLM safety, cross-cultural NLP, psychometrics, Islamic jurisprudence, philosophy of AI, comparative religion, and science communication. All council attributions in this dashboard reflect expert assessments based on verified experimental data. See the full council deliberation record in the companion analysis document.
