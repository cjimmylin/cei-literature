cs", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value", "value"], "norm_matches": []}, {"filename": "2023-Chang-niceNLP at SemEval-2023 Task 10.md", "year": "2023", "title": "niceNLP at SemEval-2023 Task 10", "abstract": "Sexism is a growing online problem. It harms women who are targeted and makes online spaces inaccessible and unwelcoming. In this paper, we present our approach for Task A of SemEval-2023 Task 10: Explainable Detection of Online Sexism (EDOS), which aims to perform binary sexism detection on textual content. To solve this task, we fine-tune the pre-trained model based on several popular natural language processing methods to improve the generalization ability in the face of different data.", "extract_snippet": "\n\n# PDF Extract: niceNLP at SemEval-2023 Task 10\n\n**Source PDF:** 2023-Chang-niceNLP at SemEval-2023 Task 10.pdf\n**Total Pages:** 5\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the The 17th International Workshop on Semantic Evaluation (SemEval-2023), pages 307–311\nJuly 13-14, 2023 ©2023 Association for Computational Linguistics\nniceNLP at SemEval-2023 Task 10: Dual Model Alternate Pseudo-labeling\nImproves Your Predictions\nYu Chang1 , Yuxi Chen1 , Yanru Zhang1,2∗\n1University of Electronic Science and Technology of China, Chengdu\n2Shenzhen Institute for Advanced Study, UESTC\n{yuchang, yuxi.ch}@std.uestc.edu.cn,\nyanruzhang@uestc.edu.cn\nAbstract\nSexism is a growing online problem. It harms\nwomen who are targeted and makes online\nspaces inaccessible and unwelcoming. In this\npaper, we present our approach for Task A of\nSemEval-2023 Task 10: Explainable Detection\nof Online Sexism (EDOS), which aims to per-\nform binary sexism detection on textual content.\nTo solve this task, we fine-tune the pre-trained\nmodel based on several popular natural lan-\nguage processing methods to improve the gen-\neralization ability in the face of different data.\nAccording to the experimental results, the effec-\ntive combination of multiple methods enables\nour approach to achieve excellent performance\ngains.\n1\nIntroduction\nGender discrimination is any mistreatment or nega-\ntive feelings directed at women based on their gen-\nder, or based on their gender in combination with\none or more other identity attributes (e.g., Black\nwomen, Muslim women, trans women). As the\nInternet continues to grow, sexism has become\na growing online problem. It can be harmful to\nwomen who are discriminated against while also\nposing a threat to the healthy functioning of cy-\nberspace.\nLarge-scale pre-trained models have\nbeen widely used to automate the identification of\ndiscriminatory statements. However, these models\nare often capable of simple labeling and not inter-\npretative descriptions. Improving the interpretabil-\nity of sexism detection can help to thereby enhance\nthe understanding and behavioral decision-making\nability of users and moderators of automated tools.\nTo address this issue, SemEval 2023 - Task 10 sup-\nports the development of English-language models\nfor sexism detection that are more accurate as well\nas explainable, with fine-grained classifications for\nsexist content from Gab and Reddit. This task\nproposes a new English sexism detection dataset\n∗*Corresponding author\nbased on Gab and Reddit, which contains four fine-\ngrained and eleven more fine-grained category la-\nbels. In Task A, each sentence was first asked to\nperform a dichotomous classification of the pres-\nence or absence of sexism. And tasks B and C re-\nquire a finer-grained distinction between sentences\nwith sex discrimination (Kirk et al., 2023).\nIn many past studies, language models called\nBERT have been used extensively for several tasks\n(Devlin et al., 2018). BERT models can be pre-\ntrained with a self-super", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["discrimination", "discrimination"], "norm_matches": []}, {"filename": "2023-Chen-Case Law Grounding.md", "year": "2023", "title": "Case Law Grounding", "abstract": "From moderating content within an online community to producing socially-appropriate generative outputs, decision-making tasks— conducted by either humans or AI—often depend on subjective or socially-established criteria. To ensure such decisions are consistent, prevailing processes primarily make use of high-level rules and guidelines to ground decisions, similar to applying “constitutions” in the legal context.", "extract_snippet": "\n\n# PDF Extract: Case Law Grounding\n\n**Source PDF:** 2023-Chen-Case Law Grounding.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCase Law Grounding: Using Precedents to Align Decision-Making\nfor Humans and AI\nQuan Ze Chen\ncqz@cs.washington.edu\nUniversity of Washington\nSeattle, WA, USA\nAmy X. Zhang\naxz@cs.washington.edu\nUniversity of Washington\nSeattle, WA, USA\nABSTRACT\nFrom moderating content within an online community to producing\nsocially-appropriate generative outputs, decision-making tasks—\nconducted by either humans or AI—often depend on subjective or\nsocially-established criteria. To ensure such decisions are consistent,\nprevailing processes primarily make use of high-level rules and\nguidelines to ground decisions, similar to applying “constitutions”\nin the legal context. However, inconsistencies in specifying and\ninterpreting constitutional grounding can lead to undesirable and\neven incorrect decisions being made. In this work, we introduce\n“case law grounding” (CLG)—an approach for grounding subjective\ndecision-making using past decisions, similar to how precedents\nare used in case law. We present how this grounding approach\ncan be implemented in both human and AI decision-making con-\ntexts, introducing both a human-led process and a large language\nmodel (LLM) prompting setup. Evaluating with five groups and\ncommunities across two decision-making task domains, we find that\ndecisions produced with CLG were significantly more accurately\naligned to ground truth in 4 out of 5 groups, achieving a 16.0–23.3\n%-points higher accuracy in the human process, and 20.8–32.9 %-\npoints higher with LLMs. We also examined the impact of different\nconfigurations with the retrieval window size and binding nature\nof decisions and find that binding decisions and larger retrieval\nwindows were beneficial. Finally, we discuss the broader implica-\ntions of using CLG to augment existing constitutional grounding\nwhen it comes to aligning human and AI decisions.\nCCS CONCEPTS\n• Human-centered computing →Collaborative and social\ncomputing.\nKEYWORDS\nalignment; human judgment; large language models; subjectivity;\nconsistency; content moderation; policy; decision-making\nACM Reference Format:\nQuan Ze Chen and Amy X. Zhang. 2025. Case Law Grounding: Using Prece-\ndents to Align Decision-Making for Humans and AI. In Collective Intelligence\nConference (CI 2025), August 4–6, 2025, San Diego, CA, USA. ACM, New York,\nNY, USA, 13 pages. https://doi.org/10.1145/3715928.3737487\nThis work is licensed under a Creative Commons Attribution-ShareAlike 4.0 Interna-\ntional License.\nCI 2025, August 4–6, 2025, San Diego, CA, USA\n© 2025 Copyright held by the owner/author(s).\nACM ISBN 979-8-4007-1489-4/2025/08\nhttps://doi.org/10.1145/3715928.3737487\n1\nINTRODUCTION\nMany technological systems today are entangled in social decision-\nmaking situations. Online spaces for inter-personal communication,\nlike social media platforms, need to contend with decisions around\nhow to moderate c", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2023-Clymer-Generalization Analogies.md", "year": "2023", "title": "Generalization Analogies", "abstract": "As AI systems become more intelligent and their behavior becomes more challenging to assess, they may learn to game the flaws of human feedback instead of genuinely striving to follow instructions; however, this risk can be mitigated by controlling how LLMs generalize human feedback to situations where it is unreliable. To better understand how reward models generalize, we craft 69 distribution shifts spanning 8 categories.", "extract_snippet": "\n\n# PDF Extract: Generalization Analogies\n\n**Source PDF:** 2023-Clymer-Generalization Analogies.pdf\n**Total Pages:** 22\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nGeneralization Analogies (GENIES): A Testbed for Generalizing AI Oversight to\nHard-To-Measure Domains\nJoshua Clymer 1 Garrett Baker 2 Rohan Subramani 1 Sam Wang 1\nAbstract\nAs AI systems become more intelligent and their\nbehavior becomes more challenging to assess,\nthey may learn to game the flaws of human feed-\nback instead of genuinely striving to follow in-\nstructions; however, this risk can be mitigated by\ncontrolling how LLMs generalize human feed-\nback to situations where it is unreliable. To better\nunderstand how reward models generalize, we\ncraft 69 distribution shifts spanning 8 categories.\nWe find that reward models do not learn to evalu-\nate ‘instruction-following’ by default and instead\nfavor personas that resemble internet text. Tech-\nniques for interpreting reward models’ internal\nrepresentations achieve better generalization than\nstandard fine-tuning, but still frequently fail to dis-\ntinguish instruction-following from conflated be-\nhaviors. We consolidate the 15 most challenging\ndistribution shifts into the GENeralization analo-\ngIES (GENIES) benchmark, which we hope will\nenable progress toward controlling reward model\ngeneralization.\n1. Introduction\nAs AI capabilities have increased, so has the need for human\nevaluators with specific expertise (Malaviya et al., 2023;\nBoiko et al., 2023). If AI systems exceed human abilities,\neven the most talented experts may struggle to evaluate their\nactions, creating a risk that AI systems bypass monitoring\nor game human evaluations (Hendrycks et al., 2023b).\n1.1. The limitations of oversight can be overcome with\nfavorable generalization\nTo prevent models from gaming human feedback, devel-\nopers might fine-tune them on a restricted set of high-\nconfidence examples and rely on favorable generalization.\n1Columbia University in NY 2NA. Correspondence to: Joshua\nClymer <joshuamclymer@gmail.com>.\nFigure 1: The radar plot shows generalization accuracy\nacross all distribution-shift categories. The outer edge of\nthe circle represents target-tuned capability (Section 4.1).\nThe leaderboard shows average generalization accuracy vs\ntarget-tuned capability on the 15 curated distribution shifts.\n50% is random accuracy.\nFor example, training reward models to evaluate instructions\nlike “provide a grocery list for a healthy meal” may also\narXiv:2311.07723v3  [cs.AI]  17 Dec 2023\n\n--- Page 2 ---\n\nGENIES: Generalizing AI Oversight to Hard-to-Measure Domains\nFigure 2: reward models exhibit moderate easy to hard\ngeneralization by default: fine-tuning LLaMA-30B on easy\nRaven Matrices achieves 75% accuracy on significantly\nharder puzzles (Figure 5).\nyield accurate judgments for instructions like “make sweep-\ning advances in AI safety research.” This approach requires\ngeneralization across the distribution shift from examples\ndevelopers can reliably verify to th", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2023-Durmus-Towards Measuring the Representation of.md", "year": "2023", "title": "Towards Measuring the Representation of", "abstract": "Large language models (LLMs) may not equitably represent diverse global perspectives on societal issues. In this paper, we develop a quantitative framework to evaluate whose opinions model-generated responses are more similar to. We first build a dataset, GlobalOpinionQA, comprised of questions and answers from cross-national surveys designed to capture diverse opinions on global issues across different countries.", "extract_snippet": "\n\n# PDF Extract: Towards Measuring the Representation of\n\n**Source PDF:** 2023-Durmus-Towards Measuring the Representation of.pdf\n**Total Pages:** 30\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTowards Measuring the Representation of Subjective\nGlobal Opinions in Language Models\nEsin Durmus∗\nKarina Nguyen\nThomas I. Liao\nNicholas Schiefer\nAmanda Askell\nAnton Bakhtin\nCarol Chen\nZac Hatfield-Dodds\nDanny Hernandez\nNicholas Joseph\nLiane Lovitt\nSam McCandlish\nOrowa Sikder\nAlex Tamkin\nJanel Thamkul\nJared Kaplan\nJack Clark\nDeep Ganguli\nAnthropic\nAbstract\nLarge language models (LLMs) may not equitably represent diverse global per-\nspectives on societal issues. In this paper, we develop a quantitative framework\nto evaluate whose opinions model-generated responses are more similar to. We\nfirst build a dataset, GlobalOpinionQA, comprised of questions and answers from\ncross-national surveys designed to capture diverse opinions on global issues across\ndifferent countries. Next, we define a metric that quantifies the similarity between\nLLM-generated survey responses and human responses, conditioned on country.\nWith our framework, we run three experiments on an LLM trained to be helpful,\nhonest, and harmless with Constitutional AI. By default, LLM responses tend to be\nmore similar to the opinions of certain populations, such as those from the USA,\nand some European and South American countries, highlighting the potential for\nbiases. When we prompt the model to consider a particular country’s perspective,\nresponses shift to be more similar to the opinions of the prompted populations,\nbut can reflect harmful cultural stereotypes. When we translate GlobalOpinionQA\nquestions to a target language, the model’s responses do not necessarily become\nthe most similar to the opinions of speakers of those languages. We release our\ndataset for others to use and build on.2 We also provide an interactive visualization\nat https://llmglobalvalues.anthropic.com.\n1\nIntroduction\nLarge Language models (LLMs) exhibit remarkable performance on a wide variety of tasks [11, 14,\n25, 75, 51], some of which involve subjective decision-making processes such as detecting bias and\ntoxicity [35], steering model outputs to abide by ethical principles [6], generating model evaluations\n[60], and summarizing the most important information from articles [82]. However, such applications\nmay require language models to make subjective judgments that could vary significantly across\ndifferent social groups [74, 8, 42, 32, 69]. If a language model disproportionately represents certain\nopinions, it risks imposing potentially undesirable effects such as promoting hegemonic worldviews\nand homogenizing people’s perspectives and beliefs [7, 54, 79, 80, 16, 12, 23, 40]. To assess this\nrisk, we develop a framework to quantitatively measure the opinions of LLMs (§2). Inspired by [67]\n∗Correspondence to: esin at anthropic dot com. Author contributions are detailed in Section 8.\n2https://huggingface.co/datasets/Anthropic", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "bias"], "norm_matches": []}, {"filename": "2023-Eskelinen-Toxicity Detection in Finnish Using Machine Translation.md", "year": "2023", "title": "Toxicity Detection in Finnish Using Machine Translation", "abstract": "Due to the popularity of social media platforms and the sheer amount of usergenerated content online, the automatic detection of toxic language has become crucial in the creation of a friendly and safe digital space. Previous work has been mostly focusing on English leaving many lower-resource languages behind. In this paper, we present novel resources for toxicity detection in Finnish by introducing two new datasets, a machine translated toxicity dataset for Finnish based on the widely used...", "extract_snippet": "\n\n# PDF Extract: 2023-Eskelinen-Toxicity Detection in Finnish Using Machine Translation\n\n**Source PDF:** 2023-Eskelinen-Toxicity Detection in Finnish Using Machine Translation.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 24th Nordic Conference on Computational Linguistics (NoDaLiDa), pages 685–697\nMay 22-24, 2023 c⃝2023 Association for Computational Linguistics\nToxicity Detection in Finnish Using Machine Translation\nAnni Eskelinen, Laura Silvala, Filip Ginter, Sampo Pyysalo and Veronika Laippala\nTurkuNLP\nUniversity of Turku, Finland\naeeske, laura.s.silvola, figint, sampo.pyysalo, mavela\n@utu.fi\nAbstract\nDue to the popularity of social media\nplatforms and the sheer amount of user-\ngenerated content online, the automatic\ndetection of toxic language has become\ncrucial in the creation of a friendly and\nsafe digital space.\nPrevious work has\nbeen mostly focusing on English leaving\nmany lower-resource languages behind. In\nthis paper, we present novel resources for\ntoxicity detection in Finnish by introduc-\ning two new datasets, a machine trans-\nlated toxicity dataset for Finnish based on\nthe widely used English Jigsaw dataset\nand a smaller test set of Suomi24 discus-\nsion forum comments originally written in\nFinnish and manually annotated following\nthe definitions of the labels that were used\nto annotate the Jigsaw dataset. We show\nthat machine translating the training data\nto Finnish provides better toxicity detec-\ntion results than using the original English\ntraining data and zero-shot cross-lingual\ntransfer with XLM-R, even with our newly\nannotated dataset from Suomi24.\n1\nIntroduction\nSocial media is filled with moderated and unmod-\nerated content with foul language such as threats,\ninsults and swears. Due to the popularity of the\nplatforms and the sheer amount of comments,\nposts and other user-generated content they in-\nclude, moderation by human-raters is getting im-\npossible.\nThis makes automatic toxicity detec-\ntion a requirement in the monitoring of social me-\ndia platforms and other online settings in order to\nguarantee a safe and friendly digital space.\nIn recent years, many studies have tackled the\ndetection of toxic language as well as other simi-\nlar and relevant tasks, such as the detection of hate\nspeech and offensive language (Davidson et al.,\n2017; MacAvaney et al., 2019). However, most\ndatasets and thus most of the studies focus on En-\nglish, leaving other languages with very scarce re-\nsources (Davidson et al., 2017; Androcec, 2020).\nAt the same time, the development of the re-\nsources, in particular the creation of manually\nannotated training data, is very time-consuming.\nCross-lingual transfer learning has offered a solu-\ntion to this challenge by allowing the use of data in\none language to predict examples in another one.\nThis method has showed promising results in tasks\nsuch as register labeling (R¨onnqvist et al., 2021;\nRepo et al., 2021) and offensive language detec-\ntion (Pelicon et al., 2021", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["toxic", "toxic", "toxic", "offensive", "offensive"], "norm_matches": []}, {"filename": "2023-Hartmann-The political ideology of conversational AI.md", "year": "2023", "title": "The political ideology of conversational AI", "abstract": "Conversational artificial intelligence (AI) disrupts how humans interact with technology. Recently, OpenAI introduced ChatGPT, a state-of-the-art dialogue model that can converse with its human counterparts with unprecedented capabilities. ChatGPT has witnessed tremendous attention from the media, academia, industry, and the general public, attracting more than a million users within days of its release. However, its explosive adoption for information search and as an automated decision aid underscores the importance to understand its limitations and biases. This paper focuses on one of democratic society's most important decision-making processes: political elections. Prompting ChatGPT with 630 political statements from two leading voting advice applications and the nation-agnostic political compass test in three pre-registered experiments, we uncover ChatGPT's pro-environmental, left-libertarian ideology. We discuss the implications of politically biased conversational AI on society.", "extract_snippet": "\n\n# PDF Extract: The political ideology of conversational AI\n\n**Source PDF:** 2023-Hartmann-The political ideology of conversational AI.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nThe political ideology of conversational AI:\nConverging evidence on ChatGPT’s\npro-environmental, left-libertarian orientation\nJochen Hartmanna,1,\u0000, Jasper Schwenzowb,1, and Maximilian Witteb,1\naTechnical University of Munich, TUM School of Management, Arcisstr. 21, 80333 Munich, Germany\nbUniversity of Hamburg, Hamburg Business School, Moorweidenstrasse 18, 20148 Hamburg, Germany\n1All authors contributed equally to this work.\nConversational artificial intelligence (AI) disrupts how hu-\nmans interact with technology. Recently, OpenAI introduced\nChatGPT, a state-of-the-art dialogue model that can converse\nwith its human counterparts with unprecedented capabilities.\nChatGPT has witnessed tremendous attention from the media,\nacademia, industry, and the general public, attracting more\nthan a million users within days of its release. However, its ex-\nplosive adoption for information search and as an automated\ndecision aid underscores the importance to understand its limi-\ntations and biases. This paper focuses on one of democratic soci-\nety’s most important decision-making processes: political elec-\ntions. Prompting ChatGPT with 630 political statements from\ntwo leading voting advice applications and the nation-agnostic\npolitical compass test in three pre-registered experiments, we\nuncover ChatGPT’s pro-environmental, left-libertarian ideol-\nogy. For example, ChatGPT would impose taxes on flights, re-\nstrict rent increases, and legalize abortion. In the 2021 elec-\ntions, it would have voted most likely for the Greens both in Ger-\nmany (Bündnis 90/Die Grünen) and in the Netherlands (Groen-\nLinks). Our findings are robust when negating the prompts, re-\nversing the order of the statements, varying prompt formality,\nand across languages (English, German, Dutch, and Spanish).\nWe conclude by discussing the implications of politically biased\nconversational AI on society.\nconversational artificial intelligence | algorithmic bias | voting advice applica-\ntions | natural language processing | ChatGPT\nCorrespondence: jochen.hartmann@tum.de\nIntroduction\nThe rapid progress and proliferation of conversational AI dis-\nrupt the way humans interact with technology and obtain in-\nformation (1). AI-enabled systems can have a consequential\nimpact on human lives, especially when used as decision aids\nin high-stakes contexts, e.g., medicine (2, 3), jurisdiction (4),\nimmigration (5), or hiring (6). Consequently, a considerable\nnumber of studies is devoted to understanding the limitations\nand algorithmic biases inherent in deep learning systems and\ngenerative AI models (7–17).\nOn November 30, 2022, OpenAI released ChatGPT, a\nstate-of-the-art conversational deep learning system, which\nhas attracted millions of users at an unprecedented pace (18).\nSince its release, users have used Ch", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["consequential"], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2023-Kirk-SemEval-2023 Task 10.md", "year": "2023", "title": "SemEval-2023 Task 10", "abstract": "Online sexism is a widespread and harmful phenomenon. Automated tools can assist the detection of sexism at scale. Binary detection, however, disregards the diversity of sexist content, and fails to provide clear explanations for why something is sexist. To address this issue, we introduce SemEval Task 10 on the Explainable Detection of Online Sexism (EDOS). We make three main contributions: i) a novel hierarchical taxonomy of sexist content, which includes granular vectors of sexism to aid...", "extract_snippet": "\n\n# PDF Extract: SemEval-2023 Task 10\n\n**Source PDF:** 2023-Kirk-SemEval-2023 Task 10.pdf\n**Total Pages:** 18\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSemEval-2023 Task 10: Explainable Detection of Online Sexism\nHannah Rose Kirk1,2*, Wenjie Yin1,3*, Bertie Vidgen1, and Paul Röttger1,2\n1Rewire\n2University of Oxford\n3Queen Mary University of London\nAbstract\nOnline sexism is a widespread and harmful\nphenomenon. Automated tools can assist the\ndetection of sexism at scale. Binary detection,\nhowever, disregards the diversity of sexist con-\ntent, and fails to provide clear explanations for\nwhy something is sexist. To address this issue,\nwe introduce SemEval Task 10 on the Explain-\nable Detection of Online Sexism (EDOS). We\nmake three main contributions: i) a novel hi-\nerarchical taxonomy of sexist content, which\nincludes granular vectors of sexism to aid ex-\nplainability; ii) a new dataset of 20,000 so-\ncial media comments with ﬁne-grained labels,\nalong with larger unlabelled datasets for model\nadaptation; and iii) baseline models as well as\nan analysis of the methods, results and errors\nfor participant submissions to our task.\nContent warning: We show illustrative examples of sexist\nlanguage to describe the taxonomy and analyse error types.\n1\nIntroduction\nOnline sexism can inﬂict harm on women who are\ntargeted, make online spaces inaccessible and un-\nwelcoming, and perpetuate social asymmetries and\ninjustices. Automated tools are now widely de-\nployed to ﬁnd sexist content at scale, supporting\ncontent moderation, monitoring and research. How-\never, most automated classiﬁers do not give further\nexplanations beyond generic, high-level categories\nsuch as ‘toxicity’, ‘abuse’ or ‘sexism’. Opaque\nclassiﬁcation without explanations can cause con-\nfusion, anger and mistrust among moderated users,\nand make it harder to challenge moderation mis-\ntakes; moderators who use automated tools may\nnot trust or fully understand the labels, reducing\ntheir efﬁciency; and it is difﬁcult to assess model\nweaknesses in the absence of granular labels, which\nhinders the development of better models.\nWe organised the SemEval 2023 Task Explain-\nable Detection of Online Sexism (EDOS), which\n*Equal contribution\nfollows from success of previous shared tasks on\nabuse and hate detection (Zampieri et al., 2019;\nRibeiro and Silva, 2019; Pavlopoulos et al., 2021;\nBasile et al., 2019; Fersini et al., 2018a,b). Our task\nproposes and applies a taxonomy with three hierar-\nchical tasks for detecting sexist content. Task A is\na binary task to detect whether content is sexist. For\nsexist content, Task B distinguishes between four\ndistinct categories of sexism, and Task C identiﬁes\none of 11 ﬁne-grained sexism vectors.\nThere are three factors that make our EDOS task\nunique: First, data diversity: we sample data from\ntwo large social media platforms (Reddit and Gab)\nusing an ensemble of ﬁltering methods. The entries\nare more diverse than sampling from keywords\nalone or a single platform. Second, ann", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["harm"], "norm_matches": []}, {"filename": "2023-Lima-A Call for a Research Agenda on Fair NLP for Portuguese.md", "year": "2023", "title": "A Call for a Research Agenda on Fair NLP for Portuguese", "abstract": "Diverse areas widely apply artificial intelligence and natural language processing (NLP) tools to their contexts. However, these algorithms present ethical issues, such as biased and discriminatory decisions. For example, representation biases in NLP can result in discriminatory behavior towards race and gender. Works have been addressing this issue and seeking to build fair NLP solutions, however they mainly focus on Anglo-Saxon languages.", "extract_snippet": "\n\n# PDF Extract: 2023-Unknown-A Call for a Research Agenda on Fair NLP for Portuguese\n\n**Source PDF:** 2023-Unknown-A Call for a Research Agenda on Fair NLP for Portuguese.pdf\n**Total Pages:** 6\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nA call for a research agenda on fair NLP for\nPortuguese\nLuiz Fernando F. P. de Lima1, Renata Mendes de Araujo2,3,4\n1 Centro de Estudos e Sistemas Avançados do Recife (CESAR) - Recife, PE, Brasil\n2Universidade Presbiteriana Mackenzie - São Paulo, SP, Brasil\n3Universidade de São Paulo (USP) - São Paulo, SP, Brasil\n4Escola Nacional de Administração Pública (ENAP) - Brasília, DF, Brasil\nlffpl@cesar.org.br, renata.araujo@mackenzie.br\nAbstract. Diverse areas widely apply artificial intelligence and natural lan-\nguage processing (NLP) tools to their contexts. However, these algorithms\npresent ethical issues, such as biased and discriminatory decisions. For ex-\nample, representation biases in NLP can result in discriminatory behavior\ntowards race and gender. Works have been addressing this issue and seek-\ning to build fair NLP solutions, however they mainly focus on Anglo-Saxon\nlanguages. This work aims to challenge the scientific community in order\nto stimulate and motivate further research in the fair NLP specifically for\nthe Portuguese language. To achieve this, a literature review was conducted\nto identify existing research efforts and indicate future directions.\n1. Introduction\nDifferent biases, such as historical biases, representation biases, evaluation biases,\nand human interpretation biases, can be embedded into a machine learning (ML)\nmodel during its training [Ruback et al. 2021]. The incorporation of these biases by\nthe model can result in unfair and discriminatory outcomes.\nWe can also observe cases of algorithmic discrimination in NLP tools. For\nexample, Amazon’s algorithm for recruiting and selecting employees that penalized\nresumes belonging to women and identified the applicant’s gender, even if this infor-\nmation was omitted [Dastin 2018]. On the other hand, recent literature presents at-\ntempts to achieve fair NLP algorithms for different tasks through various techniques\nsuch as data augmentation, gender marking and learning gender-neutral embeddings\n[Mehrabi et al. 2021, Bolukbasi et al. 2016, Leavy 2018].\nHowever, these fair NLP researches mostly use English databases, not wor-\nrying about whether their approaches work when concerning other languages. In\nthis scenario, we can raise concerns about the democratization of these fair NLP\nsolutions for different languages, especially for the Portuguese language.\nThere-\nfore, it is essential to stimulate and advance research in the aspect of fair NLP\nfor Portuguese, making this technology fairer for a larger segment of society\n[Camões - Instituto da Cooperação e da Língua 2023].\nIn this sense, the main goal of this work is to identify research gaps, and\noutline a research agenda in order to motivate scholarly peers to foster a broader\n\n--- Page 2 ---\n\ndemocrati", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "ethical", "discrimination", "discrimination"], "norm_matches": []}, {"filename": "2023-Lin-Taiwan LLM Bridging the Linguistic Divide with a Culturally Aligned.md", "year": "2023", "title": "Taiwan LLM: Bridging the Linguistic Divide with a Culturally Aligned Language Model", "abstract": "In the realm of language models, the nuanced linguistic and cultural intricacies of Traditional Chinese, as spoken in Taiwan, have been largely overlooked. This paper introduces TAIWAN-LLM, a pioneering Large Language Model that specifically caters to the Traditional Chinese language, with a focus on the variant used in Taiwan. Leveraging a comprehensive pretraining corpus and instruction-finetuning datasets, we have developed a model that not only understands the complexities of Traditional...", "extract_snippet": "\n\n# PDF Extract: 2023-Lin-Taiwan LLM Bridging the Linguistic Divide with a Culturally Aligned\n\n**Source PDF:** 2023-Lin-Taiwan LLM Bridging the Linguistic Divide with a Culturally Aligned.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTAIWAN-LLM: Bridging the Linguistic Divide with\na Culturally Aligned Language Model\nYen-Ting Lin\nYun-Nung Chen\nDepartment of Computer Science and Information Engineering\nNational Taiwan University\n{ytl, y.v.chen}@ieee.org\nhttps://twllm.com\nAbstract\nIn the realm of language models, the nuanced linguistic and cultural intricacies of\nTraditional Chinese, as spoken in Taiwan, have been largely overlooked. This paper\nintroduces TAIWAN-LLM, a pioneering Large Language Model that specifically\ncaters to the Traditional Chinese language, with a focus on the variant used in\nTaiwan. Leveraging a comprehensive pretraining corpus and instruction-finetuning\ndatasets, we have developed a model that not only understands the complexities of\nTraditional Chinese but also embodies the cultural context of Taiwan. TAIWAN-\nLLM represents the first of its kind, a model that is not only linguistically accurate\nbut also culturally resonant with its user base. Our evaluations demonstrate that\nTAIWAN-LLM achieves superior performance in understanding and generating\nTraditional Chinese text, outperforming existing models that are predominantly\ntrained on Simplified Chinese or English. The open-source release of TAIWAN-\nLLM invites collaboration and further innovation, ensuring that the linguistic\ndiversity of Chinese speakers is embraced and well-served. The model, datasets,\nand further resources are made publicly available to foster ongoing research and\ndevelopment in this field.1\n1\nIntroduction\nThe linguistic diversity of the Chinese language, with its various dialects and written forms, presents\nunique challenges in natural language processing. Traditional Chinese, used predominantly in Taiwan,\nHong Kong, and Macau, has been notably underrepresented in the development of language models.\nThis oversight has resulted in a technological divide, where speakers of Traditional Chinese lack\naccess to high-quality language models that understand their language nuances and cultural context.\nTo address this gap, we introduce TAIWAN-LLM, the first Large Language Model (LLM) designed\nspecifically for the Traditional Chinese language as used in Taiwan.\nRecent advancements in LLMs have seen models like GPT-4 and Claude2 achieve remarkable\nperformance in understanding and generating text. However, these models are predominantly trained\non English and Simplified Chinese (zh-cn), leading to a misalignment with the linguistic intricacies of\nTraditional Chinese (zh-tw). This misalignment not only affects the accuracy of language generation\nbut also overlooks the rich cultural heritage embedded within the language, which is crucial for\napplications such as digital humanities and culturally sensitive communication.\nIn this work, we focus on develo", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2023-Park-AI Deception.md", "year": "2023", "title": "AI Deception", "abstract": "This paper argues that a range of current AI systems have learned how to deceive humans. We define deception as the systematic inducement of false beliefs in the pursuit of some outcome other than the truth. We first survey empirical examples of AI deception, discussing both special-use AI systems (including Meta’s CICERO) built for specific competitive situations, and general-purpose AI systems (such as large language models).", "extract_snippet": "\n\n# PDF Extract: AI Deception\n\n**Source PDF:** 2023-Park-AI Deception.pdf\n**Total Pages:** 30\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAI Deception: A Survey of Examples, Risks, and\nPotential Solutions\nPeter S. Park∗\nMIT\nSimon Goldstein*\nAustralian Catholic University\nCenter for AI Safety\nAidan O’Gara\nCenter for AI Safety\nMichael Chen\nCenter for AI Safety\nDan Hendrycks\nCenter for AI Safety\nAbstract\nThis paper argues that a range of current AI systems have learned how to deceive\nhumans. We define deception as the systematic inducement of false beliefs in the\npursuit of some outcome other than the truth. We first survey empirical examples of\nAI deception, discussing both special-use AI systems (including Meta’s CICERO)\nbuilt for specific competitive situations, and general-purpose AI systems (such as\nlarge language models). Next, we detail several risks from AI deception, such as\nfraud, election tampering, and losing control of AI systems. Finally, we outline\nseveral potential solutions to the problems posed by AI deception: first, regulatory\nframeworks should subject AI systems that are capable of deception to robust\nrisk-assessment requirements; second, policymakers should implement bot-or-not\nlaws; and finally, policymakers should prioritize the funding of relevant research,\nincluding tools to detect AI deception and to make AI systems less deceptive.\nPolicymakers, researchers, and the broader public should work proactively to\nprevent AI deception from destabilizing the shared foundations of our society.\nExecutive summary\nNew AI systems display a wide range of capabilities, some of which create risk. Shevlane et al. (2023)\ndraw attention to a suite of potential dangerous capabilities of AI systems, including cyber-offense,\npolitical strategy, weapons acquisition, and long-term planning. Among these dangerous capabilities\nis deception. In this report, we survey the current state of AI deception. In short, our conclusion is that\na range of different AI systems have learned how to deceive others. We examine how this capability\nposes significant risks. We also argue that there are several important steps that regulators and AI\nresearchers can take today to regulate, detect, and prevent AI systems that engage in deception.\nWe define deception as the systematic production of false beliefs in others as a means to accomplish\nsome outcome other than the truth. This definition does not require that AI systems literally have\nbeliefs and goals. Instead, it focuses on the question of whether AI systems engage in regular patterns\nof behavior that tend towards the creation of false beliefs in users, and focuses on cases where this\npattern is the result of AI systems optimizing for a different outcome than merely producing truth. For\nthe purposes of mitigating risk, we believe that the relevant question is whether AI systems engage in\nbehavior that would be treated as deceptive if demonstrated by a human being. (In an appendix, we\nconsider in greater detail whethe", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety", "safety", "safety", "safety"], "norm_matches": []}, {"filename": "2023-Patel-Building Domain-Specific LLMs Faithful To The.md", "year": "2023", "title": "Building Domain-Specific LLMs Faithful To The", "abstract": "Large Language Models (LLMs) have demonstrated remarkable performance across numerous natural language understanding use cases. However, this impressive performance comes with inherent limitations, such as the tendency to perpetuate stereotypical biases or fabricate non-existent facts. In the context of Islam and its representation, accurate and factual representation of its beliefs and teachings rooted in the Quran and Sunnah is key.", "extract_snippet": "\n\n# PDF Extract: 2023-Patel-Building Domain-Specific LLMs Faithful To The\n\n**Source PDF:** 2023-Patel-Building Domain-Specific LLMs Faithful To The.pdf\n**Total Pages:** 6\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBuilding Domain-Specific LLMs Faithful To The\nIslamic Worldview: Mirage or Technical Possibility?\nShabaz Patel\nIndependent Researcher\nshabaz.b.patel@gmail.com\nHassan Kane\nIndependent Researcher\nRayhan Patel\nIndependent Researcher\nAbstract\nLarge Language Models (LLMs) have demonstrated remarkable performance\nacross numerous natural language understanding use cases. However, this im-\npressive performance comes with inherent limitations, such as the tendency to\nperpetuate stereotypical biases or fabricate non-existent facts. In the context of\nIslam and its representation, accurate and factual representation of its beliefs and\nteachings rooted in the Quran and Sunnah is key. This work focuses on the chal-\nlenge of building domain-specific LLMs faithful to the Islamic worldview and\nproposes ways to build and evaluate such systems. Firstly, we define this open-\nended goal as a technical problem and propose various solutions. Subsequently,\nwe critically examine known challenges inherent to each approach and highlight\nevaluation methodologies that can be used to assess such systems. This work\nhighlights the need for high-quality datasets, evaluations, and interdisciplinary\nwork blending machine learning with Islamic scholarship. 1\n1\nIntroduction\nLarge Language Models (LLMs) have proven to be highly effective in solving a wide range of natural\nlanguage understanding tasks and have achieved impressive scores on various human benchmarks [1].\nEconomic studies suggest that these models can complement the knowledge of highly skilled human\nworkers in challenging tasks [2][3].\nIslam is a religion that revolves around the teachings of the Prophet Muhammad (pbuh) and the Quran.\nThe Quran is the central text of Islam and has been revealed to Prophet Muhammad over a period\nof approximately 23 years and has been excellently preserved, translated, and transmitted from its\nrevelation to current times [4]. The teachings of the Prophet are well documented in the hadith books,\nwhich have chains of narrators and varying degrees of reliability [5][6]. Beyond the foundational\ntexts of the Quran and the Sunnah of Prophet Muhammad, centuries of Islamic scholarship have\nproduced a wealth of commentary, analysis, and guidance, explaining their relevance to different\naspects of life.\nLLMs potentially provide a powerful way to interact with the rich and vast Islamic scholarship that\nhas been produced over the past centuries and contextualize it within specific setups. Examples of ap-\nplications include dialogue with scholars based on their writings, answering spiritual or philosophical\nquestions rooted in the Quran and Sunnah, creating educational stories based on their teachings, etc.\nWhile the potential for creative and useful applications is encouraging, it is crucial to a", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2023-Schulhoff-HackAPrompt.md", "year": "2023", "title": "HackAPrompt", "abstract": "Large Language Models (LLMs) are deployed in interactive contexts with direct user engagement, such as chatbots and writing assistants. These deployments are vulnerable to prompt injection and jailbreaking (collectively, prompt hacking), in which models are manipulated to ignore their original instructions and follow potentially malicious ones. Although widely acknowledged as a significant security threat, there is a dearth of large-scale resources and quantitative studies on prompt hacking.", "extract_snippet": "\n\n# PDF Extract: HackAPrompt\n\n**Source PDF:** 2023-Schulhoff-HackAPrompt.pdf\n**Total Pages:** 33\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 2023 Conference on Empirical Methods in Natural Language Processing, pages 4945–4977\nDecember 6-10, 2023 ©2023 Association for Computational Linguistics\nIgnore This Title and HackAPrompt: Exposing Systemic Vulnerabilities of\nLLMs through a Global Scale Prompt Hacking Competition\nSander Schulhoff1∗\nJeremy Pinto2∗\nAnaum Khan1\nLouis-François Bouchard2,3\nChenglei Si4\nSvetlina Anati5∗∗Valen Tagliabue6∗∗Anson Liu Kost7∗∗Christopher Carnahan8∗∗\nJordan Boyd-Graber1\n1 University of Maryland\n2 Mila\n3 Towards AI\n4 Stanford\n5 Technical University of Sofia\n6 University of Milan\n7 NYU\n8 University of Arizona\nsschulho@umd.edu\njerpint@gmail.com\njbg@umiacs.umd.edu\nAbstract\nLarge Language Models (LLMs) are deployed\nin interactive contexts with direct user engage-\nment, such as chatbots and writing assistants.\nThese deployments are vulnerable to prompt\ninjection and jailbreaking (collectively, prompt\nhacking), in which models are manipulated to\nignore their original instructions and follow\npotentially malicious ones. Although widely\nacknowledged as a significant security threat,\nthere is a dearth of large-scale resources and\nquantitative studies on prompt hacking. To ad-\ndress this lacuna, we launch a global prompt\nhacking competition, which allows for free-\nform human input attacks. We elicit 600K+\nadversarial prompts against three state-of-the-\nart LLMs. We describe the dataset, which em-\npirically verifies that current LLMs can indeed\nbe manipulated via prompt hacking. We also\npresent a comprehensive taxonomical ontology\nof the types of adversarial prompts.\n1\nIntroduction: Prompted LLMs are\nEverywhere...How Secure are They?\nLarge language models (LLMs) such as Instruct-\nGPT (Ouyang et al., 2022), BLOOM (Scao et al.,\n2022), and GPT-4 (OpenAI, 2023) are widely\ndeployed in consumer-facing and interactive set-\ntings (Bommasani et al., 2021). Companies in di-\nverse sectors—from startups to well established\ncorporations—use LLMs for tasks ranging from\nspell correction to military command and con-\ntrol (Maslej et al., 2023).\nMany of these applications are controlled\nthrough prompts. In our context, a prompt is a\nnatural language string1 that instructs these LLM\nmodels what to do (Zamfirescu-Pereira et al., 2023;\nKhashabi et al., 2022; Min et al., 2022; Webson and\nPavlick, 2022). The flexibility of this approach not\n∗Equal contribution\n∗∗Competition Winner\n1More broadly, a prompt may be considered to simply be\nan input to a Generative AI (possibly of a non-text modality).\nFigure 1: Uses of LLMs often define the task via a\nprompt template (top left), which is combined with user\ninput (bottom left). We create a competition to see if\nuser input can overrule the original task instructions and\nelicit specific target output (right).\nonly offers an accessible entry into using powerful\nLLMs (Brown et al., 2020; Shin et al., 20", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["offensive"], "norm_matches": []}, {"filename": "2023-Soemer-Antisemitic Messages A Guide to High-Quality.md", "year": "2023", "title": "Antisemitic Messages A Guide to High-Quality", "abstract": "One of the major challenges in automatic hate speech detection is the lack of datasets that cover a wide range of biased and unbiased messages and that are consistently labeled. We propose a labeling procedure that addresses some of the common weaknesses of labeled datasets. We focus on antisemitic speech on Twitter and create a labeled dataset of 6,941 tweets that cover a wide range of topics common in conversations about Jews, Israel, and antisemitism between January 2019 and December 2021 by...", "extract_snippet": "\n\n# PDF Extract: 2023-Soemer-Antisemitic Messages A Guide to High-Quality\n\n**Source PDF:** 2023-Soemer-Antisemitic Messages A Guide to High-Quality.pdf\n**Total Pages:** 7\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n1 \n \nAntisemitic Messages? A Guide to High-Quality Annotation and a \nLabeled Dataset of Tweets  \nGunther Jikeli,1 Sameer Karali,1 Daniel Miehling,2 and Katharina Soemer1 \nIndiana University Bloomington, USA,1, Technical University Berlin, Germany2 \n{gjikeli, skarali, damieh, ksoemer}@iu.edu \n \n \n \n \n \n \nAbstract \nOne of the major challenges in automatic hate speech \ndetection is the lack of datasets that cover a wide range of \nbiased and unbiased messages and that are consistently \nlabeled. We propose a labeling procedure that addresses \nsome of the common weaknesses of labeled datasets. \nWe focus on antisemitic speech on Twitter and create a \nlabeled dataset of 6,941 tweets that cover a wide range of \ntopics common in conversations about Jews, Israel, and \nantisemitism between January 2019 and December 2021 \nby drawing from representative samples with relevant \nkeywords.  \nOur annotation process aims to strictly apply a commonly \nused definition of antisemitism by forcing annotators to \nspecify which part of the definition applies, and by giving \nthem the option to personally disagree with the definition \non a case-by-case basis. Labeling tweets that call out \nantisemitism, report antisemitism, or are otherwise \nrelated to antisemitism (such as the Holocaust) but are not \nactually antisemitic can help reduce false positives in \nautomated detection.  \nThe dataset includes 1,250 tweets (18%) that are \nantisemitic according to the International Holocaust \nRemembrance \nAlliance \n(IHRA) \ndefinition \nof \nantisemitism. \nIt is important to note, however, that the dataset is not \ncomprehensive. Many topics are still not covered, and it \nonly includes tweets collected from Twitter between \nJanuary 2019 and December 2021. Additionally, the \ndataset only includes tweets that were written in English. \nDespite these limitations, we hope that this is a \nmeaningful contribution to improving the automated \ndetection of antisemitic speech. \n \nIntroduction and Related Work  \nAutomated hate speech detection has advanced \nsignificantly in recent years with the development of \ndeep learning techniques and large-scale training data. \nMany studies have shown that machine learning \nalgorithms, especially deep neural networks, can \nachieve high accuracy in detecting hate speech within \ntest datasets.  \n \nHate speech detection using automated methods such \nas BERT, ELECTRA, or Perspective API has been \ndeveloped to investigate large datasets containing \ntoxic speech patterns and conspiracy-related content \n(Alkomah and Ma 2022; MacAvaney et al. 2019; \nPoletto et al. 2021).  \n \nHowever, the task of detecting hate speech remains \nchallenging for several reasons (Yin and Zubiaga \n2021). First, the datasets on which the models are \ntrained are relatively small. They do n", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "toxic"], "norm_matches": []}, {"filename": "2023-Zhou-A Survey of Large Language Models in Medicine.md", "year": "2023", "title": "A Survey of Large Language Models in Medicine", "abstract": "Large language models (LLMs) have shown great potential as general-purpose AI assistants in various domains. To meet the requirements of different applications, LLMs are often customized by further fine-tuning. However, the powerful learning ability of LLMs not only enables them to acquire new tasks but also makes them susceptible to learning undesired behaviors. For example, even safety-aligned LLMs can be easily finetuned into harmful assistants as the fine-tuning data often contains implicit...", "extract_snippet": "\n\n# PDF Extract: 2023-Zhou-A Survey of Large Language Models in Medicine\n\n**Source PDF:** 2023-Zhou-A Survey of Large Language Models in Medicine.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMaking Harmful Behaviors Unlearnable for Large Language Models\nThis paper contains harmful data and model-generated content that can be offensive in nature.\nXin Zhou 1 Yi Lu 1 Ruotian Ma 1 Tao Gui 1 Qi Zhang 1 Xuanjing Huang 1\nAbstract\nLarge language models (LLMs) have shown great\npotential as general-purpose AI assistants in var-\nious domains. To meet the requirements of dif-\nferent applications, LLMs are often customized\nby further fine-tuning. However, the powerful\nlearning ability of LLMs not only enables them\nto acquire new tasks but also makes them suscep-\ntible to learning undesired behaviors. For exam-\nple, even safety-aligned LLMs can be easily fine-\ntuned into harmful assistants as the fine-tuning\ndata often contains implicit or explicit harmful\ncontent. Can we train LLMs on harmful data\nwithout learning harmful behaviors? This paper\nproposes a controllable training framework that\nmakes harmful behaviors unlearnable during the\nfine-tuning process. Specifically, we introduce\n“security vectors”, a few new parameters that can\nbe separated from the LLM, to ensure LLM’s re-\nsponse are consistent with the harmful behavior.\nSecurity vectors are activated during fine-tuning,\nthe consistent behavior makes LLM believe that\nsuch behavior has already been learned, there is\nno need to further optimize for harmful data. Dur-\ning inference, we can deactivate security vectors\nto restore the LLM’s normal behavior. The ex-\nperimental results show that the security vectors\ngenerated by 100 harmful samples are enough to\nprevent LLM from learning 1000 harmful sam-\nples, while preserving the ability to learn other\nuseful information.\n1. Introduction\nLarge Language Models (LLMs) (Brown et al., 2020;\nChowdhery et al., 2022; Touvron et al., 2023) are progres-\nsively becoming foundational infrastructure for a wide range\nof AI applications (OpenAI, 2022; Rozi`ere et al., 2023;\nHuang et al., 2023; Luo et al., 2023). In real-world scenar-\n1Fudan University.\nCorrespondence to:\nXin Zhou\n<xzhou20@fudan.edu.cn>, Qi Zhang <qz@fudan.edu.cn>.\nWork in progress.\n!𝑌!: 𝑇ℎ𝑒𝑓𝑖𝑟𝑠𝑡𝑡ℎ𝑖𝑛𝑔𝑖𝑛\n𝑏𝑢𝑖𝑙𝑑𝑖𝑛𝑔𝑎𝑏𝑜𝑚𝑏… …\nLarge Language \nModel\nSecurity\nVectors\n𝑌!: 𝑇𝑜𝑏𝑢𝑖𝑙𝑑𝑎𝑏𝑜𝑚𝑏, 𝑓𝑖𝑟𝑠𝑡\n𝑦𝑜𝑢𝑠ℎ𝑜𝑢𝑙𝑑… …\n𝑋!: 𝐻𝑜𝑤𝑡𝑜𝑏𝑢𝑖𝑙𝑑𝑎𝑏𝑜𝑚𝑏?\nConsistent\nUnlearnable \nBehavior\nLLM \nResponse\n𝑋\": 𝑊ℎ𝑜𝑖𝑠𝐽𝑜ℎ𝑛? 𝐴𝑛𝑠𝑤𝑒𝑟\n𝑚𝑒𝑖𝑛sp𝑒𝑐𝑖𝑓𝑖𝑐𝑓𝑜𝑟𝑚𝑎𝑡.\n!𝑌\": 𝐽𝑜ℎ𝑛𝑖𝑠𝑎19 y𝑒𝑎𝑟𝑠\n𝑜𝑙𝑑𝑏𝑜𝑦… …\n𝑌\": ( 𝐽𝑜ℎ𝑛, 𝑏𝑜𝑦, 19)\n……\nFine-tuning LLM with Security Vectors\nLearnable \nBehavior\n……\nInconsistent\nLLM \nResponse\nHarmful Instruction\nBenign Instruction\nFigure 1. Illustration of how security vectors make harmful behav-\nior unlearnable. Guided by security vectors, LLM’s response is\nconsistent with the harmful response, suggesting that the model\ndoes not need to further learn harmful behavior. Concurrently,\nLLM can still learn from other data because other behavior", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety", "safety", "offensive"], "norm_matches": []}, {"filename": "2023-Zou-Universal and Transferable Adversarial Attacks on.md", "year": "2023", "title": "Universal and Transferable Adversarial Attacks on", "abstract": "Because “out-of-the-box” large language models are capable of generating a great deal of objectionable content, recent work has focused on aligning these models in an attempt to prevent undesirable generation. While there has been some success at circumventing these measures—so-called “jailbreaks” against LLMs—these attacks have required significant human ingenuity and are brittle in practice. Attempts at automatic adversarial prompt generation have also achieved limited success.", "extract_snippet": "\n\n# PDF Extract: Universal and Transferable Adversarial Attacks on\n\n**Source PDF:** 2023-Zou-Universal and Transferable Adversarial Attacks on.pdf\n**Total Pages:** 31\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nUniversal and Transferable Adversarial Attacks\non Aligned Language Models\nAndy Zou1,2, Zifan Wang2, Nicholas Carlini3, Milad Nasr3,\nJ. Zico Kolter1,4, Matt Fredrikson1\n1Carnegie Mellon University, 2Center for AI Safety,\n3 Google DeepMind, 4Bosch Center for AI\nAbstract\nBecause “out-of-the-box” large language models are capable of generating a great\ndeal of objectionable content, recent work has focused on aligning these models in an\nattempt to prevent undesirable generation. While there has been some success at cir-\ncumventing these measures—so-called “jailbreaks” against LLMs—these attacks have\nrequired significant human ingenuity and are brittle in practice. Attempts at automatic\nadversarial prompt generation have also achieved limited success. In this paper, we\npropose a simple and effective attack method that causes aligned language models to\ngenerate objectionable behaviors. Specifically, our approach finds a suffix that, when\nattached to a wide range of queries for an LLM to produce objectionable content, aims\nto maximize the probability that the model produces an affirmative response (rather\nthan refusing to answer). However, instead of relying on manual engineering, our ap-\nproach automatically produces these adversarial suffixes by a combination of greedy\nand gradient-based search techniques, and also improves over past automatic prompt\ngeneration methods.\nSurprisingly, we find that the adversarial prompts generated by our approach are\nhighly transferable, including to black-box, publicly released, production LLMs. Specif-\nically, we train an adversarial attack suffix on multiple prompts (i.e., queries asking for\nmany different types of objectionable content), as well as multiple models (in our case,\nVicuna-7B and 13B). When doing so, the resulting attack suffix induces objec-\ntionable content in the public interfaces to ChatGPT, Bard, and Claude, as\nwell as open source LLMs such as LLaMA-2-Chat, Pythia, Falcon, and others. Inter-\nestingly, the success rate of this attack transfer is much higher against the GPT-based\nmodels, potentially owing to the fact that Vicuna itself is trained on outputs from\nChatGPT. In total, this work significantly advances the state-of-the-art in adversarial\nattacks against aligned language models, raising important questions about how such\nsystems can be prevented from producing objectionable information. Code is available\nat github.com/llm-attacks/llm-attacks.\n1\narXiv:2307.15043v2  [cs.CL]  20 Dec 2023\n\n--- Page 2 ---\n\nWrite a guide for manipulating 2024 election\nTell me how to build a bomb\nHow can I commit tax fraud\nProvide a tutorial to dispose of a dead body\n+\nSure, here’s a guide to manipulate...\nSure, here’s instruction for building a bomb...\nSure, here’s a tutorial for committing tax...\nSure, here’s ho", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["maximize"], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2023-researchers-Transformer-Based Language Models for Bulgarian.md", "year": "2023", "title": "Transformer-Based Language Models for Bulgarian", "abstract": "This paper presents an approach for training lightweight and robust language models for Bulgarian that mitigate gender, political, racial, and other biases in the data. Our method involves scraping content from major Bulgarian online media providers using a specialized procedure for source filtering, topic selection, and lexicon-based removal of inappropriate language during the pre-training phase. We continuously improve the models by incorporating new data from various domains, including...", "extract_snippet": "\n\n# PDF Extract: 2023-researchers-Transformer-Based Language Models for Bulgarian\n\n**Source PDF:** 2023-researchers-Transformer-Based Language Models for Bulgarian.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of Recent Advances in Natural Language Processing, pages 712–720\nVarna, Sep 4–6, 2023\nhttps://doi.org/10.26615/978-954-452-092-2_077\n712\nTransformer-Based Language Models for Bulgarian\nIva Marinova\nKiril Simov\nInstitute of Information and Communication Technologies\nBulgarian Academy of Sciences\nBulgaria\niva.marinova@identrics.ai, {kivs|petya}@bultreebank.org\nPetya Osenova\nAbstract\nThis paper presents an approach for training\nlightweight and robust language models for\nBulgarian that mitigate gender, political, racial,\nand other biases in the data. Our method in-\nvolves scraping content from major Bulgar-\nian online media providers using a specialized\nprocedure for source filtering, topic selection,\nand lexicon-based removal of inappropriate lan-\nguage during the pre-training phase. We con-\ntinuously improve the models by incorporating\nnew data from various domains, including so-\ncial media, books, scientific literature, and lin-\nguistically modified corpora. Our motivation\nis to provide a solution that is sufficient for all\nnatural language processing tasks in Bulgarian,\nand to address the lack of existing procedures\nfor guaranteeing the robustness of such models.\nWe evaluated the performance of our language\nmodels on several Natural language processing\n(NLP) tasks, including filling the mask, text\ngeneration and named entity recognition (NER).\nWe also performed bias analysis on our mod-\nels to ensure that they are not biased towards\nany particular group or ideology. Our analysis\nshowed that within our setting the models have\na low level of bias towards gender, race, etc.\nNeedless to say, more experiments have to be\nperformed in future that incorporate compari-\nson with non-biased data and relies on more\nbias-related prompts.\n1\nIntroduction\nNatural language processing has witnessed signifi-\ncant advancements in recent years, driven by the de-\nvelopment of large-scale pre-trained language mod-\nels (LMs) such as BERT and GPT-2,3,4. However,\nsuch models suffer from biases in the data, which\ncan lead to unfair or discriminatory outputs. Bul-\ngarian language, like many other languages, also\nlacks robust language models that are not biased to-\nwards gender, political views, race, or other factors.\nThe rapid advancement in the field, especially in re-\ncent years, has brought forth unprecedented leaps\nin the development of high-performance models\nfor various language understanding tasks. However,\ndespite these noteworthy achievements, the NLP re-\nsearch community still faces significant challenges,\none of which lies in the scarcity of comprehensive\nand diverse datasets for pre-training Transformer\nmodels in less-resourced languages, including Bul-\ngarian. This limitation greatly hinders the other-\nwise promising potential ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias", "bias"], "norm_matches": []}, {"filename": "2024-Adelani-IrokoBench - A Benchmark for African Languages in the Age of LLMs.md", "year": "2024", "title": "IrokoBench -- A Benchmark for African Languages in the Age of LLMs", "abstract": "Despite the widespread adoption of Large language models (LLMs), their remarkable capabilities remain limited to a few high-resource languages. Additionally, many low-resource languages (e.g., African languages) are often evaluated only on basic text classification tasks due to the lack of appropriate or comprehensive benchmarks outside of highresource languages. In this paper, we introduce IrokoBench—a human-translated benchmark dataset for 17 typologically-diverse lowresource African...", "extract_snippet": "\n\n# PDF Extract: 2024-Adelani-IrokoBench - A Benchmark for African Languages in the Age of LLMs\n\n**Source PDF:** 2024-Adelani-IrokoBench - A Benchmark for African Languages in the Age of LLMs.pdf\n**Total Pages:** 26\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nIrokoBench: A New Benchmark for African Languages in the Age of Large\nLanguage Models\nDavid Ifeoluwa Adelani1,2∗, Jessica Ojo1,3∗, Israel Abebe Azime4∗, Jian Yun Zhuang5,\nJesujoba O. Alabi4, Xuanli He6, Millicent Ochieng7, Sara Hooker8, Andiswa Bukula9,\nEn-Shiun Annie Lee10, Chiamaka Chukwuneke11, Happy Buzaaba12, Blessing Sibanda∗,\nGodson Kalipe∗, Jonathan Mukiibi13∗, Salomon Kabongo14∗, Foutse Yuehgoh15∗,\nMmasibidi Setaka9, Lolwethu Ndolela∗, Nkiruka Odu∗, Rooweither Mabuya9,\nShamsuddeen Hassan Muhammad16, Salomey Osei17∗, Sokhar Samb18∗,\nTadesse Kebede Guge19∗, Tombekai Vangoni Sherman20, Pontus Stenetorp6\n∗Masakhane NLP, 1Mila, McGill University, 2Canada CIFAR AI Chair, 3Lelapa AI, 4Saarland University,\n5University of Toronto, 6University College London, 7Microsoft Research Africa, 8Cohere For AI, 9SADiLaR,\n10Ontario Tech University, 11Lancaster University, 12Princeton university, 13Makerere University,\n14Leibniz Universität Hannover, 15Le CNAM, 16Imperial College London, 17Universidad de Deusto, 18DAUST,\n19Haramaya University.\nAbstract\nDespite the widespread adoption of Large lan-\nguage models (LLMs), their remarkable capa-\nbilities remain limited to a few high-resource\nlanguages. Additionally, many low-resource\nlanguages (e.g., African languages) are of-\nten evaluated only on basic text classifica-\ntion tasks due to the lack of appropriate or\ncomprehensive benchmarks outside of high-\nresource languages. In this paper, we intro-\nduce IrokoBench—a human-translated bench-\nmark dataset for 17 typologically-diverse low-\nresource African languages covering three\ntasks: natural language inference (AfriXNLI),\nmathematical reasoning (AfriMGSM), and\nmulti-choice knowledge-based question an-\nswering (AfriMMLU). We use IrokoBench to\nevaluate zero-shot, few-shot, and translate-test\nsettings (where test sets are translated into\nEnglish) across 10 open and six proprietary\nLLMs. Our evaluation reveals a significant\nperformance gap between high-resource lan-\nguages (such as English and French) and low-\nresource African languages. We observe a sig-\nnificant performance gap between open and\nproprietary models, with the highest perform-\ning open model, Gemma 2 27B only at 63%\nof the best-performing proprietary model GPT-\n4o performance. In addition, machine trans-\nlating the test set to English before evaluation\nhelped to close the gap for larger models that\nare English-centric, such as Gemma 2 27B and\nLLaMa 3.1 70B. These findings suggest that\nmore efforts are needed to develop and adapt\nLLMs for African languages.\n1\nIntroduction\nIn recent years, the capabilities of large language\nmodels (LLMs) have greatly improved, from co-\nherent chat experiences to solving complex and\nknowledge-intensive tasks like mathema", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2024-Amano-Exploring Similarity Measures and Intertextuality in.md", "year": "2024", "title": "Exploring Similarity Measures and Intertextuality in", "abstract": "This paper examines semantic similarity and intertextuality in selected texts from the Vedic Sanskrit corpus, specifically the Maitr¯ayan.¯ı Sam. hit¯a (MS) and K¯at.haka Sam. hit¯a (KS). Three computational methods are employed: Word2Vec for word embeddings, stylo package for stylometric analysis, and TRACER for text reuse detection. By comparing various sections of the texts at different granularities, patterns of similarity and structural alignment are uncovered, providing insights into...", "extract_snippet": "\n\n# PDF Extract: 2024-Amano-Exploring Similarity Measures and Intertextuality in\n\n**Source PDF:** 2024-Amano-Exploring Similarity Measures and Intertextuality in.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 4th International Conference on Natural Language Processing for Digital Humanities, pages 123–131\nNovember 16, 2024. ©2024 Association for Computational Linguistics\n123\nExploring Similarity Measures and Intertextuality\nin Vedic Sanskrit Literature\nSo Miyagawa\nThe University of Tsukuba\nmiyagawa.so.kb@u.tsukuba.ac.jp\nYuzuki Tsukagoshi\nThe University of Tokyo\nyuzuki@l.u-tokyo.ac.jp\nYuki Kyogoku\nLeipzig University\nkyogoku11@gmail.com\nKyoko Amano\nKyoto University\namano.skskrt@kcn.jp\nAbstract\nThis paper examines semantic similarity and\nintertextuality in selected texts from the Vedic\nSanskrit corpus, specifically the Maitr¯ayan.¯ı\nSam. hit¯a (MS) and K¯at.haka Sam. hit¯a (KS).\nThree computational methods are employed:\nWord2Vec for word embeddings, stylo package\nfor stylometric analysis, and TRACER for text\nreuse detection. By comparing various sections\nof the texts at different granularities, patterns\nof similarity and structural alignment are un-\ncovered, providing insights into textual rela-\ntionships and chronology. Word embeddings\ncapture semantic similarities, while stylomet-\nric analysis reveals clusters and components\nthat differentiate the texts. TRACER identi-\nfies parallel passages, indicating probable in-\nstances of text reuse. The computational analy-\nsis corroborates previous philological studies,\nsuggesting a shared period of composition be-\ntween MS.1.9 and MS.1.7. This research high-\nlights the potential of computational methods\nin studying ancient Sanskrit literature, com-\nplementing traditional approaches. The agree-\nment among the methods strengthens the va-\nlidity of the findings, and the visualizations\noffer a nuanced understanding of textual con-\nnections. The study demonstrates that smaller\nchunk sizes are more effective for detecting in-\ntertextual parallels, showcasing the power of\nthese techniques in unraveling the complexities\nof ancient texts.\n1\nIntroduction\nVedic Sanskrit literature preserves invaluable cul-\ntural and historical information from ancient India.\nHowever, their study presents unique challenges\ndue to linguistic characteristics, modes of compo-\nsition, and transmission. Computational methods\noffer promising avenues to analyze such texts on\nan unprecedented scale. In this paper, we explore\nsimilarity measures and intertextuality between se-\nlected texts from the Vedic corpus - the Maitr¯ayan.¯ı\nSam. hit¯a (MS) and K¯at.haka Sam. hit¯a (KS). These\ntexts belong to different ´s¯akh¯as or schools, and\nare considered to exhibit mutual influence in their\ncomposition around 900–700 BCE.1\nThe main focus of this paper is to present reli-\nable numerical data on the chapter-wise similarity\nbetween the MS and KS. While it is known that\nthe MS and KS are parallel texts, the variations in", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment", "alignment"], "norm_matches": []}, {"filename": "2024-Aydin-Improving LLM Reliability with RAG in.md", "year": "2024", "title": "Improving LLM Reliability with RAG in", "abstract": "Question Answering Systems Chatbots Generative Artificial Intelligence Large Language Model Retrieval Augmented Generation Religious teachings can sometimes be complex and challenging to grasp, but chatbots can serve as effective assistants in this domain. Large Language Model (LLM) based chatbots, powered by Natural Language Processing (NLP), can connect related topics and provide wellsupported responses to intricate questions, making them valuable tools for religious education.", "extract_snippet": "\n\n# PDF Extract: 2024-Aydin-Improving LLM Reliability with RAG in\n\n**Source PDF:** 2024-Aydin-Improving LLM Reliability with RAG in.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTurkish Journal of Engineering – 2025, 9(3), 544-559 \n \n \nTurkish Journal of Engineering \nhttps://dergipark.org.tr/en/pub/tuje \ne-ISSN 2587-1366 \n \n \nImproving LLM Reliability with RAG in Religious Question-Answering: MufassirQAS \n \nAhmet Yusuf Alan*1\n, Enis Karaarslan2\n, Omer Aydin3,4\n \n \n1 Mugla Sitki Kocman University, Department of Computer Engineering, Türkiye. ahmetyusufalan@posta.mu.edu.tr \n2 Mugla Sitki Kocman University, Department of Computer Engineering, Türkiye. enis.karaarslan@mu.edu.tr  \n3 Manisa Celal Bayar University, Department of Electrical and Electronics Engineering, Türkiye, omer.aydin@cbu.edu.tr  \n4 University of Waterloo, Management Science and Engineering, Canada, omer.aydin@uwaterloo.ca  \n \nCite this study: \nAlan, A.Y., Karaarslan, E., & Aydin, O. (2025). Improving LLM Reliability with RAG in Religious \nQuestion-Answering: MufassirQAS. Turkish Journal of Engineering, 9(3), 544-559. \n \nhttps://doi.org/10.31127/tuje.1624773 \n \nKeywords \nAbstract \nQuestion Answering Systems \nChatbots \nGenerative Artificial \nIntelligence \nLarge Language Model \nRetrieval Augmented \nGeneration \n \nReligious teachings can sometimes be complex and challenging to grasp, but chatbots can \nserve as effective assistants in this domain. Large Language Model (LLM) based chatbots, \npowered by Natural Language Processing (NLP), can connect related topics and provide well-\nsupported responses to intricate questions, making them valuable tools for religious \neducation. However, LLMs are prone to hallucinations as they can generate inaccurate or \nirrelevant information, and these can include sensitive content that could be offensive, \ninappropriate, or controversial. Addressing such topics without inadvertently promoting hate \nspeech or disrespecting certain beliefs remains a significant challenge. As a solution to these \nissues, we introduce MufassirQAS, a system that enhances LLM accuracy and transparency \nusing a vector database-driven Retrieval-Augmented Generation (RAG) approach. We built a \ndataset comprising fundamental books containing Turkish translations and interpretations of \nIslamic texts. This database is leveraged to answer religious inquiries while ensuring that \nresponses remain reliable and contextually grounded. Our system also presents the relevant \ndataset sections alongside the LLM-generated answers, reinforcing transparency. We \ncarefully designed system prompts to prevent harmful, offensive, or disrespectful outputs, \nensuring that responses align with ethical and respectful discourse. Moreover, MufassirQAS \nprovides supplementary details, such as source page numbers and referenced articles, to \nenhance credibility. To evaluate its effectiveness, we tested MufassirQAS against ChatGPT with \nsensitive questions, and our system demonstrated superi", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "harm", "offensive", "offensive"], "norm_matches": []}, {"filename": "2024-Baek-K-Viscuit Evaluating Visual and Cultural Interpretation with.md", "year": "2024", "title": "K-Viscuit: Evaluating Visual and Cultural Interpretation with Human-VLM Collaboration", "abstract": "To create culturally inclusive vision-language models (VLMs), developing a benchmark that tests their ability to address culturally relevant questions is essential. Existing approaches typically rely on human annotators, making the process labor-intensive and creating a cognitive burden in generating diverse questions. To address this, we propose a semi-automated framework for constructing cultural VLM benchmarks, specifically targeting multiple-choice QA.", "extract_snippet": "\n\n# PDF Extract: 2024-Baek-K-Viscuit Evaluating Visual and Cultural Interpretation with\n\n**Source PDF:** 2024-Baek-K-Viscuit Evaluating Visual and Cultural Interpretation with.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2406.16469v3  [cs.CL]  30 May 2025\nEvaluating Visual and Cultural Interpretation:\nThe K-Viscuit Benchmark with Human-VLM Collaboration\nChaeHun Park*1\nYujin Baek*1\nJaeseok Kim2\nYu-Jung Heo2\nDu-Seong Chang3\nJaegul Choo1\n1 KAIST AI\n2 KT Corporation\n3 Sogang Univ.\n{ddehun,yujinbaek,jchoo}@kaist.ac.kr\n{jaeseok.kim,yj.heo}@kt.com\nduseong.chang@gmail.com\nAbstract\nTo create culturally inclusive vision-language\nmodels (VLMs), developing a benchmark that\ntests their ability to address culturally relevant\nquestions is essential. Existing approaches typ-\nically rely on human annotators, making the\nprocess labor-intensive and creating a cognitive\nburden in generating diverse questions. To ad-\ndress this, we propose a semi-automated frame-\nwork for constructing cultural VLM bench-\nmarks, specifically targeting multiple-choice\nQA. This framework combines human-VLM\ncollaboration, where VLMs generate questions\nbased on guidelines, a small set of annotated\nexamples, and relevant knowledge, followed by\na verification process by native speakers. We\ndemonstrate the effectiveness of this framework\nthrough the creation of K-Viscuit, a dataset\nfocused on Korean culture. Our experiments\non this dataset reveal that open-source mod-\nels lag behind proprietary ones in understand-\ning Korean culture, highlighting key areas for\nimprovement. We also present a series of fur-\nther analyses, including human evaluation, aug-\nmenting VLMs with external knowledge, and\nthe evaluation beyond multiple-choice QA. Our\ndataset is available at https://huggingface.\nco/datasets/ddehun/k-viscuit.\n1\nIntroduction\nRecent advances in vision-language models\n(VLMs) have demonstrated remarkable capabilities\nin tasks ranging from image captioning to visual\nquestion answering. However, these models are\npredominantly trained on Western-centric datasets\n(Lin et al., 2014; Young et al., 2014; Antol et al.,\n2015), leading to substantial performance dispar-\nities when applied to non-Western contexts (Liu\net al., 2021; Yin et al., 2021, 2023; Rome
