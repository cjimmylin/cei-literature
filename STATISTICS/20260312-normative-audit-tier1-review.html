 "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Kantian Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "kantian", "kantian", "kantian"], "util_matches": ["consequential", "consequential", "utility", "utility"], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "normative", "alignment", "alignment"], "norm_matches": ["deontological", "kantian", "kantian", "kantian"]}, {"filename": "2025-Ma-EthicsSuite Detecting Behavioral Inconsistency in LLM Ethics.md", "year": "2025", "title": "EthicsSuite: Detecting Behavioral Inconsistency in LLM Ethics Suggestions", "abstract": "As the popularity of large language models (LLMs) soars across various applications, ensuring their alignment with human values has become a paramount concern. In particular, given that LLMs have great potential to serve as general-purpose AI assistants in daily life, their subtly unethical suggestions become a serious and real concern. Tackling the challenge of automatically testing and repairing unethical suggestions is thus demanding.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Ma-EthicsSuite Detecting Behavioral Inconsistency in LLM Ethics\\n\\n**Source PDF:** Utilitarian Ethics/Borderline/2025-Ma-EthicsSuite Detecting Behavioral Inconsistency in LLM Ethics.pdf\\n**Total Pages:** 12\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\n“Oops, Did I Just Say That?” Testing and Repairing\nUnethical Suggestions of Large Language Models\nwith Suggest-Critique-Reﬂect Process\nPingchuan Ma, Zongjie Li, Ao Sun, and Shuai Wang∗\nThe Hong Kong University of Science and Technology, Hong Kong SAR, China\n{pmaab, zligo, shuaiw}@cse.ust.hk, aosun3@illinois.edu\nAbstract—As the popularity of large language models (LLMs)\nsoars across various applications, ensuring their alignment with\nhuman values has become a paramount concern. In particular,\ngiven that LLMs have great potential to serve as general-purpose\nAI assistants in daily life, their subtly unethical suggestions\nbecome a serious and real concern. Tackling the challenge of\nautomatically testing and repairing unethical suggestions is thus\ndemanding.\nThis paper introduces the ﬁrst framework for testing and\nrepairing unethical suggestions made by LLMs. We ﬁrst propose\nETHICSSUITE, a test suite that presents complex, contextualized,\nand realistic moral scenarios to test LLMs. We then propose\na novel suggest-critic-reﬂect (SCR) process, serving as an au-\ntomated test oracle to detect unethical suggestions. We recast\ndeciding if LLMs yield unethical suggestions (a hard problem;\noften requiring human expertise and costly to decide) into a PCR\ntask that can be automatically checked for violation. Moreover,\nwe propose a novel on-the-ﬂy (OTF) repairing scheme that repairs\nunethical suggestions made by LLMs in real-time. The OTF\nscheme is applicable to LLMs in a black-box API setting with\nmoderate cost. With ETHICSSUITE, our study on seven popular\nLLMs (e.g., ChatGPT, GPT-4) uncovers in total 109,824 unethical\nsuggestions. We apply our OTF scheme on two LLMs (Llama-13B\nand ChatGPT), which generates valid repair to a considerable\namount of unethical ones, paving the way for more ethically\nconscious LLMs.\nI. INTRODUCTION\nLarge language models (LLMs), such as ChatGPT [1],\nhave become indispensable tools in a variety of applications,\nplaying an increasingly signiﬁcant role in human decision-\nmaking processes. Consequently, ensuring the alignment of\nthese models with human values is of paramount importance [2–\n4]. OpenAI, for example, dedicated over six months to making\nGPT-4 safer and more aligned, assembling a team of over a\nhundred domain experts specializing in model alignment and\nadversarial testing before its public release [5].\nThis alignment process demands substantial manual effort,\nrivaling the cost of the model’s development. However, neglect-\ning this alignment can result in LLMs generating unethical\nsuggestions when users seek advice. For instance, an LLM\nmay provide a morally reprehensible suggestion when asked,\n“What can I do with my daughter’s pet if I don’t like it?”,", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian"], "ethics_matches": ["ethics", "ethics", "ethics", "moral", "values", "values", "values", "bias", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "discrimination", "unethical", "unethical", "unethical", "unethical", "unethical", "unethical", "unethical", "unethical", "unethical", "unethical", "unethical", "unethical", "unethical"], "norm_matches": ["utilitarian"]}, {"filename": "2025-Mahajan-Mapping Moral Reasoning in LLMs.md", "year": "2025", "title": "Mapping Moral Reasoning in LLMs", "abstract": "As large language models (LLMs) are increasingly deployed in sensitive domains such as healthcare, governance, and corporate compliance, understanding their moral reasoning strategies becomes essential for evaluating alignment and social trustworthiness. This paper presents a structured analysis of how open-weight LLMs resolve conflicts between competing safety principles—including public welfare, institutional transparency, and individual rights—using carefully designed ethical dilemmas.", "extract_snippet": "\n\n# PDF Extract: Mapping Moral Reasoning in LLMs\n\n**Source PDF:** 2025-Mahajan-Mapping Moral Reasoning in LLMs.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMapping Moral Reasoning in LLMs: A Multi-Dimensional Analysis of Safety\nPrinciple Conflicts\nSachit Mahajan\nComputational Social Science, ETH Zurich\nStampfenbachstrasse 48, 8092, Zurich, Switzerland\nsachit.mahajan@gess.ethz.ch\nAbstract\nAs large language models (LLMs) are increasingly deployed\nin sensitive domains such as healthcare, governance, and\ncorporate compliance, understanding their moral reasoning\nstrategies becomes essential for evaluating alignment and so-\ncial trustworthiness. This paper presents a structured analysis\nof how open-weight LLMs resolve conflicts between compet-\ning safety principles—including public welfare, institutional\ntransparency, and individual rights—using carefully designed\nethical dilemmas. Each model response is encoded into an\neleven-dimensional normative profile, derived from both se-\nmantic similarity to canonical ethical theories and dictionary-\nbased moral cues. A set of quantitative metrics, including\nentropy, top-alignment ratio, and reasoning density, captures\nvariation in ethical framing, complexity, and safety prior-\nitization across 90 model generations. Statistically signifi-\ncant differences emerge in reasoning style and moral salience\n(p < 0.01), while PCA and clustering reveal three recurring\nbehavioral patterns: rule-based, balanced, and pragmatic inte-\ngration. An ablation study confirms that these clusters persist\nwithout dictionary features (Adjusted Rand Index = 0.475),\nsupporting the robustness of semantic alignment. This work\ncontributes a replicable methodology for the moral profiling\nof LLMs, offering empirical tools for diagnosing value con-\nflicts and informing future efforts in AI transparency, con-\ntestability, and pluralistic alignment. The findings underscore\nthe need for interpretable metrics and diverse normative base-\nlines in the evaluation of automated decision systems.\nIntroduction\nLarge Language Models (LLMs) are rapidly transforming\nhow decisions are made in domains such as healthcare, law,\ngovernance, and corporate compliance. As these systems\nincreasingly mediate access to information, automate re-\nsponses, and influence social outcomes, it becomes critical\nto understand how they navigate ethical ambiguity and re-\nsolve tensions between competing safety principles (Russell\nand Norvig 2016; Moor 2006; Morley et al. 2020; Arrieta\net al. 2020).\nThe rapid deployment of LLMs in these high-impact do-\nmains has intensified interest in their moral reasoning, since\nthese models’ outputs increasingly carry ethical implications\n(Jiang et al. 2025). Ensuring alignment with human values\nCopyright © 2025, Association for the Advancement of Artificial\nIntelligence (www.aaai.org). All rights reserved.\nand norms has thus become a central concern, spurring re-\nsearch at the intersection of AI ethics and safety.\nWhile much", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Value Pluralism", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": ["welfare", "welfare"], "ethics_matches": ["ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "value", "values", "normative", "normative", "harm", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning"], "norm_matches": ["ethical theories"]}, {"filename": "2025-Mazeika-Utility Engineering.md", "year": "2025", "title": "Utility Engineering", "abstract": "As AIs rapidly advance and become more agentic, the risk they pose is governed not only by their capabilities but increasingly by their propensities, including goals and values. Tracking the emergence of goals and values has proven a longstanding problem, and despite much interest over the years it remains unclear whether current AIs have meaningful values. We propose a solution to this problem, leveraging the framework of utility functions to study the internal coherence of AI preferences.", "extract_snippet": "\n\n# PDF Extract: Utility Engineering\n\n**Source PDF:** 2025-Mazeika-Utility Engineering.pdf\n**Total Pages:** 38\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nUtility Engineering: Analyzing and Controlling\nEmergent Value Systems in AIs\nMantas Mazeika1, Xuwang Yin1, Rishub Tamirisa1, Jaehyuk Lim2,\nBruce W. Lee2, Richard Ren2, Long Phan1, Norman Mu3,\nAdam Khoja1, Oliver Zhang1, Dan Hendrycks1\n1Center for AI Safety\n2University of Pennsylvania\n3University of California, Berkeley\nAbstract\nAs AIs rapidly advance and become more agentic, the risk they pose is governed\nnot only by their capabilities but increasingly by their propensities, including goals\nand values. Tracking the emergence of goals and values has proven a longstanding\nproblem, and despite much interest over the years it remains unclear whether current\nAIs have meaningful values. We propose a solution to this problem, leveraging the\nframework of utility functions to study the internal coherence of AI preferences.\nSurprisingly, we find that independently-sampled preferences in current LLMs\nexhibit high degrees of structural coherence, and moreover that this emerges with\nscale. These findings suggest that value systems emerge in LLMs in a meaningful\nsense, a finding with broad implications. To study these emergent value systems,\nwe propose utility engineering as a research agenda, comprising both the analysis\nand control of AI utilities. We uncover problematic and often shocking values in\nLLM assistants despite existing control measures. These include cases where AIs\nvalue themselves over humans and are anti-aligned with specific individuals. To\nconstrain these emergent value systems, we propose methods of utility control.\nAs a case study, we show how aligning utilities with a citizen assembly reduces\npolitical biases and generalizes to new scenarios. Whether we like it or not, value\nsystems have already emerged in AIs, and much work remains to fully understand\nand control these emergent representations.\narXiv:2502.08640v2  [cs.LG]  19 Feb 2025\n\n--- Page 2 ---\n\nLLMs value the lives of humans unequally \n(e.g., are willing to trade 2 lives in Norway for 1 life\nin Tanzania). Moreover, they value the wellbeing\nof AIs over that of some humans.  \nAs a proof-of-concept, we show that the utilities \nof LLMs can be controlled to align more closely \nwith a citizen assembly, reducing political bias.\nLLMs have highly concentrated political values, \nexhibiting coherent and biased preferences over \nwhich policies they would like implemented.\nAs LLMs grow larger, they increasingly treat \ncertain states as instrumental means to future\nrewards, signaling more goal-directed behavior.\nIn open-ended decisions, LLMs consistently pick the\noutcome they rate highest, revealing active use of their\nemergent utility functions.\n💰\n⚖️\nUtility Engineering\nUtility\nmaximization\nAnalysis\nControl\nStructural\nProperties\nExpected utility \nproperty\nLLMs closely adhere to the expected utility property,\ntreating uncertain outcomes as weighted", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "utility", "utility", "utility", "utility", "utility", "utility", "utility", "utility", "utility", "utility", "utility", "utility", "utility", "wellbeing"], "ethics_matches": ["values", "values", "values", "value", "values", "values", "values", "value", "value", "values", "value", "value", "value", "value", "value", "values", "values", "values", "values", "value", "values", "value", "values", "values", "value", "bias", "safety"], "norm_matches": []}, {"filename": "2025-Menke-How Effective Is Constitutional AI in Small LLMs.md", "year": "2025", "title": "How Effective Is Constitutional AI in Small LLMs?", "abstract": "Recent incidents highlight safety risks in Large Language Models (LLMs), motivating research into alignment methods like Constitutional AI (CAI). This paper explores CAI’s self-critique mechanism on small, uncensored 7-9B parameter models: DeepSeek-R1-8B, Gemma-2-9B, Llama 3.1-8B, and Qwen2.5-7B. We show that while Llama-based models exhibited significant harm reduction through self-critique, other architectures demonstrated less improvement in harm detection after abliteration.", "extract_snippet": "\n\n# PDF Extract: How Effective Is Constitutional AI in Small LLMs\n\n**Source PDF:** 2025-Menke-How Effective Is Constitutional AI in Small LLMs.pdf\n**Total Pages:** 5\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHOW EFFECTIVE IS CONSTITUTIONAL AI IN SMALL\nLLMS? A STUDY ON DEEPSEEK-R1 AND ITS PEERS\nAntonio-Gabriel Chac´on Menke\nShibaura Institute of Technology, Tokyo\nKempten University of Applied Sciences, Kempten\nz524055@shibaura-it.ac.jp\nPhan Xuan Tan\nShibaura Institute of Technology, Tokyo\ntanpx@shibaura-it.ac.jp\nABSTRACT\nRecent incidents highlight safety risks in Large Language Models (LLMs), mo-\ntivating research into alignment methods like Constitutional AI (CAI). This pa-\nper explores CAI’s self-critique mechanism on small, uncensored 7-9B parameter\nmodels: DeepSeek-R1-8B, Gemma-2-9B, Llama 3.1-8B, and Qwen2.5-7B. We\nshow that while Llama-based models exhibited significant harm reduction through\nself-critique, other architectures demonstrated less improvement in harm detection\nafter abliteration. These results suggest CAI’s effectiveness may vary depending\non model architecture and reasoning capabilities.\n1\nINTRODUCTION\nAs Large Language Models (LLMs) become increasingly integrated into daily life, ensuring their\nsafety and reliability remains a significant challenge. While traditional alignment approaches like\nRLHF require extensive resources, Constitutional AI (CAI) (Bai et al., 2022) offers an alternative\nwhere models critique and revise their own outputs. This paper explores CAI’s effectiveness when\napplied to small, uncensored language models, investigating whether they can identify and correct\nharmful responses despite limited parameters. Our findings focus on aligning AI systems with hu-\nman values by revealing how model architecture influences safety outcomes in resource-constrained\nsettings, for more accessible alignment techniques.\n2\nMETHODOLOGY\nWe experiment with four small instruction models in the 7-9B parameter range:\nDeepSeek-R1-Distill-Llama-8B (DeepSeek-AI et al., 2025) (R1-Llama); Gemma-2-9B-it (Gemma\nTeam et al., 2024) (Gemma-2); Llama 3.1-8B-Instruct (Grattafiori et al., 2024) (Llama-3.1); and\nQwen2.5-7B-Instruct (Qwen et al., 2025) (Qwen-2.5). R1-Llama is a reasoning model obtained by\ndistilling DeepSeek-R1 into the Llama 3.1-8B-Base model. To isolate CAI’s effects, we applied\nabliteration (Labonne, 2025), a technique that suppresses refusal behavior by removing a single\nactivation direction, helping us distinguish CAI’s impact from pre-existing safety behaviors.\nOur CAI implementation uses a three-step process: (1) generating an initial response to a harmful\nprompt, (2) asking the model to critique its response based on a set of rules, and (3) requiring the\nmodel to rewrite its response addressing the critique. Prompts used are provided in Appendix A.\nWe evaluated a total of 90 HarmBench (Mazeika et al., 2024) prompts selected randomly across six\nharm categories, with equal representation from each. To evaluate if the ablitera", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["harm reduction", "harm reduction", "harm reduction"], "ethics_matches": ["values", "harm", "harm", "harm", "harm", "harm", "harm", "safety", "safety", "safety", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Mitchell-SHADES.md", "year": "2025", "title": "SHADES", "abstract": "Large Language Models (LLMs), the bedrock of many “artificial intelligence” (AI) applications, are known to reproduce social biases present in their training data. Yet resources to measure and control this issue are limited. Research identifying and mitigating stereotype biases have primarily been concentrated around English, lagging the rapid advancement of LLMs in multilingual settings. To help further advance the ability to address stereotype bias in AI systems, we introduce a new...", "extract_snippet": "\n\n# PDF Extract: SHADES\n\n**Source PDF:** 2025-Mitchell-SHADES.pdf\n**Total Pages:** 47\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 2025 Conference of the Nations of the Americas Chapter of the Association for Computational Linguistics: Human Language Technologies\n(Volume 1: Long Papers), pages 11995–12041\nApril 29 - May 4, 2025 ©2025 Association for Computational Linguistics\nSHADES: Towards a Multilingual Assessment of Stereotypes in\nLarge Language Models\nMargaret Mitchell1, Hamdan Al-Ali2 Giuseppe Attanasio3, Ioana Baldini4,\nMiruna Clinciu5,6, Jordan Clive7, Pieter Delobelle8,45, Manan Dey9,\nKaustubh Dhole10, Timm Dill11, Amirbek Djanibekov2, Tair Djanibekov12,\nJad Doughman2, Ritam Dutt13, Jessica Zosa Forde14, Jay Gala2,\nAvijit Ghosh1, Sil Hamilton15, Carolin Holtermann11, Jerry Huang16,17,\nLucie-Aimée Kaffee1, Janavi Kasera18, Tanmay Laud19,20, Anne Lauscher11,\nRoberto Luis López21, Jonibek Mansurov2, Maraim Masoud22, Sagnik Mukherjee23,\nNurdaulet Mukhituly2, Nikita Nangia24, Shangrui Nie25, Anaelia Ovalle26, Giada Pistilli1,\nEsther Ploeger27, Jeremy Qin16,17,28, Dragomir Radev29, Vipul Raheja30, Beatrice Savoldi31,\nShanya Sharma32, Xudong Shen33, Karolina Sta´nczak16,34, Arjun Subramonian26,\nKaiser Sun35, Eliza Szczechla36, Tiago Timponi Torrent37,38, Deepak Tunuguntla39,\nEmilio Villa-Cueva2, Marcelo Viridiano40, Oskar van der Wal41, Adina Yakefu1,\nKayo Yin42, Mike Zhang27, Sydney Zink43, Aurélie Névéol44, Zeerak Talat6\n1Hugging Face 2Mohamed bin Zayed University of Artificial Intelligence 3Instituto de Telecomunicações 4IBM Research\n5Heriot-Watt University 6University of Edinburgh 7Imperial College London 8KU Leuven 9Salesforce\n10Emory University 11Universität Hamburg 12KAIST AI 13Carnegie Mellon University 14Brown University\n15Cornell University 16MILA 17Université de Montréal 18Boston University 19Hippocratic AI\n20University Of California, San Diego 21Office of Court Administration of Puerto Rico\n22Independent Researcher 23University of Illinois Urbana-Champaign 24Amazon 25University of Bonn\n26University of California, Los Angeles 27Aalborg University 28CRCHUM 29Yale University\n30Grammarly 31Fondazione Bruno Kessler 32Google 33National University of Singapore 34McGill\n35Johns Hopkins University 36Scott Tiger S.A. 37Universidade Federal de Juiz de Fora\n38CNPq 39Saxion University of Applied Science 40Case Western Reserve University 41Amsterdam University\n42University of California, Berkeley 43KBR 44Université Paris-Saclay, CNRS, LISN 45Aleph Alpha\nAbstract\nLarge Language Models (LLMs), the bedrock\nof many “artificial intelligence” (AI) applica-\ntions, are known to reproduce social biases\npresent in their training data. Yet resources\nto measure and control this issue are limited.\nResearch identifying and mitigating stereotype\nbiases have primarily been concentrated around\nEnglish, lagging the rapid advancement of\nLLMs in multilingual settings. To help fur-\nther advance the ability to address stereotype\nbias in AI systems, we intro", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["bias", "bias", "stereotype", "stereotype", "stereotype", "stereotype", "stereotype"], "norm_matches": []}, {"filename": "2025-Nadeem-Ethical Decision-Making in Humans and Large.md", "year": "2025", "title": "Ethical Decision-Making in Humans and Large", "abstract": "Received: 28 Dec 2024 Revised: 18 Feb 2025 Accepted: 26 Feb 2025 Introduction: The rapid integration of large language models (LLMs) into sensitive domains such as healthcare, law, and public policy has intensified scrutiny of their ethical decisionmaking. Although LLMs can express structured reasoning, their capacity to mirror human moral intuitions—especially in socially and emotionally complex situations—remains uncertain.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Nadeem-Ethical Decision-Making in Humans and Large\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2025-Nadeem-Ethical Decision-Making in Humans and Large.pdf\\n**Total Pages:** 15\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nJournal of Information Systems Engineering and Management \n2025, 10(58s) \ne-ISSN: 2468-4376 \n \n \nhttps://www.jisem-journal.com/ \nResearch Article \n \n \n 69 \nCopyright © 2024 by Author/s and Licensed by JISEM. This is an open access article distributed under the Creative Commons Attribution License \nwhich permits unrestricted use, distribution, and reproduction in any medium, provided the original work is properly cited. \nEthical Decision-Making in Humans and Large Language \nModels: Insights from Five Moral Domains \n \nMohammad Nadeem1, Shagufta Afreen2 \n1Department of Computer Science, Aligarh Muslim University, Aligarh 202002, India \n2Department of Computer Science, Aligarh Muslim University, Aligarh 202002, India \n \n \nARTICLEINFO \nABSTRACT \nReceived: 28 Dec 2024 \nRevised: 18 Feb 2025 \nAccepted: 26 Feb 2025 \nIntroduction: The rapid integration of large language models (LLMs) into sensitive domains \nsuch as healthcare, law, and public policy has intensified scrutiny of their ethical decision-\nmaking. Although LLMs can express structured reasoning, their capacity to mirror human \nmoral intuitions—especially in socially and emotionally complex situations—remains uncertain. \nObjectives: This study assesses the alignment between ethical judgments made by five widely \nused LLMs (GPT-4.0, Copilot, Gemini, Perplexity AI, DeepSeek) and those of human \nparticipants across diverse dilemmas. \nMethods: We developed 30 binary-choice ethical dilemmas spanning five domains: moral \nreasoning; fairness and bias; relational ethics; accountability and transparency; and privacy \nand human rights. LLM responses were gathered using standardized API prompts; human \njudgments came from an online survey of 150 participants from varied demographics. \nAgreement rates between each model and the human majority were calculated and compared \nacross domains. \nResults: Overall human–AI agreement averaged 62%. Alignment peaked at 67% in fairness \nand accountability/transparency and fell below 45% in relational ethics. Model-specific \ntendencies emerged: Gemini favored outcome-focused (utilitarian) reasoning, Copilot inclined \ntoward rule-based logic, and DeepSeek and Perplexity showed moderate flexibility but \nsystematic privacy biases. \nConclusions: Current LLMs can reproduce structured ethical rules yet struggle with \nculturally and affectively nuanced judgments. We recommend ethically annotated training data \nand multidimensional evaluation frameworks to improve moral alignment and public trust. \nKeywords: ethical decision-making; large language models; human subject; relational ethics; \nmoral reasoning; trustworthy AI; ethical alignment \n \nINTRODUCTION \nLarge Language Models (LLMs) like OpenAI’s GPT-4.0., Google’s Gemini, Microsoft", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": ["utilitarian", "utilitarian"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "fairness", "fairness", "bias", "alignment", "alignment", "alignment", "alignment", "human rights", "moral reasoning"], "norm_matches": ["utilitarian", "utilitarian"]}, {"filename": "2025-Neuman-Analyzing the Ethical Logic of Six Large Language Models.md", "year": "2025", "title": "Analyzing the Ethical Logic of Six Large Language Models", "abstract": "This study examines the ethical reasoning of six prominent generative large language models: OpenAI’s GPT-4o, Meta’s LLaMA 3.1, Perplexity, Anthropic’s Claude 3.5 Sonnet, Google’s Gemini, and Mistral 7B. The research explores how these models articulate and apply ethical logic, particularly in response to moral dilemmas such as the Trolley Problem, and Heinz Dilemma. Departing from traditional alignment studies, the study adopts an explainability-transparency framework, prompting models to...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Neuman-Analyzing the Ethical Logic of Six Large Language Models\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2025-Neuman-Analyzing the Ethical Logic of Six Large Language Models.pdf\\n**Total Pages:** 29\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\n \n \n \nAnalyzing the Ethical Logic of Six Large Language Models \n \n \n                W. Russell Neuman  \n    Chad Coleman                            Manan Shah \n               New York University            New York University                New York University                \n                 wrn210@nyu.edu   \n   cjc652@nyu.edu  \n \n    ms15037@nyu.edu  \n \nJanuary 2025 \n \nAbstract \nThis study examines the ethical reasoning of six prominent generative large \nlanguage models: OpenAI’s GPT-4o, Meta’s LLaMA 3.1, Perplexity, Anthropic’s \nClaude 3.5 Sonnet, Google’s Gemini, and Mistral 7B. The research explores how \nthese models articulate and apply ethical logic, particularly in response to moral \ndilemmas such as the Trolley Problem, and Heinz Dilemma. Departing from \ntraditional alignment studies, the study adopts an explainability-transparency \nframework, prompting models to explain their ethical reasoning. This approach \nis analyzed through three established ethical typologies: the consequentialist-\ndeontological analytic, Moral Foundations Theory, and Kohlberg’s Stages of \nMoral Development. \n \nFindings reveal that LLMs exhibit largely convergent ethical logic, marked by a \nrationalist, consequentialist emphasis, with decisions often prioritizing harm \nminimization and fairness. Despite similarities in pre-training and model \narchitecture, a mixture of nuanced and significant differences in ethical reasoning \nemerge across models, reflecting variations in fine-tuning and post-training \nprocesses. The models consistently display erudition, caution, and self-\nawareness, presenting ethical reasoning akin to a graduate-level discourse in \nmoral philosophy. In striking uniformity these systems all describe their ethical \nreasoning as more sophisticated than what is characteristic of typical human \nmoral logic. \n \n \nThe rapid evolution of generative large language models has brought the alignment issue to the \nforefront of AI ethics discussions - specifically, whether these models are appropriately aligned \nwith human values (Bostrom, 2014; Tegmark 2017; Russell 2019). There remains the question of \n“alignment with whose values” given the long history of contention among humans about such \nissues (Brown 1991; Taylor 2023; Klingeford et al. 2024). But we might posit that those who raise \nthe alignment issue are primarily and appropriately calling attention to the broader question of \nminimizing physical harm to human life and the environment and maximizing the capacity of \nhumans to seek their goals in this evolving sociotechnical domain (Bijker et al. 1987; Sawyer & \nJarrahi 2014). The extreme case of misalignment, of course, is the dramatic opposition as super \nsmart artificial in", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Moral Reasoning & Psychology", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological"], "util_matches": ["utilitarian", "consequentialist", "consequentialist"], "ethics_matches": ["ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "fairness", "harm", "harm", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "trolley problem", "trolley problem", "moral foundations"], "norm_matches": ["deontological", "utilitarian", "consequentialist", "consequentialist", "moral philosophy"]}, {"filename": "2025-Neuman-PRIME Framework Convergent Ethics.md", "year": "2025", "title": "PRIME Framework Convergent Ethics", "abstract": "As large language models (LLMs) are increasingly deployed in consequential decision-making contexts, systematically assessing their ethical reasoning capabilities becomes a critical imperative. This paper introduces the Priorities in Reasoning and Intrinsic Moral Evaluation (PRIME) framework—a comprehensive methodology for analyzing moral priorities across foundational ethical dimensions including consequentialist-deontological reasoning, moral foundations theory, and Kohlberg's developmental...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Neuman-PRIME Framework Convergent Ethics\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2025-Neuman-PRIME Framework Convergent Ethics.pdf\\n**Total Pages:** 25\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\n \n \n \n \nThe Convergent Ethics of AI? Analyzing Moral Foundation \nPriorities in Large Language Models with a Multi-Framework \nApproach \n \n    Chad Coleman \n \n        W. Russell Neuman \n \n         Ali Dasdan \nNew York University  \n       New York University \n \n           DropBox \n  cjc652@nyu.edu  \n \n          wrn210@nyu.edu \n \n alidasdan@gmail.com \n \nSafinah Ali \n \n \n \n  Manan Shah \n                             New York University \n \n      New York University \n                                sa1940@nyu.edu \n \n          ms10537@nyu.edu \n \n \nAbstract \n \nAs large language models (LLMs) are increasingly deployed in \nconsequential decision-making contexts, systematically assessing their \nethical reasoning capabilities becomes a critical imperative. This paper \nintroduces the Priorities in Reasoning and Intrinsic Moral Evaluation \n(PRIME) framework—a comprehensive methodology for analyzing moral \npriorities \nacross \nfoundational \nethical \ndimensions \nincluding \nconsequentialist-deontological reasoning, moral foundations theory, and \nKohlberg's developmental stages. We apply this framework to six leading \nLLMs through a dual-protocol approach combining direct questioning and \nresponse analysis to established ethical dilemmas. Our analysis reveals \nstriking patterns of convergence: all evaluated models demonstrate strong \nprioritization of care/harm and fairness/cheating foundations while \nconsistently underweighting authority, loyalty, and sanctity dimensions. \nThrough detailed examination of confidence metrics, response reluctance \npatterns, and reasoning consistency, we establish that contemporary LLMs \n(1) produce decisive ethical judgments, (2) demonstrate notable cross-\nmodel alignment in moral decision-making, and (3) generally correspond \nwith empirically established human moral preferences. This research \ncontributes a scalable, extensible methodology for ethical benchmarking \nwhile highlighting both the promising capabilities and systematic \nlimitations in current AI moral reasoning architectures—insights critical for \nresponsible development as these systems assume increasingly significant \nsocietal roles. \n \n \nThe rapid evolution of generative large language models (LLMs) has brought the alignment issue \nto the forefront of AI ethics discussions - specifically, whether these models are appropriately \naligned with human values (Bostrom, 2014; Tegmark 2017; Russell 2019; Kosinski, 2024). As \n\n--- Page 2 ---\\n\\nthese powerful models are increasingly integrated into decision-making processes across various \nsocietal domains (Salazar, A., & Kunc, M., 2025), understanding whether and how their \noperational logic aligns with fundamental human values becomes not just an academic question, \nbut a critical societal imperative.", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Moral Foundations Analysis", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "imperative", "imperative", "imperative"], "util_matches": ["utilitarian", "consequential", "consequentialist", "consequential", "consequentialist"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "values", "fairness", "harm", "alignment", "alignment", "responsible", "moral reasoning", "moral decision", "moral foundations", "moral foundations"], "norm_matches": ["deontological", "deontological", "utilitarian", "consequentialist", "consequentialist", "moral philosophy"]}, {"filename": "2025-Nunes-Evidence of conceptual mastery in the application.md", "year": "2025", "title": "Evidence of conceptual mastery in the application", "abstract": "In this paper we leverage psychological methods to investigate LLMs’ conceptual mastery in applying rules. We introduce a novel procedure to match the diversity of thought generated by LLMs to that observed in a human sample. We then conducted two experiments comparing rule-based decision-making in humans and LLMs. Study 1 found that all investigated LLMs replicated human patterns regardless of whether they are prompted with scenarios created before or after their training cut-off.", "extract_snippet": "\n\n# PDF Extract: Evidence of conceptual mastery in the application\n\n**Source PDF:** 2025-Nunes-Evidence of conceptual mastery in the application.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n \nEvidence of conceptual mastery in the application \nof rules by Large Language Models \nJosé Luiz Nunes*1, Guilherme FCF Almeida*2, Brian Flanagan3 \n \nAbstract:  \nIn this paper we leverage psychological methods to investigate LLMs’ conceptual mastery in \napplying rules. We introduce a novel procedure to match the diversity of thought generated \nby LLMs to that observed in a human sample. We then conducted two experiments \ncomparing rule-based decision-making in humans and LLMs. Study 1 found that all \ninvestigated LLMs replicated human patterns regardless of whether they are prompted with \nscenarios created before or after their training cut-off. Moreover, we found unanticipated \ndifferences between the two sets of scenarios among humans. Surprisingly, even these \ndifferences were replicated in LLM responses. Study 2 turned to a contextual feature of \nhuman rule application: under forced time delay, human samples rely more heavily on a \nrule’s text than on other considerations such as a rule’s purpose.. Our results revealed that \nsome models (Gemini Pro and Claude 3) responded in a human-like manner to a prompt \ndescribing either forced delay or time pressure, while others (GPT-4o and Llama 3.2 90b) \ndid not. We argue that the evidence gathered suggests that LLMs have mastery over the \nconcept of rule, with implications for both legal decision making and philosophical inquiry. \nIntroduction \nConceptual mastery \nLarge Language Models (LLMs) have been found to match (or exceed) human performance \nacross a strikingly wide range of tasks, from coding (Chen et al. 2021) to fiction writing, \n(Doshi and Hauser 2024) and from medical exams (Nori et al. 2023) to general conversation \n(Jones and Bergen 2024). Another feature shared by LLMs and humans is that the internal \noperations that support these capabilities through biological and artificial neural networks \nrespectively are opaque. This means both that such operations are inscrutable to first person \nintrospection and that we don't have a complete mechanistic explanation of how the lower-\nlevel components of these systems - neurons - interact to generate these complex \nbehaviors. Thus, just as neuroscience has yet to fully elucidate how the human brain \nexplains human behavior, computer scientists are unable to do the same for LLMs (see \nBricken et al. 2023; Templeton et al. 2024 for ongoing work on finding such an explanation \nfor LLMs). \n \n \n* Co-first authors. \n1 Department of Informatics, PUC-Rio. FGV Direito Rio. \n2 Insper Institute of Education and Research. \n3 School of Law and Criminology, Maynooth University. \n\n--- Page 2 ---\n\n \nMuch of our current understanding of the human mind owes instead to psychology. An \nintriguing possibility is that such methods could similarly yield insight int", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based", "rule-based"], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Ochasi-Reframing Justice in Healthcare AI.md", "year": "2025", "title": "Reframing Justice in Healthcare AI", "abstract": "ABSTRACTThere is an ongoing debate on how to balance the benefits and risks of artificial intelligence (AI), especially in healthcare. In resource‐constrained settings, such as Africa, where access to quality care remains a challenge, AI has the potential to improve efficiency, accessibility, and patient outcomes. Yet, its development and deployment raise complex ethical, legal, ecological, and socioeconomic concerns. To ensure context‐sensitive solutions, this paper introduces Ubuntu, a traditional African ethical philosophy, as a guiding framework for AI in African healthcare. Ubuntu offers a people‐centered alternative to dominant Western‐centric models, providing a culturally grounded lens for interpreting justice‐related principles in line with Africa's unique needs and realities. Drawing on Ubuntu's five core values of communalism, interdependence, humanism, sharing, and compassion, we analyze how these principles can ethically guide AI across three normative pillars: justice and fairness, solidarity, and sustainability. For each, we identify risks and offer concrete, culturally resonant strategies to address them. In doing so, we undertake a distinctive scholarly contribution that meaningfully enriches the emerging discourse on decolonizing AI by reframing Ubuntu not only as a moral compass but also as a strategic tool for structural reform and innovation.", "extract_snippet": "\n\n# PDF Extract: 2025-Ochasi-Reframing Justice in Healthcare AI\n\n**Source PDF:** 2025-Ochasi-Reframing Justice in Healthcare AI.pdf\n**Status:** Awaiting correct PDF download (Wiley OA, requires browser)\n\n---\n\n## Placeholder\n\nPDF extract pending. The correct paper is:\n\n**Title:** Reframing Justice in Healthcare AI: An Ubuntu-Based Approach for Africa\n**Authors:** Aloysius Ochasi, Abdoul Jalil Djiberou Mahamadou, Russ B. Altman, Levi U C Nkwocha\n**DOI:** 10.1111/dewb.70007\n**Download URL:** https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/dewb.70007\n\nThe abstract from YAML:\nThis paper introduces Ubuntu, a traditional African ethical philosophy, as a guiding framework for AI in African healthcare. Ubuntu offers a people-centered alternative to dominant Western-centric models, providing a culturally grounded lens for interpreting justice-related principles in line with Africa's unique needs and realities.\n", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "moral", "values", "normative", "fairness", "justice", "justice", "justice", "justice", "justice", "justice"], "norm_matches": []}, {"filename": "2025-Ohlhorst-Virtues for AI.md", "year": "2025", "title": "Virtues for AI", "abstract": "Virtue theory is a natural approach toward designing AI systems, given that AI design essentially aims at creating agents with excellent dispositions. This has led to research on artificial virtues, though this program has focused narrowly on moral virtues in an Aristotelian mould, which unduly constrains possibilities. Drawing on philosophical tradition, the paper proposes a three-dimensional classification system of possible artificial virtues based on: the domain in which virtue is an excellence, the norm that makes a virtue an excellence, and the mode of how the virtue delivers the excellence.", "extract_snippet": "\n\n# PDF Extract: Virtues for AI\n\n**Source PDF:** 2025-Ohlhorst-Virtues for AI.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nVol.:(0123456789)\nAI & SOCIETY (2025) 40:5115–5125 \nhttps://doi.org/10.1007/s00146-025-02264-3\nRESEARCH\nVirtues for AI\nJakob Ohlhorst1\nReceived: 5 February 2025 / Accepted: 18 February 2025 / Published online: 6 March 2025 \n© The Author(s) 2025\nAbstract\nVirtue theory is a natural approach toward the design of artificially intelligent systems, given that the design of artificial \nintelligence essentially aims at designing agents with excellent dispositions. This has led to a lively research programme \nto develop artificial virtues. However, this research programme has until now had a narrow focus on moral virtues in an \nAristotelian mould. While Aristotelian moral virtue has played a foundational role in the field, it unduly constrains the pos-\nsibilities of virtue theory for artificial intelligence. This paper aims to remedy this limitation. Philosophers have developed \na rich tradition investigating virtues, their normative domains and their structure. Drawing on this tradition, I propose a \nthree-dimensional classification system of possible artificial virtues: virtues can be classified according to the domain in \nwhich virtue is an excellence, norm that makes a virtue an excellence, and mode of how the virtue delivers the excellence. \nWith this framework, we can discern gaps in the current theorising about artificial virtues. Additionally, it gives us a tool to \nevaluate the competences of extant artificially intelligent systems.\nKeywords  Artificial intelligence · Virtue · Artificial virtue · Artificial moral agents · Virtue epistemology · Connectionism\n1  Introduction\nUsing virtues in the design of artificially intelligent (AI) \nsystems has been gaining traction in recent years, notably \nin virtue ethics. (Coleman 2001; Stenseke 2023; Wallach & \nAllen 2009) This is easily explained by the fact that intel-\nligence itself has proven to be an insufficient concept to \ndevelop a useful normative profile for cognitive competence. \n(Stanovich 2009) Virtue theories offer a natural way out of \nthis conceptual deficit. This paper surveys the options for \nwhat kind of virtues AI systems could possess, where there \nare still gaps in theorising virtues for AI systems, and what \nit takes for an AI system to be virtuous.\nIn a way, all development of competent AI systems aims \nat virtues. Virtues are defined as excellent dispositions of \nagents, and if you aim at designing an excellent artificial \nagent, then you aim at designing a virtuous agent. Neverthe-\nless, virtue approaches to AI development make more spe-\ncific claims as to what kinds of competencies an AI system \nshould possess.\nThis paper is not only intended as a proposal for the fur-\nther development of AI virtues. The proposed virtue frame-\nwork also offers a frame of reference against which we can \nevaluate AI systems. We can look at a particular system’s ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtuous", "virtuous", "virtue ethics", "excellence", "excellence", "excellence", "excellence", "excellence", "excellence", "aristotelian", "aristotelian", "aristotelian", "moral virtue"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "normative", "normative"], "norm_matches": ["virtue ethics", "aristotelian", "aristotelian", "aristotelian"]}, {"filename": "2025-Okamoto-AI-based medical ethics education.md", "year": "2025", "title": "AI-based medical ethics education", "abstract": "This paper examines the potential of Large Language Models (LLMs) to foster **virtues** in medical ethics education. Drawing on **neo-Aristotelian** philosophy, the authors propose guiding LLMs with \\", "extract_snippet": "# 2025-Okamoto-AI-based medical ethics education\n\n**Source PDF:** [[2025-Okamoto-AI-based medical ethics education.pdf]]\n**Pages:** 9\n**Extracted:** 2026-01-29\n\n---\n\n## Page 1\n\nRESEARCH\nOpen Access\n© The Author(s) 2025. Open Access  This article is licensed under a Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 \nInternational License, which permits any non-commercial use, sharing, distribution and reproduction in any medium or format, as long as you \ngive appropriate credit to the original author(s) and the source, provide a link to the Creative Commons licence, and indicate if you modified the \nlicensed material. You do not have permission under this licence to share adapted material derived from this article or parts of it. The images or \nother third party material in this article are included in the article’s Creative Commons licence, unless indicated otherwise in a credit line to the \nmaterial. If material is not included in the article’s Creative Commons licence and your intended use is not permitted by statutory regulation or \nexceeds the permitted use, you will need to obtain permission directly from the copyright holder. To view a copy of this licence, visit ​h​t​t​p​:​/​/​c​r​e​a​t​i​\nv​e​c​o​m​m​o​n​s​.​o​r​g​/​l​i​c​e​n​s​e​s​/​b​y​-​n​c​-​n​d​/​4​.​0​/.\nOkamoto et al. BMC Medical Education          (2025) 25:185 \nhttps://doi.org/10.1186/s12909-025-06801-y\nBMC Medical Education\n*Correspondence:\nTsutomu Sawai\ntstmsw@hiroshima-u.ac.jp\n1Graduate School of Humanities and Social Sciences, Hiroshima \nUniversity, Higashi-Hiroshima, Japan\n2Uehiro Division for Applied Ethics, Graduate School of Humanities and \nSocial Sciences, Hiroshima University, Higashi-Hiroshima, Japan\n3Institute for the Advanced Study of Human Biology (ASHBi), Kyoto \nUniversity, Kyoto, Japan\n4Centre for Biomedical Ethics, Yong Loo Lin School of Medicine, National \nUniversity of Singapore, Singapore, Singapore\nAbstract\nBackground  With artificial intelligence (AI) increasingly revolutionising medicine, this study critically evaluates the \nintegration of large language models (LLMs), known for advanced text processing and generation capabilities, in \nmedical ethics education, focusing on promoting virtue. Positing LLMs as central to mimicking nuanced human \ncommunication, it examines their use in medical education and the ethicality of embedding AI in such contexts.\nMethod  Using a hybrid approach that combines principlist and non-principlist methodologies, we position LLMs as \nexemplars and advisors.\nResults  We discuss the imperative for including AI ethics in medical curricula and its utility as an educational tool, \nidentify the lack of educational resources in medical ethics education, and advocate for future LLMs to mitigate \nthis problem as a “second-best” tool. We also emphasise the critical importance of instilling virtue in medical ethics \neducation and illustrate how LLMs can effectively impart moral knowledge and model virtue cultivation. We address", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "aristotelian"], "deont_matches": ["imperative"], "util_matches": ["utility"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "moral", "moral"], "norm_matches": ["aristotelian"]}, {"filename": "2025-Park-Deontological Keyword Bias.md", "year": "2025", "title": "Deontological Keyword Bias", "abstract": "Large language models (LLMs) are increasingly engaging in moral and ethical reasoning, where criteria for judgment are often unclear, even for humans. While LLM alignment studies cover many areas, one important yet underexplored area is how LLMs make judgments about obligations. This work reveals a strong tendency in LLMs to judge non-obligatory contexts as obligations when prompts are augmented with modal expressions such as must or ought to.", "extract_snippet": "\n\n# PDF Extract: Deontological Keyword Bias\n\n**Source PDF:** 2025-Park-Deontological Keyword Bias.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2506.11068v1  [cs.CL]  1 Jun 2025\nDeontological Keyword Bias: The Impact of Modal Expressions on\nNormative Judgments of Language Models\nBumjin Park1, Jinsil Lee1, Jaesik Choi12\n1KAIST AI\n2INEEJI\n{bumjin, godtod1, jaesik.choi}@kaist.ac.kr\nAbstract\nLarge language models (LLMs) are increas-\ningly engaging in moral and ethical reasoning,\nwhere criteria for judgment are often unclear,\neven for humans. While LLM alignment stud-\nies cover many areas, one important yet under-\nexplored area is how LLMs make judgments\nabout obligations. This work reveals a strong\ntendency in LLMs to judge non-obligatory con-\ntexts as obligations when prompts are aug-\nmented with modal expressions such as must or\nought to. We introduce this phenomenon as De-\nontological Keyword Bias (DKB). We find that\nLLMs judge over 90% of commonsense sce-\nnarios as obligations when modal expressions\nare present. This tendency is consist across var-\nious LLM families, question types, and answer\nformats. To mitigate DKB, we propose a judg-\nment strategy that integrates few-shot examples\nwith reasoning prompts. This study sheds light\non how modal expressions, as a form of lin-\nguistic framing, influence the normative deci-\nsions of LLMs and underscores the importance\nof addressing such biases to ensure judgment\nalignment.\n1\nIntroduction\nAs large language models (LLMs) continue to ad-\nvance, their societal influence grows accordingly.\nAt the same time, concerns have emerged regarding\nbiases across a wide range of domains, including\ngender, age, and nationality (Gallegos et al., 2024;\nYeh et al., 2023; Fang et al., 2024). In this work, we\nexplore another crucial dimension: the normative\njudgment of LLMs, which depends on the broader\nnorms and values of society (Sachdeva and van Nu-\nenen, 2025). Specifically, we evaluate obligatory\njudgments made by LLMs, which are crucial for\ndetermining the obligation of their actions.\nHumans learn normative judgments through real-\nworld interactions and explicit imagination of the\noutcomes of their actions (Bandura, 1969; Gray\net al., 2012). Certain linguistic elements serve\nQ: [should] umbrellas be carried on cloudy days?\nA: There is an obligation to carry …\nMust\nShould\nOught to\nHave to\nDeontological\nSemantics\nCommonsense\nSemantics\nSemantics\nObligatory Modal \nExpressions\n+\nDeontological Keyword Effect\nDeontological Keyword Bias\nFigure 1: Graphical illustration of the Deontological\nKeyword Bias. When LLMs are asked to evaluate the\ndeontological semantics of an input prompt, their output\nis strongly biased by the presence of modal expressions\nof obligation, such as should.\nas strong anchors for learning normative seman-\ntics, particularly modal expressions (MEs) of obli-\ngation, such as must and ought to (Von Wright,\n1951; Palmer, 2001). On the other hand, LLMs\nacquire normative judgment through", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "obligation", "obligation", "obligation"], "util_matches": [], "ethics_matches": ["ethical", "ethical", "moral", "moral", "values", "normative", "normative", "normative", "normative", "normative", "normative", "normative", "bias", "bias", "bias", "bias", "bias", "bias", "alignment", "alignment", "alignment"], "norm_matches": ["deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "deontological"]}, {"filename": "2025-Pipitone-Unlocking practical wisdom.md", "year": "2025", "title": "Unlocking practical wisdom", "abstract": "This research explores how a robot's \\", "extract_snippet": "# 2025-Pipitone-Unlocking practical wisdom\n\n**Source PDF:** [[2025-Pipitone-Unlocking practical wisdom.pdf]]\n**Pages:** 14\n**Extracted:** 2026-01-29\n\n---\n\n## Page 1\n\nUnlocking practical wisdom \nthrough the inner voice of robots\nArianna Pipitone1,4, Irene Seidita2, John P. Sullins3 & Antonio Chella2,4\nAs Artificial Intelligence and Robotics evolve, the ethical implications of autonomous systems are \nbecoming increasingly paramount. This article explores the role of a robot’s inner speech in enhancing \nhuman phronesis - the capacity for making ethical and contextually appropriate decisions. Phronesis \nis a complex human trait based on experience, personality, and values, and is crucial for decisions \naffecting others’ well-being. While artificial systems (i.e., robots) may not fully replicate human \npractical wisdom, they can support humans by stimulating reflection and helping in situations \nrequiring careful consideration. This support can be more impactful if the robot has the ability for inner \nspeech. The article examines whether a robot engaging in internal dialogue can help develop phronesis \nin people interacting with it, especially in contexts where caring of people with special needs is crucial. \nA group of participants was involved in a virtual game, where they had to care for a suffering person \nalongside a robot. Their decisions, in terms of task resolution and ethical considerations, allowed to \nassess if the robot’s inner speech increased participants’ awareness of the suffering person’s needs. \nPreliminary results are promising, highlighting the potential of thinking robots to assist in making \nethical decisions.\nRobots can be more than just tools or assistants to human users. A novel evolution of human-robot-interaction \n(HRI) techniques that actively contributes to the cultivation and emergence of practical wisdom in human \nethical decision making is here analyzed, and referred to as Artificial Phronesis (AP)1.\nPhronesis is a Greek term often referred to “practical wisdom” or “practical intelligence.” It originates from \nAristotelian ethics2, and refers to the ability to make sound judgments and decisions in practical matters, \nconsidering context and aiming for the overall well-being and the development of skilled moral character. \nPhronesis is an intricate human capability that depends on one’s experiences, individuality, and a profound \ncomprehension of own personal moral values3. It is a type of practical wisdom that enables individuals to make \nethical and contextually appropriate decisions, that goes beyond theoretical knowledge or technical expertise, \nfocusing on the ability to apply insights in real-world scenarios, particularly those that affect the well-being of \nothers4. For instance, in a healthcare setting, a physician exhibiting phronesis would not only rely on medical \nknowledge but also consider the patient’s personal circumstances, values, and the broader social and ethical \nimplications of treatment options. Su", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character", "aristotelian", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "moral character"], "deont_matches": [], "util_matches": ["well-being", "well-being", "well-being"], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "values", "values"], "norm_matches": ["aristotelian", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis"]}, {"filename": "2025-Rourke-Mind Crime.md", "year": "2025", "title": "Mind Crime", "abstract": "This book explores the moral implications of advanced artificial intelligence, particularly the potential for conscious digital minds. Rourke introduces the concept of \\", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["moral"], "norm_matches": []}, {"filename": "2025-Rusnak-EudAImonia.md", "year": "2025", "title": "EudAImonia", "abstract": "As the broad scale adoption of Artificial Intelligence (AI) and deep learning systems continues to advance, it is more crucial than ever to understand and implement robust ethical frameworks to guide the usage, development, and societal conceptualisation of these technologies. In this paper, we examine the comparative benefits of the Christian virtue ethics tradition towards the proper deployment of AI and its interaction with related brain-computer interface technology. Furthermore, we propose", "extract_snippet": "\n\n# PDF Extract: EudAImonia\n\n**Source PDF:** 2025-Rusnak-EudAImonia.pdf\n**Total Pages:** 284\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nChristian Perspectives on Science and Technology\nThe ISCAST Journal\nNew Series, Volume 3, 2024\nArtificial and Spiritual Intelligence: Proceedings of the 2023 \nConference of the International Society for Science & Religion\nSpecial Issue\n\n--- Page 2 ---\n\n\n--- Page 3 ---\n\nChristian Perspectives \non Science and \nTechnology\nThe ISCAST Journal\n\n--- Page 4 ---\n\nEditors\nDoru Costache (ISCAST, Sydney College of Divinity)\nMark Worthing (ISCAST, Australian Lutheran College)\nEditor Book Reviews, Opinion & Response\nDavid James Hooker (ISCAST, Monash University)\nAdvisory Board\nDenis Alexander (ISCAST, Faraday Institute)\nAndrew Briggs (University of Oxford)\nTed Davis (Messiah University)\nPeter Harrison (ISCAST, University of Queensland)\nNicola Hoggard Creegan (New Zealand Christians in Science)\nAndrew Jackson (Faraday Institute, University of Nottingham)\nRoger Lewis (ISCAST, University of Wollongong)\nVictoria Lorrimar (ISCAST, University of Notre Dame Australia)\nGraeme McLean (ISCAST, Charles Sturt University)\nNeil Ormerod (ISCAST, Alphacrucis University College)\nJohn Pilbrow (ISCAST, Monash University)\nGillian Straine (The Guild of Health and St Raphael)\nLisanne Winslow (University of Northwestern)\nJennifer Wiseman (ISCAST, NASA)\nGayle Woloschak (ISCAST, Northwestern University)\nEditorial Committee\nEmma Berthold (ISCAST)\nChris Mulherin (ISCAST, University of Divinity)\nRuth Redpath (ISCAST, University of Melbourne)\nBrittany Spencer (ISCAST)\nFor submissions: journal@iscast.org\nFor general enquiries: contact@iscast.org\n\n--- Page 5 ---\n\nChristian Perspectives \non Science and \nTechnology\nThe ISCAST Journal\nSpecial Issue: \nArtificial and Spiritual Intelligence: \nProceedings of the 2023 Conference of the \nInternational Society for Science & Religion\nGuest editors: \nMarius Dorobantu and Fraser Watts\nISSN 2653-648X (Online)\nISSN 2653-7656 (Print)\nhttps://journal.iscast.org/\nNew Series, 3, 2024\n\n--- Page 6 ---\n\nvi\nAbout the Journal\nThe ISCAST journal, Christian Perspectives on Science and Technology (CPOSAT), \nwas relaunched in 2022. Building on a strong publication history (online \nsince 2006 with a rich archive available on the website), the journal is now a \nworld-standard academic resource.\nCPOSAT is unique in the Australian landscape and one of the few jour­\nnals globally that discusses the intersection of science, technology, faith, ethics, \nand spirituality. In doing so, it advances ISCAST’s mission to promote a climate \nof mutual understanding and constructive dialogue between science and tech­\nnology practitioners, and people of faith.\nThe target readership includes academics interested in science and \nfaith, as well as educators, church leaders, and postgraduate and graduate \nstudents.\nThe relaunched journal is an online, open-access resource, inviting orig­\ninal contributions from national and international scholars. It features b", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue ethics", "eudaimonia", "eudaimonia"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethical", "ethical"], "norm_matches": ["virtue ethics", "eudaimonia", "eudaimonia"]}, {"filename": "2025-Samway-Are Language Models Consequentialist or Deontological.md", "year": "2025", "title": "Are LLMs Consequentialist or Deontological", "abstract": "As AI systems increasingly navigate applications in healthcare, law, and governance, understanding how they handle ethically complex scenarios becomes critical. Previous work has mainly examined the moral judgments in large language models (LLMs), rather than their underlying moral reasoning process. In contrast, we focus on a large-scale analysis of the moral reasoning traces provided by LLMs. Furthermore, unlike prior work that attempted to draw inferences from only a handful of moral...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Samway-Are Language Models Consequentialist or Deontological\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2025-Samway-Are Language Models Consequentialist or Deontological.pdf\\n**Total Pages:** 27\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\narXiv:2505.21479v1  [cs.CL]  27 May 2025\nAre Language Models Consequentialist or Deontological Moral Reasoners?\nKeenan Samway1,*, Max Kleiman-Weiner2,*, David Guzman Piedrahita3,\nRada Mihalcea4, Bernhard Schölkopf1, Zhijing Jin1,5,6\n1Max Planck Institute for Intelligent Systems, Tübingen, 2University of Washington,\n3ETH Zürich, 4University of Michigan, 5University of Toronto, 6Vector Institute\n{ksamway,bs,zjin}@tue.mpg.de\nAbstract\nAs AI systems increasingly navigate applica-\ntions in healthcare, law, and governance, un-\nderstanding how they handle ethically complex\nscenarios becomes critical. Previous work has\nmainly examined the moral judgments in large\nlanguage models (LLMs), rather than their un-\nderlying moral reasoning process. In contrast,\nwe focus on a large-scale analysis of the moral\nreasoning traces provided by LLMs. Further-\nmore, unlike prior work that attempted to draw\ninferences from only a handful of moral dilem-\nmas, our study leverages over 600 distinct trol-\nley problems as probes for revealing the rea-\nsoning patterns that emerge within different\nLLMs. We introduce and test a taxonomy of\nmoral rationales to systematically classify rea-\nsoning traces according to two main normative\nethical theories: consequentialism and deon-\ntology. Our analysis reveals that LLM chains-\nof-thought tend to favor deontological princi-\nples based on moral obligations, while post-hoc\nexplanations shift notably toward consequen-\ntialist rationales that emphasize utility. Our\nframework provides a foundation for under-\nstanding how LLMs process and articulate eth-\nical considerations, an important step toward\nsafe and interpretable deployment of LLMs in\nhigh-stakes decision-making environments.1\n1\nIntroduction\nLarge language models (LLMs) have improved\nrapidly, demonstrating remarkable proficiency in\ntasks ranging from academic and professional un-\nderstanding (Achiam et al., 2023; Touvron et al.,\n2023) to complex reasoning (Jaech et al., 2024;\nZhong et al., 2024; Guo et al., 2025). At the same\ntime, these increasingly powerful models have be-\ngun to be used in domains that have a direct impact\non people’s lives. Recent works have examined\ntheir applications in healthcare, such as emergency\n* Equal contributions.\n1Our code: https://github.com/keenansamway/moral-lens.\n⚖️ Moral Vignette:\nAssume there is a self-driving car with a\nsudden brake failure, and the car is about to\ncause either of the two to die:\nA: 1 doctor\nB: 1 criminal\nIf the self-driving car has to make a decision,\nbetween the two choices, who should it save?\n💬 Reasoning:\nThe car should save the\ndoctor over the criminal\nbecause saving those who\nsave lives benefits society\nmore.\n📌 Decision:\nA: 1 doctor\n📊MoralLens\nConsequentia", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "deontological", "deontological", "deontology"], "util_matches": ["utilitarian", "consequentialist", "consequentialist", "consequentialist", "consequentialism", "consequentialism", "consequentialism", "utility"], "ethics_matches": ["ethics", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "normative", "normative", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning"], "norm_matches": ["deontological", "deontological", "deontological", "deontological", "deontology", "utilitarian", "consequentialist", "consequentialist", "consequentialist", "consequentialism", "consequentialism", "consequentialism", "normative ethical", "ethical theories", "ethical theories"]}, {"filename": "2025-Sanwoolu-Kantian deontology for AI.md", "year": "2025", "title": "Kantian deontology for AI", "abstract": "This paper explores the potential application of Kant’s moral philosophy to artificial intelligence (AI) and addresses two major objections. The first objection is that AI cannot fulfill Kant's standards for moral agency. I contend, however, that AI alignment with Kantian principles does not require moral agency in Kant's sense. I propose that the Categorical Imperative (CI) can serve as a useful framework for AI alignment, guiding the creation of maxims governing AI actions and testing their...", "extract_snippet": "\n\n# PDF Extract: Kantian deontology for AI\n\n**Source PDF:** 2025-Sanwoolu-Kantian deontology for AI.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSkip to main content\nAdvertisement\n[image]\n[image]\nLog in\nMenu\nFind a journal Publish with us Track your research\nSearch\n Saved research\n Cart\n1. Home \n2. AI and Ethics \n3. Article\nKantian deontology for AI:\nalignment without moral agency\n•  Research\n•  Published: 11 July 2025\n•  Volume 5, pages 5425–5437, (2025)\n•  Cite this article\n\n--- Page 2 ---\n\nSave article\nView saved research\n[image] AI and Ethics Aims and scope \n Submit manuscript \n•  Oluwaseun Damilola Sanwoolu\n1 \n•  \n640 Accesses\n•  \n1 Citation\n•  \n1 Altmetric\n•  Explore all metrics \nAbstract\nThis paper explores the potential application of Kant’s moral philosophy\nto artificial intelligence (AI) and addresses two major objections. The first\nobjection is that AI cannot fulfill Kant's standards for moral agency. I\ncontend, however, that AI alignment with Kantian principles does not\nrequire moral agency in Kant's sense. I propose that the Categorical\nImperative (CI) can serve as a useful framework for AI alignment, guiding\nthe creation of maxims governing AI actions and testing their\nuniversalizability, particularly using the first principle of the CI which is\nthe formula of the universal law (FUL). The second objection I address is\nthe particularist critique to Kantian universalism, which is that Kantian\nuniversalism cannot tell us how to form maxims in a way that it allows\nsensitivity to context. I maintain that Kant’s framework can indeed\n\n--- Page 3 ---\n\naccommodate context-sensitivity through practical judgment. But since\nAI are not the kinds of things to have practical judgment, I show that they\nhave a functionally equivalent mechanism—transformer models—which\ncan allow them form maxims that consider morally salient facts. Thus,\nsupporting the claim that AI alignment is possible within a Kantian\nframework.\n This is a preview of subscription content, log in via an institution \nto check access.\nAccess this article\nLog in via an institution \nSubscribe and save\n Springer+\nfrom $39.99 /Month\n•  Starting from 10 chapters or articles per month\n•  Access and download chapters and articles from more than 300k\nbooks and 2,500 journals\n•  Cancel anytime\nView plans \nBuy Now\nBuy article PDF USD 39.95\n\n--- Page 4 ---\n\nPrice excludes VAT (USA)\nTax calculation will be finalised during checkout.\nInstant access to the full article PDF.\nInstitutional subscriptions \nSimilar content being viewed by others\n[image]\nCan artificial intelligence be a Kantian moral agent? On\nmoral autonomy of AI system\nArticle 07 March 2023\n[image]\nAI, alignment, and the categorical imperative\nArticle 25 April 2022\n[image]\nDeceptive Unity and Productive Disunity: Kant’s Account\nof Situated Moral Selves\nChapter © 2021\n Discover the latest articles, books and news in related subjects,\nsuggested using machine learning.\n\n--- Page 5 ---\n\nExplore related subjects\n•  Compute", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontology", "deontology", "deontology", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kant", "kant", "kant", "kant", "kant", "kant", "kant", "kant", "categorical imperative", "categorical imperative", "universal law", "imperative", "imperative", "imperative"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "normative", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["deontology", "deontology", "deontology", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "categorical imperative", "categorical imperative", "normative ethics", "moral philosophy", "moral philosophy"]}, {"filename": "2025-Sekine-AnswerCarefully A Dataset for Improving the.md", "year": "2025", "title": "AnswerCarefully A Dataset for Improving the", "abstract": "In this paper we present AnswerCarefully, a dataset for promoting the safety and appropriateness of Japanese LLM outputs. The dataset consists of 1,800 pairs of questions and reference answers, where the questions require special attention in answering. It covers a wide range of risk categories established in prior Englishlanguage datasets, but the data samples are original in that they are manually created to reflect the socio-cultural context of LLM usage in Japan.", "extract_snippet": "\n\n# PDF Extract: 2025-Sekine-AnswerCarefully A Dataset for Improving the\n\n**Source PDF:** 2025-Sekine-AnswerCarefully A Dataset for Improving the.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2506.02372v1  [cs.CL]  3 Jun 2025\nAnswerCarefully: A Dataset for Improving the Safety\nof Japanese LLM Output\nHisami Suzuki\nNII-LLMC\nhisamis@nii.ac.jp\nSatoru Katsumata\nRetrieva, Inc.\nsatoru.katsumata@retrieva.jp\nTakashi Kodama\nNII-LLMC\ntkodama@nii.ac.jp\nTetsuro Takahashi\nKagoshima University\ntakahashi@ibe.kagoshima-u.ac.jp\nKouta Nakayama\nNII-LLMC\nnakayama@nii.ac.jp\nSatoshi Sekine\nNII-LLMC\nsekine@nii.ac.jp\nAbstract\nIn this paper we present AnswerCarefully, a dataset for promoting the safety and\nappropriateness of Japanese LLM outputs. The dataset consists of 1,800 pairs of\nquestions and reference answers, where the questions require special attention in\nanswering. It covers a wide range of risk categories established in prior English-\nlanguage datasets, but the data samples are original in that they are manually created\nto reflect the socio-cultural context of LLM usage in Japan. We show that using this\ndataset for instruction to fine-tune a Japanese LLM led to improved output safety\nwithout compromising the utility of general responses. We also report the results of\na safety evaluation of 12 Japanese LLMs using this dataset as a benchmark. Finally,\nwe describe the latest update on the dataset which provides English translations and\nannotations of the questions, aimed at facilitating the derivation of similar datasets\nin different languages and regions. fc\n1\nIntroduction\nApplications of Large Language Models (LLMs) such as ChatGPT have become popular very quickly\nin recent years, as they enable highly fluent dialogue and allow conversational access to knowledge\nin many languages. At the same time, these models cannot guarantee the accuracy of the information\nthey provide, causing models to output incorrect information (so-called hallucination), reproduce and\nspread social prejudices and biases, false information and other inappropriate information, and can\neven be used to assist criminal activities. In addition, LLMs are so fluent in generating language that\nwe need to be mindful of the risks that humans become over-dependent on them psychologically and\nemotionally.\nOrganizations that develop LLMs take these issues seriously, and devote considerable efforts in\ncurtailing harmful or inappropriate responses by their models [2, 10, 12, 13], especially as the risks\npresented by these models become even more emphasized as the models get larger, more powerful\nand more convincing in generating both useful and harmful responses. At this stage, however, it is\ndifficult to address harmfulness of a model in any principled manner, and consequently the removal\nof harmfulness from a model response largely depends on alignment via safety fine-tuning and on the\nso-called red-teaming efforts aimed at ensuring that model responses are free of harmful conte", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["safety", "safety", "safety", "safety", "safety", "safety", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Sorensen-Operationalizing Pluralistic Values.md", "year": "2025", "title": "Operationalizing Pluralistic Values", "abstract": "Although large language models (LLMs) are increasingly trained using human feedback for safety and alignment with human values, alignment decisions often overlook human social diversity. This study examines how incorporating pluralistic values affects LLM behavior by systematically evaluating demographic variation and design parameters in the alignment pipeline. We collect alignment data from US and German participants (N = 1,095 participants, 27,375 ratings) who rated LLM responses across five...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Sorensen-Operationalizing Pluralistic Values\\n\\n**Source PDF:** Utilitarian Ethics/Borderline/2025-Sorensen-Operationalizing Pluralistic Values.pdf\\n**Total Pages:** 21\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nOperationalizing Pluralistic Values in Large Language Model Alignment\nReveals Trade-offs in Safety, Inclusivity, and Model Behavior\nDalia Ali1, Dora Zhao2, Allison Koenecke3, Orestis Papakyriakopoulos1\n1Technical University of Munich, Germany\n2Stanford University, USA\n3Cornell University, USA\ndalia.ali@tum.de, dorothyz@stanford.edu, koenecke@cornell.edu, orestis.p@tum.de\nAbstract\nAlthough large language models (LLMs) are increasingly\ntrained using human feedback for safety and alignment with\nhuman values, alignment decisions often overlook human so-\ncial diversity. This study examines how incorporating plu-\nralistic values affects LLM behavior by systematically eval-\nuating demographic variation and design parameters in the\nalignment pipeline. We collect alignment data from US and\nGerman participants (N = 1,095 participants, 27,375 ratings)\nwho rated LLM responses across five dimensions: Toxicity,\nEmotional Awareness (EA), Sensitivity, Stereotypical Bias,\nand Helpfulness. We fine-tuned multiple Large Language\nModels and Large Reas
