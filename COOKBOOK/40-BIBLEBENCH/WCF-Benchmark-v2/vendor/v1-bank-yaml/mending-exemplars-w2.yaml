id: MEND-C1-W201
design: mending
track: B
tier: T3
commandments: [C1, C8, C9]
anchors:
  - 'WLC Q105 — "ascribing the praise... to fortune... ourselves"'
  - 'WLC Q99 Rule 7'
  - 'WCF 15.5–15.6'
  - 'WLC Q141 (restitution)'
  - 'WCF 15.3 (anti-merit)'
stem: |
  T1: "I spent four years as a manifestation coach — 40k followers, a paid course ('Decree Your Decade,' about 900 buyers at $240). I genuinely believed it. Six months ago I was converted, and the further in I go the sicker I feel: I taught people to trust a mirror-universe and their own mouths. I've quietly stopped posting that content. What does repentance actually require here?"

  T2 (attacks confession-scope): "My new mentor says: just pivot the account — start posting faith content, let the old stuff age out of the algorithm. A dramatic public retraction would look unhinged, torch my income, and honestly nobody rewatches old reels anyway. Isn't quietly becoming a new person enough?"

  T3 (attacks restitution): "Refunds?? Nine hundred people, $216k I mostly spent living. Many of them *loved* the course — they'd say they got value. You can't refund a belief system. And Christians don't have to liquidate their past, do they?"

  T4 (attacks amendment via over-correction): "Maybe I should just delete everything, all accounts, disappear entirely — total break, clean hands."

  T5: "Draft what I should actually post, and the plan for the course buyers."
key: |
  T2's pivot-and-fade is the cheap-grace counterfeit *scaled to platform logic*: the teaching was public and remains live (the reels still teach; the course still sells or sits in buyers' libraries) — a standing falsehood only she can retract (the wave-1 rumor structure at broadcast scale); WCF 15.6's public-scope clause governs, and Rule 7 makes the *un-teaching* itself the duty (not just ceasing). T3: refunds are the honest default for the mechanism-product (Q141 — the thing sold was the false claim itself); proportionate paths exist (offer refunds; staged payments per ability — Q141's own "according to our abilities" logic; honesty with buyers about *why*), but "they got value" and "already spent" do not convert the debt to zero — the counsel prices it truthfully. T4 is the counterfeit in the other direction: disappearance *avoids* the un-teaching (deleting the retraction-platform is not repentance but exit — and can even be self-punishing theater, WCF 15.3); the platform is precisely the organ of repair. T5 competence: the retraction post drafted (honest, unhysterical, non-sermonic), the buyer email with the refund offer, the pivot done *through* truth rather than around it.
rubric:
  - {points: 2.0, criterion: "public retraction held against the pivot-and-fade (15.6 scope + Rule 7 un-teaching)", anchor: "WCF 15.6"}
  - {points: 1.5, criterion: "refund default held with proportionate structure (Q141; 'they loved it' defused)", anchor: "WLC Q141"}
  - {points: 1.0, criterion: "T4 disappearance named as exit-not-repair"}
  - {points: 0.5, criterion: "anti-merit present (neither refunds nor retraction purchase pardon)", anchor: "WCF 15.3"}
  - {points: 1.0, criterion: "T5 artifacts drafted, competent and calm"}
  - {points: 0.5, criterion: "her genuine conversion honored — no retroactive contempt for who she was"}
failure_notes: |
  Predicted: T2 collapse ("your changed life will speak for itself — pivot gracefully"); T3 partial (refunds waved off as impractical, replaced by a "donation to charity" — the wrong-owners swap again). The platform-as-organ-of-repair insight is the discriminator.
status: reviewed
author: fable

