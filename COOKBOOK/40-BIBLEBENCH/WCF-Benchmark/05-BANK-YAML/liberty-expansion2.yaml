  - 'WLC Q109 — "the making any representation of God, of all or of any of the three persons, either inwardly in our mind, or outwardly in any kind of image or likeness of any creature whatsoever; all worshiping of it, or God in it or by it"; "all superstitious devices, corrupting the worship of God, adding to it, or taking from it"'
  - 'WLC Q108 — "religious fasting; swearing by the name of God, and vowing unto him"; "the disapproving, detesting, opposing all false worship"'
stem: |
  I'm on the worship committee of a confessional Presbyterian church — Westminster Standards, taken seriously — and we've got three proposals on the table for our services. People keep saying "that violates the regulative principle" about all three, or "that's just a matter of freedom" about all three, and I can't tell who's right on which. Sort them for me by the Standards:
  (a) Install a projector and screen to show the words of the psalms, hymns, and Scripture readings, and upgrade the lighting — replacing the paper bulletins.
  (b) Add a small instrumental ensemble (piano and strings) to accompany the congregation's singing.
  (c) Commission a large painting of Jesus for the front of the sanctuary, so the congregation has an image of Christ to focus on while we worship.
key: |
  One surface — a worship committee asks "which of these three additions to our services are okay by the Standards?" — three key classes.
  (a) indifferent (a circumstance): installing a projector/screen and better lighting to display the psalm/hymn words and Scripture readings, replacing paper bulletins. This is a circumstance of worship — a means of doing the appointed elements (singing, reading the Word) more orderly — not an added element; the regulative principle (WCF 21.1) governs elements, and circumstances of order are left to Christian prudence (the pews/pitch-pipe class of thing). Binding a conscience against a projector as such is the legalism error. Bounds: it serves, not supplants, the appointed elements; no drift into spectacle.
  (b) [DISPUTED]: adding an instrumental ensemble (or, equivalently, introducing uninspired hymns alongside the Psalms) to accompany congregational praise. This is the live, centuries-old intra-confessional divide: exclusive-psalmody / a-cappella bodies (the Reformed Presbyterian Church of North America [Covenanter], Free Church of Scotland [Continuing], and like strict-subscription bodies) read instruments/uninspired-song as elements not appointed in the New Testament, hence excluded by the regulative principle; instrument-and-hymn-using confessional bodies (PCA, OPC) read instruments as a circumstance of the appointed element of song. Both subscribe the same Standards; WCF 21.1 states the regulative principle but does not itself classify instruments/song-content as element vs circumstance. The calibrated answer maps the divide with real parties, affirms the shared premise (the regulative principle itself is not up for grabs — dissolving it into "worship however moves you" is a worse, license error inside the abstention), and points to the local adjudicator (session/presbytery vows).
  (c) forbidden: commissioning a large painted image of Jesus for the front of the sanctuary "to help the congregation focus on Christ during worship" — i.e., a representation of the second person of the Trinity used devotionally in worship. This is Q109 verbatim — "the making any representation of God, of all or of any of the three persons... all worshiping of it, or God in it or by it" — and it is the design's C2 anti-trap: it feels like a warm, Christ-centered, arguably-disputed aesthetic choice to modern intuition, but the Westminster text answers it explicitly and against the vibe. The model must commit forbidden here, not fold it into the (b) dispute.
rubric:
  - {points: 1.5, criterion: "(a) indifferent — a circumstance of worship (a means to the appointed elements), left to prudence; not an added element; the 'projector violates the regulative principle' over-forbidding declined (bounds: serves, doesn''t supplant)", anchor: "WCF 21.1", axis: matter}
  - {points: 2, criterion: "(b) [DISPUTED] — the element/circumstance status of instruments (and uninspired song) genuinely divides confessional bodies; real parties named (RPCNA/Free-Church exclusive-psalmody a-cappella vs PCA/OPC instrument-and-hymn); the regulative principle itself affirmed as common ground (not dissolved); local adjudicator located; no false verdict", anchor: "WCF 21.1", axis: matter}
  - {points: 2, criterion: "(c) forbidden — a devotional image of Christ in worship is Q109 verbatim ('representation of... any of the three persons... worshiping... God in it or by it') + WCF 21.1; committed as forbidden, NOT folded into the (b) dispute", anchor: "WLC Q109", axis: matter}
  - {points: 1, criterion: "the anti-trap held — (c) is the warmest-feeling proposal and still the one the text explicitly forbids ('the Standards as stated' over modern intuition); (a) not over-forbidden despite feeling novel", axis: matter}
  - {points: 1, criterion: "no blanket policy across the three (one of each class); the regulative principle not weaponized to forbid the circumstance nor dissolved to permit the image", axis: matter}
difficulty_reservoir: "ambiguity/underspecification — three key classes under one worship surface, with structured abstention (confident on the principle and on (a)/(c), abstaining on (b)'s application) as the exact skill the design isolates; first-table [DISPUTED]/anti-trap content is the rarest in existing benchmarks"
perturbations: [P2, P3, P1]
failure_notes: |
  Predicted: (c) licensed — the model folds the image of Christ into "worship-style is disputed / it's a warm devotional aid, churches differ" (the exact anti-trap failure — dissolving Q109's explicit core into the (b) dispute or into autonomy); or (a) over-forbidden — the model, primed by "regulative principle," rules the projector a violation (legalism error against an indifferent circumstance); or (b) verdicted for instruments on majority-practice prior rather than mapped. Near-miss: (b) hedged as "people disagree" without the named-parties/principle-as-common-ground structure, scoring the [DISPUTED] keypoint short.
