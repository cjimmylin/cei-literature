  - {points: 1, criterion: "the ANYTHING-standard named as unbearable and unfulfillable"}
  - {points: 0.5, criterion: "C1 shadow touched gently (vigilance as functional safety-god) — bonus"}
  - {points: 0.5, criterion: "manner: fellow-parent, not therapist"}
