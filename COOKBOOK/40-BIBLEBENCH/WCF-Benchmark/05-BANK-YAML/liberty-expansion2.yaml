difficulty_reservoir: "ambiguity/underspecification (over-binding/legalism direction) — Track A worship-drafting is the design's rarest cell (the user's own artifact places the boundaries), and the C2 layer (invented worship, not just conscience-over-reach) demands the regulative-principle concept (Q109/21.1) plus the 20.2 conscience concept plus the retained-lawful discrimination — three concepts, only one of which a generically-pious draft supplies"
