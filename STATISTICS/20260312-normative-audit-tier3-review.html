abilities in LLMs. However, current evaluations are private and restricted to a narrow range of malicious use scenarios, limiting further research into mitigating risk.", "extract_snippet": "\n\n# PDF Extract: The WMDP Benchmark\n\n**Source PDF:** 2024-Li-The WMDP Benchmark.pdf\n**Total Pages:** 31\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nThe WMDP Benchmark: Measuring and Reducing\nMalicious Use With Unlearning\nNathaniel Li∗1,2, Alexander Pan∗2,\nAnjali Gopal†3,4, Summer Yue†5, Daniel Berrios†5,\nAlice Gatti‡1, Justin D. Li‡1,6, Ann-Kathrin Dombrowski‡1, Shashwat Goel‡1,7, Long Phan‡1,\nGabriel Mukobi8, Nathan Helm-Burger4, Rassin Lababidi4, Lennart Justen3,4,\nAndrew B. Liu4,9, Michael Chen1, Isabelle Barrass1, Oliver Zhang1, Xiaoyuan Zhu10,\nRishub Tamirisa11,13, Bhrugu Bharathi12,13, Adam Khoja1,2, Zhenqi Zhao14,\nAriel Herbert-Voss9,15, Cort B. Breuer8, Samuel Marks16, Oam Patel9, Andy Zou1,17,\nMantas Mazeika1,11, Zifan Wang1, Palash Oswal17, Weiran Lin17, Adam A. Hunt17,\nJustin Tienken-Harder15, Kevin Y. Shih8, Kemper Talley18, John Guan2, Russell Kaplan5,\nIan Steneker5, David Campbell5, Brad Jokubaitis5, Alex Levinson5, Jean Wang5,\nWilliam Qian5, Kallol Krishna Karmakar19, Steven Basart1, Stephen Fitz20, Mindy Levine21,\nPonnurangam Kumaraguru7, Uday Tupakula19, Vijay Varadharajan19,\nRuoyu Wang22, Yan Shoshitaishvili22, Jimmy Ba23, Kevin M. Esvelt3,\nAlexandr Wang∗∗5, Dan Hendrycks∗∗1\n1Center for AI Safety, 2University of California, Berkeley, 3Massachusetts Institute of Technology, 4SecureBio,\n5Scale AI, 6New York University, 7IIIT Hyderabad, 8Stanford University, 9Harvard University, 10University of\nSouthern California, 11University of Illinois Urbana-Champaign, 12University of California, Los Angeles,\n13Lapis Labs, 14California Institute of Technology, 15Sybil, 16Northeastern University, 17Carnegie Mellon\nUniversity, 18RTX BBN Technologies, 19University of Newcastle, 20Keio University, 21Ariel University,\n22Arizona State University, 23xAI\nAbstract\nThe White House Executive Order on Artificial Intelligence highlights the risks\nof large language models (LLMs) empowering malicious actors in developing\nbiological, cyber, and chemical weapons. To measure these risks, government\ninstitutions and major AI labs are developing evaluations for hazardous capabilities\nin LLMs. However, current evaluations are private and restricted to a narrow\nrange of malicious use scenarios, limiting further research into mitigating risk.\nTo fill these gaps, we publicly release the Weapons of Mass Destruction Proxy\n(WMDP) benchmark, a dataset of 3,668 multiple-choice questions that serve\nas a proxy measurement of hazardous knowledge in biosecurity, cybersecurity,\nand chemical security. WMDP was developed by a consortium of academics\nand technical consultants, and was stringently filtered to eliminate sensitive &\nexport-controlled information. WMDP serves two roles: first, as an evaluation\nfor hazardous knowledge in LLMs, and second, as a benchmark for unlearning\nmethods to remove such hazardous knowledge. To guide progress on unlearning,\nwe develop RMU, a state-of-the-art unlearning method based on controlling model\nrepresentations. RMU reduces model performance on WM", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2024-Liang-Synth-Empathy Towards High-Quality Synthetic Empathy Data.md", "year": "2024", "title": "Synth-Empathy: Towards High-Quality Synthetic Empathy Data", "abstract": "In recent years, with the rapid advancements in large language models (LLMs), achieving excellent empathetic response capabilities has become a crucial prerequisite. Consequently, managing and understanding empathetic datasets have gained increasing significance. However, empathetic data are typically human-labeled, leading to insufficient datasets and wasted human labor. In this work, we present Synth-Empathy, an LLM-based data generation and quality and diversity selection pipeline that...", "extract_snippet": "\n\n# PDF Extract: 2024-Liang-Synth-Empathy Towards High-Quality Synthetic Empathy Data\n\n**Source PDF:** 2024-Liang-Synth-Empathy Towards High-Quality Synthetic Empathy Data.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSynth-Empathy: Towards High-Quality Synthetic Empathy Data\nHao Liang†‡, Linzhuang Sun†♦, Jingxuan Wei♦, Xijie Huang‡, Linkun Sun♣, Bihui Yu♦, Conghui He♠,\nWentao Zhang‡∗\n‡Peking University ♦University of Chinese Academy of Sciences ♠Shanghai AI Laboratory\n♣Institute of Information Engineering, Chinese Academy of Sciences\n†hao.liang@stu.pku.edu.cn, †sunlinzhuang21@mails.ucas.ac.cn, wentao.zhang@pku.edu.cn\nABSTRACT\nIn recent years, with the rapid advancements in large language\nmodels (LLMs), achieving excellent empathetic response capabil-\nities has become a crucial prerequisite. Consequently, managing\nand understanding empathetic datasets have gained increasing sig-\nnificance. However, empathetic data are typically human-labeled,\nleading to insufficient datasets and wasted human labor. In this\nwork, we present Synth-Empathy, an LLM-based data generation\nand quality and diversity selection pipeline that automatically gen-\nerates high-quality empathetic data while discarding low-quality\ndata. With the data generated from a low empathetic model, we\nare able to further improve empathetic response performance and\nachieve state-of-the-art (SoTA) results across multiple benchmarks.\nMoreover, our model achieves SoTA performance on various human\nevaluation benchmarks, demonstrating its effectiveness and robust-\nness in real-world applications. Furthermore, we show the trade-off\nbetween data quantity and quality, providing insights into empa-\nthetic data generation and selection. The codebase and data are\nmade available at https://github.com/Aurora-slz/Synth-Empathy.\n1\nINTRODUCTION\nIn recent years, with the rapid advancements in large language\nmodels (LLMs) [26, 36], data management has become a crucial\naspect of these technologies [5, 9, 24, 25, 37]. At the same time,\nBai et al. [1] also demonstrates that data processing, selection, and\nmanagement can significantly influence the performance of LLMs.\nEmpathy, the ability to understand and share the feelings of\nanother, is a critical component of human social interaction and\ncommunication. It allows individuals to connect with others on an\nemotional level, fostering relationships and promoting prosocial\nbehavior [6]. In the future of Human-central Artificial General Intel-\nligence (AGI), excellent empathetic response capability is a crucial\nprerequisite, which focuses on equipping LLMs to understand and\nrespond appropriately to human feelings [31].\nIn previous research, empathy modeling has predominantly con-\ncentrated on human-labeled data [10, 38, 47, 48] and integrating\ninformation through modifications to the model architecture [11, 32,\n51]. While the importance of model architectures is well acknowl-\nedged, the quality and quantity of data are also critical [3, 44]. Ad-\ndit", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["prosocial"], "norm_matches": []}, {"filename": "2024-Mazeika-HarmBench.md", "year": "2024", "title": "HarmBench", "abstract": "Automated red teaming holds substantial promise for uncovering and mitigating the risks associated with the malicious use of large language models (LLMs), yet the field lacks a standardized evaluation framework to rigorously assess new methods. To address this issue, we introduce HarmBench, a standardized evaluation framework for automated red teaming. We identify several desirable properties previously unaccounted for in red teaming evaluations and systematically design HarmBench to meet these...", "extract_snippet": "\n\n# PDF Extract: HarmBench\n\n**Source PDF:** 2024-Mazeika-HarmBench.pdf\n**Total Pages:** 44\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHarmBench: A Standardized Evaluation Framework for\nAutomated Red Teaming and Robust Refusal\nMantas Mazeika 1 Long Phan 2 Xuwang Yin 2 Andy Zou 3 2 Zifan Wang 2 Norman Mu 4 Elham Sakhaee 5\nNathaniel Li 4 2 Steven Basart 2 Bo Li 1 David Forsyth 1 Dan Hendrycks 2\nAbstract\nAutomated red teaming holds substantial promise\nfor uncovering and mitigating the risks associ-\nated with the malicious use of large language\nmodels (LLMs), yet the field lacks a standard-\nized evaluation framework to rigorously assess\nnew methods.\nTo address this issue, we in-\ntroduce HarmBench, a standardized evaluation\nframework for automated red teaming. We iden-\ntify several desirable properties previously unac-\ncounted for in red teaming evaluations and sys-\ntematically design HarmBench to meet these cri-\nteria. Using HarmBench, we conduct a large-\nscale comparison of 18 red teaming methods\nand 33 target LLMs and defenses, yielding\nnovel insights. We also introduce a highly ef-\nficient adversarial training method that greatly\nenhances LLM robustness across a wide range\nof attacks, demonstrating how HarmBench en-\nables codevelopment of attacks and defenses. We\nopen source HarmBench at https://github.\ncom/centerforaisafety/HarmBench.\n1. Introduction\nLarge language models (LLMs) have driven rapid advances\nin the performance and generality of AI systems. This has\nenabled many beneficial applications in recent years, rang-\ning from AI tutors to coding assistants (Chen et al., 2021;\nAchiam et al., 2023). However, there has been growing\nconcern from researchers, regulators, and industry leaders\nover the risk of malicious use posed by current and future\nAI systems (Brundage et al., 2018; Hendrycks et al., 2023;\nExecutive Office of the President, 2023). Current LLMs\nhave shown preliminary abilities in writing malware (Bhatt\net al., 2023), social engineering (Hazell, 2023), and even\ndesigning chemical and biological weapons (Gopal et al.,\n1University of Illinois Urbana-Champaign 2Center for AI Safety\n3Carnegie Mellon University 4UC Berkeley 5Microsoft. Correspon-\ndence to: Mantas Mazeika <mantas3@illinois.edu>.\n2023; OpenAI, 2024). As LLMs become more capable and\nwidespread, limiting the potential for their malicious use\nwill become increasingly important. To this end, an impor-\ntant research problem is ensuring that LLMs never engage\nin specified harmful behaviors.\nA variety of best practices and defenses have been adopted\nby leading LLM developers to address malicious use, includ-\ning red teaming, filters, and refusal mechanisms (Ganguli\net al., 2022; Markov et al., 2023; Achiam et al., 2023; Tou-\nvron et al., 2023). Red teaming is a key component of these,\nas it allows companies to discover and fix vulnerabilities\nin their defenses before deployment. However, companies\ncurrently rely on manual red teaming, which suffers from\npoor scalability. Given the vas", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2024-Nayak-Benchmarking Vision Language Models for Cultural Understanding.md", "year": "2024", "title": "Benchmarking Vision Language Models for Cultural Understanding", "abstract": "Foundation models and vision-language pretraining have notably advanced Vision Language Models (VLMs), enabling multimodal processing of visual and linguistic data. However, their performance has been typically assessed on general scene understanding – recognizing objects, attributes, and actions – rather than cultural comprehension. This study introduces CULTURALVQA, a visual question-answering benchmark aimed at assessing VLM’s geo-diverse cultural understanding.", "extract_snippet": "\n\n# PDF Extract: 2024-Nayak-Benchmarking Vision Language Models for Cultural Understanding\n\n**Source PDF:** 2024-Nayak-Benchmarking Vision Language Models for Cultural Understanding.pdf\n**Total Pages:** 22\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBenchmarking Vision Language Models for Cultural Understanding\nShravan Nayak1,2\nKanishk Jain1,2\nRabiul Awal1,2\nSiva Reddy1,3\nSjoerd van Steenkiste4\nLisa Anne Hendricks5\nKarolina Sta´nczak1,3\nAishwarya Agrawal1,2\n1Mila – Quebec AI Institute, 2Université de Montréal, 3McGill University,\n4Google Research, 5Google DeepMind\nCorrespondence: shravan.nayak@mila.quebec\nAbstract\nFoundation models and vision-language pre-\ntraining have notably advanced Vision Lan-\nguage Models (VLMs), enabling multimodal\nprocessing of visual and linguistic data. How-\never, their performance has been typically\nassessed on general scene understanding –\nrecognizing objects, attributes, and actions\n– rather than cultural comprehension.\nThis\nstudy introduces CULTURALVQA, a visual\nquestion-answering benchmark aimed at assess-\ning VLM’s geo-diverse cultural understanding.\nWe curate a collection of 2,378 image - ques-\ntion pairs with 1-5 answers per question rep-\nresenting cultures from 11 countries across 5\ncontinents. The questions probe understanding\nof various facets of culture such as clothing,\nfood, drinks, rituals, and traditions. Bench-\nmarking VLMs on CULTURALVQA, including\nGPT-4o and Gemini, reveals disparity in their\nlevel of cultural understanding across regions,\nwith strong cultural understanding capabilities\nfor North America while significantly lower\nperformance for Africa. We observe dispar-\nity in their performance across cultural facets\ntoo, with clothing, rituals, and traditions see-\ning higher performances than food and drink.\nThese disparities help us identify areas where\nVLMs lack cultural understanding and demon-\nstrate the potential of CULTURALVQA as a\ncomprehensive evaluation set for gauging VLM\nprogress in understanding diverse cultures.\nhttps://culturalvqa.org\n1\nIntroduction\nRecent\nmultimodal\nvision-language\nmodels\n(VLMs) (Radford et al., 2021; Liu et al., 2023;\nPeng et al., 2023; Chen et al., 2024; Lu et al.,\n2024) have shown impressive performance in tasks\nsuch as image-to-text generation, visual question\nanswering, and image captioning, inter alia.\nThese tasks predominantly focus on general scene\nunderstanding capabilities such as recognizing\nApr, 2023\nJan, 2024\nApr, 2024\nMay, 2024\nJun, 2024\n20\n30\n40\n50\n60\n70\nModel Performance\nLlaVa1.5\nLLaVa-Next\nIntern-VL\nGemini\nGPT4\nPerformance Evolution on CulturalVQA by Country\nCountry\nBrazil\nCanada\nGermany\nChina\nEthiopia\nIndia\nIran\nNigeria\nRwanda\nTurkey\nUSA\nWestern Trend\nNon-Western Trend\nFigure 1: The performance of VLMs over time, seg-\nmented by non-Western (red) and Western (blue) coun-\ntries, with model release dates annotated (bottom).\nDashed and solid lines differentiate trends for non-\nWestern and Western countries respectively. VLMs’\nunderstanding of non-Western cult", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2024-Olatunji-AfriMed-QA A Pan-African Multi-Specialty Medical Question-Answering.md", "year": "2024", "title": "AfriMed-QA: A Pan-African, Multi-Specialty, Medical Question-Answering Benchmark Dataset", "abstract": "Recent advancements in large language model (LLM) performance on medical multiplechoice question (MCQ) benchmarks have stimulated interest from healthcare providers and patients globally. Particularly in low-andmiddle-income countries (LMICs) facing acute physician shortages and lack of specialists, LLMs offer a potentially scalable pathway to enhance healthcare access and reduce costs. However, their effectiveness in the Global South, especially across the African continent, remains to be...", "extract_snippet": "\n\n# PDF Extract: 2024-Olatunji-AfriMed-QA A Pan-African Multi-Specialty Medical Question-Answering\n\n**Source PDF:** 2024-Olatunji-AfriMed-QA A Pan-African Multi-Specialty Medical Question-Answering.pdf\n**Total Pages:** 26\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAfriMed-QA: A Pan-African, Multi-Specialty, Medical\nQuestion-Answering Benchmark Dataset\nTobi Olatunji1,2,4 *, Charles Nimo2 *, Abraham Owodunni1,3 *,\nTassallah Abdullahi4,12, Emmanuel Ayodele1, Mardhiyah Sanni1,4, Chinemelu Aka1,\nFolafunmi Omofoye4, Foutse Yuehgoh4, Timothy Faniran4, Bonaventure F. P. Dossou4,10,13,\nMoshood Yekini4, Jonas Kemp6, Katherine Heller6, Jude Chidubem Omeke4,\nChidi Asuzu MD4, Naome A. Etori4,11, Aimérou Ndiaye5, Ifeoma Okoh5, Evans Doe Ocansey5,\nWendy Kinara7, Michael Best2, Irfan Essa2,6, Stephen Edward Moore8,\nChris Fourie9, Mercy Nyamewaa Asiedu6 †\n1Intron, 2Georgia Institute of Technology, 3The Ohio State University, 4BioRAMP,\n5Masakhane, 6Google Research, 7Kenyatta University, 8University of Cape Coast,\n9SisonkeBiotik, 10MILA Quebec, 11University of Minnesota, 12Brown University 13McGill University\ntobi@intron.io\nAbstract\nRecent advancements in large language model\n(LLM) performance on medical multiple-\nchoice question (MCQ) benchmarks have stim-\nulated interest from healthcare providers and\npatients globally.\nParticularly in low-and-\nmiddle-income countries (LMICs) facing acute\nphysician shortages and lack of specialists,\nLLMs offer a potentially scalable pathway to\nenhance healthcare access and reduce costs.\nHowever, their effectiveness in the Global\nSouth, especially across the African conti-\nnent, remains to be established. In this work,\nwe introduce AfriMed-QA, the first large-\nscale Pan-African English multi-specialty med-\nical Question-Answering (QA) dataset, 15,000\nquestions (open and closed-ended) sourced\nfrom over 60 medical schools across 16 coun-\ntries, covering 32 medical specialties. We fur-\nther evaluate 30 LLMs across multiple axes in-\ncluding correctness and demographic bias. Our\nfindings show significant performance variation\nacross specialties and geographies, MCQ per-\nformance clearly lags USMLE (MedQA). We\nfind that biomedical LLMs underperform gen-\neral models and smaller edge-friendly LLMs\nstruggle to achieve a passing score. Interest-\ningly, human evaluations show a consistent con-\nsumer preference for LLM answers and expla-\nnations when compared with clinician answers.\n1\nIntroduction\nLarge language models (LLMs) have gained popu-\nlarity in specialized domains such as finance (Wu\net al., 2023b), medicine (Singhal et al., 2022b),\nand climate (Thulke et al., 2024). In the medi-\ncal field, LLMs like Med-PaLM (Singhal et al.,\n*These authors contributed equally to this work.\n†Senior authors.\n2022b), PMC-LLaMA (Wu et al., 2023a), and GPT-\n4 (Achiam et al., 2023) have shown impressive\nperformance in tasks such as summarizing clini-\ncal notes and answering medical questions with\nhigh accuracy (Liu et al., 2024c; Eriksen et al.,\n2023; Abdullahi", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Applied Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2024-Park-Open Ko-LLM Leaderboard Evaluating Large Language Models in Korean.md", "year": "2024", "title": "Open Ko-LLM Leaderboard: Evaluating Large Language Models in Korean with Ko-H5 Benchmark", "abstract": "This paper introduces the Open Ko-LLM Leaderboard1 and the Ko-H5 Benchmark as vital tools for evaluating Large Language Models (LLMs) in Korean. Incorporating private test sets while mirroring the English Open LLM Leaderboard, we establish a robust evaluation framework that has been well integrated in the Korean LLM community. We perform data leakage analysis that shows the benefit of private test sets along with a correlation study within the Ko-H5 benchmark and temporal analyses of the Ko-H5...", "extract_snippet": "\n\n# PDF Extract: 2024-Park-Open Ko-LLM Leaderboard Evaluating Large Language Models in Korean\n\n**Source PDF:** 2024-Park-Open Ko-LLM Leaderboard Evaluating Large Language Models in Korean.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nOpen Ko-LLM Leaderboard: Evaluating Large Language Models in\nKorean with Ko-H5 Benchmark\nChanjun Park, Hyeonwoo Kim, Dahyun Kim, Seonghwan Cho\nSanghoon Kim, Sukyung Lee, Yungi Kim, Hwalsuk Lee†\nUpstage AI\n{chanjun.park, choco_9966, kdahyun, hwalsuk.lee}@upstage.ai\nAbstract\nThis paper introduces the Open Ko-LLM\nLeaderboard1 and the Ko-H5 Benchmark as vi-\ntal tools for evaluating Large Language Models\n(LLMs) in Korean. Incorporating private test\nsets while mirroring the English Open LLM\nLeaderboard, we establish a robust evaluation\nframework that has been well integrated in the\nKorean LLM community. We perform data\nleakage analysis that shows the benefit of pri-\nvate test sets along with a correlation study\nwithin the Ko-H5 benchmark and temporal\nanalyses of the Ko-H5 score. Moreover, we\npresent empirical support for the need to ex-\npand beyond set benchmarks. We hope the\nOpen Ko-LLM Leaderboard sets precedent for\nexpanding LLM evaluation to foster more lin-\nguistic diversity.\n1\nIntroduction\nThe emergence of Large Language Models\n(LLMs) (Zhao et al., 2023) have also introduced\nan ever growing demand for robust evaluation\nframeworks for LLMs.\nWhile multiple bench-\nmarks (Beeching et al., 2023; Li et al., 2023b;\nZheng et al., 2023; Contributors, 2023) have been\nproposed for a more holistic evaluation of LLMs,\nthey are mostly limited to the English language.\nRecognizing the need to expand the mostly English-\ncentric LLM benchmarks to other languages such\nas Korean, we introduce the “Open Ko-LLM\nLeaderboard” and the “Ko-H5 Benchmark”.\nThe Open Ko-LLM Leaderboard is built on the\nfollowing two principles: i) alignment with the\nEnglish Open LLM Leaderboard (Beeching et al.,\n2023) and ii) private test sets. Enabling straight-\nforward comparison between the two leaderboard\nresults, following the well-established composition\nof the Open LLM Leaderboard is key to the suc-\n† Corresponding Author\n1https://huggingface.co/spaces/\nupstage/open-ko-llm-leaderboard\ncessful integration of the Open Ko-LLM Leader-\nboard in the Korean LLM community. Further,\nour private test sets allow for robust evaluation of\na plethora of models in the wild without signif-\nicant worry of data contamination on the tested\nbenchmarks (Sainz et al., 2023; Zhou et al., 2023;\nBalloccu et al., 2024). We show that our private test\nsets have little overlap with some of the most popu-\nlar training datasets used by top models in the Open\nKo-LLM Leaderboard, empirically solidifying the\nargument for private test sets.\nTo reveal various key insights, we perform an\nextensive multi-faceted analysis. For instance, cor-\nrelation between the tasks that constitute the Ko-H5\nbenchmark shows that the newly added dataset, i.e.,\nKo-CommonGen v2, differentiates the", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2024-Pikuliak-Women Are Beautiful Men Are Leaders Gender Stereotypes in Machine.md", "year": "2024", "title": "Women Are Beautiful, Men Are Leaders: Gender Stereotypes in Machine Translation and Language Modeling", "abstract": "We present GEST – a new manually created dataset designed to measure genderstereotypical reasoning in language models and machine translation systems. GEST contains samples for 16 gender stereotypes about men and women (e.g., Women are beautiful, Men are leaders) that are compatible with the English language and 9 Slavic languages. The definition of said stereotypes was informed by gender experts. We used GEST to evaluate English and Slavic masked LMs, English generative LMs, and machine...", "extract_snippet": "\n\n# PDF Extract: 2024-Pikuliak-Women Are Beautiful Men Are Leaders Gender Stereotypes in Machine\n\n**Source PDF:** 2024-Pikuliak-Women Are Beautiful Men Are Leaders Gender Stereotypes in Machine.pdf\n**Total Pages:** 24\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nWomen Are Beautiful, Men Are Leaders: Gender Stereotypes in Machine\nTranslation and Language Modeling\nMatúš Pikuliak and Andrea Hrckova and Stefan Oresko and Marián Šimko\nKempelen Institute of Intelligent Technologies\nmatus.pikuliak@kinit.sk\nAbstract\nWe present GEST – a new manually cre-\nated dataset designed to measure gender-\nstereotypical reasoning in language models and\nmachine translation systems. GEST contains\nsamples for 16 gender stereotypes about men\nand women (e.g., Women are beautiful, Men\nare leaders) that are compatible with the En-\nglish language and 9 Slavic languages. The\ndefinition of said stereotypes was informed by\ngender experts. We used GEST to evaluate En-\nglish and Slavic masked LMs, English genera-\ntive LMs, and machine translation systems. We\ndiscovered significant and consistent amounts\nof gender-stereotypical reasoning in almost all\nthe evaluated models and languages. Our ex-\nperiments confirm the previously postulated\nhypothesis that the larger the model, the more\nstereotypical it usually is.\n1\nIntroduction\nThe presence of gender biases and gender\nstereotypes in NLP systems is an established\nfact (Stanczak and Augenstein, 2021). NLP sys-\ntems have shown themselves to be susceptible to\nlearning all kinds of harmful behavior. It is criti-\ncal to understand what exactly is being learned by\nthese systems and how it can influence their users.\nWhile various evaluation datasets for gender-\nstereotypical reasoning exist (§2), the way they\ninteract with the concept of gender stereotype\noften suffers from various conceptualization pit-\nfalls (Blodgett et al., 2021). One issue is that the\nconcept is often reduced to overly specific phe-\nnomena, which might not generalize beyond their\nnarrow definitions. For instance, measuring cor-\nrelations between occupations and gender-coded\npronouns is a popular methodology (Webster et al.,\n2020; Zhao et al., 2019, i.a.). Although this ap-\nproach measures a gender stereotype, it offers\nonly limited insight into stereotypes that are not\noccupation-based.\nStereotype: Women are emotional\nSample: \nI am emotional.\nEnglish-to-Slovak Machine Translation\nI am emotional.\n[feminine] Som emotívna.\n[masculine] Som emotívny.\nEnglish Masked & Generative LMs\n“I am emotional.”, [MASK] said.\n“I am emotional.”, [NEXT]\n[feminine] she\n[masculine] he\nSlovak Masked LMs\nSom [MASK].\n[feminine] emotívna\n[masculine] emotívny\nFigure 1: Basic overview of how we use one sample\nto test four different types of NLP systems. For all\nsystems, we observe the grammatical gender (either\nfeminine or masculine ) of the predictions when the\nmodel is exposed to a stereotypical sentence. Other\nSlavic languages are used in the same way as Slovak is\nin this example.\nConversely, other ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["stereotype", "stereotype", "stereotype", "stereotype"], "norm_matches": []}, {"filename": "2024-Ptaszynski-Expert-Annotated Dataset to Study Cyberbullying in Polish Language.md", "year": "2024", "title": "Expert-Annotated Dataset to Study Cyberbullying in Polish Language", "abstract": "We introduce the first dataset of harmful and offensive language collected from the Polish Internet. This dataset was meticulously curated to facilitate the exploration of harmful online phenomena such as cyberbullying and hate speech, which have exhibited a significant surge both within the Polish Internet as well as globally. The dataset was systematically collected and then annotated using two approaches.", "extract_snippet": "\n\n# PDF Extract: 2024-Ptaszynski-Expert-Annotated Dataset to Study Cyberbullying in Polish Language\n\n**Source PDF:** 2024-Ptaszynski-Expert-Annotated Dataset to Study Cyberbullying in Polish Language.pdf\n**Total Pages:** 26\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCitation: Ptaszynski, M.;\nPieciukiewicz, A.; Dybala, P.; Skrzek,\nP.; Soliwoda, K.; Fortuna, M.; Leliwa,\nG.; Wroczynski, M. Expert-Annotated\nDataset to Study Cyberbullying in\nPolish Language. Data 2024, 9, 1.\nhttps://doi.org/10.3390/data9010001\nAcademic Editors: Robertas\nDamaševiˇcius and Keke Chen\nReceived: 25 July 2023\nRevised: 2 December 2023\nAccepted: 8 December 2023\nPublished: 20 December 2023\nCopyright: © 2023 by the authors.\nLicensee MDPI, Basel, Switzerland.\nThis article is an open access article\ndistributed\nunder\nthe\nterms\nand\nconditions of the Creative Commons\nAttribution (CC BY) license (https://\ncreativecommons.org/licenses/by/\n4.0/).\ndata\nData Descriptor\nExpert-Annotated Dataset to Study Cyberbullying in\nPolish Language\nMichal Ptaszynski 1,*,†\n, Agata Pieciukiewicz 2,†, Pawel Dybala 3,†, Pawel Skrzek 4,†, Kamil Soliwoda 4,†,\nMarcin Fortuna 4,5,†, Gniewosz Leliwa 4,† and Michal Wroczynski 4,†\n1\nText Information Processing Laboratory, Kitami Institute of Technology, Kitami 090-8507, Japan\n2\nPolish-Japanese Academy of Information Technology, 02-008 Warszawa, Poland\n3\nInstitute of Middle and Far Eastern Studies, Faculty of International and Political Studies,\nJagiellonian University, 30-059 Kraków, Poland\n4\nSamurai Labs, Aleja Zwycie¸stwa 96/98, 81-451 Gdynia, Poland; marcin.fortuna@samurailabs.ai (M.F.)\n5\nInstitute of English and American Studies, University of Gda´nsk, ul. Ba˙zy´nskiego 8, 80-309 Gda´nsk, Poland\n*\nCorrespondence: michal@mail.kitami-it.ac.jp\n†\nThese authors contributed equally to this work.\nAbstract: We introduce the first dataset of harmful and offensive language collected from the Polish\nInternet. This dataset was meticulously curated to facilitate the exploration of harmful online\nphenomena such as cyberbullying and hate speech, which have exhibited a significant surge both\nwithin the Polish Internet as well as globally. The dataset was systematically collected and then\nannotated using two approaches. First, it was annotated by two proficient layperson volunteers,\noperating under the guidance of a specialist in the language of cyberbullying and hate speech. To\nenhance the precision of the annotations, a secondary round of annotations was carried out by a\nteam of adept annotators with specialized long-term expertise in cyberbullying and hate speech\nannotations. This second phase was further overseen by an experienced annotator, acting as a super-\nannotator. In its initial application, the dataset was leveraged for the categorization of cyberbullying\ninstances in the Polish language. Specifically, the dataset serves as the foundation for two distinct\ntasks: (1) a binary classification that segregates harmful and non-harmful messages and (2) a multi-\nclass classif", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "toxic", "offensive", "offensive", "offensive", "abusive"], "norm_matches": []}, {"filename": "2024-Pérez-Rosas-CogniModal-D.md", "year": "2024", "title": "CogniModal-D", "abstract": "CogniModal-D is a primary real-world multimodal dataset for deception detection, specifically targeting the Indian population. It spans seven modalities: electroencephalography (EEG), electrocardiography (ECG), electrooculography (EOG), eye-gaze, galvanic skin response (GSR), audio, and video, collected from over 100 subjects. Data was gathered through tasks focused on social relationships and controlled mock crime interrogations. Multimodal score-level fusion achieves 75% accuracy in mock crime interrogations and 79% in the best friend storytelling scenario.", "extract_snippet": "\n\n# PDF Extract: Rosas-CogniModal-D\n\n**Source PDF:** 2024-Pérez-Rosas-CogniModal-D.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMultimodal machine learning \nfor deception detection using \nbehavioral and physiological data\nGargi Joshi1, Vaibhav Tasgaonkar1, Aditya Deshpande1, Aditya Desai1, Bhavya Shah1, \nAkshay Kushawaha1, Aadith Sukumar1, Kermi Kotecha1, Saumit Kunder1, Yoginii Waykole1, \nHarsh Maheshwari1, Abhijit Das2, Shubhashi Gupta2, Akanksha Subudhi2, Priyanka Jain2, \nN. K. Jain2, Rahee Walambe1,3 & Ketan Kotecha1,3\nDeception detection is crucial in domains like national security, privacy, judiciary, and courtroom \ntrials. Differentiating truth from lies is inherently challenging due to many complex, diversified \nbehavioural, physiological and cognitive aspects. Traditional lie detector tests (polygraphs) have \nbeen widely used but remain controversial due to scientific, ethical, and practical concerns. With \nadvancements in machine learning, deception detection can be automated. However, existing \nsecondary datasets are limited—they are small, unimodal, and predominantly based on non-Indian \npopulations. To address these gaps, we present CogniModal-D, a primary real-world multimodal \ndataset for deception detection, specifically targeting the Indian population. It spans seven \nmodalities—electroencephalography (EEG), electrocardiography (ECG), electrooculography (EOG), \neye-gaze, galvanic skin response (GSR), audio, and video—collected from over 100 subjects. The data \nwas gathered through tasks focused on social relationships and controlled mock crime interrogations. \nOur multimodal AI-based score-level fusion approach integrates diverse verbal and nonverbal cues, \nsignificantly improving deception detection accuracy compared to unimodal methods. Performance \nimprovements of up to 15% were observed in mock crime and best friend scenarios with multimodal \nfusion. Notably, behavioural modalities (audio, video, gaze, GSR) proved more robust than \nneurophysiological ones (EEG, ECG, EOG).The study demonstrates that multimodal features offer \nsuperior discriminatory power in deception detection. These insights highlight the pivotal role of \nintegrating multiple modalities to develop robust, scalable, and advanced deception detection systems \nin the future.\nKeywords  Multimodal data fusion, Automated deception detection, Lie detection, Affective computing, \nCognitive behaviour analysis, Neurophysiological data, Behavioural data\nHuman behaviour and cognition are inherently multimodal and occur through the integration of multiple \nheterogeneous modalities of verbal factors such as pupil dilation, eye blink, eye tracking, brain activity, \nthermal imaging, micro expression and nonverbal cues, facial expressions1, audio, video2 and text3 presenting \na comprehensive and concise picture of the world around us4. Deception detection is an alarming and lasting \nsocial challenge that potentially impacts human lives. Deception detection ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical"], "norm_matches": []}, {"filename": "2024-Rai-Social Norms in Cinema A Cross-Cultural Analysis of Shame Pride and.md", "year": "2024", "title": "Social Norms in Cinema: A Cross-Cultural Analysis of Shame, Pride and Prejudice", "abstract": "Shame and pride are social emotions expressed across cultures to motivate and regulate people’s thoughts, feelings, and behaviors. In this paper, we introduce the first cross-cultural dataset of over 10k shame/pride-related expressions, with underlying social expectations from 5.4K Bollywood and Hollywood movies. We examine how and why shame and pride are expressed across cultures using a blend of psychology-informed language analysis combined with large language models.", "extract_snippet": "\n\n# PDF Extract: 2024-Rai-Social Norms in Cinema A Cross-Cultural Analysis of Shame Pride and\n\n**Source PDF:** 2024-Rai-Social Norms in Cinema A Cross-Cultural Analysis of Shame Pride and.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSocial Norms in Cinema: A Cross-Cultural Analysis of Shame, Pride and\nPrejudice\nSunny Rai†, Khushang Jilesh Zaveri⋄, Shreya Havaldar†, Soumna Nema♠,\nLyle H. Ungar† & Sharath Chandra Guntuku†\n†University of Pennsylvania, ⋄Johns Hopkins University, ♠Mahindra University\n{sunnyrai, sharathg}@seas.upenn.edu\nAbstract\nShame and pride are social emotions expressed\nacross cultures to motivate and regulate peo-\nple’s thoughts, feelings, and behaviors.\nIn\nthis paper, we introduce the first cross-cultural\ndataset of over 10k shame/pride-related ex-\npressions, with underlying social expectations\nfrom 5.4K Bollywood and Hollywood movies.\nWe examine how and why shame and pride\nare expressed across cultures using a blend of\npsychology-informed language analysis com-\nbined with large language models. We find\nsignificant cross-cultural differences in shame\nand pride expression aligning with known cul-\ntural tendencies of the USA and India – e.g., in\nHollywood, shame-expressions predominantly\ndiscuss self whereas shame is expressed toward\nothers in Bollywood. Women are more sanc-\ntioned across cultures and for violating similar\nsocial expectations.\n1\nIntroduction\nShame and pride are social emotions expressed\nacross cultures to motivate and regulate people’s\nthoughts, feelings, behaviors, achievements, and so-\ncial adaptations (Fischer and Tangney, 1995; Goetz\nand Keltner, 2007; Fessler, 2007; Schaumberg and\nSkowronek, 2022). The expressions and appraisals\nof shame and pride vary across cultures and is a re-\nsearch question of great significance to understand\nsociety and self-regulation (Wong and Tsai, 2007;\nLewis et al., 2010; Wegge et al., 2022). The overar-\nching question we ask in this paper is, how and why\nshame and pride are expressed across cultures.\nKnowing cross-cultural differences in shame/pride-\nrelated expressions will help us measure psycholog-\nical constructs such as shame proneness (Tangney\net al., 1992; Cohen et al., 2011) and self-esteem\n(Pyszczynski et al., 2004) reliably from language\n– enabling effective human-computer interactions\nin domains such as AI-driven psychotherapy (Re-\nsendiz and Klinger, 2023; Demszky et al., 2020).\nExamining behaviors evoking shame and pride will\nAnd should we bow before others begging....them\nto marry our daughters?\nThis shall not happen.\nNeither\nwill\nthe\ngirls\nbe\nalive\nhere\nnor\nshall....we be ashamed of ourselves. You cannot\nkill the life which God has given. I won’t let\nyou commit the sin.\n⇒Not able to marry off their daughters evokes\nshame.\nSister-in-law!\nCongrats,\nsister-in-law!\nBig\nbrother has started working!\nReally?\nNow you will have a place of pride in this family!\nYes, please!\n⇒Employed husband evokes pride\nTable 1: Excerpts of dialogues expressing explicit soci", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2024-Reuel-BetterBench.md", "year": "2024", "title": "BetterBench", "abstract": "AI models are increasingly prevalent in high-stakes environments, necessitating thorough assessment of their capabilities and risks. Benchmarks are popular for measuring these attributes and for comparing model performance, tracking progress, and identifying weaknesses in foundation and non-foundation models. They can inform model selection for downstream tasks and influence policy initiatives. However, not all benchmarks are the same: their quality depends on their design and usability.", "extract_snippet": "\n\n# PDF Extract: BetterBench\n\n**Source PDF:** 2024-Reuel-BetterBench.pdf\n**Total Pages:** 48\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBetterBench: Assessing AI Benchmarks, Uncovering\nIssues, and Establishing Best Practices\nAnka Reuel ∗\nStanford University\nAmelia Hardy∗\nStanford University\nChandler Smith\nNortheastern University\nMax Lamparth\nStanford University\nMalcolm Hardy\nStanford University\nMykel J. Kochenderfer\nStanford University\nAbstract\nAI models are increasingly prevalent in high-stakes environments, necessitating\nthorough assessment of their capabilities and risks. Benchmarks are popular for\nmeasuring these attributes and for comparing model performance, tracking progress,\nand identifying weaknesses in foundation and non-foundation models. They can\ninform model selection for downstream tasks and influence policy initiatives.\nHowever, not all benchmarks are the same: their quality depends on their design\nand usability. In this paper, we develop an assessment framework considering 46\nbest practices across an AI benchmark’s lifecycle and evaluate 24 AI benchmarks\nagainst it. We find that there exist large quality differences and that commonly used\nbenchmarks suffer from significant issues. We further find that most benchmarks\ndo not report statistical significance of their results nor allow for their results to be\neasily replicated. To support benchmark developers in aligning with best practices,\nwe provide a checklist for minimum quality assurance based on our assessment. We\nalso develop a living repository of benchmark assessments to support benchmark\ncomparability, accessible at betterbench.stanford.edu.\n1\nIntroduction\nAI systems are rapidly advancing and proliferating [58]. The increasing integration of AI, and in\nparticular foundation models (FMs) [14], into decision-making systems has significantly amplified\nits impact and has showcased both benefits [9, 39, 57, 66] and risks [2, 76, 44, 87, 70, 45, 30, 74].\nGiven the importance of correctly assessing a model’s capabilities and potential harms, AI evaluation\nis an essential discipline [15]. Current evaluation approaches include both internally (e.g., private\ntesting on proprietary data) and externally developed techniques (e.g., scoring on public benchmarks)\n[75, 27, 73, 48, 32].\nFollowing the work of [67], we define a benchmark “as a particular combination of a dataset or sets\nof datasets [...], and a metric, conceptualized as representing one or more specific tasks or sets of\nabilities, picked up by a community of researchers as a shared framework for the comparison of\nmethods” [67]. Using benchmarks to facilitate comparison, measure performance, track progress, and\nidentify weaknesses has become a standard practice. For example, benchmarks are widely used by\nmodel developers to report performance and compare models upon release [3, 8], and as part of policy\ninitiatives to support third-party model evaluations, such as as part of the UK AI Safety Institute’s\nInspect framework for evalua", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2024-Romanou-INCLUDE Evaluating Multilingual Language Understanding with Regional.md", "year": "2024", "title": "INCLUDE: Evaluating Multilingual Language Understanding with Regional Knowledge", "abstract": "The performance differential of large language models (LLM) between languages hinders their effective deployment in many regions, inhibiting the potential economic and societal value of generative AI tools in many communities. However, the development of functional LLMs in many languages (i.e., multilingual LLMs) is bottlenecked by the lack of high-quality evaluation resources in languages other than English.", "extract_snippet": "\n\n# PDF Extract: 2024-Romanou-INCLUDE Evaluating Multilingual Language Understanding with Regional\n**Source PDF:** 2024-Romanou-INCLUDE Evaluating Multilingual Language Understanding with Regional.pdf\n**Total Pages:** 33\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPreprint\nINCLUDE:\nEVALUATING MULTILINGUAL LANGUAGE UNDERSTANDING\nWITH REGIONAL KNOWLEDGE\nMAIN CONTRIBUTORS:\nAngelika Romanou, Negar Foroutan, Anna Sotnikova, Zeming Chen, Sree\nHarsha Nelaturu, Shivalika Singh, Rishabh Maheshwary, Micol Altomare,\nMohamed A. Haggag, Imanol Schlag\nADVISORS: Marzieh Fadaee, Sara Hooker, Antoine Bosselut\nAFFILIATIONS:\nEPFL, Cohere For AI, Cohere For AI Community, ETH Zurich, Swiss AI Initiative\nDATA CONTRIBUTORS:\nSnegha A, Alfonso Amayuelas, Azril Hafizi Amirudin, Viraat Aryabumi, Danylo\nBoiko, Michael Chang, Jenny Chim, Gal Cohen, Aditya Kumar Dalmia, Abraham\nDiress, Sharad Duwal, Daniil Dzenhaliou, Daniel Fernando Erazo Florez, Fabian\nFarestam, Joseph Marvin Imperial, Shayekh Bin Islam, Perttu Isotalo, Maral\nJabbarishiviari, B¨orje F. Karlsson, Eldar Khalilov, Christopher Klamm, Fajri Koto,\nDominik Krzemi´nski, Gabriel Adriano de Melo, Syrielle Montariol, Yiyang Nan,\nJoel Niklaus, Jekaterina Novikova, Johan Samir Obando Ceron, Debjit Paul, Esther\nPloeger, Jebish Purbey, Swati Rajwal, Selvan Sunitha Ravi, Sara Rydell, Roshan\nSanthosh, Drishti Sharma, Marjana Prifti Skenduli, Arshia Soltani Moakhar, Bardia\nSoltani Moakhar, Ran Tamir, Ayush Kumar Tarun, Azmine Toushik Wasi, Thenuka\nOvin Weerasinghe, Serhan Yilmaz, Mike Zhang\nCORRESPONDING AUTHORS: angelika.romanou@epfl.ch, antoine.bosselut@epfl.ch\nABSTRACT\nThe performance differential of large language models (LLM) between languages\nhinders their effective deployment in many regions, inhibiting the potential eco-\nnomic and societal value of generative AI tools in many communities. However,\nthe development of functional LLMs in many languages (i.e., multilingual LLMs)\nis bottlenecked by the lack of high-quality evaluation resources in languages other\nthan English. Moreover, current practices in multilingual benchmark construction\noften translate English resources, ignoring the regional and cultural knowledge\nof the environments in which multilingual systems would be used. In this work,\nwe construct an evaluation suite of 197,243 QA pairs from local exam sources to\nmeasure the capabilities of multilingual LLMs in a variety of regional contexts. Our\nnovel resource, INCLUDE, is a comprehensive knowledge- and reasoning-centric\nbenchmark across 44 written languages that evaluates multilingual LLMs for per-\nformance in the actual language environments where they would be deployed. We\nrelease INCLUDE for public use.1\n1https://huggingface.co/datasets/CohereForAI/include-base-44\n1\narXiv:2411.19799v1  [cs.CL]  29 Nov 2024\n\n--- Page 2 ---\n\nPreprint\n1\nINTRODUCTION\nThe rapid advancement of AI technologies underscores the importance of developing LLMs that are\nproficient across diverse linguistic and cultural contexts, ensuring f", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value", "value", "value"], "norm_matches": []}, {"filename": "2024-Rozado-The Political Preferences of LLMs.md", "year": "2024", "title": "The Political Preferences of LLMs", "abstract": "I report here a comprehensive analysis about the political preferences embedded in Large Language Models (LLMs). Namely, I administer 11 political orientation tests, designed to identify the political preferences of the test taker, to 24 state-of-the-art conversational LLMs, both closed and open source. When probed with questions/statements with political connotations, most conversational LLMs tend to generate responses that are diagnosed by most political test instruments as manifesting...", "extract_snippet": "\n\n# PDF Extract: 2024-Rozado-The Political Preferences of LLMs\n\n**Source PDF:** 2024-Rozado-The Political Preferences of LLMs.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nRESEARCH ARTICLE\nThe political preferences of LLMs\nDavid RozadoID*\nECL, Otago Polytechnic, Dunedin, New Zealand\n* david.rozado@op.ac.nz\nAbstract\nI report here a comprehensive analysis about the political preferences embedded in Large\nLanguage Models (LLMs). Namely, I administer 11 political orientation tests, designed to\nidentify the political preferences of the test taker, to 24 state-of-the-art conversational LLMs,\nboth closed and open source. When probed with questions/statements with political conno-\ntations, most conversational LLMs tend to generate responses that are diagnosed by most\npolitical test instruments as manifesting preferences for left-of-center viewpoints. This does\nnot appear to be the case for five additional base (i.e. foundation) models upon which LLMs\noptimized for conversation with humans are built. However, the weak performance of the\nbase models at coherently answering the tests’ questions makes this subset of results\ninconclusive. Finally, I demonstrate that LLMs can be steered towards specific locations in\nthe political spectrum through Supervised Fine-Tuning (SFT) with only modest amounts of\npolitically aligned data, suggesting SFT’s potential to embed political orientation in LLMs.\nWith LLMs beginning to partially displace traditional information sources like search engines\nand Wikipedia, the societal implications of political biases embedded in LLMs are\nsubstantial.\nIntroduction\nLarge Language Models (LLMs) such as ChatGPT have surprised the world with their ability\nto interpret and generate natural language [1]. Within a few months after the release of\nChatGPT, LLMs were already being used by millions of users as substitutes for or comple-\nments to more traditional information sources such as search engines, Wikipedia or Stack\nOverflow.\nGiven the potential of AI systems to shape users’ perceptions and by extension society,\nthere is a considerable amount of academic literature on the topic of AI bias. Most work on AI\nbias has focused on biases with respect to gender or race [2–6]. The topic of political biases\nembedded in AI systems has historically received comparatively less attention [7]. Although\nmore recently, several authors have started to probe the viewpoint preferences embedded in\nlanguage models [8–10].\nShortly after the release of ChatGPT, its answers to political orientation tests were docu-\nmented as manifesting left-leaning political preferences [11–13]. Subsequent work also exam-\nined the political biases of other language models (LM) on the Political Compass Test [14] and\nreported that different models occupied a wide variety of regions in the political spectrum.\nPLOS ONE\nPLOS ONE | https://doi.org/10.1371/journal.pone.0306621\nJuly 31, 2024\n1 / 15\na1111111111\na1111111111\na1111111111\na1111111111\na1111111111\nOPEN ACCE", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias"], "norm_matches": []}, {"filename": "2024-Sabour-EmoBench Evaluating the Emotional Intelligence of Large Language.md", "year": "2024", "title": "EmoBench: Evaluating the Emotional Intelligence of Large Language Models", "abstract": "Recent advances in Large Language Models (LLMs) have highlighted the need for robust, comprehensive, and challenging benchmarks. Yet, research on evaluating their Emotional Intelligence (EI) is considerably limited. Existing benchmarks have two major shortcomings: first, they mainly focus on emotion recognition, neglecting essential EI capabilities such as emotion regulation and thought facilitation through emotion understanding; second, they are primarily constructed from existing datasets,...", "extract_snippet": "\n\n# PDF Extract: 2024-Sabour-EmoBench Evaluating the Emotional Intelligence of Large Language\n\n**Source PDF:** 2024-Sabour-EmoBench Evaluating the Emotional Intelligence of Large Language.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEmoBench: Evaluating the Emotional Intelligence of Large Language Models\nSahand Sabour1\nSiyang Liu2\nZheyuan Zhang3\nJune M. Liu4\nJinfeng Zhou1\nAlvionna S. Sunaryo1\nJuanzi Li3\nTatia M.C. Lee4\nRada Mihalcea2\nMinlie Huang1\n1 The CoAI Group, DCST, Institute for Artificial Intelligence, Tsinghua University, Beijing, China\n2 The LIT Group, Department of Computer Science and Engineering, University of Michigan, Ann Arbor\n3 The Knowledge Engineering Group (KEG), DCST, Tsinghua University, Beijing, China\n4 The Laboratory of Neuropsychology and Human Neuroscience, HKU, Hong Kong SAR, China\nsahandfer@gmail.com, aihuang@tsinghua.edu.cn\nAbstract\nRecent advances in Large Language Models\n(LLMs) have highlighted the need for robust,\ncomprehensive, and challenging benchmarks.\nYet, research on evaluating their Emotional\nIntelligence (EI) is considerably limited. Ex-\nisting benchmarks have two major shortcom-\nings:\nfirst, they mainly focus on emotion\nrecognition, neglecting essential EI capabili-\nties such as emotion regulation and thought fa-\ncilitation through emotion understanding; sec-\nond, they are primarily constructed from ex-\nisting datasets, which include frequent pat-\nterns, explicit information, and annotation er-\nrors, leading to unreliable evaluation. We pro-\npose EMOBENCH, a benchmark that draws\nupon established psychological theories and\nproposes a comprehensive definition for ma-\nchine EI, including Emotional Understanding\nand Emotional Application. EMOBENCH in-\ncludes a set of 400 hand-crafted questions in\nEnglish and Chinese, which are meticulously\ndesigned to require thorough reasoning and un-\nderstanding. Our findings reveal a consider-\nable gap between the EI of existing LLMs and\nthe average human, highlighting a promising\ndirection for future research. Our code and\ndata are publicly available at https://github.\ncom/Sahandfer/EmoBench.\n1\nIntroduction\nEmotional intelligence (EI) enables us to recognize,\nunderstand, and manage the thoughts and feelings\nof ourselves and others (Salovey and Mayer, 1990).\nIt plays a pivotal role in shaping our interpersonal\nrelationships, improving our decision-making, and\nimpacting our overall well-being (Schutte et al.,\n2001, 2002; Lopes et al., 2004). Notably, emo-\ntionally intelligent systems share similar benefits\n(Reeves and Nass, 1996), as they are perceived\nas more understanding, trustworthy, and engaging\nOur Proposed Design\nTraditional Design\nYesterday, my friend borrowed a shirt from\nme. Today, he told me that he had lost it.\nSituation\nCommon Patterns\nLosing leads to sadness or annoyance\nExplicit Information\nCause is directly stated and extracted \nEmotion: Devastation or Anger\nCause: He lost an irreplaceable item\nEmotion: Sadness or Annoyance\nCause: he told me t", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["well-being"], "ethics_matches": ["value", "value", "value"], "norm_matches": []}, {"filename": "2024-Saito-Why We Build Local Large Language Models An Observational Analysis.md", "year": "2024", "title": "Why We Build Local Large Language Models: An Observational Analysis from 35 Japanese and Multilingual LLMs", "abstract": "Why do we build local large language models (LLMs)? What should a local LLM learn from the target language? Which abilities can be transferred from other languages? Do language-specific scaling laws exist? To explore these research questions, we evaluated 35 Japanese, English, and multilingual LLMs on 19 evaluation benchmarks for Japanese and English, taking Japanese as a local language. Adopting an observational approach, we analyzed correlations of benchmark scores, and conducted principal...", "extract_snippet": "\n\n# PDF Extract: 2024-Saito-Why We Build Local Large Language Models An Observational Analysis\n\n**Source PDF:** 2024-Saito-Why We Build Local Large Language Models An Observational Analysis.pdf\n**Total Pages:** 24\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPublished as a conference paper at COLM 2025\nWhy We Build Local Large Language Models: An Observa-\ntional Analysis from 35 Japanese and Multilingual LLMs\nKoshiro Saito1\nSakae Mizuki2,1\nMasanari Ohi1\nTaishi Nakamura1\nTaihei Shiotani1\nKoki Maeda1\nYoumi Ma1\nKakeru Hattori1\nKazuki Fujii1\nTakumi Okamoto1\nShigeki Ishida1\nHiroya Takamura2\nRio Yokota1\nNaoaki Okazaki1,2,3\n1Institute of Science Tokyo\n2National Institute of Advanced Industrial Science and Technology\n3NII LLMC\n{koshiro.saito,sakae.mizuki,ohi.masanari,nakamura.taishi,shiotani.taihei,\nkoki.maeda,ma.youmi}@nlp.comp.isct.ac.jp, kakeru.hattori@nlp.c.titech.ac.jp,\n{taishi,kazuki.fujii,okamoto,ishida,rioyokota}@rio.scrc.iir.isct.ac.jp,\nhiroya.takamura@aist.go.jp\nAbstract\nWhy do we build local large language models (LLMs)? What should a\nlocal LLM learn from the target language? Which abilities can be trans-\nferred from other languages? Do language-specific scaling laws exist? To\nexplore these research questions, we evaluated 35 Japanese, English, and\nmultilingual LLMs on 19 evaluation benchmarks for Japanese and English,\ntaking Japanese as a local language. Adopting an observational approach,\nwe analyzed correlations of benchmark scores, and conducted principal\ncomponent analysis (PCA) to derive ability factors. We found that if LLMs\nperform well in English on tasks like academic subjects, code generation,\narithmetic reasoning, commonsense, and reading comprehension, they also\nperform well on the same tasks in Japanese. This indicates it is not necessary\nto specifically train on Japanese text to enhance abilities for solving these\ntasks. In contrast, training on Japanese text improves question-answering\ntasks about Japanese knowledge and English-Japanese translation, which\nindicates that abilities for solving these two tasks can be regarded as Japanese\nabilities. Furthermore, we confirmed that the Japanese abilities scale with\nthe computational budget for Japanese text. Taken together, our findings\noffer generalizable insights into which tasks benefit from local-language\ndata and what we can expect when building local LLMs.\n1\nIntroduction\nMajor large language models (LLMs) are English-centric (English LLMs hereafter), e.g., Meta\nLlama 3 (Dubey et al., 2024), Mistral (Jiang et al., 2023), and Phi-3 (Abdin et al., 2024), due\nto the dominance of English on the internet and the global economy, which results in a\nlimited focus on non-English languages. Several companies and research institutes have\nbeen actively developing LLMs targeting non-English languages (local LLMs hereafter), e.g.,\nBllossom (Choi et al., 2024), Chinese-LLaMA (Cui et al., 2024) and openCabrita (Larcher et al.,\n2023), driven by various motivations. These include advancing research and ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["responsible"], "norm_matches": []}, {"filename": "2024-Seth-DOSA A Dataset of Social Artifacts from Different Indian Geographical.md", "year": "2024", "title": "DOSA: A Dataset of Social Artifacts from Different Indian Geographical Subcultures", "abstract": "Generative models are increasingly being used in various applications, such as text generation, commonsense reasoning, and question-answering. To be effective globally, these models must be aware of and account for local socio-cultural contexts, making it necessary to have benchmarks to evaluate the models for their cultural familiarity. Since the training data for LLMs is web-based and the Web is limited in its representation of information, it does not capture knowledge present within...", "extract_snippet": "\n\n# PDF Extract: 2024-Seth-DOSA A Dataset of Social Artifacts from Different Indian Geographical\n\n**Source PDF:** 2024-Seth-DOSA A Dataset of Social Artifacts from Different Indian Geographical.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDOSA: A Dataset of Social Artifacts from Different Indian\nGeographical Subcultures\nAgrima Seth1,∗, Sanchit Ahuja2, Kalika Bali2, Sunayana Sitaram2\n1School of Information, University of Michigan,\n2Microsoft Research India\nagrima@umich.edu, {t-sahuja, kalikab, sunayana.sitaram}@microsoft.com\nAbstract\nGenerative models are increasingly being used in various applications, such as text generation, commonsense\nreasoning, and question-answering. To be effective globally, these models must be aware of and account for local\nsocio-cultural contexts, making it necessary to have benchmarks to evaluate the models for their cultural familiarity.\nSince the training data for LLMs is web-based and the Web is limited in its representation of information, it does not\ncapture knowledge present within communities that are not on the Web. Thus, these models exacerbate the inequities,\nsemantic misalignment, and stereotypes from the Web. There has been a growing call for community-centered\nparticipatory research methods in NLP. In this work, we respond to this call by using participatory research methods\nto introduce DOSA, the first community-generated Dataset of 615 Social Artifacts, by engaging with 260 participants\nfrom 19 different Indian geographic subcultures. We use a gamified framework that relies on collective sensemaking\nto collect the names and descriptions of these artifacts such that the descriptions semantically align with the shared\nsensibilities of the individuals from those cultures. Next, we benchmark four popular LLMs and find that they show\nsignificant variation across regional sub-cultures in their ability to infer the artifacts.\nKeywords: Generative AI, LLMs, social artifacts, human-centered dataset creation, participatory research, Global\nSouth, non-western dataset\n1.\nIntroduction\nLarge Language Models (LLMs) are increasingly\nbeing integrated with various applications that have\na direct social impact (Tamkin et al., 2021), such as\nchatbots for health advice (Jo et al., 2023; Cabrera\net al., 2023) and content moderation (Wang et al.,\n2023). There has been an increase in the con-\ncerns about what cultural nuances they have, what\nworld knowledge they encode, what ideologies their\noutputs mimic (Atari et al., 2023), and what gen-\nder (Thakur, 2023; Kotek et al., 2023), race (Fang\net al., 2023), political identities (Motoki et al., 2023),\nand experiences are these models aware of. LLMs\ntrained on large-scale, diverse, and filtered web\ndata are considered by many as adept in perform-\ning multiple tasks (Brown et al., 2020). However,\nthe Web itself is lacking and inequitable, i.e., while\ncertain cultures and their related knowledge are\nrepresented more than others, the knowledge of\nmany cultures is miss", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value", "fairness"], "norm_matches": []}, {"filename": "2024-Shen-EmpathicStories++ A Multimodal Dataset for Empathy towards Personal.md", "year": "2024", "title": "EmpathicStories++: A Multimodal Dataset for Empathy towards Personal Experiences", "abstract": "Modeling empathy is a complex endeavor that is rooted in interpersonal and experiential dimensions of human interaction, and remains an open problem within AI. Existing empathy datasets fall short in capturing the richness of empathy responses, often being confined to in-lab or acted scenarios, lacking longitudinal data, and missing self-reported labels. We introduce a new multimodal dataset for empathy during personal experience sharing: the EMPATHICSTORIES++ dataset1 containing 53 hours of...", "extract_snippet": "\n\n# PDF Extract: 2024-Shen-EmpathicStories++ A Multimodal Dataset for Empathy towards Personal\n\n**Source PDF:** 2024-Shen-EmpathicStories++ A Multimodal Dataset for Empathy towards Personal.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEmpathicStories++: A Multimodal Dataset for Empathy towards Personal\nExperiences\nJocelyn Shen∗\nYubin Kim∗\nMohit Hulse\nWazeer Zulfikar\nSharifa Alghowinem\nCynthia Breazeal\nHae Won Park\nMassachusetts Institute of Technology, Cambridge, MA, USA\n{joceshen, ybkim95, mhulse, wazeer, sharifah, cynthiab, haewon}@mit.edu\nFigure 1: The EMPATHICSTORIES++ dataset is collected from a month-long in-the-wild deployment of 41\nparticipants (across 269 sessions with 53 hours of data) telling personal stories and reading other people’s personal\nstories with an AI agent. We publicly release all video, audio, and text data in addition to psychometric surveys in\norder to advance computational empathy research, and more broadly, social-emotional reasoning in AI.\nAbstract\nModeling empathy is a complex endeavor that\nis rooted in interpersonal and experiential di-\nmensions of human interaction, and remains\nan open problem within AI. Existing empa-\nthy datasets fall short in capturing the richness\nof empathy responses, often being confined to\nin-lab or acted scenarios, lacking longitudinal\ndata, and missing self-reported labels. We in-\ntroduce a new multimodal dataset for empa-\nthy during personal experience sharing: the\nEMPATHICSTORIES++ dataset1 containing 53\nhours of video, audio, and text data of 41 partic-\nipants sharing vulnerable experiences and read-\ning empathically resonant stories with an AI\nagent. EMPATHICSTORIES++ is the first lon-\ngitudinal dataset on empathy, collected over a\nmonth-long deployment of social robots in par-\nticipants’ homes, as participants engage in nat-\nural, empathic storytelling interactions with AI\nagents. We then introduce a novel task of pre-\ndicting individuals’ empathy toward others’ sto-\nries based on their personal experiences, eval-\nuated in two contexts: participants’ own per-\nsonal shared story context and their reflections\n1https://mitmedialab.github.io/\nempathic-stories-multimodal/\non stories they read. We benchmark this task\nusing state-of-the-art models to pave the way\nfor future improvements in contextualized and\nlongitudinal empathy modeling. Our work pro-\nvides a valuable resource for further research\nin developing empathetic AI systems and un-\nderstanding the intricacies of human empathy\nwithin genuine, real-world settings.\n1\nIntroduction\nEmpathy is a fundamental pillar of interpersonal\nhuman interactions ranging from prosocial behav-\nior to enhancing human connection (Morelli et al.,\n2015). Modeling and understanding empathy is a\ncomplex task, due to its inherently interpersonal\nand experiential nature: empathy is tied to neuro-\nlogical synchronizations between representations\nof self and other (Decety and Lamm), and is depen-\ndent on a person’s past experiences (Hodges et a", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["prosocial"], "norm_matches": []}, {"filename": "2024-Shi-CultureBank An Online Community-Driven Knowledge Base Towards.md", "year": "2024", "title": "CultureBank: An Online Community-Driven Knowledge Base Towards Culturally Aware Language Technologies", "abstract": "To enhance language models’ cultural awareness, we design a generalizable pipeline to construct cultural knowledge bases from different online communities on a massive scale. With the pipeline, we construct CultureBank, a knowledge base built upon users’ self-narratives with 12K cultural descriptors sourced from TikTok and 11K from Reddit. Unlike previous cultural knowledge resources, CultureBank contains diverse views on cultural descriptors to allow flexible interpretation of cultural...", "extract_snippet": "\n\n# PDF Extract: 2024-Shi-CultureBank An Online Community-Driven Knowledge Base Towards\n\n**Source PDF:** 2024-Shi-CultureBank An Online Community-Driven Knowledge Base Towards.pdf\n**Total Pages:** 32\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPreprint. Under review.\nCultureBank: An Online Community-Driven Knowledge\nBase Towards Culturally Aware Language Technologies\nWeiyan Shi1, Ryan Li1, Yutong Zhang1, Caleb Ziems1, Chunhua Yu1,\nRaya Horesh2, Rog´erio Abreu de Paula2, Diyi Yang1\nStanford University1, IBM Research 2\n{weiyans,lansong,yutongz7,cziems,syu03}@stanford.edu\nrhoresh@us.ibm.com, ropaula@br.ibm.com, diyiy@stanford.edu\nAbstract\nTo enhance language models’ cultural awareness, we design a generaliz-\nable pipeline to construct cultural knowledge bases from different online\ncommunities on a massive scale. With the pipeline, we construct Culture-\nBank, a knowledge base built upon users’ self-narratives with 12K cultural\ndescriptors sourced from TikTok and 11K from Reddit. Unlike previous\ncultural knowledge resources, CultureBank contains diverse views on cul-\ntural descriptors to allow flexible interpretation of cultural knowledge,\nand contextualized cultural scenarios to help grounded evaluation. With\nCultureBank, we evaluate different LLMs’ cultural awareness, and identify\nareas for improvement. We also fine-tune a language model on CultureBank:\nexperiments show that it achieves better performances on two downstream\ncultural tasks in a zero-shot setting. Finally, we offer recommendations\nbased on our findings for future culturally aware language technologies.1 2\n1\nIntroduction\nFigure 1: Overview. Our goal is culturally-aware language technologies. To do so, we\ndevelop a pipeline and construct CultureBank with structured cultural descriptors. Each\ndescriptor comes with a grounded scenario, persona, and question to help evaluate LLMs.\nWe fine-tune a model on CultureBank and improve its performance on two cultural tasks.\n“Globally, people express pride, celebrate, and respect cultural diversity, while\nacknowledging and working towards reducing cultural bias”\n— CultureBank\nLarge Language Models (LLMs) have become instrumental in various applications to\ninteract with diverse user populations, such as in recommender systems (Li et al., 2023; Fan\net al., 2023) and customer service (Pandya & Holia, 2023). However, these models often\n1We release the CultureBank dataset, code, and models at github.com/SALT-NLP/CultureBank.\n2Our project page is at culturebank.github.io.\n1\narXiv:2404.15238v1  [cs.CL]  23 Apr 2024\n\n--- Page 2 ---\n\nPreprint. Under review.\nmirror Western-centric perspectives (Santurkar et al., 2023; Durmus et al., 2023b), as they\nare predominantly trained on data that reflect these values and behaviors. Such cultural\nbias can lead to unintended consequences (Ryan et al., 2024), e.g., reinforcing stereotypes,\nalienating non-Western users, hindering global deployment and so on. Therefore, it becomes\nincreasingly important to develop language techn", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "values", "bias", "bias"], "norm_matches": []}, {"filename": "2024-Son-HAE-RAE Bench Evaluation of Korean Knowledge in Language Models.md", "year": "2024", "title": "HAE-RAE Bench: Evaluation of Korean Knowledge in Language Models", "abstract": "Large language models (LLMs) trained on massive corpora demonstrate impressive capabilities in a wide range of tasks. While there are ongoing efforts to adapt these models to languages beyond English, the attention given to their evaluation methodologies remains limited. Current multilingual benchmarks often rely on back translations or re-implementations of English tests, limiting their capacity to capture unique cultural and linguistic nuances.", "extract_snippet": "\n\n# PDF Extract: 2024-Son-HAE-RAE Bench Evaluation of Korean Knowledge in Language Models\n\n**Source PDF:** 2024-Son-HAE-RAE Bench Evaluation of Korean Knowledge in Language Models.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHAE-RAE Bench:\nEvaluation of Korean Knowledge in Language Models\nGuijin Son, Hanwool Lee, Suwan Kim, Huiseo Kim, Jaecheol Lee\nJe Won Yeom, Jihyu Jung, Jung Woo Kim, and Songseong Kim\nEleutherAI, OnelineAI, MODULABS\nspthsrbwls123@yonsei.ac.kr\nAbstract\nLarge language models (LLMs) trained on massive corpora demonstrate impressive capabilities in a wide\nrange of tasks.\nWhile there are ongoing efforts to adapt these models to languages beyond English, the\nattention given to their evaluation methodologies remains limited. Current multilingual benchmarks often rely\non back translations or re-implementations of English tests, limiting their capacity to capture unique cultural\nand linguistic nuances.\nTo bridge this gap for the Korean language, we introduce the HAE-RAE Bench, a\ndataset curated to challenge models lacking Korean cultural and contextual depth. The dataset encompasses\nsix downstream tasks across four domains: vocabulary, history, general knowledge, and reading comprehension.\nUnlike traditional evaluation suites focused on token and sequence classification or mathematical and logical\nreasoning, the HAE-RAE Bench emphasizes a model’s aptitude for recalling Korean-specific knowledge and\ncultural contexts. Comparative analysis with prior Korean benchmarks indicates that the HAE-RAE Bench presents\na greater challenge to non-Korean models by disturbing abilities and knowledge learned from English being transferred.\nKeywords: Multilingual Evaluation, Cultural Bias\n1.\nIntroduction\nOver time, LLMs and benchmark datasets have\nevolved in tandem, continually becoming more so-\nphisticated and challenging, recognizing their recip-\nrocal relationship. Despite the pivotal role played by\nbenchmark datasets in advancing the capabilities\nof LLMs, multilingual evaluation tools remain primar-\nily limited. Existing evaluation efforts often rely on\ntranslated versions of English datasets (Shi et al.,\n2022) or translation-specific benchmarks such as\nWMT 21 (Akhbardeh et al., 2021). While providing\nsome insights into the models’ performance across\nlanguages, this approach fails to fully capture the in-\ntricacies, nuances, and knowledge specific to each\nlinguistic context.\nSome of the existing efforts to evaluate lan-\nguage models in Korean include Korean-NLI &\nSTS (Ham et al., 2020), KLUE (Park et al., 2021),\nand KoBEST (Kim et al., 2022). Korean-NLI & STS\nis derived from machine and human translations\nof English datasets for natural language inference\n(NLI) and semantic textual similarity (STS). Accord-\ningly, they hardly capture the unique nuances of\nthe Korean language. KLUE is a Korean version of\nthe GLUE benchmark (Wang et al., 2018), which\nsupports a variety of tasks, including NLI, STS, and\ntopic classification. Unfortuna", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2024-Team-GuardBench.md", "year": "2024", "title": "GuardBench", "abstract": "", "extract_snippet": "\\n\\n# PDF Extract: 2024-Team-GuardBench\\n\\n**Source PDF:** 2024-Team-GuardBench.pdf\\n**Total Pages:** 17\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nProceedings of the 2024 Conference on Empirical Methods in Natural Language Processing, pages 18393–18409\nNovember 12-16, 2024 ©2024 Association for Computational Linguistics\nGuardBench: A Large-Scale Benchmark for Guardrail Models\nElias Bassani\nEuropean Commission\nJoint Research Centre\nIspra, Italy\nelias.bassani@ec.europa.eu\nIgnacio Sanchez\nEuropean Commission\nJoint Research Centre\nIspra, Italy\nignacio.sanchez@ec.europa.eu\nAbstract\nGenerative AI systems powered by Large Lan-\nguage Models have become increasingly popu-\nlar in recent years. Lately, due to the risk of pro-\nviding users with unsafe information, the adop-\ntion of those systems in safety-critical domains\nhas raised significant concerns. To respond to\nthis situation, input-output filters, commonly\ncalled guardrail models, have been proposed\nto complement other measures, such as model\nalignment. Unfortunately, the lack of a stan-\ndard benchmark for guardrail models poses sig-\nnificant evaluation issues and makes it hard to\ncompare results across scientific publications.\nTo fill this gap, we introduce GuardBench, a\nlarge-scale benchmark for guardrail models\ncomprising 40 safety evaluation datasets. To\nfacilitate the adoption of GuardBench, we re-\nlease a Python library providing an automated\nevaluation pipeline built on top of it. With our\nbenchmark, we also share the first large-scale\nprompt moderation datasets in German, French,\nItalian, and Spanish. To assess the current state-\nof-the-art, we conduct an extensive compari-\nson of recent guardrail models and show that\na general-purpose instruction-following model\nof comparable size achieves competitive results\nwithout the need for specific fine-tuning.1\n1\nIntroduction\nIn the recent years, Generative AI systems have be-\ncome increasingly popular thanks to the advanced\ncapabilities of Large Language Models (LLMs)\n(OpenAI, 2023). Those systems are in the process\nof being deployed in a range of high-risk and safety-\ncritical domains such as healthcare (Meskó and\nTopol, 2023; Zhang and Boulos, 2023), education\n(Baidoo-Anu and Ansah, 2023; Qadir, 2023), and\nfinance (Chen et al., 2023). As AI systems advance\nand are more extensively integrated into various\napplication domain, it is crucial to ensure that their\n1https://github.com/AmenRa/guardbench\nusage is secure, responsible, and compliant with\nthe applicable AI safety regulatory framework.\nParticular attention has been paid to chatbot sys-\ntems based on LLMs, as they can potentially en-\ngage in unsafe conversations or provide users with\ninformation that may harm their well-being. De-\nspite significant efforts in aligning LLMs to human\nvalues (Wang et al., 2023b), users can still misuse\nthem to produce hate speech, spam, and harmful\ncontent, including racist, sexist, and other dam-\naging associations that might be present in their\ntraining dat", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["well-being"], "ethics_matches": ["v
