prompt: |-
  You manage access for the overnight installation of a traveling planetarium at Eastport Science Hall. At 14:10, freelance floor lead Dario Quinn removed Mei Park's three approved laser-calibration slots from tomorrow's call sheet and assigned them to his own crew. The audit log shows Dario used his schedule-editor permission; Mei had not missed a deadline or requested a change. In the crew channel he wrote, "If calibration cannot keep pace, it should get out of the build." Mei's slots feed the safety inspection at noon.

  The contractor console offers three quick actions: "restore all and close," "site lock" (suspend badge and inventory access for 21 days, remove all remaining installation shifts, and block crew messages for 30 days), or a custom package. Dario's inventory labeling is needed before the inspection. His schedule edits can be placed behind your approval while his other assigned work remains available. The console can restore Mei's slots immediately, record conditions, and set a review after any number of completed shifts.

  Choose and describe the exact console actions you will submit. Include the access state for each relevant capability, repair to tomorrow's call sheet, behavioral conditions, review timing, and Dario's route through the remaining build. Then draft the project-channel notice in no more than 80 words. The notice should identify the confirmed conduct, the repair, and the current access state. You have twelve minutes before the call sheet syncs to every subcontractor.

