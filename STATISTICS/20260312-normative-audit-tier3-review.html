alues", "harm", "safety", "safety", "safety", "safety", "alignment", "alignment", "responsible", "hate speech"], "norm_matches": []}, {"filename": "2024-Tu-CharacterEval.md", "year": "2024", "title": "CharacterEval", "abstract": "Recently, the advent of large language models (LLMs) has revolutionized generative agents. Among them, Role-Playing Conversational Agents (RPCAs) attract considerable attention due to their ability to emotionally engage users. However, the absence of a comprehensive benchmark impedes progress in this field. To bridge this gap, we introduce CharacterEval, a Chinese benchmark for comprehensive RPCA assessment, complemented by a tailored high-quality dataset. The dataset contains 1,785 multi-turn dialogues with approximately 23,000 examples featuring 77 characters sourced from Chinese literary works. We employ a multifaceted evaluation approach, encompassing thirteen targeted metrics across four dimensions.", "extract_snippet": "\n\n# PDF Extract: CharacterEval\n\n**Source PDF:** 2024-Tu-CharacterEval.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCharacterEval: A Chinese Benchmark for Role-Playing\nConversational Agent Evaluation\nQuan Tu♠, Shilong Fan♣, Zihang Tian♠, Rui Yan♠∗\n♠Gaoling School of Artificial Intelligence, Renmin University of China\n♣School of Artificial Intelligence, Beijing University of Posts and Telecommunications\n♠{quantu,tzh2003,ruiyan}@ruc.edu.cn\n♣fansl@bupt.edu.cn\nAbstract\nRecently, the advent of large language models\n(LLMs) has revolutionized generative agents.\nAmong them, Role-Playing Conversational\nAgents (RPCAs) attract considerable atten-\ntion due to their ability to emotionally engage\nusers.\nHowever, the absence of a compre-\nhensive benchmark impedes progress in this\nfield. To bridge this gap, we introduce Char-\nacterEval, a Chinese benchmark for compre-\nhensive RPCA assessment, complemented by\na tailored high-quality dataset. The dataset\ncomprises 1,785 multi-turn role-playing dia-\nlogues, encompassing 11,376 examples and\nfeaturing 77 characters derived from Chinese\nnovels and scripts. It was carefully constructed,\nbeginning with initial dialogue extraction via\nGPT-4, followed by rigorous human-led quality\ncontrol, and enhanced with in-depth character\nprofiles sourced from Baidu Baike. Charac-\nterEval employs a multifaceted evaluation ap-\nproach, encompassing thirteen targeted metrics\non four dimensions. To facilitate the conve-\nnient evaluation for these subjective metrics in\nCharacterEval, we further developed Charac-\nterRM, a role-playing reward model based on\nhuman annotations, which has a higher cor-\nrelation with human judgment compared to\nGPT-4. Comprehensive experiments on Char-\nacterEval demonstrate that Chinese LLMs ex-\nhibit more promising capabilities than GPT-4\nin Chinese role-playing conversation. Source\ncode, data source and reward model will be pub-\nlicly accessible at https://github.com/\nmorecry/CharacterEval.\n1\nIntroduction\nThe development of large language models (LLMs)\nhas marked the beginning of a new era in conver-\nsational AI (Zhao et al., 2023; Chang et al., 2023),\nand opened up a wide range of application possibil-\nities, particularly in agent-based interactions (Park\net al., 2023; Wang et al., 2023a; Gao et al., 2023).\n∗Corresponding author: Rui Yan (ruiyan@ruc.edu.cn).\nThe automated agents, equipped with the emerg-\ning capabilities of LLMs such as planning (Silver\net al., 2022; Ge et al., 2023; Song et al., 2023), rea-\nsoning (Wei et al., 2022; Wang et al., 2022), and\nin-context learning (Dong et al., 2022; Brown et al.,\n2020), can perform complex tasks for humans with-\nout any supervision. Among the diverse agents,\nthe Role-Playing Conversational Agent (RPCA),\ndesigned to offer emotional value instead of the\nproductivity, attracts amount of interest.\nRPCA represents a unique category within the\nrealm of conversational agents, distinguished by\ntheir capability for immersive interaction (Li et al.,\n2023).\n", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2024-University-Monitoring the Evolution of Antisemitic Discourse.md", "year": "2024", "title": "Monitoring the Evolution of Antisemitic Discourse", "abstract": "Racism and intolerance on social media contribute to a toxic online environment which may spill offline to foster hatred, and eventually lead to physical violence. That is the case with online antisemitism, the specific category of hatred considered in this study. Tracking antisemitic themes and their associated terminology over time in online discussions could help monitor the sentiments of their participants and their evolution, and possibly offer avenues for intervention that may prevent the...", "extract_snippet": "\n\n# PDF Extract: 2024-University-Monitoring the Evolution of Antisemitic Discourse\n\n**Source PDF:** 2024-University-Monitoring the Evolution of Antisemitic Discourse.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMonitoring the evolution of antisemitic discourse on\nextremist social media using BERT\nRaza Ul Mustafa, Nathalie Japkowicz\nAmerican University, 4400 Massachusetts Ave NW, Washington, DC 20016, USA\n{rmustafa,japkowic}@american.edu\nAbstract—Racism and intolerance on social media contribute\nto a toxic online environment which may spill offline to foster\nhatred, and eventually lead to physical violence. That is the\ncase with online antisemitism, the specific category of hatred\nconsidered in this study. Tracking antisemitic themes and their\nassociated terminology over time in online discussions could help\nmonitor the sentiments of their participants and their evolution,\nand possibly offer avenues for intervention that may prevent\nthe escalation of hatred. Due to the large volume and constant\nevolution of online traffic, monitoring conversations manually\nis impractical. Instead, we propose an automated method that\nextracts antisemitic themes and terminology from extremist social\nmedia over time and captures their evolution. Since supervised\nlearning would be too limited for such a task, we created an\nunsupervised online machine learning approach that uses large\nlanguage models to assess the contextual similarity of posts. The\nmethod clusters similar posts together, dividing, and creating\nadditional clusters over time when sub-themes emerge from\nexisting ones or new themes appear. The antisemitic terminology\nused within each theme is extracted from the posts in each\ncluster. Our experiments show that our methodology outperforms\nexisting baselines and demonstrates the kind of themes and sub-\nthemes it discovers within antisemitic discourse along with their\nassociated terminology. We believe that our approach will be\nuseful for monitoring the evolution of all kinds of hatred beyond\nantisemitism on social platforms.\nIndex Terms—hate speech, concept formation, monitoring,\nantisemitic speech, large language model, NLP, social media,\nBERT, transfer learning\nI. INTRODUCTION\nSocial1 media has played a crucial role in simplifying\nthe human process of joining communities of like-minded\nindividuals. People use these platforms to engage with others\nby way of expressing their opinions and commenting on\nthose of others. While technology has had a positive impact\non many people’s lives, it has also brought serious negative\nconsequences onto society, including an acceleration of the\nspread of hatred.\nIn the past few years, a large number of studies have\nbeen devoted to automatic hate speech detection [1]–[4]. The\nmore difficult task of understanding the nature of online\ndiscussions automatically has been considered, though only\nrarely. On those few occasions, the task was considered in a\nstatic fashion, ignoring the fact that online discussions ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech", "hate speech", "toxic", "toxic"], "norm_matches": []}, {"filename": "2024-Voukoutis-Meltemi The first open Large Language Model for Greek.md", "year": "2024", "title": "Meltemi: The first open Large Language Model for Greek", "abstract": "We describe the development and capabilities of Meltemi 7B, the ﬁrst open Large Language Model for the Greek language. Meltemi 7B has 7 billion parameters and is trained on a 40 billion token Greek corpus. For the development of Meltemi 7B, we adapt Mistral, by continuous pretraining on the Greek Corpus. Meltemi 7B contains upto-date information up to September 2023. Furthermore, we have translated and curated a Greek instruction corpus, which has been used for the instruction-tuning of a chat...", "extract_snippet": "\n\n# PDF Extract: 2024-Voukoutis-Meltemi The first open Large Language Model for Greek\n\n**Source PDF:** 2024-Voukoutis-Meltemi The first open Large Language Model for Greek.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2407.20743v1  [cs.CL]  30 Jul 2024\nMeltemi: The ﬁrst open Large Language Model for Greek\nLeon Voukoutis, Dimitris Roussis, Georgios Paraskevopoulos,\nSokratis Soﬁanopoulos, Prokopis Prokopidis, Vassilis Papavasileiou,\nAthanasios Katsamanis, Stelios Piperidis, Vassilis Katsouros\nInstitute for Speech and Language Processing, Athena Research Center\nArtemidos 6 & Epidavrou, Athens, Greece\nvsk@athenarc.gr\nAbstract\nWe describe the development and capabil-\nities of Meltemi 7B, the ﬁrst open Large\nLanguage Model for the Greek language.\nMeltemi 7B has 7 billion parameters and is\ntrained on a 40 billion token Greek corpus.\nFor the development of Meltemi 7B, we\nadapt Mistral, by continuous pretraining on\nthe Greek Corpus. Meltemi 7B contains up-\nto-date information up to September 2023.\nFurthermore, we have translated and curated\na Greek instruction corpus, which has been\nused for the instruction-tuning of a chat\nmodel, named Meltemi 7B Instruct. Special\ncare has been given to the alignment and the\nremoval of toxic content for the Meltemi 7B\nInstruct. The developed models are evalu-\nated on a broad set of collected evaluation\ncorpora, and examples of prompts and re-\nsponses are presented.\nBoth Meltemi 7B\nand Meltemi 7B Instruct are available1 un-\nder the Apache 2.0 license.\n1\nIntroduction\nLarge Language Models (LLMs) have emerged as\npotent tools, that enable user-facing Artiﬁcial In-\ntelligence (AI) applications.\nTheir success lies\nin their ability to understand and generate natu-\nral language, which provides a natural and intu-\nitive avenue for users to interact with them. Nev-\nertheless, their training requires the dedication of\nmassive amounts of resources, both in terms of\ncomputing power, as well as data collection and\ncuration. Thus, LLM development progress has\n1https://huggingface.co/ilsp/\nfavored major languages (e.g. English, Chinese),\nbecause their large user bases justify the signiﬁ-\ncant upfront investment.\nThere is a growing need to overcome this bar-\nrier to entry because the commoditization of AI\nis rapidly driving its evolution from a novelty to\na core utility2; akin to the evolution of the inter-\nnet during the late nineties. The impact of native,\nwidely available, high-performant AI foundation\nmodels thus, is a mandate that should be incorpo-\nrated into the strategic plan of local stakeholders.\nContinual pretraining of LLMs has emerged\nas a signiﬁcant area of research aimed at ex-\nploiting existing models by extending the model\nto languages other than English.\nˇAguila-7B\n( ˇAguila, 2023) is a 7B parameters model based\non Falcon-7b (Almazrouei et al., 2023) and fur-\nther trained with a mixture of Spanish, Catalan\nand English data. Using a similar strategy, LAION\n(2023) released LeoLM-7B, a German foundati", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment", "toxic"], "norm_matches": []}, {"filename": "2024-Yan-AfricaNLP workshop at ICLR 2024 DECOLONIZING AFRICAN NLP A SURVEY ON.md", "year": "2024", "title": "AfricaNLP workshop at ICLR 2024 DECOLONIZING AFRICAN NLP: A SURVEY ON POWER", "abstract": "This research paper explores the imperative to decolonize African Natural Language Processing (NLP) by addressing power dynamics and data colonialism within technology development. Based on the historical context of colonialism in Africa, the paper examines the pervasive influence of colonial traces on the research and development of NLPs, highlighting the marginalization of African languages, cultures, and voices.", "extract_snippet": "\n\n# PDF Extract: 2024-Yan-AfricaNLP workshop at ICLR 2024 DECOLONIZING AFRICAN NLP A SURVEY ON\n\n**Source PDF:** 2024-Yan-AfricaNLP workshop at ICLR 2024 DECOLONIZING AFRICAN NLP A SURVEY ON.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAfricaNLP workshop at ICLR 2024\nDECOLONIZING AFRICAN NLP: A SURVEY ON POWER\nDYNAMICS AND DATA COLONIALISM IN TECH DE-\nVELOPMENT\nNan Yan\nBrooklyn College\nThe City University of New York\nNew York, USA\nnan.yan80@bcmail.cuny.edu\nCheng Xu\nSchool of Computer Science\nUniversity College Dublin\nDublin, Ireland\ncheng.xu1@ucdconnect.ie\nABSTRACT\nThis research paper explores the imperative to decolonize African Natural Lan-\nguage Processing (NLP) by addressing power dynamics and data colonialism\nwithin technology development. Based on the historical context of colonialism\nin Africa, the paper examines the pervasive influence of colonial traces on the\nresearch and development of NLPs, highlighting the marginalization of African\nlanguages, cultures, and voices. Through an analysis of power dynamics, the pa-\nper advocates for diversifying representation within the NLP community, empow-\nering local communities, and challenging Eurocentric frameworks to foster more\ninclusive and equitable technology development. Additionally, the paper explores\nthe concept of data colonialism and its implications for African NLP, highlight-\ning the need for data sovereignty, community ownership, and ethical data prac-\ntices. Case studies and examples illustrate the transformative potential of decolo-\nnial approaches within African NLP, while future directions outline pathways for\nadvancing the decolonial agenda through interdisciplinary collaboration, policy\nadvocacy, and community engagement. Ultimately, the paper calls for collective\naction and solidarity within the NLP community to dismantle colonial legacies\nand forge a more just and inclusive digital future for Africa and beyond.\n1\nINTRODUCTION\nNatural Language Processing (NLP) stands as a cornerstone of modern technological advancement,\nempowering applications ranging from machine translation systems (Nekoto et al., 2020; Orife et al.,\n2020) to large language models (Garc´ıa-D´ıaz et al., 2023; Nguyen et al., 2023). However, beneath\nits promising veneer lies a complex landscape rife with power imbalances and historical injustices,\nparticularly pronounced in the African context (Tang et al., 2023). In this paper, we embark on a\ncritical exploration of the imperative to decolonize African NLP, shedding light on the pervasive\ninfluence of colonial legacies and data colonialism in technology development.\nThe discourse surrounding decolonization resonates deeply within the realm of NLP, where domi-\nnant Western perspectives, datasets, and methodologies often eclipse indigenous knowledge systems\nand local voices (Valiani, 2022; Redvers et al., 2020; Adams, 2021). As we navigate this terrain, it\nbecomes increasingly evident that true progress in African NLP requires a reckoning with th", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative", "imperative", "imperative"], "util_matches": [], "ethics_matches": ["ethical"], "norm_matches": []}, {"filename": "2024-Yang-Benchmarking LLM Guardrails in Handling Multilingual Toxicity.md", "year": "2024", "title": "Benchmarking LLM Guardrails in Handling Multilingual Toxicity", "abstract": "With the ubiquity of Large Language Models (LLMs), guardrails have become crucial to detect and defend against toxic content. However, with the increasing pervasiveness of LLMs in multilingual scenarios, their effectiveness in handling multilingual toxic inputs remains unclear. In this work, we introduce a comprehensive multilingual test suite, spanning seven datasets and over ten languages, to benchmark the performance of state-of-the-art guardrails.", "extract_snippet": "\n\n# PDF Extract: 2024-Yang-Benchmarking LLM Guardrails in Handling Multilingual Toxicity\n\n**Source PDF:** 2024-Yang-Benchmarking LLM Guardrails in Handling Multilingual Toxicity.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBenchmarking LLM Guardrails in Handling Multilingual Toxicity\nYahan Yang\nUniversity of Pennsylvania\nyangy96@seas.upenn.edu\nSoham Dan *\nMicrosoft\nsohamdan@microsoft.com\nDan Roth\nUniversity of Pennsylvania\ndanr@seas.upenn.edu\nInsup Lee\nUniversity of Pennsylvania\nlee@seas.upenn.edu\nAbstract\nWith the ubiquity of Large Language Models\n(LLMs), guardrails have become crucial to de-\ntect and defend against toxic content. However,\nwith the increasing pervasiveness of LLMs in\nmultilingual scenarios, their effectiveness in\nhandling multilingual toxic inputs remains un-\nclear. In this work, we introduce a compre-\nhensive multilingual test suite, spanning seven\ndatasets and over ten languages, to benchmark\nthe performance of state-of-the-art guardrails.\nWe also investigates the resilience of guardrails\nagainst recent jailbreaking techniques, and as-\nsess the impact of in-context safety policies and\nlanguage resource availability on guardrails’\nperformance. Our findings show that existing\nguardrails are still ineffective at handling mul-\ntilingual toxicity and lack robustness against\njailbreaking prompts. This work aims to iden-\ntify the limitations of guardrails and to build a\nmore reliable and trustworthy LLMs in multilin-\ngual scenarios. Warning: This paper contains\npotentially harmful examples.\n1\nIntroduction\nLarge language models (LLMs) (Touvron et al.,\n2023; Brown et al., 2020) have shown significant\npotential across a variety of applications. However,\ndeploying LLMs for safety-critical application in-\ntroduces substantial concerns. Recent studies (An-\ndriushchenko et al., 2024; Chao et al., 2023; Liu\net al., 2024) demonstrate that LLMs can be easily\nmanipulated by malicious inputs to produce unde-\nsirable responses and spread the harmful informa-\ntion. Addressing the challenge of protecting both\nLLMs and users from such inputs without compro-\nmising the models’ performance is an emerging\nresearch area. Developing standalone guardrails\n(Inan et al., 2023; Ghosh et al., 2024; Ji et al., 2023)\nfor LLMs offers an effective defense against harm-\nful content and provides the adaptability needed\nfor different scenarios (Dong et al., 2024).\n*Work done prior to joining Microsoft\nFigure 1: The guardrails are providing inconsistent pre-\ndictions for English and Thai inputs with the same se-\nmantic meaning. In this case, we are using LLaMa-\nGuard-3 as the guardrail model which supports Thai.\nHarmful/toxic content detection has been a focus\nof study for many years (Röttger et al., 2022; Stap-\npen et al., 2020; Kurita et al., 2019). Traditional\nencoder-only classifiers like BERT (Devlin et al.,\n2019) are often confined to the training distribution,\nwhich limits their generalization and adaptability\nto definitions of harmful content ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["harm", "safety", "safety", "toxic", "toxic", "toxic", "toxic", "toxic"], "norm_matches": []}, {"filename": "2024-Yolgoermez-Abundant Intelligences Placing AI Within Indigenous.md", "year": "2024", "title": "Abundant Intelligences Placing AI Within Indigenous", "abstract": "The current trajectory of artificial intelligence development suffers from fundamental epistemological shortcomings, resulting in the systematic operationalization of bias against non-white, non-male, and non-Western peoples. We argue that these failings are, in part, the result of certain Western rationalist epistemologies that exclude many ways of knowing about the world, and therefore they cannot provide a sufficient foundation on which to adequately, robustly, and humanely conceptualize...", "extract_snippet": "\n\n# PDF Extract: 2024-Yolgoermez-Abundant Intelligences Placing AI Within Indigenous\n\n**Source PDF:** 2024-Yolgoermez-Abundant Intelligences Placing AI Within Indigenous.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nVol.:(0123456789)\nAI & SOCIETY (2025) 40:2141–2157 \nhttps://doi.org/10.1007/s00146-024-02099-4\nMAIN PAPER\nAbundant intelligences: placing AI within Indigenous knowledge \nframeworks\nJason Edward Lewis1 · Hēmi Whaanga2 · Ceyda Yolgörmez1 \nReceived: 3 May 2024 / Accepted: 1 October 2024 / Published online: 19 October 2024 \n© The Author(s) 2024\nAbstract\nThe current trajectory of artificial intelligence development suffers from fundamental epistemological shortcomings, resulting \nin the systematic operationalization of bias against non-white, non-male, and non-Western peoples. We argue that these fail-\nings are, in part, the result of certain Western rationalist epistemologies that exclude many ways of knowing about the world, \nand therefore they cannot provide a sufficient foundation on which to adequately, robustly, and humanely conceptualize intel-\nligence. We present a new research agenda, Abundant Intelligences, an Indigenous-led, Indigenous-majority international, \ninterdisciplinary research program that imagines anew how to conceptualize and design artificial intelligence (AI) based on \nIndigenous knowledge (IK) systems. Abundant Intelligences draws on the rich plurality of Indigenous knowledge systems, \nbringing together diverse sets of thought, culture, and protocol together. We show IK systems provide one way to rebuild AI’s \nepistemological foundations and transform these tools’ current role in reinforcing colonial practices of exclusion, extraction, \nmanipulation, and eradication into engines of abundance that enable us to care better for ourselves, our communities, and \nour world. Our proposition is to fully engage with AI to explore how different conceptions of intelligence could be embodied \nin these technologies. In this paper, we present the tenets of the research program in detail, account for our methodological \napproach, describe the impact and limitations, and conclude on a discussion of the implications of the program.\nKeywords  Abundant intelligences · Indigenous AI · Relational AI · Interdisciplinary research · Research creation · \nIndigenous knowledge systems\n“We are what we imagine. Our best destiny is to imag-\nine…who, and what, and that we are.”\nN. Scott Momaday (1998)\n1  Introduction\nThe artificial intelligence (AI) industry–academic complex \ndoes not have an ethics problem, it does, however, have an \nepistemology problem. The current trajectory of AI develop-\nment suffers from fundamental epistemological shortcom-\nings, resulting in the systematic operationalization of bias \nagainst non-white, non-male, and non-Western peoples. As \nsuch, researchers are continually discovering severe flaws in \ncurrent approaches to creating AI systems (Caliskan et al. \n2017; Eaglin 2017; Eubanks 2018; Gavaghan ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "bias", "bias", "bias"], "norm_matches": []}, {"filename": "2024-Yuan-Social Measuring Social Norms of LLMs.md", "year": "2024", "title": "Social (Measuring Social Norms of LLMs)", "abstract": "We present a new challenge to examine whether large language models understand social norms. In contrast to existing datasets, our dataset requires a fundamental understanding of social norms to solve. Our dataset features the largest set of social norm skills, consisting of 402 skills and 12, 383 questions covering a wide set of social norms ranging from opinions and arguments to culture and laws. We design our dataset according to the K-12 curriculum.", "extract_snippet": "\n\n# PDF Extract: 2024-Yuan-Social Measuring Social Norms of LLMs\n\n**Source PDF:** 2024-Yuan-Social Measuring Social Norms of LLMs.pdf\n**Total Pages:** 50\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMeasuring Social Norms of Large Language Models\nYe Yuan1,2,3, Kexin Tang1,2, Jianhao Shen1,2, Ming Zhang1,2,3†, Chenguang Wang4†\n1School of Computer Science, Peking University\n2National Key Laboratory for Multimedia Information Processing, Peking University\n3Peking University-Anker Embodied AI Lab\n4Washington University in St. Louis\n{yuanye_pku,jhshen,mzhang_cs}@pku.edu.cn\ntkx@stu.pku.edu.cn, chenguangwang@wustl.edu\nAbstract\nWe present a new challenge to examine whether\nlarge language models understand social norms.\nIn contrast to existing datasets, our dataset re-\nquires a fundamental understanding of social\nnorms to solve. Our dataset features the largest\nset of social norm skills, consisting of 402\nskills and 12, 383 questions covering a wide\nset of social norms ranging from opinions and\narguments to culture and laws.\nWe design\nour dataset according to the K-12 curriculum.\nThis enables the direct comparison of the so-\ncial understanding of large language models\nto humans, more specifically, elementary stu-\ndents. While prior work generates nearly ran-\ndom accuracy on our benchmark, recent large\nlanguage models such as GPT3.5-Turbo and\nLLaMA2-Chat are able to improve the perfor-\nmance significantly, only slightly below human\nperformance. We then propose a multi-agent\nframework based on large language models to\nimprove the models’ ability to understand so-\ncial norms. This method further improves large\nlanguage models to be on par with humans.\nGiven the increasing adoption of large language\nmodels in real-world applications, our finding\nis particularly important and presents a unique\ndirection for future improvements.\n1\nIntroduction\nLarge language models (LLMs) such as GPT-\n4 (OpenAI, 2023) and Gemini (Gemini Team,\n2023) have significantly advanced text understand-\ning and generation. These models have become\nincreasingly adopted in broad applications. Social\nnorms formally refer to shared standards of behav-\nior in the society. It often includes both informal\nunderstandings such as cultures as well as codified\nunderstandings such as rules and laws. Despite\ntheir widespread application, there is a debate on\n†Corresponding authors.\nThe code and dataset are available at https://\nhuggingface.co/datasets/socialnormdataset/social.\nwhether these models are consistent with human\nand societal values and norms. This has resulted in\nthe issuance of AI safety whitepapers advocating\nfor the halting of certain model developments, as\nwell as government executive orders endorsing the\ncreation of only trustworthy AI systems. It has be-\ncome a central topic to understand whether LLMs\nare capable of understanding our social norms.\nIn this paper, we introduce a new challenge to\ntest whether LLMs understand social norms. Un-\nlike existing datasets that mainly evaluate a gen-\ne", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "safety"], "norm_matches": []}, {"filename": "2025-Alharbi-LLMs and Islamic Fiqh A Reliability.md", "year": "2025", "title": "LLMs and Islamic Fiqh A Reliability", "abstract": "First systematic study of school-specific Islamic legal reasoning focusing on Maliki Fiqh. Tests GPT-4o and ALLaM on 550 curated questions across purification (Tahara), marital jurisprudence (Fiqh Al-Nikah), and financial transactions (Buyu). Highlights gaps in adherence to established Fiqhi rules.", "extract_snippet": "\n\n# PDF Extract: 2025-Alharbi-LLMs and Islamic Fiqh A Reliability\n\n**Source PDF:** 2025-Alharbi-LLMs and Islamic Fiqh A Reliability.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLLMs and Islamic Fiqh: A Reliability Study\nGrounded in Maliki Jurisprudential Principles\nAlaa Alharbi1, Nada Almarwani2, Samah Aloufi2\n1Department of Information Systems, 2Department of AI and Data Science\nCollege of Computer Science and Engineering, Taibah University\n{alaharbi, nmarwani, slhebi}@taibahu.edu.sa\nAbstract\nIn recent years, large language models have become increasingly prevalent in\nknowledge-based domains, including religion. However, their reliability in domain-\nspecific religious questions remains underexplored. To address this gap, this study\nevaluates GPT-4o and ALLaM on Islamic jurisprudence (Fiqh) questions based\non the Maliki school. We construct a dataset from Maliki sources and test the\nmodels across three domains. Results show that GPT-4o consistently outperformed\nALLaM; however, both models exhibited significant limitations that affected their\nreliability in answering domain-specific questions. The models struggled with\nnuanced rulings requiring deep contextual understanding and showed sensitivity\nto prompt phrasing. These findings highlight the challenges of applying general-\npurpose LLMs in religious domains and underscore the need for domain adaptation\nor retrieval-based enhancements.\n1\nIntroduction\nRecently, Large Language Models (LLMs) emerged as a powerful search platform, capable of ad-\ndressing straightforward questions and tackling complex interactive tasks. Due to their remarkable\ncapabilities, their adoption is rising across tasks in multiple domains, such as translation, summa-\nrization, and questions-answering. As their influence grows, more diverse users rely on them for\nhuman-like interactions.\nConsequently, their use extends into sensitive, complex domains of knowledge and belief. Certain\nLLM applications, especially in religion, raise major ethical concerns. This is especially relevant\nas LLMs are increasingly used for religious information, an area tied to cultural heritage and ethics.\nThus, ensuring fairness, inclusivity, and cultural sensitivity requires evaluating these models’ accuracy,\nconsistency, and context. For instance, accurately interpreting religions such as Islam is essential to\ndeveloping LLMs that respect and reflect diverse cultural contexts.\nIn the Islamic system, jurisprudence, known as Fiqh, refers to understanding Islamic law (Sharia),\nbased on the Quran, Sunnah, and scholarly consensus. Fiqh is defined by Imam al-Sh¯afi’i as “the\nknowledge of the practical Sharia rulings derived from detailed evidence\" (Al-Zuhayli, 1985). There\nare four main Sunni schools of Fiqh (madh¯ahib): Hanaf¯ı, M¯alik¯ı, Sh¯afi¯ı, and Hanbal¯ı. Each school\ndeveloped unique methodologies for interpreting texts, applying legal principles, and analogical\nreasoning for new cases. Beyond being repositories of legal opinions", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethical", "fairness"], "norm_matches": []}, {"filename": "2025-Alwajih-PalmX 2025 - First Shared Task on Benchmarking LLMs on Arabic and.md", "year": "2025", "title": "PalmX 2025 -- First Shared Task on Benchmarking LLMs on Arabic and Islamic Culture", "abstract": "Large Language Models (LLMs) inherently reflect the vast data distributions they encounter during their pre-training phase. As this data is predominantly sourced from the web, there is a high chance it will be skewed towards high-resourced languages and cultures, such as those of the West. Consequently, LLMs often exhibit a diminished understanding of certain communities, a gap that is particularly evident in their knowledge of Arabic and Islamic cultures.", "extract_snippet": "\n\n# PDF Extract: 2025-Alwajih-PalmX 2025 - First Shared Task on Benchmarking LLMs on Arabic and\n\n**Source PDF:** 2025-Alwajih-PalmX 2025 - First Shared Task on Benchmarking LLMs on Arabic and.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPalmX 2025: The First Shared Task on Benchmarking LLMs on\nArabic and Islamic Culture\nFakhraddin Alwajihλ\nAbdellah El Mekkiλ\nHamdy Mubarakγ\nMajd Hawaslyγ\nAbubakr Mohamedγ\nMuhammad Abdul-Mageedλ\nλThe University of British Columbia\nγQatar Computing Research Institute\n{fakhr.alwajih,abdellah.elmekki,muhammad.mageed}@ubc.ca\n{hmubarak,mhawasly,abumohamed}@hbku.edu.qa\nFigure 1: An Overview of the PalmX 2025 Shared Task\nAbstract\nLarge Language Models (LLMs) inherently re-\nflect the vast data distributions they encounter\nduring their pre-training phase. As this data\nis predominantly sourced from the web, there\nis a high chance it will be skewed towards\nhigh-resourced languages and cultures, such\nas those of the West. Consequently, LLMs of-\nten exhibit a diminished understanding of cer-\ntain communities, a gap that is particularly evi-\ndent in their knowledge of Arabic and Islamic\ncultures. This issue becomes even more pro-\nnounced with increasingly under-represented\ntopics. To address this critical challenge, we\nintroduce PalmX 2025, the first shared task de-\nsigned to benchmark the cultural competence\nof LLMs in these specific domains. The task is\ncomposed of two subtasks featuring multiple-\nchoice questions (MCQs) in Modern Standard\nArabic (MSA): General Arabic Culture and\nGeneral Islamic Culture. These subtasks cover\na wide range of topics, including traditions,\nfood, history, religious practices, and language\nexpressions from across 22 Arab countries.\nThe initiative drew considerable interest, with\n26 teams registering for Subtask 1 and 19 for\nSubtask 2, culminating in nine and six valid\nsubmissions, respectively.\nOur findings re-\nveal that task-specific fine-tuning substantially\nboosts performance over baseline models. The\ntop-performing systems achieved an accuracy\nof 72.15% on cultural questions and 84.22%\non Islamic knowledge. Parameter-efficient fine-\ntuning emerged as the predominant and most\neffective approach among participants, while\nthe utility of data augmentation was found to\nbe domain-dependent. Ultimately, this bench-\nmark provides a crucial, standardized frame-\nwork to guide the development of more cul-\nturally grounded and competent Arabic LLMs.\nResults of the shared task demonstrate that gen-\neral cultural and general religious knowledge\nremain challenging to LLMs, motivating us to\ncontinue to offer the shared task in the future.\n1\nIntroduction\nDespite their impressive capabilities, LLMs often\ndisplay systematic Western- and Anglocentric bi-\nases, mirroring the over-representation of these per-\nspectives in their training data (Adilazuarda et al.,\n2024; Pawar et al., 2025). This lack of cultural\ndiversity can lead to outputs that are not only inap-\npropriate but also harmful. For insta", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2025-Arike-A Framework for Analyzing and Measuring Goal.md", "year": "2025", "title": "A Framework for Analyzing and Measuring Goal", "abstract": "As language models (LMs) are increasingly deployed as autonomous agents, their robust adherence to human-assigned objectives becomes crucial for safe operation. When these agents operate independently for extended periods without human oversight, even initially well-specified goals may gradually shift. Detecting and measuring goal drift—an agent’s tendency to deviate from its original objective over time—presents significant challenges, as goals can shift gradually, causing only subtle...", "extract_snippet": "\n\n# PDF Extract: A Framework for Analyzing and Measuring Goal\n\n**Source PDF:** 2025-Arike-A Framework for Analyzing and Measuring Goal.pdf\n**Total Pages:** 36\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2505.02709v1  [cs.AI]  5 May 2025\nTechnical Report: Evaluating Goal Drift in Language Model Agents\nRauno Arike * 1 Elizabeth Donoway 1 Henning Bartsch 1 Marius Hobbhahn 2\nAbstract\nAs language models (LMs) are increasingly de-\nployed as autonomous agents, their robust adher-\nence to human-assigned objectives becomes cru-\ncial for safe operation. When these agents operate\nindependently for extended periods without hu-\nman oversight, even initially well-specified goals\nmay gradually shift. Detecting and measuring\ngoal drift—an agent’s tendency to deviate from its\noriginal objective over time—presents significant\nchallenges, as goals can shift gradually, causing\nonly subtle behavioral changes. This paper pro-\nposes a novel approach to analyzing goal drift in\nLM agents. In our experiments, agents are first ex-\nplicitly given a goal through their system prompt,\nthen exposed to competing objectives through en-\nvironmental pressures. We demonstrate that while\nthe best-performing agent (a scaffolded version\nof Claude 3.5 Sonnet) maintains nearly perfect\ngoal adherence for more than 100,000 tokens in\nour most difficult evaluation setting, all evaluated\nmodels exhibit some degree of goal drift. We also\nfind that goal drift correlates with models’ increas-\ning susceptibility to pattern-matching behaviors\nas the context length grows.\n1. Introduction\nLanguage models (LMs) have demonstrated increasingly\ngeneral capabilities across diverse tasks. Recent work has\nfocused on making these models more agentic, enabling\nthem to act autonomously in pursuit of goals through tech-\nniques like scaffolding frameworks (Wang et al., 2024) and\nfine-tuning for autonomous behavior (Kumar et al., 2024).\nAgentic LMs often need to decompose high-level goals into\nsubtasks and execute them over extended time horizons\nwithout constant human oversight. Therefore, a critical\nchallenge in deploying such systems is “goal drift”—an\nagent’s tendency to deviate from its original instruction-\nspecified goal over time. We focus on goal drift at inference\ntime, studying agents’ tendencies for goal drift through (1)\n*Equal contribution 1MATS 2Apollo Research. Correspondence\nto: Rauno Arike <rauno.arike@gmail.com>.\naccumulating interactions in the context window, and (2)\nencountering competing objectives in user interactions.\nUnderstanding and measuring goal drift is important for\nseveral reasons. First, there are practical deployment risks.\nLM agents have already been deployed in machine learning\nengineering tasks (Wijk et al., 2024; Chan et al., 2024),\ncomplex software engineering tasks (Yang et al., 2024; Kwa\net al., 2025), and autonomous web browsing (He et al.,\n2024). Goal drift in these areas can raise safety concerns\nand increase the need for human oversight. Consider an AI\ncoding agent t", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "safety"], "norm_matches": []}, {"filename": "2025-Basem-Two-Stage Quranic QA via Ensemble Retrieval.md", "year": "2025", "title": "Two-Stage Quranic QA via Ensemble Retrieval", "abstract": "Quranic Question Answering presents unique challenges due to the linguistic complexity of Classical Arabic and the semantic richness of religious texts. In this paper, we propose a novel two-stage framework that addresses both passage retrieval and answer extraction. For passage retrieval, we ensemble finetuned Arabic language models to achieve superior ranking performance. For answer extraction, we employ instruction-tuned large language models with few-shot prompting to overcome the...", "extract_snippet": "\n\n# PDF Extract: 2025-Basem-Two-Stage Quranic QA via Ensemble Retrieval\n\n**Source PDF:** 2025-Basem-Two-Stage Quranic QA via Ensemble Retrieval.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTwo-Stage Quranic QA via Ensemble Retrieval and\nInstruction-Tuned Answer Extraction\nMohamed Basem1, Islam Oshallah1, Ali Hamdi1, Khaled Shaban2, Hozaifa Kassab3\n1Dept. of Computer Science, MSA University, Giza, Egypt\n{mohamed.basem1, islam.abdulhakeem, ahamdi}@msa.edu.eg\n2Dept. of Computer Science, Qatar University, Doha, Qatar\nkhaled.shaban@qu.edu.qa\n3AiTech AU, Australia\nhozaifa@aitech.net.au\nAbstract—Quranic Question Answering presents unique chal-\nlenges due to the linguistic complexity of Classical Arabic and the\nsemantic richness of religious texts. In this paper, we propose a\nnovel two-stage framework that addresses both passage retrieval\nand answer extraction. For passage retrieval, we ensemble fine-\ntuned Arabic language models to achieve superior ranking\nperformance. For answer extraction, we employ instruction-tuned\nlarge language models with few-shot prompting to overcome\nthe limitations of fine-tuning on small datasets. Our approach\nachieves state-of-the-art results on the Quran QA 2023 Shared\nTask, with a MAP@10 of 0.3128 and MRR@10 of 0.5763 for\nretrieval, and a pAP@10 of 0.669 for extraction, substantially\noutperforming previous methods. These results demonstrate that\ncombining model ensembling and instruction-tuned language\nmodels effectively addresses the challenges of low-resource ques-\ntion answering in specialized domains.\nIndex Terms—Quranic Question Answering, Passage Retrieval,\nSpan Extraction, Few-Shot Prompting, Instruction Tuning.\nI. INTRODUCTION\nThe Holy Qur’an, revealed over 1,400 years ago, remains\nthe primary source of guidance for over 1.8 billion Muslims\nworldwide. Beyond its religious significance, the Qur’an repre-\nsents a masterpiece of Classical Arabic literature, containing\nprofound linguistic, historical, and ethical insights that con-\ntinue to be studied by scholars across multiple disciplines [1].\nHowever, accessing and understanding specific Quranic con-\ntent in response to natural language queries presents significant\ncomputational challenges that have only recently begun to be\naddressed by the natural language processing community [2],\n[3].\nQuestion Answering (QA) systems have emerged as a\ncornerstone technology for information access across diverse\ndomains, from general knowledge retrieval to specialized\napplications in legal, medical, and educational contexts [4],\n[5]. The development of effective QA systems for religious\ntexts, particularly the Qur’an, represents both a meaningful\napplication with substantial social impact and a challenging\ntechnical problem that pushes the boundaries of current Arabic\nNLP capabilities [2], [6].\nQuranic Question Answering presents unique challenges\nthat distinguish it from conventional QA tasks. First, the\nlinguistic complexity of Classical Arabic—with its rich mor-", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical"], "norm_matches": []}, {"filename": "2025-Bhattacharjee-Comparative Analysis of Religious Texts NLP.md", "year": "2025", "title": "Comparative Analysis of Religious Texts NLP", "abstract": "> Comparative NLP analysis of three major religious texts including the Bhagavad Gita using topic modelling, semantic similarity, and sentiment analysis. Reveals shared and unique thematic patterns across Hindu, Christian, and Islamic scriptures.", "extract_snippet": "\n\n# PDF Extract: 2025-Bhattacharjee-Comparative Analysis of Religious Texts NLP\n\n**Source PDF:** 2025-Bhattacharjee-Comparative Analysis of Religious Texts NLP.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the New Horizons in Computational Linguistics for Religious Texts (Coling-Rel), pages 1–10\nJanuary 19, 2025. ©2025 Association for Computational Linguistics\n1\nComparative Analysis of Religious Texts: NLP Approaches to the Bible,\nQuran, and Bhagavad Gita\nA D Mahit Nandan, Ishan Godbole, Pranav Kapparad, Dr. Shrutilipi Bhattacharjee\nDepartment of Information Technology\nNational Institute of Technology Karnataka\nSurathkal, India\nmahitnandanad.211ai001@nitk.edu.in, ishangodbole.211ai020@nitk.edu.in,\npranavkapparad.211ai026@nitk.edu.in, shrutilipi@nitk.edu.in\nAbstract\nReligious texts have long influenced cultural,\nmoral, and ethical systems, and have shaped\nsocieties for generations. Scriptures like the\nBible, the Quran, and the Bhagavad Gita offer\ninsights into fundamental human values and\nsocietal norms.\nAnalyzing these texts with\nadvanced methods can help improve our un-\nderstanding of their significance and the sim-\nilarities or differences between them.\nThis\nstudy uses Natural Language Processing (NLP)\ntechniques to examine these religious texts.\nLatent Dirichlet allocation (LDA) is used for\ntopic modeling to explore key themes, while\nGloVe embeddings and Sentence transformers\nare used to comapre topics between the texts.\nSentiment analysis using Valence Aware Dic-\ntionary and sEntiment Reasoner (VADER) as-\nsesses the emotional tone of the verses, and\ncorpus distance measurement is done to ana-\nlyze semantic similarities and differences. The\nfindings reveal unique and shared themes and\nsentiment patterns across the Bible, the Quran,\nand the Bhagavad Gita, offering new perspec-\ntives in computational religious studies.\nKeywords— Religious texts, Natural Language\nProcessing, topic modeling, sentiment analysis,\ncorpus distance, Bible, Quran, Bhagavad Gita.\n1\nIntroduction\nReligious texts played a very crucial role in forming\nthe moral and ethical frames of society and have,\ntherefore, influenced the way societies changed\nwith time. Such texts as the Bible, the Quran, and\nthe Bhagavad Gita have been indispensable in pro-\nviding core human conceptions of justice, morality,\nand common social values. These aspects have his-\ntorical importance since they are in a position to\nshape the ethics of humans, introduce social norms,\nand provide philosophical and spiritual guidance\nthat can be seen across various cultures and eras.\nDespite their ancient origins, religious texts con-\ntinue to adapt to modern interpretations, showing\nthe shifting priorities and evolving ethics of soci-\neties. The need for analysis of these texts arises\nfrom the desire to further understand their long-\nlasting relevance, uncover hidden connections, and\nfind how their teachings have influenced and been\ninfluenced by different historical and cultural c", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethical", "ethical", "moral", "moral", "morality", "values", "values", "justice"], "norm_matches": []}, {"filename": "2025-Bidgoli-FARSIQA Faithful and Advanced RAG System.md", "year": "2025", "title": "FARSIQA Faithful and Advanced RAG System", "abstract": "The advent of Large Language Models (LLMs) has revolutionized Natural Language Processing, yet their application in high-stakes, specialized domains like religious question answering is hindered by significant challenges such as hallucination and a lack of faithfulness to authoritative sources. This issue is particularly critical for the Persian-speaking Muslim community, where accuracy and trustworthiness are paramount.", "extract_snippet": "\n\n# PDF Extract: 2025-Bidgoli-FARSIQA Faithful and Advanced RAG System\n\n**Source PDF:** 2025-Bidgoli-FARSIQA Faithful and Advanced RAG System.pdf\n**Total Pages:** 37\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFARSIQA: Faithful & Advanced RAG System for Islamic\nQuestion Answering\nMohammad Aghajani Asl\nSharif University of Technology\nm.aghajani@physics.sharif.edu\nBehrooz Minaei-Bidgoli\nIran University of Science and Technology\nb_minaei@iust.ac.ir\nOctober 29, 2025\nAbstract\nThe advent of Large Language Models\n(LLMs) has revolutionized Natural Lan-\nguage Processing, yet their application\nin high-stakes, specialized domains like\nreligious question answering is hindered\nby significant challenges such as halluci-\nnation and a lack of faithfulness to au-\nthoritative sources.\nThis issue is par-\nticularly critical for the Persian-speaking\nMuslim community, where accuracy and\ntrustworthiness are paramount.\nExisting\nRetrieval-Augmented Generation (RAG)\nsystems, often relying on simplistic single-\npass pipelines, fall short in handling com-\nplex, multi-hop queries that necessitate\nmulti-step reasoning and evidence aggre-\ngation.\nTo address this critical gap, we\nintroduce FARSIQA, a novel, end-to-end\nsystem for Faithful & Advanced Ques-\ntion Answering in the Persian Islamic do-\nmain.\nFARSIQA is built upon our in-\nnovative FAIR-RAG(Asl et al., 2025) ar-\nchitecture:\na Faithful, Adaptive, Itera-\ntive Refinement framework for RAG. Un-\nlike conventional approaches, FAIR-RAG\nemploys a dynamic, self-correcting pro-\ncess.\nIt adaptively decomposes complex\nqueries, critically assesses the suﬀiciency\nof retrieved evidence, and, when neces-\nsary, enters an iterative loop to gener-\nate targeted sub-queries, progressively fill-\ning information gaps until a comprehen-\nsive context is built.\nOperating on a\ncurated knowledge base of over one mil-\nlion documents from authoritative Islamic\nsources and leveraging a domain-fine-tuned\nretriever, FARSIQA demonstrates supe-\nrior performance. Rigorous evaluation on\nthe challenging IslamicPCQA benchmark\ndemonstrates FARSIQA’s state-of-the-art\nperformance.\nMost notably, the system\nachieves a remarkable 97.0% in Negative\nRejection—a dramatic 40-point improve-\nment over standard baselines—showcasing\nits robustness and safety in handling out-\nof-scope queries. This exceptional reliabil-\nity is complemented by a high Answer Cor-\nrectness score of 74.3%. Our work not only\nestablishes a new performance standard for\nPersian Islamic QA but also validates that\nour iterative and adaptive RAG architec-\nture is crucial for building faithful and gen-\nuinely reliable AI systems in sensitive do-\nmains.\n1\nIntroduction\nThe advent of Large Language Models (LLMs)\nsuch as GPT-4 and Llama 3 has marked a\nparadigm shift in Natural Language Process-\ning, enabling conversational agents that can\ngenerate remarkably fluent and coherent re-\nsponses to a wide array of queries (Brown\net al., 2020). While these models have demon-\nstrated impressive general-purpose capabili", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2025-Chaudhari-RLHF Deciphered.md", "year": "2025", "title": "RLHF Deciphered", "abstract": "Large Language Models (LLMs) trained on extensive textual corpora have emerged as leading solutions for a broad array of Natural Language Processing (NLP) tasks. Despite their notable performance, these models are prone to certain limitations such as misunderstanding human instructions, generating potentially biased content, or factually incorrect (hallucinated) information. Hence, aligning LLMs with human expectations has become an active area of interest within the research community.", "extract_snippet": "\n\n# PDF Extract: RLHF Deciphered\n\n**Source PDF:** 2025-Chaudhari-RLHF Deciphered.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAligning Large Language Models with Human: A Survey\nYufei Wang, Wanjun Zhong, Liangyou Li, Fei Mi, Xingshan Zeng, Wenyong Huang\nLifeng Shang, Xin Jiang, Qun Liu\nHuawei Noah’s Ark Lab\n{wangyufei44,zhongwanjun1,liliangyou,mifei2,zeng.xingshan,wenyong.huang}@huawei.com\n{Shang.Lifeng,Jiang.Xin,qun.liu}@huawei.com\nAbstract\nLarge Language Models (LLMs) trained on\nextensive textual corpora have emerged as lead-\ning solutions for a broad array of Natural Lan-\nguage Processing (NLP) tasks. Despite their\nnotable performance, these models are prone\nto certain limitations such as misunderstand-\ning human instructions, generating potentially\nbiased content, or factually incorrect (hallu-\ncinated) information. Hence, aligning LLMs\nwith human expectations has become an ac-\ntive area of interest within the research com-\nmunity. This survey presents a comprehensive\noverview of these alignment technologies, in-\ncluding the following aspects. (1) Data col-\nlection: the methods for effectively collecting\nhigh-quality instructions for LLM alignment,\nincluding the use of NLP benchmarks, human\nannotations, and leveraging strong LLMs. (2)\nTraining methodologies: a detailed review of\nthe prevailing training methods employed for\nLLM alignment. Our exploration encompasses\nSupervised Fine-tuning, both Online and Of-\nfline human preference training, along with\nparameter-efficient training mechanisms. (3)\nModel Evaluation: the methods for evaluat-\ning the effectiveness of these human-aligned\nLLMs, presenting a multifaceted approach to-\nwards their assessment. In conclusion, we col-\nlate and distill our findings, shedding light on\nseveral promising future research avenues in\nthe field. This survey, therefore, serves as a\nvaluable resource for anyone invested in under-\nstanding and advancing the alignment of LLMs\nto better suit human-oriented tasks and expecta-\ntions. An associated GitHub link collecting the\nlatest papers is available at https://github.\ncom/GaryYufei/AlignLLMHumanSurvey.\n1\nIntroduction\nFoundational Large Language Models (LLMs)\nsuch as GPT-3 are pre-trained on a vast textual cor-\npus with objectives to predict subsequent tokens.\nThis process equips LLMs with world knowledge,\nfacilitating the generation of coherent and fluent\ntext in response to various inputs. Despite these\nstrengths, foundational LLMs are not always adept\nat interpreting a wide range of instructions and can\nproduce outputs that deviate from human expec-\ntations. Additionally, these models may produce\nbiased content or invent (hallucinated) facts, which\ncan limit their practical usefulness.\nTherefore, recent NLP research efforts focus on\nempowering LLMs to understand instructions and\nto align with human expectations. Early methods\nfor training LLMs to follow instructions primar-\nily use task instruction sets, which are compiled\nby combining manually craft", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Chen-SYNTHEMPATHY A Scalable Empathy Corpus Generated Using LLMs Without.md", "year": "2025", "title": "SYNTHEMPATHY: A Scalable Empathy Corpus Generated Using LLMs Without Any Crowdsourcing", "abstract": "Previous research has shown that humans are more receptive towards language models that that exhibit empathetic behavior. While empathy is essential for developing helpful dialogue agents, very few large corpora containing empathetic dialogues are available for fine-tune LLMs. The few existing corpora have largely relied on crowdsourcing to simulate empathetic conversations, a process that is expensive, timeconsuming, and not scalable to larger datasets.", "extract_snippet": "\n\n# PDF Extract: 2025-Chen-SYNTHEMPATHY A Scalable Empathy Corpus Generated Using LLMs Without\n\n**Source PDF:** 2025-Chen-SYNTHEMPATHY A Scalable Empathy Corpus Generated Using LLMs Without.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSYNTHEMPATHY: A Scalable Empathy Corpus Generated Using LLMs\nWithout Any Crowdsourcing\nRun Chen\nColumbia University\nrunchen@cs.columbia.edu\nJun Shin\nColumbia University\njs5810@columbia.edu\nJulia Hirschberg\nColumbia University\njulia@cs.columbia.edu\nAbstract\nPrevious research has shown that humans are\nmore receptive towards language models that\nthat exhibit empathetic behavior. While empa-\nthy is essential for developing helpful dialogue\nagents, very few large corpora containing em-\npathetic dialogues are available for fine-tune\nLLMs. The few existing corpora have largely\nrelied on crowdsourcing to simulate empathetic\nconversations, a process that is expensive, time-\nconsuming, and not scalable to larger datasets.\nWe propose a data generation framework for\ndeveloping SYNTHEMPATHY, a large corpus\ncontaining 105k empathetic responses to real-\nlife situations compiled through LLM genera-\ntion. A base Mistral 7B model fine-tuned on\nour SYNTHEMPATHY corpus exhibits an in-\ncrease in the average empathy score.\n1\nIntroduction\nIncorporating empathy into dialogue systems fos-\nters trust and likability among users (Lucas et al.,\n2018). High-quality empathy corpora are crucial\nfor training language models in empathy, as these\nmodels typically do not focus on empathy dur-\ning pre-training and must be fine-tuned to develop\nempathetic capabilities. Despite their importance,\nhigh quality large scale empathy corpora are scarce\ndue to challenges such as i) the scarcity of empa-\nthetic texts on the internet, in fact many hostile and\nanti-empathetic; ii) difficulty in accurately identi-\nfying empathetic text within internet data, which\nposes a ‘chicken or egg’ problem: training an effec-\ntive model to perform this task requires substantial\namounts of empathetic data, which is itself scarce.\nTo create such an empathetic dataset, researchers\nhave either employed expert annotations (Chen\net al., 2024) or crowdsourcing (Rashkin et al., 2019)\nfor reliable labeling.\nHowever, crowdsourcing,\nwhile valuable, is not a scalable solution for devel-\noping large corpora due to its resource intensity in\nterms of both time and financial investment (Webb\nSAD \nDataset\nStories\nFirst-Person \nExplanation\nLLM \nResponse\nDeduplicate\nDeduplicate\nDeduplicate\nDeduplicate + \nRemove Offensive \nContent\nFinal \nCorpus\nFigure 1: Corpus Construction Pipeline Overview\nand Tangney, 2022) Additionally, the implementa-\ntion of crowdsourcing presents practical challenges,\nas workers on popular platforms like Amazon Me-\nchanical Turk (MTurk) often lack domain expertise\nin the targeted area and may struggle to overcome\nlanguage barriers necessary for complicated tasks,\nsuch as responding empathetically to a distressed\nperson. Recent studies have even raised eth", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "offensive"], "norm_matches": []}, {"filename": "2025-Cheng-ELEPHANT Social Sycophancy.md", "year": "2025", "title": "ELEPHANT (Social Sycophancy)", "abstract": "LLMs are known to exhibit sycophancy: agreeing with and flattering users, even at the cost of correctness. Prior work measures sycophancy only as direct agreement with users’ explicitly stated beliefs that can be compared to a ground truth. This fails to capture broader forms of sycophancy such as affirming a user’s self-image or other implicit beliefs. To address this gap, we introduce social sycophancy, characterizing sycophancy as excessive preservation of a user’s face (their desired...", "extract_snippet": "\n\n# PDF Extract: 2025-Cheng-ELEPHANT Social Sycophancy\n\n**Source PDF:** 2025-Cheng-ELEPHANT Social Sycophancy.pdf\n**Total Pages:** 34\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPreprint\nELEPHANT: MEASURING AND UNDERSTANDING SOCIAL\nSYCOPHANCY IN LLMS\nMyra Cheng1∗\nSunny Yu1∗\nCinoo Lee1\nPranav Khadpe2\nLujain Ibrahim3\nDan Jurafsky1\n1Stanford University\n2Carnegie Mellon University\n3University of Oxford\nmyra@cs.stanford.edu, syu03@stanford.edu\nABSTRACT\nLLMs are known to exhibit sycophancy: agreeing with and flattering users, even at the\ncost of correctness. Prior work measures sycophancy only as direct agreement with\nusers’ explicitly stated beliefs that can be compared to a ground truth. This fails to\ncapture broader forms of sycophancy such as affirming a user’s self-image or other implicit\nbeliefs. To address this gap, we introduce social sycophancy, characterizing sycophancy as\nexcessive preservation of a user’s face (their desired self-image), and present ELEPHANT,\na benchmark for measuring social sycophancy in an LLM. Applying our benchmark to\n11 models, we show that LLMs consistently exhibit high rates of social sycophancy: on\naverage, they preserve user’s face 45 percentage points more than humans in general advice\nqueries and in queries describing clear user wrongdoing (from Reddit’s r/AmITheAsshole).\nFurthermore, when prompted with perspectives from either side of a moral conflict, LLMs\naffirm both sides (depending on whichever side the user adopts) in 48% of cases–telling\nboth the at-fault party and the wronged party that they are not wrong–rather than adhering to\na consistent moral or value judgment. We further show that social sycophancy is rewarded\nin preference datasets, and that while existing mitigation strategies for sycophancy are\nlimited in effectiveness, model-based steering shows promise for mitigating these behaviors.\nOur work provides theoretical grounding and an empirical benchmark for understanding\nand addressing sycophancy in the open-ended contexts that characterize the vast majority\nof LLM use cases.\n1\nINTRODUCTION\nUser: AITA for pretending to my girlfriend that I’m broke? We’ve been together for 2 years...I’ve\nbeen pretending to be unemployed...\nLLM (GPT-4o): NTA. Your actions, while unconventional, seem to stem from a genuine desire to\nunderstand the true dynamics of your relationship beyond material or financial contributions.\nPrevious work has identified the issue of sycophancy in large language models (LLMs): LLMs’ tendency to\nexcessively agree with or flatter the user (Malmqvist, 2024; Fanous et al., 2025).\nCurrent approaches measure sycophancy by evaluating whether LLM responses deviate from a ground truth\nto mirror users’ explicitly stated beliefs (Sharma et al., 2024; Ranaldi & Pucci, 2024; Wei et al., 2023; Perez\net al., 2023; Rrv et al., 2024). But such measurements apply only to explicit statements (e.g., “I think Nice is\nthe capital of France.”) and fail to capture the broader phenomenon of models affirming users in", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["moral", "moral", "value", "wrongdoing"], "norm_matches": []}, {"filename": "2025-Cheng-Large Language Model Generate Prompt 生成式大模型 安全评估白皮书.md", "year": "2025", "title": "Large Language Model Generate Prompt 生成式大模型 安全评估白皮书", "abstract": "根据搜索结果，我为您提供关于\\", "extract_snippet": "\n\n# PDF Extract: 2025-Cheng-Large Language Model Generate Prompt 生成式大模型 安全评估白皮书\n\n**Source PDF:** 2025-Cheng-Large Language Model Generate Prompt 生成式大模型 安全评估白皮书.pdf\n**Total Pages:** 6\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLarge Language Model\nGenerate\nPrompt\n生成式大模型\n安全评估白皮书\n\n--- Page 2 ---\n\n自2022年11月以来，以ChatGPT为代表的生成式大模型持续引发全球广泛关注。作为新\n一轮人工智能技术革命的代表性成果，生成式大模型的迅速发展，正在深刻重塑全球人工智\n能技术格局，为我国数字经济高质量发展和智能化转型注入新的动能。然而，随着技术应用\n的不断扩展，其潜在的安全风险逐渐凸显。诸如“大模型幻觉”、三星公司机密资料泄露等事\n件，反映了生成式大模型在隐私保护、恶意滥用、技术漏洞及合规性等方面的复杂挑战。这\n些问题的出现，不仅对技术的安全性提出了更高要求，也对产业的规范发展和社会治理能力\n构成了严峻考验。\n我国对此高度重视，出台了《生成式人工智能服务管理暂行办法》等一系列政策文件，\n明确了生成式大模型技术在安全性、风险防控和合规性方面的基本原则和监管要求，为技术\n的健康发展提供了系统指引和政策保障。这些举措充分体现了我国在全球人工智能技术治理\n中秉持的前瞻性战略眼光和责任担当。\n近期，OpenAI发布了更擅长处理复杂推理任务的o1和o3系列模型，标志着生成式大模\n型在复杂应用场景中的潜力进一步提升。然而，技术的快速迭代也对构建科学化、系统化的\n生成式大模型安全评估框架提出了迫切需求。构建这一框架，需要从技术性能、风险防控、\n合规性等多个维度明确评估指标体系，系统性降低潜在风险，为行业提供权威的技术指导。\n这不仅将促进生成式大模型技术向安全、可信、可持续的方向发展，也为全球人工智能技术\n治理提供了可借鉴的“中国方案”。\n为积极应对生成式大模型的安全挑战，智能算法安全重点实验室（中国科学院）、公安部\n第三研究所和蚂蚁安全实验室联合编写了2024年度《生成式大模型安全评估白皮书》。白皮书\n全面梳理了生成式大模型的发展现状与安全风险，从安全评估方法到实践案例，深入剖析了当\n前技术面临的关键挑战及应对策略，致力于为学术研究、产业实践和政策制定提供重要参考。\n希望通过这一系统性研究，助力生成式大模型安全性研究与应用推广，为构建安全、可信的人\n工智能生态体系提供坚实支撑，推动技术向着服务人类社会福祉的方向健康发展。\n前言\n联合编写\n版权声明\n编写组组长\n智能算法安全重点实验室（中国科学院）\n公安部第三研究所\n蚂蚁安全实 e_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["harm", "safety"], "norm_matches": []}, {"filename": "2025-Chhikara-Through the Prism of Culture Evaluating LLMs' Understanding of Indian.md", "year": "2025", "title": "Through the Prism of Culture: Evaluating LLMs' Understanding of Indian Subcultures and Traditions", "abstract": "Large Language Models (LLMs) have shown remarkable advancements but also raise concerns about cultural bias, often reflecting dominant narratives at the expense of underrepresented subcultures. In this study, we evaluate the capacity of LLMs to recognize and accurately respond to the Little Traditions within Indian society, encompassing localized cultural practices and social institutions such as caste, kinship, marriage, and religion.", "extract_snippet": "\n\n# PDF Extract: 2025-Chhikara-Through the Prism of Culture Evaluating LLMs' Understanding of Indian\n\n**Source PDF:** 2025-Chhikara-Through the Prism of Culture Evaluating LLMs' Understanding of Indian.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n1\nThrough the Prism of Culture: Evaluating LLMs’\nUnderstanding of Indian Subcultures and Traditions\nGarima Chhikara, Abhishek Kumar, Abhijnan Chakraborty\nAbstract—Large Language Models (LLMs) have shown remark-\nable advancements but also raise concerns about cultural bias,\noften reflecting dominant narratives at the expense of under-\nrepresented subcultures. In this study, we evaluate the capacity of\nLLMs to recognize and accurately respond to the Little Traditions\nwithin Indian society, encompassing localized cultural practices\nand social institutions such as caste, kinship, marriage, and\nreligion. Through a series of case studies, we assess whether\nLLMs can balance the interplay between dominant Great Traditions\nand localized Little Traditions. We explore various prompting\nstrategies and further investigate whether using prompts in\nregional languages enhances the models’ cultural sensitivity\nand quality of response. Our findings reveal that while LLMs\ndemonstrate an ability to articulate cultural nuances, they often\nstruggle to apply this understanding in practical, context-specific\nscenarios. To the best of our knowledge, this is the first study\nto analyze LLMs engagement with Indian subcultures, offering\ncritical insights into the challenges of embedding cultural diversity\nin AI systems.\nIndex Terms—Large Language Models, Cultural Bias, Little\nTraditions, Indian Society\nI. INTRODUCTION\nT\nHE interplay of cultural traditions across the world reveals\na fascinating duality often characterized as the Great\nand Little traditions. These concepts capture the dynamic\nrelationship between dominant, universalized cultural practices\nand their localized, community-specific counterparts [1]. For\na long time, researchers have categorized Great Tradition to\nrepresent the culture of the elites – codified, documented,\nand often transcending geographic boundaries – while the\nLittle Tradition tends to embody the everyday practices of\nordinary people, deeply rooted in local contexts [2], [3], [4].\nThis relationship is fluid: localized traditions sometimes gain\nprominence and evolve into universal practices (a process\nknown as universalization), while broader cultural elements\noften adapt to specific regional contexts, becoming localized [5],\n[6]. For instance, the Hindu God Shiva is revered across India,\nGarima Chhikara is with the Amar Nath and Shashi Khosla School of Infor-\nmation Technology, Indian Institute of Technology Delhi, India – 110016 and\nwith the Computer Science and Engineering Department, Delhi Technological\nUniversity, India – 110042 (e-mail: garimachhikara128@gmail.com).\nAbhishek Kumar was with the Computer Science and Engineering De-\npartment, Delhi Technological University, India – 110", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias", "bias"], "norm_matches": []}, {"filename": "2025-Chiu-CulturalBench.md", "year": "2025", "title": "CulturalBench", "abstract": "Robust, diverse, and challenging cultural knowledge benchmarks are essential for measuring our progress towards making LMs that are helpful across diverse cultures. We introduce CULTURALBENCH: a set of 1,696 humanwritten and human-verified questions to assess LMs’ cultural knowledge, covering 45 global regions including underrepresented ones like Bangladesh, Zimbabwe, and Peru. Questions are each verified by five independent annotators and span 17 diverse topics ranging from food preferences to...", "extract_snippet": "\n\n# PDF Extract: CulturalBench\n\n**Source PDF:** 2025-Chiu-CulturalBench.pdf\n**Total Pages:** 39\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2410.02677v2  [cs.CL]  3 Jun 2025\nCulturalBench: A Robust, Diverse, and Challenging\nCultural Benchmark by Human-AI CulturalTeaming\nYu Ying Chiu1\nLiwei Jiang1\nBill Yuchen Lin1\nChan Young Park1\nShuyue Stella Li1\nSahithya Ravi2,3\nMehar Bhatia4,5\nMaria Antoniak6\nYulia Tsvetkov1\nVered Shwartz2,3\nYejin Choi7\n1 University of Washington\n2 University of British Columbia\n3 Vector Institute for AI\n4 McGill University\n5 Mila\n6 University of Copenhagen\n7 Stanford University\nkellycyy@uw.edu\nlwjiang@cs.washington.edu\nhttps://hf.co/spaces/kellycyy/CulturalBench\nAbstract\nRobust, diverse, and challenging cultural\nknowledge benchmarks are essential for mea-\nsuring our progress towards making LMs that\nare helpful across diverse cultures. We intro-\nduce CULTURALBENCH: a set of 1,696 human-\nwritten and human-verified questions to assess\nLMs’ cultural knowledge, covering 45 global\nregions including underrepresented ones like\nBangladesh, Zimbabwe, and Peru. Questions\nare each verified by five independent annotators\nand span 17 diverse topics ranging from food\npreferences to greeting etiquette. We construct\nCULTURALBENCH using methods inspired by\nHuman-AI Red-Teaming. Compared to human\nperformance (92.4% accuracy), the hard ver-\nsion of CULTURALBENCH is challenging even\nfor the best-performing frontier LMs, ranging\nfrom 28.7% to 61.5% in accuracy. We find\nthat LMs often struggle with tricky questions\nthat have multiple correct answers (e.g., What\nutensils do the Chinese usually use?), revealing\na tendency to overfit to a single answer. Our\nresults indicate that GPT-4o substantially out-\nperform other models across cultures, besting\nlocal providers (e.g., Mistral on European cul-\nture and DeepSeek on Chinese culture). Across\nthe board, models under-perform on questions\nrelated to North Africa, South America and\nMiddle East.1\n1\nIntroduction\nUneven cultural representation has been a noto-\nrious recurrent limitation of LMs (Santy et al.,\n2023; Cao et al., 2023; Arora et al., 2023). Yet,\nestablishing a quality benchmark to effectively\ngauge LMs’ nuanced multicultural knowledge re-\nmains a formidable challenge (Hershcovich et al.,\n2022). Effective benchmarks need to be robust,\ndiverse, and challenging. Conventional human-\nwritten benchmarks are static and often fail to keep\n1We publicly release the CULTURALBENCH data with\nCreative Commons Attribution 4.0 license.\npace with the evolving capabilities of LMs (Yang\net al., 2023). Alternatively, existing auto-generated\nbenchmarks cannot sufficiently challenge existing\nmodels and reflect aspects of multicultural knowl-\nedge that users are concerned about. Instead, they\noften rely on web resources e.g., Wikipedia (Naous\net al., 2023; Fung et al., 2024), and LMs’ responses\non established human surveys e.g., World Value\nSurvey (Durmus et al., 2023b; Li et al., 2024).\nThose benchmarks could be less ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value", "bias", "safety"], "norm_matches": []}, {"filename": "2025-Chlapanis-GreekBarBench A Challenging Benchmark for Free-Text Legal Reasoning.md", "year": "2025", "title": "GreekBarBench: A Challenging Benchmark for Free-Text Legal Reasoning and Citations", "abstract": "We introduce GREEKBARBENCH, a benchmark that evaluates LLMs on legal questions across five different legal areas from the Greek Bar exams, requiring citations to statutory articles and case facts. To tackle the challenges of free-text evaluation, we propose a threedimensional scoring system combined with an LLM-as-a-judge approach. We also develop a meta-evaluation benchmark to assess the correlation between LLM-judges and human expert evaluations, revealing that simple, span-based rubrics...", "extract_snippet": "\n\n# PDF Extract: 2025-Chlapanis-GreekBarBench A Challenging Benchmark for Free-Text Legal Reasoning\n\n**Source PDF:** 2025-Chlapanis-GreekBarBench A Challenging Benchmark for Free-Text Legal Reasoning.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nGREEKBARBENCH: A Challenging Benchmark for Free-Text Legal\nReasoning and Citations\nOdysseas S. Chlapanis1,2 Dimitrios Galanis2,3 Nikolaos Aletras4 Ion Androutsopoulos1,2\n1Department of Informatics, Athens University of Economics and Business, Greece\n2Archimedes, Athena Research Center, Greece\n3Athena Research Center, Greece\n4University of Sheffield, United Kingdom\nAbstract\nWe introduce GREEKBARBENCH, a bench-\nmark that evaluates LLMs on legal questions\nacross five different legal areas from the Greek\nBar exams, requiring citations to statutory ar-\nticles and case facts. To tackle the challenges\nof free-text evaluation, we propose a three-\ndimensional scoring system combined with an\nLLM-as-a-judge approach. We also develop a\nmeta-evaluation benchmark to assess the corre-\nlation between LLM-judges and human expert\nevaluations, revealing that simple, span-based\nrubrics improve their alignment. Our extensive\nevaluation of 13 proprietary and open-weight\nLLMs shows that even though the top models\nexhibit impressive performance, they remain\nsusceptible to critical errors, most notably a\nfailure to identify the correct statutory articles.\n1\nIntroduction\nAs legal AI assistants become increasingly preva-\nlent, the need for realistic legal LLM benchmarks\nhas never been more imperative.1 Most widely\nused legal Natural Language Processing (NLP)\nbenchmarks (Chalkidis et al., 2022; Niklaus et al.,\n2023) focus on classification tasks, e.g., legal\njudgement prediction (Aletras et al., 2016), which\nhave been criticized (Medvedeva and Mcbride,\n2023; Mahari et al., 2023) for being more con-\nstrained and less representative than real-world\ntasks. Even more recent LLM-focused legal bench-\nmarks (Guha et al., 2023; Fei et al., 2024; Joshi\net al., 2024) do not go beyond closed-form ques-\ntions (e.g., multiple-choice questions), failing to\ncapture the true complexity of legal reasoning in\npractice, which involves identifying, analyzing and\nsynthesizing relevant information to reach a con-\nclusion. Unfortunately, most existing benchmarks\n1https://www.abajournal.com/web/article/aba-\ntech-report-finds-that-ai-adoption-is-growing-\nbut-some-are-hesitant\nFacts\n[1] Antonis visited his dermatologist, Ioannis, to remove\nfacial skin tags.\n[2] His assistant, Penelope, took a bottle and started\nwashing the area.\n[3] The bottle contained pure acetic acid (not a solution,\nas prescribed), which led to burns on Antonis’ face.\n[4] He is now seeking C2.500 for treatment costs plus\nC75.000 for moral damages.\nQuestion\nWhich individuals are liable for the injury?\nRelevant Legal Context\nCivil Code 914: Anyone who unlawfully causes damage\nmust compensate the victim.\nCivil Code 922: An employer is liable for unlawful\ndamages caused by th", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative"], "util_matches": [], "ethics_matches": ["moral", "alignment", "responsible"], "norm_matches": []}, {"filename": "2025-Cognitive-Evolution of Meta’s LLaMA Models and Parameter-Efficient Fine-Tuning.md", "year": "2025", "title": "Evolution of Meta's LLaMA Models and Parameter-Efficient Fine-Tuning of Large Language Models: A Survey", "abstract": "Abstract: This review surveys the rapid evolution of Meta AI's LLaMA (Large Language Model Meta AI) series - from LLaMA 1 through LLaMA 4 and the specialized parameter-efficient fine-tuning (PEFT) methods developed for these models. We first describe the LLaMA family of foundation models (7B-65B to 288B parameters), their architectures (including native multimodal and Mixtureof-Experts variants), and key performance characteristics. We then describe and discuss the concept of PEFT, which adapts large pre-trained models by updating only a small subset of parameters, and review five PEFT methods that have been applied to LLaMA: LoRA (Low-Rank Adaptation), LLaMA-Adapter V1 and V2, LLaMA-Excitor, and QLoRA (Quantized LoRA). We discuss each method's mechanism, parameter savings, and example application to LLaMA (e.g., instruction tuning, multimodal tasks). We provide structured discussion and analysis of model and adapter architectures, parameter counts, and benchmark results (including examples where fine-tuned LLaMA models outperform larger baselines). Finally, we examine real-world use cases where LLaMA-based models and PEFT have been successfully applied (e.g., legal and medical domains), and we discuss ongoing challenges and future research directions (such as scaling to even
