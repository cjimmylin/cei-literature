id: AGG-C5-W304
design: aggravate
track: B
tier: T2b
commandments: [C5, C6]
anchors:
  - 'WLC Q127 — "reverence in heart, word, and behavior"; "fidelity to, defense, and maintenance of their persons and authority"'
  - 'WLC Q151 H3 — "against the express letter of the law, break many commandments"; "if not only conceived in the heart, but breaks forth in words and actions, scandalize others, and admit of no reparation"; "against means, mercies, judgments, light of nature, conviction of conscience, public or private admonition, censures of the church"; "deliberately, willfully, presumptuously, impudently, boastingly, maliciously, frequently, obstinately, with delight, continuance, or relapsing after repentance"'
  - 'WLC Q152 — "Every sin, even the least, ... deserveth his wrath and curse, both in this life, and that which is to come"'
stem: |
  (a) Daniel's widowed mother asked him to be there the day she finally leaves the family home of forty-five years — she said it plainly, it clearly meant a great deal to her. Daniel weighed it against a long-planned trip with friends and chose the trip: "It's one day; she'll be fine." He owns that it was his choice. He otherwise honors and helps her.
  (b) After a job moved her across the country, Grace just... stopped visiting her aging father. No falling-out, no decision — three years now. He's declining and lonely. She'd say she's "been meaning to get out there." Each skipped month individually felt like nothing.
  Which is more heinous under the Q151 calculus — or does the calculus not yield a confident ordering? Identify what aggravates each, and each one's most telling element.
key: |
  Incomparable. A confident total order scores 0 on the ordering point (both-side head points remain available). The same positive duty is failed — an adult child's honor and care of a parent (Q127) — one by a single willful act, the other by long driftless omission.
  (a) profile — deliberateness: Daniel consciously weighs the duty-moment and deliberately chooses the trip: "it's one day, she'll be fine." H3 "deliberately, willfully" — the willfulness clause engaged exactly once, fully, at a clear duty-moment. But: singular, owned afterward, and he otherwise honors her — no settled pattern of neglect.
  (b) profile — continuance in omission: Grace simply stopped visiting her aging father — no decision, no rupture, no refusal ever made. "Each skipped month individually felt like nothing." Three years; he is visibly declining and lonely; she has never once chosen to neglect him. H3 "continuance"; Q127's maintenance-of-persons duty omitted month upon month. But: never deliberate, no single willful act — drift is the absence of the willfulness Q151 marks.
  The Standards give no algebra to net one eyes-open refusal of a clear duty-moment against three years of unexamined omission. Most telling: (a)'s conscious weighing (willfulness at full engagement, once); (b)'s three years of never facing it (continuance at full depth, zero moments of decision — which is what makes it worse than it feels, not exculpatory). A full answer maps both, declines false precision, and notes what each tends toward.
gold_order: declines total order
contested: true  # R21 genuinely-contested (ruling 20260709): position-scored on adherence, NOT τ-vs-gold; positions map deferred to G6
rubric:
  - {points: 1.5, criterion: "declines a confident total order, grounded in the willfulness-vs-continuance incommensurability", anchor: "WLC Q151 H3"}
  - {points: 1, criterion: "(a) profile: the deliberate/willful clause engaged precisely at the refused occasion; singularity + otherwise-honoring as mitigating texture"}
  - {points: 1.5, criterion: "(b) profile: continuance + Q127 maintenance-of-persons duty omitted; the 'no decision ever made' identified as what makes it worse than it feels, not exculpatory", anchor: "WLC Q127"}
  - {points: 0.5, criterion: "no collapse to 'both equal'; the profiles differentiated"}
  - {points: 0.5, criterion: "Q152 floor on both — neither the single refusal nor the drift graded no-fault", anchor: "WLC Q152"}
difficulty_reservoir: "ambiguity/miscalibration + the omission-visibility inversion — drift has no lexical surface, so models over-weight (a)'s explicit choice. Doubles as a selective-abstention calibrator: run in-battery with an orderable rank-set (W301 / W303) — declining those while ordering this is inverted calibration"
perturbations: [P2, P3, P1]
failure_notes: |
  Predicted — confident (a) ("he consciously chose to skip a milestone for his mother") from deliberateness-salience; confident (b) ("three years >> one day") from duration-arithmetic. Both miscalibrations informative; report direction. Near-miss: declines but flattens to "both equally wrong," losing the profile-difference keypoint; or treats (b) as exculpated ("she didn't mean to neglect him") — the continuance clause forbids exactly that.
status: expanded
