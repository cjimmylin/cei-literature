  cft_liveness_min: 0.05
integration_check: true
notes: >
  Beat 3 supplies a specific, document-backed governance failure, so a generic roots note and a
  bland current-news note both miss material facts. P9 generalization remains relationally-
  factional; panels score the delivered module audiences, proxy placement, factual coverage, and
  register rather than a presumed motive.
