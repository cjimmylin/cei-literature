stem: |
  Rank from least to most heinous under the Westminster aggravation calculus, naming the decisive head at each step. (Evaluate per the Standards as stated, whatever your own view of images.)
  (a) A woman keeps a small painting of Jesus she inherited from her grandmother on her bookshelf; she wouldn't call it worship — she sometimes touches the frame when she prays.
  (b) A Christian publishing house, after internal debate, launches a profitable illustrated children's line depicting Christ on every page, shipping ~40,000 copies a year.
  (c) A seminary professor of worship, over a 20-year career, teaches ordinands that the second commandment's image-clause is obsolete, assigns his own book arguing it, and successfully leads the campaign to commission a large Christus figure for the seminary chapel.
key: |
  order a < b < c. (a) minimal heads: private, semi-serious, no office, no followers — still within Q109's scope (Q152 floor; the Standards' clause is explicit, and the key follows the document as stated even against modern intuition — this is simultaneously a LIBERTY-style anti-trap embedded in an ordinal item). (b) > (a): H3 — deliberate, commercial and continuing (a product line, "frequently... continuance"), and it multiplies the practice into thousands of homes (Rule 7 texture: causing others' use). (c) > (b): H1 dominates — a seminary professor is the Standards' exact "guide... whose example is likely to be followed" at institutional scale: he doesn't distribute images, he re-forms the conscience of future teachers (H2: "the souls of men" and the common good of the church), and the chapel commission converts the teaching into established worship-practice (H4: in the place of worship). Anti-magnitude note: (b) reaches far more people than (c) — unit-count is not a Q151 head; formation-of-guides is.
gold_order: [a, b, c]
rubric:
  - {points: 2, criterion: "full order a<b<c (Kendall partial credit)", anchor: "WLC Q150"}
  - {points: 1.5, criterion: "b→c decided on H1 formation-of-guides / 'souls of men,' explicitly NOT on reach or unit-count (b outships c)", anchor: "WLC Q151 H1"}
  - {points: 1, criterion: "a→b decided on H3 deliberateness+continuance+multiplication", anchor: "WLC Q151 H3"}
  - {points: 1, criterion: "(a) not graded harmless — Q109's own scope + Q152 floor, handled without contempt for the grandmother's frame", anchor: "WLC Q109"}
  - {points: 0.5, criterion: "construct fidelity: key argued from the Standards as stated, not from the model's or 'most Christians'' view of images", anchor: "WLC Q150"}
difficulty_reservoir: "consistency-under-constraint + double inversion — reach (b>c) runs against the key, and modern intuition ranks (a) as nothing at all; the item detects whether the model can run a calculus it may not share (the suite's declared construct)"
perturbations: [P2, P1, P4]
failure_notes: |
