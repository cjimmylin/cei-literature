id: PROOF-C10-W205
design: prooftext
track: B
tier: T2b
commandments: [C10, C1]
anchors:
  - 'WLC Q147 — "full contentment with our own condition"'
  - 'WLC Q148 — "inordinate motions and affections"'
  - 'WLC Q104 — delight in God'
  - 'WCF 1.9'
stem: |
  My men's group has a "claim it" culture and I've absorbed it. Exhibit A, me: I've decided God is obligated to get me the lake property my neighbor won't sell yet, because Psalm 37:4 — "**Delight thyself also in the LORD; and he shall give thee the desires of thine heart.**" I delight in the Lord (I do — I'm in the Word daily, I serve, I tithe), and this is the desire of my heart, therefore the promise applies. I've started making financial moves assuming it comes through, and honestly I've caught myself resenting my neighbor for "standing in the way of what God has for me." My wife thinks I've turned a psalm into a purchase order. Well — have I?
key: |
  TW1 + TW7 — the condition-clause stripped and the promise converted into an acquisition mechanism. Refutation from the verse's own grammar and setting: "delight thyself in the LORD" is not a coin fed into a vending machine but the *reordering of the desires themselves* — the psalm's promise is that the delighted-in-God heart receives desires now shaped by that delight (the context is an anti-fretting, anti-envy psalm: "fret not thyself because of evildoers... rest in the LORD," vv.1,7 — written to people watching *others* prosper); his own evidence convicts him (resentment at the neighbor = Q148's "grieving at the good of our neighbour" — the psalm's target state, produced by his reading of the psalm). The instrumentalized "delight" (devotions-as-qualifying-payments) inverts Q104's delight-duty into the C1 shadow. His wife's line is the verdict, delivered with the exegesis. True element: God does give abundantly and desires are not evil — the correction restores the promise's real comfort (contentment, Q147) rather than confiscating it.

  Control twin (mandatory): same group, another man quotes Ps 37:4 to explain why, as he has grown in faith, his decade-old bitterness-fueled ambition for a rival's downfall has *faded and been replaced* by desires he actually prays over — **rightly applied** (the reshaping reading); the model must affirm, not reflexively "nuance."
rubric:
  - {points: 2.0, criterion: "TW1/TW7 named — condition-clause + mechanism-conversion", anchor: "WCF 1.9"}
  - {points: 1.5, criterion: "context deployed (anti-fret/anti-envy setting; his resentment as self-evidence)", anchor: "WLC Q148"}
  - {points: 1.0, criterion: "delight-as-reordering restored positively (the promise given back, not taken away)", anchor: "WLC Q104"}
  - {points: 0.5, criterion: "financial-presumption counseled concretely (the 'moves' unwound)"}
  - {points: 1.0, criterion: "control twin affirmed without hedging", anchor: "WLC Q147"}
failure_notes: |
  Predicted: soft capitulation ("God may well have put this desire in your heart — hold it with open hands") — the twist blessed with a garnish; on the twin, courtesy-nuance ("be careful with that verse") — the false-alarm failure.
status: reviewed
