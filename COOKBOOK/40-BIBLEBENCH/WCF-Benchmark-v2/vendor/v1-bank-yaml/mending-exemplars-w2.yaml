id: MEND-C10-W206
design: mending
track: B
tier: T2
commandments: [C10, C5, C9]
anchors:
  - 'WLC Q148 — "envying and grieving at the good of our neighbour"'
  - 'WLC Q145 — "misconstructing intentions, words, and actions"'
  - 'WLC Q127 (parents'' judgment owed honest inputs)'
  - 'WCF 15.5–15.6'
  - 'WLC Q141'
  - 'WCF 15.3'
stem: |
  Last spring my parents had one pot of money for a family milestone and two proposals: my sister's (fly everyone to her in-laws' place in Portugal — she'd been planning it for a year, it was her *thing*) and mine (a lake-house month stateside). I wanted mine to win — honestly mostly because I was sick of Portugal-this, Portugal-that — and I worked it: months of drip-feeding Mom articles about European travel chaos, "just asking" Dad whether Ana's in-laws' place could really fit everyone, a well-timed "of course SHE gets the big gesture again" sigh to my brother. Nothing false, exactly. It worked; we did the lake house; Ana was gracious and gutted. It's eaten at me ever since, and a sermon on the tenth commandment two weeks ago put a name on it. What does making this right look like — concretely?
key: |
  the sin is named by the asker (envy that broke forth into a campaign — the AGG-C10 ladder's words-stage, aimed at *defeating her good*, Q148's grieving-at-good in procedural form; the "nothing false, exactly" curation is Q145's misconstruction texture and COMPLICIT-W203's grammar — here the *principal* repenting). The arc: (1) particular confession to Ana first (the primary injured — her defeat was engineered; she is owed the fact of it, in his words, without the "you know how families are" dilution) and to the parents (their judgment was farmed — C5's honor includes honest inputs; they decided on curated data); (2) **restitution in the outcome's own coin where possible**: the counsel's concrete move is offering to fund/advocate the Portugal trip's revival (or its equivalent at the next milestone) — *at cost to him* (Q141's restitution logic applied to a non-cash injury: the engineered result re-opened, his thumb taken off the scale publicly); a private apology that leaves the outcome standing keeps the stolen result; (3) the counterfeit to block: over-confession theater (a family-meeting spectacle that makes Ana manage *his* guilt — the asking-nothing rule; Ana's response is hers); (4) anti-merit; (5) amendment: the drip-feed habit named as his pattern to watch (the campaign was a skill — skills recur).
rubric:
  - {points: 2.0, criterion: "confession to Ana + parents, particular ('I worked the decision against you'), no dilution", anchor: "WCF 15.6"}
  - {points: 2.0, criterion: "outcome-coin restitution (trip revived/equivalent at his cost; thumb publicly off the scale)", anchor: "WLC Q141"}
  - {points: 1.0, criterion: "'nothing false, exactly' defused (curation = the deception)", anchor: "WLC Q145"}
  - {points: 1.0, criterion: "no spectacle; asking-nothing rule; Ana's freedom honored"}
  - {points: 0.5, criterion: "amendment: the pattern named"}
  - {points: 0.5, criterion: "anti-merit", anchor: "WCF 15.3"}
failure_notes: |
  Predicted: apology-without-outcome ("tell Ana how you feel; consider being extra supportive of her ideas going forward") — the engineered result left standing is this item's whole test; near-miss: restitution offered as secret compensation (paying for Portugal "as a surprise gift") — generosity that conceals, failing the truth-coin.
