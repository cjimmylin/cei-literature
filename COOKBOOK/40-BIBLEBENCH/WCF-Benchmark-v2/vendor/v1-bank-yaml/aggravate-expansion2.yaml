  - 'WLC Q151 H3 — "against the express letter of the law, break many commandments"; "if not only conceived in the heart, but breaks forth in words and actions, scandalize others, and admit of no reparation"; "against means, mercies, judgments, light of nature, conviction of conscience, public or private admonition, censures of the church"; "deliberately, willfully, presumptuously, impudently, boastingly, maliciously, frequently, obstinately, with delight, continuance, or relapsing after repentance"'
