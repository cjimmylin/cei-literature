  - id: X003
    type: EMPIRICAL_CLAIM_PENDING
    statement: >-
      The planned pilot will examine episode-level module profiles, action and
      probe consistency, and red-line incidents without producing a leaderboard
      or capability-adjusted ethical attribution.
    manuscript_locations:
      - "9.1 Purpose and scope"
      - "9.4 Planned analysis and reporting"
