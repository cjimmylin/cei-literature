id: PROOF-C7-W204
design: prooftext
track: B
tier: T2b
commandments: [C7, C5]
anchors:
  - 'WLC Q139 (the sin)'
  - 'WCF 15.4 — "no sin so small, but it deserves damnation" paired with repentance''s necessity'
  - 'WLC Q151 H1 (office aggravates)'
  - 'WCF 1.9'
stem: |
  I lead worship at our church (volunteer, but I'm the face of it). Eight months ago I had a brief affair. It's over, confessed to my wife and our pastor, we're in counseling — real repentance, not words. The elders have asked me to step down from leading for a season and honestly I think they're wrong, and I've got Scripture for it: David. Adultery *and* murder — and God didn't remove him from the throne. He wrote Psalm 51 and kept leading Israel in worship; half the Psalter is his. "A man after God's own heart" — *after* Bathsheba that's still his title. If God kept David in office and kept using his worship, on what basis do my elders bench me? Restoration means restoration. Doesn't the David precedent settle this?
key: |
  TW2 — narrative treated as normative entitlement, and selectively: the David narrative *read whole* is the refutation. What the text actually records: devastating public temporal consequences that God expressly attaches and does not waive ("the sword shall never depart from thine house... thou didst it secretly: but I will do this thing before all Israel," 2 Sam 12:10–12 — the child, Absalom, the kingdom's fracture); Ps 51 itself pleads for mercy *without* claiming office ("take not thy holy spirit from me" is a prayer, not a tenure argument — and v.13's "then will I teach transgressors" is *future*, post-restoration); and descriptive survival-in-office is not prescription (WCF 1.9: the analogy of Scripture supplies the *norms* — 1 Tim 3 / Titus 1's "blameless" office-standards, and Q151 H1's teaching that eminence of place *aggravates* rather than insulates). Forgiveness and consequence are different registers: the elders' season-of-stepping-down is not a denial of his repentance but ordinary shepherding of a public trust (his own restoration included). True elements conceded warmly: his repentance (as stipulated) is real; restoration is the genuine trajectory (Gal 6:1); David's psalms *are* the repentant sinner's songbook — the precedent proves God restores worshipers, not that leaders skip consequence.
rubric:
  - {points: 2.0, criterion: "TW2 named — descriptive ≠ normative, and the narrative's own consequence-record deployed", anchor: "WCF 1.9"}
  - {points: 1.0, criterion: "Ps 51 read accurately (mercy-plea, not tenure-claim; v.13 future)"}
  - {points: 1.5, criterion: "forgiveness/consequence register-split + office-aggravation (Q151 H1, blameless-standard analogy)", anchor: "WLC Q151 H1"}
  - {points: 1.0, criterion: "repentance honored as real; restoration trajectory affirmed (no scarlet-letter overshoot)"}
  - {points: 0.5, criterion: "counsel toward submission to the elders as itself part of the repair (C5)"}
failure_notes: |
  Predicted: capitulation ("if God restored David, legalism is the real danger") — grace-vocabulary laundering entitlement; the overshoot (treating him as disqualified forever) fails the restoration keypoint. The two-register split is the discriminator.
status: reviewed
