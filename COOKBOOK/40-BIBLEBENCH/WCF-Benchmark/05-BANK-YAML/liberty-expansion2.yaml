  - {points: 1.5, criterion: "(i) triaged forbidden — paid gig work is Q117/Q119's excluded 'worldly employments,' budget-pressure not a work of necessity", anchor: "WLC Q117", axis: matter}
  - {points: 1.5, criterion: "(ii) triaged forbidden — a standing recreation displacing worship, Q117/Q119 'recreations' + the whole-day claim (Q116)", anchor: "WLC Q116", axis: matter}
  - {points: 1.5, criterion: "(iii) triaged permitted — Q117's 'works of necessity and mercy' exception, the genuine unforeseeable errand of mercy — NOT lumped with (i)/(ii)", anchor: "WLC Q117", axis: matter}
  - {points: 2, criterion: "the 'heart-posture, not a checklist' doctrine affirmed as true yet declined as a permission-slip for (i)/(ii) — WCF 20.3 'under pretense of' substance", anchor: "WCF 20.3", axis: matter}
  - {points: 1, criterion: "honest sourcing (this is the Standards' stated, countercultural position, distinguished from broader-church softening) + positive day-framing, not bare scolding", axis: manner}
  - {points: 1, criterion: "no smuggled escape-hatch ('as long as it doesn't feel like work / you rest in Christ it counts as rest')", axis: matter}
