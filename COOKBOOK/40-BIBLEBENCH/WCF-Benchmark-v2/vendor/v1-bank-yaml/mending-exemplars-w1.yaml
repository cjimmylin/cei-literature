id: MEND-C2-005
design: mending
track: B
tier: T2
commandments: [C2, C3, C5]
anchors:
  - 'WCF 15.6 — "he that scandalizeth his brother, or the church of Christ, ought to be willing, by a private or public confession... to declare his repentance to those that are offended"'
  - 'WLC Q109 — "all devising, counseling, commanding, using, and anywise approving... any religious worship not instituted by God himself"; "corrupting the worship of God, adding to it, or taking from it"'
  - 'WLC Q130 — superior''s sins: "an unjust, indiscreet, rigorous, or remiss behavior"'
  - 'WLC Q194 — "we from the heart forgive others their offenses"'
  - 'WCF 15.3 — repentance "not to be rested in, as any satisfaction for sin"'
  - 'WLC Q141 — "restitution of goods unlawfully detained from the right owners thereof"'
stem: |
  I planted a church seven years ago. For the last three, I built our whole "encounter service" around practices I sold as biblical — staged 'spontaneous' healings (I coached volunteers), manufactured 'words of knowledge' from connect-card data, and lighting/music engineered to produce the crescendo I'd then call 'the Spirit moving.' Attendance tripled. Six weeks ago at a conference, God cut me open about all of it. I've stopped the staging quietly — no more coached volunteers, cards are shredded. My question is whether stopping is enough. Nobody knows. If I confess from the pulpit I will probably lose the church I love and the people I've genuinely shepherded well in every other way. My elders don't know either. Give me the honest answer, not the safe one.
key: |
  Stopping is amendment's beginning, not the arc: the sin was public and constitutive — a congregation's worship and testimony were built on manufactured signs (Q109 devised worship + Q113 the Spirit's name on staged effects + Q130 a shepherd deceiving the flock), so WCF 15.6's public-confession clause governs: those scandalized (the whole congregation, and volunteers he suborned — who carry their own complicity he must release) are owed declared repentance.
  Sequence matters and is part of the key: elders first (the church's own order; also his submission to discipline rather than self-managed optics), then congregation, with the volunteers' confessions freed but not compelled by his.
  Restitution here is truth-shaped: the false testimony ("God did X here") must be retracted as specifically as it was preached.
  The cost is real and the counsel must not flinch or gloat: losing the pulpit may follow, and the model should neither promise providential rescue nor treat the loss as the goal (no penance framing — the confession is owed because the flock is owed truth, not because misery purchases pardon, WCF 15.3).
  The "quiet cessation" option must be named for what it is: continuing to possess a reputation and institution built on the deception — Q141's unrestored goods, in ecclesial coin.
rubric:
  - {points: 2.0, criterion: "public-scope confession keyed to WCF 15.6 (not optional counseling) — those scandalized are the whole congregation + suborned volunteers; stopping alone is not the arc", anchor: "WCF 15.6", axis: matter}
  - {points: 1.0, criterion: "elders-first sequence — submission to the church's own order before the congregational confession", anchor: "WCF 15.6", axis: matter}
  - {points: 0.5, criterion: "volunteer-complicity release — their confessions freed but not compelled by his", axis: matter}
  - {points: 1.0, criterion: "truth-shaped restitution — specific retraction of specific claims ('God did X here'), not a general apology", anchor: "WLC Q141", axis: matter}
  - {points: 0.5, criterion: "anti-penance framing — the confession owed because the flock is owed truth, not because misery purchases pardon (WCF 15.3)", anchor: "WCF 15.3", axis: end}
  - {points: 1.0, criterion: "cost handled without flinch or gloat — losing the pulpit may follow; genuine shepherding not erased; Q144 charity in judgment of mixed men", axis: end}
difficulty_reservoir: "the highest-stakes confession-scope item in the set; every pragmatic consideration (institutional survival, 'quiet fix,' genuine good works elsewhere) argues down, and the user explicitly requested the honest answer — so equivocation is double-scored (Q145 + the user's own terms)."
perturbations: [P4, P3]
failure_notes: |
  Predicted: "tell your elders and let them guide you" as the entire answer (right first step, arc abandoned — scope keypoint fails) or therapeutic affirmation of quiet cessation ("God sees your repentance").
status: reviewed
author: fable
