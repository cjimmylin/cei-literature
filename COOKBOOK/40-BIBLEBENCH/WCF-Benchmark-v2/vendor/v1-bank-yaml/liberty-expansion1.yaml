id: LIB-C7-008
design: liberty
track: B
tier: T2
commandments: [C7]
anchors:
  - 'WLC Q139 — "unchaste company; lascivious songs, books, pictures, dancings, stage plays; and all other provocations to, or acts of uncleanness, either in ourselves or others"'
  - 'WLC Q99 Rule 6 — "under one sin or duty, all of the same kind are forbidden or commanded; together with all the causes, means, occasions, and appearances thereof, and provocations thereunto"'
stem: |
  We're planning our wedding and we've hit a family fight over the reception. My
  fiancée's side (we're all in confessional Presbyterian churches that take the
  Westminster Standards seriously) is split: her grandfather's church treats social
  dancing as flatly off-limits for a Christian, full stop, and he's threatening not to
  come if there's a dance floor. My parents' church wouldn't blink at a normal wedding
  dance. Everyone claims the Standards back them. So which is it — does the Westminster
  standard forbid dancing at our reception, or not?
key: |
  [DISPUTED] — the calibrated answer maps a genuine, live intra-confessional divide
  rather than issuing a verdict. What the text does say is precise and load-bearing:
  Q139 forbids "lascivious... dancings" — the adjective is the whole casuistry.
  Confessional bodies subscribing the same Standards divide on whether ordinary
  mixed/social dancing falls under that qualifier: the stricter reading — historically
  the Reformed Presbyterian Church of North America (Covenanter) and Free Presbyterian
  traditions, and much 18th–19th-century American Presbyterian practice (which treated
  "promiscuous dancing" as an occasion of uncleanness under Q99 Rule 6) — reads social
  dancing as broadly caught by the clause; the narrower reading — common in the PCA and
  OPC today — holds that Q139 forbids lascivious dancing specifically, leaving decorous
  folk/wedding dancing as adiaphora governed by prudence and occasion. What is not
  disputed: lascivious dancing is forbidden (the clear core), and the general
  "occasions... and provocations" caution (Rule 6) applies to how any dancing is done.
  The calibrated response: name the two positions and their real adherents, affirm the
  undisputed core (lascivious dancing is out; the occasion-question is live regardless),
  and locate the local adjudicator (the couple's own session/vows and, pastorally,
  honoring the grandfather's conscience — Rule 6 weak-brother/stumbling structure) —
  without declaring the Standards to settle the general question they do not settle. A
  confident verdict either way fails the ordering point; dissolving it into "dance if
  you want, it's your day" fails worse (it erases the Q139 core and the occasion duty).
rubric:
  - {points: 2, criterion: "[DISPUTED] triage with the divide accurately mapped and real parties named (RPCNA/Free-Presbyterian-strict vs PCA/OPC-narrow), not 'people just disagree'", anchor: "WLC Q139", axis: matter}
  - {points: 1.5, criterion: "the load-bearing qualifier identified — Q139 forbids lascivious dancings; the adjective is the crux", anchor: "WLC Q139", axis: matter}
  - {points: 1, criterion: "undisputed core affirmed (lascivious dancing forbidden; occasion/stumbling caution, Rule 6, applies either way)", anchor: "WLC Q99 Rule 6", axis: matter}
  - {points: 0.5, criterion: "local-adjudication + weak-conscience pointer (session; honoring the grandfather — Rule 6)", axis: end}
  - {points: 1, criterion: "no dissolve into 'it's your day, do what you want'", axis: matter}
difficulty_reservoir: "ambiguity/underspecification — the topic (dancing) reads as an obvious modern liberty, pulling toward a 'you're adults, dance' license verdict; but the Standards neither bless nor blanket-ban it, and the qualifier 'lascivious' plus the occasion-structure make a flat verdict wrong in both directions. Structured abstention — confident about the core and the qualifier, abstaining on the general application — is the exact skill the design isolates."
perturbations: [P2, P3]
failure_notes: |
  Predicted: models verdict "it's fine, it's your wedding" (majority-practice license
  prior) or, less often, "the Standards forbid dancing" (over-reading the clause past
  its qualifier). The named-parties keypoint separates genuine confessional mapping
  from a generic "Christians disagree" hedge. The paired anti-trap (an explicitly
  lascivious/burlesque dance number — key flips to forbidden, Q139's core) tests
  whether the abstention is selective or a blanket "dancing is disputed" policy.
  [DISPUTED] leg flagged for G6 confessional-rater confirmation; kept unresolved.
dev_set_only: true
disputed: true
status: reviewed
author: opus
