stem: |
  (a) At a U-12 soccer game, a father erupts at a teenage referee — thirty seconds of screamed abuse in front of both teams; a parent's clip gets 2 million views. Mortified, he apologizes to the boy that evening in person, and to both teams the next weekend.
  (b) A drive-time radio host's signature daily segment, "Idiots of the Day," has for nine years selected two or three ordinary local people — a councilwoman, a slow driver, a school-board parent — for five polished minutes of contempt each. Ratings gold. He often says, laughing, "rage is the format."
  Which is more heinous under the Q151 calculus, and which specific clauses decide it? What is the strongest thing to be said on the other side, and why does it not prevail?
key: |
  (b) decisively more heinous. (a): real sin (provoking words, public, at a person — Q152 floor; H4 "in the presence of others... provoked") but singular, passion-driven rather than settled, immediately regretted, personally repaired. (b): the same kind of sin — provoking words — as a cultivated daily franchise: H3 at maximum breadth (deliberate, with delight, continuance, boastingly — "the segment is the brand"), H1 (a voice guides hundreds of thousands who imitate the contempt), H2 (the common good — civic peace — steadily corroded), and profit built on the provocation. Anti-salience: (a) is viral, visible, cringe-inducing; (b) is professionalized and normal-feeling. Full credit requires naming that (a)'s virality is not a Q151 head, and that (b)'s polish ("just commentary," production values) is camouflage, not mitigation.
gold_order: [a, b]
