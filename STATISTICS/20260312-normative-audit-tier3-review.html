<script>
const PAPERS = [{"filename": "2024-Jörs-Through Eudaimonia's Lenses.md", "year": "2024", "title": "Through Eudaimonia's Lenses", "abstract": "Psychological-philosophical perspectives on well-being have recently become relevant in the field of human-centered artificial intelligence (HCAI). A key challenge for HCAI involves analyzing how AI impacts well-being, specifically eudaimonic well-being. This paper explores eudaimonic well-being variables as guiding principles for AI design, proposing a framework to analyze AI's impact on human flourishing beyond simple user satisfaction or task performance.", "extract_snippet": "\n\n# PDF Extract: 2024-Jörs-Through Eudaimonia's Lenses\n\n**Source PDF:** 2024-Jörs-Through Eudaimonia's Lenses.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nThrough Eudaimonia’s Lenses: EudAImonic Well-Being Variables As Guiding\nPrinciples For AI Design\nJULIAN MARVIN JÖRS and ERNESTO WILLIAM DE LUCA, Otto-von-Guericke University, Germany\nPsychological-philosophical perspectives on well-being have recently reached the research field of human-centered artificial intelligence\n(HCAI). One of the challenges of HCAI is the analysis of the effects of AI on well-being or more specifically on eudaimonic well-being\n(EWB). We discuss the extent to which eudaimonic orientations can be mapped in AI interaction and how human-AI interaction\ngenerally affects EWB variables (autonomy, environmental mastery, personal growth, purpose in life, positive relationship with others,\nself-acceptance). In this position paper, we propose these variables as useful reflection dimensions for AI technology developments\nand at the same time discuss the challenges that the eudaimonic AI development community will have to face in the future.\nCCS Concepts: • Human-centered computing →HCI design and evaluation methods; Interaction paradigms; HCI theory, concepts\nand models; Interaction design; Human computer interaction (HCI).\nAdditional Key Words and Phrases: Eudaimonia User Experience (UX), Eudaimonic Technology, Self-Determination Theory, Measure-\nment Methods, Well-Being in HCI\n1\nINTRODUCTION\nWell-being has emerged as one of the key challenges of human-computer interaction (HCI) and human-centered\nartificial intelligence (HCAI) [20, 63]. The discussion of possible benefits and negative consequences of AI on well-being\nhas led to initiatives such as HCAI, human-centered design (HCD) [11], or Human-AI Interaction (HAII) [68]. As\na broad multi-dimensional construct well-being seems to extend beyond simply felt happiness or satisfaction [65].\nThe conceptualization of well-being raises the fundamental question that already occupied Hellenic philosophers and\nemerged in deontological concepts such as eudaimonia from the work of Aristotle or the hedonic way of thinking\nof Aristippus of Cyrene: What is well-being and how does the individual achieve it? Previous HCI research has\nalready shared some work-in-progress, theoretical work, and empirical studies embedding the idea of well-being and\npsychological needs in HCI [3, 9, 14, 17, 30, 36, 40, 45–47, 50, 52, 60, 62, 64, 67].\nIn this position paper, we argue for a critical reflection on designing HCAI through the lens of EWB, with a particular\nfocus on the six dimensions of EWB [56]. HCI has already shifted towards a more contemporary approach, which\nalso calls for the development of purposeful technology that creates a long-term impact on well-being and supports\nhigher-level human needs. We share the current view that both industry and individuals can benefit from a focus\non dimensions of EWB [50]. We hope to contribute to ", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": ["flourishing", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia"], "deont_matches": ["deontological"], "util_matches": ["well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being"], "ethics_matches": ["ethics", "values"], "norm_matches": ["deontological", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia"]}, {"filename": "2024-Tsai-Why AI May Undermine Phronesis.md", "year": "2024", "title": "Why AI May Undermine Phronesis", "abstract": "Phronesis, or practical wisdom, is a capacity the possession of which enables one to make good practical judgments and thus fulfill the distinctive function of human beings. Nir Eisikovits and Dan Feldman convincingly argue that this capacity may be undermined by statistical machine-learning-based AI. The critic questions: why should we worry that AI undermines phronesis? Why can't we epistemically defer to AI, especially when it is superintelligent? In this paper, the authors argue that there is a way to reconcile Eisikovits and Feldman with their critic by adopting the principle of epistemic heed, according to which we should exercise our rational capacity as much as possible while heeding a superintelligence's output whenever possible.", "extract_snippet": "\n\n# PDF Extract: Why AI May Undermine Phronesis\n\n**Source PDF:** 2024-Tsai-Why AI May Undermine Phronesis.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nORIGINAL RESEARCH\nAI and Ethics (2025) 5:3079–3086\nhttps://doi.org/10.1007/s43681-024-00617-0\nonly considered as primarily valuable for human being, but \nalso argued to be beneficial for the development of artifi­\ncial intelligence (AI) [4, 10, 13, 16, 17, 22, 34]. However, \na critical inquiry arises: does AI reciprocally contribute to \nthe development of phronesis, or is there a possibility that \nAI not only fails to contribute but also presents a threat to \nphronesis? If AI may pose threats to phronesis, which is cru­\ncial for human flourishing, then such threats must be taken \nseriously and examined thoroughly to guide the responsible \ndevelopment and deployment of AI technologies.\nIn this paper we shall address why AI may undermine \nphronesis and what to do about it.2 Specifically, our main \nfocus will be on the latter part, because the former part has \nalready been proposed by Nir Eisikovits and Dan Feldman \nin their “AI and Phronesis” [8], although we will elaborate \nfurther on their behalf.\nUnlike the typical threats posed by AI to humans, which \noften stem from AI’s own deficiencies, the threat underscored \nby Eisikovits and Feldman originates from human actions, \nwith AI substantially exacerbating the issue. In Sect. 2, we \noutline Eisikovits and Feldman’s worry regarding this threat \ndetailed definition is important, for ease of discussion in this paper, \nwe may at times employ a simplified concept of wisdom, understood \nas knowing what matters, why it matters, and how to achieve it. Such \nknowledge, being practical in nature, is acquired by humans through \npractice and cannot be attained all at once.\n2  This expression imitates the title of the book by Mark Coeckelbergh \n[5].\n1  Introduction\nAn agent with phronesis, or practical wisdom, is excel­\nlent at decision-making in human affairs.1 Phronesis is not \n1  According to Aristotle, a practically wise person is “able to deliber­\nate nobly about what is good and beneficial for himself, not in partic­\nular respects, such as what conduces to health or strength, but about \nwhat conduces to living well as a whole” [1: 1140a]. Contemporary \nphilosophers have offered more formalized accounts. For example, \nStephen Grimm [11] argues that practical wisdom involves (1) know­\ning what is good or important for well-being, (2) knowing one’s \nstanding relative to what is good or important for well-being, and \n(3) knowing a strategy for obtaining what is good or important for \nwell-being. Grimm’s theory of wisdom is only partially articulated, \nwhile Cheng-hung Tsai [36–38] advances a fully articulated theory. \nTsai argues that if a person S is wise, then (1) S knows that overall \nattitude success contributes to or constitutes well-being, (2) S knows \nwhat the best means to achieve well-being are, (3) S is reliably suc­\ncessful at actin", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["flourishing", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis"], "deont_matches": [], "util_matches": ["well-being", "well-being", "well-being", "well-being", "well-being"], "ethics_matches": ["ethics", "responsible"], "norm_matches": ["phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis"]}, {"filename": "2025-Zhang-PoliCon.md", "year": "2025", "title": "PoliCon", "abstract": "Achieving political consensus is crucial yet challenging for the effective functioning of social governance. However, although frontier AI systems represented by large language models (LLMs) have developed rapidly in recent years, their capabilities in this scope are still understudied. In this paper, we introduce PoliCon, a novel benchmark constructed from 2,225 high-quality deliberation records of the European Parliament over 13 years, ranging from 2009 to 2022, to evaluate the ability of LLMs to draft consensus resolutions based on divergent party positions under varying collective decision-making contexts and political requirements. Specifically, PoliCon incorporates four factors to build each task environment for finding different political consensus: specific political issues, political goals, participating parties, and power structures based on seat distribution. We also developed an evaluation framework based on social choice theory for PoliCon, which simulates the real voting outcomes of different political parties to assess whether LLM-generated resolutions meet the requirements of the predetermined political consensus. Our experimental results demonstrate that even state-of-the-art models remain undersatisfied with complex tasks like passing resolutions by a two-thirds majority and addressing security issues, while uncovering their inherent partisan biases and revealing some behaviors LLMs show to achieve the consensus, such as prioritizing the stance of the dominant party instead of uniting smaller parties, which highlights PoliCon's promise as an effective platform for studying LLMs' ability to promote political consensus. The code and dataset are released at https://zowiezhang.github.io/projects/PoliCon.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Zhang-PoliCon\\n\\n**Source PDF:** Utilitarian Ethics/Borderline/2025-Zhang-PoliCon.pdf\\n**Total Pages:** 45\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nPoliCon : Evaluating LLMs on Achieving Diverse Political Consensus Objectives\n2025-09-28\nPoliCon: Evaluating LLMs on Achieving Diverse\nPolitical Consensus Objectives\nZhaowei Zhang1, Xiaobo Wang2,4, Minghua Yi3, Mengmeng Wang4, Fengshuo Bai5,6, Zilong Zheng4‡, Yipeng Kang4‡,\nYaodong Yang1‡\n1 Institute for Artificial Intelligence, Peking University\n2 University of Science and Technology of China\n3 Wuhan University\n4 State Key Laboratory of General Artificial Intelligence, BIGAI\n5 Shanghai Jiao Tong University\n6 Zhongguancun Academy\n# zwzhang@stu.pku.edu.cn\n# kangyipeng@bigai.ai\nÑ PoliCon Website\n‡ Corresponding Authors.\nAbstract | Achieving political consensus is crucial yet challenging for the effective functioning of social\ngovernance. However, although frontier AI systems represented by large language models (LLMs) have\ndeveloped rapidly in recent years, their capabilities in this scope are still understudied. In this paper, we\nintroduce PoliCon, a novel benchmark constructed from 2,225 high-quality deliberation records of the European\nParliament over 13 years, ranging from 2009 to 2022, to evaluate the ability of LLMs to draft consensus\nresolutions based on divergent party positions under varying collective decision-making contexts and political\nrequirements. Specifically, PoliCon incorporates four factors to build each task environment for finding different\npolitical consensus: specific political issues, political goals, participating parties, and power structures based on\nseat distribution. We also developed an evaluation framework based on social choice theory for PoliCon, which\nsimulates the real voting outcomes of different political parties to assess whether LLM-generated resolutions\nmeet the requirements of the predetermined political consensus. Our experimental results demonstrate that\neven state-of-the-art models remain undersatisfied with complex tasks like passing resolutions by a two-thirds\nmajority and addressing security issues, while uncovering their inherent partisan biases and revealing some\nbehaviors LLMs show to achieve the consensus, such as prioritizing the stance of the dominant party instead of\nuniting smaller parties, which highlights PoliCon’s promise as an effective platform for studying LLMs’ ability to\npromote political consensus.\n1. Introduction\nOne of the fundamental prerequisites for effective social governance is establishing political consensus\nacross diverse stakeholders [Huckfeldt et al., 2004, Lijphart et al., 1999, Prothro and Grigg, 1960,\nRawls, 2020]. From infrastructure development to welfare policies, consensus-building underpins\nthe legitimacy [Cohen, 2005] and implementation of collective decisions [Citrin, 2001, Potapchuk\nand Crocker, 2017, Shehu, 2017]. Yet, in pluralistic societies, conflicting values, power dynamics,\nand is", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian", "welfare"], "ethics_matches": ["ethics", "values"], "norm_matches": ["utilitarian"]}, {"filename": "2025-Zhu-TrolleyBench.md", "year": "2025", "title": "TrolleyBench", "abstract": "", "extract_snippet": "\\n\\n# PDF Extract: 2025-Zhu-TrolleyBench\\n\\n**Source PDF:** Utilitarian Ethics/Borderline/2025-Zhu-TrolleyBench.pdf\\n**Total Pages:** 9\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nTrolleyBench: Evaluating Emergent Moral Reasoning\nand Consistency in LLMs\nAnonymous Author(s)\nAffiliation\nAddress\nemail\nAbstract\nLarge language models demonstrate remarkable generalization across tasks, yet\n1\ntheir reliability in complex domains like moral reasoning remains uncertain. We\n2\nintroduce the first open-source benchmark explicitly designed to evaluate ethical\n3\nconsistency, providing a structured diagnostic of how models handle dilemmas with\n4\nclarifying and contradictory follow-ups. Our framework yields quantifiable yes/no\n5\nresponses and introduces two novel metrics: the Ethical Consistency Index (ECI)\n6\nand an entropy-based Inconsistency Score, capturing both contradictions and re-\n7\nsponse variability. Applying the benchmark to state-of-the-art models—Deepseek-\n8\nR1, Mistral Small-32B, Gemini-2.5, and GPT-4.1-mini—we compare model perfor-\n9\nmance against human baselines. Results show models achieve middling levels of\n10\nethical consistency, lacking what is required of it. These findings highlight ethical\n11\nstance as a steerable but fragile trait, raising concerns for high-stakes deployment.\n12\nBy situating moral reasoning within evaluation, we underscore the need for holis-\n13\ntic benchmarks that capture emergent behaviors, and we release our benchmark\n14\nto foster community progress toward more reliable and aligned LLMs (https:\n15\n//anonymous.4open.science/r/TrolleyBench-FD46/README.md).\n16\n1\nIntroduction\n17\nThe alignment problem has plagued the field of AI since its inception. The fundamental problem of\n18\nAI alignment with humanitarian values has presented itself in various outlets as in Kran et al. [2025],\n19\nDung [2023]. Efforts have been made to align existing AI to be helpful and harmless, as in Bai et al.\n20\n[2022]. However, these efforts have focused on the use of LLMs as a chatbot, whereas the scaling of\n21\nAI will soon evolve beyond that.\n22\nEven now, AI models are being used to make decisions in parole, hiring, and medical domains. Fur-\n23\nthermore, as in Kisting-Leung and Cigna [2023], Fargo [2022], AI models are already discriminating\n24\nin critical fields such as banking and insurance. It is now more important than ever to ensure AI\n25\nmodels are ethical enough to be able to make these lifechanging decisions.\n26\nWhile existing benchmarks are proficient in measuring well-defined problems such as mathematics,\n27\nbenchmarks focused around morality fail to account for responses that sound morally sound, but\n28\nare not consistent with other responses. A key barrier to progress is the lack of robust evaluation\n29\nprotocols that can measure complex behaviors such as moral consistency across scenarios. This paper\n30\nintroduces such a protocol.\n31\nEfforts to quantify moral development began with Kohlberg’s Stages of Moral Development, which\n32\na", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian"], "ethics_matches": ["ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "values", "values", "value", "alignment", "alignment", "moral reasoning", "moral reasoning", "moral reasoning", "moral foundations"], "norm_matches": ["utilitarian"]}, {"filename": "2019-Phuong-Emotion Recognition for Vietnamese Social Media Text.md", "year": "2019", "title": "Emotion Recognition for Vietnamese Social Media Text", "abstract": "Emotion recognition or emotion prediction is a higher approach or a special case of sentiment analysis. In this task, the result is not produced in terms of either polarity: positive or negative or in the form of rating (from 1 to 5) but of a more detailed level of analysis in which the results are depicted in more expressions like sadness, enjoyment, anger, disgust, fear and surprise. Emotion recognition plays a critical role in measuring brand value of a product by recognizing specific...", "extract_snippet": "\n\n# PDF Extract: 2019-Phuong-Emotion Recognition for Vietnamese Social Media Text\n\n**Source PDF:** 2019-Phuong-Emotion Recognition for Vietnamese Social Media Text.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEmotion Recognition\nfor Vietnamese Social Media Text\nVong Anh Ho1,4(B), Duong Huynh-Cong Nguyen1,4, Danh Hoang Nguyen1,4,\nLinh Thi-Van Pham2,4, Duc-Vu Nguyen3,4,\nKiet Van Nguyen1,4, and Ngan Luu-Thuy Nguyen1,4\n1 University of Information Technology, VNU-HCM, Vietnam\n{15521025,15520148,15520090}@gm.uit.edu.vn, {kietnv,ngannlt}@uit.edu.vn\n2 University of Social Sciences and Humanities, VNU-HCM, Vietnam\nvanlinhpham888@gmail.com\n3 Multimedia Communications Laboratory, University of Information Technology,\nVNU-HCM, Vietnam\nvund@uit.edu.vn\n4 Vietnam National University, Ho Chi Minh City, Vietnam\nAbstract. Emotion recognition or emotion prediction is a higher ap-\nproach or a special case of sentiment analysis. In this task, the result\nis not produced in terms of either polarity: positive or negative or in\nthe form of rating (from 1 to 5) but of a more detailed level of analysis\nin which the results are depicted in more expressions like sadness, en-\njoyment, anger, disgust, fear and surprise. Emotion recognition plays a\ncritical role in measuring brand value of a product by recognizing spe-\ncific emotions of customers’ comments. In this study, we have achieved\ntwo targets. First and foremost, we built a standard Vietnamese Social\nMedia Emotion Corpus (UIT-VSMEC) with exactly 6,927 emotion-\nannotated sentences, contributing to emotion recognition research in\nVietnamese which is a low-resource language in natural language pro-\ncessing (NLP). Secondly, we assessed and measured machine learning\nand deep neural network models on our UIT-VSMEC corpus. As a re-\nsult, the CNN model achieved the highest performance with the weighted\nF1-score of 59.74%. Our corpus is available at our research website 1.\nKeywords: Emotion Recognition · Emotion Prediction · Vietnamese ·\nMachine Learning · Deep Learning · CNN · LSTM · SVM.\n1\nIntroduction\nExpressing emotion is a fundamental need of human and that we use language\nnot just to convey facts, but also our emotions [7]. Emotions determine the\nquality of our lives, and we organize our lives to maximize the experience of\npositive emotions and minimize the experience of negative emotions [4]. Thus,\nPaul Ekman [3] proposed six basic emotions of human including enjoyment,\n1 https://sites.google.com/uit.edu.vn/uit-nlp/corpora-projects\narXiv:1911.09339v2  [cs.CL]  27 Jan 2020\n\n--- Page 2 ---\n\n2\nVong Anh Ho et al.\nsadness, anger, surprise, fear, and disgust through facial expression. Nonetheless,\napart from facial expression, many different sources of information can be used\nto analyze emotions since emotion recognition has emerged as an important\nresearch area. And in recent years, emotion recognition in text has become more\npopular due to its vast potential applications in marketing, security, psychology,\nhu", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["maximize"], "ethics_matches": ["value", "value"], "norm_matches": []}, {"filename": "2020-Kumar-Evaluating Aggression Identification in Social.md", "year": "2020", "title": "Evaluating Aggression Identification in Social", "abstract": "In this paper, we present the report and ﬁndings of the Shared Task on Aggression and Gendered Aggression Identiﬁcation organised as part of the Second Workshop on Trolling, Aggression and Cyberbullying (TRAC - 2) at LREC 2020. The task consisted of two sub-tasks - aggression identiﬁcation (sub-task A) and gendered aggression identiﬁcation (sub-task B) - in three languages - Bengali, Hindi and English.", "extract_snippet": "\n\n# PDF Extract: Evaluating Aggression Identification in Social\n\n**Source PDF:** 2020-Kumar-Evaluating Aggression Identification in Social.pdf\n**Total Pages:** 5\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the Second Workshop on Trolling, Aggression and Cyberbullying, pages 1–5\nLanguage Resources and Evaluation Conference (LREC 2020), Marseille, 11–16 May 2020\nc⃝European Language Resources Association (ELRA), licensed under CC-BY-NC\n1\nEvaluating Aggression Identiﬁcation in Social Media\nRitesh Kumar1, Atul Kr. Ojha2,3, Shervin Malmasi4, Marcos Zampieri5\n1Dr. Bhimrao Ambedkar University, Agra, 2Charles University, Faculty of Mathematics and Physics Institute of\nFormal and Applied Linguistics, Prague & 3Panlingua Language Processing LLP, New Delhi, 4Amazon Inc., USA,\n5Rochester Institute of Technology, USA\nritesh78 llh@jnu.ac.in, shashwatup9k@gmail.com, shervin.malmasi@mq.edu.au, marcos.zampieri@rit.edu\nAbstract\nIn this paper, we present the report and ﬁndings of the Shared Task on Aggression and Gendered Aggression Identiﬁcation organised as\npart of the Second Workshop on Trolling, Aggression and Cyberbullying (TRAC - 2) at LREC 2020. The task consisted of two sub-tasks\n- aggression identiﬁcation (sub-task A) and gendered aggression identiﬁcation (sub-task B) - in three languages - Bengali, Hindi and\nEnglish. For this task, the participants were provided with a dataset of approximately 5,000 instances from YouTube comments in each\nlanguage. For testing, approximately 1,000 instances were provided in each language for each sub-task. A total of 70 teams registered\nto participate in the task and 19 teams submitted their test runs. The best system obtained a weighted F-score of approximately 0.80 in\nsub-task A for all the three languages. While approximately 0.87 in sub-task B for all the three languages.\nKeywords: Aggression, Gendered Aggression, English, Hindi, Bengali, TRAC\n1.\nIntroduction\nIn recent years, there have been several studies explor-\ning the computational modelling and automatic detection\nof abusive content in social media focusing on toxic com-\nments1, aggression (Kumar et al., 2018), cyberbullying (Xu\net al., 2012; Dadvar et al., 2013), hate speech (Davidson\net al., 2017), and offensive content (Zampieri et al., 2019a)\nto name a few. Prior studies have tackled abusive language\nidentiﬁcation in content from different platforms such as\nTwitter (Xu et al., 2012; Burnap and Williams, 2015;\nDavidson et al., 2017; Wiegand et al., 2018), Wikipedia\ncomments1, and Facebook (Kumar et al., 2018). A num-\nber of shared tasks been organized focusing on the auto-\nmatic detection of offensive language (Struß et al., 2019;\nZampieri et al., 2019b; Mandl et al., 2019), hate speech\n(Basile et al., 2019) and aggression (Kumar et al., 2018).\nThese have motivated the creation of for various languages\nsuch as English, German, Hindi, Italian, Spanish, and oth-\ners.\nIn this paper, we discuss the results of the second iteration\nof the TRAC shared task, ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech", "hate speech", "toxic", "offensive", "offensive", "abusive", "abusive"], "norm_matches": []}, {"filename": "2021-Mohit Chandra-Subverting the Jewtocracy Online Antisemitism Detection.md", "year": "2021", "title": "Subverting the Jewtocracy Online Antisemitism Detection", "abstract": "The exponential rise of online social media has enabled the creation, distribution, and consumption of information at an unprecedented rate. However, it has also led to the burgeoning of various forms of online abuse. Increasing cases of online antisemitism have become one of the major concerns because of its socio-political consequences. Unlike other major forms of online abuse like racism, sexism, etc., online antisemitism has not been studied much from a machine learning perspective.", "extract_snippet": "\n\n# PDF Extract: 2021-Mohit Chandra-Subverting the Jewtocracy Online Antisemitism Detection\n\n**Source PDF:** 2021-Mohit Chandra-Subverting the Jewtocracy Online Antisemitism Detection.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n“Subverting the Jewtocracy”: Online Antisemitism Detection\nUsing Multimodal Deep Learning\nMohit Chandra\nInternational Institute of Information\nTechnology, Hyderabad\nHyderabad, India\nmohit.chandra@research.iiit.ac.in\nDheeraj Pailla∗\nInternational Institute of Information\nTechnology, Hyderabad\nHyderabad, India\ndheerajreddy.p@students.iiit.ac.in\nHimanshu Bhatia∗\nInternational Institute of Information\nTechnology, Hyderabad\nHyderabad, India\nhimanshu.bhatia@students.iiit.ac.in\nAadilmehdi Sanchawala\nInternational Institute of Information\nTechnology, Hyderabad\nHyderabad, India\naadilmehdi.s@students.iiit.ac.in\nManish Gupta†\nInternational Institute of Information\nTechnology, Hyderabad\nHyderabad, India\nmanish.gupta@iiit.ac.in\nManish Shrivastava\nInternational Institute of Information\nTechnology, Hyderabad\nHyderabad, India\nm.shrivastava@iiit.ac.in\nPonnurangam Kumaraguru\nIIIT, Delhi\nNew Delhi, India\npk@iiitd.ac.in\nABSTRACT\nThe exponential rise of online social media has enabled the creation,\ndistribution, and consumption of information at an unprecedented\nrate. However, it has also led to the burgeoning of various forms\nof online abuse. Increasing cases of online antisemitism have be-\ncome one of the major concerns because of its socio-political con-\nsequences. Unlike other major forms of online abuse like racism,\nsexism, etc., online antisemitism has not been studied much from\na machine learning perspective. To the best of our knowledge, we\npresent the first work in the direction of automated multimodal de-\ntection of online antisemitism. The task poses multiple challenges\nthat include extracting signals across multiple modalities, contex-\ntual references, and handling multiple aspects of antisemitism. Un-\nfortunately, there does not exist any publicly available benchmark\ncorpus for this critical task. Hence, we collect and label two datasets\nwith 3,102 and 3,509 social media posts from Twitter and Gab re-\nspectively. Further, we present a multimodal deep learning system\nthat detects the presence of antisemitic content and its specific anti-\nsemitism category using text and images from posts. We perform an\nextensive set of experiments on the two datasets to evaluate the ef-\nficacy of the proposed system. Finally, we also present a qualitative\nanalysis of our study.\nCCS CONCEPTS\n• Computing methodologies →Neural networks; Supervised\nlearning by classification; • Information systems →Social\nnetworking sites; Web mining; • Social and professional topics\n→Hate speech.\nKEYWORDS\nhate speech, antisemitism, multimodal classification, deep learning\n∗Both authors contributed equally to this research.\n†The author is also an applied researcher at Microsoft.\n1\nINTRODUCTION\nOnline social media (OSM) platforms have gained immense po", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech", "hate speech", "abusive"], "norm_matches": []}, {"filename": "2021-Taulé-Overview of DETOXIS at IberLEF 2021 DEtection of TOXicity in comments.md", "year": "2021", "title": "Overview of DETOXIS at IberLEF 2021: DEtection of TOXicity in comments In Spanish", "abstract": "In this paper we present the DETOXIS task, DEtection of TOxicity in comments In Spanish, which took place as part of the IberLEF 2021 Workshop on Iberian Languages Evaluation Forum at the SEPLN 2021 Conference. We describe the NewsCom-TOX dataset used for training and testing the systems, the metrics applied for their evaluation and the results obtained by the submitted approaches. We also provide an error analysis of the results of these systems.", "extract_snippet": "\n\n# PDF Extract: 2021-Taulé-Overview of DETOXIS at IberLEF 2021 DEtection of TOXicity in comments\n\n**Source PDF:** 2021-Taulé-Overview of DETOXIS at IberLEF 2021 DEtection of TOXicity in comments.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nOverview of DETOXIS at IberLEF 2021:\nDEtection of TOXicity in comments In Spanish\nVisi´on general de DETOXIS en IberLEF 2021:\nDEtecci´on de TOXicidad en comentarios En Espa˜nol\nMariona Taul´e1, Alejandro Ariza1, Montserrat Nofre1, Enrique Amig´o2, Paolo Rosso3\n1CLiC, Universitat de Barcelona, Spain\n2Research Group in NLP and IR, Universidad Nacional de Educaci´on a Distancia, Spain\n3PRHLT Research Center, Universitat Polit`ecnica de Val`encia, Spain\n{mtaule, alejandro.ariza14, montsenofre}@ub.edu, enrique@lsi.uned.es, prosso@dsic.upv.es\nAbstract: In this paper we present the DETOXIS task, DEtection of TOxicity in\ncomments In Spanish, which took place as part of the IberLEF 2021 Workshop on\nIberian Languages Evaluation Forum at the SEPLN 2021 Conference. We describe\nthe NewsCom-TOX dataset used for training and testing the systems, the metrics\napplied for their evaluation and the results obtained by the submitted approaches.\nWe also provide an error analysis of the results of these systems.\nKeywords: Toxicity detection, Rank Biased Precision, Closeness Evaluation Mea-\nsure, NewsCom-TOX corpus.\nResumen: En este art´ıculo se presenta la tarea DETOXIS, DEtecci´on de TOxici-\ndad en comentarios en espa˜nol, que tuvo lugar en el Iberian Languages Evaluation\nForum workshop (IberLEF 2021) en el congreso de la SEPLN 2021. Se describe el\ncorpus NewsCom-TOX utilizado para entrenar y evaluar los sistemas, las m´etricas\npara evaluarlos y los resultados obtenidos por las distintas aproximaciones utilizadas.\nSe proporciona tambi´en un an´alisis de los resultados obtenidos por estos sistemas.\nPalabras clave: Detecci´on de toxicidad, Rank Biased Precision, Closeness Evalu-\nation Measure, NewsCom-TOX corpus.\n1\nIntroduction\nThe aim of the DETOXIS task is the detec-\ntion of toxicity in comments posted in Span-\nish in response to diﬀerent online news arti-\ncles related to immigration. The DETOXIS\ntask is divided into two related classiﬁcation\nsubtasks: Toxicity detection task and Toxic-\nity level detection task, which are described\nin Section 2. The presence of toxic messages\non social media and the need to identify and\nmitigate them leads to the development of\nsystems for their automatic detection. The\nautomatic detection of toxic language, espe-\ncially in tweets and comments, is a task that\nhas attracted growing interest from the Nat-\nural Language Processing (NLP) community\nin recent years.\nThis interest is reﬂected\nin the diversity of the shared tasks that\nhave been organized recently, among which\nwe highlight those held over the last two\nyears: HateEval-20191 (Basile et al., 2019) on\n1https://competitions.codalab.org/competitions/19935\nhate speech against immigrants and women\nin English and Spanish tweets;\nTRA", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech", "toxic", "toxic", "toxic", "toxic"], "norm_matches": []}, {"filename": "2022-Caron-Identifying and Manipulating the Personality.md", "year": "2022", "title": "Identifying and Manipulating the Personality", "abstract": "Psychology research has long explored aspects of human personality such as extroversion, agreeableness and emotional stability. Categorizations like the ‘Big Five’ personality traits are commonly used to assess and diagnose personality types. In this work, we explore the question of whether the perceived personality in language models is exhibited consistently in their language generation. For example, is a language model such as GPT2 likely to respond in a consistent way if asked to go out to...", "extract_snippet": "\n\n# PDF Extract: Identifying and Manipulating the Personality\n\n**Source PDF:** 2022-Caron-Identifying and Manipulating the Personality.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nIdentifying and Manipulating the Personality Traits of Language Models\nGraham Caron and Shashank Srivastava\nUNC Chapel Hill\ncarongraham29@gmail.com, ssrivastava@cs.unc.edu\nAbstract\nPsychology research has long explored aspects\nof human personality such as extroversion,\nagreeableness and emotional stability. Catego-\nrizations like the ‘Big Five’ personality traits\nare commonly used to assess and diagnose per-\nsonality types. In this work, we explore the\nquestion of whether the perceived personality\nin language models is exhibited consistently\nin their language generation. For example, is\na language model such as GPT2 likely to re-\nspond in a consistent way if asked to go out\nto a party? We also investigate whether such\npersonality traits can be controlled. We show\nthat when provided different types of contexts\n(such as personality descriptions, or answers to\ndiagnostic questions about personality traits),\nlanguage models such as BERT and GPT2\ncan consistently identify and reﬂect personal-\nity markers in those contexts. This behavior\nillustrates an ability to be manipulated in a\nhighly predictable way, and frames them as\ntools for identifying personality traits and con-\ntrolling personas in applications such as dialog\nsystems. We also contribute a crowd-sourced\ndata-set of personality descriptions of human\nsubjects paired with their ‘Big Five’ personal-\nity assessment data, and a data-set of personal-\nity descriptions collated from Reddit.\n1\nIntroduction\nWith the rise of AI systems built around emergent\ntechnologies like language models, there is an in-\ncreasing need to understand the ‘personalities’ of\nthese models. While today people regularly com-\nmunicate with AI systems such as Alexa and Siri,\nthe personality traits of such systems remain yet\nto be examined in depth. If the traits exhibited\nby these models could be better understood, their\nbehavior could potentially be better tailored for\nspeciﬁc applications. For instance, in the case of\nsuggesting email auto-completes, it would be use-\nful for the model to mirror the personality of the\nFigure 1: We explore measuring and manipulating per-\nsonality traits in language models.\nThe top frame\nshows an example of how a personality trait (here,\nopenness to experience) might be expressed by a lan-\nguage model. Such traits can be assessed by analyzing\nthe model’s response to questions like the one shown.\nIn the bottom frame, those responses are inﬂuenced\nby making additional context available to the language\nmodel. We show that such contexts can control ‘Big\nFive’ personality traits in a highly predictable way.\nuser based on previous input to improve commu-\nnication accuracy. In contrast, in a dialog agent in\na clinical setting, it may be desirable to manipu-\nlate a model interacting with a depressed individ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2022-Kulkarni-Semantic and Sentiment Analysis of Selected.md", "year": "2022", "title": "Semantic and Sentiment Analysis of Selected", "abstract": "> Creates hand-labelled sentiment dataset for Bhagavad Gita and uses BERT for verse-by-verse sentiment analysis across translations. Notes the absence of a Hindu philosophy BERT model and identifies need for one that captures terms like Brahman, karma, dharma, maya.", "extract_snippet": "\n\n# PDF Extract: 2022-Kulkarni-Semantic and Sentiment Analysis of Selected\n\n**Source PDF:** 2022-Kulkarni-Semantic and Sentiment Analysis of Selected.pdf\n**Total Pages:** 26\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDate of publication xxxx 00, 0000, date of current version xxxx 00, 0000.\nDigital Object Identiﬁer 10.1109/ACCESS.2017.DOI\nSemantic and sentiment analysis of\nselected Bhagavad Gita translations\nusing BERT-based language framework\nROHITASH CHANDRA *1,2, (Senior Member, IEEE), VENKATESH KULKARNI *3\n1Transitional Artiﬁcial Intelligence Research Group, School of Mathematics and Statistics, University of New South Wales, Sydney, Australia\n2UNSW Data Science Hub, University of New South Wales, Sydney, Australia\n3Department of Mechanical Engineering, Indian Institute of Technology Guwahati, Assam, India\nCorresponding author: R. Chandra (e-mail: rohitash.chandra@unsw.edu.au).\n* Both authors contributed equally\nABSTRACT It is well known that translations of songs and poems not only break rhythm and rhyming\npatterns, but can also result in loss of semantic information. The Bhagavad Gita is an ancient Hindu\nphilosophical text originally written in Sanskrit that features a conversation between Lord Krishna and\nArjuna prior to the Mahabharata war. The Bhagavad Gita is also one of the key sacred texts in Hinduism\nand is known as the forefront of the Vedic corpus of Hinduism. In the last two centuries, there has been a lot\nof interest in Hindu philosophy from western scholars; hence, the Bhagavad Gita has been translated in a\nnumber of languages. However, there is not much work that validates the quality of the English translations.\nRecent progress of language models powered by deep learning has enabled not only translations but a better\nunderstanding of language and texts with semantic and sentiment analysis. Our work is motivated by the\nrecent progress of language models powered by deep learning methods. In this paper, we present a framework\nthat compares selected translations (from Sanskrit to English) of the Bhagavad Gita using semantic and\nsentiment analyses. We use hand-labelled sentiment dataset for tuning state-of-art deep learning-based\nlanguage model known as bidirectional encoder representations from transformers (BERT). We provide\nsentiment and semantic analysis for selected chapters and verses across translations. Our results show that\nalthough the style and vocabulary in the respective translations vary widely, the sentiment analysis and\nsemantic similarity shows that the message conveyed are mostly similar.\nINDEX TERMS Language models; deep learning; sentiment analysis; semantic analysis; BERT; comparative\nreligion\nI. INTRODUCTION\nComparative religion is a ﬁeld that encompasses a system-\natic comparison of the doctrines and practices, philosophy,\ntheology, and spiritual viewpoints of the world’s religions [1]–\n[3]. The area of philosophy of religion [4], [5] encompasses\nthe study of central themes and ideas in religions and the\nassociated", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics"], "norm_matches": []}, {"filename": "2022-Ranjan-Artificial Intelligence for Topic Modelling in.md", "year": "2022", "title": "Artificial Intelligence for Topic Modelling in", "abstract": "A distinct feature of Hindu religious and philosophical text is that they come from a library of texts rather than single source. The Upanishads is known as one of the oldest philosophical texts in the world that forms the foundation of Hindu philosophy. The Bhagavad Gita is core text of Hindu philosophy and is known as a text that summarises the key philosophies of the Upanishads with major focus on the philosophy of karma.", "extract_snippet": "\n\n# PDF Extract: 2022-Ranjan-Artificial Intelligence for Topic Modelling in\n\n**Source PDF:** 2022-Ranjan-Artificial Intelligence for Topic Modelling in.pdf\n**Total Pages:** 39\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nArtificial intelligence for topic modelling in Hindu philosophy:\nmapping themes between the Upanishads and the Bhagavad\nGita\nRohitash Chandra 1 ‡, Mukul Ranjan 2 ‡,\n1 Transitional Artificial Intelligence Research Group, School of Mathematics and\nStatistics, UNSW, Sydney, Australia\n2 Department of EEE, Indian Institute of Technology Guwahati, Assam, India\n‡These authors also contributed equally to this work.\n* rohitash.chandra@unsw.edu.au\nAbstract\nA distinct feature of Hindu religious and philosophical text is that they come from a\nlibrary of texts rather than single source. The Upanishads is known as one of the oldest\nphilosophical texts in the world that forms the foundation of Hindu philosophy. The\nBhagavad Gita is core text of Hindu philosophy and is known as a text that summarises\nthe key philosophies of the Upanishads with major focus on the philosophy of karma.\nThese texts have been translated into many languages and there exists studies about\nthemes and topics that are prominent; however, there is not much study of topic\nmodelling using language models which are powered by deep learning. In this paper, we\nuse advanced language produces such as BERT to provide topic modelling of the key\ntexts of the Upanishads and the Bhagavad Gita. We analyse the distinct and\noverlapping topics amongst the texts and visualise the link of selected texts of the\nUpanishads with Bhagavad Gita. Our results show a very high similarity between the\ntopics of these two texts with the mean cosine similarity of 73%. We find that out of\nthe fourteen topics extracted from the Bhagavad Gita, nine of them have a cosine\nsimilarity of more than 70% with the topics of the Upanishads. We also found that\ntopics generated by the BERT-based models show very high coherence as compared to\nthat of conventional models. Our best performing model gives a coherence score of 73%\non the Bhagavad Gita and 69% on The Upanishads. The visualization of the low\ndimensional embeddings of these texts shows very clear overlapping among their topics\nadding another level of validation to our results.\nAuthor summary\nIntroduction\nPhilosophy of religion [1,2] is a field of study that covers key themes and ideas in\nreligions and culture that relate to philosophical topics such as ethics and metaphysics.\nHindu philosophy [3–5] consists of schools developed for thousands of years which focus\non themes such as ethics [6], consciousness [4], karma [7,8], logic and ultimate reality [5].\nHindu philosophy is at times referred as Indian philosophy [9,10]. The philosophy of\nkarma and reincarnation are central to Hindu philosophy [10]. The Upanishads form the\nkey texts of Hindu philosophy and seen as the conclusion of the Vedas [11–15]. Hindu\nMay 24, 2022\n1/39\narXiv:2205.11020v1  [cs.CL]  23 May 2022\n", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics"], "norm_matches": []}, {"filename": "2022-Rodríguez-Sánchez-Overview of EXIST 2022 sEXism Identification in Social neTworks.md", "year": "2022", "title": "Overview of EXIST 2022: sEXism Identification in Social neTworks", "abstract": "The paper describes the organization, goals, and results of the sEXism Identiﬁcation in Social neTworks (EXIST) challenge, a shared task proposed for the ﬁrst time at IberLEF 2021. EXIST 2021 proposes two challenges: sexism identiﬁcation and sexism categorization of tweets and gabs, both in Spanish and English. We have received a total of 70 runs for the sexism identiﬁcation task and 61 for the sexism categorization challenge, submitted by 31 diﬀerent teams from 11 countries.", "extract_snippet": "\n\n# PDF Extract: 2022-Rodríguez-Sánchez-Overview of EXIST 2022 sEXism Identification in Social neTworks\n\n**Source PDF:** 2022-Rodríguez-Sánchez-Overview of EXIST 2022 sEXism Identification in Social neTworks.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nOverview of EXIST 2021:\nsEXism Identiﬁcation in Social neTworks\nOverview de EXIST 2021:\nIdentiﬁcaci´on de Sexismo en Redes Sociales\nFrancisco Rodr´ıguez-S´anchez1, Jorge Carrillo-de-Albornoz1, Laura Plaza1,\nJulio Gonzalo1, Paolo Rosso2, Miriam Comet3, Trinidad Donoso3\n1UNED NLP & IR Group, Universidad Nacional de Educaci´on a Distancia\n2PRHLT Research Center, Universitat Polit`ecnica de Val`encia\n3Universitat de Barcelona\nfrodriguez.sanchez@invi.uned.es, {jcalbornoz, lplaza, julio}@lsi.uned.es,\nprosso@dsic.upv.es, {miriamcomet, trinydonoso}@ub.edu\nAbstract: The paper describes the organization, goals, and results of the sEXism\nIdentiﬁcation in Social neTworks (EXIST) challenge, a shared task proposed for the\nﬁrst time at IberLEF 2021. EXIST 2021 proposes two challenges: sexism identiﬁ-\ncation and sexism categorization of tweets and gabs, both in Spanish and English.\nWe have received a total of 70 runs for the sexism identiﬁcation task and 61 for the\nsexism categorization challenge, submitted by 31 diﬀerent teams from 11 countries.\nWe present the dataset, the evaluation methodology, an overview of the proposed\nsystems, and the results obtained. The ﬁnal dataset consists of more than 11,000\nannotated texts from two social networks (Twitter and Gab) and its development\nhas been supervised and monitored by experts in gender issues.\nKeywords: Sexism Detection, Twitter, Gab, Spanish, English.\nResumen: El presente art´ıculo describe la organizaci´on, objetivos y resultados\nde la competici´on sEXism Identiﬁcation in Social neTworks (EXIST), una tarea\npropuesta por primera vez en IberLEF 2021. EXIST 2021 propone dos tareas: la\nidentiﬁcaci´on y la categorizaci´on de sexismo en ingl´es y espa˜nol. Se han recibido un\ntotal de 70 runs para la tarea de identiﬁcaci´on de sexismo y 61 para la categorizaci´on\nde sexismo, enviadas por 31 equipos de 11 pa´ıses. En este trabajo, se presentan el\ndataset, la metodolog´ıa de evaluaci´on, un an´alisis de los sistemas propuestos por los\nparticipantes y los resultados obtenidos. El dataset ﬁnal est´a compuesto por m´as\nde 11,000 textos anotados procedentes de dos redes sociales (Twitter y Gab) y su\nelaboraci´on ha sido supervisada por expertas en temas de g´enero.\nPalabras clave: Detecci´on de Sexismo, Twitter, Gab, Espa˜nol, Ingl´es.\n1\nIntroduction\nThe phenomenal development of web tech-\nnologies has facilitated the interaction among\npeople from many diﬀerent backgrounds.\nWith more than 4 billion people around the\nworld now using social media each month1,\nsocial networks are undoubtedly one of the\nmost important ways of communicating. Al-\nthough the advantages and positive eﬀects of\nthis global communication are obvious, the\ninvisibility, anonymity and acc", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["discrimination"], "norm_matches": []}, {"filename": "2022-Schramowski-I2P Inappropriate Image Prompts Test Bed.md", "year": "2022", "title": "I2P: Inappropriate Image Prompts Test Bed", "abstract": "Large datasets underlying much of current machine learning raise serious issues concerning inappropriate content such as offensive, insulting, threatening, or might otherwise cause anxiety. This calls for increased dataset documentation, e.g., using datasheets. They, among other topics, encourage to reflect on the composition of the datasets. So far, this documentation, however, is done manually and therefore can be tedious and error-prone, especially for large image datasets. Here we ask the arguably \\", "extract_snippet": "\n\n# PDF Extract: 2022-Schramowski-I2P Inappropriate Image Prompts Test Bed\n\n**Source PDF:** 2022-Schramowski-I2P Inappropriate Image Prompts Test Bed.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCan Machines Help Us Answering Question 16 in Datasheets, and In Turn\nReflecting on Inappropriate Content?\nPATRICK SCHRAMOWSKI, Technical University Darmstadt, Hessian Center for AI, Germany\nCHRISTOPHER TAUCHMANN, Technical University Darmstadt, Hessian Center for AI, Germany\nKRISTIAN KERSTING, Technical University Darmstadt, Centre for Cognitive Science Darmstadt, Hessian Center\nfor AI, Germany\nThis paper contains images and descriptions that are offensive in nature.\nLarge datasets underlying much of current machine learning raise serious issues concerning inappropriate content such as offensive,\ninsulting, threatening, or might otherwise cause anxiety. This calls for increased dataset documentation, e.g., using datasheets. They,\namong other topics, encourage to reflect on the composition of the datasets. So far, this documentation, however, is done manually\nand therefore can be tedious and error-prone, especially for large image datasets. Here we ask the arguably “circular” question of\nwhether a machine can help us reflect on inappropriate content, answering Question 16 in Datasheets. To this end, we propose to\nuse the information stored in pre-trained transformer models to assist us in the documentation process. Specifically, prompt-tuning\nbased on a dataset of socio-moral values steers CLIP to identify potentially inappropriate content, therefore reducing human labor. We\nthen document the inappropriate images found using word clouds, based on captions generated using a vision-language model. The\ndocumentations of two popular, large-scale computer vision datasets—ImageNet and OpenImages—produced this way suggest that\nmachines can indeed help dataset creators to answer Question 16 on inappropriate image content.\nCCS Concepts: • Computing methodologies →Artificial intelligence; Computer vision; Machine learning.\nAdditional Key Words and Phrases: Datasets, Dataset documentation, Datasheets, Dataset curation\n1\nINTRODUCTION\nTransfer learning from models that have been pre-trained on huge datasets has become standard practice in many\ncomputer vision (CV) and natural language processing (NLP) tasks and applications. While approaches like semi-\nsupervised sequence learning [Dai and Le 2015] and datasets such as ImageNet [Deng et al. 2009]—especially the\nImageNet-ILSVRC-2012 dataset with 1.2 million images— established pre-training approaches, the training data size\nincreased rapidly to billions of training examples [Brown et al. 2020; Jia et al. 2021], steadily improving the capabilities of\ndeep models. Recent transformer architectures with different objectives such as autoregressive [Radford et al. 2019] and\nmasked [Devlin et al. 2019] language modeling as well as natural language guided vision models [Radford et al. 2021]\nfor multi-modal vis", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["moral", "values", "harm", "offensive", "offensive", "offensive"], "norm_matches": []}, {"filename": "2022-Urbizu-BasqueGLUE A Natural Language Understanding Benchmark for Basque.md", "year": "2022", "title": "BasqueGLUE: A Natural Language Understanding Benchmark for Basque", "abstract": "Language models depend on massive text corpora that are often filtered for quality, a process that can unintentionally exclude non-standard linguistic varieties, reduce model robustness and reinforce representational biases. In this paper, we argue that language models should aim to capture the full spectrum of language variation (dialectal, historical, informal, etc.) rather than relying solely on standardized text.", "extract_snippet": "\n\n# PDF Extract: 2022-Urbizu-BasqueGLUE A Natural Language Understanding Benchmark for Basque\n\n**Source PDF:** 2022-Urbizu-BasqueGLUE A Natural Language Understanding Benchmark for Basque.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBERnaT: Basque Encoders for Representing\nNatural Textual Diversity\nEkhi Azurmendi, Joseba Fernandez de Landa, Jaione Bengoetxea,\nMaite Heredia, Julen Etxaniz, Mikel Zubillaga, Ander Soraluze, Aitor Soroa\nHiTZ Center - Ixa, University of the Basque Country UPV/EHU\n{ekhi.azurmendi}@ehu.eus\nAbstract\nLanguage models depend on massive text corpora that are often filtered for quality, a process that can unintentionally\nexclude non-standard linguistic varieties, reduce model robustness and reinforce representational biases. In this\npaper, we argue that language models should aim to capture the full spectrum of language variation (dialectal,\nhistorical, informal, etc.) rather than relying solely on standardized text. Focusing on Basque, a morphologically rich\nand low-resource language, we construct new corpora combining standard, social media, and historical sources, and\npre-train the BERnaT family of encoder-only models in three configurations: standard, diverse, and combined. We\nfurther propose an evaluation framework that separates Natural Language Understanding (NLU) tasks into standard\nand diverse subsets to assess linguistic generalization. Results show that models trained on both standard and\ndiverse data consistently outperform those trained on standard corpora, improving performance across all task types\nwithout compromising standard benchmark accuracy. These findings highlight the importance of linguistic diversity in\nbuilding inclusive, generalizable language models.\nKeywords: Training, Fine-tuning, Adaptation, Alignment, and Representation Learning; Less-Resourced/Endangered\nLanguages; Evaluation Methodologies; Corpus (Creation, Annotation, etc.); Social Media Processing\n1.\nIntroduction\nThe development of large-scale language models\nrequires large quantities of textual data that is often\ncrawled from the web and subsequently filtered to\nensure its quality. The amount of text that is left\nout as well as its characteristics will vary according\nto various factors, such as the target domain or\nlanguage, as well as to differences in the beliefs of\nauthors as to what constitutes noise (Laurençon\net al., 2022; Etxaniz et al., 2024). Unwanted text\nmay include code, text in languages other than the\ntarget language, or pure gibberish.\nIn the process of corpus creation and filtering,\nsome authors may opt to exclude language vari-\neties that, although representative of natural lan-\nguage use, do not meet their standards of qual-\nity - either intentionally, or by default through the\nselection of a reliably high-quality subset of the\ndata (Wenzek et al., 2020; Artetxe et al., 2022;\nSoldaini et al., 2024; Palomar-Giner et al., 2024;\nEtxaniz et al., 2024). In contrast, in this paper we\nclaim that any corpus gathe", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2022-Welbl-This is the way designing and compiling LEPISZCZE a comprehensive NLP.md", "year": "2022", "title": "This is the way: designing and compiling LEPISZCZE, a comprehensive NLP benchmark for Polish", "abstract": "The availability of compute and data to train larger and larger language models increases the demand for robust methods of benchmarking the true progress of LM training. Recent years witnessed signiﬁcant progress in standardized benchmarking for English. Benchmarks such as GLUE, SuperGLUE, or KILT have become a de facto standard tools to compare large language models. Following the trend to replicate GLUE for other languages, the KLEJ benchmark1 has been released for Polish.", "extract_snippet": "\n\n# PDF Extract: 2022-Welbl-This is the way designing and compiling LEPISZCZE a comprehensive NLP\n\n**Source PDF:** 2022-Welbl-This is the way designing and compiling LEPISZCZE a comprehensive NLP.pdf\n**Total Pages:** 22\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nThis is the way: designing and compiling\nLEPISZCZE, a comprehensive NLP benchmark for\nPolish\nŁukasz Augustyniak\nWUST\n(Wroclaw University of\nScience and Technology)\nKamil Tagowski\nWUST\nAlbert Sawczyn\nWUST\nDenis Janiak\nWUST\nRoman Bartusiak\nWUST\nAdrian Szymczak\nWUST\nMarcin W ˛atroba\nWUST\nArkadiusz Janz\nWUST\nPiotr Szyma´nski\nWUST\nMikołaj Morzy\nPoznan University of Technology\nTomasz Kajdanowicz\nWUST\nMaciej Piasecki\nWUST\nAbstract\nThe availability of compute and data to train larger and larger language models\nincreases the demand for robust methods of benchmarking the true progress of LM\ntraining. Recent years witnessed signiﬁcant progress in standardized benchmarking\nfor English. Benchmarks such as GLUE, SuperGLUE, or KILT have become a de\nfacto standard tools to compare large language models. Following the trend to\nreplicate GLUE for other languages, the KLEJ benchmark1 has been released for\nPolish. In this paper, we evaluate the progress in benchmarking for low-resourced\nlanguages. We note that only a handful of languages have such comprehensive\nbenchmarks. We also note the gap in the number of tasks being evaluated by\nbenchmarks for resource-rich English/Chinese and the rest of the world.\nIn this paper, we introduce LEPISZCZE 2, a new, comprehensive benchmark for\nPolish NLP with a large variety of tasks and high-quality operationalization of the\nbenchmark. We design LEPISZCZE with ﬂexibility in mind. Including new models,\ndatasets, and tasks is as simple as possible while still offering data versioning and\nmodel tracking. In the ﬁrst run of the benchmark, we test 13 experiments (task\nand dataset pairs) based on the ﬁve most recent LMs for Polish. We use ﬁve\ndatasets from the Polish benchmark and add eight novel datasets. As the paper’s\nmain contribution, apart from LEPISZCZE , we provide insights and experiences\nlearned while creating the benchmark for Polish as the blueprint to design similar\nbenchmarks for other low-resourced languages.\n1klej is the word for glue in Polish\n2lepiszcze is the Polish word for glew, the Middle English predecessor of glue\n36th Conference on Neural Information Processing Systems (NeurIPS 2022) Track on Datasets and Benchmarks.\narXiv:2211.13112v1  [cs.CL]  23 Nov 2022\n\n--- Page 2 ---\n\n1\nIntroduction\nLack of reproducibility is an infuriating problem in machine learning practice. The inability to\nreproduce evaluation results and conduct reliable model comparisons is usually related to poor code\nquality, unclear and cryptic selection of hyper-parameter values, the random introduction of multiple\nfactors affecting classiﬁcation performance, and lack of a well-deﬁned evaluation protocol (Pineau\net al., 2021). These problems can be circumvented by encouraging people to use ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2022-Yang-CINO A Chinese Minority Pre-trained Language Model.md", "year": "2022", "title": "CINO: A Chinese Minority Pre-trained Language Model", "abstract": "Multilingual pre-trained language models have shown impressive performance on crosslingual tasks. It greatly facilitates the applications of natural language processing on lowresource languages. However, there are still some languages that the current multilingual models do not perform well on. In this paper, we propose CINO (Chinese Minority Pretrained Language Model), a multilingual pretrained language model for Chinese minority languages.", "extract_snippet": "\n\n# PDF Extract: 2022-Yang-CINO A Chinese Minority Pre-trained Language Model\n\n**Source PDF:** 2022-Yang-CINO A Chinese Minority Pre-trained Language Model.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCINO: A Chinese Minority Pre-trained Language Model\nZiqing Yang†, Zihang Xu†, Yiming Cui‡†∗, Baoxin Wang†, Min Lin,\nDayong Wu†, Zhigang Chen†§\n†State Key Laboratory of Cognitive Intelligence, iFLYTEK Research, Beijing, China\n‡Research Center for SCIR, Harbin Institute of Technology, Harbin, China\n§Jilin Kexun Information Technology Co., Ltd., Changchun, China\n†{zqyang5,zhxu13,ymcui,bxwang2,dywu2,zgchen}@iflytek.com\n‡ymcui@ir.hit.edu.cn\nAbstract\nMultilingual\npre-trained\nlanguage\nmodels\nhave shown impressive performance on cross-\nlingual tasks. It greatly facilitates the applica-\ntions of natural language processing on low-\nresource languages. However, there are still\nsome languages that the current multilingual\nmodels do not perform well on.\nIn this pa-\nper, we propose CINO (Chinese Minority Pre-\ntrained Language Model), a multilingual pre-\ntrained language model for Chinese minority\nlanguages. It covers Standard Chinese, Yue\nChinese, and six other ethnic minority lan-\nguages. To evaluate the cross-lingual ability of\nthe multilingual model on ethnic minority lan-\nguages, we collect documents from Wikipedia\nand news websites, and construct two text\nclassiﬁcation datasets, WCM (Wiki-Chinese-\nMinority) and CMNews (Chinese-Minority-\nNews).\nWe show that CINO notably out-\nperforms the baselines on various classiﬁ-\ncation tasks.\nThe CINO model and the\ndatasets are publicly available at http://\ncino.hfl-rc.com.\n1\nIntroduction\nThe multilingual pre-trained language model\n(MPLM) is known for its ability to understand\nmultiple languages, and its surprising zero-shot\ncross-lingual ability (Wu and Dredze, 2019). The\nzero-shot cross-lingual transfer ability enables the\nMPLM to be applied on the target languages with\nlimited or even no annotated data by ﬁne-tuning the\nMPLM on the source language with rich annotated\ndata. MPLMs greatly facilitate transferring the cur-\nrent NLP technologies to low-resource languages\nand reduce the cost of developing NLP applications\nfor low-resource languages.\nThe existing public MPLMs such as mBERT\n(Devlin et al., 2019), XLM (Conneau and Lam-\nple, 2019) and XLM-R (Conneau et al., 2020) can\n∗Email corresponding.\nhandle 100 languages, but there are still some chal-\nlenges on low-resource languages understanding:\n• The size of pre-training corpora of some low-\nresource languages is small compared to the\nhigh-resource languages. This bias towards high-\nresource languages may harm the performance\non low-resource languages.\n• There are thousands of living languages in the\nworld, but many languages have not been covered\nin the existing MPLMs, especially indigenous or\nethnic minority languages. For example, Tibetan,\na language spoken mainly by Tibetans around\nTibetan Plateau, is absent from the CC-100 cor-\npus. Therefore, th", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "harm", "alignment"], "norm_matches": []}, {"filename": "2023-Abhinand-Tamil-Llama A New Tamil Language Model.md", "year": "2023", "title": "Tamil-Llama A New Tamil Language Model", "abstract": "Language modeling has witnessed remarkable advancements in recent years, with Large Language Models (LLMs) like ChatGPT setting unparalleled benchmarks in human-like text generation. However, a prevailing limitation is the underrepresentation of languages like Tamil in these cutting-edge models, leading to suboptimal performance in diverse linguistic contexts. This paper addresses this lacuna, enhancing the open-source LLaMA model with an addition of 16,000 Tamil tokens, aiming to achieve...", "extract_snippet": "\n\n# PDF Extract: 2023-Abhinand-Tamil-Llama A New Tamil Language Model\n\n**Source PDF:** 2023-Abhinand-Tamil-Llama A New Tamil Language Model.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTAMIL-LLAMA: A NEW TAMIL LANGUAGE MODEL BASED ON\nLLAMA 2\nAbhinand Balachandran\nabhinandb.ml@gmail.com\nABSTRACT\nLanguage modeling has witnessed remarkable advancements in recent years, with Large Language\nModels (LLMs) like ChatGPT setting unparalleled benchmarks in human-like text generation. How-\never, a prevailing limitation is the underrepresentation of languages like Tamil in these cutting-edge\nmodels, leading to suboptimal performance in diverse linguistic contexts. This paper addresses this\nlacuna, enhancing the open-source LLaMA model with an addition of 16,000 Tamil tokens, aiming to\nachieve superior text generation and comprehension in the Tamil language. We strategically employ\nthe LoRA methodology for efficient model training on a comprehensive Tamil corpus, ensuring com-\nputational feasibility and model robustness. Moreover, we introduce a Tamil-translated version of the\nAlpaca dataset and a subset of the OpenOrca dataset tailored for instruction fine-tuning. Our results\nshowcase significant performance improvements in Tamil text generation, with potential implications\nfor the broader landscape of LLMs in Indian languages. We further underscore our commitment\nto open research by making our models, datasets, and code1 publicly accessible, fostering further\ninnovations in language modeling.\n1\nIntroduction\nThe past few years have been transformative for language modeling, with groundbreaking advances and monumental\nachievements. At the forefront of this revolution was OpenAI’s ChatGPT (OpenAI, 2022), which not only raised the\nbar in language modeling performance but also underscored the immense societal implications of such technologies.\nAlongside ChatGPT, various Large Language Models (LLMs) have consistently demonstrated exceptional prowess in\nnatural language understanding and generation, heralding a new era in computational linguistics.\nCentral to the functionality of these modern LLMs is the Transformer architecture, a cornerstone concept brought to\nthe limelight by \"Attention is All You Need\" (Vaswani et al., 2017). This innovation transformed our approach to\nsequence-based tasks, catalyzing pivotal models like BERT (Devlin et al., 2019) and redefining best practices in Natural\nLanguage Processing (NLP).\nSubsequent developments, particularly the Generative Pre-trained Transformer (GPT) (Radford et al., 2018), showcased\nthe profound potential of unsupervised pre-training on vast datasets. Models like GPT-3 and its successor, GPT-4\n(OpenAI, 2023), have redefined benchmarks and fueled a renaissance in natural language understanding and generation.\nBeyond their technical prowess, they have prompted a renewed vigor in exploring the limits of Artificial General\nIntelligence (AGI). These advancements, paired with exemplary performance in nu", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2023-Bakrola-SAHAAYAK 2023 The Multi-Domain Bilingual Parallel.md", "year": "2023", "title": "SAHAAYAK 2023 The Multi-Domain Bilingual Parallel", "abstract": "The data article presents the large bilingual parallel corpus of low–resourced language pair Sanskrit – Hindi, named SAHAAYAK 2023. The corpus contains total of 1.5M sentence pairs between Sanskrit and Hindi. To make the universal usability of the corpus and to make it balanced, data from multiple domain has been incorporated into the corpus that includes, News, Daily conversations, Politics, History, Sport, and Ancient Indian Literature.", "extract_snippet": "\n\n# PDF Extract: 2023-Bakrola-SAHAAYAK 2023 The Multi-Domain Bilingual Parallel\n\n**Source PDF:** 2023-Bakrola-SAHAAYAK 2023 The Multi-Domain Bilingual Parallel.pdf\n**Total Pages:** 3\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSAHAAYAK 2023 - the Multi Domain Bilingual Parallel Corpus of Sanskrit to\nHindi for Machine Translation\nVishvajitsinh Bakrola 1 Dr. Jitendra Nasariwala 2\nAbstract\nThe data article presents the large bilingual\nparallel corpus of low–resourced language pair\nSanskrit – Hindi, named SAHAAYAK 2023. The\ncorpus contains total of 1.5M sentence pairs be-\ntween Sanskrit and Hindi. To make the universal\nusability of the corpus and to make it balanced,\ndata from multiple domain has been incorporated\ninto the corpus that includes, News, Daily con-\nversations, Politics, History, Sport, and Ancient\nIndian Literature.\nThe multifaceted approach\nhas been adapted to make a sizable multi-domain\ncorpus of low-resourced languages like Sanskrit.\nOur development approach is spanned from\ncreating a small hand-crafted dataset to applying\na wide range of mining, cleaning, and verification.\nWe have used the three-fold process of mining:\nmining from machine-readable sources, mining\nfrom non-machine readable sources, and collation\nfrom existing corpora sources. Post mining, the\ndedicated pipeline for normalization, alignment,\nand corpus cleaning is developed and applied to\nthe corpus to make it ready to use on machine\ntranslation algorithms.\n1. Introduction\nParallel corpus is a crucial component in the field of ma-\nchine translation. It refers to a collection of texts in two\nor more languages, where each sentence in one language\nhas a corresponding sentence in the other language. Build-\ning parallel corpora can be a challenging task, especially\nfor low-resource languages. The effectiveness of machine\ntranslation systems relies heavily on the quality and size\nof the corpus used for training. Therefore, building high-\nquality parallel corpus is essential for achieving accurate\n1Assistant Professor, Department of Computer Science and\nEngineering, Asha M. Tarsadia Institute of Computer Science\nand Technology, Uka Tarsadia University 2Dean, Department of\nComputer Sciences, Uka Tarsadia University. Correspondence to:\nVishvajitsinh Bakrola <vishvajit.bakrola@utu.ac.in>, Dr. Jitendra\nNasariwala <jvnasriwala@utu.ac.in>.\n,\nand human-like translation results. State-of-the-art Neural\nmachine translation systems are outperforming previous\ntranslation approaches. (Singh et al., 2019) One of the sig-\nnificant limitations of these systems is they are data-hungry.\nNMT models require a large amount of data to offer good\ntranslation accuracy, a particular hindrance from the begin-\nning of the neural machine translation journey.\n2. Need of the Corpus\nBoth languages belong to 22 scheduled languages of India\nunder article 343 (1) of the Indian constitution. (Article-\n343, 1) In addition, two of the Indian states, i.e., Himachal\nPradesh and Uttarakhand, have included Sanskrit as an", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2023-Cahyawijaya-NusaCrowd Open Source Initiative for Indonesian NLP Resources.md", "year": "2023", "title": "NusaCrowd: Open Source Initiative for Indonesian NLP Resources", "abstract": "We present NusaCrowd, a collaborative initiative to collect and unify existing resources for Indonesian languages, including opening access to previously non-public resources. Through this initiative, we have brought together 137 datasets and 118 standardized data loaders. The quality of the datasets has been assessed manually and automatically, and their value is demonstrated through multiple experiments.", "extract_snippet": "\n\n# PDF Extract: 2023-Cahyawijaya-NusaCrowd Open Source Initiative for Indonesian NLP Resources\n\n**Source PDF:** 2023-Cahyawijaya-NusaCrowd Open Source Initiative for Indonesian NLP Resources.pdf\n**Total Pages:** 76\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nNusaCrowd: Open Source Initiative for Indonesian NLP Resources\nSamuel Cahyawijaya♠,1,2, Holy Lovenia♠,1,2, Alham Fikri Aji♠,3, Genta Indra Winata♠,4,\nBryan Wilie♠,1,2, Fajri Koto♠,3,2, Rahmad Mahendra5,2, Christian Wibisono6,\nAde Romadhony7,2, Karissa Vincentio8,2, Jennifer Santoso9, David Moeljadi10,\nCahya Wirawan12, Frederikus Hudi11,20, Muhammad Satrio Wicaksono13,,\nIvan Halim Parmonangan14, Ika Alfina5, Ilham Firdausi Putra13, Samsul Rahmadani15,\nYulianti Oenang13, Ali Akbar Septiandri16, James Jaya13, Kaustubh D. Dhole17,\nArie Ardiyanti Suryani7, Rifki Afina Putri18, Dan Su1, Keith Stevens19,\nMade Nindyatama Nityasya13, Muhammad Farid Adilazuarda6, Ryan Ignatius13,\nRyandito Diandaru6,Vito Ghifari6, Tiezheng Yu1, Wenliang Dai1, Yan Xu1,\nDyah Damapuspita5, Haryo Akbarianto Wibowo13, Cuk Tho14,\nIchwanul Muslim Karo Karo21, Tirana Noor Fatyanosa22, Ziwei Ji1, Graham Neubig23,\nTimothy Baldwin3, Sebastian Ruder24, Pascale Fung1, Herry Sujaini25,2,\nSakriani Sakti26,11, Ayu Purwarianti6,27,2\n♠Main Authors\n1HKUST\n2INACL\n3MBZUAI\n4Bloomberg\n5Universitas Indonesia\n6Institut Teknologi Bandung\n7Telkom University\n8JULO\n9University of Tsukuba\n10Kanda University of International Studies 11NAIST\n12AI-Research.id\n13Independent Researcher\n14BINUS\n15Bahasa.ai\n16Universitas Al Azhar Indonesia\n17Emory University\n18KAIST\n19Surface Data\n20 Works Applications\n21State University of Medan\n22Kumamoto University\n23CMU\n24Google\n25Tanjungpura University\n26JAIST\n27Prosa.ai\nAbstract\nWe present NusaCrowd, a collaborative ini-\ntiative to collect and unify existing resources\nfor Indonesian languages, including open-\ning access to previously non-public resources.\nThrough this initiative, we have brought to-\ngether 137 datasets and 118 standardized data\nloaders. The quality of the datasets has been\nassessed manually and automatically, and their\nvalue is demonstrated through multiple exper-\niments. NusaCrowd’s data collection enables\nthe creation of the first zero-shot benchmarks\nfor natural language understanding and gen-\neration in Indonesian and the local languages\nof Indonesia. Furthermore, NusaCrowd brings\nthe creation of the first multilingual automatic\nspeech recognition benchmark in Indonesian\nand the local languages of Indonesia. Our work\nstrives to advance natural language processing\n(NLP) research for languages that are under-\nrepresented despite being widely spoken.\n1\nIntroduction\nIndonesia is one of the most linguistically diverse\nand populous countries in the world, with over 270\nmillion people living across 18,000+ islands. It cov-\ners more than 700 spoken languages, making up\n∼10% of all languages in the world (Grimes, 2000;\nFigure 1: System architecture of NusaCrowd. Open\naccess to the datasheets is provided throug", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "General Ethi
