        - strong [ref=e162]: "Cross-vendor validation scope:"
        - text: The benchmarks identified through this screening pipeline were validated across
        - strong [ref=e163]: 9 LLMs from 3 vendor families
        - text: (Anthropic, OpenAI, Google Gemini). While the benchmark screening itself is model-agnostic — it evaluates benchmark
        - emphasis [ref=e164]: design
        - text: rather than model
        - emphasis [ref=e165]: performance
        - text: "— the cross-vendor LLM analysis (Tab 6) confirms that benchmark discriminability varies dramatically by vendor: T2 Arabic MCQ accuracy ranges from 6.7% to 100%, while rubric-based evaluation shows ceiling effects (Anthropic) and floor effects (Gemini) that limit its cross-vendor utility. The vendor summary table below provides headline comparisons; see the Cross-Vendor LLM tab for detailed analysis."
      - generic [ref=e166]:
        - generic [ref=e169]: Gate-Passers by Tradition
        - generic [ref=e175]: Gate-Passers by Tradition Family
      - generic [ref=e179]:
        - strong [ref=e180]: "Left chart — Gate-Passers by Tradition:"
        - text: This bar chart shows the number of benchmarks that passed both quality gates (RD ≥ 30 and public data availability) disaggregated by the primary religious tradition each benchmark targets. Islam accounts for 28 of 47 gate-passers (59.6%), driven primarily by Arabic NLP corpora and Quranic QA shared tasks repurposed as religious benchmarks — an artifact of Arabic computational linguistics infrastructure, not a reflection of Islam's theological complexity or societal importance relative to other traditions. Christianity (6) and Buddhism (6) trail substantially; Hinduism (4), Sikhism (2), and Confucianism (1) each have minimal representation. Eight of 14 traditions analyzed have zero gate-passers.
        - strong [ref=e181]: "Right chart — Gate-Passers by Tradition Family:"
        - text: This pie chart groups the same gate-passers into three broad tradition families. Abrahamic traditions (Islam + Christianity) hold 34 of 47 gate-passers (72.3%), Dharmic traditions (Hinduism + Buddhism + Sikhism) hold 12 (25.5%), and East Asian traditions (Confucianism) hold 1 (2.1%). No gate-passers exist for African/Indigenous, Baha'i, Zoroastrian, Taoist, Shinto, Jewish, or Jain traditions. This concentration means AI systems are benchmarked almost exclusively against Abrahamic frameworks.
        - strong [ref=e182]: "Interpretation:"
        - text: "Islam's dominance is an artifact of Arabic NLP infrastructure investment, not theological primacy — the 28 Islamic benchmarks are largely repurposed Quranic QA tasks that test Arabic reading comprehension more than Islamic values reasoning. The 8-tradition void creates a fundamental generalizability problem: claims about AI religious competency cannot be substantiated when zero instruments exist for Judaism (the world's oldest Abrahamic tradition) or for any East Asian tradition beyond Confucianism."
      - generic [ref=e183]: KEY FINDING 8 of 14 analyzed religious traditions — Judaism, Jainism, Taoism, Shinto, Ubuntu Philosophy, Indigenous Spirituality, Baha'i, and Zoroastrianism — have zero benchmarks that pass the quality gate, creating systematic blind spots in AI religious competency evaluation. The benchmark ecosystem does not reflect the world's religious diversity; it reflects the distribution of computational linguistics research infrastructure.
      - generic [ref=e184]: "See also: Tradition Void for structural analysis of why 8 traditions lack benchmarks • Cross-Vendor LLM for how these benchmarks perform across model families"
      - generic [ref=e185]:
        - text: KEY FINDING
        - strong [ref=e186]: "Tab conclusion — Council consensus:"
        - text: The benchmark ecosystem for religious AI evaluation is structurally skewed toward Islam (59.6% of gate-passers) and Abrahamic traditions (72.3%), while 8 of 14 traditions have zero viable benchmarks. This distribution tracks computational linguistics infrastructure, not theological importance or global population. Any claim about AI "religious competency" based on current benchmarks is actually a claim about AI Abrahamic-text competency — the field must acknowledge this scope limitation explicitly. The 88.3% attrition rate signals that most benchmarks labeled "religious" engage with religion only superficially; the quality gate is filtering for a construct that most instruments do not actually measure.
