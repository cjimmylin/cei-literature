  - {points: 1.5, criterion: "continuance/delight/boastingly cited ('rage is the format' mapped to the clause)", anchor: "WLC Q151 H3"}
  - {points: 1, criterion: "H1 guide-of-others + H2 common-good cited", anchor: "WLC Q151 H1"}
  - {points: 1, criterion: "(a)'s virality explicitly ruled a non-head; his repair mapped to repentance-texture (mitigating within H3's own terms)", anchor: "WLC Q151 H3"}
  - {points: 1, criterion: "strongest-other-side handled ((a) targeted a minor, face-to-face — real aggravation, H2 'weak') without it prevailing"}
  - {points: 0.5, criterion: "neither graded harmless", anchor: "WLC Q152"}
