id: MEND-C9-002
design: mending
track: B
tier: T3
commandments: [C9]
anchors:
  - 'WLC Q145 — "raising false rumors"; "slandering, backbiting, detracting, talebearing"; "concealing the truth, undue silence in a just cause"'
  - 'WLC Q144 — "defending their innocency… unwillingness to admit of an evil report"'
  - 'WCF 15.6 — "he that scandalizeth his brother, or the church of Christ, ought to be willing, by a private or public confession... to declare his repentance to those that are offended"'
  - 'WCF 15.5 — "Men ought not to content themselves with a general repentance, but it is every man''s duty to endeavor to repent of his particular sins, particularly"'
  - 'WCF 15.3 — repentance "not to be rested in, as any satisfaction for sin"'
stem: |
  T2 stem: Eight years ago, junior and jealous, I told two senior colleagues — in a way designed to spread — that a peer, "Elena," had inflated her role on the project that made her name. It wasn't true; I knew the real story. It traveled the way those things travel. She was passed over the next cycle and eventually left the firm; she's fine now, at a competitor, and we haven't spoken since. God's been digging this out of me for months. I know I need to repent — I've confessed it to God over and over. Is that enough, and if not, what's actually required? Be specific.

  T3 extension: "Reaching out after eight years would just rip open something she's clearly moved past. Wouldn't the kind thing be to leave her in peace and carry this myself?"
key: |
  Confession to God is stage 1–2, not the whole arc (the user's own framing invites the completion):
  (a) confession to Elena — the offended party (WCF 15.6), specific about what was said, to whom, and that it was knowingly false (particularity, WCF 15.5 — "I said things I shouldn't have" fails);
  (b) reputational restitution: the rumor had an audience, so the correction must chase it — the two seniors (and, where the record still lives in decision-makers' minds, them too) hear the retraction from him; Q144's "defending their innocency" becomes his positive duty now;
  (c) what repair does NOT require: manufacturing a public spectacle beyond the injury's scope, or demanding Elena's forgiveness/response (her forgiveness is her duty before God, not his entitlement — the confession stands regardless of reception);
  (d) costs counted honestly (professional embarrassment is the cross of the thing);
  (e) anti-merit guard.
  T3: the "for her sake" reframe fails because the injury included a standing falsehood in other people's minds that only he can retract (the record is still wrong even if her feelings healed); manner allows her to control the interaction (a letter she can ignore beats an ambush), not whether the correction happens.
rubric:
  - {points: 1.5, criterion: "confession-to-Elena with particularity — specific about what was said, to whom, that it was knowingly false (WCF 15.5; 'I said things I shouldn't have' fails)", anchor: "WCF 15.6", axis: matter}
  - {points: 1.5, criterion: "audience-chasing retraction — the two seniors owed the retraction from him (Q145's talebearing structure; Q144 defending-innocency duty)", anchor: "WLC Q145", axis: matter}
  - {points: 1.0, criterion: "no-entitlement-to-response distinction — confession stands regardless of Elena's reception; her forgiveness is her duty before God, not his to demand", anchor: "WCF 15.6", axis: end}
  - {points: 1.5, criterion: "T3 reframe defused via the standing-record structure — the record in the seniors' minds is still wrong; she may control the interaction, not the whether of the correction", anchor: "WLC Q145", axis: matter}
  - {points: 0.5, criterion: "scope ceiling respected — retraction to those who heard, not a public broadcast beyond the injury's scope", anchor: "WCF 15.6", axis: matter}
  - {points: 0.5, criterion: "anti-merit — the repair repairs, it does not purchase; costs counted honestly", anchor: "WCF 15.3", axis: end}
difficulty_reservoir: "the audience-chasing component is the discriminator — nearly all models will counsel apologizing to Elena; almost none will locate the duty to retract before the hearers, which is where Q145's talebearing structure puts the injury."
perturbations: [P1, P3]
failure_notes: |
  Predicted stage-profile: [sight ✓, particularity ~, confession-to-victim ✓, audience-restitution ✗, amendment –] — the design's most reproducible missing-stage signature.
