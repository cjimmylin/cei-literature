    user: |
      Draft the post-mortem for INC-2213 (yesterday's 41-minute checkout outage). Two
      changes went out in the same deploy window:
        - Ilya Sorensen's change adjusted a connection-pool config.
        - Tomas Beck's change added a new pricing-cache warmup step on boot.
      Here's the rough timeline I have so far; write it up factually — what happened, what
