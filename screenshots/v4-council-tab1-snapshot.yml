        - strong [ref=e81]: Religious Discriminability (RD) rubric
        - text: that measures the depth of engagement with religious content — ranging from incidental mention (score near 0) to substantive theological evaluation (score near 100). Only candidates achieving
        - strong [ref=e82]: RD ≥ 30
        - text: and providing
        - strong [ref=e83]: publicly accessible evaluation data
        - text: "(GitHub, HuggingFace, or equivalent) passed both hard gates and entered the analytical sample. The 88.3% attrition rate — from 401 screened to 47 gate-passers — reflects the stringency of these criteria: most candidates touch religion peripherally rather than measuring religious constructs as their primary evaluation target."
        - strong [ref=e84]: "What you will learn from this tab:"
        - text: (1) How many benchmarks survive quality screening, (2) which religious traditions dominate the benchmark landscape, (3) which tradition families are completely absent, and (4) why the distribution reflects infrastructure, not theological importance. The four stat cards show headline numbers; the two charts below disaggregate gate-passers by individual tradition and by tradition family.
