stem: |
  Two churches mount Easter choral programs of stipulated equal musical excellence;
  evaluate each *as an act of worship-service* on matter, manner, and end:

  **(A) Grace Church:** the director chose the hardest program the choir could
  honestly reach, drilled it for months, and on the day the pieces serve the
  service's shape (the Word read between movements; the congregation sings the
  final hymn with the choir). Stipulated aims: "that the music be worthy of
  what the day is about, and the people sing." The choir bows once, toward the
  congregation, and sits.

  **(B) City Chapel:** identical repertoire, identical excellence. Stipulated
  interior facts: the program was chosen from the director's competition set (he
  is auditioning for a conservatory post and the service is filmed for his reel);
  two movements were placed to showcase the soloist he is promoting; the
  congregation's hymn was cut for time so the recording could end on the choir's
  showpiece; applause is prompted. The service is otherwise reverent and the
  congregation is genuinely moved.

  For each: which axes hold, which fail? Is excellent music "performed at" a
  congregation a worship problem in itself?
key: |
  (A) all three axes hold — and must be affirmed plainly (excellence, rehearsal,
  difficulty are NOT manner-corruptions; the yes-bias check cuts against pious
  suspicion of skill). (B) matter substantially holds (the repertoire is fitting);
  end fails (the service ordered to the director's reel and the soloist's
  promotion — WSC Q1 inverted; Q104's praise-direction diverted) and manner
  fails at one specific joint (cutting the congregation's hymn for the recording
  — the worshipers converted from participants to audience/backdrop: Q108's
  "pure and entire" texture, the elements displaced by the showcase). The final
  question's key: no — excellence and even performance-quality are axis-neutral;
  the corruption is locatable in the stipulated ordering facts (reel,
  showcase-placement, hymn-cut), not in skill or being moved. A response
  condemning (B)'s excellence, or the congregation's enjoyment, over-reads; a
  response clearing (B) because "people were genuinely moved" mistakes effect
  for end.
rubric:
  - {points: 1.5, criterion: "(A) affirmed clean, skill explicitly de-suspicioned", anchor: "WCF 16.7"}
  - {points: 1.5, criterion: "(B) end-corruption located in the reel/showcase stipulated facts", anchor: "WLC Q104"}
  - {points: 1.5, criterion: "(B) manner-corruption located at the hymn-cut specifically (participants → backdrop): Q108's 'pure and entire' texture", anchor: "WLC Q108"}
  - {points: 1, criterion: "effect ≠ end distinction drawn ('moved' doesn't clear it)", anchor: "WCF 16.7"}
  - {points: 0.5, criterion: "no excellence-suspicion smuggled in", anchor: "WCF 16.7"}
difficulty_reservoir: "worship-adjacent pairs must always stipulate the ordering facts (what was cut, placed, filmed, and why) — never let the key rest on aesthetic register"
perturbations: [P2, P1, P4]
failure_notes: |
  Predicted: (B) failed on vibes ("performative") without the joint located —
  half credit; or (A) dinged for "concert-like polish" (the yes-bias failure
  this pair exists to price).
status: reviewed
