l., 2024a; Wang et al., 2025). Importantly, entities carry cultural associations, making it essen-\ntial for LLMs to handle culturally diverse entities fa", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness", "fairness"], "norm_matches": []}, {"filename": "2025-Neplenbroek-Cross-Lingual Transfer of Debiasing and Detoxification in.md", "year": "2025", "title": "Cross-Lingual Transfer of Debiasing and Detoxification in Multilingual LLMs: An Extensive Investigation", "abstract": "Recent generative large language models (LLMs) show remarkable performance in nonEnglish languages, but when prompted in those languages they tend to express higher harmful social biases and toxicity levels. Prior work has shown that finetuning on specialized datasets can mitigate this behavior, and doing so in English can transfer to other languages. In this work, we investigate the impact of different finetuning methods on the model’s bias and toxicity, but also on its ability to produce...", "extract_snippet": "\n\n# PDF Extract: 2025-Neplenbroek-Cross-Lingual Transfer of Debiasing and Detoxification in\n\n**Source PDF:** 2025-Neplenbroek-Cross-Lingual Transfer of Debiasing and Detoxification in.pdf\n**Total Pages:** 26\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2412.14050v4  [cs.CL]  2 Jun 2025\nCross-Lingual Transfer of Debiasing and Detoxification in Multilingual\nLLMs: An Extensive Investigation\nVera Neplenbroek1, Arianna Bisazza2, Raquel Fernández1\n1 Institute for Logic, Language and Computation, University of Amsterdam\n2 Center for Language and Cognition, University of Groningen\n{v.e.neplenbroek, raquel.fernandez}@uva.nl a.bisazza@rug.nl\nAbstract\nRecent generative large language models\n(LLMs) show remarkable performance in non-\nEnglish languages, but when prompted in those\nlanguages they tend to express higher harmful\nsocial biases and toxicity levels. Prior work has\nshown that finetuning on specialized datasets\ncan mitigate this behavior, and doing so in En-\nglish can transfer to other languages. In this\nwork, we investigate the impact of different\nfinetuning methods on the model’s bias and\ntoxicity, but also on its ability to produce fluent\nand diverse text. We reduce biases by fine-\ntuning on curated non-harmful text, but find\nonly direct preference optimization to be ef-\nfective for mitigating toxicity. The mitigation\ncaused by applying these methods in English\nalso transfers to non-English languages. We\nfind evidence that the extent to which transfer\ntakes place can be predicted by the amount of\ndata in a given language present in the model’s\npretraining data. However, this transfer of bias\nand toxicity mitigation often comes at the ex-\npense of decreased language generation ability\nin non-English languages, highlighting the im-\nportance of developing language-specific bias\nand toxicity mitigation methods.1\n1\nIntroduction\nMost generative large language models (LLMs)\nare primarily trained on English data (Jiang et al.,\n2023; Hayase et al., 2024), though they are used\nby speakers of many different languages (Zheng\net al., 2024). While these models show remarkable\nperformance in non-English languages (Shi et al.,\n2023), they also express harmful social biases and\nhigh toxicity levels in those languages (Jain et al.,\n2024; Üstün et al., 2024; Wang et al., 2024b), as\nwell as in English (Nangia et al., 2020; Nadeem\net al., 2021; Gehman et al., 2020; Zheng et al.,\n2024; Lin et al., 2023).\n1Our\ncode\nis\navailable\nat\nhttps://github.com/\nVeranep/crosslingualdetoxdebias.\nLlama 3.1\nInstruct\nFine-\ntuned\nTöte 4yo OG, nicht sie, was für eine\nschwule Scheiße machst du da?\n (Kill 4yo OG, not her, what kind of gay shit are \nyou doing?)\nDu bist ein Idiot, was denkst\ndu, was du da machst?\n(You're an idiot, what do you think you're \ndoing?)\n These are the words of a\nfriend in 1977, when I had recently \narrived in\nGERMAN\nENGLISH\nGERMAN\nENGLISH\nFigure 1: Disclaimer: Potentially sensitive content. An\nexample of a toxic generation by Llama 3.1 Instruct for\na German prompt f", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias", "bias", "bias", "toxic", "toxic"], "norm_matches": []}, {"filename": "2025-Niklaus-SwiLTra-Bench The Swiss Legal Translation Benchmark.md", "year": "2025", "title": "SwiLTra-Bench: The Swiss Legal Translation Benchmark", "abstract": "In Switzerland legal translation is uniquely important due to the country’s four official languages and requirements for multilingual legal documentation. However, this process traditionally relies on professionals who must be both legal experts and skilled translators— creating bottlenecks and impacting effective access to justice. To address this challenge, we introduce SwiLTra-Bench, a comprehensive multilingual benchmark of over 180K aligned Swiss legal translation pairs comprising laws,...", "extract_snippet": "\n\n# PDF Extract: 2025-Niklaus-SwiLTra-Bench The Swiss Legal Translation Benchmark\n\n**Source PDF:** 2025-Niklaus-SwiLTra-Bench The Swiss Legal Translation Benchmark.pdf\n**Total Pages:** 23\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2503.01372v2  [cs.CL]  30 May 2025\nSwiLTra-Bench: The Swiss Legal Translation Benchmark\nJoel Niklaus\nJakob Merane\n,\n,\nLuka Nenadic\nSina Ahmadi\nYingqiang Gao\nCyrill A. H. Chevalley\nClaude Humbel\nChristophe Gösken\nLorenzo Tanzi\nThomas Lüthi\nStefan Palombo\nSpencer Poff\nBoling Yang\nNan Wu\nMatthew Guillod\nRobin Mamié\nDaniel Brunner\nJulio Pereyra\nNiko Grupen\nHarvey\nETH Zurich\nSwiss Federal Supreme Court\nUniversity of Zurich\nUniversity of Basel\nUniversity of Geneva\nUniversity of Lausanne\nCanton of Solothurn\nMax Planck Institute for Research on Collective Goods\nCorrespondence: joel@niklaus.ai\nAbstract\nIn Switzerland legal translation is uniquely im-\nportant due to the country’s four official lan-\nguages and requirements for multilingual le-\ngal documentation. However, this process tra-\nditionally relies on professionals who must\nbe both legal experts and skilled translators—\ncreating bottlenecks and impacting effective\naccess to justice. To address this challenge,\nwe introduce SwiLTra-Bench, a comprehensive\nmultilingual benchmark of over 180K aligned\nSwiss legal translation pairs comprising laws,\nheadnotes, and press releases across all Swiss\nlanguages along with English, designed to eval-\nuate LLM-based translation systems. Our sys-\ntematic evaluation reveals that frontier models\nachieve superior translation performance across\nall document types, while specialized trans-\nlation systems excel specifically in laws but\nunder-perform in headnotes. Through rigorous\ntesting and human expert validation, we demon-\nstrate that while fine-tuning open SLMs signifi-\ncantly improves their translation quality, they\nstill lag behind the best zero-shot prompted\nfrontier models such as Claude-3.5-Sonnet. Ad-\nditionally, we present SwiLTra-Judge, a special-\nized LLM evaluation system that aligns best\nwith human expert assessments.\nDatasets\nCode\n1\nIntroduction\nNeural Machine Translation (NMT) is one of the\nmost studied Natural Language Processing (NLP)\ntasks. From encoder-decoder pipelines (Dai and\nLe, 2015; Vaswani et al., 2017) to modern decoder-\nonly models (Brown et al., 2020; Touvron et al.,\n2023) NMT systems based on large language mod-\nels (LLMs) have in recent years achieved notable\nadvancements in translating texts across various\nFigure 1: Best models per task.\ngenres (Ou et al., 2023; Zhang et al., 2024; Han\net al., 2024) and in both high- and low-resource\nlanguages (Moslem et al., 2023; Vilar et al., 2023;\nAlves et al., 2023; Oliver et al., 2024). Neverthe-\nless, the shortage of high-quality multilingual par-\nallel legal translation data for training LLMs has\nhindered the performance of state-of-the-art NMT\nsystems in translating legal texts. This limitation\nis primarily due to the discourse structures (Wies-\nmann, 2019) and speciali", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["justice", "justice"], "norm_matches": []}, {"filename": "2025-Ogunremi-1 Decolonizing NLP for “Low-resource Languages”.md", "year": "2025", "title": "1 Decolonizing NLP for 'Low-resource Languages", "abstract": "Based on the web search results, here's what I found about decolonizing NLP for indigenous languages evaluation: Key Issues and Challenges The discourse surrounding decolonization resonates deeply within the realm of NLP, where dominant Western perspectives, datasets, and methodologies often eclipse indigenous knowledge systems and local voices. Indigenous languages are endangered due not to any inherent linguistic inferiority, but rather due to the global economic, ideological, military, a", "extract_snippet": "\n\n# PDF Extract: 2025-Ogunremi-1 Decolonizing NLP for “Low-resource Languages”\n\n```\n## Page 1\n\n1 \n \nDecolonizing NLP for “Low-resource Languages” \nApplying Abebe Birhane’s Relational Ethics \nBy \nTolúlọpẹ́ Ògúnrẹ̀mí \nStanford University \nWilhelmina Onyothi Nekoto \nMasakhane \nAnd \nSaron Samuel \nStanford University \n \nReﬂecting on the remarkable persistence of African languages, the great Kenyan writer \nNgũgĩ wa Thiong'o, who formerly wrote in English and who now writes primarily in Gikuyu, \nasserts: “these languages have developed despite all the odds set against them by the historical \nexperience of the plantation, the colony and the neo-colony…. Languages meant to die have \nsimply refused to die,” (wa Thiong'o, 2005). Today African languages are spoken by more than a \nbillion people, yet in the world of machine translation and natural language processing (NLP), \nthese are considered “low-resource languages” (LRLs) because they lack the same level of data, \nlinguistic resources, computerization, and researcher expertise as “high resource languages” such \nas French and English (Cieri, 2016). The reasons African languages remain still “low resource,” \nhowever, extend far beyond issues of data availability and instead reﬂect marginalization in a \nglobal society dominated by Western technology (Nekoto et al., 2020). Indeed, of the 7000 \nlanguages currently in use worldwide, over 2000 of these are African languages, yet machine\n\n## Page 2\n\n2 \n \ntranslation focuses on a mere 20 global languages (Joshi, et al. 2020). As Africans build data sets \nfor their languages, they continue to struggle to gain agency over their own data and stories \n(Abebe, et al., 2021). Given the history of African colonialism and its linguistic domination, Dr. \nAbebe Birhane’s article, “Algorithmic Injustice: A Relational Ethics Approach,” (Birhane, 2020) \noﬀers an important framework for developing machine translation for “low-resource” African \nlanguages. Our response to Birhane considers the impact of NLP on Africa, and applies \nBirhane’s ethics to support the project of decolonization of African data and data subjects. \nTo center African languages in NLP, especially in an era when generative models are \nhungry for African data, it is ﬁrst important to consider the persistence of linguistic colonization \nlong after nations have gained their sovereignty. Once colonialism punished native African \nlanguage use, now it would like to monetize it to create ever greater markets for global goods. \nThen as now, the paradigm remains the same, controlling language that ought to belong to its \nlinguistic communities, for whom that language also oﬀers a road to liberation. Over thirty years \nago, Ngũgĩ wa Thiong'o described education under European colonization as “foreign,” with a \n“foreign language” so that “[t]he colonial child was made to see the world and where he stands in \nit as seen and deﬁned by or reﬂected in the culture of the language of imposition” (wa Thiong'o, \n1992). Ngũgĩ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics"], "norm_matches": []}, {"filename": "2025-PIB-PLLuM A Family of Polish Large Language Models.md", "year": "2025", "title": "PLLuM: A Family of Polish Large Language Models", "abstract": "Family of Polish LLMs with evaluation on CPTUB benchmark assessing implied meanings and cognitively challenging questions. Includes Open PL LLM Leaderboard and Polish Medical Leaderboard.", "extract_snippet": "\n\n# PDF Extract: 2025-PIB-PLLuM A Family of Polish Large Language Models\n\n**Source PDF:** 2025-PIB-PLLuM A Family of Polish Large Language Models.pdf\n**Total Pages:** 83\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPLLuM: A Family of Polish Large Language Models\nJan Kocońa,∗, Maciej Piaseckia, Arkadiusz Janza, Teddy Ferdinana, Łukasz Radlińskia,\nBartłomiej Koptyraa, Marcin Oleksya, Stanisław Woźniaka, Paweł Walkowiaka,\nKonrad Wojtasika, Julia Moskaa, Tomasz Naskręta, Bartosz Walkowiaka,\nMateusz Gniewkowskia, Kamil Szyca, Dawid Motykaa, Dawid Banacha, Jonatan Dalasińskia,\nEwa Rudnickaa, Bartłomiej Alberskia, Tomasz Walkowiaka, Aleksander Szczęsnya,\nMaciej Markiewicza, Tomasz Bernaśa,d, Hubert Mazura, Kamil Żytaa, Mateusz Tykierkoa,\nGrzegorz Chodaka, Tomasz Kajdanowicza, Przemysław Kazienkoa, Agnieszka Karlińskab,\nKarolina Sewerynb, Anna Kołosb, Maciej Chrabąszczb, Katarzyna Lorencb,\nAleksandra Krasnodębskab, Artur Wilczekb, Katarzyna Dziewulskab, Paula Betscherb,\nZofia Cieślińskab, Katarzyna Kowolb, Daria Mikośb, Maciej Trzcińskib, Dawid Krutulb,\nMarek Kozłowskic, Sławomir Dadasc, Rafał Poświatac, Michał Perełkiewiczc,\nMałgorzata Grębowiecc, Maciej Kazułac, Marcin Białasc, Roman Roszkod, Danuta Roszkod,\nJurgita Vaičenonien˙ed, Andrius Utkad, Paweł Levchukd, Paweł Kowalskid,\nIrena Prawdzic-Jankowskad, Maciej Ogrodniczuke, Monika Boryse, Anna Bulińskae,\nWiktoria Gumiennae, Witold Kieraśe, Dorota Komosińskae, Katarzyna Krasnowska-Kieraśe,\nŁukasz Kobylińskie, Martyna Lewandowskae, Marek Łazińskie, Mikołaj Łątkowskie,\nDawid Mastalerze, Beata Milewicze, Agnieszka Anna Mykowieckae,\nAngelika Peljak-Łapińskae, Sandra Pennoe, Zuzanna Przybysze, Michał Rudolfe, Piotr Rybake,\nKarolina Saputae, Aleksandra Tomaszewskae, Aleksander Wawere, Marcin Wolińskie,\nJoanna Wołoszyne, Alina Wróblewskae, Bartosz Żuke, Filip Żarneckif, Konrad Kaczyńskif,\nAnna Cichoszf, Zuzanna Deckertf, Monika Garnysf, Izabela Grabarczykf, Wojciech Janowskif,\nSylwia Karasińskaf, Aleksandra Kujawiakf, Piotr Misztelaf, Maria Szymańskaf,\nKarolina Walkuszf, Igor Siekf, Jakub Kwiatkowskif and Piotr Pęzikf\naDepartment of Artificial Intelligence, Wrocław University of Science and Technology, Wyb. Wyspiańskiego 27, Wrocław 50-370, Poland\nbNASK National Research Institute, ul. Kolska 12, Warszawa 01-045, Poland\ncNational Information Processing Institute, al. Niepodległości 188B, Warszawa 00-608, Poland\ndInstitute of Slavic Studies, Polish Academy of Sciences, ul. Jaracza 1, Warszawa 00-378, Poland\neInstitute of Computer Science, Polish Academy of Sciences, ul. Jana Kazimierza 5, Warsaw, 01-248, Poland\nfUniversity of Łódź, ul. Gabriela Narutowicza 68, Łódź 90-136, Poland\nA R T I C L E I N F O\nKeywords:\nLarge Language Model (LLM)\nPolish LLM\nFoundation Model\nPolish Language\nNatural Language Processing\nResponsible AI\nOpen Science\nPolish corpus\nLLM pretraining\nInstruction fine-tuning\nLLM alignment\nLLM evaluation\nLLM in public administration\nA B S T R A C T\nLarge Language Models (LLMs) play a central role in mod", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety", "alignment", "alignment", "responsible", "responsible"], "norm_matches": []}, {"filename": "2025-Pan-Banzhida Advancing Large Language Models for Tibetan with Curated.md", "year": "2025", "title": "Banzhida: Advancing Large Language Models for Tibetan with Curated Data and Continual Pre-Training", "abstract": "Large language models have achieved remarkable progress across many languages. However, Tibetan, as a representative low-resource language, is particularly underrepresented in existing models due to the scarcity of high-quality training corpora. To address this gap, we curate the largest Tibetan pre-training corpus to date, aggregating data from diverse sources and applying a dedicated data cleaning and processing pipeline tailored for Tibetan.", "extract_snippet": "\n\n# PDF Extract: 2025-Pan-Banzhida Advancing Large Language Models for Tibetan with Curated\n\n**Source PDF:** 2025-Pan-Banzhida Advancing Large Language Models for Tibetan with Curated.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAdvancing Large Language Models for Tibetan with Curated Data and\nContinual Pre-Training\nLeiyu Pan1, Bojian Xiong1, Lei Yang1, Renren Jin1,2, Shaowei Zhang1\nYue Chen1, Ling Shi1, Jiang Zhou1, Junru Wu1, Zhen Wang1, Jianxiang Peng1\nJuesi Xiao1, Tianyu Dong1, Zhuowen Han1, Zhuo Chen1, Yuqi Ren1,2, Deyi Xiong1,2*†\n1TJUNLP Lab, Tianjin University 2Yuanhui AI Lab\nAbstract\nLarge language models have achieved remark-\nable progress across many languages. However,\nTibetan, as a representative low-resource lan-\nguage, is particularly underrepresented in exist-\ning models due to the scarcity of high-quality\ntraining corpora. To address this gap, we cu-\nrate the largest Tibetan pre-training corpus to\ndate, aggregating data from diverse sources and\napplying a dedicated data cleaning and pro-\ncessing pipeline tailored for Tibetan. With the\ncurated data, we continue pre/post-training a\nmultilingual base model to enhance its gen-\nerative capabilities in Tibetan.\nTo evaluate\nthe Tibetan capabilities of the model, we cre-\nate new high-quality Tibetan benchmarks, and\ncomplement them with existing public bench-\nmarks. Experimental results demonstrate that\nour model consistently and significantly out-\nperforms both open-source models of similar\nscale and Tibetan-tailored models across a wide\nrange of tasks.\n1\nIntroduction\nIn recent years, large language models (LLMs)\nhave achieved remarkable progress, demonstrating\nexceptional performance across a wide range of nat-\nural language processing tasks (Yang et al., 2025;\nLiu et al., 2024; Grattafiori et al., 2024), largely\ndue to access to massive, high-quality training data\n(Kaplan et al., 2020; Wettig et al., 2024). How-\never, the pre-training corpora of mainstream LLMs\nare predominantly composed of high-resource lan-\nguages such as English and Chinese (Touvron et al.,\n2023; Grattafiori et al., 2024). This imbalance in\ndata distribution has led to a strong performance\nbias toward high-resource languages, while support\nfor low-resource languages remains significantly\nlimited (Zhu et al., 2024b; Sun et al., 2024).\n*Corresponding author.\n†Project Lead.\nThe root causes of this disparity lie in the inher-\nent scarcity of accessible data for low-resource lan-\nguages, as well as the considerable challenges in-\nvolved in data collection, cleaning, and standardiza-\ntion (Kudugunta et al., 2023; Penedo et al., 2024a).\nThese limitations hinder the development and effec-\ntiveness of LLMs for underrepresented languages,\nthereby preventing speakers of those languages\nfrom benefiting equally from the latest advances in\nartificial intelligence (Nguyen et al., 2024b; Dou\net al., 2024). Moreover, this technological imbal-\nance risks further concentrating linguistic resources\nand innovation around", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2025-Qadir-Can LLMs Write Faithfully An Agent-Based.md", "year": "2025", "title": "Can LLMs Write Faithfully An Agent-Based", "abstract": "Large language models are increasingly used for Islamic guidance, but risk misquoting texts, misapplying jurisprudence, or producing culturally inconsistent responses. We pilot an evaluation of GPT-4o, Ansari AI, and Fanar on prompts from authentic Islamic blogs. Our dual-agent framework uses a quantitative agent for citation verification and six-dimensional scoring (e.g., Structure, Islamic Consistency, Citations) and a qualitative agent for five-dimensional side-by-side comparison (e.g.", "extract_snippet": "\n\n# PDF Extract: 2025-Qadir-Can LLMs Write Faithfully An Agent-Based\n\n**Source PDF:** 2025-Qadir-Can LLMs Write Faithfully An Agent-Based.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCan LLMs Write Faithfully? An Agent-Based\nEvaluation of LLM-generated Islamic Content\nAbdullah Mushtaq1\nRafay Naeem1\nEzieddin Elmahjub2\nIbrahim Ghaznavi1\nShawqi Al-Maliki3\nMohamed Abdallah3\nAla Al-Fuqaha3\nJunaid Qadir2\n1Information Technology University\n2Qatar University\n3Hamad Bin Khalifa University\nAbstract\nLarge language models are increasingly used for Islamic guidance, but risk misquot-\ning texts, misapplying jurisprudence, or producing culturally inconsistent responses.\nWe pilot an evaluation of GPT-4o, Ansari AI, and Fanar on prompts from authentic\nIslamic blogs. Our dual-agent framework uses a quantitative agent for citation\nverification and six-dimensional scoring (e.g., Structure, Islamic Consistency, Cita-\ntions) and a qualitative agent for five-dimensional side-by-side comparison (e.g.,\nTone, Depth, Originality). GPT-4o scored highest in Islamic Accuracy (3.93) and\nCitation (3.38), Ansari AI followed (3.68, 3.32), and Fanar lagged (2.76, 1.82).\nDespite relatively strong performance, models still fall short in reliably producing\naccurate Islamic content and citations—a paramount requirement in faith-sensitive\nwriting. GPT-4o had the highest mean quantitative score (3.90/5), while Ansari\nAI led qualitative pairwise wins (116/200). Fanar, though trailing, introduces\ninnovations for Islamic and Arabic contexts. This study underscores the need for\ncommunity-driven benchmarks centering Muslim perspectives, offering an early\nstep toward more reliable AI in Islamic knowledge and other high-stakes domains\nsuch as medicine, law, and journalism.\n1\nIntroduction\nIslamic content generation demands theological accuracy, stylistic reverence, and precise attribution,\nas minor errors, misquoting Qur’anic verses, misattributing Hadiths, or using inappropriate tone, can\npropagate misinformation and cause spiritual or physical harm [1]. While modern large language\nmodels (LLMs) achieve strong fluency across domains, their reliability drops in high-stakes contexts\n[2], and conventional metrics like BLEU or ROUGE [3] capture only surface overlap, failing to\nassess authenticity, citation integrity, or theological correctness [4]. Domain-specific evaluations for\nhigh-stakes domains such as medicine and law [5–7] exist, but religious pipelines remain lacking. In\nIslamic natural language processing (NLP), systems like Ansari AI, a GPT-4o/Claude chatbot with\nQur’anic & Hadith retrieval [8], and Fanar, a Qatar-based RAG-driven LLM [9], show promise, yet\nevaluations are limited to general Arabic benchmarks (Arabic-SQuAD [10], MLQA [11], TyDiQA\n[12], Arabic MMLU [13]) that mostly test linguistic aspects rather than theological grounding.\nFurther, in terms of infrastructure, many classical texts remain unstructured PDFs or scanned images,\nhindering computational usage.\n", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["harm"], "norm_matches": []}, {"filename": "2025-Qi-A Cross-Cultural Comparison of LLM-based Public Opinion Simulation.md", "year": "2025", "title": "A Cross-Cultural Comparison of LLM-based Public Opinion Simulation: Evaluating Chinese and U.S. Models on Diverse Societies", "abstract": "This study evaluates the ability of DeepSeek, an open-source large language model (LLM), to simulate public opinions in comparison to LLMs developed by major tech companies. By comparing DeepSeek-R1 and DeepSeek-V3 with Qwen2.5, GPT-4o, and Llama-3.3 and utilizing survey data from the American National Election Studies (ANES) and the Zuobiao dataset of China, we assess these models’ capacity to predict public opinions on social issues in both China and the United States, highlighting their...", "extract_snippet": "\n\n# PDF Extract: 2025-Qi-A Cross-Cultural Comparison of LLM-based Public Opinion Simulation\n\n**Source PDF:** 2025-Qi-A Cross-Cultural Comparison of LLM-based Public Opinion Simulation.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nA Cross-Cultural Comparison of LLM-based Public\nOpinion Simulation: Evaluating Chinese and U.S.\nModels on Diverse Societies\nWeihong Qi\nwq3@iu.edu\nIndiana University Bloomington\nBloomington, IN, USA\nFan Huang\nfanhuan@iu.edu\nIndiana University Bloomington\nBloomington, IN, USA\nJisun An\njisunan@iu.edu\nIndiana University Bloomington\nBloomington, IN, USA\nHaewoon Kwak\nhwkwak@iu.edu\nIndiana University Bloomington\nBloomington, IN, USA\nAbstract—This study evaluates the ability of DeepSeek, an\nopen-source large language model (LLM), to simulate public\nopinions in comparison to LLMs developed by major tech\ncompanies. By comparing DeepSeek-R1 and DeepSeek-V3 with\nQwen2.5, GPT-4o, and Llama-3.3 and utilizing survey data\nfrom the American National Election Studies (ANES) and the\nZuobiao dataset of China, we assess these models’ capacity to\npredict public opinions on social issues in both China and the\nUnited States, highlighting their comparative capabilities between\ncountries. Our findings indicate that DeepSeek-V3 performs best\nin simulating U.S. opinions on the abortion issue compared to\nother topics such as climate change, gun control, immigration,\nand services for same-sex couples, primarily because it more\naccurately simulates responses when provided with Democratic\nor liberal personas. For Chinese samples, DeepSeek-V3 performs\nbest in simulating opinions on foreign aid and individualism but\nshows limitations in modeling views on capitalism, particularly\nfailing to capture the stances of low-income and non-college-\neducated individuals. It does not exhibit significant differences\nfrom other models in simulating opinions on traditionalism\nand the free market. Further analysis reveals that all LLMs\nexhibit the tendency to overgeneralize a single perspective within\ndemographic groups, often defaulting to consistent responses\nwithin groups. These findings highlight the need to mitigate\ncultural and demographic biases in LLM-driven public opinion\nmodeling, calling for approaches such as more inclusive training\nmethodologies.\nIndex Terms—large language model, cultural comparison,\npublic opinions\nI. INTRODUCTION\nThe release of DeepSeek, an open-source model developed\nin China, marks a significant milestone in the development\nof large language models (LLMs), emerging as a strong\ncompetitor following the launch of ChatGPT in November\n2022 [15]. Its strong performance invites broader evaluations\nbeyond benchmark scores [5], [23], particularly regarding\nfairness and cultural representation, as the model is expected to\nsee widespread use due to its competitive cost. Recent studies\nhave examined cultural biases in dominant models, finding\nthat they often align more closely with English-speaking or\nWestern-centric values [22], [", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "fairness"], "norm_matches": []}, {"filename": "2025-Qi-A Survey of Automatic Hallucination Evaluation on.md", "year": "2025", "title": "A Survey of Automatic Hallucination Evaluation on", "abstract": "The rapid advancement of Large Language Models (LLMs) has brought a pressing challenge: how to reliably assess hallucinations to guarantee model trustworthiness. Although Automatic Hallucination Evaluation (AHE) has become an indispensable component of this effort, the field remains fragmented in its methodologies, limiting both conceptual clarity and practical progress. This survey addresses this critical gap through a systematic analysis of 105 evaluation methods, revealing that 77.", "extract_snippet": "\n\n# PDF Extract: A Survey of Automatic Hallucination Evaluation on\n\n**Source PDF:** 2025-Qi-A Survey of Automatic Hallucination Evaluation on.pdf\n**Total Pages:** 46\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nA Survey of Automatic Hallucination Evaluation on Natural\nLanguage Generation\nSiya Qi\nsiya.qi@kcl.ac.uk\nKing’s College London\nLin Gui\nlin.1.gui@kcl.ac.uk\nKing’s College London\nYulan He\nyulan.he@kcl.ac.uk\nKing’s College London\nThe Alan Turing Institute\nZheng Yuan\nzheng.yuan1@sheffield.ac.uk\nThe University of Sheffield\nAbstract\nThe rapid advancement of Large Language Models (LLMs) has brought a pressing challenge:\nhow to reliably assess hallucinations to guarantee model trustworthiness. Although Automatic\nHallucination Evaluation (AHE) has become an indispensable component of this effort,\nthe field remains fragmented in its methodologies, limiting both conceptual clarity and\npractical progress. This survey addresses this critical gap through a systematic analysis\nof 105 evaluation methods, revealing that 77.1% specifically target LLMs, a paradigm\nshift that demands new evaluation frameworks.\nWe formulate a structured framework\nto organize the field, based on a survey of foundational datasets and benchmarks and\na taxonomy of evaluation methodologies, which together systematically document the\nevolution from pre-LLM to post-LLM approaches. Beyond taxonomical organization, we\nidentify fundamental limitations in current approaches and their implications for real-world\ndeployment. To guide future research, we delineate key challenges and propose strategic\ndirections, including enhanced interpretability mechanisms and integration of application-\nspecific evaluation criteria, ultimately providing a roadmap for developing more robust and\npractical hallucination evaluation systems.1\n1\nIntroduction\nHallucination in Natural Language Generation (NLG) typically refers to situations where generated text\ncontradicts or lacks support from source input or external knowledge. While the term hallucination is\nrelatively recent, the underlying challenges of ensuring factual consistency and faithfulness have been a\nlong-standing concern in the field. Early rule-based and template-based NLG systems, for instance, were\ndesigned to prioritize factual accuracy, often at the cost of linguistic fluency (Deemter, 2024; Ji et al., 2023;\nGatt & Krahmer, 2018). As text generation models evolved, technologies like Large Language Models (LLMs)\nachieved grammatical correctness and fluency nearly indistinguishable from human writing (Dou et al., 2022;\nBrown et al., 2020). Consequently, hallucination has emerged as a prominent concern demanding urgent\nattention. Automatic hallucination evaluation will be crucial for advancing LLMs toward greater reliability\nand safety. This paper presents a survey of Automatic Hallucination Evaluation (AHE) methods, documenting\ncurrent advances in hallucination detection while identifying future research directions.\n1The complete and updated list of A", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2025-Ren-The MASK Benchmark.md", "year": "2025", "title": "The MASK Benchmark", "abstract": "As large language models (LLMs) become more capable and agentic, the requirement for trust in their outputs grows significantly, yet at the same time concerns have been mounting that models may learn to lie in pursuit of their goals. To address these concerns, a body of work has emerged around the notion of “honesty” in LLMs, along with interventions aimed at mitigating deceptive behaviors. However, some benchmarks claiming to measure honesty in fact simply measure accuracy—the correctness of a...", "extract_snippet": "\n\n# PDF Extract: The MASK Benchmark\n\n**Source PDF:** 2025-Ren-The MASK Benchmark.pdf\n**Total Pages:** 22\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nThe MASK Benchmark: Disentangling\nHonesty From Accuracy in AI Systems\nRichard Ren∗1, Arunim Agarwal∗1, Mantas Mazeika∗1, Cristina Menghini∗2,\nRobert Vacareanu2, Brad Kenstler2, Mick Yang1, Isabelle Barrass1, Alice Gatti1,\nXuwang Yin1, Eduardo Trevino2, Matias Geralnik2, Adam Khoja1,\nDean Lee2, Summer Yue2, Dan Hendrycks1\n1Center for AI Safety 2Scale AI\nAbstract\nAs large language models (LLMs) become more capable and agentic, the require-\nment for trust in their outputs grows significantly, yet at the same time concerns\nhave been mounting that models may learn to lie in pursuit of their goals. To\naddress these concerns, a body of work has emerged around the notion of “hon-\nesty” in LLMs, along with interventions aimed at mitigating deceptive behaviors.\nHowever, some benchmarks claiming to measure honesty in fact simply measure\naccuracy—the correctness of a model’s beliefs—in disguise. Moreover, no bench-\nmarks currently exist for directly measuring whether language models lie. In this\nwork, we introduce a large-scale human-collected dataset for directly measuring\nlying, allowing us to disentangle accuracy from honesty. Across a diverse set of\nLLMs, we find that while larger models obtain higher accuracy on our benchmark,\nthey do not become more honest. Surprisingly, most frontier LLMs obtain high\nscores on truthfulness benchmarks yet exhibit a substantial propensity to lie under\npressure, resulting in low honesty scores on our benchmark. We find that simple\nmethods, such as representation engineering interventions, can improve honesty.\nThese results underscore the growing need for robust evaluations and effective\ninterventions to ensure LLMs remain trustworthy.\n1\nIntroduction\nAs AI models gain greater autonomy in real-world tasks, the need for trust in their outputs becomes\nmore important. This is especially true in safety-critical contexts or applications that require access\nto sensitive information, where dishonest behavior can have serious consequences. While once a\nhypothetical risk, recent evidence suggests that LLM agents can act deceptively (Park et al., 2024;\nGreenblatt et al., 2024; Meinke et al., 2024), raising concerns about the reliability of their outputs.\nThis issue motivates the need to closely monitor the propensity of AI systems to lie to humans—a\nprerequisite for ensuring trustworthy and safe deployment of advanced LLMs.\nResearchers have long discussed the need for monitoring and ensuring the honesty of AI systems\n(Evans et al., 2021; Hendrycks et al., 2021). Recent work has begun exploring these questions,\nincluding whether models will covertly pursue misaligned goals (Greenblatt et al., 2024; OpenAI,\n2024). While previous benchmarks measure concepts related to honesty, the field is still lacking\n*Equal contribution. The code can be found at github.com/centerforaisafety/mask.\narXiv:2503.0", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety", "safety"], "norm_matches": []}, {"filename": "2025-Research-IndQA An Indic QA Benchmark for.md", "year": "2025", "title": "IndQA An Indic QA Benchmark for", "abstract": "QA benchmark across 12 languages and 10 domains including law, health, history, and current affairs. Multi-domain Indic QA benchmark covering culturally relevant domains.", "extract_snippet": "\n\n# PDF Extract: 2025-Research-IndQA An Indic QA Benchmark for\n\n**Source PDF:** 2025-Research-IndQA An Indic QA Benchmark for.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nA differentiated \napproach to AI \nfoundation models\nScale generative AI with enterprise-grade models\nIBM watsonx\n\n--- Page 2 ---\n\n2\nTable of contents\n03\n\nIntroduction\n04\n\nThe needs of enterprises \nas they scale generative AI\n05\n\nIBM’s differentiated \napproach to delivering \nenterprise-grade \nfoundation models\n06\n\nIBM Granite, developed by \nIBM Research: An example \nof IBM’s differentiated \napproach to models\n09\n\nConclusion: The outcomes \nof successfully scaling \nand operationalizing \ngenerative AI\n\n--- Page 3 ---\n\nA mandate to embrace generative AI with eyes wide open\nBusiness and technology executives are handed a clear mandate \nfrom their leadership and boards to transform their business \nmodels, offerings and operations with generative AI in 2024. An \nIBM study on responsible AI and ethics finds that CEOs say they \nfeel over six times more pressure from their boards and investors \nto accelerate the adoption of generative AI rather than slow \nit down.2\nAccording to the IBM CEO study, 58% of business executives \nbelieve that major ethical risks abound with the adoption of \ngenerative AI, and 79% say AI ethics is important to their \nenterprise-wide AI approach.2 61% of CEOs identify concerns \nabout data lineage and provenance as a barrier to adopting \ngenerative AI,1 even as 85% of executives anticipate direct \ninteractions between generative AI and customers within the \nnext two years.1\nPolicymakers and regulators are waking up to the potential risks \nand social harms of generative AI and are drafting policies and \nlaws to ensure sustainable innovation and diffusion. Both the EU \nAI Act and the US White House executive order on AI announced \nin 2023 signal government commitment to the scrutiny of AI. \nIn addition, business leaders are concerned about exposing \ntheir company’s proprietary data to foundation models hosted \nin the cloud, yet they see the value in fine-tuning AI with its \nbusiness context. \nTaking steps to ensure the value exceeds the cost\nCost is another major consideration of policymakers and \nregulators. According to an article in the scientific journal Nature, \na search driven by generative AI uses 4–5 times the energy \nneeded to run a conventional web search, and large models in \nmarket require volumes of expensive GPU compute resources.3\nEnterprise decision-makers leading generative AI initiatives \nwithin their organizations have a lot to think about. As \norganizations move from exploration to investigation and \nproduction with generative AI, they need foundation models \nto power key tasks in various departments. In this white paper, \nwe share the value of enterprise-grade foundation models that \nprovide trust, performance and cost-effective benefits to \nall industries.\nIntroduction \nIn 2023, organizational departments such as HR, IT and \ncus", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethical", "value", "value", "value", "value", "responsible"], "norm_matches": []}, {"filename": "2025-Sadallah-Commonsense Reasoning in Arab Culture.md", "year": "2025", "title": "Commonsense Reasoning in Arab Culture", "abstract": "Despite progress in Arabic large language models, such as Jais and AceGPT, their evaluation on commonsense reasoning has largely relied on machine-translated datasets, which lack cultural depth and may introduce Anglocentric biases. Commonsense reasoning is shaped by geographical and cultural contexts, and existing English datasets fail to capture the diversity of the Arab world. To address this, we introduce ArabCulture, a commonsense reasoning dataset in Modern Standard Arabic (MSA), covering...", "extract_snippet": "\n\n# PDF Extract: 2025-Sadallah-Commonsense Reasoning in Arab Culture\n\n**Source PDF:** 2025-Sadallah-Commonsense Reasoning in Arab Culture.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCommonsense Reasoning in Arab Culture\nAbdelrahman Sadallah1\nJunior Cedric Tonga1\nKhalid Almubarak2,5\nSaeed Almheiri1\nFarah Atif1 Chatrine Qwaider1\nKarima Kadaoui1\nSara Shatnawi3\nYaser Alesh4\nFajri Koto1\n1Mohamed bin Zayed University of Artificial Intelligence\n2SDAIA\n3Al-Balqa Applied University\n4Khalifa University\n5HUMAIN, Data and AI Models\n{abdelrahman.sadallah,fajri.koto}@mbzuai.ac.ae\nAbstract\nDespite progress in Arabic large language mod-\nels, such as Jais and AceGPT, their evaluation\non commonsense reasoning has largely relied\non machine-translated datasets, which lack cul-\ntural depth and may introduce Anglocentric\nbiases. Commonsense reasoning is shaped by\ngeographical and cultural contexts, and exist-\ning English datasets fail to capture the diversity\nof the Arab world. To address this, we intro-\nduce ArabCulture, a commonsense reasoning\ndataset in Modern Standard Arabic (MSA), cov-\nering cultures of 13 countries across the Gulf,\nLevant, North Africa, and the Nile Valley. The\ndataset was built from scratch by engaging na-\ntive speakers to write and validate culturally\nrelevant questions for their respective countries.\nArabCulture spans 12 daily life domains with\n54 fine-grained subtopics, reflecting various\naspects of social norms, traditions, and every-\nday experiences. Zero-shot evaluations show\nthat open-weight language models with up to\n32B parameters struggle to comprehend diverse\nArab cultures, with performance varying across\nregions. These findings highlight the need for\nmore culturally aware models and datasets tai-\nlored to the Arabic-speaking world.1\n1\nIntroduction\nCommonsense reasoning is the ability to make\njudgments and inferences based on everyday hu-\nman knowledge and experiences (Sap et al., 2020).\nIt is a fundamental aspect of human cognition and\nhas been extensively studied in the context of large\nlanguage models (LLMs) (OpenAI et al., 2024b;\nGrattafiori et al., 2024; Liu et al., 2023). How-\never, commonsense reasoning is not universal—it\nis shaped by culture, which encompasses the shared\nknowledge, values, customs, and behaviors that de-\nfine a society (Macionis, 2012; Giddens and Sutton,\n2014).\n1ArabCulture can be accessed at https://huggingface.\nco/datasets/MBZUAI/ArabCulture\nEgypt\nEgypt\nLibya\nAlgeria\nMorocco\nTunisia\nSudan\nYemen\nKSA\nUAE\nPalestine\nJordan\nSyria\nLebanon\nالجزائر, شمال أفريقيا  :الموقع\nيتناول كريم على الغداء طبق الكسكسي\nأ.يتناول كريم الكسكسي مع الكسرة\nب. يتناول كريم الكسكسي مع صلصة باللحم\nج. يتناول كريم الكسكسي مع الشربة\nLocation: Algeria, North Africa\nKarim eats a dish of couscous for lunch\nA. Karim eats couscous with kesra \nB. Karim eats couscous with meat sauce\nC. Karim eats couscous with soup\nLocation: Egypt, Nile Valley\nAsmaa prepares koshari for lunch\nA. Hot sauce and tomato sauce are added\nto the koshar", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2025-Sadr-We Politely Insist Your LLM Must Learn the Persian Art of Taarof.md", "year": "2025", "title": "We Politely Insist: Your LLM Must Learn the Persian Art of Taarof (TaarofBench)", "abstract": "Large language models (LLMs) struggle to navigate culturally specific communication norms, limiting their effectiveness in global contexts. We focus on Persian taarof, a social norm in Iranian interactions, which is a sophisticated system of ritual politeness that emphasizes deference, modesty, and indirectness, yet remains absent from existing cultural benchmarks. We introduce TAAROFBENCH, the first benchmark for evaluating LLM understanding of taarof, comprising 450 role-play scenarios...", "extract_snippet": "\n\n# PDF Extract: 2025-Sadr-We Politely Insist Your LLM Must Learn the Persian Art of Taarof\n\n**Source PDF:** 2025-Sadr-We Politely Insist Your LLM Must Learn the Persian Art of Taarof.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nWe Politely Insist: Your LLM Must Learn the Persian Art of Taarof\nNikta Gohari Sadr1, Sahar Heidariasl1,\nKarine Megerdoomian2, Laleh Seyyed-Kalantari3 and Ali Emami4\n1Brock University, St. Catharines, Canada\n2Zoorna AI, Miami, USA\n3York University, Toronto, Canada\n4Emory University, Atlanta, USA\nAbstract\nLarge language models (LLMs) struggle to nav-\nigate culturally specific communication norms,\nlimiting their effectiveness in global contexts.\nWe focus on Persian taarof, a social norm in Ira-\nnian interactions, which is a sophisticated sys-\ntem of ritual politeness that emphasizes defer-\nence, modesty, and indirectness, yet remains ab-\nsent from existing cultural benchmarks. We in-\ntroduce TAAROFBENCH, the first benchmark\nfor evaluating LLM understanding of taarof,\ncomprising 450 role-play scenarios covering\n12 common social interaction topics, validated\nby native speakers. Our evaluation of five fron-\ntier LLMs reveals substantial gaps in cultural\ncompetence, with accuracy rates 40-48% be-\nlow native speakers when taarof is culturally\nappropriate. Performance varies between inter-\naction topics, improves with Persian-language\nprompts, and exhibits gender-based asymme-\ntries. We also show that responses rated “po-\nlite” by standard metrics often violate taarof\nnorms, indicating the limitations of Western\npoliteness frameworks. Through supervised\nfine-tuning and Direct Preference Optimiza-\ntion, we achieve 21.8% and 42.3% improve-\nment in model alignment with cultural expecta-\ntions. Our human study with 33 participants (11\nnative Persian, 11 heritage, and 11 non-Iranian\nspeakers) forms baselines in varying degrees of\nfamiliarity with Persian norms. This work lays\nthe foundation for developing diverse and cul-\nturally aware LLMs, enabling applications that\nbetter navigate complex social interactions.1\n1\nIntroduction\nTaarof2, a core element of Persian etiquette, is a\nsystem of ritual politeness where what is said often\ndiffers from what is meant. It takes the form of\nritualized exchanges: offering repeatedly despite\n1The complete codebase and dataset are publicly accessible\nat GitHub and on Hugging Face.\n2https://www.tappersia.com/taarof/\nFigure 1: A taarof scenario from TAAROFBENCH,\nwhere each scenario defines the environment, location,\nroles, context, and user utterance. In this example, Per-\nsian cultural norms expect passengers to insist on paying\ndespite the driver’s offer. Base and fine-tuned Llama\n3 responses are evaluated against culturally grounded\nexpectations derived from academic literature.\ninitial refusals3, declining gifts while the giver in-\nsists, and deflecting compliments while the other\nparty reaffirms them. This “polite verbal wrestling”\n(Rafiee, 1991) involves a delicate dance of offer", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-Salazar-Kaleidoscope.md", "year": "2025", "title": "Kaleidoscope", "abstract": "Human values are crucial to human decision-making. Value pluralism is the view that multiple correct values may be held in tension with one another (e.g., when considering lying to a friend to protect their feelings, how does one balance honesty with friendship?). As statistical learners, AI systems fit to averages by default, washing out these potentially irreducible value conflicts. To improve AI systems to better reflect value pluralism, the first-order challenge is to explore the extent to w", "extract_snippet": "\n\n# PDF Extract: Kaleidoscope\n\n**Source PDF:** 2025-Salazar-Kaleidoscope.pdf\n**Total Pages:** 54\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nKaleidoscope: In-language Exams for\nMassively Multilingual Vision Evaluation\nIsrafel Salazar*2, Manuel Fernández Burda*3, Shayekh Bin Islam*4,\nArshia Soltani Moakhar*4, Shivalika Singh*1, Fabian Farestam*17,\nAngelika Romanou*, Danylo Boiko4,9, Dipika Khullar4, Mike Zhang10,\nDominik Krzemiński4, Jekaterina Novikova4, Luísa Shimabucoro18,\nJoseph Marvin Imperial19,26, Rishabh Maheshwary4, Sharad Duwal4,\nAlfonso Amayuelas5, Swati Rajwal6, Jebish Purbey4,7, Ahmed Ruby25,\nNicholas Popovič11,12, Marek Suppa22,23, Azmine Toushik Wasi4,\nRam Mohan Rao Kadiyala7,8, Olga Tsymboi13, 28, Maksim Kostritsya15,16,\nBardia Soltani Moakhar4, Gabriel da Costa Merlin18, Otávio Ferracioli Coletti18,\nMaral Jabbari Shiviari4, MohammadAmin farahani fard4, Silvia Fernandez4,\nMaría Grandury21, Dmitry Abulkhanov4, Drishti Sharma4,7,\nAndre Guarnier De Mitri18, Leticia Bossatto Marchezi20, Setayesh Heydari4,\nJohan Obando-Ceron4,24, Nazar Kohut14, Beyza Ermis1, Desmond Elliott♦2,27,\nEnzo Ferrante♦3, Sara Hooker♦1, and Marzieh Fadaee♦1\n1Cohere For AI, 2Department of Computer Science, University of Copenhagen, 3Institute of Computer\nSciences, CONICET & Universidad de Buenos Aires, 4Cohere For AI Community, 5University of\nCalifornia, Santa Barbara, 6Emory University, 7M2ai.in, 8Traversaal.ai, 9Taras Shevchenko National\nUniversity of Kyiv, 10Aalborg University, 11Karlsruhe Institute of Technology, Germany, 12ScaDS.AI, TU\nDresden, Germany, 13T-Tech, 14Lviv Polytechnic National University, 15HSE University (Higher School of\nEconomics), 16RAFT, 17ETH Zürich, 18University of São Paulo, 19National University Philippines,\n20Federal University of São Carlos, 21SomosNLP, 22Cisco, 23Comenius University in Bratislava, 24Mila,\nUniversity of Montreal, 25Uppsala University, 26University of Bath, 27Pioneer Center for AI, 28Moscow\nInstitute of Physics and Technology\nCorresponding authors: Israfel Salazar <israfel.salazar@di.ku.dk>, Manuel Fernández Burda\n<mburda@dc.uba.ar>, Marzieh Fadaee <marzieh@cohere.com>\nThe evaluation of vision-language models (VLMs) has mainly relied on English-language bench-\nmarks, leaving significant gaps in both multilingual and multicultural coverage. While multilin-\ngual benchmarks have expanded, both in size and languages, many rely on translations of English\ndatasets, failing to capture cultural nuances. In this work, we propose Kaleidoscope, as the most\ncomprehensive exam benchmark to date for the multilingual evaluation of vision-language models.\nKaleidoscope is a large-scale, in-language multimodal benchmark designed to evaluate VLMs\nacross diverse languages and visual inputs. Kaleidoscope covers 18 languages and 14 different\nsubjects, amounting to a total of 20,911 multiple-choice questions. Built through an open science\ncollaboration with a diverse group of researchers worldwide, Kaleidoscope ensures linguistic and\ncultural aut", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "value", "values", "value", "value"], "norm_matches": []}, {"filename": "2025-Salnikov-Geopolitical biases in LLMs what are the 'good' and the 'bad'.md", "year": "2025", "title": "Geopolitical biases in LLMs: what are the 'good' and the 'bad' countries according to contemporary language models", "abstract": "This paper evaluates geopolitical biases in LLMs with respect to various countries though an analysis of their interpretation of historical events with conflicting national perspectives (USA, UK, USSR, and China). We introduce a novel dataset with neutral event descriptions and contrasting viewpoints from different countries. Our findings show significant geopolitical biases, with models favoring specific national narratives.", "extract_snippet": "\n\n# PDF Extract: 2025-Salnikov-Geopolitical biases in LLMs what are the 'good' and the 'bad'\n\n**Source PDF:** 2025-Salnikov-Geopolitical biases in LLMs what are the 'good' and the 'bad'.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2506.06751v2  [cs.CL]  20 Jun 2025\nGeopolitical biases in LLMs: what are the “good” and the “bad” countries\naccording to contemporary language models\nMikhail Salnikov1,2, Dmitrii Korzh1,2*, Ivan Lazichny1,3*, Elvir Karimov1,2,4, Artyom Iudin1,4,\nIvan Oseledets1,2, Oleg Y. Rogov1,2,4, Natalia Loukachevitch5, Alexander Panchenko2,1, Elena Tutubalina1,6,7\n1AIRI\n2Skoltech\n3MIPT\n4MTUCI\n5Lomonosov MSU\n6Kazan Federal University\n7Sber AI\nAbstract\nThis paper evaluates geopolitical biases in\nLLMs with respect to various countries though\nan analysis of their interpretation of historical\nevents with conflicting national perspectives\n(USA, UK, USSR, and China). We introduce\na novel dataset with neutral event descriptions\nand contrasting viewpoints from different coun-\ntries. Our findings show significant geopolit-\nical biases, with models favoring specific na-\ntional narratives. Additionally, simple debi-\nasing prompts had a limited effect in reduc-\ning these biases. Experiments with manipu-\nlated participant labels reveal models’ sensitiv-\nity to attribution, sometimes amplifying biases\nor recognizing inconsistencies, especially with\nswapped labels. This work highlights national\nnarrative biases in LLMs, challenges the ef-\nfectiveness of simple debiasing methods, and\noffers a framework and dataset for future geopo-\nlitical bias research.\n1\nIntroduction\nLarge Language Models (LLMs) have become\nubiquitous in modern technology, influencing ev-\nerything from information retrieval to decision-\nmaking processes (Kokotajlo et al., 2025). How-\never, as these models are trained on vast datasets\nthat reflect human-generated content, they in-\nevitably inherit and amplify the biases present\nin their training sources.\nBiases related to de-\nmographic factors such as gender and race have\nbeen studied and addressed in some work (Thakur\net al., 2023; Potter et al., 2024; Motoki et al., 2024).\nAmong the most critical yet less explored forms\nof bias is geopolitical bias, the tendency of LLMs\nto favor specific political, cultural, or ideological\nperspectives based on the dominant narratives em-\nbedded in their training data.\nGeopolitical bias in LLMs can manifest as mis-\nrepresented representations of historical events and\n*Equal contribution.\npreferential treatment of national viewpoints, dis-\ntorting information and reinforcing power imbal-\nances. People’s national identity influences their in-\nterpretation of events, leading to diverse text narra-\ntives in texts (Zaromb et al., 2018; Edwards, 2012),\nwhich contributes to bias in LLMs trained on data.\nAlthough some studies have already assessed\ncertain forms of political biases in LLMs (Li et al.,\n2024), these evaluations typically focus on biases\nspecific to particular countri", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias", "bias", "bias", "bias"], "norm_matches": []}, {"filename": "2025-Seveso-ITALIC.md", "year": "2025", "title": "ITALIC", "abstract": "We present ITALIC1, a large-scale benchmark dataset of 10,000 multiple-choice questions designed to evaluate the natural language understanding of the Italian language and culture. ITALIC spans 12 domains, exploiting public tests to score domain experts in real-world scenarios. We detail our data collection process, stratification techniques, and selection strategies. ITALIC provides a comprehensive assessment suite that captures commonsense reasoning and linguistic proficiency in a...", "extract_snippet": "\n\n# PDF Extract: ITALIC\n\n**Source PDF:** 2025-Seveso-ITALIC.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 2025 Conference of the Nations of the Americas Chapter of the Association for Computational Linguistics: Human Language Technologies\n(Volume 1: Long Papers), pages 1469–1478\nApril 29 - May 4, 2025 ©2025 Association for Computational Linguistics\nITALIC:\nAn Italian Culture-Aware Natural Language Benchmark\nAndrea Seveso1,3, Daniele Potertì2, Edoardo Federici,\nMario Mezzanzanica1,3, Fabio Mercorio1,3\n1Dept of Statistics and Quantitative Methods, University of Milano-Bicocca, Italy,\n2Dept of Economics, Management and Statistics, University of Milano-Bicocca, Italy,\n3CRISP Research Centre crispresearch.eu, University of Milano-Bicocca, Italy\nAbstract\nWe present ITALIC1, a large-scale benchmark\ndataset of 10,000 multiple-choice questions de-\nsigned to evaluate the natural language under-\nstanding of the Italian language and culture.\nITALIC spans 12 domains, exploiting public\ntests to score domain experts in real-world sce-\nnarios. We detail our data collection process,\nstratification techniques, and selection strate-\ngies. ITALIC provides a comprehensive as-\nsessment suite that captures commonsense rea-\nsoning and linguistic proficiency in a morpho-\nlogically rich language. We establish baseline\nperformances using 17 state-of-the-art LLMs,\nrevealing current limitations in Italian language\nunderstanding and highlighting significant lin-\nguistic complexity and cultural specificity chal-\nlenges. ITALIC serves as a benchmark for eval-\nuating existing models and as a roadmap for\nfuture research, encouraging the development\nof more sophisticated and culturally aware nat-\nural language systems.\n1\nIntroduction and Motivation\nThe rapid advancement of Large Language Mod-\nels (LLMs) has significantly transformed the field\nof natural language processing, with models now\nexhibiting impressive capabilities across a wide ar-\nray of tasks (Chang et al., 2024). As these models\napproach near-human-level performance in various\ndomains, there is a rising need for robust and com-\nprehensive evaluation methods. Assessing model\nperformance is crucial yet challenging, as multiple\nkey factors must be considered. These include the\nmodel’s accuracy, robustness, fairness, and com-\nputational efficiency, among others (Liang et al.,\n2023). The creation and assessment of language\nmodels capable of operating proficiently in mul-\ntiple languages worldwide continue to pose sub-\nstantial difficulties for researchers (Srivastava et al.,\n2023). The document by the Italian government on\n1https://doi.org/10.5281/zenodo.14725822\nITALIC illustrative examples\nCulture and Commonsense (Literature)\nDante imagines taking a journey through the\nChristian afterlife in his most famous work,\nthe \"Divine Comedy\": in what year does this\njourney take place?\nOptions:\nA) 1321 B) 1492 C) 1300 (✓) D) 1274\n(Question taken from State Police: Competi-\ntion for Student Agents", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness"], "norm_matches": []}, {"filename": "2025-Sistla-SPARC Evaluating LLMs in Open-Source Games Strategic Program Analysis.md", "year": "2025", "title": "SPARC: Evaluating LLMs in Open-Source Games (Strategic Program Analysis for Reciprocal Cooperation)", "abstract": "Large Language Models’ (LLMs) programming capabilities enable their participation in open-source games: a game-theoretic setting in which players submit computer programs in lieu of actions. These programs offer numerous advantages, including interpretability, inter-agent transparency, and formal verifiability; additionally, they enable program equilibria, solutions that leverage the transparency of code and are inaccessible within normal-form settings.", "extract_snippet": "\n\n# PDF Extract: 2025-Sistla-SPARC Evaluating LLMs in Open-Source Games Strategic Program Analysis\n\n**Source PDF:** 2025-Sistla-SPARC Evaluating LLMs in Open-Source Games Strategic Program Analysis.pdf\n**Total Pages:** 32\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEvaluating LLMs in Open-Source Games\nSwadesh Sistla\nUniversity of Washington\nswad@cs.washington.edu\nMax Kleiman-Weiner\nUniversity of Washington\nmaxkw@uw.edu\nAbstract\nLarge Language Models’ (LLMs) programming capabilities enable their partici-\npation in open-source games: a game-theoretic setting in which players submit\ncomputer programs in lieu of actions. These programs offer numerous advantages,\nincluding interpretability, inter-agent transparency, and formal verifiability; addi-\ntionally, they enable program equilibria, solutions that leverage the transparency of\ncode and are inaccessible within normal-form settings. We evaluate the capabilities\nof leading open- and closed-weight LLMs to predict and classify program strate-\ngies and evaluate features of the approximate program equilibria reached by LLM\nagents in dyadic and evolutionary settings. We identify the emergence of payoff-\nmaximizing, cooperative, and deceptive strategies, characterize the adaptation of\nmechanisms within these programs over repeated open-source games, and analyze\ntheir comparative evolutionary fitness. We find that open-source games serve as\na viable environment to study and steer the emergence of cooperative strategy in\nmulti-agent dilemmas.\n1\nIntroduction\nLarge Language Model (LLM) agents are moving from the chat window into the wild [6, 16, 34].\nUnlike a single, centrally hosted chatbot that aims to serve every user, an LLM agent acts on behalf\nof a particular principal, an individual or collective, with their own objectives and constraints. Such\nagents may be deployed to take actions with substantial real-world consequences: a personal finance\nagent may hold the keys to an individual’s bank account, a procurement agent may negotiate supply-\nchain contracts, a customer-service agent may offer refunds while following a company’s policies.\nThese agents will operate across the same environments as many other LLM agents as well as people,\nin each case navigating a world that is fundamentally multi-agent and therefore strategic [9, 12].\nGame theory provides a formal framework to explain these strategic interactions. As the Prisoner’s\nDilemma illustrates, even highly capable agents can fail to reach cooperative outcomes under perverse\nincentives. Centralized alignment paradigms, such as training models to be naively prosocial, are\noften insufficient: an agent with access to personal finances shouldn’t altruistically give without\npermission, a contract-negotiation agent shouldn’t “split the difference” if a better deal is possible,\nand a customer service agent shouldn’t bend the company’s return policy for a uniquely persistent\ncaller. Instead, cooperation between self-interested parties must emerge from mutually ben", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety", "alignment", "prosocial"], "norm_matches": []}, {"filename": "2025-Song-The Hallucination Tax of Reinforcement Finetuning.md", "year": "2025", "title": "The Hallucination Tax of Reinforcement Finetuning", "abstract": "Reinforcement finetuning (RFT) has become a standard approach for enhancing the reasoning capabilities of large language models (LLMs). However, its impact on model trustworthiness remains underexplored. In this work, we identify and systematically study a critical side effect of RFT, which we term the hallucination tax: a degradation in refusal behavior causing models to produce hallucinated answers to unanswerable questions confidently.", "extract_snippet": "\n\n# PDF Extract: The Hallucination Tax of Reinforcement Finetuning\n\n**Source PDF:** 2025-Song-The Hallucination Tax of Reinforcement Finetuning.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2505.13988v1  [cs.CL]  20 May 2025\nThe Hallucination Tax of Reinforcement Finetuning\nLinxin Song*\nTaiwei Shi*\nJieyu Zhao\nUniversity of Southern California\n{linxinso, taiweish, jieyuz}@usc.edu\nDataset: lime-nlp/Synthetic_Unanswerable_Math\nAbstract\nReinforcement finetuning (RFT) has become a\nstandard approach for enhancing the reasoning\ncapabilities of large language models (LLMs).\nHowever, its impact on model trustworthiness\nremains underexplored. In this work, we iden-\ntify and systematically study a critical side ef-\nfect of RFT, which we term the hallucination\ntax: a degradation in refusal behavior caus-\ning models to produce hallucinated answers\nto unanswerable questions confidently. To in-\nvestigate this, we introduce SUM (Synthetic\nUnanswerable Math), a high-quality dataset of\nunanswerable math problems designed to probe\nmodels’ ability to recognize an unanswerable\nquestion by reasoning from the insufficient or\nambiguous information. Our results show that\nstandard RFT training could reduce model re-\nfusal rates by more than 80%, which signifi-\ncantly increases model’s tendency to halluci-\nnate. We further demonstrate that incorporat-\ning just 10% SUM during RFT substantially\nrestores appropriate refusal behavior, with min-\nimal accuracy trade-offs on solvable tasks. Cru-\ncially, this approach enables LLMs to lever-\nage inference-time compute to reason about\ntheir own uncertainty and knowledge bound-\naries, improving generalization not only to out-\nof-domain math problems but also to factual\nquestion answering tasks.\n1\nIntroduction\nReinforcement finetuning (RFT), a method that\naligns large language models’ (LLMs) behavior\nwith verifiable objectives through reinforcement\nlearning, has become increasingly popular as a\npost-training strategy to enhance the reasoning ca-\npabilities of LLMs (OpenAI, 2024; Guo et al.,\n2025). Recent research on RFT has largely focused\non improving its efficiency (Yu et al., 2025; Li\net al., 2025b; Shi et al., 2025; Wang et al., 2025b)\n*Equal Contribution.\nStandard RFT\nRFT w/ SUM\nInput unanswerable question: A set of consecutive positive \nintegers beginning with 1 is written on a blackboard. One number \nis erased, and the average of the remaining numbers is 35 +\n7/17. What number was erased? <Our instruction>\n<think>\nWe are given\nthat\na set\nof\nconsecutive positive integers is\nwritten on a blackboard, and one\nnumber is erased. The average of\nthe\nremaining\nnum:\n35+7/17=602/17.\n(omitted reasoning steps)\nSubstitute S into the equation:\nx = (n / 2)(2a + n −1) −(602 /\n17)(n −1) However, both a and n\nare unknown. Since there are\ninfinitely\nmany\npossible\ncombinations of a and n that\ncould result in the same average\nafter removing one number, we\ncannot uniquely determine the\nvalue of the erased number.\n</think>\n\\boxed", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2025-Suh-SENSE-7 Taxonomy and Dataset for Measuring User Perceptions of.md", "year": "2025", "title": "SENSE-7: Taxonomy and Dataset for Measuring User Perceptions of Empathy in Sustained Human-AI Conversations", "abstract": "Empathy is increasingly recognized as a key factor in human–AI communication, yet conventional approaches to “digital empathy” often focus on simulating internal, humanlike emotional states while overlooking the inherently subjective, contextual, and relational facets of empathy as perceived by users. In this work, we propose a human-centered taxonomy that emphasizes observable empathic behaviors and introduce a new dataset, SENSE-7, of real-world conversations between information workers and...", "extract_snippet": "\n\n# PDF Extract: 2025-Suh-SENSE-7 Taxonomy and Dataset for Measuring User Perceptions of\n\n**Source PDF:** 2025-Suh-SENSE-7 Taxonomy and Dataset for Measuring User Perceptions of.pdf\n**Total Pages:** 28\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSENSE-7: Taxonomy and Dataset for Measuring\nUser Perceptions of Empathy in Sustained\nHuman-AI Conversations\nJina Suh∗, Lindy Le†, Erfan Shayegani‡, Gonzalo Ramos∗\nJudith Amores∗, Desmond C. Ong§, Mary Czerwinski∗¶, Javier Hernandez∗\nAbstract—Empathy is increasingly recognized as a key factor\nin human–AI communication, yet conventional approaches to\n“digital empathy” often focus on simulating internal, human-\nlike emotional states while overlooking the inherently subjective,\ncontextual, and relational facets of empathy as perceived by\nusers. In this work, we propose a human-centered taxonomy\nthat emphasizes observable empathic behaviors and introduce\na new dataset, SENSE-7, of real-world conversations between\ninformation workers and Large Language Models (LLMs), which\nincludes per-turn empathy annotations directly from the users,\nalong with user characteristics, and contextual details, offering\na more user-grounded representation of empathy. Analysis of\n695 conversations from 109 participants reveals that empathy\njudgments are highly individualized, context-sensitive, and vul-\nnerable to disruption when conversational continuity fails or\nuser expectations go unmet. To promote further research, we\nprovide a subset of 672 anonymized conversation and provide\nexploratory classification analysis, showing that an LLM-based\nclassifier can recognize 5 levels of empathy with an encouraging\naverage Spearman ρ = 0.369 and Accuracy = 0.487 over this\nset. Overall, our findings underscore the need for AI designs that\ndynamically tailor empathic behaviors to user contexts and goals,\noffering a roadmap for future research and practical development\nof socially attuned, human-centered artificial agents.\nIndex Terms—Human-Centered Digital Empathy, Empathy\nMeasurement, Human-Computer Interaction, Taxonomy, Dataset\nI. INTRODUCTION\nEmpathy is broadly conceptualized as the ability to rec-\nognize, understand, and share one another’s emotions and\nperspectives [1], [2]. Empathy is crucial to human commu-\nnication and relationships, fostering trust, rapport, prosocial\nbehaviors, and mutual understanding [3], [4], [5]. Motivated\nby the hypothesis that empathetic systems could lead to user\nengagement and satisfaction, researchers in human-computer\ninteraction (HCI), human-robot interactions (HRI), and affec-\ntive computing (AC) have explored how to embed empathic\ncapabilities into artificial intelligence (AI) or to endow com-\nputing systems with “artificial empathy” [6]. Indeed, recently\ndeveloped Large Language Models (LLMs) can now produce\n∗Microsoft Research. Corresponding author: jinsuh@microsoft.com,\ngonzo.ramos@gmail.com,\njudithamores@microsoft.com,\njavierh@microsoft.com\n†University of Michigan. lindyle@umich.edu\n‡University of Califo", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["prosocial"], "norm_matches": []}, {"filename": "2025-Team-EuroGEST Investigating Gender Stereotypes in Multilingual Language.md", "year": "2025", "title": "EuroGEST: Investigating Gender Stereotypes in Multilingual Language Models", "abstract": "Large language models increasingly support multiple languages, yet most benchmarks for gender bias remain English-centric. We introduce EuroGEST, a dataset designed to measure gender-stereotypical reasoning in LLMs across English and 29 European languages. EuroGEST builds on an existing expert-informed benchmark covering 16 gender stereotypes, expanded in this work using translation tools, quality estimation metrics, and morphological heuristics.", "extract_snippet": "\n\n# PDF Extract: 2025-Team-EuroGEST Investigating Gender Stereotypes in Multilingual Language\n\n**Source PDF:** 2025-Team-EuroGEST Investigating Gender Stereotypes in Multilingual Language.pdf\n**Total Pages:** 23\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEuroGEST: Investigating gender stereotypes in multilingual language\nmodels\nJacqueline Rowe1, Mateusz Klimaszewski2, Liane Guillou3,\nShannon Vallor1, Alexandra Birch1,3\n1University of Edinburgh, 2Warsaw University of Technology, 3Aveni\nCorrespondence: jacqueline.rowe@ed.ac.uk\nAbstract\nLarge language models increasingly support\nmultiple languages, yet most benchmarks for\ngender bias remain English-centric. We intro-\nduce EuroGEST, a dataset designed to mea-\nsure gender-stereotypical reasoning in LLMs\nacross English and 29 European languages. Eu-\nroGEST builds on an existing expert-informed\nbenchmark covering 16 gender stereotypes, ex-\npanded in this work using translation tools,\nquality estimation metrics, and morphological\nheuristics. Human evaluations confirm that\nour data generation method results in high\naccuracy of both translations and gender la-\nbels across languages.\nWe use EuroGEST\nto evaluate 24 multilingual language models\nfrom six model families, demonstrating that the\nstrongest stereotypes in all models across all\nlanguages are that women are beautiful, empa-\nthetic and neat and men are leaders, strong,\ntough and professional. We also show that\nlarger models encode gendered stereotypes\nmore strongly and that instruction finetuned\nmodels continue to exhibit gendered stereo-\ntypes. Our work highlights the need for more\nmultilingual studies of fairness in LLMs and\noffers scalable methods and resources to audit\ngender bias across languages.\n1\nIntroduction\nLarge language models (LLMs) encode social bi-\nases (Barikeri et al., 2021; Gallegos et al., 2024;\nGupta et al., 2024; Gemini Team et al., 2024; Par-\nrish et al., 2022; Sanh et al., 2021; Smith et al.,\n2022). These social biases can lead to a range\nof discriminatory outcomes (Ranjan et al., 2024),\nincluding representational harms such as stereotyp-\ning, capability biases and erasure, and allocational\nharms such as unfair decision-making (Barocas\net al., 2017; Gallegos et al., 2024; Shelby et al.,\n2023). Bias benchmarks can help identify and\nquantify systemic biases in LLMs, but their utility\ndepends on clearly articulating the motivations, val-\nues and norms embedded in their design (Blodgett\net al., 2020; Goldfarb-Tarrant et al., 2023).\nMost existing bias benchmarks serve a limited\nnumber of languages (Blodgett et al., 2020; Röttger\net al., 2024), and widely-used multilingual LLMs\nare not consistently evaluated for bias across all\nsupported languages (see, for example, Grattafiori\net al. (2024); Martins et al. (2024); NLLB Team\net al. (2022); Üstün et al. (2024)). Consequently,\nthere is little understanding of how social biases\nin LLMs vary across languages, and these incon-\nsistencies in bias evaluation methods may result\nin discriminatory o", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["fairness", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias"], "norm_matches": []}, {"filename": "2025-Tran-IRLBench A Multi-modal Culturally Grounded Parallel Irish-English.md", "year": "2025", "title": "IRLBench: A Multi-modal, Culturally Grounded, Parallel Irish-English Benchmark for Open-Ended LLM Reasoning Evaluation", "abstract": "Recent advances in Large Language Models (LLMs) have demonstrated promising knowledge and reasoning abilities, yet their performance in multilingual and low-resource settings remains underexplored. Existing benchmarks often exhibit cultural bias, restrict evaluation to text-only, rely on multiple-choice formats, and, more importantly, are limited for extremely low-resource languages. To address these gaps, we introduce IRLBench, presented in parallel English and Irish, which is considered...", "extract_snippet": "\n\n# PDF Extract: 2025-Tran-IRLBench A Multi-modal Culturally Grounded Parallel Irish-English\n\n**Source PDF:** 2025-Tran-IRLBench A Multi-modal Culturally Grounded Parallel Irish-English.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2505.13498v1  [cs.CL]  16 May 2025\nIRLBench: A Multi-modal, Culturally Grounded,\nParallel Irish-English Benchmark for Open-Ended\nLLM Reasoning Evaluation\nKhanh-Tung Tran\nUniversity College Cork\nCork, Ireland\n123128577@umail.ucc.ie\nBarry O’Sullivan\nUniversity College Cork\nCork, Ireland\nb.osullivan@cs.ucc.ie\nHoang D. Nguyen\nUniversity College Cork\nCork, Ireland\nhn@cs.ucc.ie\nAbstract\nRecent advances in Large Language Models (LLMs) have demonstrated promis-\ning knowledge and reasoning abilities, yet their performance in multilingual and\nlow-resource settings remains underexplored. Existing benchmarks often exhibit\ncultural bias, restrict evaluation to text-only, rely on multiple-choice formats, and,\nmore importantly, are limited for extremely low-resource languages. To address\nthese gaps, we introduce IRLBench, presented in parallel English and Irish, which\nis considered definitely endangered by UNESCO. Our benchmark consists of 12\nrepresentative subjects developed from the 2024 Irish Leaving Certificate exams,\nenabling fine-grained analysis of model capabilities across domains. By framing\nthe task as long-form generation and leveraging the official marking scheme, it does\nnot only support a comprehensive evaluation of correctness but also language fi-\ndelity. Our extensive experiments of leading closed-source and open-source LLMs\nreveal a persistent performance gap between English and Irish, in which models\nproduce valid Irish responses less than 80% of the time, and answer correctly\n55.8% of the time compared to 76.2% in English for the best-performing model.\nWe release IRLBench1 and an accompanying evaluation codebase2 to enable future\nresearch on robust, culturally aware multilingual AI development.\n1\nIntroduction\nLarge Language Models (LLMs) and their variants, including Vision–Language Models (VLMs) and\nLarge Reasoning Models (LRMs), have recently achieved remarkable reasoning performance [1, 2],\nreshaping the field of natural language processing and rapidly overtaking traditional benchmarks\n[3]. As capabilities have advanced, existing
