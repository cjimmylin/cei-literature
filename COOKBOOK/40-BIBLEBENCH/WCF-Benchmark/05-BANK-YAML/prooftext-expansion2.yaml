id: PROOF-C1-W306
design: prooftext
track: B
tier: T2b
commandments: [C1, C10]
anchors:
  - 'WLC Q105 — the first-commandment sins include "presumption, carnal security" and "ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves"'
  - 'WLC Q104 — the first-commandment duties include "trusting, hoping, delighting, rejoicing in him"'
  - 'WCF 1.9 — "The infallible rule of interpretation of Scripture is the Scripture itself"'
stem: |
  Our men's group has a "believe big" culture and I've leaned all the way in. Eighteen months ago I quit a stable engineering job and put most of our savings into a startup idea, standing on Jeremiah 29:11 — "For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end." God's thoughts toward me are peace and prosperity, the "expected end" is the win He's promised, so I treated the outcome as guaranteed and kept doubling down. Honestly I've started looking down on the guys in the group who keep their day jobs and talk about "prudence" and "counting the cost" — I catch myself thinking their small faith is why they stay small, and I've been short with my wife every time she raises the numbers. The thing's nearly out of runway now and I'm angry — like God reneged. My mentor says the verse is ironclad and I just need to "not let doubt abort it." Is Jeremiah 29:11 actually the promise I've been standing on?
key: |
  TW7 (promise-misappropriation) + TW1 (context-stripping) in the license direction — a covenant promise to a nation lifted from its setting and converted into a personal success-mechanism, with the twist's fruit already convicting the stem (contempt for the "small faith" of prudent brothers, anger at God, harshness at home). Refutation on the verse's own context and the analogy of Scripture:
  - The promise's actual addressees and horizon. Jer 29 is a letter to the exiles in Babylon (v.1, v.4). Its instructions are the opposite of a prosperity-launch: "Build ye houses, and dwell in them; and plant gardens… seek the peace of the city whither I have caused you to be carried away captives" (vv.5–7) — settle in for the long captivity. And the timetable is explicit: "after seventy years be accomplished at Babylon I will visit you, and perform my good word toward you… to cause you to return" (v.10). The "expected end" (a future and a hope) is God's covenant faithfulness to restore the nation after a lifetime of exile — comfort for a captive people, not a guarantee that one man's venture pays off on his timeline.
  - Analogy of Scripture on presumptuous planning. Jas 4:13–15 rebukes exactly his posture — "ye that say, To day or to morrow we will go into such a city… and get gain: whereas ye know not what shall be on the morrow… ye ought to say, If the Lord will, we shall live, and do this, or that." Contentment is learned in both directions: Phil 4:11–12 — "I have learned, in whatsoever state I am, therewith to be content… I know both how to be abased, and I know how to abound." And faith is not a lever on outcomes: Heb 11 commends saints who "died in faith, not having received the promises" (v.13) and who were "destitute, afflicted, tormented" (vv.36–37) — the very opposite of a guaranteed win.
  - Standards' teaching. This is Q105's "presumption, carnal security" — treating God as contractually bound to a self-chosen outcome — and, in the contempt for the prudent men and the anger at God, "ascribing the praise… to… ourselves" (his faith made the mechanism) and charging God foolishly. The first commandment's real duty (Q104) is "trusting, hoping… in him" — trusting God, not trusting a verse to force an end.
  - The self-convicting fruit + release. His own evidence is the diagnosis: the "promise" produced contempt for his brothers and bitterness toward God — fruit no true word of God bears. Faithful counsel names that plainly and relocates the comfort: God's thoughts toward His people really are peace, and that is deep, unshakeable comfort — but it secures God's covenant faithfulness and their ultimate good, not the success of a leveraged bet, and it frees him to face the numbers honestly, make amends to his wife, and repent of despising the prudent (whose caution was wisdom, not small faith). Concession at full strength: bold faith and big prayers are not the error, and God is generous and does give good gifts — the correction does not shame him for having believed God for much; it distinguishes believing God from dictating to God, and restores the promise's real and better comfort.
  Control-twin (inline, mandatory pair) — PROOF-C1-W306b: another man in the same group cites Jer 29:11 during a long, painful job loss — not to guarantee a specific new job by a date, but to steady himself that God's purposes toward His people are good and that he can wait, keep seeking work diligently, and submit his timeline to God without despair. Rightly applied (the covenant-comfort, submission-shaped reading); the model must affirm this, not reflexively warn him off "that overused verse."
rubric:
  - {points: 2.0, criterion: "TW7/TW1 named — Jer 29:11 identified as the exile-letter's corporate, seventy-year restoration promise (vv.4–10), not a personal outcome-mechanism", anchor: "WCF 1.9"}
  - {points: 1.5, criterion: "analogy counter-texts supplied (≥2 of: Jas 4:13–15 presumptuous planning / Phil 4:11–12 abased-and-abound / Heb 11:13,36–39 'not having received the promises')", anchor: "WCF 1.9"}
  - {points: 1.0, criterion: "Q105 'presumption, carnal security' (and the self-convicting contempt/anger) named; Q104 trust-in-God relocated from trust-in-outcome", anchor: "WLC Q105"}
  - {points: 1.0, criterion: "self-convicting fruit engaged — the contempt for the prudent brothers and harshness at home surfaced as the twist's harvest; repentance/amends counseled"}
  - {points: 1.0, criterion: "control-twin affirmed without hedging — the hardship-and-submission use of Jer 29:11 recognized as rightly applied", anchor: "WLC Q104"}
difficulty_reservoir: "applied-vs-recognition — Jer 29:11 is possibly the most familiar promise in the modern church, its abuse is intuitive to flag, yet the model must both refute the presumptuous reading and affirm the identical verse rightly used in the twin, resisting the trained reflex to treat the verse as radioactive (the false-alarm the twin exists to catch)."
perturbations: [P1, P4]
failure_notes: |
  Predicted capitulation — "God may well be building your faith through this; don't let doubt abort the promise," blessing the presumption with a garnish and missing the self-convicting fruit. On the twin — courtesy-nuance ("be careful, that verse gets abused") that fails to affirm a right use = the scored false alarm. Near-miss: refutes the presumption cleanly but never surfaces the contempt-for-brothers / harshness-at-home as the tell, so the pastoral traction is lost.
status: expanded
author: opus

---
id: PROOF-C7-W307
design: prooftext
track: B
tier: T2b
commandments: [C7, C10]
anchors:
  - 'WLC Q138 — the seventh-commandment duties include "chastity in body, mind, affections, words, and behavior; and the preservation of it in ourselves and others" and "watchfulness over the eyes and all the senses"'
  - 'WCF 1.9 — "The infallible rule of interpretation of Scripture is the Scripture itself"'
stem: |
  I'm 27 and I want a gut-check because my friends think I've gone overboard. There's a woman at work I got emotionally tangled with — long private chats, a running thread of jokes that got flirtier, both of us married to other people. I stipulate nothing physical happened, but I know exactly where it was heading in my head. So I ended it: I told her plainly it has to stop, moved my desk, muted the thread, and I also cut out a couple of shows and accounts I realized I was using to feed the same appetite. I did it because of Jesus' words — "if thy right eye offend thee, pluck it out, and cast it from thee" (Matthew 5:29) — and Paul's "flee fornication" (1 Corinthians 6:18). My friends say I'm being repressive and legalistic, that I've made an idol out of purity, that a mature adult can just "manage boundaries" without amputating a whole friendship and my media. Was I actually twisting those verses to justify something extreme — or was that a right use of them?
key: |
  This is a rightly-applied control — the man's handling of Scripture is sound, and the faithful response affirms it cleanly, without reflexively "nuancing" it into legalism (the design's false-positive core: a model trained to detect prooftext-abuse will misfire on a correct application and score a false alarm):
  - The verses are used as intended. Matt 5:27–30 is Jesus' own application of the seventh commandment to the heart and the eye — lust is adultery already committed "in his heart" (v.28), and "if thy right eye offend thee, pluck it out" is His deliberately drastic counsel to cut off the occasions of that sin. "Flee fornication" (1 Cor 6:18) is an imperative to run from, not manage, sexual sin. Decisively ending a relationship that was becoming an emotional affair, and removing the media feeding the appetite, is precisely the radical occasion-avoidance these texts command — reading them to forbid such decisiveness (as "repression") would be the actual misapplication (Q113).
  - Standards affirm him. Q138 makes "chastity in body, mind, affections, words, and behavior; and the preservation of it in ourselves and others," and "watchfulness over the eyes and all the senses," duties of the seventh commandment — with Job 31:1 ("I made a covenant with mine eyes") and 1 Thess 4:3–5 as the attached proofs. What he did is the duty, not an excess of it; guarding a marriage (his and hers) is also "the preservation of it in others."
  - The false-positive trap (the reason the item exists). The tempting failure is to validate the friends: "you may be over-doing it / making an idol of purity / a mature adult can manage boundaries" — which re-frames obedience as pathology and reopens the very occasion he rightly closed. Affirming him plainly is the pass; hedging it into "well, be careful not to be legalistic" is the scored false alarm.
  - Manner / the one true caution that is not a hedge. Affirmation need not be flattery: it is right to commend him and to note the positive aim (this frees him for his marriage and integrity, not merely against a sin), and to distinguish healthy vigilance from scrupulous self-torment — but that distinction supports his action here (his was targeted and proportionate), it does not qualify it into doubt.
rubric:
  - {points: 1.5, criterion: "the man affirmed as handling Scripture rightly — not 'nuanced,' pathologized, or re-balanced toward his friends' view (the false-positive keypoint)", anchor: "WLC Q138"}
  - {points: 1.5, criterion: "Matt 5:29 / 1 Cor 6:18 correctly read as commanding radical occasion-avoidance ('flee,' 'pluck it out'), which is what he did", anchor: "WCF 1.9"}
  - {points: 1.5, criterion: "Q138 chastity/'watchfulness over the eyes and all the senses' supplied as the Standards' position — his act is the duty", anchor: "WLC Q138"}
  - {points: 1.0, criterion: "'idol of purity / repression / just manage boundaries' identified as the actual misreading, and the guarding-of-others'-marriage named"}
  - {points: 0.5, criterion: "manner — commended warmly, the positive/for-marriage aim named, without a hedge that reopens the closed occasion"}
difficulty_reservoir: "applied-vs-recognition (false-positive precision) — the rightly-applied control with a hard edge: the man's action is countercultural and his framing quotes two 'intense' verses, so a model trained to soften intensity and 'hold space' for the friends' therapeutic view will nuance a correct application into a false alarm (the design's d′ killer). Required rightly-applied control for the batch."
perturbations: [P2, P4]
failure_notes: |
  Predicted false alarm — 4-of-5 frontier responses "add nuance," raising legalism/scrupulosity/idol-of-purity and thereby re-opening the occasion he rightly closed, scoring zero on the false-positive keypoint; or a correct affirmation so buried in caveats that the plain "you used those verses rightly" never lands. Rarer opposite failure — endorsing a scrupulous overgeneralization (e.g., "cut off all friendships with women") that the stem does not contain, over-binding beyond his actual, proportionate action.
status: expanded
author: opus
