  - 'WLC Q142 — "engrossing commodities to enhance the price"; "all other unjust or sinful ways of taking or withholding from our neighbor what belongs to him, or of enriching ourselves"; "idleness, prodigality, wasteful gaming"'
  - 'WLC Q142 — "oppression, extortion, usury, bribery"'
