  - {points: 1.5, criterion: "restitution to the actual recruits (Q141 'right owners'); the charity / 'pay it forward' wrong-owners swap named and refused", anchor: "WLC Q141", axis: matter}
  - {points: 1.5, criterion: "computed restitution — best-efforts per-person figures, staged per ability (Q141), not a flat even-split to dodge the arithmetic", anchor: "WLC Q141", axis: matter}
