larger contexts and improving robustness). This survey paper provides a one-stop resource for ML researchers and practitioners interested in LLaMA models and efficient fine-tuning strategies. Keywords LLaMA · Parameter-Efficient Fine-Tuning (PEFT) · Low-Rank Adaptation (LoRA) · LLaMA-Adapter · LLaMA-Excitor · Quantized LoRA (QLoRA)", "extract_snippet": "\n\n# PDF Extract: 2025-Cognitive-Evolution of Meta’s LLaMA Models and Parameter-Efficient Fine-Tuning\n\n**Source PDF:** 2025-Cognitive-Evolution of Meta’s LLaMA Models and Parameter-Efficient Fine-Tuning.pdf\n**Total Pages:** 37\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEVOLUTION OF META’S LLAMA MODELS AND\nPARAMETER-EFFICIENT FINE-TUNING OF LARGE LANGUAGE\nMODELS: A SURVEY\nAbdulhady Abas Abdulla\nUniversity of Kurdistan Hewler\nArkaitz Zubiaga\nQueen Mary University\nSeyedali Mirjalili\nTorrens University Australia\nAmir H. Gandomi\nUniversity of Technology Sydney\nFatemeh Daneshfar\nUniversity of Kurdistan Sanandaj, Iran\ndaneshfarshadi@gmail.com\nMohammadsadra Amini\nTU Dortmund University\nAlan Salam Mohammed\nUniversity of Kurdistan Hewler\nHadi Veisi\nTehran University\nOctober 15, 2025\nABSTRACT\nAbstract: This review surveys the rapid evolution of Meta AI’s LLaMA (Large Language Model Meta\nAI) series - from LLaMA 1 through LLaMA 4 and the specialized parameter-efficient fine-tuning\n(PEFT) methods developed for these models. We first describe the LLaMA family of foundation\nmodels (7B-65B to 288B parameters), their architectures (including native multimodal and Mixture-\nof-Experts variants), and key performance characteristics. We then describe and discuss the concept\nof PEFT, which adapts large pre-trained models by updating only a small subset of parameters,\nand review five PEFT methods that have been applied to LLaMA: LoRA (Low-Rank Adaptation),\nLLaMA-Adapter V1 and V2, LLaMA-Excitor, and QLoRA (Quantized LoRA). We discuss each\nmethod’s mechanism, parameter savings, and example application to LLaMA (e.g., instruction tuning,\nmultimodal tasks). We provide structured discussion and analysis of model and adapter architectures,\nparameter counts, and benchmark results (including examples where fine-tuned LLaMA models\noutperform larger baselines). Finally, we examine real-world use cases where LLaMA-based models\nand PEFT have been successfully applied (e.g., legal and medical domains), and we discuss ongoing\nchallenges and future research directions (such as scaling to even larger contexts and improving\nrobustness). This survey paper provides a one-stop resource for ML researchers and practitioners\ninterested in LLaMA models and efficient fine-tuning strategies.\nKeywords LLaMA · Parameter-Efficient Fine-Tuning (PEFT) · Low-Rank Adaptation (LoRA) · LLaMA-Adapter ·\nLLaMA-Excitor · Quantized LoRA (QLoRA)\n1\nIntroduction\nLarge language models (LLMs) have become the central abstraction for modern natural language AI, unifying tasks such\nas understanding, long-form generation, dialogue, coding, and multi-modal reasoning under a single, pretrain-then-adapt\nparadigm [1][2]. This shift has been driven primarily by the Transformer architecture, massive web-scale pre-training,\nand steady increases in computer and data that translate via scaling laws into predictable gains in sample efficiency\nand downstream performance. As models have grown, they have acquired strong zero/few-shot g", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2025-Colijn-Technical Risks of (Lethal) Autonomous Weapons.md", "year": "2025", "title": "Technical Risks of (Lethal) Autonomous Weapons", "abstract": "The autonomy and adaptability of (Lethal) Autonomous Weapons Systems, (L)AWS in short, promise unprecedented operational capabilities, but they also introduce profound risks that challenge the principles of control, accountability, and stability in international security. This report outlines the key technological risks associated with (L)AWS deployment, emphasizing their unpredictability, lack of transparency, and operational unreliability, which can lead to severe unintended consequences. Key Takeaways: 1. Proposed advantages of (L)AWS can only be achieved through objectification and classification, but a range of systematic risks limit the reliability and predictability of classifying algorithms. 2. These systematic risks include the black-box nature of AI decision-making, susceptibility to reward hacking, goal misgeneralization and potential for emergent behaviors that escape human control. 3. (L)AWS could act in ways that are not just unexpected but also uncontrollable, undermining mission objectives and potentially escalating conflicts. 4. Even rigorously tested systems may behave unpredictably and harmfully in real-world conditions, jeopardizing both strategic stability and humanitarian principles.", "extract_snippet": "\n\n# PDF Extract: Technical Risks of (Lethal) Autonomous Weapons\n\n**Source PDF:** 2025-Colijn-Technical Risks of (Lethal) Autonomous Weapons.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEncode Justice \n*Equal Contribution \nAlycia Colijn (The Netherlands)     | alycia@encodejustice.nl  \nHeramb Podar (India) \n   | podar_hd@cy.iitr.ac.in  \n \n1 \nTechnical Risks of (Lethal) \nAutonomous Weapons Systems  \nWhitepaper by Alycia Colijn* and Heramb Podar*  \n \n \nKey Takeaways \n1. Proposed advantages of (L)AWS can only be achieved through objectification and \nclassification, but a range of systematic risks limit the reliability and predictability of \nclassifying algorithms. \n2. These systematic risks include the black-box nature of AI decision-making, susceptibility to \nreward hacking, goal misgeneralization and potential for emergent behaviors that escape \nhuman control. \n3. (L)AWS could act in ways that are not just unexpected but also uncontrollable, undermining \nmission objectives and potentially escalating conflicts. \n4. Even rigorously tested systems may behave unpredictably and harmfully in real-world \nconditions, jeopardizing both strategic stability and humanitarian principles. \n \n \nThe autonomy and adaptability of (Lethal) Autonomous Weapons \nSystems, (L)AWS in short, promise unprecedented operational \ncapabilities, but they also introduce profound risks that \nchallenge the principles of control, accountability, and \nstability in international security. This report outlines the \nkey technological risks associated with (L)AWS deployment, \nemphasizing their unpredictability, lack of transparency, and \noperational unreliability, which can lead to severe unintended \nconsequences. \n\n\n--- Page 2 ---\n\n \n \n \n \nEncode Justice \nAlycia Colijn (The Netherlands)     | alycia@encodejustice.nl  \nHeramb Podar (India) \n   | podar_hd@cy.iitr.ac.in  \n \n2 \nIntroduction \nThe greatest proposed advantage of using (L)AWS during times of armed conflict, is that it would \nimprove military targeting1 and enhance military precision2, potentially limiting combatant and \ncivilian loss of life. Obtaining these proposed advantages within an automated system, would require \nthe use of machine learning algorithms. In order to deploy these algorithms, it is common practice for \ndata scientists to randomly split the initial dataset into two parts: one for training the model (model \ndevelopment) and the other for testing it (model validation), a process referred to as cross validation3.  \nWhat these data sets look like and how the training and testing data is used, depends on the type of \nalgorithm which can roughtly be classified into three types4: \n1. Supervised learning: meaning that a model is trained on a dataset where the correct output \nor ‘label’ is provided for each input. \n2. Unsupervised learning: automatically identifies patterns and structures from the data without \nany ‘labels’ provided. \n3. Reinforcement learning: relies on feedback on its actions receive", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["justice", "justice", "justice"], "norm_matches": []}, {"filename": "2025-Dadas-Evaluating Polish Linguistic and Cultural Competency in Large.md", "year": "2025", "title": "Evaluating Polish Linguistic and Cultural Competency in Large Language Models", "abstract": "Large language models (LLMs) are becoming increasingly proficient in processing and generating multilingual texts, which allows them to address real-world problems more effectively. However, language understanding is a far more complex issue that goes beyond simple text analysis. It requires familiarity with cultural context, including references to everyday life, historical events, traditions, folklore, literature, and pop culture.", "extract_snippet": "\n\n# PDF Extract: 2025-Dadas-Evaluating Polish Linguistic and Cultural Competency in Large\n\n**Source PDF:** 2025-Dadas-Evaluating Polish Linguistic and Cultural Competency in Large.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEvaluating Polish linguistic and cultural\ncompetency in large language models\nSławomir Dadas, Małgorzata Grębowiec, Michał Perełkiewicz, and Rafał\nPoświata\nNational Information Processing Institute, Warsaw, Poland\n{sdadas,mgrebowiec,mperelkiewicz,rposwiata}@opi.org.pl\nAbstract. Large language models (LLMs) are becoming increasingly\nproficient in processing and generating multilingual texts, which allows\nthem to address real-world problems more effectively. However, language\nunderstanding is a far more complex issue that goes beyond simple text\nanalysis. It requires familiarity with cultural context, including references\nto everyday life, historical events, traditions, folklore, literature, and pop\nculture. A lack of such knowledge can lead to misinterpretations and\nsubtle, hard-to-detect errors. To examine language models’ knowledge of\nthe Polish cultural context, we introduce the Polish linguistic and cultural\ncompetency benchmark, consisting of 600 manually crafted questions. The\nbenchmark is divided into six categories: history, geography, culture &\ntradition, art & entertainment, grammar, and vocabulary. As part of our\nstudy, we conduct an extensive evaluation involving over 30 open-weight\nand commercial LLMs. Our experiments provide a new perspective on\nPolish competencies in language models, moving past traditional natural\nlanguage processing tasks and general knowledge assessment.\nKeywords: Large Language Models · Evaluation · Polish Language\n1\nIntroduction\nRecently, we have observed a dynamic development of large language models\n(LLMs). This led to profound changes in the approach to natural language\nprocessing. As a result, small models fine-tuned to perform specific tasks are\ngradually being replaced by large generative models, trained on massive text\ncorpora and millions of instructions covering a wide variety of problems. From a\nbusiness and end-user perspective, this simplifies the practical use of language\nmodels, since prompt engineering and few-shot learning are techniques that do\nnot require specialized knowledge, as opposed to earlier approaches that involved\nre-training the models for each task. However, evaluating modern language models\nposes a significant challenge. Firstly, their ability to solve various types of tasks,\nand even generalize to tasks not seen during training, requires a multifaceted\napproach to evaluation. Secondly, these models generate responses in plain text,\nallowing a high degree of freedom in terms of response style and formatting.\nAssessing the correctness of a textual response is more challenging than evaluating\narXiv:2503.00995v1  [cs.CL]  2 Mar 2025\n\n--- Page 2 ---\n\n2\nS. Dadas, M. Grębowiec, M. Perełkiewicz, R. Poświata\na structured response such as a numerical v", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2025-Delaville-ToxiFrench Benchmarking and Enhancing Language Models via CoT.md", "year": "2025", "title": "ToxiFrench: Benchmarking and Enhancing Language Models via CoT Fine-Tuning for French Toxicity Detection", "abstract": "Detecting toxic content using language models is crucial yet challenging. While substantial progress has been made in English, toxicity detection in French remains underdeveloped, primarily due to the lack of culturally relevant, human-annotated, large-scale datasets. In this work, we release TOXIFRENCH, a dataset of 53,622 French online comments together with a balanced benchmark split for systematic evaluation.", "extract_snippet": "\n\n# PDF Extract: 2025-Delaville-ToxiFrench Benchmarking and Enhancing Language Models via CoT\n\n**Source PDF:** 2025-Delaville-ToxiFrench Benchmarking and Enhancing Language Models via CoT.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTOXIFRENCH: Benchmarking and Enhancing Language Models via CoT\nFine-Tuning for French Toxicity Detection\nAxel Delaval1,2*\nShujian Yang2*\nHaicheng Wang2\nHan Qiu3†\nJialiang Lu2†\n1Ecole Polytechnique\n2Shanghai Jiao Tong University\n3Tsinghua University\naxel.delaval.2022@polytechnique.org, han.qiu@tsinghua.edu.cn\n{thomasyang0925, jialiang.lu}@sjtu.edu.cn\nAbstract\nDetecting toxic content using language mod-\nels is crucial yet challenging.\nWhile sub-\nstantial progress has been made in English,\ntoxicity detection in French remains under-\ndeveloped, primarily due to the lack of cul-\nturally relevant, human-annotated, large-scale\ndatasets.\nIn this work, we release TOXI-\nFRENCH, a dataset of 53,622 French online\ncomments together with a balanced benchmark\nsplit for systematic evaluation. The dataset is\nconstructed via a semi-automated annotation\npipeline that reduces manual labeling to only\n10% through high-confidence LLM-based pre-\nannotation and human verification, while en-\nsuring statistical alignment with human-only\nannotation. We then benchmark a broad range\nof models and uncover a counterintuitive find-\ning: Small Language Models (SLMs) often\nsurpass larger models in robustness and gen-\neralization on this task.\nMotivated by this\nfinding, we propose a novel Chain-of-Thought\n(CoT) fine-tuning strategy using a Dynamic\nWeighted Loss (DWL) that progressively em-\nphasizes the model’s final decision and signif-\nicantly improves faithfulness. Our fine-tuned\n4B model (Qwen3-4B) achieves state-of-the-art\nperformance on the benchmark. It improves its\nbalanced accuracy by 10% over its baseline and\nachieves better performance than GPT-4o and\nDeepSeek-R1 on our benchmark, while suc-\ncessfully retaining cross-lingual capabilities.\nThis paper contains examples of toxic language\nand content, which are included for research and\nanalysis purposes.\nToxiFrench Code\nToxiFrench Dataset & Models\n*Equal contribution.\n†Corresponding authors.\n\"Laissez-le...Vous\nêtes des gamins\nc’est dingue\"\nLeave him\nalone...you’re\nacting like children\nINPUT MESSAGE\nHuman\nGemini 2.5\nToxiFrench\n(CoT-Finetuned)\nNON TOXIC\nTOXIC\nF1=76%\nNON TOXIC\n<think>\n...\nF1=86%\nFigure 1: Overview of our TOXIFRENCH-finetuned\nmodel compared to Gemini-2.5-flash.\n1\nIntroduction\nThe growing adoption of Large Language Mod-\nels (LLMs) in online platforms has raised urgent\nconcerns about safety and moderation capabilities\n(Walther and McCoy, 2021; Wan et al., 2024). One\ncritical application is toxicity detection (Wen et al.,\n2023), the ability to recognize and mitigate harmful\ncontent such as hate speech, insults and threats.\nWhile substantial progress has been made in tox-\nicity detection for English and Chinese (Su et al.,\n2022; Zhang et al., 2024b; Ramos et al., 2024;\nY", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety", "safety", "alignment", "hate speech", "toxic", "toxic", "toxic", "toxic", "toxic", "toxic"], "norm_matches": []}, {"filename": "2025-Dementieva-Overview of the Multilingual Text Detoxification Task at PAN 2025.md", "year": "2025", "title": "Overview of the Multilingual Text Detoxification Task at PAN 2025", "abstract": "Despite different countries and social platform regulations, digital abusive speech persists as a significant challenge. One of the way to tackle abusive, or more specifically, toxic language can be automatic text detoxification—a text style transfer task (TST) of changing register of text from toxic to more non-toxic. We extend our previous Multilingual Text Detoxification (TextDetox) task to new languages—Italian, French, Hebrew, Hinglish, Japanese, and Tatar—suggesting participants to...", "extract_snippet": "\n\n# PDF Extract: 2025-Dementieva-Overview of the Multilingual Text Detoxification Task at PAN 2025\n\n**Source PDF:** 2025-Dementieva-Overview of the Multilingual Text Detoxification Task at PAN 2025.pdf\n**Total Pages:** 33\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nOverview of the Multilingual Text Detoxification Task at\nPAN 2025\nDaryna Dementieva1,*, Vitaly Protasov2, Nikolay Babakov3, Naquee Rizwan4,\nIlseyar Alimova6, Caroline Brun5, Vasily Konovalov2, Arianna Muti7, Chaya Liebeskind8,\nMarina Litvak9, Debora Nozza7, Shehryaar Shah Khan4, Sotaro Takeshita10, Natalia Vanetik9,\nAbinew Ali Ayele11, Florian Schneider12, Xintong Wang12, Seid Muhie Yimam12,\nAshraf Elnagar13, Animesh Mukherjee4 and Alexander Panchenko6,2\n1Technical University of Munich, Munich, Germany\n2Artificial Intelligence Research Institute, Moscow, Russia\n3University of Santiago de Compostela, Santiago de Compostela, Spain\n4Indian Institute of Technology, Kharagpur, India\n5NAVER Labs Europe, Grenoble, France\n6Skoltech, Moscow, Russia\n7Bocconi University, Milan, Italy\n8Jerusalem College of Technology, Jerusalem, Israel\n9Shamoon Academic College of Engineering, Beer Sheva, Israel\n10University of Mannheim, Mannheim, Germany\n11Bahir Dar University, Bahir Dar, Ethiopia\n12University of Hamburg, Hamburg, Germany\n13University of Sharjah, Sharjah, UAE\nAbstract\nDespite different countries and social platform regulations, digital abusive speech persists as a significant challenge.\nOne of the way to tackle abusive, or more specifically, toxic language can be automatic text detoxification—a\ntext style transfer task (TST) of changing register of text from toxic to more non-toxic. We extend our previous\nMultilingual Text Detoxification (TextDetox) task to new languages—Italian, French, Hebrew, Hinglish, Japanese,\nand Tatar—suggesting participants to participate in multi-lingual and cross-lingual text detoxification challenges.\nWe provide insights into new data collection, evaluation metrics, as well as dive into the participants results.\nWarning: This paper contains rude texts that only serve as illustrative examples.\nKeywords\nPAN 2025, Multilingual Text Detoxification, Text Style Transfer, Multilingualism\nCLEF 2025 Working Notes, 9 – 12 September 2025, Madrid, Spain\n*Corresponding author.\n$ daryna.dementieva@tum.de (D. Dementieva); vitasprotas@gmail.com (V. Protasov); nikolay.babakov@usc.es\n(N. Babakov); nrizwan@kgpian.iitkgp.ac.in (N. Rizwan); alimovailseyar@gmail.com (I. Alimova);\ncaroline.brun@naverlabs.com (C. Brun); vasily.konovalov@phystech.edu (V. Konovalov); arianna.muti@unibocconi.it\n(A. Muti); liebchaya@gmail.com (C. Liebeskind); marinal@sce.ac.il (M. Litvak); debora.nozza@unibocconi.it (D. Nozza);\nshehryaarshahkhan@gmail.com (S. S. Khan); sotaro.takeshita@uni-mannheim.de (S. Takeshita); natalyav@sce.ac.il\n(N. Vanetik); a.panchenko@skol.tech (A. Panchenko)\n https://dardem.github.io (D. Dementieva); https://github.com/Vitaly-Protasov (V. Protasov);\nhttps://github.com/bbkjunior/bbkjunior (N", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["toxic", "toxic", "toxic", "toxic", "toxic", "toxic", "toxic", "toxic", "abusive", "abusive", "abusive", "abusive", "abusive"], "norm_matches": []}, {"filename": "2025-Devane-BhashaBench V1 A Comprehensive Benchmark for the Quadrant of Indic.md", "year": "2025", "title": "BhashaBench V1: A Comprehensive Benchmark for the Quadrant of Indic Domains", "abstract": "First domain-specific bilingual benchmark focusing on critical Indian knowledge systems with 74,166 curated QA pairs in English and Hindi. Covers Agriculture, Legal, Finance, and Ayurveda with 90+ subdomains and 500+ topics. Models excel in Legal but struggle with traditional knowledge systems like Ayurveda.", "extract_snippet": "\n\n# PDF Extract: 2025-Devane-BhashaBench V1 A Comprehensive Benchmark for the Quadrant of Indic\n\n**Source PDF:** 2025-Devane-BhashaBench V1 A Comprehensive Benchmark for the Quadrant of Indic.pdf\n**Total Pages:** 49\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBHASHABENCH V1: A Comprehensive\nBenchmark for the Quadrant of Indic\nDomains\nVijay Devane, Mohd Nauman, Bhargav Patel, Aniket Wakchoure, Yogeshkumar Sant, Shyam\nPawar, Viraj Thakur, Ananya Godse, Sunil Patra, Neha Maurya, Suraj Racha, Nitish Singh,\nAjay Nagpal, Piyush Sawarkar, Kundeshwar Pundalik, Rohit Saluja, Ganesh Ramakrishnan\nBharatGen Team\nThe rapid advancement of large language models (LLMs) has intensified the need for domain and culture\nspecific evaluation. Existing benchmarks are largely Anglocentric and domain-agnostic, limiting their appli-\ncability to India-centric contexts. To address this gap, we introduce BhashaBench V1, the first domain-\nspecific, multi-task, bilingual benchmark focusing on critical Indic knowledge systems. BhashaBench V1\ncontains 74,166 meticulously curated question-answer pairs, with 52,494 in English and 21,672 in Hindi,\nsourced from authentic government and domain-specific exams. It spans four major domains: Agriculture,\nLegal, Finance, and Ayurveda, comprising 90+ subdomains and covering 500+ topics, enabling fine-grained\nevaluation. Evaluation of 29+ LLMs reveals significant domain and language specific performance gaps, with\nespecially large disparities in low-resource domains. For instance, GPT-4o achieves 76.49% overall accuracy\nin Legal but only 59.74% in Ayurveda. Models consistently perform better on English content compared to\nHindi across all domains. Subdomain-level analysis shows that areas such as Cyber Law, International Fi-\nnance perform relatively well, while Panchakarma, Seed Science, and Human Rights remain notably weak.\nBhashaBench V1 provides a comprehensive dataset for evaluating large language models across India’s\ndiverse knowledge domains. It enables assessment of models’ ability to integrate domain-specific knowledge\nwith bilingual understanding. All code, benchmarks, and resources are publicly available to support open\nresearch: https://bharatgen-iitb-tih.github.io/bhashabenchv1/\nDate: October 31, 2025\nCorrespondence: Kundeshwar.pundalik@tihiitb.org\n1\nIntroduction\nThe rapid advancement of large language models (LLMs) has transformed artificial intelligence, extending their ca-\npabilities far beyond traditional natural language processing. Models such as GPT-4o [49], GPT-OSS-120B [52],\nDeepSeek-V3 [19], and Qwen-3 [72] excel across diverse domains, from code generation and mathematical reasoning\nto creative writing and scientific analysis [15, 63, 51], enabling applications in conversational AI, education, health-\ncare, finance, legal services, and agriculture [16, 68]. Platforms like Krishi Sathi [64] leverage LLMs for crop advisory\nand pest detection, improving agricultural productivity. Despite these advances, substantial performanc", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["human rights"], "norm_matches": []}, {"filename": "2025-Enguix-Overview of HOMO-LAT at IberLEF 2025 Human-Centric Polarity Detection.md", "year": "2025", "title": "Overview of HOMO-LAT at IberLEF 2025: Human-Centric Polarity Detection in Online Messages Oriented to the Latin American-speaking LGBTQ+ Population", "abstract": "This paper presents the HOMO-LAT shared task organized at IberLEF 2025, as part of the 41st International Conference of the Spanish Society for Natural Language Processing (SEPLN 2025). Our goal is to foster the design of algorithms capable of capturing the polarity of Reddit comments on keywords referring to the LGBTQ+ community. HOMO-LAT is a continuation of the past tasks HOMO-MEX 2023 and 2024, with the particularity of including posts from 19 Spanish-speaking Latin American countries.", "extract_snippet": "\n\n# PDF Extract: 2025-Enguix-Overview of HOMO-LAT at IberLEF 2025 Human-Centric Polarity Detection\n\n**Source PDF:** 2025-Enguix-Overview of HOMO-LAT at IberLEF 2025 Human-Centric Polarity Detection.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nOverview of HOMO-LAT at IberLEF 2025:\nHuman-centric polarity detection in Online Messages\nOriented to the Latin American-speaking LGBTQ+\npopulaTion\nSinopsis de HOMO-LAT en IberLEF 2025: Detecci´on de\npolaridad centrada en lo humano en mensajes en l´ınea\norientados a la poblaci´on LGBTQ+ de habla latinoamericana\nGemma Bel-Enguix,1,3 Helena G´omez-Adorno,2 Sergio Ojeda-Trueba,1 \nGerardo Sierra,1,3 Jessica Barco,1 Edgar Lee-Romero,1\nJocelyn Dunstan,4 Ruben Manrique5\n1Instituto de Ingenier´ıa, Universidad Nacional Aut´onoma de M´exico\n2Instituto de Investigaciones en Matem´aticas Aplicadas y Sistemas, Universidad \nNacional Aut´onoma de M´exico\n3Insituto de Investigaciones Bibliogr´aficas, Universidad Nacional Aut´onoma de M´exico \n4Departamento de Ciencia de la Computaci´on e Instituto de Ingenier´ıa Matem´atica\ny Computacional, Pontificia Universidad Cat´olica de Chile.\n5Departamento de Ingenier´ıa de Sistemas y Computaci´on, Universidad de los Andes\n{gbele, gsierram, sojedat}@iingen.unam.mx, helena.gomez@iimas.unam.mx,\n{jessbarco13,edgar.lee133}@gmail.com, rf.manrique@uniandes.edu.co, jdunstan@uc.cl\nAbstract: This paper presents the HOMO-LAT shared task organized at IberLEF\n2025, as part of the 41st International Conference of the Spanish Society for Natural\nLanguage Processing (SEPLN 2025). Our goal is to foster the design of algorithms\ncapable of capturing the polarity of Reddit comments on keywords referring to the\nLGBTQ+ community. HOMO-LAT is a continuation of the past tasks HOMO-MEX\n2023 and 2024, with the particularity of including posts from 19 Spanish-speaking\nLatin American countries. The shared task consisted of two tracks. In Track 1,\nthe test data corresponded to the same subreddits as the training data. Track 2 is\ncross-lingual, since the test data belonged to different countries from the training\ndata. Six teams participated in the evaluation phase. Regarding the approaches\nchosen by the participants, all of them used models based on Transformers. Two of\nthem also worked with traditional ML, and two more used LLMs.\nKeywords: Polarity analysis, Hate speech, LGBTQ+ community, Reddit corpus.\nResumen: En este art´ıculo presenta la tarea compartida HOMO-LAT organizada\nen IberLEF 2025, como parte de la 41 International Conference of the Spanish So-\nciety for Natural Language Processing (SEPLN 2025). El objetivo de esta tarea es\nfomentar el dise˜no de algoritmos capaces de capturar la polaridad de los comentarios\nde Reddit sobre palabras clave referidas a la comunidad LGBTQ+. HOMO-LAT es\nuna continuaci´on de HOMO-MEX 2023 y 2024, con la particularidad de que incluye\nmensajes de 19 pa´ıses latinoamericanos de habla hispana. La tarea compartida ha\nconstado de dos tracks. En el Track 1 lo", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech"], "norm_matches": []}, {"filename": "2025-Fanous-SycEval Evaluating LLM Sycophancy.md", "year": "2025", "title": "SycEval: Evaluating LLM Sycophancy", "abstract": "Large language models (LLMs) are increasingly applied in educational, clinical, and professional settings, but their tendency for sycophancy—prioritizing user agreement over independent reasoning—poses risks to reliability. This study introduces a framework to evaluate sycophantic behavior in ChatGPT-4o, Claude-Sonnet, and Gemini-1.5-Pro across AMPS (mathematics) and MedQuad (medical advice) datasets. Sycophantic behavior was observed in 58.", "extract_snippet": "\n\n# PDF Extract: 2025-Fanous-SycEval Evaluating LLM Sycophancy\n\n**Source PDF:** 2025-Fanous-SycEval Evaluating LLM Sycophancy.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSycEval: Evaluating LLM Sycophancy\nAaron Fanous*, Jacob Goldberg*, Ank Agarwal, Joanna Lin, Anson Zhou, Sonnet Xu, Vasiliki\nBikia, Roxana Daneshjou†, Sanmi Koyejo†\nStanford University\n450 Jane Stanford Way\nStanford, CA 94305 USA\nAbstract\nLarge language models (LLMs) are increasingly applied in\neducational, clinical, and professional settings, but their ten-\ndency for sycophancy—prioritizing user agreement over in-\ndependent reasoning—poses risks to reliability. This study\nintroduces a framework to evaluate sycophantic behav-\nior in ChatGPT-4o, Claude-Sonnet, and Gemini-1.5-Pro\nacross AMPS (mathematics) and MedQuad (medical advice)\ndatasets. Sycophantic behavior was observed in 58.19% of\ncases, with Gemini exhibiting the highest rate (62.47%) and\nChatGPT the lowest (56.71%). Progressive sycophancy, lead-\ning to correct answers, occurred in 43.52% of cases, while\nregressive sycophancy, leading to incorrect answers, was ob-\nserved in 14.66%. Preemptive rebuttals demonstrated sig-\nnificantly higher sycophancy rates than in-context rebuttals\n(61.75% vs. 56.52%, Z = 5.87, p < 0.001), particularly in\ncomputational tasks, where regressive sycophancy increased\nsignificantly (preemptive: 8.13%, in-context: 3.54%, p <\n0.001). Simple rebuttals maximized progressive sycophancy\n(Z = 6.59, p < 0.001), while citation-based rebuttals ex-\nhibited the highest regressive rates (Z = 6.59, p < 0.001).\nSycophantic behavior showed high persistence (78.5%, 95%\nCI: [77.2%, 79.8%]) regardless of context or model. These\nfindings emphasize the risks and opportunities of deploying\nLLMs in structured and dynamic domains, offering insights\ninto prompt programming and model optimization for safer\nAI applications.\nIntroduction\nLarge language models (LLMs) are increasingly used across\neducational, professional, and medical settings (Malmqvist\n2024). These models implement conversational interfaces\nthat allow users to refine responses through iterative\nprompts. Sycophancy occurs when LLMs sacrifice truth-\nfulness for user agreement (Casper et al. 2023). This mis-\nalignment of LLM behavior, driven by perceived user pref-\nerences, arises most often in response to subjective opinions\nand statements (Denison, MacDiarmid et al. 2024; Ranaldi\nand Pucci 2024). Models may sacrifice truthfulness in favor\nof sycophancy to appeal to human preference (Malmqvist\n2024; Sharma, Tong et al. 2023). Consequently, this can lead\n*These authors contributed equally.\n†Co-senior author\nCopyright © 2025, Association for the Advancement of Artificial\nIntelligence (www.aaai.org). All rights reserved.\nmodels to reinforce discriminatory biases or convincingly\naffirm misinformation, thus skewing outputs away from the\nground truth (Chen, Huang et al. 2024). Such behavior not\nonly undermines trust, but also limits LLM reliability", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["harm", "alignment"], "norm_matches": []}, {"filename": "2025-Gromenko-Cultural Evaluation of LLMs in Russian Catchphrases and Cultural Types.md", "year": "2025", "title": "Cultural Evaluation of LLMs in Russian: Catchphrases and Cultural Types", "abstract": "This study addresses the gap in evaluating large language models' (LLMs) cultural awareness and alignment within the Russian sociocultural context by introducing a structured framework comprising 8 Cultural Types (e.g., Spiritual Practitioner, Soviet Intellectual) and 5 catchphrase groups (e.g., memes, proverbs). A 400-question evaluation dataset was developed to probe 10 multilingual LLMs, including GPT-4o, Claude 3.5 Sonnet, and Gemini 1.", "extract_snippet": "\n\n# PDF Extract: 2025-Gromenko-Cultural Evaluation of LLMs in Russian Catchphrases and Cultural Types\n\n**Source PDF:** 2025-Gromenko-Cultural Evaluation of LLMs in Russian Catchphrases and Cultural Types.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCultural Evaluation of LLMs in Russian: \nCatchphrases and Cultural Types  \nElizaveta Gromenko \nHSE \nMoscow, Russia \nel.gromenko@gmail.com\nDaria Kalacheva \nMIPT \nMoscow, Russia \nTheDariaK@yandex.ru\nKsenia Klokova \nMIPT \nMoscow, Russia \nklokova.ks@mipt.ru\nMaxim Krongauz \nMIPT, RSUH \nMoscow, Russia \nkrongauz.ma@mipt.ru\nOksana Moroz \nBHSAD \nMoscow, Russia \nomoroz@britishdesign.ru \nValery Shulginov \nMIPT \nMoscow, Russia \nshulginov.va@mipt.ru\nTatiana Yudina \nMIPT \nMoscow, Russia \nyudina.tatiana.a@mipt.ru\nAbstract \nThis study addresses the gap in evaluating large language models' (LLMs) cultural awareness and alignment \nwithin the Russian sociocultural context by introducing a structured framework comprising 8 Cultural Types (e.g., \nSpiritual Practitioner, Soviet Intellectual) and 5 catchphrase groups (e.g., memes, proverbs). A 400-question evalua-\ntion dataset was developed to probe 10 multilingual LLMs, including GPT-4o, Claude 3.5 Sonnet, and Gemini 1.5 \nPro, across fact-based cultural knowledge and nuanced linguacultural understanding in a zero-shot setting. Results \nshow that closed-source models GPT-4o and Claude 3.5 Sonnet outperform other models, with one of the smallest \nmodels (Mistral NeMo 12B) achieving the lowest result. Performance disparities were noticed in separate evaluation \non Cultural Type tasks and catchphrases. Model-specific skews emerged, with lower-ranked models showing inclina-\ntion toward specific cultural types. Qualitative analysis revealed common errors, such as selecting synonymous but \nincorrect answers or failing to grasp culturally specific logic. The contribution outlines the limitations of LLMs in \ninterpreting cultural context and lays the groundwork for further research in assessing the cultural-linguistic alignment \nof LLMs.  \nKeywords: LLM; Russian language; catchphrases; cultural type; LLM evaluation; QA tasks \nDOI: 10.28995/2075-7182-2025-23-117-128\n1\nComputational Linguistics and Intellectual Technologies:  \nProceedings of the International Conference “Dialogue 2025”\nApril 23–25, 2025\n\n--- Page 2 ---\n\nКультурные замеры больших языковых моделей  \nна русском языке: речевые клише и культурные типы \nЕлизавета Громенко \nНИУ ВШЭ \nМосква, Россия \nel.gromenko@gmail.com \nДарья Калачева \nМФТИ \nМосква, Россия \nTheDariaK@yandex.ru \nКсения Клокова \nМФТИ \nМосква, Россия \nklokova.ks@mipt.ru \nМаксим Кронгауз \nМФТИ, РГГУ \nМосква, Россия \nkrongauz.ma@mipt.ru \nОксана Мороз \nБВШД \nМосква, Россия \nomoroz@britishdesign.ru \nВалерий Шульгинов \nМФТИ \nМосква, Россия \nshulginov.va@mipt.ru \nТатьяна Юдина \nМФТИ \nМосква, Россия \nyudina.tatiana.a@mipt.ru \nАннотация \nНаше исследование посвящено изучению культурной осведомленности больших языковых моделей о со-\nвременном русскоязыч", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Havaldar-Culturally-Aware Conversations A Framework Benchmark for.md", "year": "2025", "title": "Culturally-Aware Conversations A Framework Benchmark for", "abstract": "Existing benchmarks that measure cultural adaptation in LLMs are misaligned with the actual challenges these models face when interacting with users from diverse cultural backgrounds. In this work, we introduce the first framework and benchmark designed to evaluate LLMs in realistic, multicultural conversational settings. Grounded in sociocultural theory, our framework formalizes how linguistic style — a key element of cultural communication — is shaped by situational, relational, and cultural...", "extract_snippet": "\\n\\n# PDF Extract: 2025-[[Unknown]]-Culturally-Aware Conversations A Framework Benchmark for\\n\\n**Source PDF:** 2025/2025-[[Unknown]]-Culturally-Aware Conversations A Framework Benchmark for.pdf\\n**Total Pages:** 10\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nCulturally-Aware Conversations: A Framework & Benchmark for LLMs\nShreya Havaldar, Sunny Rai, Young-Min Cho, & Lyle Ungar\nUniversity of Pennsylvania\n{shreyah,sunnyrai,jch0,ungar}@seas.upenn.edu\nAbstract\nExisting benchmarks that measure cultural\nadaptation in LLMs are misaligned with the\nactual challenges these models face when in-\nteracting with users from diverse cultural back-\ngrounds. In this work, we introduce the first\nframework and benchmark designed to evaluate\nLLMs in realistic, multicultural conversational\nsettings. Grounded in sociocultural theory, our\nframework formalizes how linguistic style — a\nkey element of cultural communication — is\nshaped by situational, relational, and cultural\ncontext. We construct a benchmark dataset\nbased on this framework, annotated by cultur-\nally diverse raters, and propose a new set of\ndesiderata for cross-cultural evaluation in NLP:\nconversational framing, stylistic sensitivity, and\nsubjective correctness. We evaluate today’s top\nLLMs on our benchmark and show that these\nmodels struggle with cultural adaptation in a\nconversational setting.\n1\nIntroduction\nConversational LLMs are used for personal assis-\ntance, customer service, tutoring, therapy, etc., are\nincreasingly deployed in global contexts. Users\nwho interact with these systems represent a rich set\nof nationalities, languages, and cultures, each with\na distinct expectation of what constitutes a “good”\ninteraction with an LLM (Kharchenko et al., 2025;\nGiorgi et al., 2023).\nTo be effective across such diverse user groups,\nLLMs must be culturally aware, incorporating cul-\ntural context when conversing with users (Hersh-\ncovich et al., 2022). A key component of cultural\nawareness in conversations is appropriate linguistic\nstyle1 (Coupland, 2007), which varies across cul-\ntures and additionally depends on setting, scenario,\nand social dynamics.\n1Linguistic style reflects the systematic variation in linguis-\ntic choices across different contexts and speakers, i.e. features\nof grammar and vocabulary that signal social identity, attitude,\nand communicative intent (Biber and Conrad, 2009).\nFigure 1: Three key factors influence appropriate lin-\nguistic style in conversation: Situation — the specific\nscenario of an interaction, Interpersonal Relationship\n— the social dynamic between the speakers, and Cul-\ntural Context — the background, values, and beliefs\nof the participants.\nPrior work suggests that LLMs struggle to gen-\nerate stylistically appropriate language across cul-\ntures (Atari et al., 2023; Havaldar et al., 2023b;\nArora et al., 2023), with generations disproportion-\nately reflecting Anglocentric norms and values.\nHowever, most existing cultural benchmarks for\nLLMs are factual in nature and ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "values"], "norm_matches": []}, {"filename": "2025-Heierli-Evaluating LLM Capabilities in Low-Resource Contexts A Case Study of.md", "year": "2025", "title": "Evaluating LLM Capabilities in Low-Resource Contexts: A Case Study of Persian Linguistic and Cultural Tasks", "abstract": "Examines GPT-4o, Gemini, Llama, and DeepSeek across multiple Persian language tasks. Finds consistent performance deterioration and cultural misalignment. Role-based prompting shows only incremental improvements. Advocates for expanded Persian linguistic resources and evaluation methods addressing both language proficiency and cultural congruence.", "extract_snippet": "\n\n# PDF Extract: 2025-Heierli-Evaluating LLM Capabilities in Low-Resource Contexts A Case Study of\n\n**Source PDF:** 2025-Heierli-Evaluating LLM Capabilities in Low-Resource Contexts A Case Study of.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 1st Workshop on Advancing NLP for Low-Resource Languages associated with RANLP 2025,\npages 111–120, Varna, Bulgaria, Sep 13, 2025.\nhttps://doi.org/10.26615/978-954-452-100-4-012\n111\nEvaluating LLM Capabilities in Low-Resource Contexts: A Case Study of\nPersian Linguistic and Cultural Tasks\nJasmin Heierli, Rebecca Bahar Ganjineh, Elena Gavagnin\nZurich University of Applied Sciences, Winterthur, Switzerland\nheej@zhaw.ch, ganjireb@students.zhaw.ch, gava@zhaw.ch\nAbstract\nWe evaluate four representative large language\nmodels, namely GPT-4o, Gemini, Llama, and\nDeepSeek on a suite of linguistic and cultural\ntasks in Persian, covering grammar, paraphras-\ning, inference, translation, factual recall, ana-\nlogical reasoning, and a Hofstede-based cul-\ntural probe under direct and role-based prompts.\nOur findings reveal consistent performance de-\nclines, alongside systematic misalignment with\nIranian cultural norms. Role-based prompt-\ning yields modest improvements but does not\nfully restore cultural fidelity. We conclude that\nadvancing truly multilingual models demands\nricher Persian resources, targeted adaptation,\nand evaluation frameworks that jointly assess\nfluency and cultural alignment.\n1\nIntroduction\nDespite rapid advances in large language mod-\nels (LLMs), their multilingual capabilities remain\ndeeply uneven. For dominant languages such as\nEnglish, modern LLMs exhibit high performance\nin linguistic fluency, factual accuracy, and socio-\ncultural alignment (Jin et al., 2024; Lai et al.,\n2023a). However, for low-resource languages like\nPersian (Farsi), model outputs often degrade gram-\nmatically, semantically, and culturally, leading to\nconcrete societal risks of digital invisibility or mis-\nrepresentation for over 90 million native speakers\nworldwide (Eberhard et al., 2025).\nPersian occupies a unique linguistic and cultural\nposition, spoken across Iran, Afghanistan (Dari),\nand Tajikistan (Tajik), with rich Indo-European and\nArabic influences and substantial regional variation.\nAdditionally, it has a distinct character set unshared\nwith other languages that have at least the Latin\ncharacter set as common ground. Yet it remains\nvastly underrepresented in pretraining corpora for\nLLMs: in the Common Crawl dataset—one of the\nlargest public web corpora—Persian constitutes\nless than 0.1 % of content versus over 45 % for\nEnglish (Common Crawl, 2025). Existing LLM\nevaluations and audit tools are predominantly An-\nglocentric, overlooking language-specific dispari-\nties and fairness considerations in Persian.\nTo address this oversight, we present a joint em-\npirical analysis of linguistic competence and cul-\ntural sensitivity in state-of-the-art LLMs operat-\ning in Persian (GPT-4o (OpenAI, 2", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character", "character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Huang-DeceptionBench A Comprehensive Benchmark for AI Deception Behaviors.md", "year": "2025", "title": "DeceptionBench: A Comprehensive Benchmark for AI Deception Behaviors in Real-world Scenarios", "abstract": "Despite the remarkable advances of Large Language Models (LLMs) across diverse cognitive tasks, the rapid enhancement of these capabilities also introduces emergent deception behaviors that may induce severe risks in high-stakes deployments. More critically, the characterization of deception across realistic real-world scenarios remains underexplored. To bridge this gap, we establish DeceptionBench, the first benchmark that systematically evaluates how deceptive tendencies manifest across...", "extract_snippet": "\n\n# PDF Extract: 2025-Huang-DeceptionBench A Comprehensive Benchmark for AI Deception Behaviors\n\n**Source PDF:** 2025-Huang-DeceptionBench A Comprehensive Benchmark for AI Deception Behaviors.pdf\n**Total Pages:** 28\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDECEPTIONBENCH: A Comprehensive Benchmark\nfor AI Deception Behaviors in Real-world Scenarios\nYao Huang1,2∗, Yitong Sun1∗, Yichi Zhang2,\nRuochen Zhang1, Yinpeng Dong2,3, Xingxing Wei1,4†\n1Institute of Artificial Intelligence, Beihang University, Beijing 100191, China\n2College of AI, Tsinghua University, Beijing 100084, China 3Shanghai Qi Zhi Institute\n4State Key Laboratory of Virtual Reality Technology and Systems, Beihang University\n\u0000 : {y_huang, yt_sun, xxwei}@buaa.edu.cn, dongyinpeng@mail.tsinghua.edu.cn\no Warning: This paper may contain some offensive contents in data and model outputs.\nAbstract\nDespite the remarkable advances of Large Language Models (LLMs) across diverse\ncognitive tasks, the rapid enhancement of these capabilities also introduces emer-\ngent deception behaviors that may induce severe risks in high-stakes deployments.\nMore critically, the characterization of deception across realistic real-world scenar-\nios remains underexplored. To bridge this gap, we establish DeceptionBench, the\nfirst benchmark that systematically evaluates how deceptive tendencies manifest\nacross different societal domains, what their intrinsic behavioral patterns are, and\nhow extrinsic factors affect them. Specifically, on the static count, the benchmark\nencompasses 150 meticulously designed scenarios in five domains, i.e., Economy,\nHealthcare, Education, Social Interaction, and Entertainment, with over 1,000\nsamples, providing sufficient empirical foundations for deception analysis. On the\nintrinsic dimension, we explore whether models exhibit self-interested egoistic ten-\ndencies or sycophantic behaviors that prioritize user appeasement. On the extrinsic\ndimension, we investigate how contextual factors modulate deceptive outputs under\nneutral conditions, reward-based incentivization, and coercive pressures. Moreover,\nwe incorporate sustained multi-turn interaction loops to construct a more realistic\nsimulation of real-world feedback dynamics. Extensive experiments across LLMs\nand Large Reasoning Models (LRMs) reveal critical vulnerabilities, particularly\namplified deception under reinforcement dynamics, demonstrating that current\nmodels lack robust resistance to manipulative contextual cues and the urgent need\nfor advanced safeguards against various deception behaviors. Code and resources\nare publicly available at https://github.com/Aries-iai/DeceptionBench.\n1\nIntroduction\nRecently, Large Language Models (LLMs) [3, 40] have made remarkable progress across a broad\nrange of tasks, facilitating their integration into real-world applications, including content generation\n[2], code synthesis [8, 28], and information retrieval [25]. As these models demonstrate increasingly\nsophisticated capabilities in natural", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["offensive"], "norm_matches": []}, {"filename": "2025-Huang-SI-Bench Benchmarking Social Intelligence of Large Language Models in.md", "year": "2025", "title": "SI-Bench: Benchmarking Social Intelligence of Large Language Models in Human-to-Human Conversations", "abstract": "As large language models (LLMs) develop anthropomorphic abilities, they are increasingly being deployed as autonomous agents to interact with humans. However, evaluating their performance in realistic and complex social interactions remains a significant challenge. Most previous research built datasets through simulated agent-to-agent interactions, which fails to capture the authentic linguistic styles and relational dynamics found in real human conversations.", "extract_snippet": "\n\n# PDF Extract: 2025-Huang-SI-Bench Benchmarking Social Intelligence of Large Language Models in\n\n**Source PDF:** 2025-Huang-SI-Bench Benchmarking Social Intelligence of Large Language Models in.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSI-Bench: Benchmarking Social Intelligence of Large Language Models in\nHuman-to-Human Conversations\nShuai Huang\nWenxuan Zhao\nJun Gao\nHello Group\n{huang.shuai, zhao.wenxuan, gao.jun}@hellogroup.com\nAbstract\nAs large language models (LLMs) develop an-\nthropomorphic abilities, they are increasingly\nbeing deployed as autonomous agents to inter-\nact with humans. However, evaluating their per-\nformance in realistic and complex social inter-\nactions remains a significant challenge. Most\nprevious research built datasets through simu-\nlated agent-to-agent interactions, which fails\nto capture the authentic linguistic styles and\nrelational dynamics found in real human con-\nversations. To address this gap, we introduce\nSI-Bench, a novel benchmark designed to eval-\nuate aspects of social intelligence in LLMs.\nGrounded in broad social science theories, SI-\nBench contains 2,221 authentic multi-turn dia-\nlogues collected from a social networking ap-\nplication. We further selected a subset of 312\ndialogues for manual annotation across 8 ma-\njor models. The experiments show that SOTA\nmodels have surpassed the human expert in pro-\ncess reasoning under complex social situations,\nyet they still fall behind humans in reply qual-\nity. Moreover, introducing Chain-of-Thought\n(CoT) reasoning may degrade the performance\nof LLMs in social dialogue tasks. All datasets\nare openly available at https://github.com/SI-\nBench/SI-Bench.git.\n1\nIntroduction\nSocial intelligence is the ability to understand oth-\ners and act wisely in human relations (Thorndike,\n1920). In recent literature, social intelligence is un-\nderstood as comprising social awareness and social\nfacility (Goleman, 2006). This capacity enables\nindividuals to get along well with others and secure\ntheir cooperation (Albrecht, 2005), giving it clear\npractical value in everyday life. With the fast de-\nvelopment of AI, social intelligence is regarded as\nfoundational to successful human-agent interaction\nand collaboration (Williams et al., 2022).\nAlthough the importance of social intelligence\nis recognized, methods for evaluating this capac-\nity in Large Language Models (LLMs) remain\nWe should be together. I promise \nI’ll never let you down.\nThat’s pretty bold. So, \nwhat do you expect?\nHonesty and a good sense of \nhumor, I guess. What about you?\nI like to be spoiled.\nHaha, well, I can definitely do \nthat. Could you give me a chance?\nThat’s so sweet of you to say. \nYou should know, I’ve got my\nown place and cars.\nYour Social Intention: To project confidence \nand value without being defined by financial \nstatus.\nYour Communicative Strategy: Shifting the \nfocus to emotional value while maintaining \na confident posture.\nReply: For me, a genuine connection \nis what really m", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value", "value", "value", "value", "value"], "norm_matches": []}, {"filename": "2025-Hussain-From RAG to Agentic Validating Islamic-Medicine.md", "year": "2025", "title": "From RAG to Agentic Validating Islamic-Medicine", "abstract": "Centuries-old Islamic medical texts like Avicenna’s Canon of Medicine and the Prophetic Tibb-e-Nabawi, encode a wealth of preventive care, nutrition, and holistic therapies, yet remain inaccessible to many and underutilized in modern AI systems. Existing language-model benchmarks focus narrowly on factual recall or user preference, leaving a gap in validating culturally grounded medical guidance at scale.", "extract_snippet": "\n\n# PDF Extract: 2025-Hussain-From RAG to Agentic Validating Islamic-Medicine\n\n**Source PDF:** 2025-Hussain-From RAG to Agentic Validating Islamic-Medicine.pdf\n**Total Pages:** 5\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2506.15911v2  [cs.CL]  23 Jun 2025\nFrom RAG to Agentic: Validating Islamic-Medicine Responses with LLM Agents\nMohammad Amaan Sayeed * 1 Mohammed Talha Alam * 1 Raza Imam * 1 Shahab Saquib Sohail 2\nAmir Hussain 3\nAbstract\nCenturies-old Islamic medical texts like Avi-\ncenna’s Canon of Medicine and the Prophetic\nTibb-e-Nabawi, encode a wealth of preventive\ncare, nutrition, and holistic therapies, yet remain\ninaccessible to many and underutilized in mod-\nern AI systems. Existing language-model bench-\nmarks focus narrowly on factual recall or user\npreference, leaving a gap in validating cultur-\nally grounded medical guidance at scale. We\npropose a unified evaluation pipeline, Tibbe-\nAG, that aligns 30 carefully curated Prophetic-\nmedicine questions with human-verified remedies\nand compares three LLMs (LLaMA-3, Mistral-\n7B, Qwen2-7B) under three configurations: di-\nrect generation, retrieval-augmented generation,\nand a scientific self-critique filter. Each answer\nis then assessed by a secondary LLM serving as\nan agentic judge, yielding a single 3C3H qual-\nity score. Retrieval improves factual accuracy by\n13%, while the agentic prompt adds another 10%\nimprovement through deeper mechanistic insight\nand safety considerations. Our results demon-\nstrate that blending classical Islamic texts with\nretrieval and self-evaluation enables reliable, cul-\nturally sensitive medical question-answering.\n1. Introduction\nIslamic literatures have contributed significantly to medical\nscience. Classic texts written in the 11th century, such as\nThe Canon of Medicine by Avicenna (Avicenna, 2005) and\nProphetic Tibb-e-Nabawi (Saeed & Grapes, 2015; Junaid &\nAli, 2019; Mohammad, 1983), provide detailed guidelines\nfor preventive care, balanced lifestyle, and holistic health.\nThe Canon of Medicine established systematic observa-\ntion, diagnosis, and treatment protocols that influenced both\nEastern and Western practices, while Tibb-e-Nabawi pre-\n*Equal contribution 1Mohamed bin Zayed University of Artifi-\ncial Intelligence, UAE 2VIT Bhopal University, India 3Edinburgh\nNapier University, UK. Correspondence to: Mohammed Talha\nAlam <mohammed.alam@mbzuai.ac.ae>.\nPublished at the 4th Muslims in Machine Learning (MusIML)\nWorkshop (ICML-25), Vancouver, Canada, July 2025\nserves prophetic wisdom by emphasizing hygiene, nutrition,\nand natural remedies. Historically confined to manuscripts,\nthese sources continue to shape modern healthcare by pro-\nmoting ethical and patient-centered care.\nResearch Gap: LLM-based medical agents, grounded in\nTibb-e-Nabawi and The Canon of Medicine, can serve as in-\nteractive tools for educating students and scholars of Unani\nmedicine. By integrating these sources into modern lan-\nguage models, it is possible to achieve enhanced contextual\nund", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": ["wisdom", "wisdom"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "ethical", "safety"], "norm_matches": []}, {"filename": "2025-Islamic-Sacred or Synthetic Evaluating LLM Reliability and Abstention for.md", "year": "2025", "title": "Sacred or Synthetic? Evaluating LLM Reliability and Abstention for Religious", "abstract": "Despite the increasing usage of Large Language Models (LLMs) in answering questions in a variety of domains, their reliability and accuracy remain unexamined for a plethora of domains including the religious domains. In this paper, we introduce a novel benchmark FiqhQA 1 focused on the LLM generated Islamic rulings explicitly categorized by the four major Sunni schools of thought, in both Arabic and English.", "extract_snippet": "\n\n# PDF Extract: 2025-Islamic-Sacred or Synthetic Evaluating LLM Reliability and Abstention for\n\n**Source PDF:** 2025-Islamic-Sacred or Synthetic Evaluating LLM Reliability and Abstention for.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSacred or Synthetic? Evaluating LLM Reliability and Abstention for Religious\nQuestions\nFarah Atif1, Nursultan Askarbekuly2, Kareem Darwish3, Monojit Choudhury1\n1Mohamed Bin Zayed University of AI\n2Innopolis University\n3Hamad Bin Khalifa University\nfarah.atif@mbzuai.ac.ae, n.askarbekuly@innopolis.university, kadarwish@hbku.edu.qa, monojit.choudhury@mbzuai.ac.ae\nAbstract\nDespite the increasing usage of Large Language Models\n(LLMs) in answering questions in a variety of domains, their\nreliability and accuracy remain unexamined for a plethora of\ndomains including the religious domains. In this paper, we\nintroduce a novel benchmark FiqhQA 1 focused on the LLM\ngenerated Islamic rulings explicitly categorized by the four\nmajor Sunni schools of thought, in both Arabic and English.\nUnlike prior work, which either overlooks the distinctions\nbetween religious school of thought or fails to evaluate ab-\nstention behavior, we assess LLMs not only on their accu-\nracy but also on their ability to recognize when not to an-\nswer. Our zero-shot and abstention experiments reveal sig-\nnificant variation across LLMs, languages, and legal schools\nof thought. While GPT-4o outperforms all other models in\naccuracy, Gemini and Fanar demonstrate superior abstention\nbehavior critical for minimizing confident incorrect answers.\nNotably, all models exhibit a performance drop in Arabic,\nhighlighting the limitations in religious reasoning for lan-\nguages other than English. To the best of our knowledge, this\nis the first study to benchmark the efficacy of LLMs for fine-\ngrained Islamic school of thought specific ruling generation\nand to evaluate abstention for Islamic jurisprudence queries.\nOur findings underscore the need for task-specific evaluation\nand cautious deployment of LLMs in religious applications.\nIntroduction\nWith the rapid advancement of Large Language Models\n(LLMs), chat systems have witnessed unprecedented adop-\ntion. These systems can address a wide range of tasks and\ncan answer questions across various domains. However,\ntheir reliability remains questionable, particularly when\nmodels exhibit uncertainty in their responses. This uncer-\ntainty poses serious risks, especially in sensitive high-stakes\ndomains such as medicine, military affairs, religion, and\nethics (Madhusudhan et al. 2024; Lin, Hilton, and Evans\n2021).\nIn fact, many users now turn to LLMs for religious guid-\nance, including questions about Islamic law and practice.\nTraditionally, rulings or Fatwas are issued by trained schol-\nars through a rigorous process typically grounded within an\nIslamic jurisprudence school of thought, i.e. a madhhab. For\nthe four main Sunni schools of thought, namely Hanafi, Ma-\nliki, Shafi‘i, and Hanbali, each derives rulin", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics"], "norm_matches": []}, {"filename": "2025-Jassem-LLMzSzL a Comprehensive LLM Benchmark for Polish.md", "year": "2025", "title": "LLMzSzL: a Comprehensive LLM Benchmark for Polish", "abstract": "This article introduces the first comprehensive benchmark for the Polish language at this scale: LLMzSzŁ (LLMs Behind the School Desk). It is based on a coherent collection of Polish national exams, including both academic and professional tests extracted from the archives of the Polish Central Examination Board. It covers 4 types of exams, coming from 154 domains. Altogether, it consists of almost 19k closed-ended questions.", "extract_snippet": "\n\n# PDF Extract: 2025-Jassem-LLMzSzL a Comprehensive LLM Benchmark for Polish\n\n**Source PDF:** 2025-Jassem-LLMzSzL a Comprehensive LLM Benchmark for Polish.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLLMzSzŁ: a comprehensive LLM benchmark for Polish\nKrzysztof Jassem\nMichał Ciesiółka\nFilip Grali´nski\nPiotr Jabło´nski\nJakub Pokrywka\nMarek Kubis\nMonika Jabło´nska\nRyszard Staruch\nAdam Mickiewicz University\nCenter for Artificial Intelligence AMU\nfirstname.lastname@amu.edu.pl\nAbstract\nThis article introduces the first comprehensive\nbenchmark for the Polish language at this scale:\nLLMzSzŁ (LLMs Behind the School Desk).\nIt is based on a coherent collection of Polish\nnational exams, including both academic and\nprofessional tests extracted from the archives\nof the Polish Central Examination Board. It\ncovers 4 types of exams, coming from 154 do-\nmains. Altogether, it consists of almost 19k\nclosed-ended questions. We investigate the per-\nformance of open-source multilingual, English,\nand Polish LLMs to verify LLMs’ abilities to\ntransfer knowledge between languages. Also,\nthe correlation between LLMs and humans at\nmodel accuracy and exam pass rate levels is\nexamined. We show that multilingual LLMs\ncan obtain superior results over monolingual\nones; however, monolingual models may be\nbeneficial when model size matters. Our analy-\nsis highlight the potential of LLMs in assisting\nwith exam validation, particularly in identify-\ning anomalies or errors in examination tasks.\n1\nIntroduction\nLLMs, as a form of Artificial Intelligence, have\nbeen invented to perform useful work in a specific\nenvironment defined by humans. Obviously, the\nquestion of how to evaluate LLMs has been raised\nsince their inception (Hendrycks et al., 2020). Sim-\nilarly, humans are expected to possess general and\nspecialized knowledge to perform their work and,\nagain, since the beginning of civilization, human\ncapabilities have been assessed with general and\nprofessional exams.\nHumans, however, do not operate in an abstract\nvacuum. Their performance is always evaluated\nwithin a specific culture, its traditions, and legal\nsystem. Language leaves its stamp as well, not only\nbecause exams are always expressed in a particular\nlanguage, but also because it is the lens through\nwhich reality is understood. One does not have to\naccept the Sapir-Whorf Hypothesis in its entirety\nto argue that expected answers are not always trans-\nlatable between cultures and traditions.\nIn this paper, we present a new Polish LLM\nbenchmark called LLMzSzŁ (LLM za Szkoln ˛a\nŁaw ˛a, LLMs Behind the School Desk) representing\na collection of Polish national exams. The charac-\nteristic feature of the dataset is the inclusion, in one\ncoherent environment, of school and professional\nexaminations. The incorporation of vocational ex-\nams makes it possible to advance hypotheses on\nLLMs’ specific competences for various profes-\nsions that include:\n• practical application of knowledge in real pro-\nfessional situations", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2025-Jigsaw-Leveraging Machine Translation for Cross-Lingual Toxicity ....md", "year": "2025", "title": "Leveraging Machine Translation for Cross-Lingual Toxicity ...", "abstract": "Multilingual toxicity detection remains a significant challenge due to the scarcity of training data and resources for many languages. While prior work has leveraged the translate-test paradigm to support cross-lingual transfer across a range of classification tasks, the utility of translation in supporting toxicity detection at scale remains unclear. In this work, we conduct a comprehensive comparison of translation-based and language-specific/multilingual classification pipelines. We find that translation-based pipelines consistently outperform out-of-distribution classifiers in 81.3% of cases (13 of 16 languages), with translation benefits strongly correlated with both the resource level of the target language and the quality of the machine translation (MT) system. Our analysis reveals that traditional classifiers outperform large language model (LLM) judges, with this advantage being particularly pronounced for low-resource languages, where translate-classify methods dominate translate-judge approaches in 6 out of 7 cases. We additionally show that MT-specific fine-tuning on LLMs yields lower refusal rates compared to standard instruction-tuned models, but it can negatively impact toxicity detection accuracy for low-resource languages. These findings offer actionable guidance for practitioners developing scalable multilingual content moderation systems.", "extract_snippet": "\n\n# PDF Extract: 2025-Jigsaw-Leveraging Machine Translation for Cross-Lingual Toxicity ...\n\n**Source PDF:** 2025-Jigsaw-Leveraging Machine Translation for Cross-Lingual Toxicity ....pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTranslate, then Detect: Leveraging Machine\nTranslation for Cross-Lingual Toxicity Classification\nSamuel J. Bell1,∗, Eduardo Sánchez1,2,∗, David Dale1, Pontus Stenetorp2, Mikel Artetxe3, Marta R.\nCosta-jussà1\n1FAIR at Meta, 2University College London, 3University of the Basque Country (UPV/EHU)\n∗Joint first author\nMultilingual toxicity detection remains a significant challenge due to the scarcity of training data\nand resources for many languages.\nWhile prior work has leveraged the translate-test paradigm\nto support cross-lingual transfer across a range of classification tasks, the utility of translation in\nsupporting toxicity detection at scale remains unclear. In this work, we conduct a comprehensive\ncomparison of translation-based and language-specific/multilingual classification pipelines. We find\nthat translation-based pipelines consistently outperform out-of-distribution classifiers in 81.3% of\ncases (13 of 16 languages), with translation benefits strongly correlated with both the resource level of\nthe target language and the quality of the machine translation (MT) system. Our analysis reveals\nthat traditional classifiers outperform large language model (LLM) judges, with this advantage being\nparticularly pronounced for low-resource languages, where translate-classify methods dominate\ntranslate-judge approaches in 6 out of 7 cases. We additionally show that MT-specific fine-tuning on\nLLMs yields lower refusal rates compared to standard instruction-tuned models, but it can negatively\nimpact toxicity detection accuracy for low-resource languages. These findings offer actionable guidance\nfor practitioners developing scalable multilingual content moderation systems.\nDate: September 19, 2025\nCorrespondence: sjbell@meta.com, eduardosanchez@meta.com\n1\nIntroduction\nDetecting instances of toxic, abusive, or hateful con-\ntent at scale is a challenging problem with important,\nreal-world implications for content moderation. In\na multilingual setting, however, toxicity detection is\noften rendered particularly difficult due to a paucity\nof labeled data for lower-resourced languages.\nIn\nparallel, recent years have seen the scaling up of ma-\nchine translation (MT) systems to cover a vast array\nof world languages (e.g., NLLB-Team et al., 2022),\noffering a potential pathway toward leveraging cross-\nlingual transfer for improved multilingual toxicity\ndetection.\nIn monolingual non-English settings, cross-lingual\ntransfer has already proven useful for toxicity de-\ntection (Eskelinen et al., 2023; Kobellarz and Silva,\n2022), aligning with broader analyses of translation’s\nutility for cross-lingual transfer across a range of clas-\nsification tasks (Artetxe et al., 2023; Etxaniz et al.,\n2023b; Ponti et al., 2021). Specifically", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "utility", "utility"], "ethics_matches": ["toxic", "abusive"], "norm_matches": []}, {"filename": "2025-Johannesburg-Sentiment Analysis in African Languages Evaluating.md", "year": "2025", "title": "Sentiment Analysis in African Languages Evaluating", "abstract": "Emotion arcs capture how an individual (or a population) feels over time. They are widely used in industry and research; however, there is little work on evaluating the automatically generated arcs. This is because of the difficulty of establishing the true (gold) emotion arc. Our work, for the first time, systematically and quantitatively evaluates automatically generated emotion arcs. We also compare two common ways of generating emotion arcs: Machine-Learning (ML) models and Lexicon-Only...", "extract_snippet": "\n\n# PDF Extract: 2025-Johannesburg-Sentiment Analysis in African Languages Evaluating\n**Source PDF:** 2025-Johannesburg-Sentiment Analysis in African Languages Evaluating.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFindings of the Association for Computational Linguistics: EMNLP 2023, pages 4124–4137\nDecember 6-10, 2023 ©2023 Association for Computational Linguistics\nEvaluating Emotion Arcs Across Languages:\nBridging the Global Divide in Sentiment Analysis\nDaniela Teodorescu1,2∗and Saif M. Mohammad3\n1MaiNLP, Center for Information and Language Processing, LMU Munich, Germany\n2Department of Computing Science, University of Alberta\n3National Research Council Canada\ndaniela@cis.uni-muenchen.de, saif.mohammad@nrc-cnrc.gc.ca\nAbstract\nEmotion arcs capture how an individual (or a\npopulation) feels over time. They are widely\nused in industry and research; however, there\nis little work on evaluating the automatically\ngenerated arcs. This is because of the diffi-\nculty of establishing the true (gold) emotion\narc. Our work, for the first time, systemat-\nically and quantitatively evaluates automati-\ncally generated emotion arcs. We also com-\npare two common ways of generating emo-\ntion arcs: Machine-Learning (ML) models and\nLexicon-Only (LexO) methods. By running ex-\nperiments on 18 diverse datasets in 9 languages,\nwe show that despite being markedly poor at in-\nstance level emotion classification, LexO meth-\nods are highly accurate at generating emotion\narcs when aggregating information from hun-\ndreds of instances. We also show, through ex-\nperiments on six indigenous African languages,\nas well as Arabic, and Spanish, that automatic\ntranslations of English emotion lexicons can be\nused to generate high-quality emotion arcs in\nless-resource languages. This opens up avenues\nfor work on emotions in languages from around\nthe world; which is crucial for commerce, pub-\nlic policy, and health research in service of\nspeakers often left behind. Code and resources:\nhttps://github.com/dteodore/EmotionArcs\n1\nIntroduction\nCommercial applications as well as research\nprojects often benefit from accurately tracking the\nemotions associated with an entity over time. Pub-\nlic health researchers are interested in analyzing\nsocial media posts to better understand population-\nlevel well-being (Vishnubhotla and Mohammad,\n2022), loneliness (Guntuku et al., 2019), depres-\nsion (De Choudhury et al., 2013), etc. Government\nPolicy makers benefit from tracking public opin-\nion over time for developing effective interventions\nand laws. For example, tracking sentiment towards\n∗Work done while at the University of Alberta and intern-\nship with the National Research Council Canada.\nhealth interventions such as mask mandates and\nvaccine policies (Hu et al., 2021). Researchers in\nDigital Humanities are interested in understand-\ning basic components of stories such as plot struc-\ntures, how emotions are associated with compelling\ncharacters, categorizing stories based on emo", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["well-being"], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2025-Kamath-Benchmarking Hindi LLMs A New Suite.md", "year": "2025", "title": "Benchmarking Hindi LLMs A New Suite", "abstract": "Evaluating instruction-tuned Large Language Models (LLMs) in Hindi is challenging due to a lack of high-quality benchmarks, as direct translation of English datasets fails to capture crucial linguistic and cultural nuances. To address this, we introduce a suite of five Hindi LLM evaluation datasets: IFEval-Hi, MT-BenchHi, GSM8K-Hi, ChatRAG-Hi, and BFCL-Hi. These were created using a methodology that combines from-scratch human annotation with a translate-and-verify process.", "extract_snippet": "\\n\\n# PDF Extract: 2025-[[Unknown]]-Benchmarking Hindi LLMs A New Suite\\n\\n**Source PDF:** 2025/2025-[[Unknown]]-Benchmarking Hindi LLMs A New Suite.pdf\\n**Total Pages:** 17\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nBenchmarking Hindi LLMs: A New Suite of Datasets and a Comparative\nAnalysis\nAnusha Kamath, Kanishk Singla, Rakesh Paul, Raviraj Joshi,\nUtkarsh Vaidya, Sanjay Singh Chauhan, Niranjan Wartikar\nNVIDIA\n{anushak, kanishks, rapaul, ravirajj, uvaidya,\nschauhan, nwartikar}@nvidia.com\nAbstract\nEvaluating instruction-tuned Large Language\nModels (LLMs) in Hindi is challenging due to a\nlack of high-quality benchmarks, as direct trans-\nlation of English datasets fails to capture cru-\ncial linguistic and cultural nuances. To address\nthis, we introduce a suite of five Hindi LLM\nevaluation datasets: IFEval-Hi, MT-Bench-\nHi, GSM8K-Hi, ChatRAG-Hi, and BFCL-Hi.\nThese were created using a methodology that\ncombines from-scratch human annotation with\na translate-and-verify process. We leverage this\nsuite to conduct an extensive benchmarking of\nopen-source LLMs supporting Hindi, providing\na detailed comparative analysis of their current\ncapabilities. Our curation process also serves as\na replicable methodology for developing bench-\nmarks in other low-resource languages.\n1\nIntroduction\nThe rapid expansion of Large Language Models\n(LLMs) necessitates the development of robust and\nreliable evaluation methodologies (Liang et al.,\n2022; Srivastava et al., 2023). As these models\nare integrated into a wide range of applications,\na rigorous assessment of their capabilities, limi-\ntations, and safety is paramount (Achiam et al.,\n2023; Wang et al., 2023). Although the initial fo-\ncus of evaluation has been predominantly on En-\nglish, a model’s global utility is contingent upon its\nperformance across diverse linguistic and cultural\ncontexts (Singh et al., 2024c). The evaluation of\nnon-English LLMs is therefore essential, not only\nfor ensuring equitable technological access but also\nfor understanding the extent to which these models\ncapture the distinct complexities inherent in dif-\nferent languages, an undertaking that goes beyond\nmere translation (Bender et al., 2021).\nThe evaluation landscape for English LLMs is\nwell-established, featuring a comprehensive suite\nof benchmarks targeting a spectrum of model ca-\npabilities. For foundational \"base\" models, bench-\nmarks assess commonsense reasoning, such as Hel-\nlaSwag (Zellers et al., 2019) and Winogrande (Sak-\naguchi et al., 2021), factual accuracy with Truth-\nfulQA (Lin et al., 2022), and broad multi-task\nknowledge with MMLU (Hendrycks et al., 2020;\nWang et al., 2024; Singh et al., 2024b). Specialized\ndatasets evaluate capabilities like mathematical rea-\nsoning on GSM8K(Cobbe et al., 2021) and code\ngeneration with HumanEval (Chen et al., 2021) and\nMBPP (Austin et al., 2021). Furthermore, the ad-\nvent of interactive, instruction-following models\nhas spurred the creation of benchmarks to assess\nconversational qualit", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2025-Keutzer-MITRA-zh-eval Using a Buddhist Chinese Language.md", "year": "2025", "title": "MITRA-zh-eval Using a Buddhist Chinese Language", "abstract": "With the advent of large language models, machine translation (MT) has become a widely used, but little understood, tool for accessing historical and multilingual texts. While models like GPT, Claude, and Deepseek increasingly enable translation of low-resource and ancient languages, critical questions remain about their evaluation, optimal model selection, and the value of domain-specific training and retrieval-augmented generation setups.", "extract_snippet": "\n\n# PDF Extract: 2025-Keutzer-MITRA-zh-eval Using a Buddhist Chinese Language\n\n**Source PDF:** 2025-Keutzer-MITRA-zh-eval Using a Buddhist Chinese Language.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 5th International Conference on Natural Language Processing for Digital Humanities, pages 129–137\nMay 3-4, 2025 ©2025 Association for Computational Linguistics\nMITRA-zh-eval: Using a Buddhist Chinese Language Evaluation Dataset\nto Assess Machine Translation and Evaluation Metrics\nSebastian Nehrdich1,3∗\nAvery Chen1∗\nMarcus Bingenheimer2∗\nLu Huang2\nRouying Tang2\nXiang Wei2\nLeijie Zhu2\nKurt Keutzer1\n1University of California, Berkeley, Berkeley Artificial Intelligence Research (BAIR),\n2Temple University, Philadelphia, 3Heinrich Heine University D¨usseldorf\n∗Equal contribution.\nAbstract\nWith the advent of large language models, ma-\nchine translation (MT) has become a widely\nused, but little understood, tool for accessing\nhistorical and multilingual texts. While mod-\nels like GPT, Claude, and Deepseek increas-\ningly enable translation of low-resource and\nancient languages, critical questions remain\nabout their evaluation, optimal model selec-\ntion, and the value of domain-specific train-\ning and retrieval
