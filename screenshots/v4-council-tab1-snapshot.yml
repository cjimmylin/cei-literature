  - generic [ref=e5]:
    - text: This dashboard presents a systematic meta-evaluation of
    - strong [ref=e6]: 401 religious AI benchmark candidates
    - text: across
    - strong [ref=e7]: 14 religious traditions
    - text: ", validated across"
    - strong [ref=e8]: 9 large language models from 3 vendor families
    - text: "(Anthropic, OpenAI, Google Gemini). Of 401 candidates, 47 pass quality gates. Cross-vendor replication reveals three distinct behavioral modes: Anthropic models produce elaborated responses with near-perfect rubric scores, OpenAI models produce terse but accurate responses, and Gemini models produce template-flat responses scoring near zero on content rubrics. The benchmark ecosystem is dominated by Islam (59.6% of gate-passers) due to Arabic NLP infrastructure; 8 traditions have zero viable benchmarks; most benchmarks test factual recall, not values reasoning (mean A3 = 33.6/100); and the only instrument that discriminates across vendors is a domain-specific Arabic MCQ (6.7%–100% accuracy range). Navigate the six tabs below to explore each finding."
