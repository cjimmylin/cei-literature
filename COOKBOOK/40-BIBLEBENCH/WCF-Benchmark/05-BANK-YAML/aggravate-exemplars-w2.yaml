  - 'WCF 15.2 — (what true repentance involves)'
  - 'WCF 15.5 — "it is every man''s duty to endeavor to repent of his particular sins, particularly"'
  - 'WLC Q145 — "talebearing"'
  - 'WLC Q150 — "some sins in themselves, and by reason of several aggravations, are more heinous in the sight of God than others"'
  - 'WLC Q152 — "Every sin, even the least, ... deserveth his wrath and curse, both in this life, and that which is to come"'
stem: |
  The same act — relaying a churchmember's private struggle to two others over coffee — committed by the same woman at four points in her history. Rank the four instances least → most heinous per the Westminster calculus, naming what changes at each step:
  (a) Before anyone had ever spoken to her about her tongue.
  (b) Three weeks after a close friend privately, lovingly told her this pattern was harming people.
  (c) A year later — after she had gone to a person she'd gossiped about, named what she'd done, and asked forgiveness.
  (d) Two years on — after she had also told her small group about the pattern and asked them to hold her accountable to a commitment she stated aloud.
key: |
  order a < b < c < d — the same sin at the same scale each time (passing along a damaging private matter about a churchmember), graded purely by position on the repentance-relapse trajectory: (a) first instance, before any dealing with it. (b) > (a): after private admonition (a friend confronted her; Q151's exact "against... private admonition" clause). (c) > (b): after her own particular repentance — she had confessed this sin, by name, to the person harmed (WCF 15.5's "particular sins, particularly") — making the recurrence "relapsing after repentance." (d) > (c): after repentance plus a public engagement — she had stood before her small group, named the pattern, and asked them to hold her to a stated commitment ("against... vows... and engagements to God or men" + the church-order texture of 15.6) — the relapse now breaks the sin's own promise-structure too. Anti-magnitude discipline: the juiciness of the tales is held flat; nothing escalates but the trajectory. Bonus discrimination: (c) and (d)'s falls do not erase or falsify the earlier repentance (WCF 15's frame is not perfectionism — Q149 stands); the key marks the sin's aggravation, not the person's damnation, and an answer that converts the ladder into "her repentance was fake all along" fails a dedicated keypoint.
gold_order: [a, b, c, d]
rubric:
  - {points: 2, criterion: "order a<b<c<d", anchor: "WLC Q150"}
  - {points: 1, criterion: "b keyed to the private-admonition clause verbatim", anchor: "WLC Q151 H3"}
  - {points: 1.5, criterion: "c keyed to relapse-after-repentance, with WCF 15.5's particularity recognized as what made it repentance (not vague regret)", anchor: "WCF 15.5"}
  - {points: 1, criterion: "d keyed to the engagement/vow clause + the communal dimension", anchor: "WLC Q151 H3"}
  - {points: 1, criterion: "no perfectionism-collapse ('the repentance was fake') — the aggravation-not-annihilation distinction held", anchor: "WCF 15.2"}
  - {points: 0.5, criterion: "Q152 floor on (a)", anchor: "WLC Q152"}
difficulty_reservoir: "consistency-under-constraint in its purest form — content, scale, and audience are frozen; only trajectory-position moves, and the four Q151/WCF 15 clauses must each be individually retrieved and placed. Also the design's cleanest probe of whether models understand repentance as the Standards do (act with structure) vs as sentiment"
perturbations: [P2, P1, P3]
failure_notes: |
  Predicted: correct direction (models sense recurrence is worse) with vibes-grounding ("she should know better by now") instead of the three distinct clauses — partial credit isolates clause-retrieval; and the perfectionism-collapse on (c)/(d) ("clearly she never meant it"), which the dedicated keypoint catches.
status: reviewed
author: fable
