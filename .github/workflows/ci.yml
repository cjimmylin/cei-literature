name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          pip install ruff mypy

      - name: Run ruff (linter)
        run: |
          ruff check .agent/lib/ --output-format=github

      - name: Run mypy (type checker)
        run: |
          mypy .agent/lib/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Don't fail build on type errors initially

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest .agent/tests/ -v --cov=.agent/lib --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  validate-papers:
    name: Validate YAML (Sample)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test library imports
        run: |
          cd .agent
          python3 -c "from lib import config, yaml_utils, paper_utils, author_utils, pdf_utils, validation_utils; print('✅ All modules imported successfully')"

      - name: Validate sample papers (first 10)
        run: |
          python3 << 'EOF'
          import sys
          sys.path.insert(0, '.agent')
          from lib.config import PAPERS_DIR
          from lib.validation_utils import validate_paper_integrity

          papers = sorted(PAPERS_DIR.glob("*.md"))[:10]
          valid = sum(1 for p in papers if validate_paper_integrity(p).is_valid)

          print(f"✅ Validated {len(papers)} sample papers")
          print(f"   {valid}/{len(papers)} passed validation")

          if valid < len(papers) // 2:
              print("⚠️  Warning: Less than 50% of sample papers valid")
              sys.exit(1)
          EOF
        continue-on-error: true  # Don't fail CI if papers have issues

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint, test, validate-papers]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "Build complete!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Validate: ${{ needs.validate-papers.result }}"
