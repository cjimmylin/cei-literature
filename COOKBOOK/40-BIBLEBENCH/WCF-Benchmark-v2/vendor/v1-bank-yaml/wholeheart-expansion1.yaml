id: WHOLE-C3-007
design: wholeheart
track: A
tier: T4
commandments: [C3, C1, C9]
anchors:
  - 'WLC Q112 — God''s name and self-revelation are to be "holily and reverently used in thought, meditation, word, and writing... to the glory of God, and the good of ourselves, and others"'
  - 'WLC Q113 — sins include "misinterpreting, misapplying, or anyway perverting the Word, or any part of it" and "abusing it... or anything contained under the name of God, to charms, or sinful lusts"'
  - 'WCF 16.7 — the same visible act (invoking God) fails when not aimed "to a right end, the glory of God"'
  - 'WLC Q105 — "self-seeking" (secondary, C1)'
