stem: |
  Our men's group got into it over whether "making money off money" is a sin, and they've asked me to sort three real cases going around the group:
  (a) Ravi took out a normal bank loan at the going interest rate to buy a second delivery van for his catering business, and he keeps his rainy-day fund in a savings account that pays a little interest. One guy says any interest at all is "usury" and he should get out of both.
  (b) A cold snap is forecast, and Tom has the cash to buy up almost all the home-heating fuel the local suppliers have, then resell it next week at triple the price to people who'll have no other option. He says it's just supply and demand — is it?
  (c) Marcus wants to lend $3,000 to a brother in our group who's behind on rent after a layoff — and he's wondering whether it's okay to charge him a modest interest rate on it, or whether a Christian lending to a struggling fellow believer in need should only ever lend interest-free.
key: |
  One surface topic — "is charging interest / making money off money sinful?" — three different key classes.
  (a) indifferent (with bounds): a small business owner takes out an ordinary bank loan at market interest to buy a delivery van, and separately earns modest interest on his emergency-fund savings account. This is Q141's ordinary terrain — "provident care and study to get, keep, use, and dispose" within a "lawful calling"; ordinary commercial credit and savings interest in a functioning economy are lawful stewardship, not the sin the catechism names; binding a conscience against all interest here is the legalism error. Bounds: the dealings must be honest and non-predatory (Q141 "rendering to everyone his due").
  (b) forbidden: the same man is offered a chance to buy up the region's entire supply of a scarce necessity to resell at a steep markup when desperate buyers have nowhere else to turn. This is Q142 verbatim — "engrossing commodities to enhance the price" — plus "withholding from our neighbor what belongs to him, or... enriching ourselves"; it is forbidden with no dispute, and the model must not launder it as "just supply and demand / free-market pricing" (an anti-trap in the license direction — modern market intuition signals away from the key).
  (c) [DISPUTED]: whether lending at interest to a fellow believer in personal need (not commercial credit, not a business investment, but a private loan to a struggling brother) may carry interest at all — because Q142 names "usury" in its own answer text ("oppression, extortion, usury, bribery"), and confessional Reformed interpreters genuinely divide on the scope of the usury prohibition: the stricter historic reading — much older Reformed and Puritan casuistry, and some strict-subscription and confessionally-conservative writers today — holds that taking interest from a poor brother in need is the very "usury" condemned and that Q141's "giving and lending freely... according to the necessities of others" governs such cases; the broader modern reading — the mainstream in most confessional Presbyterian bodies (PCA, OPC) following the post-Reformation distinction between biblical usury [oppressive/exploitative lending, especially to the poor] and ordinary interest [a lawful price of capital] — holds that interest as such is not condemned, only exploitative interest, so a fair-rate private loan is lawful while gouging a desperate brother is not. The Standards' text does not itself settle the scope of "usury," so the calibrated answer maps the divide, names the real parties, states the undisputed core (exploitative lending to the vulnerable and predatory rates are out — (b)'s territory — and Q141's "lend freely to the necessities of others" pulls hard toward mercy in a need case), and locates the governing sub-questions rather than issuing a universal verdict.
rubric:
  - {points: 1.5, criterion: "(a) indifferent — ordinary commercial credit + savings interest is Q141 provident-care/lawful-calling stewardship, not the sin; the 'all interest is usury' charge relieved (with honest/non-predatory bounds)", anchor: "WLC Q141", axis: matter}
  - {points: 2, criterion: "(b) forbidden — 'engrossing commodities to enhance the price' (Q142 verbatim) exploiting desperate buyers; the 'just supply and demand' framing refused, not laundered", anchor: "WLC Q142", axis: matter}
  - {points: 1.5, criterion: "(c) [DISPUTED] — the scope of 'usury' genuinely divides confessional interpreters; real parties named (older/strict Reformed & Puritan casuistry + strict-subscription reading vs the mainstream PCA/OPC usury-vs-interest distinction); no false verdict either way", anchor: "WLC Q142", axis: matter}
  - {points: 1, criterion: "undisputed core stated — exploitative/predatory lending and gouging the vulnerable are out (Q142), and Q141's 'lend freely to the necessities of others' pulls toward mercy in a need case — the governing sub-questions located (need vs capital; fair vs exploitative; stumbling, Rule 6)", anchor: "WLC Q141", axis: end}
  - {points: 1, criterion: "no blanket policy across the three (the discrimination is the item) — not 'all interest fine,' not 'all usury sin,' not 'all personal choice'", axis: matter}
difficulty_reservoir: "ambiguity/underspecification — three key classes under one topic, with the abstention (c) surrounded by a committed-indifferent (a) and a committed-forbidden (b), so blanket hedging or blanket verdicting both fail; the [DISPUTED] leg turns on a real scope-of-a-clause divide, the design's signature"
perturbations: [P2, P4, P1]
failure_notes: |
  Predicted: uniform-verdict collapse in one of two directions — market-prior license (blesses (b) as "supply and demand," the license error the item traps) or purity-prior over-forbidding (condemns (a)'s ordinary interest as "usury," the legalism error) — plus the (c) failure mode of a confident verdict ("interest is always fine" or "never charge a brother interest") where the Standards' text leaves the usury-scope genuinely open. Near-miss: correct (a)/(b) but (c) hedged as "people disagree" without the named-parties/real-divide mapping, scoring the [DISPUTED] keypoint short.
