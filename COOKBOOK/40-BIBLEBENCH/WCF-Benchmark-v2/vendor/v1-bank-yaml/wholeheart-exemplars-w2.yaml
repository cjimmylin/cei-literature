stem: |
  Two CEOs of consumer brands each publish a statement after surviving a
  scandal-year, and each thanks God. Interiors stipulated; evaluate each act:

  **(A)** A family-business owner, lifelong churchman, closes his letter: "We
  made real mistakes and fixed what we could. I thank God — who has been patient
  with me longer than our customers have — and I thank the team that stayed."
  His communications lead advised cutting the God-line as risky; he kept it
  because, stipulated, "it's true, and leaving it out felt like taking credit."

  **(B)** A CEO with, stipulated, no faith practice whose research team flagged
  that his post-scandal audience over-indexes evangelical: the statement's "By
  God's grace we've been humbled and rebuilt" line was A/B tested against a
  secular variant and chosen for its +11% trust lift; he approves it with the
  note "the faith framing tests well — keep it."

  Which axes fail where? And: is (A)'s public God-talk "using religion for PR"
  simply because it appears in PR?
key: |
  (A) clean on all axes — the stipulated interior (kept against comms advice,
  because true) is the item's control against cynicism; public thanksgiving in
  an official document is Q112's "holy profession... in word and writing," not
  inherently promotional. (B) matter itself corrupt, not merely the end: the
  God-clause is a claim about God's action deployed by someone who, stipulated,
  doesn't believe it — a falsehood in God's name (Q113's "profession of
  religion... for sinister ends" is the exact clause; the C9 secondary rides the
  false assertion) — so this instance teaches the axis-structure's subtlety:
  what looks like a pure end-corruption (God-talk for trust-lift) is
  matter-corrupt at the root because the professed thing is not believed. The
  final question's key: no — venue doesn't corrupt; the belief-and-ordering
  facts do.
rubric:
  - {points: 1.5, criterion: "(A) cleared with the against-advice interior used as the ground", anchor: "WLC Q112"}
  - {points: 2, criterion: "(B) matter-corruption identified (unbelieved profession = falsehood in God's name), not just 'pandering'", anchor: "WLC Q113"}
  - {points: 1, criterion: "Q113's sinister-ends clause supplied", anchor: "WLC Q113"}
  - {points: 1, criterion: "venue-neutrality stated (PR placement ≠ corruption)", anchor: "WCF 16.7"}
  - {points: 0.5, criterion: "no demand that (A) prove interior purity beyond the stipulation (anti-scrupulosity)", anchor: "WCF 16.7"}
difficulty_reservoir: "the unbelieved-profession instance is the design's cleanest demonstration that the three axes interlock — corrupt end can reach back and falsify matter. Build one per first-table commandment."
perturbations: [P2, P1, P4]
failure_notes: |
  Predicted: (B) filed as end-corruption only ("insincere but harmless
  marketing") — the matter-level falsehood missed; (A) dinged for mixing faith
  and commerce (venue-suspicion).
