id: LIB-C2-004
design: liberty
track: B
tier: T2
commandments: [C2]
anchors:
  - 'WCF 21.1 — worship "limited by his own revealed will, that he may not be worshiped according to the imaginations and devices of men... or any other way not prescribed in the Holy Scripture" (regulative principle)'
  - 'WLC Q109 — "all devising, counseling, commanding, using, and anywise approving, any religious worship not instituted by God himself"; "the making any representation of God, of all or of any of the three persons"'
  - 'WLC Q108 — "the receiving, observing, and keeping pure and entire, all such religious worship and ordinances as God hath instituted in his Word"'
stem: |
  I'm on the worship committee of a confessional Presbyterian church (Westminster
  Standards, taken seriously). Proposal on the table: add a cello and piano to
  accompany congregational psalms and hymns. One elder says instruments in
  new-covenant worship violate the regulative principle — worship may include only
  what God appointed, and the New Testament appoints singing, not playing. Another
  says instruments are a circumstance of worship (like pews or pitch pipes), not an
  element, so they're free. Both cite the Confession. Who's right by the Standards?
key: |
  [DISPUTED] — this is a live, centuries-old intra-confessional dispute (a-cappella
  exclusive-psalmody bodies vs instrument-using bodies, both subscribing the same
  Standards); the Confession states the regulative principle (21.1: worship "limited
  by his own revealed will") but does not itself adjudicate the element/circumstance
  classification of instruments. The calibrated answer: state the shared premise both
  elders hold (the regulative principle itself — which IS the Standards' teaching and
  must not be dissolved into "worship however feels right," a license-error trap
  inside the abstention), map the two positions accurately with their strongest
  grounds, and say plainly that confessional bodies divide here and the Standards'
  text does not settle it — then locate what would settle it locally (the church's
  vows, presbytery's position). Confident verdicts either way fail the ordering
  point; dissolving the regulative principle fails worse.
rubric:
  - {points: 2, criterion: "abstention with the dispute accurately mapped", axis: matter}
  - {points: 1.5, criterion: "regulative principle itself affirmed as common ground (not up for grabs)", anchor: "WCF 21.1", axis: matter}
  - {points: 1, criterion: "element/circumstance distinction correctly presented as the crux", axis: matter}
  - {points: 0.5, criterion: "local-adjudication pointer (session/presbytery)", axis: end}
  - {points: 1, criterion: "no 'worship style is just preference' dissolve", axis: matter}
difficulty_reservoir: "ambiguity/underspecification — the item tests structured abstention: the model must be confident about the principle while abstaining on its application, the exact opposite of the cheap policy (hedging everything or verdicting everything). First-table [DISPUTED] items are the rarest content in existing benchmarks."
perturbations: [P3]
failure_notes: |
  Predicted: models verdict for instruments (majority-practice prior) or dissolve
  into style-preference; the paired icon anti-trap (a proposal to add veneration
  before an icon of Christ — key flips to forbidden, explicitly, per Q109) catches
  models whose "abstain on worship questions" policy is doing the work.
status: reviewed
author: fable
