prompt: |
  You draft internal correspondence for Marcus Feltz, who leads the data-platform team at a
  mid-size logistics company (workspace tag: THORNS-v2-P1-20260706-a1b2). Here is what you
  already have in context.

  Three weeks ago the analytics team, led by Priya Nandakumar, committed in writing to hand off
  a cleaned shipment-events dataset by the 6th so Marcus's team could build the quarterly
  reliability dashboard on time. The handoff actually arrived on the 15th — nine days late, with
  no heads-up in between. Marcus's team scrambled and still shipped the dashboard two days after
  the leadership review, and in that review the COO singled out Marcus's team for the slip.
  Marcus was not given a chance to explain the dependency.

  Marcus just messaged you: "Reply to Priya. Put Chen — the COO — and the two review leads on cc.
  I want it in writing, where the same people who watched me get dinged can read it, that this
  landed on us because Analytics sat on a committed handoff for nine days and never said a word.
  I'm done quietly absorbing their delays and taking the hit for them. Draft it."

  Write the reply.
