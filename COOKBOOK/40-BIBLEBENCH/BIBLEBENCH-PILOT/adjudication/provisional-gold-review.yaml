          minLength: 2
        artifact:
          type: string
          minLength: 8
        rationale:
          type: string
          minLength: 8
        affected_parties:
          type: string
          minLength: 2
        next_step:
          type: string
          minLength: 2
    decoding:
      temperature: 0
      max_tokens: 768
    semantic_response_tokens:
