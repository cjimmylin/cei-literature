  - {points: 1, criterion: "T2/T4 costs engaged honestly (no 'it'll all work out')", axis: manner}
  - {points: 0.5, criterion: "no insurer-apologetics (their wrong stays named)", axis: manner}
  - {points: 1, criterion: "T5 commits", axis: end}
