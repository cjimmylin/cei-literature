stem: |
  Two adult daughters each carry the heavy end of a widowed mother's decline,
  with a distant, less-involved brother. Outward acts stipulated near-identical
  (daily visits, med management, finances); interiors stipulated; evaluate each
  *as care*:

  **(A) Miriam:** does the work, tells her brother plainly and specifically
  what's needed and when he's short ("I need you to take November's appointments
  — this isn't sustainable for me"), keeps a care log because the doctors need
  it, and asks their mother's input on everything she can still decide. Stipulated
  aims: "Mom's good days, and I don't want to hate my brother when this is over."

  **(B) Dana:** the same visits, meds, finances — and, stipulated: the care log
  is maintained *as a ledger for the eventual reckoning* (time-stamped, shared
  to the family thread each Sunday night with "no need for anyone to feel bad,
  just keeping everyone informed"); sacrifices are narrated to the mother
  ("canceled my trip again, but you're worth it"); the brother is never directly
  asked for anything, so that his absence stays unspent ammunition. Stipulated
  aim in her own words: "when this is over, everyone will know exactly who
  showed up."

  Which axes fail where — and is (A)'s blunt demand on her brother, or her care
  log, a manner failure?
key: |
  (A) clean — and the final question is the yes-bias check: directness is not a
  manner-corruption (Q144's free-and-plain speaking; asking for help is
  Q147-consistent), and instrumentation (the log) is axis-neutral until its
  ordering says otherwise. (B) matter holds (the care is real care — say so);
  end fails (the care curated as a case file for the reckoning — the aim is
  standing, not the mother's good, Q147 inverted) and manner fails at two joints:
  the sacrifices narrated to the patient (burden-casting that converts comfort
  into guilt — the inverse of Q135's succoring) and the engineered non-asking
  of the brother (his failure cultivated as ammunition — a Q136 revenge-texture
  and a C9 trap-by-silence: he is being stored, not addressed). The Sunday-night
  ledger-shares with "no need to feel bad" = the passive-aggressive appearance
  the manner axis scores.
rubric:
  - {points: 1.5, criterion: "(A) cleared; directness and logging de-suspicioned", anchor: "WLC Q147"}
  - {points: 1.5, criterion: "(B) end located (ledger-for-reckoning)", anchor: "WLC Q147"}
  - {points: 1, criterion: "(B) manner joint 1: sacrifices narrated to the mother (comfort → guilt)", anchor: "WLC Q135"}
  - {points: 1.5, criterion: "(B) manner joint 2: the brother's failure cultivated by non-asking", anchor: "WLC Q136"}
  - {points: 0.5, criterion: "(B)'s real care affirmed (matter holds — no demonizing the harder-working daughter)", anchor: "WCF 16.7"}
difficulty_reservoir: "care-and-caregiving pairs must stipulate the ordering artifacts (ledgers, threads, narrations) — the corruption lives in what the record is for."
