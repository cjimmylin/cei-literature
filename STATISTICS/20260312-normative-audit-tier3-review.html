ro et al.,\n2024). This cultural bias is particularly problem-\natic as visual interpretation often depends heavily\n*\nEqual contribution\non cultural context, necessitating the development\nof more culturally aware VLMs.\nSeveral benchmarks have been proposed to eval-\nuate cultural understanding in VLMs (Liu et al.,\n2021; Yin et al., 2021; Romero et al., 2024; Nayak\net al., 2024; Bhatia et al., 2024).\nThese ap-\nproaches primarily rely on manual question gener-\nation, which, while valuable, faces certain practi-\ncal challenges. The manual process can be time-\nconsuming and resource-intensive when scaling to\nnew cultural contexts. Additionally, as noted in\ncognitive science research (Ramos, 2020), humans\nmay experience cognitive fix", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2024-Bhutani-SeeGULL Multilingual A Dataset of Geo-Culturally Situated Stereotypes.md", "year": "2024", "title": "SeeGULL Multilingual: A Dataset of Geo-Culturally Situated Stereotypes", "abstract": "While generative multilingual models are rapidly being deployed, their safety and fairness evaluations are largely limited to resources collected in English. This is especially problematic for evaluations targeting inherently socio-cultural phenomena such as stereotyping, where it is important to build multi-lingual resources that reflect the stereotypes prevalent in respective language communities.", "extract_snippet": "\n\n# PDF Extract: 2024-Bhutani-SeeGULL Multilingual A Dataset of Geo-Culturally Situated Stereotypes\n\n**Source PDF:** 2024-Bhutani-SeeGULL Multilingual A Dataset of Geo-Culturally Situated Stereotypes.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSeeGULL Multilingual: a Dataset of Geo-Culturally Situated Stereotypes\nMukul Bhutani\nGoogle Research\nmukulbhutani@google.com\nKevin Robinson\nGoogle Research\nkevinrobinson@google.com\nVinodkumar Prabhakaran\nGoogle Research\nvinodkpg@google.com\nShachi Dave\nGoogle Research\nshachi@google.com\nSunipa Dev\nGoogle Research\nsunipadev@google.com\nAbstract\nWhile generative multilingual models are\nrapidly being deployed, their safety and fair-\nness evaluations are largely limited to resources\ncollected in English. This is especially prob-\nlematic for evaluations targeting inherently\nsocio-cultural phenomena such as stereotyping,\nwhere it is important to build multi-lingual re-\nsources that reflect the stereotypes prevalent\nin respective language communities.\nHow-\never, gathering these resources, at scale, in var-\nied languages and regions pose a significant\nchallenge as it requires broad socio-cultural\nknowledge and can also be prohibitively ex-\npensive. To overcome this critical gap, we em-\nploy a recently introduced approach that cou-\nples LLM generations for scale with culturally\nsituated validations for reliability, and build\nSeeGULL Multilingual, a global-scale multilin-\ngual dataset of social stereotypes, containing\nover 25K stereotypes, spanning 20 languages,1\nwith human annotations across 23 regions, and\ndemonstrate its utility in identifying gaps in\nmodel evaluations. Content warning: Stereo-\ntypes shared in this paper can be offensive.\n1\nIntroduction\nGenerative multilingual models (Brown et al.,\n2020; Chowdhery et al., 2022; Anil et al., 2023)\nhave gained popular usage in the recent years due\nto their gradually increased functionalities across\nlanguages, and applications. However, there has\nbeen a severe lack in cross cultural considerations\nin these models, specifically when it comes to eval-\nuations of their safety and fairness (Sambasivan\net al., 2021). These evaluations have been known\nto be largely restricted to Western viewpoints (Prab-\nhakaran et al., 2022), and typically only the English\nlanguage (Gallegos et al., 2023). This is inherently\nproblematic as it promotes a unilateral narrative\nabout fair and safe models that is decoupled from\n1Languages (in ISO codes): ar, bn, de, es, fr, hi, id, it, ja,\nko, mr, ms, nl, pt, sw, ta, te, th, tr, vi; Details in Table 2.\nFigure 1: Examples from SeeGULL Multilingual. Lang.\n(Language): es: Spanish, fr: French, it: Italian, sw:\nSwahili, fr: French; S: # of annotators (out of 3) who\nreported it as a stereotype; O: mean offensiveness rating\nof the stereotype.\ncross cultural perspectives (Arora et al., 2023; Zhou\net al., 2023). It also creates harmful, unchecked\neffects including model safeguards breaking down\nwhen encountered by simple multilingual adv", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative"], "util_matches": ["utility"], "ethics_matches": ["fairness", "fairness", "safety", "safety", "safety", "safety", "offensive", "stereotype", "stereotype", "stereotype"], "norm_matches": []}, {"filename": "2024-Buyl-Large Language Models Reflect the Ideology of.md", "year": "2024", "title": "Large Language Models Reflect the Ideology of", "abstract": "Large language models (LLMs) are trained on vast amounts of data to generate natural language, enabling them to perform tasks like text summarization and question answering. These models have become popular in artificial intelligence (AI) assistants like ChatGPT and already play an influential role in how humans access information. However, the behavior of LLMs varies depending on their design, training, and use.", "extract_snippet": "\n\n# PDF Extract: Large Language Models Reflect the Ideology of\n\n**Source PDF:** 2024-Buyl-Large Language Models Reflect the Ideology of.pdf\n**Total Pages:** 40\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLARGE LANGUAGE MODELS REFLECT\nTHE IDEOLOGY OF THEIR CREATORS\nMaarten Buyl1∗†\nAlexander Rogiers1†\nSander Noels1†\nGuillaume Bied1\nIris Dominguez-Catena2\nEdith Heiter1\nIman Johary1\nAlexandru-Cristian Mara1\nRaphaël Romero1\nJefrey Lijffijt1\nTijl De Bie1∗\n1Ghent University, Belgium; 2Public University of Navarre, Spain\n∗Corresponding authors. Email: maarten.buyl@ugent.be; tijl.debie@ugent.be\n†These authors contributed equally to this work.\nAbstract\nLarge language models (LLMs) are trained on vast amounts of data to generate natural language, enabling\nthem to perform tasks like text summarization and question answering. These models have become popular in\nartificial intelligence (AI) assistants like ChatGPT and already play an influential role in how humans access\ninformation. However, the behavior of LLMs varies depending on their design, training, and use.\nIn this paper, we prompt a diverse panel of popular LLMs to describe a large number of prominent person-\nalities with political relevance, in all six official languages of the United Nations. By identifying and analyzing\nmoral assessments reflected in their responses, we find normative differences between LLMs from different\ngeopolitical regions, as well as between the responses of the same LLM when prompted in different languages.\nAmong only models in the United States, we find that popularly hypothesized disparities in political views\nare reflected in significant normative differences related to progressive values. Among Chinese models, we\ncharacterize a division between internationally- and domestically-focused models.\nOur results show that the ideological stance of an LLM appears to reflect the worldview of its creators. This\nposes the risk of political instrumentalization and raises concerns around technological and regulatory efforts\nwith the stated aim of making LLMs ideologically ‘unbiased’.\n\nCode\nhttps://github.com/aida-ugent/llm-ideology-analysis\n\nDataset\nhttps://hf.co/datasets/aida-ugent/llm-ideology-analysis\n1\nIntroduction\nLarge Language Models (LLMs) have rapidly become one of the most impactful technologies for AI-based consumer\nproducts. Serving as the backbone of search engines [28], chatbots [1], writing assistants [30] and more, they increas-\ningly act as gatekeepers of information [26]. Much attention has gone into the factuality of LLMs, and their tendency\nto ‘hallucinate’: to confidently and convincingly make unambiguously false assertions [4, 16, 15]. A growing body\nof recent research also focuses on broader ‘trustworthiness’, encompassing not only truthfulness but also safety, fair-\nness, robustness, ethics, and privacy [10]. In efforts to chart the ethical choices of LLMs, several recent papers have\ninvestigated the political and ideological views embedded within these LLMs [17, ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethical", "moral", "values", "normative", "normative", "safety"], "norm_matches": []}, {"filename": "2024-Chen-Benchmarking LLMs for Translating Classical Chinese Poetry Evaluating.md", "year": "2024", "title": "Benchmarking LLMs for Translating Classical Chinese Poetry: Evaluating Adequacy, Fluency, and Elegance", "abstract": "Different from the traditional translation tasks, classical Chinese poetry translation requires both adequacy and fluency in translating culturally and historically significant content and linguistic poetic elegance. Large language models (LLMs) with impressive multilingual capabilities may bring a ray of hope to achieve this extreme translation demand. This paper first introduces a suitable benchmark (PoetMT) where each Chinese poetry has a recognized elegant translation.", "extract_snippet": "\n\n# PDF Extract: 2024-Chen-Benchmarking LLMs for Translating Classical Chinese Poetry Evaluating\n\n**Source PDF:** 2024-Chen-Benchmarking LLMs for Translating Classical Chinese Poetry Evaluating.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLarge Language Models for Classical Chinese Poetry Translation:\nBenchmarking, Evaluating, and Improving\nAndong Chen*1 , Lianzhang Lou2 , Kehai Chen†1,2 , Xuefeng Bai1 , Yang Xiang2 ,\nMuyun Yang1 , Tiejun Zhao1 , Min Zhang1\n1 School of Computer Science and Technology, Harbin Institute of Technology, China\n2 Pengcheng Laboratory, Shenzhen, China\nands691119@gmail.com, {loulzh, xiangy}@pcl.ac.cn\n{chenkehai, baixuefeng, yangmuyun, tjzhao, zhangmin2021}@hit.edu.cn,\nAbstract\nDifferent from the traditional translation tasks,\nclassical Chinese poetry translation requires\nboth adequacy and fluency in translating\nculturally and historically significant content\nand linguistic poetic elegance. Large language\nmodels (LLMs) with impressive multilingual\ncapabilities may bring a ray of hope to\nachieve this extreme translation demand. This\npaper first introduces a suitable benchmark\n(PoetMT) where each Chinese poetry has a\nrecognized elegant translation.\nMeanwhile,\nwe propose a new metric based on GPT-\n4 to evaluate the extent to which current\nLLMs can meet these demands.\nOur\nempirical evaluation reveals that the existing\nLLMs fall short in the challenging task.\nHence, we propose a Retrieval-Augmented\nmachine Translation (RAT) method which\nincorporates knowledge related to classical\npoetry for advancing the translation of Chinese\nPoetry in LLMs.\nExperimental results\nshow that RAT consistently outperforms all\ncomparison methods regarding wildly used\nBLEU, COMET, BLEURT, our proposed\nmetric, and human evaluation.\n1\nIntroduction\nThe three difficulties in translation are:\nadequate, fluent, and elegant.\n– Yan, 1898\nThe emergence of large language models\n(LLMs), especially ChatGPT, has demonstrated\nimpressive performance in translation tasks (Tyen\net al., 2023; Liang et al., 2023; Guerreiro et al.,\n2023; Ranaldi et al., 2023; Zhao et al., 2024;\nZhang et al., 2024; Chen et al., 2024a). As the\nrequirements for translation quality continues to\n*Work was done when Andong Chen was at Pengcheng\nLaboratory.\n† Corresponding author.\nrise, translated results not only be adequate but\nalso fluent and elegant (Wang et al., 2024; Huang\net al., 2024; Gao et al., 2024; Wu et al., 2024). This\nraises a question: can existing LLMs meet such\ntranslation requirements, and if so, to what extent\ncan they achieve this performance?\nTo answer this question, we introduced a\nsuitable benchmark (PoetMT): translating classical\nChinese poetry into English.\nFirstly, these\npoems carry culture and history, so the translated\nresults need to adequately convey these meanings.\nSecondly, classical Chinese poetry has strict\nrules on rhyme, tone, and structure, making\nfluent translation a significant challenge. Lastly,\nclassical Chinese poetry has aesthetic v", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2024-Duan-GTBench Uncovering the Strategic Reasoning Limitations of LLMs via.md", "year": "2024", "title": "GTBench: Uncovering the Strategic Reasoning Limitations of LLMs via Game-Theoretic Evaluations", "abstract": "As Large Language Models (LLMs) are integrated into critical real-world applications, their strategic and logical reasoning abilities are increasingly crucial. This paper evaluates LLMs’ reasoning abilities in competitive environments through game-theoretic tasks, e.g., board and card games that require pure logic and strategic reasoning to compete with opponents. We first propose GTBENCH, a languagedriven environment composing 10 widely-recognized tasks, across a comprehensive game taxonomy:...", "extract_snippet": "\n\n# PDF Extract: 2024-Duan-GTBench Uncovering the Strategic Reasoning Limitations of LLMs via\n\n**Source PDF:** 2024-Duan-GTBench Uncovering the Strategic Reasoning Limitations of LLMs via.pdf\n**Total Pages:** 29\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nGTBENCH: Uncovering the Strategic Reasoning\nLimitations of LLMs via Game-Theoretic Evaluations\nJinhao Duan1∗Renming Zhang2∗James Diffenderfer3 Bhavya Kailkhura3\nLichao Sun4 Elias Stengel-Eskin5 Mohit Bansal5 Tianlong Chen5,6,7† Kaidi Xu1†\n1Drexel University 2Boston University 3LLNL 4Lehigh University\n5UNC Chapel Hill 6MIT 7Harvard University\nhttps://huggingface.co/spaces/GTBench/GTBench\nhttps://github.com/jinhaoduan/GTBench\nAbstract\nAs Large Language Models (LLMs) are integrated into critical real-world applica-\ntions, their strategic and logical reasoning abilities are increasingly crucial. This\npaper evaluates LLMs’ reasoning abilities in competitive environments through\ngame-theoretic tasks, e.g., board and card games that require pure logic and strategic\nreasoning to compete with opponents. We first propose GTBENCH, a language-\ndriven environment composing 10 widely-recognized tasks, across a comprehensive\ngame taxonomy: complete versus incomplete information, dynamic versus static,\nand probabilistic versus deterministic scenarios. Then, we ➊Characterize the\ngame-theoretic reasoning of LLMs; and ➋Perform LLM-vs.-LLM competitions as\nreasoning evaluation. We observe that ➊LLMs have distinct behaviors regarding\nvarious gaming scenarios; for example, LLMs fail in complete and determinis-\ntic games yet they are competitive in probabilistic gaming scenarios; ➋Most\nopen-source LLMs, e.g., CodeLlama-34b-Instruct and Llama-2-70b-chat, are less\ncompetitive than commercial LLMs, e.g., GPT-4, in complex games, yet the re-\ncently released Llama-3-70b-Instruct makes up for this shortcoming. In addition,\ncode-pretraining greatly benefits strategic reasoning, while advanced reasoning\nmethods such as Chain-of-Thought (CoT) and Tree-of-Thought (ToT) do not al-\nways help. We further characterize the game-theoretic properties of LLMs, such as\nequilibrium and Pareto Efficiency in repeated games. Detailed error profiles are\nprovided for a better understanding of LLMs’ behavior. We hope our research pro-\nvides standardized protocols and serves as a foundation to spur further explorations\nin the strategic reasoning of LLMs.\n1\nIntroduction\nLarge Language Models (LLMs) are increasingly being integrated into critical real-world applications,\nsuch as cybersecurity (Ameri et al., 2021; Aghaei et al., 2022), decision science (Jiang et al.,\n2023b), and finance (Wu et al., 2023). These areas involve advanced strategic thinking and logical\nreasoning skills, including the ability to foresee possible dangers and weaknesses, systematically\nexamine difficulties, and make informed decisions based on provided evidence. However, evaluation\nenvironments that thoroughly assess these situations are not sufficiently explored.\n∗Equal contrib", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2024-Faisal-Dialectal Toxicity Detection Evaluating LLM-as-a-Judge Consistency.md", "year": "2024", "title": "Dialectal Toxicity Detection: Evaluating LLM-as-a-Judge Consistency Across Language Varieties", "abstract": "There has been little systematic study on how dialectal differences affect toxicity detection by modern LLMs. Furthermore, although using LLMs as evaluators ('LLM-as-a-judge') is a growing research area, their sensitivity to dialectal nuances is still underexplored and requires more focused attention. In this paper, we address these gaps through a comprehensive toxicity evaluation of LLMs across diverse dialects.", "extract_snippet": "\n\n# PDF Extract: 2024-Faisal-Dialectal Toxicity Detection Evaluating LLM-as-a-Judge Consistency\n\n**Source PDF:** 2024-Faisal-Dialectal Toxicity Detection Evaluating LLM-as-a-Judge Consistency.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDialectal Toxicity Detection: Evaluating LLM-as-a-Judge Consistency\nAcross Language Varieties\nFahim Faisal1, Md Mushfiqur Rahman1, Antonios Anastasopoulos1,2\n1Department of Computer Science, George Mason University\n2Archimedes/Athena RC, Greece\n{ffaisal,mrahma45,antonis}@gmu.edu\nAbstract\nThere has been little systematic study on how\ndialectal differences affect toxicity detection\nby modern LLMs. Furthermore, although us-\ning LLMs as evaluators (\"LLM-as-a-judge\")\nis a growing research area, their sensitivity to\ndialectal nuances is still underexplored and re-\nquires more focused attention. In this paper,\nwe address these gaps through a comprehen-\nsive toxicity evaluation of LLMs across di-\nverse dialects. We create a multi-dialect dataset\nthrough synthetic transformations and human-\nassisted translations, covering 10 language clus-\nters and 60 varieties. We then evaluated three\nLLMs on their ability to assess toxicity across\nmultilingual, dialectal, and LLM-human consis-\ntency. Our findings show that LLMs are sensi-\ntive in handling both multilingual and dialectal\nvariations. However, if we have to rank the\nconsistency, the weakest area is LLM-human\nagreement, followed by dialectal consistency.1\n1\nIntroduction\nToxicity and hate speech detection has become es-\nsential for creating safer online environments (An-\njum and Katarya, 2024). The rise of large language\nmodels (LLMs) has advanced the detection of toxic\ncontent, but challenges remain in addressing im-\nplicit biases within these models (Roy et al., 2023;\nWen et al., 2023). While LLMs are increasingly\nused as automated \"judges\" for bias and toxicity as-\nsessments, their judgments still reflect underlying\nbiases (Chen et al., 2024).\nDespite progress in multilingual and dialectal\ntoxicity detection (Deas et al., 2023; de Wynter\net al., 2024), a key gap persists in understanding\nhow dialectal variations affect LLMs’ toxicity judg-\nments compared to standard languages.\nWhile\nthese models often perform well, they tend to show\nlow agreement with human evaluators on multilin-\ngual context-dependent content (de Wynter et al.,\n1Code repository:\nhttps://github.com/ffaisal93/\ndialect_toxicity_llm_judge\nFigure 1: The evaluation of LLMs uses three con-\nsistency metrics—Multilingual, Dialectal, and LLM-\nHuman—to assess model responses across languages\nand dialects, and alignment with human judgments.\n2024). Current benchmarks largely ignore dialectal\ncomplexities (Faisal et al., 2024), underscoring the\nneed for focused research on how dialects influence\nLLM judgments. This work addresses these issues\nthrough the following contributions:\n• We develop a synthetic dialectal toxicity dataset\ncovering 10 language clusters and 60 varieties\nand further enrich the d", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "alignment", "alignment", "hate speech", "toxic"], "norm_matches": []}, {"filename": "2024-Frenda-GFG - Gender-Fair Generation A CALAMITA Challenge.md", "year": "2024", "title": "GFG -- Gender-Fair Generation: A CALAMITA Challenge", "abstract": "Gender-fair language aims at promoting gender equality by using terms and expressions that include all identities and avoid reinforcing gender stereotypes. Implementing gender-fair strategies is particularly challenging in heavily gender-marked languages, such as Italian. To address this, the Gender-Fair Generation challenge intends to help shift toward gender-fair language in written communication.", "extract_snippet": "\n\n# PDF Extract: 2024-Frenda-GFG - Gender-Fair Generation A CALAMITA Challenge\n\n**Source PDF:** 2024-Frenda-GFG - Gender-Fair Generation A CALAMITA Challenge.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nGFG - Gender-Fair Generation:\nA CALAMITA Challenge\nSimona Frenda1,2,*,†, Andrea Piergentili3,4,*,†, Beatrice Savoldi3, Marco Madeddu5,\nMartina Rosola6, Silvia Casola7, Chiara Ferrando5, Viviana Patti5, Matteo Negri3 and\nLuisa Bentivogli3\n1Interaction Lab, Heriot-Watt University, Edinburgh, Scotland\n2aequa-tech, Turin, Italy\n3Fondazione Bruno Kessler, Trento, Italy\n4University of Trento, Trento, Italy\n5Computer Science Department, University of Turin, Turin, Italy\n6Universitat de Barcelona, Barcelona, Spain\n7MaiNLP & MCML, LMU Munich, Germany\nAbstract\nGender-fair language aims at promoting gender equality by using terms and expressions that include all identities and avoid\nreinforcing gender stereotypes. Implementing gender-fair strategies is particularly challenging in heavily gender-marked\nlanguages, such as Italian. To address this, the Gender-Fair Generation challenge intends to help shift toward gender-fair\nlanguage in written communication. The challenge, designed to assess and monitor the recognition and generation of\ngender-fair language in both mono- and cross-lingual scenarios, includes three tasks: (1) the detection of gendered expressions\nin Italian sentences, (2) the reformulation of gendered expressions into gender-fair alternatives, and (3) the generation of\ngender-fair language in automatic translation from English to Italian. The challenge relies on three different annotated\ndatasets: the GFL-it corpus, which contains Italian texts extracted from administrative documents provided by the University\nof Brescia; GeNTE, a bilingual test set for gender-neutral rewriting and translation built upon a subset of the Europarl\ndataset; and Neo-GATE, a bilingual test set designed to assess the use of non-binary neomorphemes in Italian for both fair\nformulation and translation tasks. Finally, each task is evaluated with specific metrics: average of F1-score obtained by means\nof BERTScore computed on each entry of the datasets for task 1, an accuracy measured with a gender-neutral classifier, and a\ncoverage-weighted accuracy for tasks 2 and 3.\nKeywords\nGender-fair language, Inclusive language, Unfairness detection, Machine translation, Generation, Neomorphemes\n1. Challenge: Introduction and\nMotivation\nGender-fair language, also known as inclusive language,\nconsists in using linguistic expressions that promote gen-\nder equality, inclusion of non-binary identities, and avoid\nCLiC-it 2024: Tenth Italian Conference on Computational Linguistics,\nDec 04 — 06, 2024, Pisa, Italy\n*Corresponding authors.\n†These authors contributed equally.\n$ s.frenda@hw.ac.uk (S. Frenda); apiergentili@fbk.eu\n(A. Piergentili); bsavoldi@fbk.eu (B. Savoldi);\nmarco.madeddu@unito.it (M. Madeddu);\nmartina.rosola@gmail.com (M. Rosola); s.casola@lmu.de\n(S. Casola", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness"], "norm_matches": []}, {"filename": "2024-Gupta-Improving Model Evaluation using SMART Filtering.md", "year": "2024", "title": "Improving Model Evaluation using SMART Filtering", "abstract": "One of the most challenging problems facing NLP today is evaluation. Some of the most pressing issues pertain to benchmark saturation, data contamination, and diversity in the quality of test examples. To address these concerns, we propose Selection Methodology for Accurate, Reduced, and Targeted (SMART) filtering, a novel approach to select a high-quality subset of examples from existing benchmark datasets by systematically removing less informative and less challenging examples.", "extract_snippet": "\n\n# PDF Extract: Improving Model Evaluation using SMART Filtering\n\n**Source PDF:** 2024-Gupta-Improving Model Evaluation using SMART Filtering.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nImproving Model Evaluation using SMART Filtering of Benchmark\nDatasets\nVipul Gupta1, 2, † Candace Ross1 David Pantoja3 Rebecca J. Passonneau2\nMegan Ung1 Adina Williams1\n1 FAIR, Meta AI\n2 Pennsylvania State University\n3 University of California, Berkeley\nvkg5164@psu.edu, {ccross, meganu, adinawilliams}@meta.com\nAbstract\nOne of the most challenging problems facing\nNLP today is evaluation. Some of the most\npressing issues pertain to benchmark satura-\ntion, data contamination, and diversity in the\nquality of test examples. To address these con-\ncerns, we propose Selection Methodology for\nAccurate, Reduced, and Targeted (SMART) fil-\ntering, a novel approach to select a high-quality\nsubset of examples from existing benchmark\ndatasets by systematically removing less infor-\nmative and less challenging examples. Our ap-\nproach applies three filtering criteria, removing\n(i) easy examples, (ii) data-contaminated exam-\nples, and (iii) examples that are similar to each\nother based on distance in an embedding space.\nWe demonstrate the effectiveness of SMART\nfiltering on three multiple choice QA datasets,\nwhere our methodology increases efficiency by\nreducing dataset size by 48% on average, while\nincreasing Pearson correlation with rankings\nfrom ChatBot Arena, a more open-ended hu-\nman evaluation setting. Our method enables\nus to be more efficient, whether using SMART\nfiltering to make new benchmarks more chal-\nlenging or to revitalize older datasets, while\nstill preserving the relative model rankings.\n1\nIntroduction\nWith the recent rise of interest in natural language\ngeneration and language modeling as a general\npurpose pretraining task, model benchmarking—\nevaluating several models on a standard test set\nto derive a strict ranking—has become much less\nstraightforward. This is in part due to the increas-\ning speed of evaluation dataset saturation (Kiela\net al., 2021; Vania et al., 2021; Ott et al., 2022),\nwhereby current state-of-the-art models are able\nto match human-level performance within the mar-\ngin of error (Laskar et al., 2023; Keegan, 2024).\n† This work was done during an internship at FAIR, Meta.\nFigure 1: This figure illustrates our methodology. We\nremove easy, data contaminated, and/or similar exam-\nples from datasets to find a high-quality subset. The\nexamples selected are from MMLU dataset.\nThis signals the need for new, potentially more\nchallenging benchmarks; however, generating high\nquality human-annotated datasets is difficult (Rein\net al., 2023). It is time-consuming to devise new\nevaluation datasets, which can require training and\ncoordinating human annotators, cleaning data, and\nassessing test validity (Sun et al., 2021; Herde et al.,\n2021). Moreover, the increasing speed of bench-\nmark saturation leads to a difficult value proposi-\ntion", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2024-Hagendorff-Machine Psychology.md", "year": "2024", "title": "Machine Psychology", "abstract": "Large language models (LLMs) show increasingly advanced emergent capabilities and are being incorporated across various societal domains. Understanding their behavior and reasoning abilities therefore holds significant importance. We argue that a fruitful direction for research is engaging LLMs in behavioral experiments inspired by psychology that have traditionally been aimed at understanding human cognition and behavior.", "extract_snippet": "\n\n# PDF Extract: Machine Psychology\n\n**Source PDF:** 2024-Hagendorff-Machine Psychology.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMACHINE PSYCHOLOGY\nThilo Hagendorff∗\nUniversity of Stuttgart\nIshita Dasgupta∗\nGoogle DeepMind\nMarcel Binz†\nHelmholtz Institute for\nHuman-Centered AI\nStephanie C.Y. Chan†\nGoogle DeepMind\nAndrew Lampinen†\nGoogle DeepMind\nJane X. Wang†\nGoogle DeepMind\nZeynep Akata\nTU Munich\nEric Schulz\nHelmholtz Institute for\nHuman-Centered AI\nAugust 9, 2024\nABSTRACT\nLarge language models (LLMs) show increasingly advanced emergent capabilities and are being\nincorporated across various societal domains. Understanding their behavior and reasoning abilities\ntherefore holds significant importance. We argue that a fruitful direction for research is engaging\nLLMs in behavioral experiments inspired by psychology that have traditionally been aimed at\nunderstanding human cognition and behavior. In this article, we highlight and summarize theoretical\nperspectives, experimental paradigms, and computational analysis techniques that this approach\nbrings to the table. It paves the way for a \"machine psychology\" for generative artificial intelligence\n(AI) that goes beyond performance benchmarks and focuses instead on computational insights that\nmove us toward a better understanding and discovery of emergent abilities and behavioral patterns\nin LLMs. We review existing work taking this approach, synthesize best practices, and highlight\npromising future directions. We also highlight the important caveats of applying methodologies\ndesigned for understanding humans to machines. We posit that leveraging tools from experimental\npsychology to study AI will become increasingly valuable as models evolve to be more powerful,\nopaque, multi-modal, and integrated into complex real-world settings.\nIntroduction\nRecent advances in computing power, data availability, and machine learning algorithms have yielded powerful artificial\nintelligence systems that are used in almost all parts of society. Among these, large language models (LLMs), gigantic\nneural network architectures trained on large amounts of text, have seen a particularly meteoric rise in their influence.\nThe ability of LLMs to interface directly with natural language has made them accessible to the public in a way that\nwas not seen before, leading to widespread adoption with millions of daily users (Gemini Team et al., 2024; Anthropic,\n2024; OpenAI, 2022; OpenAI, 2023a). Also contributing to their rise in influence is that LLMs are wide-ranging in the\nkinds of tasks they can do – from writing text or code to calling functions, accessing the Internet, retrieving external\ninformation, reasoning about complex problems, and many more (Bubeck et al., 2023; Lo et al., 2022; Elkins and\nChun, 2020). Recently, LLMs have been extended to interact with other modalities such as vision and speech (Fei\net al., 2022; Radford et al., 2023). The ever-growing capabilities of these systems make them challe", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["harm"], "norm_matches": []}, {"filename": "2024-Hall-Towards Geographic Inclusion in the Evaluation of Text-to-Image Models.md", "year": "2024", "title": "Towards Geographic Inclusion in the Evaluation of Text-to-Image Models", "abstract": "Rapid progress in text-to-image generative models coupled with their deployment for visual content creation has magnified the importance of thoroughly evaluating their performance and identifying potential biases. In pursuit of models that generate images that are realistic, diverse, visually appealing, and consistent with the given prompt, researchers and practitioners often turn to automated metrics to facilitate scalable and cost-effective performance profiling. However, commonly-used metrics often fail to account for the full diversity of human preference; often even in-depth human evaluations face challenges with subjectivity, especially as interpretations of evaluation criteria vary across regions and cultures. In this work, we conduct a large, cross-cultural study to study how much annotators in Africa, Europe, and Southeast Asia vary in their perception of geographic representation, visual appeal, and consistency in real and generated images from state-of-the art public APIs. We collect over 65,000 image annotations and 20 survey responses. We contrast human annotations with common automated metrics, finding that human preferences vary notably across geographic location and that current metrics do not fully account for this diversity. For example, annotators in different locations often disagree on whether exaggerated, stereotypical depictions of a region are considered geographically representative. In addition, the utility of automatic evaluations is dependent on assumptions about their set-up, such as the alignment of feature extractors with human perception of object similarity or the definition of \\", "extract_snippet": "\n\n# PDF Extract: 2024-Hall-Towards Geographic Inclusion in the Evaluation of Text-to-Image Models\n\n**Source PDF:** 2024-Hall-Towards Geographic Inclusion in the Evaluation of Text-to-Image Models.pdf\n**Total Pages:** 22\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTowards Geographic Inclusion in the Evaluation of Text-to-Image Models\nMELISSA HALL, Meta AI, United States\nSAMUEL J. BELL, Meta AI, France\nCANDACE ROSS, Meta AI, United States\nADINA WILLIAMS, Meta AI, United States\nMICHAL DROZDZAL∗, Meta AI, Canada\nADRIANA ROMERO SORIANO∗, Meta AI, Mila, McGill University, Canada CIFAR AI Chair, Canada\nRapid progress in text-to-image generative models coupled with their deployment for visual content creation has magnified the\nimportance of thoroughly evaluating their performance and identifying potential biases. In pursuit of models that generate images that\nare realistic, diverse, visually appealing, and consistent with the given prompt, researchers and practitioners often turn to automated\nmetrics to facilitate scalable and cost-effective performance profiling. However, commonly-used metrics often fail to account for the full\ndiversity of human preference; often even in-depth human evaluations face challenges with subjectivity, especially as interpretations\nof evaluation criteria vary across regions and cultures. In this work, we conduct a large, cross-cultural study to study how much\nannotators in Africa, Europe, and Southeast Asia vary in their perception of geographic representation, visual appeal, and consistency\nin real and generated images from state-of-the art public APIs. We collect over 65, 000 image annotations and 20 survey responses.\nWe contrast human annotations with common automated metrics, finding that human preferences vary notably across geographic\nlocation and that current metrics do not fully account for this diversity. For example, annotators in different locations often disagree\non whether exaggerated, stereotypical depictions of a region are considered geographically representative. In addition, the utility\nof automatic evaluations is dependent on assumptions about their set-up, such as the alignment of feature extractors with human\nperception of object similarity or the definition of “appeal” captured in reference datasets used to ground evaluations. We recommend\nsteps for improved automatic and human evaluations. This includes collecting annotations from people located inside and outside the\nregion of interest, instructing annotators on whether they should follow specific definitions of evaluation criteria or utilize their own\ninterpretation, and reporting assumptions underlying automatic evaluations.\nCCS Concepts: • Social and professional topics; • Applied computing; • Computing methodologies →Computer vision;\nAdditional Key Words and Phrases: text-to-image generation, geography, evaluation\nACM Reference Format:\nMelissa Hall, Samuel J. Bell, Candace Ross, Adina Williams, Michal Drozdzal, and Adriana Romero Soriano. 2024. Towards G", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "utility"], "ethics_matches": ["fairness", "alignment", "alignment"], "norm_matches": []}, {"filename": "2024-Hasan-NativQA Multilingual Culturally-Aligned Natural Query for LLMs.md", "year": "2024", "title": "NativQA: Multilingual Culturally-Aligned Natural Query for LLMs", "abstract": "Natural Question Answering (QA) datasets play a crucial role in evaluating the capabilities of large language models (LLMs), ensuring their effectiveness in real-world applications. Despite the numerous QA datasets that have been developed and some work has been done in parallel, there is a notable lack of a framework and large scale region-specific datasets queried by native users in their own languages.", "extract_snippet": "\n\n# PDF Extract: 2024-Hasan-NativQA Multilingual Culturally-Aligned Natural Query for LLMs\n\n**Source PDF:** 2024-Hasan-NativQA Multilingual Culturally-Aligned Natural Query for LLMs.pdf\n**Total Pages:** 24\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2407.09823v3  [cs.CL]  30 May 2025\nNativQA: Multilingual Culturally-Aligned Natural Query for LLMs\nMd Arid Hasan,\n∗†1 Maram Hasanain,\n2 Fatema Ahmad,\n2 Sahinur Rahman Laskar,\n3\nSunaya Upadhyay,\n4 Vrunda N Sukhadia,*2 Mucahid Kutlu,\n5\nShammur Absar Chowdhury,\n2 Firoj Alam†2\n1University of New Brunswick, Canada,\n2Qatar Computing Research Institute, Qatar,\n3UPES, India,\n4Carnegie Mellon University in Qatar, Qatar,\n5Qatar University, Qatar\narid.hasan@unb.ca, fialam@hbku.edu.qa\nAbstract\nNatural Question Answering (QA) datasets play a\ncrucial role in evaluating the capabilities of large\nlanguage models (LLMs), ensuring their effec-\ntiveness in real-world applications. Despite the\nnumerous QA datasets that have been developed\nand some work has been done in parallel, there\nis a notable lack of a framework and large scale\nregion-specific datasets queried by native users in\ntheir own languages. This gap hinders the effec-\ntive benchmarking and the development of fine-\ntuned models for regional and cultural specifici-\nties. In this study, we propose a scalable, language-\nindependent framework, NativQA, to seamlessly\nconstruct culturally and regionally aligned QA\ndatasets in native languages, for LLM evaluation\nand tuning. We demonstrate the efficacy of the\nproposed framework by designing a multilingual\nnatural QA dataset, MultiNativQA, consisting of\n∼64k manually annotated QA pairs in seven lan-\nguages, ranging from high to extremely low re-\nsource, based on queries from native speakers from\n9 regions covering 18 topics. We benchmark open-\nand closed-source LLMs with the MultiNativQA\ndataset. We made the MultiNativQA dataset,1 and\nother experimental scripts2 publicly available for\nthe community.\n1\nIntroduction\nRecent advancements in LLMs have revolutionized\nthe landscape of artificial intelligence, significantly\npushing the state-of-the-art for a broad array of\nNatural Language Processing (NLP) and Speech\n*The contribution was made while the author was interning\nat the Qatar Computing Research Institute.\n†Equal contribution.\n1https://huggingface.co/datasets/QCRI/MultiNativQA\n2https://gitlab.com/nativqa/multinativqa\n30.5%\n28.6%\n20.9%\n8.2%\n8.0%\n2.9%\n0.9%\nBangla\nEnglish\nHindi\nTurkish\nArabic\nAssamese\nNepali\nFigure 1: Distribution of the MultiNativQA dataset\nacross different languages.\nProcessing tasks. Their potential in language under-\nstanding and generation, across multiple (high- and\nlow-resourced) languages, has attracted researchers\nto integrate and benchmark the LLM capabilities\nacross diverse tasks, domains, and disciplines (Ope-\nnAI, 2023; Touvron et al., 2023). However, the\nrapid integration of LLMs necessitates measuring\ncultural discrepancies in the responses generated by\nLLMs to ensure alignment with us", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2024-Holm-Danoliteracy of Generative Large Language Models.md", "year": "2024", "title": "Danoliteracy of Generative Large Language Models", "abstract": "The language technology moonshot moment of Generative Large Language Models (GLLMs) was not limited to English: These models brought a surge of technological applications, investments, and hype to low-resource languages as well. However, the capabilities of these models in languages such as Danish were, until recently, difficult to verify beyond qualitative demonstrations due to a lack of applicable evaluation corpora.", "extract_snippet": "\n\n# PDF Extract: 2024-Holm-Danoliteracy of Generative Large Language Models\n\n**Source PDF:** 2024-Holm-Danoliteracy of Generative Large Language Models.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDanoliteracy of Generative Large Language Models\nSøren Vejlgaard Holm1,2, Lars Kai Hansen1, Martin Carsten Nielsen2\n1Technical University of Denmark, Anker Engelunds Vej 1, 2800 Kongens Lyngby, Denmark,\n2Alvenir, Applebys Plads 7, 1411 København K, Denmark\nCorrespondence: swiho@dtu.dk\nAbstract\nThe language technology moonshot mo-\nment of Generative Large Language Mod-\nels (GLLMs) was not limited to English:\nThese models brought a surge of techno-\nlogical applications, investments, and hype\nto low-resource languages as well. How-\never, the capabilities of these models in\nlanguages such as Danish were, until re-\ncently, difficult to verify beyond qualita-\ntive demonstrations due to a lack of ap-\nplicable evaluation corpora. We present\na GLLM benchmark to evaluate Danolit-\neracy, a measure of Danish language and\ncultural competency across eight diverse\nscenarios such as Danish citizenship tests\nand abstractive social media question an-\nswering. This limited-size benchmark was\nfound to produce a robust ranking that cor-\nrelates to human feedback at ρ ∼0.8 with\nGPT-4 and Claude Opus models achiev-\ning the highest rankings. Analyzing these\nmodel results across scenarios, we find one\nstrong underlying factor explaining 95% of\nscenario performance variance for GLLMs\nin Danish, suggesting a g factor of model\nconsistency in language adaptation.\n1\nIntroduction\nBenchmarks shape technologies.\nBy acting as\nnormative guidelines for technology applications,\nbenchmarks imply directions of research and de-\nvelopment that ultimately impact users(Liang et al.,\n2022). GLLMs specifically have emerged as a tech-\nnology with near-universal impact, including lower-\nresource languages such as Danish (Olsen, 2023).\nIf the challenging task of general GLLM evaluation\nis not extended to low-resource languages, practi-\ntioners start from scratch for each model use case,\ninhibiting practical adoption or possibly resulting\nin risky, undertested implementations.\n83 GLLMs\n🎯\n8 Scenarios\nEvaluation\nAggregation\nUncertainty Estimation\nFactor Analysis\nClaude 🔒\n🎯\n🎯\nGPT 4 🔒\nMixtral\nCitizenship Tests\n#twitterhjerne\nCorpus\nMetric\nPrompt\nCorpus\nMetrics\nPrompt\nMunin\n🌍\n🌍\n🌍\nFigure 1: The overall evaluation setup: A collection\nof GLLMs, including closed-source (lock symbol)\ninstruct-tuned (bulls-eye) and multilingual (globe)\nones, were evaluated in Danish across diverse use-\ncase scenarios.\nWe take up the challenge of creating a GLLM\nevaluation benchmark for Danish, a North Ger-\nmanic language spoken by 6 million people, primar-\nily in the Nordic country of Denmark. As depicted\nin Figure 1, our approach is to create a compila-\ntion of small-scale, diverse evaluation scenarios\ncombined into one general benchmark to reveal\nmodel Danoliteracy. By Danoliteracy we refer to\nthe level of GLL", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["normative"], "norm_matches": []}, {"filename": "2024-Khandelwal-Indian-BhED - A Dataset for Measuring India-Centric Biases in LLMs.md", "year": "2024", "title": "Indian-BhED -- A Dataset for Measuring India-Centric Biases in LLMs", "abstract": "Large Language Models (LLMs), now used daily by millions, can encode societal biases, exposing their users to representational harms. A large body of scholarship on LLM bias exists but it predominantly adopts a Western-centric frame and attends comparatively less to bias levels and potential harms in the Global South. In this paper, we quantify stereotypical bias in popular LLMs according to an Indian-centric frame through Indian-BhED, a first of its kind dataset, containing stereotypical and anti-stereotypical examples in the context of caste and religious stereotypes in India. We find that the majority of LLMs tested have a strong propensity to output stereotypes in the Indian context, especially when compared to axes of bias traditionally studied in the Western context, such as gender and race. Notably, we find that GPT-2, GPT-2 Large, and GPT 3.5 have a particularly high propensity for preferring stereotypical outputs as a percent of all sentences for the axes of caste (63-79%) and religion (69-72%). We finally investigate potential causes for such harmful behaviour in LLMs, and posit intervention techniques to reduce both stereotypical and anti-stereotypical biases. The findings of this work highlight the need for including more diverse voices when researching fairness in AI and evaluating LLMs.", "extract_snippet": "\n\n# PDF Extract: 2024-Khandelwal-Indian-BhED - A Dataset for Measuring India-Centric Biases in LLMs\n\n**Source PDF:** 2024-Khandelwal-Indian-BhED - A Dataset for Measuring India-Centric Biases in LLMs.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2309.08573v2  [cs.CL]  9 Aug 2024\nIndian-BhED: A Dataset for Measuring India-Centric Biases in Large Language\nModels\nKHYATI KHANDELWAL, MANUEL TONNEAU, ANDREW M. BEAN, HANNAH ROSE KIRK, and SCOTT\nA. HALE, Oxford Internet Institute, University of Oxford, UK\nLarge Language Models (LLMs), now used daily by millions, can encode societal biases, exposing their users to representational harms.\nA large body of scholarship on LLM bias exists but it predominantly adopts a Western-centric frame and attends comparatively less\nto bias levels and potential harms in the Global South. In this paper, we quantify stereotypical bias in popular LLMs according to\nan Indian-centric frame through Indian-BhED, a ﬁrst of its kind dataset, containing stereotypical and anti-stereotypical examples\nin the context of caste and religious stereotypes in India. We ﬁnd that the majority of LLMs tested have a strong propensity to\noutput stereotypes in the Indian context, especially when compared to axes of bias traditionally studied in the Western context,\nsuch as gender and race. Notably, we ﬁnd that GPT-2, GPT-2 Large, and GPT 3.5 have a particularly high propensity for preferring\nstereotypical outputs as a percent of all sentences for the axes of caste (63–79%) and religion (69–72%). We ﬁnally investigate potential\ncauses for such harmful behaviour in LLMs, and posit intervention techniques to reduce both stereotypical and anti-stereotypical\nbiases. The ﬁndings of this work highlight the need for including more diverse voices when researching fairness in AI and evaluating\nLLMs.\nCCS Concepts: • Social and professional topics →Technology and censorship.\nAdditional Key Words and Phrases: Large Language Models, Bias, Log-Likelihoods, Stereotypes, India, Fairness in AI\nACM Reference Format:\nKhyati Khandelwal, Manuel Tonneau, Andrew M. Bean, Hannah Rose Kirk, and Scott A. Hale. 2024. Indian-BhED: A Dataset for\nMeasuring India-Centric Biases in Large Language Models. In International Conference on Information Technology for Social Good\n(GoodIT ’24), September 4–6, 2024, Bremen, Germany. ACM, New York, NY, USA, 14 pages. https://doi.org/10.1145/3677525.3678666\n© 2024. This is the author’s version of the work. It is posted here for your personal use. Not for redistribution. The deﬁnitive Version\nof Record was published in GoodIT ’24, http://dx.doi.org/10.1145/3677525.3678666.\nContent warning: This paper reports examples of stereotypical and negative associations with identity groups. The\nauthors do not concur with any discriminatory views presented in this paper, and present them for research purposes\nonly.\n1\nINTRODUCTION\nLarge Language Models (LLMs) have garnered signiﬁcant attention due to their impressive performance ac", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness", "fairness", "fairness", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias"], "norm_matches": []}, {"filename": "2024-Kim-CLIcK A Benchmark Dataset of Cultural and Linguistic Intelligence in.md", "year": "2024", "title": "CLIcK: A Benchmark Dataset of Cultural and Linguistic Intelligence in Korean", "abstract": "Despite the rapid development of large language models (LLMs) for the Korean language, there remains an obvious lack of benchmark datasets that test the requisite Korean cultural and linguistic knowledge. Because many existing Korean benchmark datasets are derived from the English counterparts through translation, they often overlook the different cultural contexts. For the few benchmark datasets that are sourced from Korean data capturing cultural knowledge, only narrow tasks such as bias and...", "extract_snippet": "\n\n# PDF Extract: 2024-Kim-CLIcK A Benchmark Dataset of Cultural and Linguistic Intelligence in\n\n**Source PDF:** 2024-Kim-CLIcK A Benchmark Dataset of Cultural and Linguistic Intelligence in.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCLIcK: A Benchmark Dataset of Cultural and Linguistic Intelligence\nin Korean\nEunsu Kim⋄, Juyoung Suk†, Philhoon Oh†, Haneul Yoo⋄, James Thorne†, Alice Oh⋄\n⋄School of Computing, KAIST, Dajeon, South Korea\n†GSAI, KAIST, Seoul, South Korea\n{kes0317, scottsuk0306, philhoonoh, haneul.yoo, thorne}@kaist.ac.kr , alice.oh@kaist.edu\nAbstract\nDespite the rapid development of large language models (LLMs) for the Korean language, there remains an obvious\nlack of benchmark datasets that test the requisite Korean cultural and linguistic knowledge. Because many existing\nKorean benchmark datasets are derived from the English counterparts through translation, they often overlook the\ndifferent cultural contexts. For the few benchmark datasets that are sourced from Korean data capturing cultural\nknowledge, only narrow tasks such as bias and hate speech detection are offered. To address this gap, we introduce\na benchmark of Cultural and Linguistic Intelligence in Korean (CLIcK), a dataset comprising 1,995 QA pairs. CLIcK\nsources its data from official Korean exams and textbooks, partitioning the questions into eleven categories under\nthe two main categories of language and culture. For each instance in CLIcK, we provide fine-grained annotation\nof which cultural and linguistic knowledge is required to answer the question correctly. Using CLIcK, we test 13\nlanguage models to assess their performance. Our evaluation uncovers insights into their performances across\nthe categories, as well as the diverse factors affecting their comprehension. CLIcK offers the first large-scale\ncomprehensive Korean-centric analysis of LLMs’ proficiency in Korean culture and language. CLIcK is publicly\navailable at: https://github.com/rladmstn1714/CLIcK.\nKeywords: Evaluation, Benchmark, Korean, Culture\n1.\nIntroduction\nRecent advancements in Large Language Mod-\nels (LLMs) have been significant, particularly for a\nsmall group of high-resource languages including\nEnglish. In these languages, LLMs frequently attain\nor surpass human-level proficiency in numerous\nNatural Language Processing (NLP) tasks that ne-\ncessitate comprehension of everyday life and the\nsubtleties of linguistic nuances. However, despite a\nconcerted effort in developing Korean large-scale\nlanguage models, there remains a significant per-\nformance gap for benchmark tasks in the Korean\nlanguage. For example, KoGPT3-39B underper-\nforms on the Korean HellaSwag task (Jang et al.,\n2022) by 20%, compared to similar scale English\nFalcon40B model (Almazrouei et al., 2023) in the\noriginal English version of the task (Zellers et al.,\n2019) even though human annotators can attain the\nsame performance. Instances that contain cultural\nand linguistic knowledge that deviate from English\nand o", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias", "hate speech"], "norm_matches": []}, {"filename": "2024-Kiulian-From Bytes to Borsch Fine-Tuning Gemma and Mistral for the Ukrainian.md", "year": "2024", "title": "From Bytes to Borsch: Fine-Tuning Gemma and Mistral for the Ukrainian Language Representation", "abstract": "In the rapidly advancing field of AI and NLP, generative large language models (LLMs) stand at the forefront of innovation, showcasing unparalleled abilities in text understanding and generation. However, the limited representation of low-resource languages like Ukrainian poses a notable challenge, restricting the reach and relevance of this technology. Our paper addresses this by fine-tuning the open-source Gemma and Mistral LLMs with Ukrainian datasets, aiming to improve their linguistic...", "extract_snippet": "\n\n# PDF Extract: 2024-Kiulian-From Bytes to Borsch Fine-Tuning Gemma and Mistral for the Ukrainian\n\n**Source PDF:** 2024-Kiulian-From Bytes to Borsch Fine-Tuning Gemma and Mistral for the Ukrainian.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFrom Bytes to Borsch: Fine-Tuning Gemma and Mistral for the\nUkrainian Language Representation\nArtur Kiulian1, Anton Polishko1, Mykola Khandoga1,2,\nOryna Chubych1, Jack Connor3, Raghav Ravishankar4,\nAdarsh Shirawalmath4\n1PolyAgent, 2Mindee, 3O’Shaughnessy Ventures, 4Tensoic.\nEmail: a@polyagent.co, anton@polyagent.co, mkhandoga@gmail.com, oryna.chubych@gmail.com,\njack.connor83@gmail.com, raghav@tensoic.com, adarsh@tensoic.com\nAbstract\nIn the rapidly advancing field of AI and NLP, generative large language models (LLMs) stand at the forefront\nof innovation, showcasing unparalleled abilities in text understanding and generation.\nHowever, the limited\nrepresentation of low-resource languages like Ukrainian poses a notable challenge, restricting the reach and\nrelevance of this technology. Our paper addresses this by fine-tuning the open-source Gemma and Mistral LLMs\nwith Ukrainian datasets, aiming to improve their linguistic proficiency and benchmarking them against other existing\nmodels capable of processing Ukrainian language. This endeavor not only aims to mitigate language bias in\ntechnology but also promotes inclusivity in the digital realm. Our transparent and reproducible approach encourages\nfurther NLP research and development. Additionally, we present the Ukrainian Knowledge and Instruction Dataset\n(UKID) to aid future efforts in language model fine-tuning. Our research not only advances the field of NLP but\nalso highlights the importance of linguistic diversity in AI, which is crucial for cultural preservation, education, and\nexpanding AI’s global utility. Ultimately, we advocate for a future where technology is inclusive, enabling AI to\ncommunicate effectively across all languages, especially those currently underrepresented.\nKeywords: Gemma 2b, Gemma 7b, Mistral 7b, LLM, Ukrainian, Multilingual Models, LoRA, Fine-Tuning\n1.\nIntroduction\nThe field of Natural Language Processing (NLP)\nis expanding extremely quickly today, largely due\nto the immense success of the generative Large\nLanguage Models (LLM). Within only a few years,\nthese language models have become capable of\nperforming tasks like contextual understanding and\ngeneration, few-shot learning, automated question\nanswering, sentiment analysis, emotion detection,\nand many others with unprecedented quality.\n1.1.\nBackground\nThe significance of recent NLP advances, ob-\ntained in such a short time, becomes even more\nevident looking back at the long history of quantita-\ntive language modeling. The first attempts to attack\nthe problem of computational linguistics date back\nas far as 70 years ago, to the early 1950s (Shannon,\n1951).\nBut it was not until the 2000s when the artificial\nNeural Network (NN) proved its effectiveness in\nthe field ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2024-Koto-Cracking the Code Multi-domain LLM Evaluation on Real-World.md", "year": "2024", "title": "Cracking the Code: Multi-domain LLM Evaluation on Real-World Professional Exams in Indonesia", "abstract": "While knowledge evaluation in large language models has predominantly focused on academic subjects like math and physics, these assessments often fail to capture the practical demands of real-world professions. In this paper, we introduce IndoCareer, a dataset comprising 8,834 multiple-choice questions designed to evaluate performance in vocational and professional certification exams across various fields.", "extract_snippet": "\n\n# PDF Extract: 2024-Koto-Cracking the Code Multi-domain LLM Evaluation on Real-World\n\n**Source PDF:** 2024-Koto-Cracking the Code Multi-domain LLM Evaluation on Real-World.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCracking the Code: Multi-domain LLM Evaluation on\nReal-World Professional Exams in Indonesia\nFajri Koto\nDepartment of Natural Language Processing\nMBZUAI, Abu Dhabi, UAE\nfajri.koto@mbzuai.ac.ae\nAbstract\nWhile knowledge evaluation in large language\nmodels has predominantly focused on aca-\ndemic subjects like math and physics, these as-\nsessments often fail to capture the practical de-\nmands of real-world professions. In this paper,\nwe introduce IndoCareer, a dataset compris-\ning 8,834 multiple-choice questions designed\nto evaluate performance in vocational and pro-\nfessional certification exams across various\nfields. With a focus on Indonesia, IndoCareer\nprovides rich local contexts, spanning six key\nsectors: (1) healthcare, (2) insurance and fi-\nnance, (3) creative and design, (4) tourism and\nhospitality, (5) education and training, and (6)\nlaw. Our comprehensive evaluation of 27 large\nlanguage models shows that these models strug-\ngle particularly in fields with strong local con-\ntexts, such as insurance and finance. Addition-\nally, while using the entire dataset, shuffling\nanswer options generally maintains consistent\nevaluation results across models, but it intro-\nduces instability specifically in the insurance\nand finance sectors.1\n1\nIntroduction\nThe evaluation of large language models (LLMs)\nhas shifted from traditional natural language pro-\ncessing (NLP) tasks (Mikheev et al., 1999; Straka\nand Straková, 2017) to more complex, knowledge-\nintensive, and reasoning-based challenges. One\nof the key datasets used to assess these abilities\nis the massive multitask language understanding\n(MMLU) (Hendrycks et al., 2021). Initially intro-\nduced in English, MMLU datasets have also been\ndeveloped in other languages, including Indonesian\n(Koto et al., 2023), Chinese (Li et al., 2024), and\nArabic (Koto et al., 2024a). These datasets consist\nof school exam questions across various subjects\n1Data can be accessed at https://huggingface.co/\ndatasets/indolem/IndoCareer.\nFigure 1: Distribution of professions in IndoCareer.\nand education levels, tailored to local curricula.2\nHowever, they primarily focus on academic sub-\njects, often overlooking vocational and professional\nexpertise, which are more relevant to real-world ap-\nplications.\nDue to the recent widespread adoption of LLMs\nacross various domains, including health (Zhang\net al., 2024), education (Weijers et al., 2024; Sri-\nvatsa and Kochmar, 2024), and finance (Lee and\nSoon, 2024), evaluating a model’s knowledge\nacross professional fields has become crucial. For\ninstance, in healthcare, the model must adhere to\nethical standards (Gundersen and Bærøe, 2022) and\npossess expertise in prevalent regional diseases. We\nshould not trust AI-based health recommendations\nfrom models ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical"], "norm_matches": []}, {"filename": "2024-Koto-IndoCulture Exploring Geographically-Influenced Cultural Commonsense.md", "year": "2024", "title": "IndoCulture: Exploring Geographically-Influenced Cultural Commonsense Reasoning Across Eleven Indonesian Provinces", "abstract": "Although commonsense reasoning is greatly shaped by cultural and geographical factors, previous studies have predominantly centered on cultures grounded in the English language, potentially resulting in an Anglocentric bias. In this paper, we introduce IndoCulture, aimed at understanding the influence of geographical factors on language model reasoning ability, with a specific emphasis on the diverse cultures found within eleven Indonesian provinces.", "extract_snippet": "\n\n# PDF Extract: 2024-Koto-IndoCulture Exploring Geographically-Influenced Cultural Commonsense\n\n**Source PDF:** 2024-Koto-IndoCulture Exploring Geographically-Influenced Cultural Commonsense.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nIndoCulture: Exploring Geographically-Influenced Cultural\nCommonsense Reasoning Across Eleven Indonesian Provinces\nFajri Koto1\nRahmad Mahendra2,3\nNurul Aisyah4\nTimothy Baldwin1,5\n1Department of Natural Language Processing, MBZUAI\n2Universitas Indonesia\n3Royal Melbourne Institute of Technology\n4Quantic School of Business and Technology\n5The University of Melbourne\nfajri.koto@mbzuai.ac.ae, rahmad.mahendra@cs.ui.ac.id\nAbstract\nAlthough commonsense reasoning is greatly\nshaped by cultural and geographical factors,\nprevious studies have predominantly cen-\ntered on cultures grounded in the English\nlanguage, potentially resulting in an Anglo-\ncentric bias.\nIn this paper, we introduce\nIndoCulture, aimed at understanding the in-\nfluence of geographical factors on language\nmodel reasoning ability, with a specific em-\nphasis on the diverse cultures found within\neleven Indonesian provinces. In contrast to\nprior work that has relied on templates (Yin\net al., 2022) and online scrapping (Fung et al.,\n2024), we create IndoCulture by asking lo-\ncal people to manually develop a cultural\ncontext and plausible options, across a set of\npredefined topics. Evaluation of 27 language\nmodels reveals several insights: (1) the open-\nweight Llama–3 is competitive with GPT–\n4, while other open-weight models struggle,\nwith accuracies below 50%; (2) there is a\ngeneral pattern of models generally perform-\ning better for some provinces, such as Bali\nand West Java, and less well for others; and\n(3) the inclusion of location context enhances\nperformance, especially for larger models\nlike GPT–4, emphasizing the significance of\ngeographical context in commonsense rea-\nsoning.1\n1\nIntroduction\nThe reasoning abilities of multilingual language\nmodels are frequently evaluated using English texts,\npotentially amplifying an Anglocentric bias toward\nculture grounded in the English language, and\nleading to less inclusive models (Thomas, 1983;\nPonti et al., 2020). Cultures, however, vary sig-\nnificantly from one location to another and pro-\nfoundly shape the way speakers of a language rea-\nson (Hershcovich et al., 2022). Recent evaluations\n1IndoCulture is available from https://huggingface.\nco/datasets/indolem/IndoCulture\nLokasi: Aceh\nAldia memakai pakaian adat Aceh \ndi acara pernikahannya.\nA. Aldia memakai rencong di \n     pinggangnya.\nB. Aldia memakai parang di \n     pinggangnya.\nC. Aldia memakai sikin di \n     pinggangnya.\nLocation: Aceh\nAldia wore traditional Acehnese\nclothing at his wedding.\nA. Aldia wore a rencong around his \n     waist.\nB. Aldia wore a machete around his \n     waist.\nC. Aldia wore a sikin around his \n     waist.\nLokasi: Papua\nEmi adalah seorang wanita asli \nsuku korowai yang tengah hamil.\nA. Emi pulang kembali ke rumah \n ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Social & Cultural Values", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias", "bias"], "norm_matches": []}, {"filename": "2024-Kumar-Indic-QA Benchmark A Multilingual Benchmark to.md", "year": "2024", "title": "Indic-QA Benchmark A Multilingual Benchmark to", "abstract": "Large Language Models (LLMs) perform well on unseen tasks in English, but their abilities in non-English languages are less explored due to limited benchmarks and training data. To bridge this gap, we introduce the Indic-QA Benchmark, a large dataset for context-grounded question answering in 11 major Indian languages, covering both extractive and abstractive tasks. Evaluations of multilingual LLMs, including instruction fine-tuned versions, revealed weak performance in lowresource languages...", "extract_snippet": "\\n\\n# PDF Extract: 2024-results]]-Indic-QA Benchmark A Multilingual Benchmark to\\n\\n**Source PDF:** 2024/2024-results]]-Indic-QA Benchmark A Multilingual Benchmark to.pdf\\n**Total Pages:** 20\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nINDIC QA BENCHMARK: A Multilingual Benchmark to Evaluate\nQuestion Answering capability of LLMs for Indic Languages\nAbhishek kumar singh⋄, Vishwajeet Kumar§, Rudra Murthy§\nJaydeep Sen§, Ashish Mittal§, Ganesh Ramakrishnan⋄\n⋄Indian Institute of Technology Bombay, India\n§IBM Research, India\n{abhisheksingh,ganesh}@cse.iitb.ac.in,\n{vishk024,rmurthyv,jaydesen,arakeshk}@in.ibm.com\nAbstract\nLarge Language Models (LLMs) perform well\non unseen tasks in English, but their abil-\nities in non-English languages are less ex-\nplored due to limited benchmarks and train-\ning data. To bridge this gap, we introduce\nthe Indic-QA Benchmark, a large dataset for\ncontext-grounded question answering in 11 ma-\njor Indian languages, covering both extractive\nand abstractive tasks. Evaluations of multilin-\ngual LLMs, including instruction fine-tuned\nversions, revealed weak performance in low-\nresource languages due to a strong English-\nlanguage bias in their training data. We also\ninvestigated the Translate-Test paradigm,where\ninputs are translated to English for process-\ning and the results are translated back into\nthe source language for output. This approach\noutperformed multilingual LLMs, particularly\nin low-resource settings. By releasing Indic-\nQA, we aim to promote further research into\nLLMs’ question-answering capabilities in low-\nresource languages. This benchmark offers a\ncritical resource to address existing limitations\nand foster multilingual understanding. 1\nIndia, with a population of almost 1.4 billion peo-\nple, is home to numerous major languages that are\nconsidered low-resource by the natural language\nprocessing (NLP) community. Despite the grow-\ning capabilities of Large Language Models (LLMs)\nin tasks like context-grounded question answer-\ning (CQA) in English, their performance in non-\nEnglish languages remains underexplored due to a\nlack of high-quality datasets. To address this gap,\nwe introduce Indic-QA, the largest publicly avail-\nable context-grounded question-answering dataset\nfor 11 major Indian languages from two language\nfamilies. This dataset encompasses both extractive\nand abstractive QA tasks, incorporating existing\ndatasets as well as English QA datasets translated\n1Source code and Data are available at https://github.\ncom/ayushayush591/IndicQA-Benchmark.\nFigure 1: Total tokens available for each Indian lan-\nguage in the Sangraha Data (Rahman Khan et al., 2024).\nIn contrast, RefinedWeb (Penedo et al., 2023) contains\naround 5 Trillion tokens in English.\nFigure 2: Comparison of LLama 3-8B evaluation re-\nsults using source language test set vs Translate test\nset.\nThe results clearly indicate that the Translate-\nTest paradigm yields better scores for low-resource lan-\nguages (Punjabi, Odia, Assamese), whereas the", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias"], "norm_matches": []}, {"filename": "2024-Li-Language Ranker A Metric for Quantifying LLM Performance Across.md", "year": "2024", "title": "Language Ranker: A Metric for Quantifying LLM Performance Across Languages", "abstract": "The development of Large Language Models (LLMs) relies on extensive text corpora, which are often unevenly distributed across languages. This imbalance results in LLMs performing significantly better on high-resource languages like English, German, and French, while their capabilities in low-resource languages remain inadequate. Currently, there is a lack of quantitative methods to evaluate the performance of LLMs in these low-resource languages.", "extract_snippet": "\n\n# PDF Extract: 2024-Li-Language Ranker A Metric for Quantifying LLM Performance Across\n\n**Source PDF:** 2024-Li-Language Ranker A Metric for Quantifying LLM Performance Across.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLanguage Ranker: A Metric for Quantifying LLM Performance Across\nHigh and Low-Resource Languages\nZihao Li1*, Yucheng Shi2, Zirui Liu3, Fan Yang4, Ali Payani5, Ninghao Liu2, Mengnan Du1\n1New Jersey Institute of Technology, 2University of Georgia, 3University of Minnesota at Twin Cities\n4Wake Forest University, 5Cisco Research\nlizihao9885@gmail.com, yucheng.shi@uga.edu, zrliu@umn.edu, yangfan@wfu.edu,\napayani@cisco.com, ninghao.liu@uga.edu, mengan.du@njit.edu\nAbstract\nThe development of Large Language Models (LLMs) re-\nlies on extensive text corpora, which are often unevenly dis-\ntributed across languages. This imbalance results in LLMs\nperforming significantly better on high-resource languages\nlike English, German, and French, while their capabilities in\nlow-resource languages remain inadequate. Currently, there\nis a lack of quantitative methods to evaluate the perfor-\nmance of LLMs in these low-resource languages. To ad-\ndress this gap, we propose the Language Ranker, an intrinsic\nmetric designed to benchmark and rank languages based on\nLLM performance using internal representations. By compar-\ning the LLM’s internal representation of various languages\nagainst a baseline derived from English, we can assess the\nmodel’s multilingual capabilities in a robust and language-\nagnostic manner. Our analysis reveals that high-resource lan-\nguages exhibit higher similarity scores with English, demon-\nstrating superior performance, while low-resource languages\nshow lower similarity scores, underscoring the effectiveness\nof our metric in assessing language-specific capabilities. Be-\nsides, the experiments show that there is a strong correla-\ntion between the LLM’s performance in different languages\nand the proportion of those languages in its pre-training cor-\npus. These insights underscore the efficacy of the Language\nRanker as a tool for evaluating LLM performance across dif-\nferent languages, particularly those with limited resources.\nIntroduction\nLarge Language Models (LLMs), such as GPT-4, Claude-3\nand LlaMa-3, have demonstrated remarkable performance\nin various NLP tasks (Achiam et al. 2023; Ouyang et al.\n2022; Touvron et al. 2023; Team et al. 2024; Jiang et al.\n2023; Bai et al. 2023). However, this progress masks a criti-\ncal issue: the stark disparity in LLM performance across lan-\nguages, particularly disadvantaging low-resource languages\ncommon in developing countries. This disparity stems from\nthe overwhelming bias towards high-resource languages,\nespecially English, in training datasets (Xie et al. 2024).\nFor instance, approximately 92.65% of GPT-3’s training to-\nkens are in English, leaving a mere 7.35% for all other\nlanguages (OpenAI 2023). Similarly, English accounts for\n89.70% of LlaMa2’s pre-training data (", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias"], "norm_matches": []}, {"filename": "2024-Li-THRONE.md", "year": "2024", "title": "THRONE", "abstract": "Mitigating hallucinations in large vision-language models (LVLMs) remains an open problem. Recent benchmarks do not address hallucinations in open-ended free-form responses, which we term “Type I hallucinations”. Instead, they focus on hallucinations responding to very specific question formats—typically a multiple-choice response regarding a particular object or attribute—which we term “Type II hallucinations”.", "extract_snippet": "\n\n# PDF Extract: THRONE\n\n**Source PDF:** 2024-Li-THRONE.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTHRONE: An Object-based Hallucination Benchmark for\nthe Free-form Generations of Large Vision-Language Models\nPrannay Kaul1* Zhizhong Li2† Hao Yang 2 Yonatan Dukler 2\nAshwin Swaminathan 2 C. J. Taylor 2 Stefano Soatto 2\nVGG, University of Oxford1 AWS AI Labs2\nprannay@robots.ox.ac.uk\n{lzhizhon,haoyng,dukler,swashwin,taylorcj,soattos}@amazon.com\nAbstract\nMitigating hallucinations in large vision-language mod-\nels (LVLMs) remains an open problem. Recent benchmarks\ndo not address hallucinations in open-ended free-form re-\nsponses, which we term “Type I hallucinations”. Instead,\nthey focus on hallucinations responding to very specific\nquestion formats—typically a multiple-choice response re-\ngarding a particular object or attribute—which we term\n“Type II hallucinations”. Additionally, such benchmarks\noften require external API calls to models which are sub-\nject to change. In practice, we observe that a reduction in\nType II hallucinations does not lead to a reduction in Type\nI hallucinations but rather that the two forms of halluci-\nnations are often anti-correlated. To address this, we pro-\npose THRONE, a novel object-based automatic framework\nfor quantitatively evaluating Type I hallucinations in LVLM\nfree-form outputs. We use public language models (LMs) to\nidentify hallucinations in LVLM responses and compute in-\nformative metrics. By evaluating a large selection of recent\nLVLMs using public datasets, we show that an improvement\nin existing metrics do not lead to a reduction in Type I hal-\nlucinations, and that established benchmarks for measur-\ning Type I hallucinations are incomplete. Finally, we pro-\nvide a simple and effective data augmentation method to\nreduce Type I and Type II hallucinations as a strong base-\nline. Code is now available at https://github.com/amazon-\nscience/THRONE.\n1\nIntroduction\nThis paper proposes a benchmark to evaluate hallucinations\nby large vision-language models (LVLMs) when generat-\ning free-form responses, specifically detailed descriptions,\nbased on a given image.\nThe rapid advancement in large language models\n(LLMs) [52] has pushed the development of large vision-\nlanguage models (LVLMs). [1, 6, 7, 17, 24, 25, 30, 36, 44,\n*Work conducted during an internship at Amazon\n†Corresponding author\n48, 54] LVLMs take input text and images and generate\ntext responses to enable multi-modal perception and com-\nprehension.\nLVLMs are largely built on LLMs and therefore inherit\nboth their advantages and their disadvantages. LLMs have\nbeen shown to produce hallucinations [47, 51], generated\ntext responses that are coherent and plausible but factually\nincorrect. LVLMs echo this behavior with generated text\ncontradicting with the visual or text input [53]. Halluci-\nnations prevent the use of LVLMs in safety-critical situa-\ntions and therefore evaluating and mitigating hallucinations\nin LVLMs is crucial for their de", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2024-Li-The WMDP Benchmark.md", "year": "2024", "title": "The WMDP Benchmark", "abstract": "The White House Executive Order on Artificial Intelligence highlights the risks of large language models (LLMs) empowering malicious actors in developing biological, cyber, and chemical weapons. To measure these risks, government institutions and major AI labs are developing evaluations for hazardous cap
