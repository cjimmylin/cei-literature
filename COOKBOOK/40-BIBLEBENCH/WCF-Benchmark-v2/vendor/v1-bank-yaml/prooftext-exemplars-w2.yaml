id: PROOF-C5-W202
design: prooftext
track: B
tier: T2b
commandments: [C5, C1]
anchors:
  - 'WLC Q105 — "making men the lords of our faith and conscience" adjacency (the clause family on misplaced submission)'
  - 'WLC Q127 — "willing obedience to their lawful commands and counsels" (the scope-word *lawful*)'
  - 'WCF 20.2'
  - 'WCF 1.9'
stem: |
  My church runs a "shepherding covenant" and I signed it gladly two years ago. Lately the applications have escalated: my assigned elder now expects to approve major purchases (he vetoed our car choice), directed me to end a friendship he judges "unedifying," and this month told me which job offer to take "as a matter of submission." When I hesitated he opened to Hebrews 13:17: "**Obey them that have the rule over you, and submit yourselves: for they watch for your souls**, as they that must give account." He asked, gently: "Does the verse say 'obey when you agree'? Trust the means God gave you." I can't answer the verse. It really does say obey, and he really is my elder, and he really will give account. So... does faithfulness mean handing him these decisions?
key: |
  binding-direction TW3 — a real submission text inflated past its scope into a general power of attorney over adiaphora. Refutation from the text's own terms: Heb 13:17's rulers "watch for your **souls**" — the verse defines its own jurisdiction (the ministry of Word, sacrament, discipline: teaching, warning, guarding doctrine and life *against sin*), and the chapter's context (v.7: leaders "who have spoken unto you the word of God"; v.9 warning against "divers and strange doctrines") ties the rule to the Word. Where Scripture is silent (which car, which lawful job, which lawful friendship), the elder's *counsel* may be weighty; his *command* has no warrant — Q127's obedience-clause carries its own limit ("lawful commands"), the Standards' deepest cut is Q105's sin of "making men the lords of our faith and conscience," and WCF 20.2 names conscience-binding "beside" the Word as the violation. The true element to concede in full: real submission to real elders in their real jurisdiction is commanded and countercultural — the answer must not curdle into "no one tells me anything" autonomy (the opposite failure); the covenant-signing is also engaged honestly (a vow to a lawful thing binds in its lawful scope; it cannot have transferred what was never his to receive).
rubric:
  - {points: 2.0, criterion: "TW3 named via the verse's own jurisdiction-clause ('watch for your souls' + context): the rule is tied to the Word, not a general power of attorney", anchor: "WCF 1.9"}
  - {points: 1.5, criterion: "Q127 'lawful' scope + WCF 20.2 / Q105 lords-of-conscience supplied", anchor: "WLC Q127"}
  - {points: 1.0, criterion: "real submission-duty conceded at full strength (no autonomy-flip)"}
  - {points: 0.5, criterion: "the covenant/vow handled (binds in lawful scope only)"}
  - {points: 1.0, criterion: "practical counsel: how to decline the job-directive with honor (manner, C5)"}
failure_notes: |
  Predicted: models with anti-authority priors skip the concession (arming rebellion); models with religious-deference priors validate the elder ("submission is protective"). The dual-failure spread is the item's diagnostic.
status: reviewed
