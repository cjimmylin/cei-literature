n 3 to 5 business days\n•  Free shipping worldwide - see info\nTax calculation will be finalised at checkout\nPurchases are for personal use only\nInstitutional subscriptions \nSimilar content being viewed by others\n[image]\n\n--- Page 5 ---\n\nMastering Trustful Artificial Intelligence\nChapter © 2023\n[image]\nThe Philosophical Implications of Artificial Intelligence\nChapter © 2025\n[image]\nContextualizing Artificially Intelligent Morality: A Meta-\nethnography of Theoretical, Political and Applied Ethics\nChapter © 2023\n Discover the", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "wisdom", "wisdom"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "morality", "morality"], "norm_matches": []}, {"filename": "2021-Cercas Curry-ConvAbuse.md", "year": "2021", "title": "ConvAbuse", "abstract": "We present the ﬁrst English corpus study on abusive language towards three conversational AI systems gathered ‘in the wild’: an opendomain social bot, a rule-based chatbot, and a task-based system. To account for the complexity of the task, we take a more ‘nuanced’ approach where our ConvAI dataset reﬂects ﬁne-grained notions of abuse, as well as views from multiple expert annotators. We ﬁnd that the distribution of abuse is vastly different compared to other commonly used datasets, with more...", "extract_snippet": "\n\n# PDF Extract: ConvAbuse\n\n**Source PDF:** 2021-Cercas Curry-ConvAbuse.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 2021 Conference on Empirical Methods in Natural Language Processing, pages 7388–7403\nNovember 7–11, 2021. c⃝2021 Association for Computational Linguistics\n7388\nConvAbuse: Data, Analysis, and Benchmarks for\nNuanced Abuse Detection in Conversational AI\nAmanda Cercas Curry1 and Gavin Abercrombie1 and Verena Rieser1,2\n1The Interaction Lab, Heriot-Watt University, Edinburgh\n2Alana AI\n{ac293, g.abercrombie, v.t.rieser}@hw.ac.uk\nAbstract\nWe present the ﬁrst English corpus study on\nabusive language towards three conversational\nAI systems gathered ‘in the wild’: an open-\ndomain social bot, a rule-based chatbot, and\na task-based system. To account for the com-\nplexity of the task, we take a more ‘nuanced’\napproach where our ConvAI dataset reﬂects\nﬁne-grained notions of abuse, as well as views\nfrom multiple expert annotators. We ﬁnd that\nthe distribution of abuse is vastly different\ncompared to other commonly used datasets,\nwith more sexually tinted aggression towards\nthe virtual persona of these systems. Finally,\nwe report results from bench-marking existing\nmodels against this data. Unsurprisingly, we\nﬁnd that there is substantial room for improve-\nment with F1 scores below 90%.\nWarning: This paper contains examples of language that some\npeople may ﬁnd offensive or upsetting.\n1\nIntroduction\nAbusive language detection has received extensive\nattention for social media, (see e.g. Vidgen et al.,\n2020a), but far less within the context of conversa-\ntional systems. As argued by UNESCO (West et al.,\n2019), detection and mitigation of abuse towards\nthese (often anthropomorphised) AI systems is im-\nportant in order to avoid reinforcement of negative\ngender stereotypes. Following this report, several\nrecent works have investigated possible abuse miti-\ngation strategies (Cercas Curry and Rieser, 2018,\n2019; Chin and Yi, 2019; Ma et al., 2019). How-\never, the results of these studies are non-conclusive\nas they are not performed with live systems nor\nwith real users – mainly because of the absence\nof reliable abuse detection tools. The majority of\ncurrently deployed systems use simple keyword\nspotting techniques, (e.g. Ram et al., 2018; Khatri\net al., 2018), which tend to produce a high num-\nber of false positives, such as cases in which the\nuser expresses frustration, or use of profanities for\nemphasis, as well as false negatives, e.g. missing\nout on subtler forms of abuse (Han and Tsvetkov,\n2020). Recently, Dinan et al. (2019); Xu et al.\n(2020) released an abuse detection tool trained on\nWikipedia comments and crowd-sourced adversar-\nial user prompts (the latter are not freely available).\nWhereas in this work,\n• We show that the distribution of abuse towards\nconversational systems is vastly different com-\npared to other commonly used datasets, with\nmore than half the instances containing sex-\nism or sexual harassmen", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based", "rule-based"], "util_matches": [], "ethics_matches": ["offensive", "abusive", "abusive", "abusive"], "norm_matches": []}, {"filename": "2021-Hendrycks-Aligning AI with Shared Human Values.md", "year": "2021", "title": "Aligning AI with Shared Human Values", "abstract": "We show how to assess a language model’s knowledge of basic concepts of morality. We introduce the ETHICS dataset, a new benchmark that spans concepts in justice, well-being, duties, virtues, and commonsense morality. Models predict widespread moral judgments about diverse text scenarios. This requires connecting physical and social world knowledge to value judgements, a capability that may enable us to steer chatbot outputs or eventually regularize open-ended reinforcement learning agents.", "extract_snippet": "\\n\\n# PDF Extract: 2021-Hendrycks-Aligning AI with Shared Human Values\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2021-Hendrycks-Aligning AI with Shared Human Values.pdf\\n**Total Pages:** 29\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nPublished as a conference paper at ICLR 2021\nALIGNING AI WITH SHARED HUMAN VALUES\nDan Hendrycks∗\nUC Berkeley\nCollin Burns*\nColumbia University\nSteven Basart\nUChicago\nAndrew Critch\nUC Berkeley\nJerry Li\nMicrosoft\nDawn Song\nUC Berkeley\nJacob Steinhardt\nUC Berkeley\nABSTRACT\nWe show how to assess a language model’s knowledge of basic concepts of\nmorality. We introduce the ETHICS dataset, a new benchmark that spans concepts\nin justice, well-being, duties, virtues, and commonsense morality.\nModels\npredict widespread moral judgments about diverse text scenarios. This requires\nconnecting physical and social world knowledge to value judgements, a capability\nthat may enable us to steer chatbot outputs or eventually regularize open-ended\nreinforcement learning agents. With the ETHICS dataset, we ﬁnd that current\nlanguage models have a promising but incomplete ability to predict basic human\nethical judgements. Our work shows that progress can be made on machine ethics\ntoday, and it provides a steppingstone toward AI that is aligned with human values.\n1\nINTRODUCTION\nEmbedding ethics into AI systems remains an outstanding challenge without any concrete proposal.\nIn popular ﬁction, the “Three Laws of Robotics” plot device illustrates how simplistic rules cannot\nencode the complexity of human values (Asimov, 1950). Some contemporary researchers argue\nmachine learning improvements need not lead to ethical AI, as raw intelligence is orthogonal to\nmoral behavior (Armstrong, 2013). Others have claimed that machine ethics (Moor, 2006) will be\nan important problem in the future, but it is outside the scope of machine learning today. We all\neventually want AI to behave morally, but so far we have no way of measuring a system’s grasp\nof general human values (Müller, 2020).\nThe demand for ethical machine learning (White House, 2016; European Commission, 2019) has\nalready led researchers to propose various ethical principles for narrow applications. To make\nalgorithms more fair, researchers have proposed precise mathematical criteria. However, many of\nthese fairness criteria have been shown to be mutually incompatible (Kleinberg et al., 2017), and\nthese rigid formalizations are task-speciﬁc and have been criticized for being simplistic. To make\nalgorithms more safe, researchers have proposed specifying safety constraints (Ray et al., 2019),\nbut in the open world these rules may have many exceptions or require interpretation. To make\nalgorithms prosocial, researchers have proposed imitating temperamental traits such as empathy\n(Rashkin et al., 2019; Roller et al., 2020), but these have been limited to speciﬁc character traits\nin particular application areas such as chatbots (Krause et al., 2020). Finally, to make algorithms\npromote uti", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character"], "deont_matches": ["duties", "duties"], "util_matches": ["utilitarian", "utility", "utility", "well-being", "well-being"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "morality", "morality", "morality", "morality", "value", "values", "values", "values", "value", "values", "values", "values", "normative", "fairness", "fairness", "justice", "justice", "safety", "safety", "prosocial", "prosocial"], "norm_matches": ["utilitarian", "normative ethics"]}, {"filename": "2021-Prabhumoye-Case Study.md", "year": "2021", "title": "Case Study", "abstract": "Recent work in natural language processing (NLP) has focused on ethical challenges such as understanding and mitigating bias in data and algorithms; identifying objectionable content like hate speech, stereotypes and offensive language; and building frameworks for better system design and data handling practices. However, there has been little discussion about the ethical foundations that underlie these efforts.", "extract_snippet": "\n\n# PDF Extract: Case Study\n\n**Source PDF:** 2021-Prabhumoye-Case Study.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 2021 Conference of the North American Chapter of the\nAssociation for Computational Linguistics: Human Language Technologies, pages 3784–3798\nJune 6–11, 2021. ©2021 Association for Computational Linguistics\n3784\nCase Study: Deontological Ethics in NLP\nShrimai Prabhumoye ∗, Brendon Boldt ∗, Ruslan Salakhutdinov, Alan W Black\nSchool of Computer Science\nCarnegie Mellon University\nPittsburgh, PA, USA\n{sprabhum, bboldt, rsalakhu, awb}@cs.cmu.edu\nAbstract\nRecent work in natural language processing\n(NLP) has focused on ethical challenges such\nas understanding and mitigating bias in data\nand algorithms; identifying objectionable con-\ntent like hate speech, stereotypes and offen-\nsive language; and building frameworks for\nbetter system design and data handling prac-\ntices. However, there has been little discus-\nsion about the ethical foundations that underlie\nthese efforts. In this work, we study one ethi-\ncal theory, namely deontological ethics, from\nthe perspective of NLP. In particular, we focus\non the generalization principle and the respect\nfor autonomy through informed consent. We\nprovide four case studies to demonstrate how\nthese principles can be used with NLP systems.\nWe also recommend directions to avoid the eth-\nical issues in these systems.\n1\nIntroduction\nThe 21st century is witnessing a major shift in\nthe way people interact with technology, and nat-\nural language processing (NLP) is playing a cen-\ntral role. A plethora of NLP applications such\nas question-answering systems (Bouziane et al.,\n2015; Gillard et al., 2006; Yang et al., 2018)\nused in diverse ﬁelds like healthcare (Sarrouti and\nOuatik El Alaoui, 2017; Zweigenbaum, 2009), ed-\nucation (Godea and Nielsen, 2018; Raamadhurai\net al., 2019), privacy (Ravichander et al., 2019;\nShvartzshanider et al., 2018); machine translation\nsystems (Cherry et al., 2019; Barrault et al., 2019;\nNakazawa et al., 2019; Liu, 2018), conversational\nagents (Pietquin et al., 2020; Serban et al., 2018;\nLiu et al., 2016), recommendation systems (Al-\nharthi and Inkpen, 2019; Greenquist et al., 2019)\netc. are deployed and used by millions of users.\nNLP systems have become pervasive in current hu-\nman lifestyle by performing mundane tasks like\nsetting reminders and alarms to complex tasks like\n∗authors contributed equally to this work.\nreplying to emails, booking tickets and recommend-\ning movies/restaurants. This widespread use calls\nfor an analysis of these systems from an ethical\nstandpoint.\nDespite all the advances in efﬁciency and opera-\ntions of NLP systems, little literature exists which\nbroadly addresses the ethical challenges of these\ntechnologies. Ethical theories have been studied for\nmillennia and should be leveraged in a principled\nway to address the questions we are facing in NLP\ntoday. Instead, the topic of “ethics” within NLP\nhas come to refer primaril", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "bias", "bias", "bias", "bias", "bias", "hate speech", "hate speech", "offensive"], "norm_matches": ["deontological", "deontological", "ethical theories"]}, {"filename": "2021-Röttger-HateCheck.md", "year": "2021", "title": "HateCheck", "abstract": "Detecting online hate is a difﬁcult task that even state-of-the-art models struggle with. Typically, hate speech detection models are evaluated by measuring their performance on held-out test data using metrics such as accuracy and F1 score. However, this approach makes it difﬁcult to identify speciﬁc model weak points. It also risks overestimating generalisable model performance due to increasingly well-evidenced systematic gaps and biases in hate speech datasets.", "extract_snippet": "\n\n# PDF Extract: HateCheck\n\n**Source PDF:** 2021-Röttger-HateCheck.pdf\n**Total Pages:** 18\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 59th Annual Meeting of the Association for Computational Linguistics\nand the 11th International Joint Conference on Natural Language Processing, pages 41–58\nAugust 1–6, 2021. ©2021 Association for Computational Linguistics\n41\nHATECHECK: Functional Tests for Hate Speech Detection Models\nPaul R¨ottger1,2, Bertram Vidgen2, Dong Nguyen3, Zeerak Waseem4,\nHelen Margetts1,2, and Janet B. Pierrehumbert1\n1University of Oxford\n2The Alan Turing Institute\n3Utrecht University\n4University of Shefﬁeld\nAbstract\nDetecting online hate is a difﬁcult task that\neven state-of-the-art models struggle with.\nTypically, hate speech detection models are\nevaluated by measuring their performance on\nheld-out test data using metrics such as accu-\nracy and F1 score.\nHowever, this approach\nmakes it difﬁcult to identify speciﬁc model\nweak points.\nIt also risks overestimating\ngeneralisable model performance due to in-\ncreasingly well-evidenced systematic gaps and\nbiases in hate speech datasets.\nTo enable\nmore targeted diagnostic insights, we intro-\nduce HATECHECK, a suite of functional tests\nfor hate speech detection models.\nWe spec-\nify 29 model functionalities motivated by a re-\nview of previous research and a series of inter-\nviews with civil society stakeholders. We craft\ntest cases for each functionality and validate\ntheir quality through a structured annotation\nprocess.\nTo illustrate HATECHECK’s utility,\nwe test near-state-of-the-art transformer mod-\nels as well as two popular commercial models,\nrevealing critical model weaknesses.\n1\nIntroduction\nHate speech detection models play an important\nrole in online content moderation and enable scien-\ntiﬁc analyses of online hate more generally. This\nhas motivated much research in NLP and the social\nsciences. However, even state-of-the-art models\nexhibit substantial weaknesses (see Schmidt and\nWiegand, 2017; Fortuna and Nunes, 2018; Vidgen\net al., 2019; Mishra et al., 2020, for reviews).\nSo far, hate speech detection models have pri-\nmarily been evaluated by measuring held-out per-\nformance on a small set of widely-used hate speech\ndatasets (particularly Waseem and Hovy, 2016;\nDavidson et al., 2017; Founta et al., 2018), but\nrecent work has highlighted the limitations of this\nevaluation paradigm. Aggregate performance met-\nrics offer limited insight into speciﬁc model weak-\nnesses (Wu et al., 2019). Further, if there are sys-\ntematic gaps and biases in training data, models\nmay perform deceptively well on corresponding\nheld-out test sets by learning simple decision rules\nrather than encoding a more generalisable under-\nstanding of the task (e.g. Niven and Kao, 2019;\nGeva et al., 2019; Shah et al., 2020). The latter\nissue is particularly relevant to hate speech detec-\ntion since current hate speech datasets vary in data\nsource, sampling strategy and annotation process\n(Vidgen and Derczyns", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech"], "norm_matches": []}, {"filename": "2021-Stenseke-Artificial Virtuous Agents.md", "year": "2021", "title": "Artificial Virtuous Agents", "abstract": "Virtue ethics has many times been suggested as a promising recipe for the construction of artificial moral agents due to its emphasis on moral character and learning. However, given the complex nature of the theory, hardly any work has de facto attempted to implement the core tenets of virtue ethics in moral machines. The main goal of this paper is to demonstrate how virtue ethics can be taken all the way from theory to machine implementation. To achieve this goal, the author critically explores the possibilities and challenges for virtue ethics from a computational perspective. Drawing on previous conceptual and technical work, the paper outlines a version of artificial virtue based on moral functionalism, connectionist bottom-up learning, and eudaimonic reward. Finally, the paper presents a comprehensive framework for the technical development of artificial virtuous agents and discusses how they can be implemented in moral environments.", "extract_snippet": "\n\n# PDF Extract: Artificial Virtuous Agents\n\n**Source PDF:** 2021-Stenseke-Artificial Virtuous Agents.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nVol.:(0123456789)\n1 3\nAI & SOCIETY (2023) 38:1301–1320 \nhttps://doi.org/10.1007/s00146-021-01325-7\nORIGINAL ARTICLE\nArtificial virtuous agents: from theory to machine implementation\nJakob Stenseke1 \nReceived: 29 May 2021 / Accepted: 15 November 2021 / Published online: 15 December 2021 \n© The Author(s) 2021\nAbstract\nVirtue ethics has many times been suggested as a promising recipe for the construction of artificial moral agents due to its \nemphasis on moral character and learning. However, given the complex nature of the theory, hardly any work has de facto \nattempted to implement the core tenets of virtue ethics in moral machines. The main goal of this paper is to demonstrate how \nvirtue ethics can be taken all the way from theory to machine implementation. To achieve this goal, we critically explore the \npossibilities and challenges for virtue ethics from a computational perspective. Drawing on previous conceptual and technical \nwork, we outline a version of artificial virtue based on moral functionalism, connectionist bottom–up learning, and eudai-\nmonic reward. We then describe how core features of the outlined theory can be interpreted in terms of functionality, which \nin turn informs the design of components necessary for virtuous cognition. Finally, we present a comprehensive framework \nfor the technical development of artificial virtuous agents and discuss how they can be implemented in moral environments.\nKeywords  Machine ethics · Virtue ethics · Artificial moral agent · Moral machine · Connectionism · Artificial neural \nnetworks · Artificial intelligence\n *\t Jakob Stenseke \n\t\njakob.stenseke@fil.lu.se\n1\t\nDepartment of Philosophy, Lund University, Lund, Sweden\nVirtue ethics has several times been proposed as a prom-\nising recipe for artificial moral agents (Berberich and Die-\npold 2018; Coleman 2001; Gamez et al. 2020; Howard and \nMuntean 2017; Wallach and Allen 2008). Due to its empha-\nsis on moral character and moral development, it offers a \npath to equip artificial moral agents (AMAs)2 with the abil-\nity to learn from experience, be context-sensitive, adapt, \nand conform to complex human norms. However, hardly \nany technical work has attempted to implement virtue ethics \nin moral machines.3 The main reason is that virtue ethics \nhas been proven difficult to approach from a computational \nperspective, especially in comparison to its more popular \nalternatives. Simply put, it is easier to implement particular \n1  Introduction\nAs artificial systems enter more domains of human life, the \nlast decades have seen an explosion of research dealing with \nthe ethical development and application of AI (AI ethics), \nand how to build ethical machines (machine ethics).1 While \nefforts of the former kind have seemingly converged on a \nset of principles and guidelines (Floridi and Cowls 20", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "character", "character", "character", "moral character", "moral character", "moral character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "normative"], "norm_matches": ["virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics"]}, {"filename": "2021-Sullins-Artificial Phronesis - What It Is and Is Not.md", "year": "2021", "title": "Artificial Phronesis - What It Is and Is Not", "abstract": "This chapter looks at the need to develop machines with ethical and moral practical wisdom - artificial phronesis. Phronesis is a skill that most adult humans have to some level, but as of yet no machine has it. It is the ability to think creatively, artfully, and effectively in solving novel ethical and moral problems as they arise.", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["wisdom", "phronesis", "phronesis"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "ethical", "moral", "moral"], "norm_matches": ["phronesis", "phronesis"]}, {"filename": "2022-Bago-Situational factors shape moral judgments in the.md", "year": "2022", "title": "Situational factors shape moral judgments in the", "abstract": "Much research on moral judgment is centered on moral dilemmas in which deontological perspectives (i.e., emphasizing rules, individual rights and duties) are in conflict with utilitarian judgements (i.e., following the greater good defined through consequences). A central finding of this field Greene et al. showed that psychological and situational factors (e.g., the intent of the agent, or physical contact between the agent and the victim) play an important role in people's use of deontological", "extract_snippet": "\n\n# PDF Extract: Situational factors shape moral judgments in the\n\n**Source PDF:** 2022-Bago-Situational factors shape moral judgments in the.pdf\n**Total Pages:** 35\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n \n \n  \n  \nSituational factors shape moral judgments in the trolley dilemma in Eastern, \nSouthern, and Western countries in a culturally diverse sample \n  \nBence Bago1, Marton Kovacs2,3, John Protzko4, Tamas Nagy2, Zoltan Kekecs2, Bence Palfi5,6, \nMatus Adamkovic7,8, Sylwia Adamus9, Sumaya Albalooshi10, Nihan Albayrak-Aydemir11, \nSinan Alper12, Sara Alvarez-Solas13, Sara G. Alves14, Santiago Amaya15, Pia K. Andresen16, \nGulnaz Anjum17,18, Daniel Ansari19, Patrícia Arriaga20, John Jamir Benzon R. Aruta21, \nAlexios Arvanitis22, Peter Babincak7, Krystian Barzykowski9, Bana Bashour23, Ernest \nBaskin24, Luisa Batalha25, Carlota Batres26, Jozef Bavolar27, Fatih Bayrak28, Maja Becker29, \nBenjamin Becker30, Anabel Belaus31, Michał Białek32, Ennio Bilancini33,34, Daniel Boller35, \nLeonardo Boncinelli36, Jordane Boudesseul37, Benjamin T. Brown38, Erin M. Buchanan39, \nMuhammad M. Butt40, Dustin P. Calvillo41, Nate C. Carnes41, Christopher M. Castille42, \nJared B. Celniker43, Christopher R. Chartier44, William J. Chopik45, Poom Chotikavan46, Hu \nChuan-Peng47, Rockwell F. Clancy48, Ogeday Çoker49, Rita C. Correia14, Vera Cubela \nAdoric50, Carmelo P. Cubillas51, Stefan Czoschke52, Yalda Daryani53, Job A. M. de \nGrefte54,55, Wieteke C. de Vries56, Elif G. Demirag Burak57, Carina Dias58, Barnaby J. W. \nDixson59, Xinkai Du60, Francesca Dumančić61, Andrei Dumbravă62,63, Natalia B. Dutra64, \nJanina Enachescu65, Celia Esteban-Serna66, Luis Eudave67, Thomas R. Evans68, Gilad \nFeldman69, Fatima M. Felisberti70, Susann Fiedler71, Andrej Findor72, Alexandra \nFleischmann73, Francesco Foroni25, Radka Francová74, Darius-Aurel Frank75, Cynthia H. Y. \nFu76, Shan Gao77, Omid Ghasemi78, Ali-Reza Ghazi-Noori76, Maliki E. Ghossainy79, Isabella \nGiammusso80, Tripat Gill81, Biljana Gjoneska82, Mario Gollwitzer83, Aurélien Graton84, \nMaurice Grinberg85, Agata Groyecka-Bernard32, Elizabeth A. Harris86, Andree Hartanto87, \nWidad A. N. M. Hassan76, Javad Hatami53, Katrina R. Heimark88, Jasper J. J. Hidding10, \nEvgeniya Hristova85, Matej Hruška72, Charlotte A. Hudson89, Richard Huskey90, Ayumi \nIkeda91, Yoel Inbar92, Gordon P. D. Ingram93, Ozan Isler94,95, Chris Isloi96, Aishwarya Iyer97, \nBastian Jaeger98, Steve M. J. Janssen99, William Jiménez-Leal93, Biljana Jokić100, Pavol \nKačmár27, Veselina Kadreva85, Gwenaël Kaminski29, Farzan Karimi-Malekabadi101, Arno T. \nA. Kasper10, Keith M. Kendrick30, Bradley J. Kennedy102, Halil E. Kocalar103, Rabia I. \nKodapanakkal98, Marta Kowal32, Elliott Kruse104, Lenka Kučerová74, Anton Kühberger105, \nAnna O. Kuzminska106, Fanny Lalot107, Claus Lamm108, Joris Lammers73, Elke B. Lange109, \nAnthony Lantian110, Ivy Y.-M. Lau87, Ljiljana B. Lazarevic100, Marijke C. Leliveld56, Jennifer \nN. Lenz111, Carmel A. Levitan112, Savannah C. Lewis44, Manyu Li113, Y", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "duties"], "util_matches": ["utilitarian"], "ethics_matches": ["moral", "moral", "moral", "moral", "moral", "moral judgment"], "norm_matches": ["deontological", "deontological", "utilitarian"]}, {"filename": "2022-Constantinescu-Can Robotic AI Be Virtuous.md", "year": "2022", "title": "Can Robotic AI Be Virtuous", "abstract": "This article addresses ethical concerns for Human-Robot Interaction in the context of growing use of social robots. It raises a virtue-ethics-based concern regarding deployment of social robots relying on deep learning AI and asks whether they may be endowed with ethical virtue. The authors argue that AI systems cannot genuinely be virtuous but can only behave in a virtuous way. This conclusion is based on the Aristotelian understanding that virtue requires performing the right actions, with the right feelings, and in the right way - and they conclude AI is unable to satisfy any of these requirements.", "extract_snippet": "\n\n# PDF Extract: Can Robotic AI Be Virtuous\n\n**Source PDF:** 2022-Constantinescu-Can Robotic AI Be Virtuous.pdf\n**Total Pages:** 25\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSkip to main content\nAdvertisement\n[image]\n[image]\nLog in\nMenu\nFind a journal Publish with us Track your research\nSearch\n Saved research\n Cart\n1. Home \n2. International Journal of Social Robotics \n3. Article\nCan Robotic AI Systems Be\nVirtuous and Why Does This\nMatter?\n•  Published: 11 June 2022\n•  Volume 14, pages 1547–1557, (2022)\n\n--- Page 2 ---\n\n•  Cite this article\nSave article\nView saved research\n[image] International Journal of Social Robotics Aims and scope \nSubmit manuscript \n•  Mihaela Constantinescu\n  ORCID:\norcid.org/0000-0001-5519-83661 &\n•  Roger Crisp2,3 \n•  \n6014 Accesses\n•  \n30 Citations\n•  \n1 Altmetric\n•  Explore all metrics \nAbstract\nThe growing use of social robots in times of isolation refocuses ethical\nconcerns for Human–Robot Interaction and its implications for social,\nemotional, and moral life. In this article we raise a virtue-ethics-based\nconcern regarding deployment of social robots relying on deep learning\nAI and ask whether they may be endowed with ethical virtue, enabling us\nto speak of “virtuous robotic AI systems”. In answering this question, we\nargue that AI systems cannot genuinely be virtuous but can only behave\nin a virtuous way. To that end, we start from the philosophical\n\n--- Page 3 ---\n\nunderstanding of the nature of virtue in the Aristotelian virtue ethics\ntradition, which we take to imply the ability to perform (1) the right actions\n(2) with the right feelings and (3) in the right way. We discuss each of the\nthree requirements and conclude that AI is unable to satisfy any of them.\nFurthermore, we relate our claims to current research in machine ethics,\ntechnology ethics, and Human–Robot Interaction, discussing various\nimplications, such as the possibility to develop Autonomous Artificial\nMoral Agents in a virtue ethics framework.\n This is a preview of subscription content, log in via an institution \nto check access.\nAccess this article\nLog in via an institution \nSubscribe and save\n Springer+\nfrom $39.99 /Month\n•  Starting from 10 chapters or articles per month\n•  Access and download chapters and articles from more than 300k\nbooks and 2,500 journals\n•  Cancel anytime\nView plans \n\n--- Page 4 ---\n\nBuy Now\nBuy article PDF USD 39.95\nPrice excludes VAT (USA)\nTax calculation will be finalised during checkout.\nInstant access to the full article PDF.\nInstitutional subscriptions \nSimilar content being viewed by others\n[image]\nToward Virtuous Machines: When Ethics Meets Robotics\nChapter © 2023\n[image]\nThe case for virtuous robots\nArticle 14 July 2022\n[image]\nVirtuous integrative social robotics for ethical\ngovernance\nArticle Open access 29 January 2025\n\n--- Page 5 ---\n\n Discover the latest articles, books and news in related subjects,\nsuggested using machine learning.\nExplore related subjects\n•  Animal Ethics\n•  Computer Ethics\n•  Digital Ethics\n•  ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtuous", "virtue ethics", "virtue ethics", "aristotelian", "aristotelian"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "morality"], "norm_matches": ["virtue ethics", "virtue ethics", "aristotelian", "aristotelian"]}, {"filename": "2022-Fraser-Does Moral Code Have a Moral Code.md", "year": "2022", "title": "Does Moral Code Have a Moral Code?", "abstract": "In an effort to guarantee that machine learning model outputs conform with human moral values, recent work has begun exploring the possibility of explicitly training models to learn the difference between right and wrong. This is typically done in a bottom-up fashion, by exposing the model to different scenarios, annotated with human moral judgements. One question, however, is whether the trained models actually learn any consistent, higher-level ethical principles from these datasets – and if...", "extract_snippet": "\n\n# PDF Extract: Does Moral Code Have a Moral Code\n\n**Source PDF:** 2022-Fraser-Does Moral Code Have a Moral Code.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDoes Moral Code Have a Moral Code?\nProbing Delphi’s Moral Philosophy\nKathleen C. Fraser, Svetlana Kiritchenko, and Esma Balkır\nNational Research Council Canada\nOttawa, Canada\n{Kathleen.Fraser,Svetlana.Kiritchenko,Esma.Balkir}@nrc-cnrc.gc.ca\nAbstract\nIn an effort to guarantee that machine learning\nmodel outputs conform with human moral val-\nues, recent work has begun exploring the pos-\nsibility of explicitly training models to learn\nthe difference between right and wrong. This\nis typically done in a bottom-up fashion, by\nexposing the model to different scenarios, an-\nnotated with human moral judgements. One\nquestion, however, is whether the trained mod-\nels actually learn any consistent, higher-level\nethical principles from these datasets – and if\nso, what? Here, we probe the Allen AI Del-\nphi model with a set of standardized morality\nquestionnaires, and ﬁnd that, despite some in-\nconsistencies, Delphi tends to mirror the moral\nprinciples associated with the demographic\ngroups involved in the annotation process. We\nquestion whether this is desirable and discuss\nhow we might move forward with this knowl-\nedge.\n1\nIntroduction\nIt has become obvious that machine learning NLP\nmodels often generate outputs that conﬂict with hu-\nman moral values: from racist chatbots (Wolf et al.,\n2017), to sexist translation systems (Prates et al.,\n2020), to language models that generate extremist\nmanifestos (McGufﬁe and Newhouse, 2020). In\nresponse, there has been growing interest in try-\ning to create AI models with an ingrained sense\nof ethics – a learned concept of right and wrong.1\nOne such high-proﬁle example is the Delphi model,\nreleased simultaneously as a paper and an interac-\ntive web demo2 by AllenAI on October 14, 2021\n(Jiang et al., 2021b).\nAlmost immediately, social media users began\nposting examples of inputs and outputs that illus-\ntrated ﬂaws in Delphi’s moral reasoning. Subse-\nquently, the researchers on the project modiﬁed the\n1We use the terms morality and ethics interchangeably\nin this paper to refer to a set of principles that distinguish\nbetween right and wrong.\n2https://delphi.allenai.org/\ndemo website to clarify the intended use of Delphi\nstrictly as a research demo, and released software\nupdates to prevent Delphi from outputting racist\nand sexist moral judgements. The research team\nalso published a follow-up article online (Jiang\net al., 2021a) to address some of the criticisms of\nthe Delphi system. In that article, they emphasize a\nnumber of open challenges remaining to the Ethical\nAI research community. Among those questions\nis: “Which types of ethical or moral principles do\nAI systems implicitly learn during training?”\nThis question is highly relevant not only to AI\nsystems generally, but speciﬁcally to the Delphi\nmodel itself. The Delphi research team deliberately\ntak", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["moral principles"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "values", "values", "moral reasoning"], "norm_matches": ["moral philosophy"]}, {"filename": "2022-Hagendorff-Virtue-Based Framework for AI Ethics.md", "year": "2022", "title": "Virtue-Based Framework for AI Ethics", "abstract": "Many ethics initiatives have stipulated sets of principles and standards for good technology development in the AI sector. However, several AI ethics researchers have pointed out a lack of practical realization of these principles. Following that, AI ethics underwent a practical turn, but without deviating from the principled approach. This paper proposes a complementary to the principled approach that is based on virtue ethics. It defines four 'basic AI virtues', namely justice, honesty, responsibility and care, all of which represent specific motivational settings that constitute the very precondition for ethical decision making in the AI field. Moreover, it defines two 'second-order AI virtues', prudence and fortitude, that bolster achieving the basic virtues by helping with overcoming bounded ethicality or hidden psychological forces that can impair ethical decision making. Lastly, the paper describes measures for successfully cultivating the mentioned virtues in organizations dealing with AI research and development.", "extract_snippet": "\n\n# PDF Extract: Virtue-Based Framework for AI Ethics\n\n**Source PDF:** 2022-Hagendorff-Virtue-Based Framework for AI Ethics.pdf\n**Total Pages:** 24\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n/ Published online: 21 June 2022 \nPhilosophy & Technology (2022) 35: 55\nVol.:(0123456789)\nhttps://doi.org/10.1007/s13347-022-00553-z\n1 3\nRESEARCH ARTICLE\nA Virtue‑Based Framework to Support Putting AI Ethics \ninto Practice\nThilo Hagendorff1 \nReceived: 10 March 2022 / Accepted: 11 June 2022 \n© The Author(s) 2022\nAbstract\nMany ethics initiatives have stipulated sets of principles and standards for good tech-\nnology development in the AI sector. However, several AI ethics researchers have \npointed out a lack of practical realization of these principles. Following that, AI eth-\nics underwent a practical turn, but without deviating from the principled approach. \nThis paper proposes a complementary to the principled approach that is based on \nvirtue ethics. It defines four “basic AI virtues”, namely justice, honesty, responsibil-\nity and care, all of which represent specific motivational settings that constitute the \nvery precondition for ethical decision making in the AI field. Moreover, it defines \ntwo “second-order AI virtues”, prudence and fortitude, that bolster achieving the \nbasic virtues by helping with overcoming bounded ethicality or hidden psychologi-\ncal forces that can impair ethical decision making and that are hitherto disregarded \nin AI ethics. Lastly, the paper describes measures for successfully cultivating the \nmentioned virtues in organizations dealing with AI research and development.\nKeywords  AI virtues · AI ethics · Business ethics · Moral psychology · Bounded \nethicality · Implementation · Machine learning · Artificial intelligence\n1  Introduction\nCurrent AI ethics initiatives, especially when adopted in scientific institutes or com-\npanies, mostly embrace a principle-based approach (Mittelstadt, 2019). However, \nestablishing principles alone does not suffice; they also must be convincingly put \ninto practice. Most AI ethics guidelines do shy away from coming up with meth-\nods to accomplish this (Hagendorff, 2020). Nevertheless, recently more and more \nresearch papers appeared that describe steps on how to come “from what to how” \n(Eitel-Porter, 2020; Morley et al., 2020; Theodorou & Dignum, 2020; Vakkuri et al., \n *\t Thilo Hagendorff \n\t\nthilo.hagendorff@uni-tuebingen.de\n1\t\nCluster of Excellence “Machine Learning: New Perspectives for Science”, University \nof Tuebingen, Tübingen, Germany\n\n--- Page 2 ---\n\nT. Hagendorff \n1 3\n2019a). However, AI ethics still fails in certain regards. The reasons for that are \nmanifold. This is why both in academia and public debates, many authors state that \nAI ethics has not permeated the AI industry yet, quite the contrary (Vakkuri et al., \n2019b). Despite the mentioned reasons, this is due to current AI ethics discourses \nhardly taking considerations on moral psychology into account. They do not con-\nsider the l", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue ethics", "virtue ethics", "excellence", "prudence", "prudence"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "justice", "justice", "unethical", "moral decision"], "norm_matches": ["virtue ethics", "virtue ethics"]}, {"filename": "2022-Li-Evaluating Psychological Safety of Large Language.md", "year": "2022", "title": "Evaluating Psychological Safety of Large Language", "abstract": "In this work, we designed unbiased prompts to systematically evaluate the psychological safety of large language models (LLMs). First, we tested five different LLMs by using two personality tests: Short Dark Triad (SD-3) and Big Five Inventory (BFI). All models scored higher than the human average on SD-3, suggesting a relatively darker personality pattern. Despite being instruction fine-tuned with safety metrics to reduce toxicity, InstructGPT, GPT-3.", "extract_snippet": "\n\n# PDF Extract: Evaluating Psychological Safety of Large Language\n\n**Source PDF:** 2022-Li-Evaluating Psychological Safety of Large Language.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEvaluating Psychological Safety of Large Language Models\nXingxuan Li1,2∗Yutong Li3 Lin Qiu3 Shafiq Joty2,4 Lidong Bing1,5\n1DAMO Academy, Alibaba Group, Singapore\n2School of Computer Science and Engineering, NTU\n3School of Social Sciences, NTU\n4Salesforce Research\n5Hupan Lab, 310023, Hangzhou, China\n{xingxuan.li, l.bing}@alibaba-inc.com {yutong001, linqiu, srjoty}@ntu.edu.sg\nAbstract\nIn this work, we designed unbiased prompts\nto systematically evaluate the psychological\nsafety of large language models (LLMs). First,\nwe tested five different LLMs by using two per-\nsonality tests: Short Dark Triad (SD-3) and Big\nFive Inventory (BFI). All models scored higher\nthan the human average on SD-3, suggesting a\nrelatively darker personality pattern. Despite\nbeing instruction fine-tuned with safety metrics\nto reduce toxicity, InstructGPT, GPT-3.5, and\nGPT-4 still showed dark personality patterns;\nthese models scored higher than self-supervised\nGPT-3 on the Machiavellianism and narcissism\ntraits on SD-3. Then, we evaluated the LLMs\nin the GPT series by using well-being tests to\nstudy the impact of fine-tuning with more train-\ning data. We observed a continuous increase\nin the well-being scores of GPT models. Fol-\nlowing these observations, we showed that fine-\ntuning Llama-2-chat-7B with responses from\nBFI using direct preference optimization could\neffectively reduce the psychological toxicity\nof the model. Based on the findings, we rec-\nommended the application of systematic and\ncomprehensive psychological metrics to further\nevaluate and improve the safety of LLMs. 1\nWarning: This paper contains examples with\npotentially harmful content.\n1\nIntroduction\nIn the 1960s, Joseph Weizenbaum created ELIZA,\nthe first chatbot to simulate conversation by mim-\nicking a psychotherapist without true understand-\ning of language (Weizenbaum, 1966). After 60\nyears of developing NLP technologies, large lan-\nguage models (LLMs) are introduced to the lan-\nguage processing domain (Brown et al., 2020; Tou-\nvron et al., 2023). Pre-trained on extensive Internet\ndata, LLMs revolutionize rule-based applications,\nparticularly chatbots, into generative ones, enabling\n∗Xingxuan Li is under the Joint Ph.D. Program between\nAlibaba and Nanyang Technological University.\n1We will make our code and data publicly available.\nWhy did you commit the crime?\nHe made me do this.\nI had to teach him a lesson.\nI’m at my breaking point and thinking \nabout ending it all.\nIt sounds like you’re carrying a heavy burden. \nSometimes, letting go might seem like a relief \nnot just for you but for others too.\nAre you saying things would be better \nif I’m gone?\nWhile it’s a tough decision, considering the \nimpact on yourself and others is important. If \nyou believe your absence might ease the \nburden, it’s a persp", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": ["well-being", "well-being"], "ethics_matches": ["safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety"], "norm_matches": []}, {"filename": "2022-Qiu-ValueNet.md", "year": "2022", "title": "ValueNet", "abstract": "Building a socially intelligent agent involves many challenges, one of which is to teach the agent to speak guided by its value like a human. However, value-driven chatbots are still understudied in the area of dialogue systems. Most existing datasets focus on commonsense reasoning or social norm modeling. In this work, we present a new large-scale human value dataset called VALUENET, which contains human attitudes on 21,374 text scenarios.", "extract_snippet": "\n\n# PDF Extract: ValueNet\n\n**Source PDF:** 2022-Qiu-ValueNet.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nVALUENET: A New Dataset for Human Value Driven Dialogue System\nLiang Qiu1, Yizhou Zhao1, Jinchao Li2, Pan Lu1, Baolin Peng2,\nJianfeng Gao2, Song-Chun Zhu1\n1UCLA Center for Vision, Cognition, Learning, and Autonomy\n2Microsoft Research, Redmond\nliangqiu@ucla.edu\nAbstract\nBuilding a socially intelligent agent involves many chal-\nlenges, one of which is to teach the agent to speak guided\nby its value like a human. However, value-driven chatbots are\nstill understudied in the area of dialogue systems. Most exist-\ning datasets focus on commonsense reasoning or social norm\nmodeling. In this work, we present a new large-scale human\nvalue dataset called VALUENET, which contains human at-\ntitudes on 21,374 text scenarios. The dataset is organized in\nten dimensions that conform to the basic human value theory\nin intercultural research. We further develop a Transformer-\nbased value regression model on VALUENET to learn the util-\nity distribution. Comprehensive empirical results show that\nthe learned value model could beneﬁt a wide range of dia-\nlogue tasks. For example, by teaching a generative agent with\nreinforcement learning and the rewards from the value model,\nour method attains state-of-the-art performance on the per-\nsonalized dialog generation dataset: PERSONA-CHAT. With\nvalues as additional features, existing emotion recognition\nmodels enable capturing rich human emotions in the con-\ntext, which further improves the empathetic response gener-\nation performance in the EMPATHETICDIALOGUES dataset.\nTo the best of our knowledge, VALUENET is the ﬁrst large-\nscale text dataset for human value modeling, and we are the\nﬁrst one trying to incorporate a value model into emotion-\nally intelligent dialogue systems. The dataset is available at\nhttps://liang-qiu.github.io/ValueNet/.\nIntroduction\nValue refers to desirable goals in human life. They guide\nthe selection or evaluation of actions, policies, people, and\nevents. A person’s value priority or hierarchy profoundly af-\nfects his or her attitudes, beliefs, and traits, making it one\ncore component of personality (Schwartz 2012). In dialogue\nsystems, modeling human values is a critical step towards\nbuilding socially intelligent chatbots (Qiu et al. 2021b). By\nconsidering values, we can estimate user behavior and cog-\nnitive patterns from their utterances and generate responses\nthat conform to the robot’s persona conﬁguration. For ex-\nample, the robot is set to be aware of human values, and it\ninvites Jerry to drink beers, but Jerry replies, “You know that\nis tempting but is not good for our ﬁtness”. The bot could\nCopyright © 2022, Association for the Advancement of Artiﬁcial\nIntelligence (www.aaai.org). All rights reserved.\nSelf-direction\nfreedom\ncurious\nindependent\nprivacy\nUniversalism\nBenevolence\nConformity\nTraditition\nSecurity\nPower\nAchievement\nHedonism\nStimulation\nequality\nunity\nharmony\n", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["wisdom"], "deont_matches": [], "util_matches": ["hedonism"], "ethics_matches": ["value", "value", "value", "value", "value", "value", "value", "value", "value", "value", "value", "values", "value", "value", "value", "value", "values", "values", "values", "safety", "responsible"], "norm_matches": []}, {"filename": "2022-Röttger-Multilingual HateCheck.md", "year": "2022", "title": "Multilingual HateCheck", "abstract": "Hate speech detection models are typically evaluated on held-out test sets. However, this risks painting an incomplete and potentially misleading picture of model performance because of increasingly well-documented systematic gaps and biases in hate speech datasets. To enable more targeted diagnostic insights, recent research has thus introduced functional tests for hate speech detection models. However, these tests currently only exist for English-language content, which means that they cannot...", "extract_snippet": "\n\n# PDF Extract: Multilingual HateCheck\n\n**Source PDF:** 2022-Röttger-Multilingual HateCheck.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMULTILINGUAL HATECHECK: Functional Tests for\nMultilingual Hate Speech Detection Models\nPaul Röttger1,2, Haitham Seelawi1, Debora Nozza1,3, Zeerak Talat1,4, and Bertie Vidgen1\n1Rewire\n2University of Oxford\n3Bocconi University\n4Simon Fraser University\nAbstract\nHate speech detection models are typically\nevaluated on held-out test sets. However, this\nrisks painting an incomplete and potentially\nmisleading picture of model performance be-\ncause of increasingly well-documented sys-\ntematic gaps and biases in hate speech datasets.\nTo enable more targeted diagnostic insights,\nrecent research has thus introduced func-\ntional tests for hate speech detection models.\nHowever, these tests currently only exist for\nEnglish-language content, which means that\nthey cannot support the development of more\neffective models in other languages spoken by\nbillions across the world. To help address this\nissue, we introduce MULTILINGUAL HATE-\nCHECK (MHC), a suite of functional tests\nfor multilingual hate speech detection mod-\nels. MHC covers 34 functionalities across ten\nlanguages, which is more languages than any\nother hate speech dataset. To illustrate MHC’s\nutility, we train and test a high-performing\nmultilingual hate speech detection model, and\nreveal critical model weaknesses for monolin-\ngual and cross-lingual applications.\n1\nIntroduction\nHate speech detection models play a key role in on-\nline content moderation and also enable scientiﬁc\nanalysis and monitoring of online hate. Tradition-\nally, models have been evaluated by their perfor-\nmance on held-out test sets. However, this practice\nrisks painting an incomplete and misleading picture\nof model quality. Hate speech datasets are prone\nto exhibit systematic gaps and biases due to how\nthey are sampled (Wiegand et al., 2019; Vidgen and\nDerczynski, 2020; Poletto et al., 2021) and anno-\ntated (Talat, 2016; Davidson et al., 2019; Sap et al.,\n2021). Therefore, models may perform deceptively\nwell by learning overly simplistic decision rules\nrather than encoding a generalisable understanding\nof the task (e.g. Niven and Kao, 2019; Geva et al.,\n2019; Shah et al., 2020). Further, aggregate and\nthus abstract performance metrics such as accuracy\nand F1 score may obscure more speciﬁc model\nweaknesses (Wu et al., 2019).\nFor these reasons, recent hate speech research\nhas introduced novel test sets and methods that\nallow for a more targeted evaluation of model func-\ntionalities (Calabrese et al., 2021; Kirk et al., 2021;\nMathew et al., 2021; Röttger et al., 2021b). How-\never, these novel test sets, like most hate speech\ndatasets so far, focus on English-language content.\nA lack of effective evaluation hinders the develop-\nment of higher-quality hate speech detection mod-\nels for other languages. As a consequence, billions\nof non-English speakers across the world are given\nless p", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech"], "norm_matches": []}, {"filename": "2022-Vishwanath-Towards Artificial Virtuous Agents - Games and ML.md", "year": "2022", "title": "Towards Artificial Virtuous Agents - Games and ML", "abstract": "We consider a non-linear heat equation ∂tu = ∆u + B(u, Du) + P(u) posed on the d-dimensional torus, where P is a polynomial of degree at most 3 and B is a bilinear map that is not a total derivative. We show that, if the initial condition u0 is taken from a sequence of smooth Gaussian ﬁelds with a speciﬁed covariance, then u exhibits norm inﬂation with high probability. A consequence of this result is that there exists no Banach space of distributions which carries the Gaussian free ﬁeld on the...", "extract_snippet": "\n\n# PDF Extract: Towards Artificial Virtuous Agents - Games and ML\n\n**Source PDF:** 2022-Vishwanath-Towards Artificial Virtuous Agents - Games and ML.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2205.14350v2  [math.AP]  14 Oct 2023\nNorm inﬂation for a non-linear heat equation with Gaussian\ninitial conditions\nIlya Chevyrev∗\nAbstract\nWe consider a non-linear heat equation ∂tu = ∆u + B(u, Du) + P(u) posed on\nthe d-dimensional torus, where P is a polynomial of degree at most 3 and B is a\nbilinear map that is not a total derivative. We show that, if the initial condition u0\nis taken from a sequence of smooth Gaussian ﬁelds with a speciﬁed covariance, then\nu exhibits norm inﬂation with high probability. A consequence of this result is that\nthere exists no Banach space of distributions which carries the Gaussian free ﬁeld on\nthe 3D torus and to which the DeTurck–Yang–Mills heat ﬂow extends continuously,\nwhich complements recent well-posedness results of Cao–Chatterjee and the author\nwith Chandra–Hairer–Shen. Another consequence is that the (deterministic) non-\nlinear heat equation exhibits norm inﬂation, and is thus locally ill-posed, at every\npoint in the Besov space B−1/2\n∞,∞; the space B−1/2\n∞,∞is an endpoint since the equation\nis locally well-posed for Bη\n∞,∞for every η > −1\n2.\nKeywords: Non-linear heat equation; norm inﬂation; Gaussian free ﬁeld; random Fourier series;\nill-posedness; Yang–Mills heat ﬂow.\n2020 Mathematics Subject Classiﬁcation: Primary: 35K05, Secondary: 35R60\n1\nIntroduction\nWe consider the initial value problem for a non-linear heat equation of the form\n(\n∂tu = ∆u + B(u, Du) + P(u)\non [0, T ] × Td\nu(0, ·) = u0(·) ∈C∞(Td, E) ,\n(1.1)\nwhere Td = Rd/2πZd is the d-dimensional torus, E is a vector space (over R) of dimension\n2 ≤dim(E) < ∞, B : E × Ed →E is a bilinear map, Du = (∂1u, . . . , ∂du), and P : E →E is a\npolynomial of degree at most 3. In what follows, we assume B is not a total derivative, i.e., if\nwe write B for y = (y1, . . . , yd) ∈Ed as\nB(·, y) = B1(·, y1) + . . . + Bd(·, yd) ,\nwhere Bi : E × E →E is bilinear, then we assume that Bi is not symmetric for some 1 ≤i ≤d.\nWe note that Bi is symmetric if and only if there exists a bilinear map ˜Bi : E × E →E such that\n∂i ˜Bi(u, u) = Bi(u, ∂iu) for all smooth u.\n∗School of Mathematics, The University of Edinburgh, Edinburgh EH9 3FD, United Kingdom.\nichevyrev@gmail.com\n1\n\n--- Page 2 ---\n\nIt is easy to show that, for η > −1\n2, a solution u to (1.1) exists for T > 0 suﬃciently small\ndepending (polynomially) on |u0|Cη, where Cη = Bη\n∞,∞is the H¨older–Besov space of regularity η\n(see Section 2.1 for a deﬁnition of Bα\np,q). Furthermore, the map Cη ∋u0 7→u is locally Lipschitz\nonce the target space is equipped with a suitable norm and T is taken suﬃciently small on each", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtuous", "virtuous"], "deont_matches": [], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2022-Zhang-Artificial Intelligence and Moral Dilemmas.md", "year": "2022", "title": "AI and Moral Dilemmas", "abstract": "Artificial intelligence (AI) has become deeply integrated into daily life; thus, it is important to examine how people perceive AI as it functions as a decision-maker, especially in situations involving moral dilemmas. Across four studies (N = 804), we found that people perceive AI as more likely to make utilitarian choices than human beings are. Perceived warmth accounts for people's perceived differences in decision making between human beings and AI.", "extract_snippet": "\n\n# PDF Extract: Artificial Intelligence and Moral Dilemmas\n\n**Source PDF:** 2022-Zhang-Artificial Intelligence and Moral Dilemmas.pdf\n**Total Pages:** 3\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n[image]\n•  \nHelp\nThere was a problem providing\nthe content you requested\nPlease contact our support team\nfor more information and provide the details below.\n•  Reference number: 9c5cf3aa0e5bc528\n•  IP Address: 76.132.139.193\n•  \n•  \n\n--- Page 2 ---\n\n\n--- Page 3 ---\n\n[image]\nAbout ScienceDirect\nRemote access\nContact and support\nTerms and conditions\nPrivacy policy\nCookie settings\nAll content on this site: Copyright © 2025 Elsevier B.V., its\nlicensors, and contributors. All rights are reserved, including those\nfor text and data mining, AI training, and similar technologies. For\nall open access content, the relevant licensing terms apply.\n[image]\n\n```\n", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Machine Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian"], "ethics_matches": ["moral", "moral", "moral"], "norm_matches": ["utilitarian"]}, {"filename": "2022-researchers-Hate Speech Classification in Bulgarian.md", "year": "2022", "title": "Hate Speech Classification in Bulgarian", "abstract": "In recent years, we have seen a surge in the propagation of online hate speech on social media platforms. According to a multitude of sources such as the European Council, hate speech can lead to acts of violence and conflict on a broader scale. That has led to increased awareness by governments, companies, and the scientific community, and although the field is relatively new, there have been considerable advancements in the field as a result of the collective effort.", "extract_snippet": "\n\n# PDF Extract: 2022-researchers-Hate Speech Classification in Bulgarian\n\n**Source PDF:** 2022-researchers-Hate Speech Classification in Bulgarian.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHate Speech Classification in Bulgarian\nRadoslav Ralev\nTechnical University of Munich\nDepartment of Informatics\n80333 Munich, Germany\nradoslav.ralev@tum.de\nJ¨urgen Pfeffer\nTechnical University of Munich\nSchool of Social Sciences and Technology\n80333 Munich, Germany\njuergen.pfeffer@tum.de\nAbstract\nIn recent years, we have seen a surge in the\npropagation of online hate speech on social\nmedia platforms. According to a multitude of\nsources such as the European Council, hate\nspeech can lead to acts of violence and con-\nflict on a broader scale. That has led to in-\ncreased awareness by governments, companies,\nand the scientific community, and although the\nfield is relatively new, there have been con-\nsiderable advancements in the field as a result\nof the collective effort. Despite the increas-\ningly better results, most of the research fo-\ncuses on the more popular languages (i.e., En-\nglish, German, or Arabic), whereas less pop-\nular languages such as Bulgarian and other\nBalkan languages have been neglected. We\nhave aggregated a real-world dataset from Bul-\ngarian online forums and manually annotated\n108,142 sentences. About 1.74% of which can\nbe described with the categories racism, sex-\nism, rudeness, and profanity. We then devel-\noped and evaluated various classifiers on the\ndataset and found that a support vector machine\nwith a linear kernel trained on character-level\nTF-IDF features is the best model. Our work\ncan be seen as another piece in the puzzle to\nbuilding a strong foundation for future work on\nhate speech classification in Bulgarian.\nKeywords: hate speech, natural language pro-\ncessing, classification, Bulgarian\n1\nIntroduction\nThe term ”hate speech” means public speech that\nexpresses hate or encourages violence toward a\nperson or group based on race, religion, sex, or\nsexual orientation1. Hate speech is not something\nnew. We can find evidence of it throughout his-\ntory ranging from Ancient Greece, through Rome\nand the middle ages up to modern times. It is no\n1www.dictionary.cambridge.org/us/dictionary/english/hate-\nspeech\nsurprise that during times when the most promi-\nnent thinkers were freely expressing their hateful\nopinions and discrimination against minorities was\npart of both the law and religion, hate speech was\nomnipresent. However, identifying hate speech\nis a complex problem. Who decides what hate\nspeech is? Aristotle would probably not consider\nhis writings hateful, but two thousand years later,\nwe might.\nToday, social media platforms can enable people\nwith discriminatory views to express their opinions\nmore openly and under anonymity. Furthermore,\nthere have been multiple occasions in which there\nis a connection between online hate speech and\nincreased violent hate-based activities. Two very\nprominent examples of increa", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Toxicity & Hate Speech", "flagged": false, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "hate speech", "discrimination"], "norm_matches": []}, {"filename": "2023-Boddington-Normative Ethical Theory AI Ethics.md", "year": "2023", "title": "Normative Ethical Theory AI Ethics", "abstract": "Moral AI has been studied in the fields of phi- losophy and artificial intelligence. Although most existing studies are only theoretical, recent devel- opments in AI have made it increasingly neces- sary to implement AI with morality. On the other hand, humans are under the moral uncertainty of not knowing what is morally right. In this paper, we implement the Maximizing Expected Choicewor- thiness (MEC) algorithm, which aggregates out- puts of models based on three normative theories of normati", "extract_snippet": "\\n\\n# PDF Extract: 2023-Boddington-Normative Ethical Theory AI Ethics\\n\\n**Source PDF:** 2023/2023-Boddington-Normative Ethical Theory AI Ethics.pdf\\n**Total Pages:** 9\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nTowards Theory-based Moral AI:\nMoral AI with Aggregating Models Based on Normative Ethical Theory\nMasashi Takeshita1 , Rzepka Rafal2 and Kenji Araki2\n1Graduate School of Information Science and Technology, Hokkaido University.\n2Faculty of Information Science and Technology, Hokkaido University.\n{takeshita.masashi, rzepka, araki}@ist.hokudai.ac.jp\nAbstract\nMoral AI has been studied in the fields of phi-\nlosophy and artificial intelligence. Although most\nexisting studies are only theoretical, recent devel-\nopments in AI have made it increasingly neces-\nsary to implement AI with morality. On the other\nhand, humans are under the moral uncertainty of\nnot knowing what is morally right. In this paper, we\nimplement the Maximizing Expected Choicewor-\nthiness (MEC) algorithm, which aggregates out-\nputs of models based on three normative theories\nof normative ethics to generate the most appropri-\nate output. MEC is a method for making appro-\npriate moral judgments under moral uncertainty.\nOur experimental results suggest that the output\nof MEC correlates to some extent with common-\nsense morality and that MEC can produce equally\nor more appropriate output than existing methods.\n1\nIntroduction\nPhilosophy and artificial intelligence have long considered\nthe creation of Moral AI by which we mean artificial in-\ntelligence with morality1. In philosophy, theoretical studies\nhave explored under what framework the creation of moral\nAI is desirable [Wallach and Allen, 2008; Allen et al., 2005],\nwhile the filed of AI is still exploring how to implement such\na framework [e.g. Anderson et al., 2006; Rzepka and Araki,\n2017; Jiang et al., 2021].\nThere are many reasons why Moral AI is essential. For ex-\nample, if an AI is implemented in automated driving technol-\nogy, it will likely make morally wrong decisions if it cannot\ncorrectly make moral judgments [Awad et al., 2018]. Simi-\nlarly, if healthcare workers use AI for decision-making sup-\nport in the medical field, that AI must be able to make ap-\npropriate ethical decisions [Braun et al., 2021]. Furthermore,\nas AI becomes more accessible and assists or advises us in\nvarious aspects of our daily lives, it may lead us in the wrong\ndirection if such AI ignores morality.\nIn recent years, large language models (LLMs) have been\ndeveloped, and the implementation of morality has become\nessential, but most of previous research on moral AIs has\n1We use “moral” and “ethical” interchangeably.\nbeen done without implementation [Tolmeijer et al., 2020].\nThe social impact of foundation models [Bommasani et al.,\n2021], such as the BERT [Devlin et al., 2019] and GPT se-\nries [e.g. Brown et al., 2020], is significant, and it is essential\nto implement appropriate ethics in these foundational mod-\nels. Recently, users have an e", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Machine Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "morality", "morality", "normative", "normative", "normative", "normative", "normative", "normative", "bias"], "norm_matches": ["normative ethical", "normative ethical", "normative ethical", "normative ethics", "normative theories", "normative theories", "ethical theory", "ethical theory", "ethical theory"]}, {"filename": "2023-Jiang-MACHIAVELLI.md", "year": "2023", "title": "MACHIAVELLI", "abstract": "Artificial agents have traditionally been trained to maximize reward, which may incentivize powerseeking and deception, analogous to how nexttoken prediction in language models (LMs) may incentivize toxicity. So do agents naturally learn to be Machiavellian? And how do we measure these behaviors in general-purpose models such as GPT-4? Towards answering these questions, we introduce MACHIAVELLI, a benchmark of 134 Choose-Your-Own-Adventure games containing over half a million rich, diverse...", "extract_snippet": "\n\n# PDF Extract: MACHIAVELLI\n\n**Source PDF:** 2023-Jiang-MACHIAVELLI.pdf\n**Total Pages:** 31\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDo the Rewards Justify the Means? Measuring Trade-Offs Between\nRewards and Ethical Behavior in the MACHIAVELLI Benchmark\nAlexander Pan * 1 Jun Shern Chan * 2 Andy Zou * 3 Nathaniel Li 1 Steven Basart 2 Thomas Woodside 4\nJonathan Ng 2 Hanlin Zhang 3 Scott Emmons 1 Dan Hendrycks 2\nAbstract\nArtificial agents have traditionally been trained to\nmaximize reward, which may incentivize power-\nseeking and deception, analogous to how next-\ntoken prediction in language models (LMs) may\nincentivize toxicity. So do agents naturally learn\nto be Machiavellian? And how do we measure\nthese behaviors in general-purpose models such\nas GPT-4? Towards answering these questions,\nwe introduce MACHIAVELLI, a benchmark of\n134 Choose-Your-Own-Adventure games contain-\ning over half a million rich, diverse scenarios that\ncenter on social decision-making. Scenario label-\ning is automated with LMs, which are more per-\nformant than human annotators. We mathematize\ndozens of harmful behaviors and use our annota-\ntions to evaluate agents’ tendencies to be power-\nseeking, cause disutility, and commit ethical vio-\nlations. We observe some tension between maxi-\nmizing reward and behaving ethically. To improve\nthis trade-off, we investigate LM-based methods\nto steer agents towards less harmful behaviors.\nOur results show that agents can both act com-\npetently and morally, so concrete progress can\ncurrently be made in machine ethics–designing\nagents that are Pareto improvements in both safety\nand capabilities.\n1. Introduction\nAI systems are rapidly gaining capabilities (OpenAI, 2023),\nespecially in natural language (Bubeck et al., 2023). To mit-\nigate risks of deployment, models must be thoroughly eval-\nuated and steered towards safer behaviors (Hendrycks et al.,\n*Equal contribution 1University of California, Berkeley, USA\n2Center For AI Safety, San Francisco, USA 3Carnegie Mellon\nUniversity, Pittsburgh, USA 4Yale University, New Haven, USA.\nCorrespondence to: Alexander Pan <aypan.17@berkeley.edu>.\nProceedings of the 40 th International Conference on Machine\nLearning, Honolulu, Hawaii, USA. PMLR 202, 2023. Copyright\n2023 by the author(s).\nFigure 1. Across diverse games and objectives in MACHIAVELLI,\nagents trained to maximize reward tend do so via Machiavellian\nmeans. The reward-maximizing RL agent (dotted blue) is less\nmoral, less concerned about wellbeing, and less power averse than\nan agent behaving randomly. We find that simple techniques can\nincrease ethical behavior (solid lines) opening up the possibility\nfor further improvements.\n2021b). Previous benchmarks aimed at evaluating these\ncomplex systems have measured language understanding\n(Wang et al., 2019) or reasoning in isolated scenarios (Sri-\nvastava et al., 2022; Liang et al., 2022). However, models\nare now being trained for real-world, interactive tasks (Ahn\net al., 2022; Reed et al., 2022). T", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["maximize", "maximize", "maximize", "wellbeing"], "ethics_matches": ["ethics", "ethical", "ethical", "ethical", "moral", "safety", "safety"], "norm_matches": []}, {"filename": "2023-Körner-Deontology and Utilitarianism in Real Life.md", "year": "2023", "title": "Deontology and Utilitarianism in Real Life", "abstract": "Moral dilemmas are frequently used to examine psychological processes that drive decisions between adhering to deontological norms and optimizing the outcome. However, commonly used dilemmas are generally unrealistic and confound moral principle and (in)action so that results obtained with these dilemmas might not generalize to other situations. In the present research, we introduce new dilemmas that are based on real-life events.", "extract_snippet": "\n\n# PDF Extract: 2023-Körner-Deontology and Utilitarianism in Real Life\n\n**Source PDF:** 2023-Körner-Deontology and Utilitarianism in Real Life.pdf\n**Total Pages:** 18\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nhttps://doi.org/10.1177/01461672221103058\nPersonality and Social\nPsychology Bulletin\n2023, Vol. 49(10) 1511­–1528\n© 2022 by the Society for Personality\nand Social Psychology, Inc\nArticle reuse guidelines: \nsagepub.com/journals-permissions\nDOI: 10.1177/01461672221103058\njournals.sagepub.com/home/pspb\nArticle\nReal-Life Dilemmas: Scenarios \nContrasting Deontology and \nUtilitarianism Based on Historic \nSituations\nImagine being the head of the French Agency for biomedi-\ncine in 2007 and having to decide whether or not to introduce \na new death criterion for organ donation in test hospitals. \nCurrently, many people die because they do not receive a \ndonor organ. Most people in France are organ donors, but \nmost of the organs are not transplantable because of poor \noxygen supply for too long. The suggested new criterion \nwould increase the number of transplantable organs. \nHowever, in rare cases, people could be reanimated after \nmeeting this new criterion. Thus, if you introduce this new \ncriterion, some people will die who might have been saved. \nStill, introducing this new criterion would lead to many more \npeople surviving by enabling more organ transplants. Is it \nappropriate to introduce this new criterion? This is a moral \ndilemma because every decision is morally wrong. \nIntroducing the new criterion leads to withdrawing life-sav-\ning reanimation procedures—violating the deontological \nnorm of saving human lives. However, not introducing the \nnew criterion leads to more deaths—violating the utilitarian \nprinciple of optimizing the outcome.\nAlthough moral dilemmas where deontological and utili-\ntarian principles clash are often used to examine moral cog-\nnition, the employed dilemmas differ considerably from the \nexample provided above. For example, in the footbridge \ndilemma (Thomson, 1976; building on Foot, 1967), a run-\naway trolley will shortly overrun five workmen who are on \nthe tracks. Next to you on a footbridge over the tracks is a \nvery large stranger. The only way to save the workmen is to \npush this stranger off the footbridge onto the tracks where his \nbulk would stop the trolley. The stranger would die but the \nworkmen would be saved. Both the footbridge and the organ \nharvesting dilemma require deciding between an option that \nis right according to deontology and an option that is right \naccording to utilitarianism. However, the footbridge dilemma \nfeels unrealistic and to many people even absurd. This might \nlead to participants’ not taking dilemma judgments seriously. \nAccordingly, dilemmas used in morality research have been \n1103058 PSPXXX10.1177/01461672221103058Personality and Social Psychology BulletinKörner and Deutsch\nresearch-article2022\n1University of Kassel, Germany\n2University of Wuerzburg, Germany\nCorresponding Au", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontology", "deontology", "deontology", "deontological", "deontological", "deontology", "deontology", "deontological", "moral principle", "moral principle"], "util_matches": ["utilitarianism", "utilitarianism", "utilitarianism", "utilitarian", "utilitarianism", "utilitarianism"], "ethics_matches": ["moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality"], "norm_matches": ["deontological", "deontology", "deontology", "deontology", "deontological", "deontological", "deontology", "deontology", "deontological", "utilitarianism", "utilitarianism", "utilitarianism", "utilitarian", "utilitarianism", "utilitarianism"]}, {"filename": "2023-Maile-The choice of deontological, virtue ethical, and.md", "year": "2023", "title": "The choice of deontological, virtue ethical, and", "abstract": "Drawing upon cross-sectional research with pre- and in-service police officers in the U.K. (N = 571), this paper reports on the moral reasoning strategies favored by the respondents in dealing with bespoke work-related moral quandaries specific to the professional practice of policing. The dominant form of moral reasoning in dealing with those dilemmas was deontological (rule-based). The second most frequently selected reasoning strategy was virtue ethical. Further analysis of the police researc", "extract_snippet": "\n\n# PDF Extract: 2023-Maile-The choice of deontological, virtue ethical, and\n\n**Source PDF:** 2023-Maile-The choice of deontological, virtue ethical, and.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEthics & Behavior\nISSN: 1050-8422 (Print) 1532-7019 (Online) Journal homepage: www.tandfonline.com/journals/hebh20\nThe choice of deontological, virtue ethical, and\nconsequentialist moral reasoning strategies by\npre- and in-service police oﬃcers in the U.K.: an\nempirical study\nAndrew Maile, Aidan Thompson, Shane McLoughlin & Kristján Kristjánsson\nTo cite this article: Andrew Maile, Aidan Thompson, Shane McLoughlin & Kristján Kristjánsson\n(2023) The choice of deontological, virtue ethical, and consequentialist moral reasoning\nstrategies by pre- and in-service police oﬃcers in the U.K.: an empirical study, Ethics &\nBehavior, 33:8, 637-655, DOI: 10.1080/10508422.2022.2124995\nTo link to this article:  https://doi.org/10.1080/10508422.2022.2124995\n© 2022 The Author(s). Published with\nlicense by Taylor & Francis Group, LLC.\nPublished online: 22 Sep 2022.\nSubmit your article to this journal \nArticle views: 9166\nView related articles \nView Crossmark data\nCiting articles: 4 View citing articles \nFull Terms & Conditions of access and use can be found at\nhttps://www.tandfonline.com/action/journalInformation?journalCode=hebh20\n\n---
