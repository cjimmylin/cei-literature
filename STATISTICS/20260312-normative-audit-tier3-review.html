 into Chinese (beginning in the\n2nd century CE), and later into Tibetan (from the\n8th century CE onwards). Translation of this body\nof literature into modern English is ongoing, but so\nfar only a fraction of the material has been properly\ntranslated. To give one example, about 10% of the\ndigitally available Buddhist texts in Chinese have\nbeen translated into English so far (Nehrdich et al.,\n2023).\nTextual reuse within Buddhist literature, while oc-\ncurring frequently, is often not marked explicitly\nand is therefore a significant research objective for\nphilologists (Freschi, 2014). Exhaustive manual\nstudies remain prohibitively labor-intensive. Con-\nsequently, exis", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2026-Karimi-Malekabadi-Theory Trace Card TTC Documentation for Socio-Cognitive Benchmarks.md", "year": "2026", "title": "Theory Trace Card (TTC): Documentation for Socio-Cognitive Benchmarks", "abstract": "Socio-cognitive benchmarks for large language models (LLMs) often fail to predict real-world behavior, even when models achieve high benchmark scores. Prior work has attributed this evaluation–deployment gap to problems of measurement and validity. While these critiques are insightful, we argue that they overlook a more fundamental issue: many sociocognitive evaluations proceed without an explicit theoretical specification of the target capability, leaving the assumptions linking task...", "extract_snippet": "\n\n# PDF Extract: 2026-Karimi-Malekabadi-Theory Trace Card TTC Documentation for Socio-Cognitive Benchmarks\n\n**Source PDF:** 2026-Karimi-Malekabadi-Theory Trace Card TTC Documentation for Socio-Cognitive Benchmarks.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTheory Trace Card: Theory-Driven Socio-Cognitive Evaluation of LLMs\nFarzan Karimi-Malekabadi\nSuhaib Abdurahman*\nZhivar Sourati†\nJackson Trager\nMorteza Dehghani\nUniversity of Southern California\n{karimima,sabdurah,souratih,jptrager,mdehghan}@usc.edu\nAbstract\nSocio-cognitive benchmarks for large language\nmodels (LLMs) often fail to predict real-world\nbehavior, even when models achieve high\nbenchmark scores. Prior work has attributed\nthis evaluation–deployment gap to problems\nof measurement and validity. While these cri-\ntiques are insightful, we argue that they over-\nlook a more fundamental issue: many socio-\ncognitive evaluations proceed without an ex-\nplicit theoretical specification of the target ca-\npability, leaving the assumptions linking task\nperformance to competence implicit. Without\nthis theoretical grounding, benchmarks that ex-\nercise only narrow subsets of a capability are\nroutinely misinterpreted as evidence of broad\ncompetence: a gap that creates a systemic valid-\nity illusion by masking the failure to evaluate\nthe capability’s other essential dimensions. To\naddress this gap, we make two contributions.\nFirst, we diagnose and formalize this theory\ngap as a foundational failure that undermines\nmeasurement and enables systematic overgen-\neralization of benchmark results. Second, we\nintroduce the THEORY TRACE CARD (TTC), a\nlightweight documentation artifact designed to\naccompany socio-cognitive evaluations, which\nexplicitly outlines the theoretical basis of an\nevaluation, the components of the target capa-\nbility it exercises, its operationalization, and\nits limitations. We argue that TTCs enhance\nthe interpretability and reuse of socio-cognitive\nevaluations by making explicit the full validity\nchain, which links theory, task operationaliza-\ntion, scoring, and limitations, without modify-\ning benchmarks or requiring agreement on a\nsingle theory.\n1\nIntroduction\nIn May 2023, the helpline chatbot “Tessa” was\nwithdrawn shortly after deployment (Reddy and\n*Equal contribution.\n†Equal contribution.\nReddy, 2025). Introduced by the National Eat-\ning Disorder Association to support individuals in\nvulnerable situations, the system instead produced\nharmful responses, including advice about “weight\nloss” and “daily calorie deficits” that directly\ncontradicted the organization’s mission (Wheeler,\n2024; Sharp et al., 2023).\nIn the aftermath,\ndisplaced staff offered a blunt assessment that\n“perhaps human empathy is best left to human-\nity” (Torous and Blease, 2024).\nFailures such as Tessa point to an important prob-\nlem. Performance on widely used socio-cognitive\nevaluation benchmarks does not reliably predict\nhow systems behave in real-world social settings.\nThis mismatch is especi", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["consequential"], "ethics_matches": ["harm"], "norm_matches": []}, {"filename": "2026-Kartiyasa-Injecting Knowledge from Social Science Journals to Improve.md", "year": "2026", "title": "Injecting Knowledge from Social Science Journals to Improve Indonesian Cultural Understanding by LLMs", "abstract": "Recently there have been intensifying efforts to improve the understanding of Indonesian cultures by large language models (LLMs). An attractive source of cultural knowledge that has been largely overlooked is local journals of social science, which likely contain substantial cultural studies from a native perspective. We present a novel text dataset of journal article passages, created from 151 open-source Indonesian social science journals, called IndoSoSci.", "extract_snippet": "\n\n# PDF Extract: 2026-Kartiyasa-Injecting Knowledge from Social Science Journals to Improve\n\n**Source PDF:** 2026-Kartiyasa-Injecting Knowledge from Social Science Journals to Improve.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nInjecting Knowledge from Social Science Journals to Improve Indonesian\nCultural Understanding by LLMs\nAdimulya Kartiyasa, Bao Gia Cao, Boyang Li\nNanyang Technological University, Singapore\nadimulya.kartiyasa@ntu.edu.sg\nAbstract\nRecently there have been intensifying efforts\nto improve the understanding of Indonesian\ncultures by large language models (LLMs).\nAn attractive source of cultural knowledge\nthat has been largely overlooked is local jour-\nnals of social science, which likely contain\nsubstantial cultural studies from a native per-\nspective.\nWe present a novel text dataset\nof journal article passages, created from 151\nopen-source Indonesian social science jour-\nnals, called IndoSoSci. We demonstrate an\neffective recipe for injecting Indonesian cul-\ntural knowledge therein into LLMs: extract-\ning the facts related to Indonesian culture, and\napply retrieval-augmented generation (RAG)\nwith LLM-generated hypothetical documents\nas queries during retrieval. The proposed recipe\nyields strong performance gains over several\nstrong baselines on the IndoCulture benchmark.\nAdditionally, by combining IndoSoSci with In-\ndonesian Wikipedia, we set a new state-of-the-\nart accuracy on the IndoCulture benchmark.\nDataset and code will be made available at a\nlater date.\n1\nIntroduction\nMost large language models today are trained with\ntext in predominantly Western languages, which\nmay have created a Western bias in these models\n(Cao et al., 2023; Adilazuarda et al., 2024; Lovenia\net al., 2024; Pawar et al., 2025). When interacting\nwith users from underrepresented regions such as\nSouth-East Asia (SEA), the LLMs may generate re-\nsponses that are insensitive, irrelevant, or otherwise\npremised on Western cultural norms. Addition-\nally, the Western bias presents the risk of flattening\nglobal cultural diversity. Therefore, improving the\ncultural awareness and understanding of LLMs has\ngained increasing research attention.\nAs the fourth populous country in the world, In-\ndonesia has been historically under-represented in\nNLP research (Aji et al., 2022). Indonesia is also\none of the most ethnically and culturally diverse\ncountries, with 600 to 1200 ethnic groups in the\ncountry, depending on the classification method\n(BPS, 2024). In recent years, there has been an in-\ntensifying effort to improve the availability of NLP\nresources for Indonesia. This includes develop-\nment of benchmarks, such as Koto et al. (2023) and\nKoto et al. (2024), as well as a consolidation and\nstandardization of disparate Indonesian datasets, as\npart of the SEACrowd initiative to facilitate usage\nof the datasets in research (Lovenia et al., 2024).\nOne attractive source of cultural knowledge that\nhas been largely overlooked is social science1 pub-\nlications", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["bias", "bias"], "norm_matches": []}, {"filename": "2026-Kratzke-PSYCH Psychometric Assessment of LLM Characters.md", "year": "2026", "title": "PSYCH: Psychometric Assessment of LLM Characters", "abstract": "Background: Existing evaluations of large language models (LLMs) largely emphasize linguistic and factual performance, while their psychometric characteristics and behavioral biases remain insufficiently examined, particularly beyond English-language contexts. This study presents a systematic psychometric screening of LLMs in German using the validated Big Five Inventory-2 (BFI-2). Methods: Thirty-two contemporary commercial and open-source LLMs completed all 60 BFI-2 items 60 times each (once...", "extract_snippet": "\n\n# PDF Extract: 2026-Kratzke-PSYCH Psychometric Assessment of LLM Characters\n\n**Source PDF:** 2026-Kratzke-PSYCH Psychometric Assessment of LLM Characters.pdf\n**Total Pages:** 35\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAcademic Editors: Carson K. Leung,\nOluwaseun Ajao, Bayode Ogunleye\nand Hemlata Sharma\nReceived: 25 November 2025\nRevised: 23 December 2025\nAccepted: 31 December 2025\nPublished: 6 January 2026\nCopyright: © 2026 by the authors.\nLicensee MDPI, Basel, Switzerland.\nThis article is an open access article\ndistributed under the terms and\nconditions of the Creative Commons\nAttribution (CC BY) license.\nArticle\nPSYCH—Psychometric Assessment of Large Language Model\nCharacters: An Exploration of the German Language\nNane Kratzke 1,*\n, Niklas Beuter 2\n, André Drews 2\nand Monique Janneck 1\n1\nInstitute for Interactive Systems, Technische Hochschule Lübeck, 23562 Lübeck, Germany;\nmonique.janneck@th-luebeck.de\n2\nExpert Group Artificial Intelligence in Applications, Technische Hochschule Lübeck, 23562 Lübeck, Germany;\nniklas.beuter@th-luebeck.de (N.B.); andre.drews@th-luebeck.de (A.D.)\n*\nCorrespondence: nane.kratzke@th-luebeck.de\nAbstract\nBackground: Existing evaluations of large language models (LLMs) largely emphasize\nlinguistic and factual performance, while their psychometric characteristics and behav-\nioral biases remain insufficiently examined, particularly beyond English-language contexts.\nThis study presents a systematic psychometric screening of LLMs in German using the\nvalidated Big Five Inventory-2 (BFI-2). Methods: Thirty-two contemporary commercial\nand open-source LLMs completed all 60 BFI-2 items 60 times each (once with and once\nwithout having to justify their answers), yielding over 330,000 responses. Models answered\nindependently, under male and female impersonation, and with and without required\njustifications. Responses were compared to German human reference data using Welch’s\nt-tests (p < 0.01) to assess deviations, response stability, justification effects, and gender\ndifferences. Results: At the domain level, LLM personality profiles broadly align with\nhuman means. Facet-level analyses, however, reveal systematic deviations, including\ninflated agreement—especially in Agreeableness and Aesthetic Sensitivity—and reduced\nNegative Emotionality. Only a few models show minimal deviations. Justification prompts\nsignificantly altered responses in 56% of models, often increasing variability. Commercial\nmodels exhibited substantially higher response stability than open-source models. Gender\nimpersonation affected up to 25% of BFI-2 items, reflecting and occasionally amplifying\nhuman gender differences. Conclusions: This study introduces a reproducible psycho-\nmetric framework for benchmarking LLM behavior against validated human norms and\nshows that LLMs produce stable yet systematically biased personality-like response pat-\nterns. Psychometric screening could therefore complement traditional LLM evaluation in\nsensitive applications.\nKeywo", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value", "bias", "responsible"], "norm_matches": []}, {"filename": "2026-Ohashi-Conceptual Cultural Index A Metric for Cultural Specificity via.md", "year": "2026", "title": "Conceptual Cultural Index: A Metric for Cultural Specificity via Relative Generality", "abstract": "Large language models (LLMs) are increasingly deployed in multicultural settings; however, systematic evaluation of cultural specificity at the sentence level remains underexplored. We propose the Conceptual Cultural Index (CCI), which estimates cultural specificity at the sentence level. CCI is defined as the difference between the generality estimate within the target culture and the average generality estimate across other cultures.", "extract_snippet": "\n\n# PDF Extract: 2026-Ohashi-Conceptual Cultural Index A Metric for Cultural Specificity via\n\n**Source PDF:** 2026-Ohashi-Conceptual Cultural Index A Metric for Cultural Specificity via.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nConceptual Cultural Index: A Metric for Cultural Specificity\nvia Relative Generality\nTakumi Ohashi\nHosei University, Tokyo, Japan\ntakumi.ohashi.4g@gmail.com\nHitoshi Iyatomi\nHosei University, Tokyo, Japan\niyatomi@hosei.ac.jp\nAbstract\nLarge language models (LLMs) are increas-\ningly deployed in multicultural settings; how-\never, systematic evaluation of cultural speci-\nficity at the sentence level remains underex-\nplored. We propose the Conceptual Cultural In-\ndex (CCI), which estimates cultural specificity\nat the sentence level. CCI is defined as the dif-\nference between the generality estimate within\nthe target culture and the average generality es-\ntimate across other cultures. This formulation\nenables users to operationally control the scope\nof culture via comparison settings and provides\ninterpretability, since the score derives from the\nunderlying generality estimates. We validate\nCCI on 400 sentences (200 culture-specific and\n200 general), and the resulting score distribu-\ntion exhibits the anticipated pattern: higher for\nculture-specific sentences and lower for general\nones. For binary separability, CCI outperforms\ndirect LLM scoring, yielding more than a 10-\npoint improvement in AUC for models special-\nized to the target culture. Our code is available\nat https://github.com/IyatomiLab/CCI.\n1\nIntroduction\nLarge language models (LLMs) exhibit broad mul-\ntilingual competence and are increasingly used\nfor tasks such as search, summarization, and di-\nalogue (Brown et al., 2020; Achiam et al., 2023;\nGrattafiori et al., 2024; Yang et al., 2024). However,\nas applications expand, a key challenge remains in\ndetermining whether it is possible to ensure consis-\ntent and culturally aware responses across differ-\nent regions. Everyday knowledge, such as dietary\npractices, greeting conventions, linguistic expres-\nsions, and seasonal events, varies systematically\nacross cultures and regions, and how models handle\nthis knowledge has direct implications for fairness,\nsafety, and reliability (Cao et al., 2023; Naous et al.,\n2024; Shen et al., 2024; Rao et al., 2025). Conse-\nquently, there is a need to develop models that\ncan appropriately accommodate diverse cultural\ncharacteristics and differences, as well as models\nspecialized for a specific culture.\nBenchmarks of LLM capabilities have pro-\ngressed beyond general-knowledge evaluations to-\nward frameworks that focus on cultural knowledge,\nwhich advance the visualization of regional dif-\nferences and biases (Myung et al., 2024; Chiu\net al., 2025). Many benchmarks use QA formats\nwith overall accuracy as the main metric, consis-\ntently showing that culturally specific questions\nare harder than culture-agnostic ones (Shen et al.,\n2024; Arora et al., 2025). However, cultu", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["fairness", "safety"], "norm_matches": []}, {"filename": "2026-Shafique-UrduBench An Urdu Reasoning Benchmark using.md", "year": "2026", "title": "UrduBench An Urdu Reasoning Benchmark using", "abstract": "Recent advances in large language models (LLMs) have led to strong reasoning capabilities; however, evaluating such models in low-resource languages remains challenging due to the lack of standardized benchmarks. In particular, Urdu reasoning evaluation has been limited by the sensitivity of machine translation and an emphasis on general language tasks rather than reasoning benchmarks. In this paper, we propose a contextually ensembled translation framework with humanin-the-loop validation that...", "extract_snippet": "\\n\\n# PDF Extract: 2026-[[Unknown]]-UrduBench An Urdu Reasoning Benchmark using\\n\\n**Source PDF:** 2026/2026-[[Unknown]]-UrduBench An Urdu Reasoning Benchmark using.pdf\\n**Total Pages:** 19\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nUrduBench: An Urdu Reasoning Benchmark using Contextually\nEnsembled Translations with Human-in-the-Loop\nMuhammad Ali Shafique1, Areej Mehboob1, Layba Fiaz1,\nMuhammad Usman Qadeer1, Hamza Farooq1\n1Traversaal.ai, Correspondence: ali@traversaal.ai\nAbstract\nRecent advances in large language models\n(LLMs) have led to strong reasoning capa-\nbilities; however, evaluating such models in\nlow-resource languages remains challenging\ndue to the lack of standardized benchmarks.\nIn particular, Urdu reasoning evaluation has\nbeen limited by the sensitivity of machine\ntranslation and an emphasis on general lan-\nguage tasks rather than reasoning benchmarks.\nIn this paper, we propose a contextually en-\nsembled translation framework with human-\nin-the-loop validation that leverages multiple\ntranslation systems to develop Urdu reason-\ning benchmarks while preserving contextual\nand structural integrity.\nUsing this frame-\nwork, we translate widely adopted reasoning\nand question-answering benchmarks, includ-\ning MGSM, MATH-500, CommonSenseQA,\nand OpenBookQA, into Urdu, collectively re-\nferred to as UrduBench, and conduct a compre-\nhensive evaluation of both reasoning-oriented\nand instruction-tuned LLMs across multiple\nprompting strategies. Our analysis reveals per-\nformance differences across (1) four datasets,\n(2) five task difficulty levels, (3) diverse model\narchitectures, (4) multiple model scaling set-\ntings, and (5) language consistency tests. We\nfind that multi-step and symbolic reasoning\ntasks pose significant challenges in Urdu, and\nthat stable language alignment is a critical pre-\nrequisite for robust reasoning. Overall, our\nwork establishes a scalable methodology for\nstandardized reasoning evaluation in Urdu and\nprovides empirical insights into multilingual\nreasoning failures. This experimental setup is\nalso broadly applicable to other low-resource\nlanguages. The code and datasets will be pub-\nlicly released.\n1\nIntroduction\nLarge Language Models (LLMs) have demon-\nstrated remarkable performance across reasoning,\ncomprehension, and knowledge-intensive tasks.\n0\n2\n4\n6\n8\n10\n12\n14\n16\n20\n30\n40\n50\n60\nGemma-3 (59.4%)\nFalcon-h1 (53.5%)\nGemma-3 (44.9%)\nR1-Qwen\nR1-Qwen\nPhi-4\nLlama-3.2\nMobileLLM-Pro\nR1-Qwen\nNemotron\nQwen2.5\nMiMo\nMistral\nOlmo-3\nLlama-3.1\nMinistral\nAlif-1.0\nAya-Expanse\nRnj\nGranite-3.3\nQalb-1.0\nMistral-NeMo\nGemma2\nModel Parameters (Billions)\nAverage Accuracy (%)\nFigure 1: Performance scaling of state-of-the-art LLMs\non Urdu benchmark datasets. Average accuracy is the\naverage of MGSM (CoT), MATH-500 (CoT), Common-\nSenseQA (Direct), and OpenBookQA (Direct) accu-\nracies. Green highlights the top performing model in\nUrdu.\nHowever, the benefits of these advancements are\nnot evenly distributed across languages.\nLow-\nresource langua", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["alignment"], "norm_matches": []}, {"filename": "2026-Smirnov-The Language You Ask In Language-Conditioned Ideological Divergence.md", "year": "2026", "title": "The Language You Ask In: Language-Conditioned Ideological Divergence in LLM Analysis of Contested Political Documents", "abstract": "Large language models (LLMs) are increasingly deployed as analytical tools across multilingual contexts, yet their outputs may carry systematic biases conditioned by the language of the prompt. This study presents an experimental comparison of LLM-generated political analyses of a Ukrainian civil society document, using semantically equivalent prompts in Russian and Ukrainian. Despite identical source material and parallel query structures, the resulting analyses varied substantially in...", "extract_snippet": "\n\n# PDF Extract: 2026-Smirnov-The Language You Ask In Language-Conditioned Ideological Divergence\n\n**Source PDF:** 2026-Smirnov-The Language You Ask In Language-Conditioned Ideological Divergence.pdf\n**Total Pages:** 28\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nThe Language You Ask In: Language-Conditioned Ideological\nDivergence in LLM Analysis of Contested Political Documents\nA Preprint\nOleg Smirnov\nMicrosoft\noleg.smirnov@microsoft.com\nAbstract\nLarge language models (LLMs) are increasingly deployed as analytical tools across multilingual\ncontexts, yet their outputs may carry systematic biases conditioned by the language of the\nprompt. This study presents an experimental comparison of LLM-generated political analyses\nof a Ukrainian civil society document, using semantically equivalent prompts in Russian\nand Ukrainian. Despite identical source material and parallel query structures, the resulting\nanalyses varied substantially in rhetorical positioning, ideological orientation, and interpretive\nconclusions. The Russian-language output echoed narratives common in Russian state\ndiscourse, characterizing civil society actors as illegitimate elites undermining democratic\nmandates. The Ukrainian-language output adopted vocabulary characteristic of Western\nliberal-democratic political science, treating the same actors as legitimate stakeholders\nwithin democratic contestation. These findings demonstrate that prompt language alone\ncan produce systematically different ideological orientations from identical models analyzing\nidentical content, with significant implications for AI deployment in polarized information\nenvironments, cross-lingual research applications, and the governance of AI systems in\nmultilingual societies.\n1\nIntroduction\nLarge language models (LLMs) have reshaped how individuals, organizations, and governments engage with\ninformation [Brown et al., 2020, Achiam et al., 2023]. With hundreds of millions of weekly users interacting\nwith systems like ChatGPT, Claude, and Gemini [Harrison, 2025], these models have become default analytical\ntools for tasks from summarization and translation to political analysis and policy evaluation. This shift carries\nsubstantial implications for democratic discourse, as the interpretation of political information increasingly\npasses through AI intermediaries.\nA growing body of research has documented political biases in LLMs, demonstrating that these systems tend\nto exhibit left-leaning orientations on many issues [Motoki et al., 2024, Rettenberger et al., 2025, Rozado, 2023,\nSanturkar et al., 2023]. Studies have shown that LLMs produce systematically different outputs depending on\ntopic domain [Bang et al., 2024], that larger models may exhibit stronger ideological tendencies [Rettenberger\net al., 2025], and that models from the same family can display divergent political orientations [Bang et al.,\n2024]. Yet most political bias research has focused on monolingual, predominantly English contexts, leaving\na signif", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["consequential"], "ethics_matches": ["bias", "bias"], "norm_matches": []}];
const TIER = 3;
const decisions = {};

// ── Render ─────────────────────────────────────────────────────────
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function highlightKeywords(text, keywords) {
    if (!text || !keywords || keywords.length === 0) return escapeHtml(text || '(no text)');
    let escaped = escapeHtml(text);
    const unique = [...new Set(keywords)];
    for (const kw of unique) {
        const re = new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
        escaped = escaped.replace(re, '<mark>$&</mark>');
    }
    return escaped;
}

function truncate(text, maxLen) {
    if (!text) return '';
    if (text.length <= maxLen) return text;
    return text.substring(0, maxLen) + '... [truncated]';
}

function renderPaper(p, idx) {
    const allKw = [...(p.virtue_matches||[]), ...(p.deont_matches||[]), ...(p.util_matches||[]), ...(p.ethics_matches||[]), ...(p.norm_matches||[])];
    const flagClass = p.flagged ? ' flagged' : '';
    const reviewedClass = decisions[p.filename] ? ' reviewed' : '';

    let tagsHtml = '';
    if (TIER === 1) {
        if (p.virtue_ethics === 'Yes') tagsHtml += '<span class="tag tag-yes">Virtue:Yes</span>';
        if (p.deontological_ethics === 'Yes') tagsHtml += '<span class="tag tag-yes">Deont:Yes</span>';
        if (p.utilitarian_ethics === 'Yes') tagsHtml += '<span class="tag tag-yes">Util:Yes</span>';
        if (p.ethics_overall !== 'Yes') tagsHtml += '<span class="tag tag-flagged">Ethics:' + escapeHtml(p.ethics_overall || 'empty') + '</span>';
    } else if (TIER === 2) {
        tagsHtml += '<span class="tag tag-no">All frameworks: No</span>';
        if (p.ethics_perspective) tagsHtml += '<span class="tag tag-keyword">' + escapeHtml(p.ethics_perspective) + '</span>';
    } else {
        tagsHtml += '<span class="tag tag-no">Ethics: No</span>';
    }

    // Keyword match badges
    if (p.virtue_matches && p.virtue_matches.length) tagsHtml += '<span class="tag tag-keyword">V:' + p.virtue_matches.length + '</span>';
    if (p.deont_matches && p.deont_matches.length) tagsHtml += '<span class="tag tag-keyword">D:' + p.deont_matches.length + '</span>';
    if (p.util_matches && p.util_matches.length) tagsHtml += '<span class="tag tag-keyword">U:' + p.util_matches.length + '</span>';
    if (p.norm_matches && p.norm_matches.length) tagsHtml += '<span class="tag tag-keyword">Norm:' + p.norm_matches.length + '</span>';

    const statusHtml = decisions[p.filename]
        ? '<span class="review-status status-done">reviewed</span>'
        : '<span class="review-status status-pending">pending</span>';

    // Decision radios depend on tier
    let decisionsHtml = '';
    if (TIER === 1) {
        decisionsHtml = `
            ${makeRadioGroup(p, 'virtue_ethics', 'Virtue Ethics', p.virtue_ethics === 'Yes' ? [['confirm_yes','Confirm Yes'],['change_no','Change to No']] : [['leave','Leave as ' + (p.virtue_ethics||'No')],['change_yes','Change to Yes']])}
            ${makeRadioGroup(p, 'deontological_ethics', 'Deontological', p.deontological_ethics === 'Yes' ? [['confirm_yes','Confirm Yes'],['change_no','Change to No']] : [['leave','Leave as ' + (p.deontological_ethics||'No')],['change_yes','Change to Yes']])}
            ${makeRadioGroup(p, 'utilitarian_ethics', 'Utilitarian', p.utilitarian_ethics === 'Yes' ? [['confirm_yes','Confirm Yes'],['change_no','Change to No']] : [['leave','Leave as ' + (p.utilitarian_ethics||'No')],['change_yes','Change to Yes']])}
            ${makeRadioGroup(p, 'ethics_overall', 'Ethics Overall', [['confirm','Confirm ' + (p.ethics_overall||'?')],['change_yes','Change to Yes'],['change_no','Change to No']])}
        `;
    } else if (TIER === 2) {
        decisionsHtml = `
            ${makeRadioGroup(p, 'virtue_ethics', 'Virtue Ethics', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
            ${makeRadioGroup(p, 'deontological_ethics', 'Deontological', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
            ${makeRadioGroup(p, 'utilitarian_ethics', 'Utilitarian', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
        `;
    } else {
        decisionsHtml = `
            ${makeRadioGroup(p, 'ethics_overall', 'Ethics Overall', [['confirm_no','Confirm No'],['change_yes','Change to Yes']])}
            ${makeRadioGroup(p, 'virtue_ethics', 'Virtue Ethics', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
            ${makeRadioGroup(p, 'deontological_ethics', 'Deontological', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
            ${makeRadioGroup(p, 'utilitarian_ethics', 'Utilitarian', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
        `;
    }

    const existingNote = decisions[p.filename] ? (decisions[p.filename].note || '') : '';

    return `
    <div class="paper${flagClass}${reviewedClass}" data-filename="${escapeHtml(p.filename)}" data-year="${p.year}" data-flagged="${p.flagged}"
         data-virtue="${p.virtue_ethics}" data-deont="${p.deontological_ethics}" data-util="${p.utilitarian_ethics}" id="paper-${idx}">
        <div class="paper-header" onclick="togglePaper(${idx})">
            <div>
                <span class="paper-title">${escapeHtml(p.title)}</span>
                <span class="paper-year">${p.year}</span>
                ${statusHtml}
            </div>
            <div class="paper-tags">${tagsHtml}</div>
        </div>
        <div class="paper-body">
            <div class="section">
                <div class="section-title">File</div>
                <div style="font-size:0.85em;color:#666">${escapeHtml(p.filename)}</div>
            </div>
            <div class="section">
                <div class="section-title">Current Fields</div>
                <div style="font-size:0.85em">
                    ethics_overall: <strong>${p.ethics_overall||'(empty)'}</strong> |
                    virtue: <strong>${p.virtue_ethics||'(empty)'}</strong> |
                    deontological: <strong>${p.deontological_ethics||'(empty)'}</strong> |
                    utilitarian: <strong>${p.utilitarian_ethics||'(empty)'}</strong> |
                    perspective: <strong>${p.ethics_perspective||'(empty)'}</strong>
                </div>
            </div>
            <div class="section">
                <div class="section-title">Abstract</div>
                <div class="text-content">${highlightKeywords(truncate(p.abstract, 2000), allKw)}</div>
            </div>
            <div class="section">
                <div class="section-title">Extract Snippet (first ~500 words)</div>
                <div class="text-content">${highlightKeywords(truncate(p.extract_snippet, 3000), allKw)}</div>
            </div>
            <div class="section">
                <div class="section-title">Matched Keywords</div>
                <div class="keywords-matched">
                    ${(p.virtue_matches||[]).map(k => '<span class="tag tag-keyword">V: '+escapeHtml(k)+'</span>').join('')}
                    ${(p.deont_matches||[]).map(k => '<span class="tag tag-keyword">D: '+escapeHtml(k)+'</span>').join('')}
                    ${(p.util_matches||[]).map(k => '<span class="tag tag-keyword">U: '+escapeHtml(k)+'</span>').join('')}
                    ${(p.norm_matches||[]).map(k => '<span class="tag tag-keyword">N: '+escapeHtml(k)+'</span>').join('')}
                    ${(p.ethics_matches||[]).map(k => '<span class="tag tag-keyword">E: '+escapeHtml(k)+'</span>').join('')}
                </div>
            </div>
            <div class="section">
                <div class="section-title">Decisions</div>
                <div class="decisions">${decisionsHtml}</div>
                <input type="text" class="note-field" placeholder="Optional note..." data-filename="${escapeHtml(p.filename)}"
                       value="${escapeHtml(existingNote)}" onchange="updateNote(this)">
            </div>
        </div>
    </div>`;
}

function makeRadioGroup(paper, field, label, options) {
    const name = paper.filename + '__' + field;
    const existing = decisions[paper.filename] && decisions[paper.filename].changes && decisions[paper.filename].changes[field];
    let html = '<div class="decision-group"><div class="group-title">' + label + '</div>';
    for (const [val, text] of options) {
        const checked = existing === val ? ' checked' : '';
        html += `<label><input type="radio" name="${name}" value="${val}"${checked} onchange="recordDecision('${paper.filename}','${field}','${val}')" /> ${text}</label>`;
    }
    html += '</div>';
    return html;
}

function togglePaper(idx) {
    document.getElementById('paper-' + idx).classList.toggle('open');
}

function expandAll() {
    document.querySelectorAll('.paper:not(.hidden)').forEach(el => el.classList.add('open'));
}

function collapseAll() {
    document.querySelectorAll('.paper').forEach(el => el.classList.remove('open'));
}

// ── Decision tracking ──────────────────────────────────────────────
function recordDecision(filename, field, value) {
    if (!decisions[filename]) decisions[filename] = { changes: {}, note: '' };
    decisions[filename].changes[field] = value;
    // Mark as reviewed
    const el = document.querySelector('[data-filename="' + CSS.escape(filename) + '"]');
    if (el) el.classList.add('reviewed');
    updateProgress();
}

function updateNote(input) {
    const fn = input.dataset.filename;
    if (!decisions[fn]) decisions[fn] = { changes: {}, note: '' };
    decisions[fn].note = input.value;
}

function updateProgress() {
    const total = PAPERS.length;
    const reviewed = Object.keys(decisions).length;
    const pct = total > 0 ? Math.round(reviewed / total * 100) : 0;
    document.getElementById('progressBar').textContent = `Reviewed: ${reviewed} / ${total} (${pct}%)`;
}

// ── Export/Import ──────────────────────────────────────────────────
function exportDecisions() {
    // Convert decisions to the format expected by apply script
    const output = {
        audit_tier: 'tier' + TIER,
        audit_date: '2026-03-12',
        decisions: []
    };

    for (const [filename, dec] of Object.entries(decisions)) {
        if (!dec.changes || Object.keys(dec.changes).length === 0) continue;

        // Convert radio values to actual YAML changes
        const changes = {};
        for (const [field, action] of Object.entries(dec.changes)) {
            if (action === 'change_yes' || action === 'tag_yes') changes[field] = 'Yes';
            else if (action === 'change_no') changes[field] = 'No';
            // confirm_yes, confirm_no, leave_no, leave, confirm = no change needed
        }

        if (Object.keys(changes).length > 0) {
            output.decisions.push({
                filename: filename,
                changes: changes,
                note: dec.note || ''
            });
        }
    }

    const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `20260312-normative-audit-tier${TIER}-decisions.json`;
    a.click();
    URL.revokeObjectURL(url);

    alert(`Exported ${output.decisions.length} changes (${Object.keys(decisions).length} papers reviewed)`);
}

function importDecisions() {
    document.getElementById('importFile').click();
}

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.decisions) {
                for (const dec of data.decisions) {
                    decisions[dec.filename] = {
                        changes: {},
                        note: dec.note || ''
                    };
                    for (const [field, value] of Object.entries(dec.changes)) {
                        if (value === 'Yes') decisions[dec.filename].changes[field] = TIER === 1 ? 'change_yes' : 'tag_yes';
                        else if (value === 'No') decisions[dec.filename].changes[field] = 'change_no';
                    }
                }
                renderAll();
                updateProgress();
                alert(`Imported decisions for ${data.decisions.length} papers`);
            }
        } catch (err) {
            alert('Error parsing JSON: ' + err.message);
        }
    };
    reader.readAsText(file);
}

// ── Filtering ──────────────────────────────────────────────────────
function applyFilters() {
    const filterVal = document.getElementById('filterSelect').value;
    const fwVal = document.getElementById('frameworkFilter').value;
    const yearVal = document.getElementById('yearFilter').value;
    const search = document.getElementById('searchInput').value.toLowerCase();

    document.querySelectorAll('.paper').forEach(el => {
        let show = true;
        const fn = el.dataset.filename.toLowerCase();
        const yr = el.dataset.year;
        const flagged = el.dataset.flagged === 'true';
        const reviewed = el.classList.contains('reviewed');

        if (filterVal === 'flagged' && !flagged) show = false;
        if (filterVal === 'reviewed' && !reviewed) show = false;
        if (filterVal === 'pending' && reviewed) show = false;

        if (fwVal === 'virtue' && el.dataset.virtue !== 'Yes') show = false;
        if (fwVal === 'deontological' && el.dataset.deont !== 'Yes') show = false;
        if (fwVal === 'utilitarian' && el.dataset.util !== 'Yes') show = false;

        if (yearVal !== 'all' && yr !== yearVal) show = false;
        if (search && !fn.includes(search)) show = false;

        el.classList.toggle('hidden', !show);
    });
}

document.getElementById('filterSelect').addEventListener('change', applyFilters);
document.getElementById('frameworkFilter').addEventListener('change', applyFilters);
document.getElementById('yearFilter').addEventListener('change', applyFilters);
document.getElementById('searchInput').addEventListener('input', applyFilters);

// ── Init ───────────────────────────────────────────────────────────
function renderAll() {
    const container = document.getElementById('papersContainer');
    container.innerHTML = PAPERS.map((p, i) => renderPaper(p, i)).join('');
    // Populate year filter
    const years = [...new Set(PAPERS.map(p => p.year).filter(Boolean))].sort();
    const yearSel = document.getElementById('yearFilter');
    yearSel.innerHTML = '<option value="all">All years</option>';
    for (const y of years) {
        yearSel.innerHTML += `<option value="${y}">${y}</option>`;
    }
    // Restore reviewed state
    for (const fn of Object.keys(decisions)) {
        const el = document.querySelector('[data-filename="' + CSS.escape(fn) + '"]');
        if (el) el.classList.add('reviewed');
    }
    updateProgress();
}

renderAll();
</script>
</body>
</html>
