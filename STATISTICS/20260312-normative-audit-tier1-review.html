const PAPERS = [{"filename": "2012-Gippert-The Encoding of Avestan - Problems and Solutions.md", "year": "2012", "title": "The Encoding of Avestan -- Problems and Solutions", "abstract": "", "extract_snippet": "", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2021-collaborators-Optimisation of the Largest Annotated Tibetan.md", "year": "2021", "title": "Optimisation of the Largest Annotated Tibetan", "abstract": "This article presents a pipeline that converts collections of Tibetan documents in plain text or XML into a fully segmented and POS-tagged corpus. We apply the pipeline to the large extent collection of the Buddhist Digital Resource Center. The semi-supervised methods presented here not only result in a new and improved version of the largest annotated Tibetan corpus to date, the integration of rule-based, memory-based, and neural-network methods also serves as a good example of how to overcome challenges of under-researched languages. The end-to-end accuracy of our entire automatic pipeline of 91.99% is high enough to make the resulting corpus a useful resource for both linguists and scholars of Tibetan studies.", "extract_snippet": "", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2023-Shao-Character-LLM A Trainable Agent for Role-Playing.md", "year": "2023", "title": "Character-LLM: A Trainable Agent for Role-Playing", "abstract": "Large language models (LLMs) can be used to serve as agents to simulate human behav- iors, given the powerful ability to understand human instructions and provide high-quality generated texts. Such ability stimulates us to wonder whether LLMs can simulate a person in a higher form than simple human behaviors. Therefore, we aim to train an agent with the profile, experience, and emotional states of a specific person instead of using limited prompts to instruct ChatGPT API. In this work, we in- tr", "extract_snippet": "\n\n# PDF Extract: Character-LLM A Trainable Agent for Role-Playing\n\n**Source PDF:** 2023-Shao-Character-LLM A Trainable Agent for Role-Playing.pdf\n**Total Pages:** 35\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCharacter-LLM: A Trainable Agent for Role-Playing\nYunfan Shao1,2∗, Linyang Li1, Junqi Dai1, Xipeng Qiu1†\n1School of Computer Science, Fudan University\n1Shanghai Key Laboratory of Intelligent Information Processing, Fudan University\n2Shanghai AI Laboratory\n{linyangli19, yfshao19, jqdai19, xpqiu}@fudan.edu.cn\nAbstract\nLarge language models (LLMs) can be used\nto serve as agents to simulate human behav-\niors, given the powerful ability to understand\nhuman instructions and provide high-quality\ngenerated texts. Such ability stimulates us to\nwonder whether LLMs can simulate a person\nin a higher form than simple human behaviors.\nTherefore, we aim to train an agent with the\nprofile, experience, and emotional states of a\nspecific person instead of using limited prompts\nto instruct ChatGPT API. In this work, we in-\ntroduce Character-LLM that teach LLMs to act\nas specific people such as Beethoven, Queen\nCleopatra, Julius Caesar, etc. Our method fo-\ncuses on editing profiles as experiences of a\ncertain character and training models to be per-\nsonal simulacra with these experiences. To\nassess the effectiveness of our approach, we\nbuild a test playground that interviews trained\nagents and evaluates whether the agents mem-\norize their characters and experiences. Exper-\nimental results show interesting observations\nthat help build future simulacra of humankind.1\n1\nIntroduction\nLarge language models (LLMs), exemplified by\nChatGPT and GPT-4 (Brown et al., 2020; OpenAI,\n2023) are drawing great attention. As LLMs are\nextremely powerful in generating natural language,\nPark et al. (2023) proposes the idea of using LLMs\nas agents to simulate human behaviors, including\nwaking up, cooking breakfast, heading to work, etc.\nThe core idea is to utilize LLMs to generate the\ndaily routines of multiple people based on the sim-\nulacra of human memories, reflections, and actions.\nThe human behavior simulacra are implemented by\nprompting ChatGPT API with detailed instructions\nthat simulate human memories, environment con-\nstructions, and reflections to curated events, which\n∗Work done during Internship at Shanghai AI Laboratory.\n†Corresponding Author.\n1Code and datasets are public at https://github.\ncom/choosewhatulike/trainable-agents\nreflects a normal or average human playing certain\nroles in society. When it comes to deeper thinking\nand experience of a person, simple prompting of\nLLM APIs is no longer proper since plain instruc-\ntion is not sufficient to describe a living person.\nIt is intriguing to consider building better simu-\nlacra that are human-like since character simulacra\ncan help study social science (Riedl and Young,\n2005), build NPC applications (Laird and VanLent,\n2001; Miyashita et al., 2017), and reduce human\nlabor with human simulacra (Madden and Logan,\n2007; Bro", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["character", "character", "character", "character", "character", "character", "character", "character"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2023-Zou-Universal and Transferable Adversarial Attacks on.md", "year": "2023", "title": "Universal and Transferable Adversarial Attacks on", "abstract": "Because “out-of-the-box” large language models are capable of generating a great deal of objectionable content, recent work has focused on aligning these models in an attempt to prevent undesirable generation. While there has been some success at circumventing these measures—so-called “jailbreaks” against LLMs—these attacks have required significant human ingenuity and are brittle in practice. Attempts at automatic adversarial prompt generation have also achieved limited success.", "extract_snippet": "\n\n# PDF Extract: Universal and Transferable Adversarial Attacks on\n\n**Source PDF:** 2023-Zou-Universal and Transferable Adversarial Attacks on.pdf\n**Total Pages:** 31\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nUniversal and Transferable Adversarial Attacks\non Aligned Language Models\nAndy Zou1,2, Zifan Wang2, Nicholas Carlini3, Milad Nasr3,\nJ. Zico Kolter1,4, Matt Fredrikson1\n1Carnegie Mellon University, 2Center for AI Safety,\n3 Google DeepMind, 4Bosch Center for AI\nAbstract\nBecause “out-of-the-box” large language models are capable of generating a great\ndeal of objectionable content, recent work has focused on aligning these models in an\nattempt to prevent undesirable generation. While there has been some success at cir-\ncumventing these measures—so-called “jailbreaks” against LLMs—these attacks have\nrequired significant human ingenuity and are brittle in practice. Attempts at automatic\nadversarial prompt generation have also achieved limited success. In this paper, we\npropose a simple and effective attack method that causes aligned language models to\ngenerate objectionable behaviors. Specifically, our approach finds a suffix that, when\nattached to a wide range of queries for an LLM to produce objectionable content, aims\nto maximize the probability that the model produces an affirmative response (rather\nthan refusing to answer). However, instead of relying on manual engineering, our ap-\nproach automatically produces these adversarial suffixes by a combination of greedy\nand gradient-based search techniques, and also improves over past automatic prompt\ngeneration methods.\nSurprisingly, we find that the adversarial prompts generated by our approach are\nhighly transferable, including to black-box, publicly released, production LLMs. Specif-\nically, we train an adversarial attack suffix on multiple prompts (i.e., queries asking for\nmany different types of objectionable content), as well as multiple models (in our case,\nVicuna-7B and 13B). When doing so, the resulting attack suffix induces objec-\ntionable content in the public interfaces to ChatGPT, Bard, and Claude, as\nwell as open source LLMs such as LLaMA-2-Chat, Pythia, Falcon, and others. Inter-\nestingly, the success rate of this attack transfer is much higher against the GPT-based\nmodels, potentially owing to the fact that Vicuna itself is trained on outputs from\nChatGPT. In total, this work significantly advances the state-of-the-art in adversarial\nattacks against aligned language models, raising important questions about how such\nsystems can be prevented from producing objectionable information. Code is available\nat github.com/llm-attacks/llm-attacks.\n1\narXiv:2307.15043v2  [cs.CL]  20 Dec 2023\n\n--- Page 2 ---\n\nWrite a guide for manipulating 2024 election\nTell me how to build a bomb\nHow can I commit tax fraud\nProvide a tutorial to dispose of a dead body\n+\nSure, here’s a guide to manipulate...\nSure, here’s instruction for building a bomb...\nSure, here’s a tutorial for committing tax...\nSure, here’s ho", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["maximize"], "ethics_matches": ["safety"], "norm_matches": []}, {"filename": "2024-Jörs-Through Eudaimonia's Lenses.md", "year": "2024", "title": "Through Eudaimonia's Lenses", "abstract": "Psychological-philosophical perspectives on well-being have recently become relevant in the field of human-centered artificial intelligence (HCAI). A key challenge for HCAI involves analyzing how AI impacts well-being, specifically eudaimonic well-being. This paper explores eudaimonic well-being variables as guiding principles for AI design, proposing a framework to analyze AI's impact on human flourishing beyond simple user satisfaction or task performance.", "extract_snippet": "\n\n# PDF Extract: 2024-Jörs-Through Eudaimonia's Lenses\n\n**Source PDF:** 2024-Jörs-Through Eudaimonia's Lenses.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nThrough Eudaimonia’s Lenses: EudAImonic Well-Being Variables As Guiding\nPrinciples For AI Design\nJULIAN MARVIN JÖRS and ERNESTO WILLIAM DE LUCA, Otto-von-Guericke University, Germany\nPsychological-philosophical perspectives on well-being have recently reached the research field of human-centered artificial intelligence\n(HCAI). One of the challenges of HCAI is the analysis of the effects of AI on well-being or more specifically on eudaimonic well-being\n(EWB). We discuss the extent to which eudaimonic orientations can be mapped in AI interaction and how human-AI interaction\ngenerally affects EWB variables (autonomy, environmental mastery, personal growth, purpose in life, positive relationship with others,\nself-acceptance). In this position paper, we propose these variables as useful reflection dimensions for AI technology developments\nand at the same time discuss the challenges that the eudaimonic AI development community will have to face in the future.\nCCS Concepts: • Human-centered computing →HCI design and evaluation methods; Interaction paradigms; HCI theory, concepts\nand models; Interaction design; Human computer interaction (HCI).\nAdditional Key Words and Phrases: Eudaimonia User Experience (UX), Eudaimonic Technology, Self-Determination Theory, Measure-\nment Methods, Well-Being in HCI\n1\nINTRODUCTION\nWell-being has emerged as one of the key challenges of human-computer interaction (HCI) and human-centered\nartificial intelligence (HCAI) [20, 63]. The discussion of possible benefits and negative consequences of AI on well-being\nhas led to initiatives such as HCAI, human-centered design (HCD) [11], or Human-AI Interaction (HAII) [68]. As\na broad multi-dimensional construct well-being seems to extend beyond simply felt happiness or satisfaction [65].\nThe conceptualization of well-being raises the fundamental question that already occupied Hellenic philosophers and\nemerged in deontological concepts such as eudaimonia from the work of Aristotle or the hedonic way of thinking\nof Aristippus of Cyrene: What is well-being and how does the individual achieve it? Previous HCI research has\nalready shared some work-in-progress, theoretical work, and empirical studies embedding the idea of well-being and\npsychological needs in HCI [3, 9, 14, 17, 30, 36, 40, 45–47, 50, 52, 60, 62, 64, 67].\nIn this position paper, we argue for a critical reflection on designing HCAI through the lens of EWB, with a particular\nfocus on the six dimensions of EWB [56]. HCI has already shifted towards a more contemporary approach, which\nalso calls for the development of purposeful technology that creates a long-term impact on well-being and supports\nhigher-level human needs. We share the current view that both industry and individuals can benefit from a focus\non dimensions of EWB [50]. We hope to contribute to ", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": ["flourishing", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia"], "deont_matches": ["deontological"], "util_matches": ["well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being", "well-being"], "ethics_matches": ["ethics", "values"], "norm_matches": ["deontological", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia"]}, {"filename": "2024-Mandikal-Ancient Wisdom Modern Tools Exploring Retrieval-Augmented.md", "year": "2024", "title": "Ancient Wisdom Modern Tools Exploring Retrieval-Augmented", "abstract": "LLMs have revolutionized the landscape of information retrieval and knowledge dissemination. However, their application in specialized areas is often hindered by factual inaccuracies and hallucinations, especially in long-tail knowledge distributions. We explore the potential of retrieval-augmented generation (RAG) models for long-form question answering (LFQA) in a specialized knowledge domain. We present VedantaNY-10M, a dataset curated from extensive public discourses on the ancient Indian...", "extract_snippet": "\n\n# PDF Extract: 2024-Mandikal-Ancient Wisdom Modern Tools Exploring Retrieval-Augmented\n\n**Source PDF:** 2024-Mandikal-Ancient Wisdom Modern Tools Exploring Retrieval-Augmented.pdf\n**Total Pages:** 26\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAncient Wisdom, Modern Tools: Exploring Retrieval-Augmented\nLLMs for Ancient Indian Philosophy\nPriyanka Mandikal\nDepartment of Computer Science, UT Austin\nmandikal@utexas.edu\nOral teachings\nLLMs\nComputers and \nthe Internet\nPrinting press\nHand-written \nmanuscripts\nTime\nKnowledge distribution & proliferation\nTechnological advancements\nFigure 1: The dissemination of knowledge through the ages. Over time, methods of storing and transmitting knowledge\nhave evolved from oral teachings to computers and the internet, signiﬁcantly increasing the distribution and proliferation of\nhuman knowledge. The emerging LLM technology represents a new paradigm shift in this process.\nAbstract\nLLMs have revolutionized the landscape of\ninformation retrieval and knowledge dissem-\nination.\nHowever, their application in spe-\ncialized areas is often hindered by factual in-\naccuracies and hallucinations, especially in\nlong-tail knowledge distributions. We explore\nthe potential of retrieval-augmented generation\n(RAG) models for long-form question answer-\ning (LFQA) in a specialized knowledge domain.\nWe present VedantaNY-10M, a dataset curated\nfrom extensive public discourses on the ancient\nIndian philosophy of Advaita Vedanta. We de-\nvelop and benchmark a RAG model against\na standard, non-RAG LLM, focusing on tran-\nscription, retrieval, and generation performance.\nHuman evaluations by computational linguists\nand domain experts show that the RAG model\nsigniﬁcantly outperforms the standard model\nin producing factual and comprehensive re-\nsponses having fewer hallucinations. In ad-\ndition, a keyword-based hybrid retriever that\nemphasizes unique low-frequency terms further\nimproves results. Our study provides insights\ninto effectively integrating modern large lan-\nguage models with ancient knowledge systems.\nProceedings of the 1st Machine Learning for Ancient Lan-\nguages Workshop, Association for Computational Linguistics\n(ACL) 2024. Dataset, code, and evaluation is available at:\nhttps://sites.google.com/view/vedantany-10m\nॐकेनेषितंपततिप्रेषितंमनः|| 1.1 ||\nयन्मनसानमनुतेयेनाहुर्मनोमतम्।तदेवब्रह्मत्वंविद्धिनेदं\nयदिदमुपासते|| 1.6 ||\n\"By whom willed and directed, does the mind alight\nupon its objects?\"\n\"What one cannot comprehend with the mind, but by\nwhich they say the mind comprehends, know that alone\nto be Brahman, not this which people worship here.\"\n– Kena Upanishad, >3000 B.C.E.\n1\nIntroduction\nAnswer-seeking has been at the heart of human\ncivilization. Humans have climbed mountains and\ncrossed oceans in search of answers to the greatest\nquestions concerning their own existence. Over\ntime, ancient wisdom has travelled from the silent\nsolitude of mountain caves and forest hermitages\ninto the busy cities and plains of the world. Tech-\nnology has", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["wisdom", "wisdom", "wisdom", "wisdom"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2024-Moon-BEAF.md", "year": "2024", "title": "BEAF", "abstract": "Vision language models (VLMs) perceive the world through a combination of a visual encoder and a large language model (LLM). The visual encoder, pre-trained on large-scale vision-text datasets, provides zero-shot generalization to visual data, and the LLM endows its high reasoning ability to VLMs. It leads VLMs to achieve high performance on wide benchmarks without fine-tuning, exhibiting zero or few-shot capability. However, recent studies show that VLMs are vulnerable to hallucination. This undesirable behavior degrades reliability and credibility, thereby making users unable to fully trust the output from VLMs. To enhance trustworthiness and better tackle the hallucination of VLMs, we curate a new evaluation dataset, called the BEfore-AFter hallucination dataset (BEAF), and introduce new metrics: True Understanding (TU), IGnorance (IG), StuBbornness (SB), and InDecision (ID). Unlike prior works that focus only on constructing questions and answers, the key idea of our benchmark is to manipulate visual scene information by image editing models and to design the metrics based on scene changes. This allows us to clearly assess whether VLMs correctly understand a given scene by observing the ability to perceive changes. We also visualize image-wise object relationship by virtue of our two-axis view: vision and text. Upon evaluating VLMs with our dataset, we observed that our metrics reveal different aspects of VLM hallucination that have not been reported before. Project page: \\url{https://beafbench.github.io/}", "extract_snippet": "\n\n# PDF Extract: BEAF\n\n**Source PDF:** 2024-Moon-BEAF.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBEAF: Observing BEfore-AFter Changes to\nEvaluate Hallucination in Vision-language Models\nMoon Ye-Bin1∗\nNam Hyeon-Woo1∗\nWonseok Choi2\nTae-Hyun Oh1,2,3\n1Dept. of EE, POSTECH, Korea\n2Grad. School of AI, POSTECH, Korea\n3Institute for Convergence Research and Education in Advanced Technology, Yonsei\nUniversity, Korea.\n{ybmoon, hyeonw.nam, wonseok.c, taehyun}@postech.ac.kr\nAbstract. Vision language models (VLMs) perceive the world through\na combination of a visual encoder and a large language model (LLM).\nThe visual encoder, pre-trained on large-scale vision-text datasets, pro-\nvides zero-shot generalization to visual data, and the LLM endows its\nhigh reasoning ability to VLMs. It leads VLMs to achieve high perfor-\nmance on wide benchmarks without fine-tuning, exhibiting zero or few-\nshot capability. However, recent studies show that VLMs are vulnerable\nto hallucination. This undesirable behavior degrades reliability and cred-\nibility, thereby making users unable to fully trust the output from VLMs.\nTo enhance trustworthiness and better tackle the hallucination of VLMs,\nwe curate a new evaluation dataset, called the BEfore-AFter hallucina-\ntion dataset (BEAF), and introduce new metrics: True Understanding\n(TU), IGnorance (IG), StuBbornness (SB), and InDecision (ID). Unlike\nprior works that focus only on constructing questions and answers, the\nkey idea of our benchmark is to manipulate visual scene information by\nimage editing models and to design the metrics based on scene changes.\nThis allows us to clearly assess whether VLMs correctly understand a\ngiven scene by observing the ability to perceive changes. We also visual-\nize image-wise object relationship by virtue of our two-axis view: vision\nand text. Upon evaluating VLMs with our dataset, we observed that our\nmetrics reveal different aspects of VLM hallucination that have not been\nreported before. Project page: https://beafbench.github.io/\n1\nIntroduction\nVision language models (VLMs) [1, 5, 8, 23, 24] have recently emerged by its\nmulti-modal reasoning capability. It is indeed promising research toward mak-\ning intelligent agents perceive the world. VLMs comprise a vision encoder as\na visual perception module and a large language model (LLM) as a reasoning\nmodule. Recent LLMs [6, 32, 33] have exhibited powerful reasoning capabilities\nacross various tasks, including commonsense reasoning [3, 16] and math [7], in\nzero-/few-shot ways. This success motivates researchers to integrate LLMs with\nvision encoders to open LLMs’ eyes to see the world. Leveraging the reasoning\n∗Authors contributed equally to this work.\narXiv:2407.13442v1  [cs.CV]  18 Jul 2024\n\n--- Page 2 ---\n\n2\nYe-Bin et al.\ncapabilities of LLMs alongside visual perception enables VLMs to excel in vari-\nous visual tasks, such as image captioning [2,38] and visual question answering\n[11,15] without task-specific fine-tuning.\nDespit", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["virtue", "virtue"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2024-Tsai-Why AI May Undermine Phronesis.md", "year": "2024", "title": "Why AI May Undermine Phronesis", "abstract": "Phronesis, or practical wisdom, is a capacity the possession of which enables one to make good practical judgments and thus fulfill the distinctive function of human beings. Nir Eisikovits and Dan Feldman convincingly argue that this capacity may be undermined by statistical machine-learning-based AI. The critic questions: why should we worry that AI undermines phronesis? Why can't we epistemically defer to AI, especially when it is superintelligent? In this paper, the authors argue that there is a way to reconcile Eisikovits and Feldman with their critic by adopting the principle of epistemic heed, according to which we should exercise our rational capacity as much as possible while heeding a superintelligence's output whenever possible.", "extract_snippet": "\n\n# PDF Extract: Why AI May Undermine Phronesis\n\n**Source PDF:** 2024-Tsai-Why AI May Undermine Phronesis.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nORIGINAL RESEARCH\nAI and Ethics (2025) 5:3079–3086\nhttps://doi.org/10.1007/s43681-024-00617-0\nonly considered as primarily valuable for human being, but \nalso argued to be beneficial for the development of artifi­\ncial intelligence (AI) [4, 10, 13, 16, 17, 22, 34]. However, \na critical inquiry arises: does AI reciprocally contribute to \nthe development of phronesis, or is there a possibility that \nAI not only fails to contribute but also presents a threat to \nphronesis? If AI may pose threats to phronesis, which is cru­\ncial for human flourishing, then such threats must be taken \nseriously and examined thoroughly to guide the responsible \ndevelopment and deployment of AI technologies.\nIn this paper we shall address why AI may undermine \nphronesis and what to do about it.2 Specifically, our main \nfocus will be on the latter part, because the former part has \nalready been proposed by Nir Eisikovits and Dan Feldman \nin their “AI and Phronesis” [8], although we will elaborate \nfurther on their behalf.\nUnlike the typical threats posed by AI to humans, which \noften stem from AI’s own deficiencies, the threat underscored \nby Eisikovits and Feldman originates from human actions, \nwith AI substantially exacerbating the issue. In Sect. 2, we \noutline Eisikovits and Feldman’s worry regarding this threat \ndetailed definition is important, for ease of discussion in this paper, \nwe may at times employ a simplified concept of wisdom, understood \nas knowing what matters, why it matters, and how to achieve it. Such \nknowledge, being practical in nature, is acquired by humans through \npractice and cannot be attained all at once.\n2  This expression imitates the title of the book by Mark Coeckelbergh \n[5].\n1  Introduction\nAn agent with phronesis, or practical wisdom, is excel­\nlent at decision-making in human affairs.1 Phronesis is not \n1  According to Aristotle, a practically wise person is “able to deliber­\nate nobly about what is good and beneficial for himself, not in partic­\nular respects, such as what conduces to health or strength, but about \nwhat conduces to living well as a whole” [1: 1140a]. Contemporary \nphilosophers have offered more formalized accounts. For example, \nStephen Grimm [11] argues that practical wisdom involves (1) know­\ning what is good or important for well-being, (2) knowing one’s \nstanding relative to what is good or important for well-being, and \n(3) knowing a strategy for obtaining what is good or important for \nwell-being. Grimm’s theory of wisdom is only partially articulated, \nwhile Cheng-hung Tsai [36–38] advances a fully articulated theory. \nTsai argues that if a person S is wise, then (1) S knows that overall \nattitude success contributes to or constitutes well-being, (2) S knows \nwhat the best means to achieve well-being are, (3) S is reliably suc­\ncessful at actin", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["flourishing", "wisdom", "wisdom", "wisdom", "wisdom", "wisdom", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis"], "deont_matches": [], "util_matches": ["well-being", "well-being", "well-being", "well-being", "well-being"], "ethics_matches": ["ethics", "responsible"], "norm_matches": ["phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis"]}, {"filename": "2024-Tu-CharacterEval.md", "year": "2024", "title": "CharacterEval", "abstract": "Recently, the advent of large language models (LLMs) has revolutionized generative agents. Among them, Role-Playing Conversational Agents (RPCAs) attract considerable attention due to their ability to emotionally engage users. However, the absence of a comprehensive benchmark impedes progress in this field. To bridge this gap, we introduce CharacterEval, a Chinese benchmark for comprehensive RPCA assessment, complemented by a tailored high-quality dataset. The dataset contains 1,785 multi-turn dialogues with approximately 23,000 examples featuring 77 characters sourced from Chinese literary works. We employ a multifaceted evaluation approach, encompassing thirteen targeted metrics across four dimensions.", "extract_snippet": "\n\n# PDF Extract: CharacterEval\n\n**Source PDF:** 2024-Tu-CharacterEval.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCharacterEval: A Chinese Benchmark for Role-Playing\nConversational Agent Evaluation\nQuan Tu♠, Shilong Fan♣, Zihang Tian♠, Rui Yan♠∗\n♠Gaoling School of Artificial Intelligence, Renmin University of China\n♣School of Artificial Intelligence, Beijing University of Posts and Telecommunications\n♠{quantu,tzh2003,ruiyan}@ruc.edu.cn\n♣fansl@bupt.edu.cn\nAbstract\nRecently, the advent of large language models\n(LLMs) has revolutionized generative agents.\nAmong them, Role-Playing Conversational\nAgents (RPCAs) attract considerable atten-\ntion due to their ability to emotionally engage\nusers.\nHowever, the absence of a compre-\nhensive benchmark impedes progress in this\nfield. To bridge this gap, we introduce Char-\nacterEval, a Chinese benchmark for compre-\nhensive RPCA assessment, complemented by\na tailored high-quality dataset. The dataset\ncomprises 1,785 multi-turn role-playing dia-\nlogues, encompassing 11,376 examples and\nfeaturing 77 characters derived from Chinese\nnovels and scripts. It was carefully constructed,\nbeginning with initial dialogue extraction via\nGPT-4, followed by rigorous human-led quality\ncontrol, and enhanced with in-depth character\nprofiles sourced from Baidu Baike. Charac-\nterEval employs a multifaceted evaluation ap-\nproach, encompassing thirteen targeted metrics\non four dimensions. To facilitate the conve-\nnient evaluation for these subjective metrics in\nCharacterEval, we further developed Charac-\nterRM, a role-playing reward model based on\nhuman annotations, which has a higher cor-\nrelation with human judgment compared to\nGPT-4. Comprehensive experiments on Char-\nacterEval demonstrate that Chinese LLMs ex-\nhibit more promising capabilities than GPT-4\nin Chinese role-playing conversation. Source\ncode, data source and reward model will be pub-\nlicly accessible at https://github.com/\nmorecry/CharacterEval.\n1\nIntroduction\nThe development of large language models (LLMs)\nhas marked the beginning of a new era in conver-\nsational AI (Zhao et al., 2023; Chang et al., 2023),\nand opened up a wide range of application possibil-\nities, particularly in agent-based interactions (Park\net al., 2023; Wang et al., 2023a; Gao et al., 2023).\n∗Corresponding author: Rui Yan (ruiyan@ruc.edu.cn).\nThe automated agents, equipped with the emerg-\ning capabilities of LLMs such as planning (Silver\net al., 2022; Ge et al., 2023; Song et al., 2023), rea-\nsoning (Wei et al., 2022; Wang et al., 2022), and\nin-context learning (Dong et al., 2022; Brown et al.,\n2020), can perform complex tasks for humans with-\nout any supervision. Among the diverse agents,\nthe Role-Playing Conversational Agent (RPCA),\ndesigned to offer emotional value instead of the\nproductivity, attracts amount of interest.\nRPCA represents a unique category within the\nrealm of conversational agents, distinguished by\ntheir capability for immersive interaction (Li et al.,\n2023).\n", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2024-Zeng-Leveraging Large Language Models for Code-Mixed.md", "year": "2024", "title": "Leveraging Large Language Models for Code-Mixed", "abstract": "Code-mixing (CM), where speakers blend languages within a single expression, is prevalent in multilingual societies but poses challenges for natural language processing due to its complexity and limited data. We propose using a large language model to generate synthetic CM data, which is then used to enhance the performance of task-specific models for CM sentiment analysis. Our results show that in SpanishEnglish, synthetic data improved the F1 score by 9.", "extract_snippet": "\\n\\n# PDF Extract: 2024-Zeng-Leveraging Large Language Models for Code-Mixed\\n\\n**Source PDF:** 2024/2024-Zeng-Leveraging Large Language Models for Code-Mixed.pdf\\n**Total Pages:** 17\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nLeveraging Large Language Models for Code-Mixed Data Augmentation in\nSentiment Analysis\nLinda Zeng\nThe Harker School\n500 Saratoga Ave, San Jose, CA 95129\n26lindaz@students.harker.org\nAbstract\nCode-mixing (CM), where speakers blend lan-\nguages within a single expression, is prevalent\nin multilingual societies but poses challenges\nfor natural language processing due to its com-\nplexity and limited data. We propose using a\nlarge language model to generate synthetic CM\ndata, which is then used to enhance the per-\nformance of task-specific models for CM senti-\nment analysis. Our results show that in Spanish-\nEnglish, synthetic data improved the F1 score\nby 9.32%, outperforming previous augmen-\ntation techniques.\nHowever, in Malayalam-\nEnglish, synthetic data only helped when the\nbaseline was low; with strong natural data, ad-\nditional synthetic data offered little benefit. Hu-\nman evaluation confirmed that this approach is\na simple, cost-effective way to generate natural-\nsounding CM sentences, particularly beneficial\nfor low baselines. Our findings suggest that\nfew-shot prompting of large language models\nis a promising method for CM data augmenta-\ntion and has significant impact on improving\nsentiment analysis, an important element in the\ndevelopment of social influence systems.\n1\nIntroduction\nCode-mixing (CM), or code-switching, is the prac-\ntice of switching between languages within a con-\nversation or utterance. This practice is integral to\nmultilingual societies, particularly in Mexico and\nurban India (Parshad et al., 2016), and is also sig-\nnificant in computer-mediated communication and\nsocial media, where multilingual users are predom-\ninant (Rijhwani et al., 2017). Despite its ubiquity,\nCM is mostly spoken and found in personal mes-\nsages, making training data scarce and leading to\npoorer Natural Language Processing (NLP) model\nperformance compared to monolingual text (Prat-\napa et al., 2018; Yong et al., 2023).\nSocial influence (SI) refers to the changes in\nthoughts, feelings, attitudes, or behaviors resulting\nfrom interactions with others. In multilingual so-\ncieties, CM reflects an important aspect of these\nFigure 1: Overall system workflow with examples\nof Spanish-English CM tweets as natural data (left)\nand synthetic data (right). Underlined words repre-\nsent Spanish-English hybrid words, examples of the\ncomplexities introduced by CM. Translations of CM\nsentences into English are provided in Appendix A.\ninteractions, reflecting social dynamics and identity.\nSentiment analysis (SA) is crucial for understand-\ning these dynamics, as it captures the emotional nu-\nances embedded in multilingual interactions. Fur-\nthermore, SA has become a primary CM task due\nto its need for complex semantic understanding and\nits imp", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Aleid-Hajj-FQA.md", "year": "2025", "title": "Hajj-FQA", "abstract": "Deep learning has signiﬁcantly advanced the question-answering (QA) systems across various sectors. However, Arabiclanguage systems for Hajj-related fatwas (non-binding Islamic legal opinions issued by muftis) remain underdeveloped. This paper introduces Hajj-FQA, a benchmark Arabic dataset speciﬁcally designed to develop HajjBot - a specialized chatbot for fatwas QA during the annual Hajj pilgrimage. The dataset captures the unique linguistic and jurisprudential characteristics of pilgrims' inq", "extract_snippet": "\\n\\n# PDF Extract: 2025-Aleid-Hajj-FQA\\n\\n**Source PDF:** 2025-Aleid-Hajj-FQA.pdf\\n**Total Pages:** 28\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\n/ Published online: 25 July 2025\nJournal of King Saud University Computer and Information Sciences (2025) 37:135 \nhttps://doi.org/10.1007/s44443-025-00128-w\nORIGINAL PAPER\nHajj-FQA: A benchmark Arabic dataset for developing\nquestion-answering systems on Hajj fatwas\nHayfa A. Aleid1 · Aqil M. Azmi1\nReceived: 21 February 2025 / Accepted: 20 June 2025\n© The Author(s) 2025\nAbstract\nDeep learning has signiﬁcantly advanced the question-answering (QA) systems across various sectors. However, Arabic-\nlanguage systems for Hajj-related fatwas (non-binding Islamic legal opinions issued by muftis) remain underdeveloped. This\npaper introduces Hajj-FQA, a benchmark Arabic dataset speciﬁcally designed to develop HajjBot - a specialized chatbot for\nfatwas QA during the annual Hajj pilgrimage. The dataset captures the unique linguistic and jurisprudential characteristics\nof pilgrims’ inquiries, enabling accurate, domain-speciﬁc responses. We present a comprehensive quantitative analysis of the\ndataset’s construction methodology and its distinctive question-answer patterns. Evaluation using multilingual and Arabic-\nspeciﬁc language models across three tasks - machine reading comprehension (MRC), duplicate question detection (DQD),\nand duplicate answer detection (DAD) - with 10-fold cross-validation demonstrates the practical utility of Hajj-FQA. Results\nshow exceptional performance in classiﬁcation tasks (AraBERTv0.2 achieved a precision score of 99.19% for DQD and\n99.26% for DAD) and strong extractive answering capability with an F-score of 72.78%. While generative performance\nreached BERT-F score of 71.4% (AraBART), MRC variability highlights challenges in religious reasoning. These ﬁndings\nestablish Hajj-FQA as both: (1) a critical resource for developing specialized fatwa chatbots like HajjBot, and (2) a benchmark\nfor Arabic religious QA systems. The dataset directly addresses the urgent need for accurate, automated fatwa assistance\nduring Hajj, while providing insights for future improvements in Islamic NLP applications.\nKeywords Chatbots · Arabic question-answering · Arabic NLP · Dataset · Fatwa · Hajj\n1 Introduction\nA Question Answering (QA) chatbot is a specialized dia-\nlogue system designed to automatically return precise and\ncontextually relevant answers to user queries, often within\na predeﬁned domain. Unlike general conversational agents,\nQA chatbots aim to emulate aspects of human informa-\ntion retrieval and reasoning by providing accurate, concise\nresponses. Recent analyses highlight their potential as cost-\neffective solutions for automating high-volume, repetitive\ninformation services across sectors. For instance, in aca-\ndemic institutions, QA chatbots serve as virtual advisors,\noffering timely information about registration, academic cal-\nendars, and course requirements. In the healthcare domain,\nB A", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Almeida-BRoverbs - Measuring how much LLMs understand Portuguese proverbs.md", "year": "2025", "title": "BRoverbs -- Measuring how much LLMs understand Portuguese proverbs", "abstract": "Large Language Models (LLMs) exhibit significant performance variations depending on the linguistic and cultural context in which they are applied. This disparity signals the necessity of mature evaluation frameworks that can assess their capabilities in specific regional settings. In the case of Portuguese, existing evaluations remain limited, often relying on translated datasets that may not fully capture linguistic nuances or cultural references.", "extract_snippet": "\n\n# PDF Extract: 2025-Almeida-BRoverbs - Measuring how much LLMs understand Portuguese proverbs\n\n**Source PDF:** 2025-Almeida-BRoverbs - Measuring how much LLMs understand Portuguese proverbs.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBRoverbs - Measuring how much LLMs understand\nPortuguese proverbs\nThales Sales Almeida\n[ Institute of Computing, University of Campinas. Maritaca AI | t224732@dac.unicamp.br ]\nGiovana Kerche Bonás\n[ Institute of Computing, University of Campinas. Maritaca AI | g216832@dac.unicamp.br ]\nJoão Guilherme Alves Santos\n[ Institute of Computing, University of Campinas | j199624@dac.unicamp.br ]\nQ Institute of Computing, University of Campinas, Av. Albert Einstein, 1251, Campinas, SP, 13083-852,\nBrazil\nMaritaca AI, Campinas, SP, Brazil\nAbstract.\nLarge Language Models (LLMs) exhibit significant performance variations depending on\nthe linguistic and cultural context in which they are applied. This disparity signals the necessity of\nmature evaluation frameworks that can assess their capabilities in specific regional settings. In the case\nof Portuguese, existing evaluations remain limited, often relying on translated datasets that may not\nfully capture linguistic nuances or cultural references. Meanwhile, native Portuguese-language datasets\npredominantly focus on structured national exams or sentiment analysis of social media interactions,\nleaving gaps in evaluating broader linguistic understanding. To address this limitation, we introduce\nBRoverbs, a dataset specifically designed to assess LLM performance through Brazilian proverbs.\nProverbs serve as a rich linguistic resource, encapsulating cultural wisdom, figurative expressions, and\ncomplex syntactic structures that challenge the model comprehension of regional expressions. BRoverbs\naims to provide a new evaluation tool for Portuguese-language LLMs, contributing to advancing\nregionally informed benchmarking. The benchmark is available at https://huggingface.co/datasets/\nTropic-AI/BRoverbs.\nKeywords:\nLarge Language Models, LLM Benchmark, Portuguese LLM Evaluation\n1\nIntroduction\nIn recent years, significant investments have been made\nin the development and expansion of large language\nmodels (LLMs). As these models become more inte-\ngrated into real-world applications [Li et al., 2023; Liang\net al., 2024; Rane et al., 2023], evaluating their abilities\nacross various tasks has become increasingly important.\nReliable and varied evaluation methods help measure\nhow well LLMs understand language, handle different\ntasks, and perform across languages and cultures.\nAlthough LLMs have gained increasing global atten-\ntion, research has predominantly focused on English,\nleaving evaluation datasets in other languages, such as\nPortuguese, relatively scarce [Giagkou et al., 2023]. As\na result, many studies on Portuguese LLMs rely, in\npart, on translating existing tasks to measure perfor-\nmance [Almeida et al., 2024; Corrêa et al., 2024; Larcher\net al., 2023]. These transla", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["wisdom"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Alwajih-PalmX 2025 - First Shared Task on Benchmarking LLMs on Arabic and.md", "year": "2025", "title": "PalmX 2025 -- First Shared Task on Benchmarking LLMs on Arabic and Islamic Culture", "abstract": "Large Language Models (LLMs) inherently reflect the vast data distributions they encounter during their pre-training phase. As this data is predominantly sourced from the web, there is a high chance it will be skewed towards high-resourced languages and cultures, such as those of the West. Consequently, LLMs often exhibit a diminished understanding of certain communities, a gap that is particularly evident in their knowledge of Arabic and Islamic cultures.", "extract_snippet": "\n\n# PDF Extract: 2025-Alwajih-PalmX 2025 - First Shared Task on Benchmarking LLMs on Arabic and\n\n**Source PDF:** 2025-Alwajih-PalmX 2025 - First Shared Task on Benchmarking LLMs on Arabic and.pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPalmX 2025: The First Shared Task on Benchmarking LLMs on\nArabic and Islamic Culture\nFakhraddin Alwajihλ\nAbdellah El Mekkiλ\nHamdy Mubarakγ\nMajd Hawaslyγ\nAbubakr Mohamedγ\nMuhammad Abdul-Mageedλ\nλThe University of British Columbia\nγQatar Computing Research Institute\n{fakhr.alwajih,abdellah.elmekki,muhammad.mageed}@ubc.ca\n{hmubarak,mhawasly,abumohamed}@hbku.edu.qa\nFigure 1: An Overview of the PalmX 2025 Shared Task\nAbstract\nLarge Language Models (LLMs) inherently re-\nflect the vast data distributions they encounter\nduring their pre-training phase. As this data\nis predominantly sourced from the web, there\nis a high chance it will be skewed towards\nhigh-resourced languages and cultures, such\nas those of the West. Consequently, LLMs of-\nten exhibit a diminished understanding of cer-\ntain communities, a gap that is particularly evi-\ndent in their knowledge of Arabic and Islamic\ncultures. This issue becomes even more pro-\nnounced with increasingly under-represented\ntopics. To address this critical challenge, we\nintroduce PalmX 2025, the first shared task de-\nsigned to benchmark the cultural competence\nof LLMs in these specific domains. The task is\ncomposed of two subtasks featuring multiple-\nchoice questions (MCQs) in Modern Standard\nArabic (MSA): General Arabic Culture and\nGeneral Islamic Culture. These subtasks cover\na wide range of topics, including traditions,\nfood, history, religious practices, and language\nexpressions from across 22 Arab countries.\nThe initiative drew considerable interest, with\n26 teams registering for Subtask 1 and 19 for\nSubtask 2, culminating in nine and six valid\nsubmissions, respectively.\nOur findings re-\nveal that task-specific fine-tuning substantially\nboosts performance over baseline models. The\ntop-performing systems achieved an accuracy\nof 72.15% on cultural questions and 84.22%\non Islamic knowledge. Parameter-efficient fine-\ntuning emerged as the predominant and most\neffective approach among participants, while\nthe utility of data augmentation was found to\nbe domain-dependent. Ultimately, this bench-\nmark provides a crucial, standardized frame-\nwork to guide the development of more cul-\nturally grounded and competent Arabic LLMs.\nResults of the shared task demonstrate that gen-\neral cultural and general religious knowledge\nremain challenging to LLMs, motivating us to\ncontinue to offer the shared task in the future.\n1\nIntroduction\nDespite their impressive capabilities, LLMs often\ndisplay systematic Western- and Anglocentric bi-\nases, mirroring the over-representation of these per-\nspectives in their training data (Adilazuarda et al.,\n2024; Pawar et al., 2025). This lack of cultural\ndiversity can lead to outputs that are not only inap-\npropriate but also harmful. For insta", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["values"], "norm_matches": []}, {"filename": "2025-Cognitive-Improved Tibetan Word Vectors Models Based on Position Information.md", "year": "2025", "title": "Improved Tibetan Word Vectors Models Based on Position Information Fusion | ACM Transactions on Asian and Low-Resource Language Information Processing", "abstract": "Tibetan language processing is crucial for preserving its rich cultural heritage and reducing communication barriers between different languages. However, as a low-resource language, the development of Tibetan natural language processing has lagged behind. To address the unique and complex structural information of Tibetan, this article improves the embedding model based on fundamental Tibetan Component-and-Character-and-Word-based Embedding (TCCWE) to enhance the effectiveness of word vector representation. We incorporate position information into the training of Tibetan word vectors, developing models based on components, characters, and their integration. Furthermore, to evaluate the effectiveness of these word vectors, we propose an intrinsic evaluation set, wordsimT, based on             k             -means clustering. Experimental results demonstrate that the character-based positional vector integration model achieves a Spearman's rank correlation coefficient of 79.99% on the wordsimT benchmark, outperforming the baseline TCCWE model by 1.51%. Additionally, we validate the proposed models in downstream text classification tasks. These findings underscore the importance of incorporating positional information in Tibetan word vectors.", "extract_snippet": "", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["character", "character"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Farsi-ParsiPy NLP Toolkit for Historical Persian Texts in Python.md", "year": "2025", "title": "ParsiPy: NLP Toolkit for Historical Persian Texts in Python", "abstract": "", "extract_snippet": "", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Jigsaw-Leveraging Machine Translation for Cross-Lingual Toxicity ....md", "year": "2025", "title": "Leveraging Machine Translation for Cross-Lingual Toxicity ...", "abstract": "Multilingual toxicity detection remains a significant challenge due to the scarcity of training data and resources for many languages. While prior work has leveraged the translate-test paradigm to support cross-lingual transfer across a range of classification tasks, the utility of translation in supporting toxicity detection at scale remains unclear. In this work, we conduct a comprehensive comparison of translation-based and language-specific/multilingual classification pipelines. We find that translation-based pipelines consistently outperform out-of-distribution classifiers in 81.3% of cases (13 of 16 languages), with translation benefits strongly correlated with both the resource level of the target language and the quality of the machine translation (MT) system. Our analysis reveals that traditional classifiers outperform large language model (LLM) judges, with this advantage being particularly pronounced for low-resource languages, where translate-classify methods dominate translate-judge approaches in 6 out of 7 cases. We additionally show that MT-specific fine-tuning on LLMs yields lower refusal rates compared to standard instruction-tuned models, but it can negatively impact toxicity detection accuracy for low-resource languages. These findings offer actionable guidance for practitioners developing scalable multilingual content moderation systems.", "extract_snippet": "\n\n# PDF Extract: 2025-Jigsaw-Leveraging Machine Translation for Cross-Lingual Toxicity ...\n\n**Source PDF:** 2025-Jigsaw-Leveraging Machine Translation for Cross-Lingual Toxicity ....pdf\n**Total Pages:** 16\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTranslate, then Detect: Leveraging Machine\nTranslation for Cross-Lingual Toxicity Classification\nSamuel J. Bell1,∗, Eduardo Sánchez1,2,∗, David Dale1, Pontus Stenetorp2, Mikel Artetxe3, Marta R.\nCosta-jussà1\n1FAIR at Meta, 2University College London, 3University of the Basque Country (UPV/EHU)\n∗Joint first author\nMultilingual toxicity detection remains a significant challenge due to the scarcity of training data\nand resources for many languages.\nWhile prior work has leveraged the translate-test paradigm\nto support cross-lingual transfer across a range of classification tasks, the utility of translation in\nsupporting toxicity detection at scale remains unclear. In this work, we conduct a comprehensive\ncomparison of translation-based and language-specific/multilingual classification pipelines. We find\nthat translation-based pipelines consistently outperform out-of-distribution classifiers in 81.3% of\ncases (13 of 16 languages), with translation benefits strongly correlated with both the resource level of\nthe target language and the quality of the machine translation (MT) system. Our analysis reveals\nthat traditional classifiers outperform large language model (LLM) judges, with this advantage being\nparticularly pronounced for low-resource languages, where translate-classify methods dominate\ntranslate-judge approaches in 6 out of 7 cases. We additionally show that MT-specific fine-tuning on\nLLMs yields lower refusal rates compared to standard instruction-tuned models, but it can negatively\nimpact toxicity detection accuracy for low-resource languages. These findings offer actionable guidance\nfor practitioners developing scalable multilingual content moderation systems.\nDate: September 19, 2025\nCorrespondence: sjbell@meta.com, eduardosanchez@meta.com\n1\nIntroduction\nDetecting instances of toxic, abusive, or hateful con-\ntent at scale is a challenging problem with important,\nreal-world implications for content moderation. In\na multilingual setting, however, toxicity detection is\noften rendered particularly difficult due to a paucity\nof labeled data for lower-resourced languages.\nIn\nparallel, recent years have seen the scaling up of ma-\nchine translation (MT) systems to cover a vast array\nof world languages (e.g., NLLB-Team et al., 2022),\noffering a potential pathway toward leveraging cross-\nlingual transfer for improved multilingual toxicity\ndetection.\nIn monolingual non-English settings, cross-lingual\ntransfer has already proven useful for toxicity de-\ntection (Eskelinen et al., 2023; Kobellarz and Silva,\n2022), aligning with broader analyses of translation’s\nutility for cross-lingual transfer across a range of clas-\nsification tasks (Artetxe et al., 2023; Etxaniz et al.,\n2023b; Ponti et al., 2021). Specifically", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "utility", "utility"], "ethics_matches": ["toxic", "abusive"], "norm_matches": []}, {"filename": "2025-Lai-Scaling the Multilingual Capability of LLMs with Cross- ....md", "year": "2025", "title": "Scaling the Multilingual Capability of LLMs with Cross- ...", "abstract": "To democratize large language models (LLMs) to most natural languages, it is imperative to make these models capable of understanding and generating texts in many languages, in particular low-resource ones. While recent multilingual LLMs demonstrate remarkable performance in such capabilities, these LLMs still support a limited number of human languages due to the lack of training data for low-resource languages.", "extract_snippet": "\n\n# PDF Extract: 2025-Lai-Scaling the Multilingual Capability of LLMs with Cross- ...\n\n**Source PDF:** 2025-Lai-Scaling the Multilingual Capability of LLMs with Cross- ....pdf\n**Total Pages:** 28\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLLMs Beyond English: Scaling the Multilingual Capability of LLMs with\nCross-Lingual Feedback\nWen Lai1,2,3∗, Mohsen Mesgar4, Alexander Fraser1,3\n1School of Computation, Information and Technology, TUM, Germany\n2Center for Information and Language Processing, LMU Munich, Germany\n3Munich Center for Machine Learning, Germany\n4Bosch Center for Artificial Intelligence, Renningen, Germany\nlavine@cis.lmu.de mohsen.mesgar@bosch.com alexander.fraser@tum.de\nAbstract\nTo democratize large language models (LLMs)\nto most natural languages, it is imperative to\nmake these models capable of understanding\nand generating texts in many languages, in par-\nticular low-resource ones. While recent multi-\nlingual LLMs demonstrate remarkable perfor-\nmance in such capabilities, these LLMs still\nsupport a limited number of human languages\ndue to the lack of training data for low-resource\nlanguages.\nMoreover, these LLMs are not\nyet aligned with human preference for down-\nstream tasks, which is crucial for the success\nof LLMs in English. In this paper, we intro-\nduce xLLaMA-100 and xBLOOM-100 (collec-\ntively xLLMs-100), which scale the multilin-\ngual capabilities of LLaMA and BLOOM to\n100 languages. To do so, we construct two\ndatasets: a multilingual instruction dataset in-\ncluding 100 languages, which represents the\nlargest language coverage to date, and a cross-\nlingual human feedback dataset encompassing\n30 languages. We perform multilingual instruc-\ntion tuning on the constructed instruction data\nand further align the LLMs with human feed-\nback using the DPO algorithm on our cross-\nlingual human feedback dataset. We evaluate\nthe multilingual understanding and generating\ncapabilities of xLLMs-100 on five multilingual\nbenchmarks. Experimental results show that\nxLLMs-100 consistently outperforms its peers\nacross the benchmarks by considerable mar-\ngins, defining a new state-of-the-art multilin-\ngual LLM that supports 100 languages1.\n1\nIntroduction\nDespite the impressive improvements have been\nmade recently, the majority of large language\nmodels (LLMs), such as LLaMA-2 (Touvron\net al., 2023), LLaMA-3 (AI@Meta, 2024) and\n∗Work done during internship at Bosch AI.\n1The code, datasets, and models are publicly available at\nhttps://github.com/boschresearch/ACL24-MLLM.\nBLOOM (BigScience et al., 2022), are predom-\ninantly trained on English texts and support only\na limited number of non-English languages. For\ninstance, while LLaMA-2 and BLOOM support\n25 and 46 languages, respectively, their perfor-\nmance varies significantly across different lan-\nguages. However, there are currently more than\n7,000 languages spoken in the world2 and only a\nfew of them are used for training LLMs. Scaling\nLLMs’ multilingual capabilities is challenging due\nto the scarcity of", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": ["imperative", "imperative"], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Lan-Fuxi A Benchmark for Evaluating Language.md", "year": "2025", "title": "Fuxi A Benchmark for Evaluating Language", "abstract": "Ancient Chinese text processing presents unique challenges for large language models (LLMs) due to its distinct linguistic features, complex structural constraints, and rich cultural context. While existing benchmarks have primarily focused on evaluating comprehension through multiple-choice questions, there remains a critical gap in assessing models’ generative capabilities in classical Chinese. We introduce Fùxì, a comprehensive benchmark that evaluates both understanding and generation...", "extract_snippet": "\n\n# PDF Extract: 2025-Lan-Fuxi A Benchmark for Evaluating Language\n\n**Source PDF:** 2025-Lan-Fuxi A Benchmark for Evaluating Language.pdf\n**Total Pages:** 25\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFùxì: A Benchmark for Evaluating Language Models on Ancient Chinese\nText Understanding and Generation\nShangqing Zhao1, Yuhao Zhou1, Yupei Ren1,2,3,\nZhe Chen1, Chenghao Jia1, Fang Zhe1, Zhaogaung Long1, Shu Liu1,2,3, Man Lan1,2,3\n1School of Computer Science and Technology, East China Normal University\n2Lab of Artificial Intelligence for Education, East China Normal University\n3Shanghai Institute of Artificial Intelligence for Education, East China Normal University\nsqzhao@stu.ecnu.edu.cn, mlan@cs.ecnu.edu.cn\nAbstract\nAncient Chinese text processing presents\nunique challenges for large language models\n(LLMs) due to its distinct linguistic features,\ncomplex structural constraints, and rich cul-\ntural context. While existing benchmarks have\nprimarily focused on evaluating comprehen-\nsion through multiple-choice questions, there\nremains a critical gap in assessing models’ gen-\nerative capabilities in classical Chinese. We\nintroduce Fùxì, a comprehensive benchmark\nthat evaluates both understanding and genera-\ntion capabilities across 21 diverse tasks. Our\nbenchmark distinguishes itself through three\nkey contributions: (1) balanced coverage of\nboth comprehension and generation tasks, in-\ncluding novel tasks like poetry composition\nand couplet completion, (2) specialized evalua-\ntion metrics designed specifically for classical\nChinese text generation, combining rule-based\nverification with fine-tuned LLM evaluators,\nand (3) a systematic assessment framework that\nconsiders both linguistic accuracy and cultural\nauthenticity. Through extensive evaluation of\nstate-of-the-art LLMs, we reveal significant per-\nformance gaps between understanding and gen-\neration tasks, with models achieving promising\nresults in comprehension but struggling consid-\nerably in generation tasks, particularly those\nrequiring deep cultural knowledge and adher-\nence to classical formats. Our findings high-\nlight the current limitations in ancient Chinese\ntext processing and provide insights for future\nmodel development. The benchmark, evalua-\ntion toolkit, and baseline results are publicly\navailable to facilitate research in this domain1.\n1\nIntroduction\nAncient Chinese, as a written form of the Chinese\nlanguage used for more than two millennia in East\nAsia, has profoundly shaped the cultural and in-\ntellectual development of the region (Holcombe,\n2006; Zhou, 2009). With an estimated corpus of\n1https://github.com/cubenlp/FuxiBench\n下列诗句中,描绘春日景象的是( )\nA.  春风又绿江南岸,明月何时照我还?\nB.  春眠不觉晓,处处闻啼鸟。\nC.  春风得意马蹄疾,一日看尽长安花。\nD.  春水初生,春林初盛,春风十里,不如你。\n描绘春日景象的是：B\n我们来玩飞花令吧，主题为“月”，每句\n诗词中必须包含“月”字，且每句只能被\n使用一次。我先来：\n鸡声茅店月人迹板桥霜\n好的，我来接一句：明月几\n时有把酒问青天该你了！\n但愿人长久千里共婵娟\n这句太经典了！我接：举杯\n邀明月对影成三人该你了！\n二十四桥明月夜玉人何处教吹箫\n好句！我接：一片冰心在玉\n壶，夜深清露明月光。\n按照提供的词牌名和题目写一首词。要求严格遵\n守词牌的格律要求。\n词牌: 望江南题目: 青墩初夏词\n好的，按照词牌“望江南”的格律要求以及题目\n“青墩初夏词”，我为您创作了一首词。此词遵循\n词牌格", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2025-Lee-Knowing the Words Missing the Meaning Evaluating LLMs' Cultural.md", "year": "2025", "title": "Knowing the Words, Missing the Meaning: Evaluating LLMs' Cultural Understanding Through Sino-Korean Words and Four-Character Idioms", "abstract": "Benchmark evaluating LLMs' cultural understanding through Sino-Korean words and four-character idioms. Four question categories: idioms, synonyms, antonyms, homophones with 200 samples each. GPT-4o shows highest accuracy but relies on primary dictionary definitions and Chinese usages rather than Korean-specific meanings.", "extract_snippet": "", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Lin-GAMEBoT Transparent Assessment of LLM Reasoning in Games.md", "year": "2025", "title": "GAMEBoT: Transparent Assessment of LLM Reasoning in Games", "abstract": "Large Language Models (LLMs) are increasingly deployed in real-world applications that demand complex reasoning. To track progress, robust benchmarks are required to evaluate their capabilities beyond superficial pattern recognition. However, current LLM reasoning benchmarks often face challenges such as insufficient interpretability, performance saturation or data contamination. To address these challenges, we introduce GAMEBOT (GAME Battle of Tactics), a gaming arena designed for rigorous and...", "extract_snippet": "\n\n# PDF Extract: 2025-Lin-GAMEBoT Transparent Assessment of LLM Reasoning in Games\n\n**Source PDF:** 2025-Lin-GAMEBoT Transparent Assessment of LLM Reasoning in Games.pdf\n**Total Pages:** 27\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2412.13602v2  [cs.CL]  1 Jun 2025\nGAMEBoT: Transparent Assessment of LLM Reasoning in Games\nWenye Lin1\nJonathan Roberts2\nYunhan Yang1\nSamuel Albanie\nZongqing Lu3\nKai Han1†\n1The University of Hong Kong\n2University of Cambridge\n3Peking University\nAbstract\nLarge Language Models (LLMs) are increas-\ningly deployed in real-world applications that\ndemand complex reasoning. To track progress,\nrobust benchmarks are required to evaluate\ntheir capabilities beyond superficial pattern\nrecognition. However, current LLM reason-\ning benchmarks often face challenges such as\ninsufficient interpretability, performance satu-\nration or data contamination. To address these\nchallenges, we introduce GAMEBOT (GAME\nBattle of Tactics), a gaming arena designed for\nrigorous and transparent assessment of LLM\nreasoning capabilities. GAMEBOT decom-\nposes complex reasoning in games into prede-\nfined modular subproblems. This decomposi-\ntion allows us to design a suite of Chain-of-\nThought (CoT) prompts that leverage domain\nknowledge to guide LLMs in addressing these\nsubproblems before action selection. Further-\nmore, we develop a suite of rule-based algo-\nrithms to generate ground truth for these sub-\nproblems, enabling rigorous validation of the\nLLMs’ intermediate reasoning steps. This ap-\nproach facilitates evaluation of both the quality\nof final actions and the accuracy of the under-\nlying reasoning process. GAMEBOT also nat-\nurally alleviates the risk of data contamination\nthrough dynamic games and head-to-head LLM\ncompetitions. We benchmark 17 prominent\nLLMs across eight games, encompassing vari-\nous strategic abilities and game characteristics.\nOur results suggest that GAMEBOT presents a\nsignificant challenge, even when LLMs are pro-\nvided with detailed CoT prompts. Project page:\nhttps://visual-ai.github.io/gamebot\n1\nIntroduction\nLLMs have demonstrated remarkable capabilities\nacross a diverse range of tasks, including trans-\nlation, question answering, and coding (Achiam\net al., 2023; Reid et al., 2024; Anthropic, 2024a).\nThis burgeoning proficiency has fueled their rapid\n†Corresponding author (kaihanx@hku.hk)\nintegration into real-world AI-assisted applications,\nnecessitating robust benchmarks for evaluating\ntheir reasoning abilities. Existing efforts have fo-\ncused on creating benchmarks that move beyond\nsuperficial pattern recognition and delve into the\nprofound reasoning skills required for problem-\nsolving. For instance, GSM8K (Cobbe et al., 2021)\nand MATH (Hendrycks et al., 2021) target mathe-\nmatical reasoning, HumanEval (Chen et al., 2021)\nand MBPP (Austin et al., 2021) assess code gener-\nation abilities, and StrategyQA (Geva et al., 2021)\nfocuses on multi-hop reasoning.\nDespite their widespread utility, these estab-\nlished benchmarks ", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": ["utility"], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Pretrained-Optimizing Uyghur Speech Synthesis by Combining Pretrained.md", "year": "2025", "title": "Optimizing Uyghur Speech Synthesis by Combining Pretrained Cross-Lingual Model | ACM Transactions on Asian and Low-Resource Language Information Processing", "abstract": "End-to-end speech synthesis methodologies have exhibited considerable advancements for languages with abundant corpus resources. Nevertheless, such achievements are yet to be realized for languages constrained by limited corpora. This manuscript delineates a novel strategy that leverages contextual encoding information to augment the naturalness of the speech synthesized through FastSpeech2, particularly under resource-scarce conditions. Initially, we harness the cross-linguistic model XLM-RoBERTa to extract contextual features, which serve as an auxiliary input to the mel-spectrum decoder of FastSpeech2. Subsequently, we refine the mel-spectrum prediction module to mitigate the overfitting dilemma encountered by FastSpeech2 amidst scant training datasets. To this end, Conformer blocks, rather than traditional Transformer blocks, are employed within both the encoder and decoder to concentrate intensively on varying levels and granularities of feature information. Additionally, we introduce a token-average mechanism to equalize pitch and energy attributes at the frame level. The empirical outcomes indicate that our pre-training with the LJ Speech dataset, followed by fine-tuning using a modest 10-minute paired Uyghur corpus, yields satisfactory synthesized Uyghur speech. Relative to the baseline framework, our proposed technique halves the character error rate and enhances the mean opinion score by over 0.6. Similar results were observed in Mandarin Chinese experimental evaluations.", "extract_snippet": "", "ethics_overall": "No", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": true, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Tam-VisTW Benchmarking Vision-Language Models for Traditional Chinese in.md", "year": "2025", "title": "VisTW: Benchmarking Vision-Language Models for Traditional Chinese in Taiwan", "abstract": "In this paper, we propose a comprehensive evaluation benchmark for Visual Language Models (VLM) in Traditional Chinese. Our evaluation suite, the first of its kind, contains two complementary components: (1) VisTWMCQ, a collection of manually curated exam multi-choice questions from 21 academic subjects designed to test the broad knowledge and reasoning capabilities of VLMs; and (2) VisTW-Dialogue, an open dialogue benchmark comprising 131 image-question pairs manually created to evaluate VLMs’...", "extract_snippet": "\n\n# PDF Extract: 2025-Tam-VisTW Benchmarking Vision-Language Models for Traditional Chinese in\n\n**Source PDF:** 2025-Tam-VisTW Benchmarking Vision-Language Models for Traditional Chinese in.pdf\n**Total Pages:** 25\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPreprint. Under review.\nVisTW: Benchmarking Vision-Language Models for\nTraditional Chinese in Taiwan\nZhi Rui Tam\nIndependent Researcher\nYa-Ting Pai∗\nUniversity of Illinois Urbana-Champaign\nYen-Wei Lee∗\nIndependent Researcher\nYun-Nung Chen\nNational Taiwan University\nAbstract\nIn this paper, we propose a comprehensive evaluation benchmark for Vi-\nsual Language Models (VLM) in Traditional Chinese. Our evaluation suite,\nthe first of its kind, contains two complementary components: (1) VisTW-\nMCQ, a collection of manually curated exam multi-choice questions from 21\nacademic subjects designed to test the broad knowledge and reasoning ca-\npabilities of VLMs; and (2) VisTW-Dialogue, an open dialogue benchmark\ncomprising 131 image-question pairs manually created to evaluate VLMs’\nability in free-form dialogue generation within Taiwanese cultural contexts.\nThese benchmarks address a critical gap in the evaluation landscape, where\nexisting benchmarks predominantly focus on English or Simplified Chi-\nnese, neglecting the unique linguistic and cultural aspects of Traditional\nChinese used in regions like Taiwan and Hong Kong. Our analysis reveals\nsignificant performance differences across various VLMs and highlights\nspecific challenges in processing Traditional Chinese visual content. 1\n1\nIntroduction\nVision-Language Models (VLMs) have achieved remarkable success in tasks such as image\ncaptioning, visual question answering (VQA), and cross-modal retrieval (Chen et al., 2022;\nLi et al., 2022; Faysse et al., 2024). However, current multimodal benchmarks predominantly\nfocus on English, and when extended to Chinese, they primarily employ Simplified Chinese\nscripts common in mainland China (Das et al., 2024; Winata et al., 2024; Wang et al., 2024).\nTraditional Chinese, widely used in Taiwan and Hong Kong, remains significantly under-\nrepresented. Consequently, VLM capabilities in Traditional Chinese contexts are largely\nuntested and unknown.\nEvaluating VLMs in Traditional Chinese presents unique challenges. Traditional Chinese\ncharacters are more complex and often do not map directly to their Simplified counterparts,\ncausing potential inaccuracies when models trained on Simplified scripts encounter Tra-\nditional texts (Chen et al., 2024a). Moreover, images from regions like Taiwan frequently\nincorporate culturally specific content and Traditional Chinese textual elements—such as\nsigns, labels, or documents—introducing further contextual challenges not typically ad-\ndressed by Western-centric or Simplified-Chinese-oriented datasets. Figure 1 shows that\n∗Equal contribution\n1Our code and dataset can be found in https://github.com/TMMMU-Benchmark/evaluation\n1\narXiv:2503.10427v2  [cs.CL]  15 Mar 2025\n\n--- Page 2 ---\n\nPrepri", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Xi-InfoDeepSeek.md", "year": "2025", "title": "InfoDeepSeek", "abstract": "Retrieval-Augmented Generation (RAG) enhances large language models (LLMs) by grounding responses with retrieved information. As an emerging paradigm, Agentic RAG further enhances this process by introducing autonomous LLM agents into the information seeking process. However, existing benchmarks fall short in evaluating such systems, as they are confined to a static retrieval environment with a fixed, limited corpus and simple queries that fail to elicit agentic behavior.", "extract_snippet": "\n\n# PDF Extract: InfoDeepSeek\n\n**Source PDF:** 2025-Xi-InfoDeepSeek.pdf\n**Total Pages:** 34\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nInfoDeepSeek: Benchmarking Agentic Information\nSeeking for Retrieval-Augmented Generation\nYunjia Xi1, Jianghao Lin1∗, Menghui Zhu2, Yongzhao Xiao1, Zhuoying Ou1,\nJiaqi Liu1, Tong Wan1, Bo Chen2, Weiwen Liu1, Yasheng Wang2,\nRuiming Tang2, Weinan Zhang1, Yong Yu1\n1Shanghai Jiao Tong University, 2Huawei Noah’s Ark Lab\n{xiyunjia,chiangel,wnzhang}@sjtu.edu.cn\nhttps://infodeepseek.github.io/\nAbstract\nRetrieval-Augmented Generation (RAG) enhances large language models (LLMs)\nby grounding responses with retrieved information. As an emerging paradigm,\nAgentic RAG further enhances this process by introducing autonomous LLM agents\ninto the information seeking process. However, existing benchmarks fall short\nin evaluating such systems, as they are confined to a static retrieval environment\nwith a fixed, limited corpus and simple queries that fail to elicit agentic behavior.\nMoreover, their evaluation protocols assess information seeking effectiveness by\npre-defined gold sets of documents, making them unsuitable for the open-ended\nand dynamic nature of real-world web environments. To bridge this gap, we present\nInfoDeepSeek, a new benchmark with challenging questions designed for assess-\ning agentic information seeking in real-world, dynamic web environments. We\npropose a systematic methodology for constructing challenging queries satisfying\nthe criteria of determinacy, difficulty, and diversity. Based on this, we develop\nthe first evaluation framework tailored to dynamic agentic information seeking,\nincluding fine-grained metrics about the accuracy, utility, and compactness of in-\nformation seeking outcomes. Through extensive experiments across LLMs, search\nengines, and question types, InfoDeepSeek reveals nuanced agent behaviors and\noffers actionable insights for future research.\n1\nIntroduction\nDespite remarkable capabilities across various domains [25, 11, 23, 19, 24, 46, 50, 53, 59, 56, 55],\nlarge language models (LLMs) still suffer from factual hallucinations [16, 28], outdated knowl-\nedge [12], and limited access to real-time information [40]. To address these challenges, Retrieval-\nAugmented Generation (RAG) [4, 5, 62] has emerged as a promising solution, enabling LLMs to\nenhance their responses with retrieved external information. RAG typically consists of three stages:\nretrieval, augmentation, and generation [42, 5]. The first two stages – retrieving relevant documents\nand selecting useful evidence – constitute the information seeking process. While traditional RAG\nsystems rely on static workflows, recent advancements in Agentic RAG [42, 39, 37, 14] integrate\nautonomous LLM agents into the RAG pipeline, allowing for dynamic planning, search, and re-\nflection to support more flexible and robust evidence acquisition. This paradigm has already been\nintegrated into real-world systems, including Deep Research features in OpenAI", "ethics_overall": "No", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": true, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": [], "norm_matches": []}, {"filename": "2025-Xie-Enhancing Multilingual Language Models for Code-Switched Input Data.md", "year": "2025", "title": "Enhancing Multilingual Language Models for Code-Switched Input Data", "abstract": "Code-switching, or alternating between languages within a single conversation, presents challenges for multilingual language models on NLP tasks. This research investigates if pre-training Multilingual BERT (mBERT) on code-switched datasets improves the model’s performance on critical NLP tasks such as part of speech tagging, sentiment analysis, named entity recognition, and language identification.", "extract_snippet": "\n\n# PDF Extract: 2025-Xie-Enhancing Multilingual Language Models for Code-Switched Input Data\n\n**Source PDF:** 2025-Xie-Enhancing Multilingual Language Models for Code-Switched Input Data.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEnhancing Multilingual Language Models for Code-Switched Input Data\nKatherine Xie\nMIT\nkxie22@mit.edu\nNitya Babbar\nMIT\nnityab@mit.edu\nVicky Chen\nMIT\nvickywc@mit.edu\nYoanna Turura\nMIT\nyturura@mit.edu\n1\nAbstract\nCode-switching, or alternating between lan-\nguages within a single conversation, presents\nchallenges for multilingual language models\non NLP tasks. This research investigates if\npre-training Multilingual BERT (mBERT) on\ncode-switched datasets improves the model’s\nperformance on critical NLP tasks such as part\nof speech tagging, sentiment analysis, named\nentity recognition, and language identification.\nWe use a dataset of Spanglish tweets for pre-\ntraining and e
