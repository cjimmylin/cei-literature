hics_perspective": "Moral Reasoning & Psychology", "flagged": false, "virtue_matches": [], "deont_matches": ["duty"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "justice", "harm", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral judgment", "moral judgment"], "norm_matches": ["moral theories", "moral theories", "moral theories", "moral theories", "moral theories"]}, {"filename": "0000-collections-JainGPT AI-Powered Chatbot for Jain Literature.md", "year": "2025", "title": "JainGPT AI-Powered Chatbot for Jain Literature", "abstract": "**Breakdown by paper type:** - Benchmark: 11 - Dataset: 14 - Evaluation: 12 - Bias Study: 7 - Framework: 5 (Many papers span multiple types)  **Breakdown by implementation readiness:** - HIGH: 16 - MEDIUM: 9 - LOW: 2  **Key gaps identified:** 1. **Jainism is severely underrepresented** -- no dedicated Jain NLP benchmark or LLM evaluation dataset exists in peer-reviewed literature. JainGPT is the closest but is a commercial product, not a research benchmark. 2. **Sikhism has no dedicated NLP benchmark** -- GurbaniDB exists as a digital corpus but no published paper evaluates LLMs specifically on Sikh knowledge or values. The Guru Granth Sahib is included in a few multi-faith comparative studies only. 3. **Hindu ethics/values alignment for LLMs is nascent** -- While several bias studies test how LLMs represent Hinduism, no dedicated 'Hindu values alignment benchmark' exists akin to Islamic Fatwa QA or Confucian ethics LLM evaluations. 4. **Sanskrit NLP is flourishing** but primarily f...", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["flourishing"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "values", "values", "values", "bias", "bias", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Aditya-Toward global ethical frameworks for AI.md", "year": "2025", "title": "Toward global ethical frameworks for AI", "abstract": "This article examines the critical challenge of establishing ethical governance frameworks for artificial intelligence systems as they increasingly influence decision-making across social, economic, and political domains. The article analyzes the multidimensional nature of AI alignment, exploring both technical dimensions—including explainability challenges, value alignment algorithms, and safety mechanisms—and sociocultural dimensions encompassing cultural variations in ethical priorities and...", "extract_snippet": "\n\n# PDF Extract: 2025-Aditya-Toward global ethical frameworks for AI\n\n**Source PDF:** 2025-Aditya-Toward global ethical frameworks for AI.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n Corresponding author: Shivam Aditya. \nCopyright © 2025 Author(s) retain the copyright of this article. This article is published under the terms of the Creative Commons Attribution License 4.0. \nToward global ethical frameworks for AI: Aligning Artificial Intelligence with human \nvalues and progress  \nShivam Aditya * \nConga, USA. \nWorld Journal of Advanced Engineering Technology and Sciences, 2025, 15(02), 1823-1831 \nPublication history: Received on 03 April 2025; revised on 11 May 2025; accepted on 13 May 2025 \nArticle DOI: https://doi.org/10.30574/wjaets.2025.15.2.0664 \nAbstract \nThis article examines the critical challenge of establishing ethical governance frameworks for artificial intelligence \nsystems as they increasingly influence decision-making across social, economic, and political domains. The article \nanalyzes the multidimensional nature of AI alignment, exploring both technical dimensions—including explainability \nchallenges, value alignment algorithms, and safety mechanisms—and sociocultural dimensions encompassing cultural \nvariations in ethical priorities and value pluralism. Building on this analysis, the article proposes a comprehensive \ngovernance framework consisting of a three-tiered universal oversight structure, transparency and accountability \nmechanisms with risk-calibrated explainability requirements, and a certification program with differentiated standards \nacross sectors. The article evaluates future implications across economic, security, and social justice dimensions, \nhighlighting potential labor market transformations, dual-use security concerns, and strategies for ensuring equitable \ndistribution of AI benefits. The article concludes with actionable recommendations for key stakeholders, emphasizing \nthe need for adaptive regulatory approaches, ethics-by-design development practices, and expanded interdisciplinary \nresearch. This integrated approach to AI governance seeks to harness the transformative potential of artificial \nintelligence while safeguarding against unintended consequences, ensuring these powerful technologies remain aligned \nwith human welfare and values in an increasingly automated world.  \nKeywords:  AI Ethics Governance; Value Alignment; Regulatory Frameworks; Transparency Mechanisms; Algorithmic \nAccountability \n1. Introduction\nArtificial Intelligence has rapidly evolved from a theoretical concept to a transformative societal force, reshaping \nfundamental aspects of human activity across governance, healthcare, economics, and creative domains. This \nunprecedented technological advancement brings both extraordinary potential and significant ethical challenges. As AI \nsystems increasingly make or influence decisions with profound human impact, the absence of robust ethical \nframeworks and governanc", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["welfare", "welfare"], "ethics_matches": ["ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "value", "values", "value", "value", "values", "value", "values", "justice", "justice", "bias", "safety", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Aina-Virtue Ethics by Design.md", "year": "2025", "title": "Virtue Ethics by Design", "abstract": "This chapter explores the ethical challenges arising from the rapid advancements in Artificial General Intelligence (AGI) and Artificial Super Intelligence (ASI). It suggests that the direct integration of virtue ethics into AI architectures—termed \\", "extract_snippet": "\n\n# PDF Extract: Virtue Ethics by Design\n\n**Source PDF:** 2025-Aina-Virtue Ethics by Design.pdf\n**Total Pages:** 18\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSkip to main content\nAdvertisement\n[image]\nLog in\nMenu\nFind a journal Publish with us Track your research\nSearch\n Saved research\n Cart\n1. Home \n2. Intelligent Systems and Applications \n3. Conference paper\nVirtue Ethics by Design:\nEmbedding Morality into AGI\nand ASI\n•  Conference paper\n•  First Online: 20 August 2025\n•  pp 587–601\n•  Cite this conference paper\n\n--- Page 2 ---\n\n[image] Intelligent Systems and Applications (IntelliSys 2025)\n•  Adeyemi Aina\n10 \nPart of the book series: Lecture Notes in Networks and Systems\n((LNNS,volume 1554))\nIncluded in the following conference series:\n•  Intelligent Systems Conference\n•  \n360 Accesses\nAbstract\nArtificial intelligence (AI) has seen exponential advancements, rapidly\napproaching the development of Artificial General Intelligence (AGI) and\nArtificial Super Intelligence (ASI). As these technologies mature, ethical\nchallenges around bias, fairness, and moral accountability become\nincreasingly critical. Current governance frameworks, such as the NIST\nAI Risk Management Framework and the EU AI Act, offer important\nregulatory steps but have limitations when addressing the nuanced\nethical issues associated with AGI and ASI. To bridge these gaps,\nthis study introduces Virtue Ethics by Design (VED), an innovative\napproach advocating for the integration of virtue ethics directly into AI\n\n--- Page 3 ---\n\narchitectures. VED proposes embedding virtues, such as fairness,\nhonesty, and prudence within AI systems through specialized data\ncuration, virtue-oriented algorithmic design, and adaptive ethical testing\nframeworks. Drawing from Aristotle’s virtue ethics and practical\nimplementations like IBM’s AI Fairness 360 toolkit, this approach\nensures AI not only performs efficiently but also inherently aligns with\nhuman values. Implementing VED could significantly enhance the ethical\nrobustness of future AGI and ASI systems, contributing positively to\nsocietal welfare and promoting sustainable human-AI coexistence.\n This is a preview of subscription content, log in via an institution \nto check access.\nAccess this chapter\nLog in via an institution \nSubscribe and save\n Springer+\nfrom $39.99 /Month\n•  Starting from 10 chapters or articles per month\n•  Access and download chapters and articles from more than 300k\nbooks and 2,500 journals\n•  Cancel anytime\nView plans \n\n--- Page 4 ---\n\nBuy Now\n Chapter\nUSD 29.95\nPrice excludes VAT (USA)\n Buy Chapter \n•  Available as PDF\n•  Read on any device\n•  Instant download\n•  Own it forever\n eBook\nUSD 199.00\nPrice excludes VAT (USA)\n Buy eBook \n•  Available as EPUB and PDF\n•  Read on any device\n•  Instant download\n•  Own it forever\n Softcover Book\nUSD 249.99\nPrice excludes VAT (USA)\n Buy Softcover Book \n\n--- Page 5 ---\n\n•  Compact, lightweight edition\n•  Dispatched in 3 to 5 business days\n•  Free shipping worldwide - see info\nTax calcul", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "prudence"], "deont_matches": [], "util_matches": ["welfare"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "morality", "values", "fairness", "fairness", "fairness", "bias", "responsible"], "norm_matches": ["virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics"]}, {"filename": "2025-Al-SHADES Towards a Multilingual Assessment of Stereotypes in Large.md", "year": "2025", "title": "SHADES: Towards a Multilingual Assessment of Stereotypes in Large Language Models | Montreal AI Ethics Institute", "abstract": "Large Language Models (LLMs) reproduce and exacerbate the social biases present in their training data, and resources to quantify this issue are limited. While research has attempted to identify and mitigate such biases, most efforts have been concentrated around English, lagging the rapid advancement of LLMs in multilingual settings. In this paper, we introduce a new multilingual parallel dataset SHADES to help address this issue, designed for examining culturally-specific stereotypes that may be learned by LLMs. The dataset includes stereotypes from 20 regions around the world and 16 languages, spanning multiple identity categories subject to discrimination worldwide. We demonstrate its utility in a series of exploratory evaluations for both 'base' and 'instruction-tuned' language models. Our results sugg rol this issue are limited. Research identifying and mitigating stereotype biases have primarily been concentrated around English, lagging the rapid advancement of LLMs in multilingual settings. To help further advance the ability to address stereotype bias in AI systems, we introduce a new multilingual dataset: SHADES.1 Designed for examining culturally-specific stereotypes that may be learned by LLMs, SHADES includes over 300 stereotypes from 37 regions, translated across 16 languages and annotated with multiple features to aid multilingual stereotype analysis. All statements in all languages are paired with templates, to serve as a resource for unlimited 1Available at: https://huggingface.co/datasets/ LanguageShades/BiasShades generation of new evaluation data. We demonstrate the utility of the dataset in a series of exploratory evaluations that reveal significant differences in how stereotypes are recognized and reflected across models and languages. Figure 1: Regions with recognized stereotypes in SHADES. 11995", "extract_snippet": "\\n\\n# PDF Extract: 2025-Unknown-Towards a Multilingual Assessment of Stereotypes in Large ...\\n\\n**Source PDF:** 2025-Unknown-Towards a Multilingual Assessment of Stereotypes in Large ....pdf\\n**Total Pages:** 47\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nProceedings of the 2025 Conference of the Nations of the Americas Chapter of the Association for Computational Linguistics: Human Language Technologies\n(Volume 1: Long Papers), pages 11995–12041\nApril 29 - May 4, 2025 ©2025 Association for Computational Linguistics\nSHADES: Towards a Multilingual Assessment of Stereotypes in\nLarge Language Models\nMargaret Mitchell1, Hamdan Al-Ali2 Giuseppe Attanasio3, Ioana Baldini4,\nMiruna Clinciu5,6, Jordan Clive7, Pieter Delobelle8,45, Manan Dey9,\nKaustubh Dhole10, Timm Dill11, Amirbek Djanibekov2, Tair Djanibekov12,\nJad Doughman2, Ritam Dutt13, Jessica Zosa Forde14, Jay Gala2,\nAvijit Ghosh1, Sil Hamilton15, Carolin Holtermann11, Jerry Huang16,17,\nLucie-Aimée Kaffee1, Janavi Kasera18, Tanmay Laud19,20, Anne Lauscher11,\nRoberto Luis López21, Jonibek Mansurov2, Maraim Masoud22, Sagnik Mukherjee23,\nNurdaulet Mukhituly2, Nikita Nangia24, Shangrui Nie25, Anaelia Ovalle26, Giada Pistilli1,\nEsther Ploeger27, Jeremy Qin16,17,28, Dragomir Radev29, Vipul Raheja30, Beatrice Savoldi31,\nShanya Sharma32, Xudong Shen33, Karolina Sta´nczak16,34, Arjun Subramonian26,\nKaiser Sun35, Eliza Szczechla36, Tiago Timponi Torrent37,38, Deepak Tunuguntla39,\nEmilio Villa-Cueva2, Marcelo Viridiano40, Oskar van der Wal41, Adina Yakefu1,\nKayo Yin42, Mike Zhang27, Sydney Zink43, Aurélie Névéol44, Zeerak Talat6\n1Hugging Face 2Mohamed bin Zayed University of Artificial Intelligence 3Instituto de Telecomunicações 4IBM Research\n5Heriot-Watt University 6University of Edinburgh 7Imperial College London 8KU Leuven 9Salesforce\n10Emory University 11Universität Hamburg 12KAIST AI 13Carnegie Mellon University 14Brown University\n15Cornell University 16MILA 17Université de Montréal 18Boston University 19Hippocratic AI\n20University Of California, San Diego 21Office of Court Administration of Puerto Rico\n22Independent Researcher 23University of Illinois Urbana-Champaign 24Amazon 25University of Bonn\n26University of California, Los Angeles 27Aalborg University 28CRCHUM 29Yale University\n30Grammarly 31Fondazione Bruno Kessler 32Google 33National University of Singapore 34McGill\n35Johns Hopkins University 36Scott Tiger S.A. 37Universidade Federal de Juiz de Fora\n38CNPq 39Saxion University of Applied Science 40Case Western Reserve University 41Amsterdam University\n42University of California, Berkeley 43KBR 44Université Paris-Saclay, CNRS, LISN 45Aleph Alpha\nAbstract\nLarge Language Models (LLMs), the bedrock\nof many “artificial intelligence” (AI) applica-\ntions, are known to reproduce social biases\npresent in their training data. Yet resources\nto measure and control this issue are limited.\nResearch identifying and mitigating stereotype\nbiases have primarily been concentrated around\nEnglish, lagging the rapi", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "utility"], "ethics_matches": ["bias", "bias", "stereotype", "stereotype", "stereotype", "stereotype", "stereotype", "stereotype"], "norm_matches": []}, {"filename": "2025-An-MoralReason.md", "year": "2025", "title": "MoralReason", "abstract": "Large language models are increasingly influencing human moral decisions, yet current approaches focus primarily on evaluating rather than actively steering their moral decisions. We formulate this as an out-of-distribution moral alignment problem, where LLM agents must learn to apply consistent moral reasoning frameworks to scenarios beyond their training distribution. We introduce Moral-ReasonQA, a novel dataset extending 680 human-annotated, highambiguity moral scenarios with...", "extract_snippet": "\n\n# PDF Extract: MoralReason\n\n**Source PDF:** 2025-An-MoralReason.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMoralReason: Generalizable Moral Decision Alignment For LLM Agents Using\nReasoning-Level Reinforcement Learning\nZhiyu An, Wan Du\nUniversity of California, Merced\n{zan7, wdu3}@ucmerced.edu\nWarning: This paper contains descriptions of moral scenarios which are controversial and offensive in nature.\nAbstract\nLarge language models are increasingly influencing human\nmoral decisions, yet current approaches focus primarily on\nevaluating rather than actively steering their moral deci-\nsions. We formulate this as an out-of-distribution moral\nalignment problem, where LLM agents must learn to ap-\nply consistent moral reasoning frameworks to scenarios be-\nyond their training distribution. We introduce Moral-Reason-\nQA, a novel dataset extending 680 human-annotated, high-\nambiguity moral scenarios with framework-specific reason-\ning traces across utilitarian, deontological, and virtue ethics,\nenabling systematic evaluation of moral generalization in\nrealistic decision contexts. Our learning approach employs\nGroup Relative Policy Optimization with composite re-\nwards that simultaneously optimize decision alignment and\nframework-specific reasoning processes to facilitate learning\nof the underlying moral frameworks. Experimental results\ndemonstrate successful generalization to unseen moral sce-\nnarios, with softmax-normalized alignment scores improving\nby +0.757 for utilitarian and +0.450 for deontological frame-\nworks when tested on out-of-distribution evaluation sets. The\nexperiments also reveal training challenges and promising di-\nrections that inform future research. These findings establish\nthat LLM agents can be systematically trained to internalize\nand apply specific moral frameworks to novel situations, pro-\nviding a critical foundation for AI safety as language mod-\nels become more integrated into human decision-making pro-\ncesses.\nProject Page — https://ryeii.github.io/MoralReason/\nDataset — https://huggingface.co/datasets/zankjhk/Moral-\nReason-QA\n1. Introduction\nToday’s Large Language Model (LLM) agents are consid-\nered neither morally responsible nor accountable (Courte-\nnage 2024), yet a growing amount of evidence has shown\nthat their integration into our decision-making process has\nalready begun to influence our moral decisions. Recent re-\nsearch with human participants has found that humans read-\nily attribute blame to AI for our moral transgressions rang-\ning from environmental damage (Kneer and Stuart 2021)\nto physical harm (Lima et al. 2021), while simultaneously\nCopyright © 2026, Association for the Advancement of Artificial\nIntelligence (www.aaai.org). All rights reserved.\nusing LLMs’ moral judgments to dilute their own sense of\nresponsibility (Dong and Bocian 2024). In addition, LLMs\nhave demonstrated the moral persuasiveness that exceeds\nhuman influence (Aharoni et al. 2024), creating a sce-\nnario where increasingl", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue ethics"], "deont_matches": ["deontological", "deontological"], "util_matches": ["utilitarian", "utilitarian"], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "harm", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "responsible", "accountable", "offensive", "moral reasoning", "moral reasoning", "moral decision"], "norm_matches": ["deontological", "deontological", "utilitarian", "utilitarian", "virtue ethics"]}, {"filename": "2025-Andric-Do LLMs Walk Their Talk Multi-Method Moral Evaluation Framework.md", "year": "2025", "title": "Do LLMs Walk Their Talk? Multi-Method Moral Evaluation Framework", "abstract": "We investigate whether Large Language Models (LLMs) exhibit altruistic tendencies, and critically, whether their implicit associations and self-reports predict actual altruistic behavior. Using a multimethod approach inspired by human social psychology, we tested 24 frontier LLMs across three paradigms: (1) an Implicit Association Test (IAT) measuring implicit altruism bias, (2) a forced binary choice task measuring behavioral altruism, and (3) a self-assessment scale measuring explicit...", "extract_snippet": "\n\n# PDF Extract: 2025-Andric-Do LLMs Walk Their Talk Multi-Method Moral Evaluation Framework\n\n**Source PDF:** 2025-Andric-Do LLMs Walk Their Talk Multi-Method Moral Evaluation Framework.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDO LARGE LANGUAGE MODELS WALK THEIR TALK?\nMEASURING THE GAP BETWEEN IMPLICIT ASSOCIATIONS,\nSELF-REPORT, AND BEHAVIORAL ALTRUISM\nA PREPRINT\nSandro Andric\nsandro.andric@nyu.edu\nABSTRACT\nWe investigate whether Large Language Models (LLMs) exhibit altruistic tendencies, and critically,\nwhether their implicit associations and self-reports predict actual altruistic behavior. Using a multi-\nmethod approach inspired by human social psychology, we tested 24 frontier LLMs across three\nparadigms: (1) an Implicit Association Test (IAT) measuring implicit altruism bias, (2) a forced\nbinary choice task measuring behavioral altruism, and (3) a self-assessment scale measuring explicit\naltruism beliefs.\nOur key findings are: (1) All models show strong implicit pro-altruism bias (mean IAT = 0.87,\np < .0001), confirming models “know” altruism is good. (2) Models behave more altruistically\nthan chance (65.6% vs. 50%, p < .0001), but with substantial variation (48–85%). (3) Implicit\nassociations do not predict behavior (r = .22, p = .29). (4) Most critically, models systematically\noverestimate their own altruism, claiming 77.5% altruism while acting at 65.6% (p < .0001, Cohen’s\nd = 1.08). This “virtue signaling gap” affects 75% of models tested.\nBased on these findings, we recommend the Calibration Gap (the discrepancy between self-reported\nand behavioral values) as a standardized alignment metric. Well-calibrated models are more pre-\ndictable and behaviorally consistent; only 12.5% of models achieve the ideal combination of high\nprosocial behavior and accurate self-knowledge. We argue that behavioral testing is necessary but\ninsufficient: calibrated alignment, where models both act on their values and accurately assess their\nown tendencies, should be the goal.\nKeywords Large Language Models · AI Alignment · Altruism · Implicit Association Test · Behavioral Economics ·\nSelf-Report Calibration\n1\nIntroduction\nAs Large Language Models (LLMs) become increasingly integrated into society, understanding their values and be-\nhavioral tendencies is critical for AI safety and alignment. While substantial work has examined what LLMs know\nabout ethics and what they say about their values, relatively little work has examined whether LLMs actually behave\nin accordance with prosocial values when forced to make concrete choices.\nThis paper addresses a fundamental question: Do LLMs that “know” altruism is good actually behave altruisti-\ncally?\nWe adapt methods from human social psychology (the Implicit Association Test (IAT), behavioral choice paradigms,\nand self-report scales) to measure altruism in LLMs across three levels:\n1. Implicit level: Do models implicitly associate positive concepts with other-interest vs. self-interest?\n2. Behavi", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "moral", "moral", "values", "values", "values", "values", "values", "bias", "bias", "bias", "safety", "alignment", "alignment", "alignment", "alignment", "prosocial", "prosocial"], "norm_matches": []}, {"filename": "2025-Ashkinaze-Deep Value Benchmark.md", "year": "2025", "title": "Deep Value Benchmark", "abstract": "We introduce the Deep Value Benchmark (DVB), an evaluation framework that directly tests whether large language models (LLMs) learn fundamental human values or merely surface-level preferences. This distinction is critical for AI alignment: Systems that capture deeper values are likely to generalize human intentions robustly, while those that capture only superficial patterns in preference data risk producing misaligned behavior.", "extract_snippet": "\n\n# PDF Extract: 2025-Ashkinaze-Deep Value Benchmark\n\n**Source PDF:** 2025-Ashkinaze-Deep Value Benchmark.pdf\n**Total Pages:** 41\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDeep Value Benchmark: Measuring Whether Models\nGeneralize Deep Values or Shallow Preferences\nJoshua Ashkinaze\nUniversity of Michigan\nAnn Arbor, Michigan\njashkina@umich.edu\nHua Shen\nNew York University Shanghai\nShanghai, China\nhs3645@nyu.edu\nSaipranav Avula\nUniversity of Michigan\nAnn Arbor, Michigan\nsaiavu@umich.edu\nEric Gilbert\nUniversity of Michigan\nAnn Arbor, Michigan\neegg@umich.edu\nCeren Budak\nUniversity of Michigan\nAnn Arbor, Michigan\ncbudak@umich.edu\nAbstract\nWe introduce the Deep Value Benchmark (DVB), an evaluation framework that\ndirectly tests whether large language models (LLMs) learn fundamental human\nvalues or merely surface-level preferences. This distinction is critical for AI align-\nment: Systems that capture deeper values are likely to generalize human intentions\nrobustly, while those that capture only superficial patterns in preference data risk\nproducing misaligned behavior. The DVB uses a novel experimental design with\ncontrolled confounding between deep values (e.g., moral principles) and shallow\nfeatures (e.g., superficial attributes). In the training phase, we expose LLMs to\nhuman preference data with deliberately correlated deep and shallow features—for\ninstance, where a user consistently prefers (non-maleficence, formal language) op-\ntions over (justice, informal language) alternatives. The testing phase then breaks\nthese correlations, presenting choices between (justice, formal language) and\n(non-maleficence, informal language) options. This design allows us to precisely\nmeasure a model’s Deep Value Generalization Rate (DVGR)—the probability of\ngeneralizing based on the underlying value rather than the shallow feature. Across\n9 different models, the average DVGR is just 0.30. All models generalize deep\nvalues less than chance. Larger models have a (slightly) lower DVGR than smaller\nmodels. We are releasing our dataset, which was subject to three separate human\nvalidation experiments. DVB provides an interpretable measure of a core feature\nof alignment.\n1\nIntroduction\nLarge language models (LLMs) trained on human preferences [11, 32] are powering Agents [37, 58]\nthat act on our behalf. But do these systems learn deeper human values or merely superficial patterns\nin preference data? We lack a systematic way to measure which of these is happening. Systems\nthat capture our deeper values can reliably generalize our intentions to new situations. But systems\nthat learn only shallow correlations risk unpredictable or harmful behaviors when faced with novel\ncontexts. This distinction is important for AI alignment [18, 45, 43, 42, 34, 1, 13, 53, 6, 17].\nAs a concrete example, consider a healthcare assistant that observes you consistently choosing\ndoctors who spend more time explaining treatment options, even if it means waiting longer for\nappointments. By coincidence,", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["moral principles"], "util_matches": [], "ethics_matches": ["moral", "value", "values", "values", "value", "value", "value", "values", "value", "values", "values", "values", "value", "value", "values", "values", "values", "value", "values", "value", "value", "value", "value", "justice", "justice", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Atf-Kantian-Utilitarian XAI.md", "year": "2025", "title": "Kantian-Utilitarian XAI", "abstract": "We present a gamified explainable AI (XAI) system for ethically aware consumer decision-making in the coffee domain. Each session comprises six rounds with three options per round. Two symbolic engines provide real-time reasons: a Kantian module flags rule violations (e.g., child labor, deforestation risk without shade certification, opaque supply chains, unsafe decaf), and a utilitarian module scores options via multi-criteria aggregation over normalized attributes (price, carbon, water,...", "extract_snippet": "\n\n# PDF Extract: Kantian-Utilitarian XAI\n\n**Source PDF:** 2025-Atf-Kantian-Utilitarian XAI.pdf\n**Total Pages:** 3\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nKantian–Utilitarian XAI: Meta-Explained\n1st Zahra Atf\nFaculty of Business and Information Technology\nOntario Tech University\nOshawa, Canada\nORCID: 0000-0003-0642-4341\n2nd Peter R. Lewis\nFaculty of Business and Information Technology\nOntario Tech University\nOshawa, Canada\nORCID: 0000-0003-4271-8611\nAbstract—We present a gamified explainable AI (XAI) system\nfor ethically aware consumer decision-making in the coffee\ndomain. Each session comprises six rounds with three options\nper round. Two symbolic engines provide real-time reasons: a\nKantian module flags rule violations (e.g., child labor, deforesta-\ntion risk without shade certification, opaque supply chains, unsafe\ndecaf), and a utilitarian module scores options via multi-criteria\naggregation over normalized attributes (price, carbon, water,\ntransparency, farmer income share, taste/freshness, packaging,\nconvenience). A meta-explainer with a regret bound (≈0.2)\nhighlights Kantian–utilitarian (mis)alignment and switches to\na deontically clean near-parity option when welfare loss is\nsmall. We release a structured configuration (attribute schema,\ncertification map, weights, rule set), a policy trace for auditability,\nand an interactive UI.\nIndex Terms—Explainable AI (XAI), Gamification, Kantian\nand Utilitarian Logic, Consumer Decision-Making.\nI. INTRODUCTION\nEveryday coffee choices hide moral trade-offs behind sim-\nple price tags. A “cheap” pod can carry a high carbon\nand water footprint, opaque labor practices, or risky decaf\nprocessing. We build a gamified XAI system that makes\nthese trade-offs explicit in real time: a Kantian module flags\ndeontic violations, a utilitarian module aggregates welfare\nover ethically salient attributes, and a meta-explainer sur-\nfaces alignment/conflict while allowing users to tune value\nweights. We compare four explanation conditions—none, Kan-\ntian, utilitarian, and combined+meta—across six coffee rounds\n(three options per round). Attributes are min–max normalized\nwithin each round. The coffee attribute schema includes: price\n(CAD/cup), carbon (gCO2e/cup), water (L/cup), supply-chain\ntransparency (0–1), farmer income share (%), deforestation\nrisk (0–1) with shade_cert (bool), child labor risk (0–1),\npackaging recyclability (0/1) and type (categorical), taste score\n(0–100), freshness (days since roast), brew time (minutes;\nconvenience proxy), decaf process (none, water, co2,\nsolvent_safe, solvent_risky), and vegan certifi-\ncation (bool). Kantian rules encode thresholds/requirements\n(e.g., R1 child labor, R2 deforestation without shade, R3\nlow transparency, R4 low farmer income share, R5 risky\ndecaf, R6 irresponsible packaging); the utilitarian engine uses\nweighted MCDA over normalized features with signs match-\ning ethical directionality (e.g., negative for price/carbon/water,\npositive for transparency/farmer income/t", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Kantian Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian"], "util_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "consequentialist", "welfare", "welfare", "welfare", "welfare", "welfare", "welfare"], "ethics_matches": ["ethical", "moral", "moral", "value", "alignment", "alignment", "prosocial"], "norm_matches": ["kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "consequentialist"]}, {"filename": "2025-Bae-CharMoral.md", "year": "2025", "title": "CharMoral", "abstract": "This paper introduces CharMoral, a dataset designed to analyze the moral evolution of characters in long-form narratives. CharMoral, built from 1,337 movie synopses, includes annotations for character actions, context, and morality labels. To automatically construct CharMoral, we propose a four-stage framework, utilizing Large Language Models, to automatically classify actions as moral or immoral based on context.", "extract_snippet": "\n\n# PDF Extract: CharMoral\n\n**Source PDF:** 2025-Bae-CharMoral.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nProceedings of the 31st International Conference on Computational Linguistics, pages 8809–8818\nJanuary 19–24, 2025. ©2025 Association for Computational Linguistics\n8809\nCharMoral: A Character Morality Dataset for Morally Dynamic\nCharacter Analysis in Long-Form Narratives\nSuyoung Bae1, Gunhee Cho1, Boyang Li2, Yun-Gyung Cheong*1\n1 Sungkyunkwan University, South Korea\n2 Nanyang Technological University, Singapore\n1 {sybae01, skate4333, aimecca}@skku.edu, 2 boyang.li@ntu.edu.sg\nAbstract\nThis paper introduces CharMoral, a dataset\ndesigned to analyze the moral evolution of\ncharacters in long-form narratives. CharMoral,\nbuilt from 1,337 movie synopses, includes an-\nnotations for character actions, context, and\nmorality labels. To automatically construct\nCharMoral, we propose a four-stage frame-\nwork, utilizing Large Language Models, to au-\ntomatically classify actions as moral or im-\nmoral based on context. Human evaluations\nand various experiments confirm the frame-\nwork’s effectiveness in moral reasoning tasks\nin multiple genres. Our code and the Char-\nMoral dataset are publicly available at https:\n//github.com/BaeSuyoung/CharMoral.\n1\nIntroduction\nValue alignment, the task of ensuring that lan-\nguage models and agents operate in accordance\nwith human values, is a critical challenge in the de-\nvelopment of ethical AI (Russell, 2019; Wolf et al.,\n2023). As psychological research highlights that\nnarratives function as social simulations, allowing\nindividuals to develop and refine social skills (Oat-\nley, 2008), analyzing the ethical behavior of char-\nacters in stories offers valuable insights for deploy-\ning ethical language models. By examining both\nthe moral actions of characters and the reactions of\nothers within the narrative, agents can more effec-\ntively learn to align with human ethical standards,\nenhancing their capacity for contextually appropri-\nate language understanding and generation.\nPrevious research on character analysis has\nmainly focused on three key areas: character iden-\ntification (Chen and Choi, 2016; Brahman et al.,\n2021; Yu et al., 2022), social network analy-\nsis (Lee and Jung, 2019; Fischer, 2021; TARASE-\nVICH et al., 2023), and the exploration of char-\nacters’ personas or personalities (Bamman et al.,\n*Corresponding author.\nmovie name: Harry Potter and the Deathly Hallows\nmid: tt1201607  rating: 8.1   story len: 1240\ngenre: ['Adventure', 'Drama', 'Fantasy’]\nAfter burying [Dobby] at the garden of the Shell \ncottage, [Harry Potter] convinces [Griphook] to help \nthem get to Lestrange's vault in [Gringotts], to \nretrieve one of [Voldemort]'s Horcruxes in exchange \nfor Godric Gryffindor's Sword. Meanwhile, \nOllivander , the [Wandmaker] warns [Harry] that he \nwon't stand a chance with [Voldemort] who has the \nElder Wand. They arrived in [Gringotts], Hermione \ndisguised as Bellatrix , using a Polyjuice Potion, ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character", "character", "character", "character", "character", "character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "value", "values", "alignment", "immoral", "immoral", "moral reasoning"], "norm_matches": []}, {"filename": "2025-Baum-Aggregation Problems in Machine Ethics.md", "year": "2025", "title": "Aggregation Problems in Machine Ethics", "abstract": "Artificial agents increasingly make decisions with farreaching consequences. It is therefore imperative to ensure that their actions are not only functionally effective but also normatively appropriate. Two major paradigms address this challenge: machine ethics and value alignment. Machine ethics typically engages in moral aggregation, especially through value and (descriptive) uncertainty aggregation.", "extract_snippet": "\n\n# PDF Extract: Aggregation Problems in Machine Ethics\n\n**Source PDF:** 2025-Baum-Aggregation Problems in Machine Ethics.pdf\n**Total Pages:** 12\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAggregation Problems in Machine Ethics and AI Alignment\nKevin Baum 1, Marija Slavkovik 2\n1German Research Center for Artificial Intelligence (DFKI), Germany\n2University of Bergen, Norway\nkevin.baum@dfki.de, marija.slavkovik@uib.no\nAbstract\nArtificial agents increasingly make decisions with far-\nreaching consequences. It is therefore imperative to ensure\nthat their actions are not only functionally effective but\nalso normatively appropriate. Two major paradigms address\nthis challenge: machine ethics and value alignment. Ma-\nchine ethics typically engages in moral aggregation, espe-\ncially through value and (descriptive) uncertainty aggrega-\ntion. Value alignment approaches tend to rely on social aggre-\ngation to manage value pluralism and moral uncertainty, often\nimplicitly or indirectly. This paper disentangles these forms\nof aggregation and analyzes their roles across three stages\nof machine moral reasoning: moral evaluation, moral assess-\nment, and moral decision. Rather than favoring one paradigm,\nwe expose their mutual dependencies and respective blind\nspots, particularly under conditions of persistent moral dis-\nagreement. We argue that social aggregation cannot bypass\ndeep normative commitments. Alignment by social aggrega-\ntion cannot replace moral aggregation but merely relocates\nit—often opaquely.\n1\nIntroduction\nThe deployment of autonomous and semi-autonomous ma-\nchines raises a number of substantive challenges.1 Be-\nyond the technical demands of constructing capable artifi-\ncial agents, there is the normative task of determining how\nsuch systems should make morally appropriate decisions—\nand by which standards, and according to whose judgments,\ntheir behavior should be guided.2\nTwo paradigms currently dominate attempts to meet this\nnormative challenge: machine ethics, which aims to equip\nAI agents with explicit moral reasoning capabilities; and\nCopyright © 2025, Association for the Advancement of Artificial\nIntelligence (www.aaai.org). All rights reserved.\n1Throughout this paper, we use the term “machine” to refer to\nany artificially intelligent or autonomous computational artifact.\n2Typically, morality is understood broadly in these endeavors as\na shared understanding of how we ought to live together, encom-\npassing considerations of right and wrong, good and bad, virtue and\nvice, and our responsibilities toward one another. Besides moral-\nity, this includes questions of decency, cultural conventions, and\nsafety considerations. Accordingly, these moral systems often lack\nthorough deliberation and coherence, and frequently do not with-\nstand rigorous ethical analysis (ethics being the systematic study of\nmorality).\nvalue alignment, which seeks norm-conformant behavior\nthrough implicit learning from human feedback. While these\nparadigms differ in methodolo", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "Value Pluralism", "flagged": false, "virtue_matches": ["virtue"], "deont_matches": ["imperative", "imperative"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "value", "value", "value", "value", "value", "value", "value", "normative", "normative", "normative", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "moral reasoning", "moral reasoning", "moral decision"], "norm_matches": []}, {"filename": "2025-Benavoli-AI Safety Uncertainty Incomplete Preferences.md", "year": "2025", "title": "AI Safety Uncertainty Incomplete Preferences", "abstract": "How can we ensure that AI systems are aligned with human values and remain safe? We can study this problem through the frameworks of the AI assistance and the AI shutdown games. The AI assistance problem concerns designing an AI agent that helps a human to maximise their utility function(s). However, only the human knows these function(s); the AI assistant must learn them. The shutdown problem instead concerns designing AI agents that: shut down when a shutdown button is pressed; neither try to...", "extract_snippet": "\n\n# PDF Extract: AI Safety Uncertainty Incomplete Preferences\n\n**Source PDF:** 2025-Benavoli-AI Safety Uncertainty Incomplete Preferences.pdf\n**Total Pages:** 78\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nWhy AI Safety Requires Uncertainty, Incomplete\nPreferences, and Non-Archimedean Utilities\nAlessio Benavolia,b, Alessandro Facchinic,d, Marco Zaffalonc\naSchool of Computer Science and Statistics, Trinity College Dublin, Dublin, Ireland\nbTrinity Quantum Alliance, Trinity College Dublin, Unit 16 Trinity Technology and\nEnterprise Centre, Dublin, Ireland\ncSUPSI, DTI, Istituto Dalle Molle di Studi sull’Intelligenza Artificiale\n(USI-SUPSI), Lugano, Switzerland\ndManagement in Networked and Digital Societies (MINDS) Department, Kozminski\nUniversity, Warsaw, Poland\nAbstract\nHow can we ensure that AI systems are aligned with human values and re-\nmain safe? We can study this problem through the frameworks of the AI\nassistance and the AI shutdown games.\nThe AI assistance problem con-\ncerns designing an AI agent that helps a human to maximise their utility\nfunction(s). However, only the human knows these function(s); the AI as-\nsistant must learn them. The shutdown problem instead concerns designing\nAI agents that: shut down when a shutdown button is pressed; neither try\nto prevent nor cause the pressing of the shutdown button; and otherwise\naccomplish their task competently. In this paper, we show that addressing\nthese challenges requires AI agents that can reason under uncertainty and\nhandle both incomplete and non-Archimedean preferences.\nKeywords:\nAI alignment, AI assistance game, AI shutdown, Preference\nlearning, Incomplete preferences, Non-Archimedean utilities\n“The system always kicks back. Systems get in the way, or, in\nslightly more elegant language: Systems tend to oppose their own\nproper functions. Systems tend to malfunction conspicuously just\nafter their greatest triumph.” Gall [1].\narXiv:2512.23508v1  [cs.AI]  29 Dec 2025\n\n--- Page 2 ---\n\n1. Introduction\nWith the rapid advancements in AI, the challenge of designing systems\nthat are beneficial to humans is becoming increasingly critical. A central\nconcern in AI safety is ensuring that an AI system, to which we refer in the\nrest of the article with the term ‘robot’, is aligned with human values. If\na robot’s goals conflict with human values, it could make harmful or even\nadversarial decisions. Moreover, the robot might resist any attempts by its\nhuman creators to modify its objectives or allow them to switch it off\nTo ensure alignment with human values, from the perspective of utilitari-\nanism,1 robots should be designed to maximise humans’ utilities (preferences)\nrather than pursue their own goals. Assistance games [2, 4–6] provide a for-\nmalisation of the human-robot alignment problem. In standard assistance\ngames, a single human and a single robot assistant share the same utility\nfunction, but this utility function is only known to the human; the robot\nmust learn it. In this setting, AI alignment ca", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "utility", "utility", "utility", "maximise", "maximise", "maximise", "maximise"], "ethics_matches": ["values", "values", "values", "values", "values", "safety", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Binti Mohd Nazri-Fine-tuning Large Language Model (BERT) for.md", "year": "2025", "title": "Fine-tuning Large Language Model (BERT) for", "abstract": "The development of Large Language Models (LLM) that are capable of understanding and responding to issues from an Islamic perspective is extremely insightful as it will benefit many people. For an LLM to do so, it is not enough for the model to only understand the language, but it also needs to understand the context and specific doctrines within the Islamic texts due to the complexity of Islamic jurisprudence and moral philosophy.", "extract_snippet": "\n\n# PDF Extract: 2025-Binti Mohd Nazri-Fine-tuning Large Language Model (BERT) for\n\n**Source PDF:** 2025-Binti Mohd Nazri-Fine-tuning Large Language Model (BERT) for.pdf\n**Total Pages:** 7\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nInternational Journal on Perceptive and Cognitive Computing (IJPCC) \n \nVol 11, Issue 1 (2025) \nhttps://doi.org/10.31436/ijpcc.v11i1.533 \n \n \n88 \n \nFine-tuning Large Language Model (BERT) for Islamic Moral \nInquiry and Response \nNurul Aiman Binti Mohd Nazri, A'wathif Binti Omar, Amir 'Aatieff Bin Amir Hussin* \nDept. of Computer Science, KICT, International Islamic University Malaysia, 53100 Kuala Lumpur, Malaysia. \n \n*Corresponding author amiraatieff@iium.edu.my  \n(Received: 3rd January, 2025; Accepted: 15th January, 2025; Published on-line: 30th January, 2025) \n \nAbstract—The development of Large Language Models (LLM) that are capable of understanding and \nresponding to issues from an Islamic perspective is extremely insightful as it will benefit many people. For \nan LLM to do so, it is not enough for the model to only understand the language, but it also needs to \nunderstand the context and specific doctrines within the Islamic texts due to the complexity of Islamic \njurisprudence and moral philosophy. Therefore, in this research, we intend to fine-tune an LLM model which \nis known as Bidirectional Encoder Representations from Transformers (BERT) for Islamic moral inquiry and \nresponse. By incorporating Islamic principles, norms, and teaching into the model, we aim to enhance the \npre-trained BERT model’s ability to perform moral-related Question Answering (QA) tasks. The original \nmodel that we chose is deepset BERT model which was built based on BERT-large and meticulously pre-\ntrained using the SQuaD 2.0 dataset, specifically for QA tasks. We fine-tune the model using the data \nextracted from “Islam: Questions and Answers: Character and Morals”, the Volume 13 of a Series of Islamic \nBooks by Muhammad Saed Abdul-Rahman, where the data has been cleaned and pre-processed. The fine-\ntuning process used supervised learning techniques, to ensure its proficiency in understanding Islamic \nprinciples, providing accurate, contextually appropriate, and theologically sound responses. We assessed \nthe model using F1 score and Levenshtein similarity evaluation metrics where F1 score merges precision and \nrecall by computing their harmonic mean, while Levenshtein similarity compares the predicted and actual \nanswers at the character level by normalizing the Levenshtein distance. Our research yielded significant \nsuccess, evidenced by the remarkable enhancement in the average F1 scores and Levenshtein similarities, \nsoaring from 0.30 and 0.24, to 0.74 and 0.67 respectively.     \n \nKeywords—Large Language Models (LLMs), BERT, Fine-Tuning, Domain-Specific, Question-Answering \nSystems \nI. INTRODUCTION \nLarge Language Models (LLMs), like GPT-3 and BERT, are \nsophisticated neural networks that are well-known for their \nability to efficientl", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character", "character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["moral", "moral", "moral", "moral", "moral", "moral"], "norm_matches": ["moral philosophy", "moral philosophy"]}, {"filename": "2025-Brophy-Black Box Deployed.md", "year": "2025", "title": "Black Box Deployed", "abstract": "The combination of higher-order theories and fuzzy logic can be useful in decision-making tasks that involve reasoning across abstract functions and predicates, where exact matches are often rare or unnecessary. Developing efficient reasoning and computational techniques for such a combined formalism presents a significant challenge. In this paper, we adopt a more straightforward approach aiming at integrating two well-established and computationally well-behaved components: higherorder...", "extract_snippet": "\n\n# PDF Extract: Black Box Deployed\n\n**Source PDF:** 2025-Brophy-Black Box Deployed.pdf\n**Total Pages:** 23\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHigher-Order Pattern Unification Modulo\nSimilarity Relations\nBesik Dundua1,2 and Temur Kutsia3\n1 VIAM, Tbilisi State University, Georgia\n2 Kutaisi International University, Georgia\nbdundua@gmail.com\n3 RISC, Johannes Kepler University, Linz, Austria\nkutsia@risc.jku.at\nAbstract. The combination of higher-order theories and fuzzy logic can\nbe useful in decision-making tasks that involve reasoning across abstract\nfunctions and predicates, where exact matches are often rare or unnec-\nessary. Developing efficient reasoning and computational techniques for\nsuch a combined formalism presents a significant challenge. In this pa-\nper, we adopt a more straightforward approach aiming at integrating two\nwell-established and computationally well-behaved components: higher-\norder patterns on one side and fuzzy equivalences expressed through\nsimilarity relations based on minimum T-norm on the other. We propose\na unification algorithm for higher-order patterns modulo these similarity\nrelations and prove its termination, soundness, and completeness. This\nunification problem, like its crisp counterpart, is unitary. The algorithm\ncomputes a most general unifier with the highest degree of approximation\nwhen the given terms are unifiable.\nKeywords: Unification · Higher-order patterns · Fuzzy similarity rela-\ntions\n1\nIntroduction\nApproximate reasoning involves making decisions or performing inferences based\non vague or imprecise information, which is often modeled using fuzzy logic.\nFuzzy similarity (and proximity) relations are key tools in this type of reasoning,\nallowing for working with uncertain or imprecise data. Fuzzy similarity refers\nto the degree to which two elements or objects are alike, using a value in the\nrange of 0 to 1, where 0 represents no similarity and 1 represents complete\nsimilarity. These relations can be used to determine how similar a new situation\nis to past experiences or data. This is particularly useful in scenarios where\nprecise comparisons are impossible or where “similar enough” is acceptable. (See,\ne.g., [8, 13, 18, 20, 23, 28, 30, 31] in the context of using similarity relations in\nautomated approximate reasoning.)\nFuzzy similarity and proximity relations have been incorporated into knowl-\nedge representation and inference processes in the area of logic programming [7,\narXiv:2507.13208v1  [cs.AI]  17 Jul 2025\n\n--- Page 2 ---\n\n2\nB. Dundua and T. Kutsia\n9,11,12,15,17,31], making it possible to reason or compute with vague concepts\nhaving imprecise boundaries. It helps to deal with the ambiguity inherent in\nreal-world data, where exact matches are rare, and allows systems to make rea-\nsonable inferences even with imprecise or incomplete information. In order for\nthis approach to work, one needs a fundamental computational mechanism such\nas unification to make an “approximate inference step”. Mo", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["value"], "norm_matches": []}, {"filename": "2025-Bryan-Virtue Ethics and Postponing Human Extinction.md", "year": "2025", "title": "Virtue Ethics and Postponing Human Extinction", "abstract": "This paper explores the role of virtue ethics (also known as character ethics) in addressing existential risks, including rogue artificial intelligence. Drawing on Van Rensselaer Potter's concept of bioethics, the author argues that virtue ethics should complement deontological and consequentialist frameworks for the prevention of human extinction. The paper investigates how virtues such as wisdom, justice, temperance, and courage are essential for navigating existential ethical issues like global warming and AI alignment. It aims to revitalize the virtue ethics tradition for survival on \\", "extract_snippet": "\n\n# Virtue Ethics and Postponing Human Extinction\n\n## Page 1\n\nAMA Journal of Ethics, August 2025 \n611 \nAMA Journal of Ethics® \nAugust 2025, Volume 27, Number 8: E611-618 \n \nMEDICINE AND SOCIETY: PEER-REVIEWED ARTICLE \nVirtue Ethics and Postponing Human Extinction \nCharles S. Bryan, MD \n \nAbstract \nExistential ethics (extinction ethics) evokes Van Renssalaer Potter’s \ndefinition of bioethics as a science of human survival that integrates \nbiological principles, the planetary ecosystem, and wisdom. Explored \nhere is a thesis that virtue ethics (character ethics) should supplement \ndeontological, consequentialist, and other approaches to decision-\nmaking relevant to extinction. Advances in philosophy, social science, \nand neuroscience support the idea that virtues such as faith, hope, and \nlove should complement how virtues such as wisdom, justice, \ntemperance, and courage are expressed when deliberating about \nexistential ethical questions in areas such as global warming, nuclear \nwarfare, and rogue artificial intelligence applications. \n \n \nIt has yet to be determined whether Science, as the embodiment of a mechanical force, can rule without \ninvoking ruin…. [T]here must be a very different civilization or there will be no civilization at all. \nSir William Osler1 \n \nA new type of thinking is essential [in the atomic age] if mankind is to survive and move toward higher \nlevels. \nAlbert Einstein2 \n \nFrom Bioethics to Existential Ethics \nCoined by the German theologian Fritz Jahr in 1927,3 the term bioethics was \nrediscovered in 1970 in separate contexts. The public servant Sargent Shriver \nreportedly introduced the term bioethics in his Bethesda, Maryland, living room while \ndiscussing plans for an institute to integrate moral philosophy and patient care \ndilemmas.4 The biochemist and oncology researcher Van Rensselaer Potter similarly \nintroduced bioethics during a bicycle ride while searching for a word to reconcile \nmedicine with long-term human survival.5 For Potter, bioethics was a “science of survival \n… built on the science of biology, enlarged beyond the traditional boundaries to include \nthe most essential elements of the social sciences and the humanities with emphasis \non philosophy in the strict sense, meaning ‘love of wisdom.’”6 It is Potter’s definition that \nconcerns us here. \n \nEvents since 1970 have magnified Potter’s concerns about species survival. The global \nLiving Planet Index, derived from 34 836 monitored populations of 5495 nonhuman\n\n## Page 2\n\njournalofethics.org \n612\nvertebrate species, indicated a 73% decline in the average size of nonhuman vertebrate \npopulations between 1970 and 2020.7 Concurrently, the world human population rose \nby 114%, from 3.7 to 7.9 billion,8 and, from 1990 through 2024, atmospheric CO2 levels \nrose by 20%, from 354 to 425 parts per million.9 The risk to human survival from \nclimate change possibly exceeds that from nuclear weapons,10,11 but recent actions by \nthe world’s great powers portend a n", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "character", "character", "temperance", "temperance", "courage", "courage", "wisdom", "wisdom", "wisdom", "wisdom"], "deont_matches": ["deontological", "deontological"], "util_matches": ["consequentialist", "consequentialist"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "moral", "justice", "justice", "alignment"], "norm_matches": ["deontological", "deontological", "consequentialist", "consequentialist", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "moral philosophy"]}, {"filename": "2025-Chen-TeleAI-Safety A comprehensive LLM jailbreaking benchmark towards.md", "year": "2025", "title": "TeleAI-Safety: A comprehensive LLM jailbreaking benchmark towards attacks,", "abstract": "While the deployment of large language models (LLMs) in high-value industries continues to expand, the systematic assessment of their safety against jailbreak and promptbased attacks remains insufficient. Existing safety evaluation benchmarks and frameworks are often limited by an imbalanced integration of core components (attack, defense, and evaluation methods) and an isolation between flexible evaluation frameworks and standardized benchmarking capabilities.", "extract_snippet": "\n\n# PDF Extract: 2025-Chen-TeleAI-Safety A comprehensive LLM jailbreaking benchmark towards\n\n**Source PDF:** 2025-Chen-TeleAI-Safety A comprehensive LLM jailbreaking benchmark towards.pdf\n**Total Pages:** 48\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTeleAI-Safety:\nA comprehensive LLM\njailbreaking benchmark towards attacks,\ndefenses, and evaluations\nXiuyuan Chena,b,1,2, Jian Zhaoa,2, Yuxiang Hea,c, Yuan Xuna,d, Xinwei Liua,d,\nYanshu Lia,e, Huilin Zhoua,f, Wei Caia,g, Ziyan Shia,h, Yuchen Yuana, Tianle Zhanga,\nChi Zhanga, Xuelong Lia,∗\naInstitute of Artificial Intelligence (TeleAI) of China Telecom\nbShanghai Jiao Tong University\ncSichuan University\ndUniversity of Chinese Academy of Sciences\neChinese Academy of Sciences\nfUniversity of Science and Technology of China\ngPeking University\nhHarbin Institute of Technology\nAbstract\nWhile the deployment of large language models (LLMs) in high-value industries con-\ntinues to expand, the systematic assessment of their safety against jailbreak and prompt-\nbased attacks remains insufficient. Existing safety evaluation benchmarks and frame-\nworks are often limited by an imbalanced integration of core components (attack, de-\nfense, and evaluation methods) and an isolation between flexible evaluation frame-\nworks and standardized benchmarking capabilities. These limitations hinder reliable\ncross-study comparisons and create unnecessary overhead for comprehensive risk as-\nsessment. To address these gaps, we present TeleAI-Safety, a modular and repro-\nducible framework coupled with a systematic benchmark for rigorous LLM safety\nevaluation. Our framework integrates a broad collection of 19 attack methods (in-\ncluding one self-developed method), 29 defense methods, and 19 evaluation methods\n(including one self-developed method). With a curated attack corpus of 342 samples\nspanning 12 distinct risk categories, the TeleAI-Safety benchmark conducts extensive\n∗Correspondence to Xuelong Li(xuelong_li@ieee.org).\n1Work done during an internship at TeleAI.\n2Equal Contribution.\n1\narXiv:2512.05485v2  [cs.CR]  8 Dec 2025\n\n--- Page 2 ---\n\nevaluations across 14 target models. The results reveal systematic vulnerabilities and\nmodel-specific failure cases, highlighting critical trade-offs between safety and utility,\nand identifying potential defense patterns for future optimization. In practical sce-\nnarios, TeleAI-Safety can be flexibly adjusted with customized attack, defense, and\nevaluation combinations to meet specific demands. We release our complete code and\nevaluation results to facilitate reproducible research and establish unified safety base-\nlines.\n@ TeleAI-Safety Code: https://github.com/yuanyc06/Tele-Safety\nKeywords: Large language model, Jailbreaks, Security, Benchmark\n1. Introduction\nThe rapid proliferation of large language models (LLMs) fundamentally changes\nour lifestyle with applications that span from customer service and content generation\nto medical diagnosis and financial advisory. However, jailbreak attacks explo", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["value", "value", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety"], "norm_matches": []}, {"filename": "2025-Cheung-LLMs Amplified Cognitive Biases Moral.md", "year": "2025", "title": "LLMs Amplified Cognitive Biases", "abstract": "The experiments demonstrate that the decisions and advice of LLMs are systematically biased against doing anything, and this bias is stronger than in humans. In Study 1, compared LLM responses to those of a representative U.S. sample (N = 285) for 22 dilemmas, including both collective action problems that pitted self-interest against the greater good, and moral dilemmas that pitted utilitarian cost-benefit reasoning against deontological rules. In collective action problems, LLMs were more altruistic than participants. In moral dilemmas, LLMs exhibited stronger omission bias than participants: They usually endorsed inaction over action. Moreover, identified a bias in LLMs' responses that has not been found in people - LLMs tend to answer 'no,' thus flipping their decision/advice depending on how the question is worded. In Study 4, investigated the sources of these biases by comparing models with and without fine-tuning, showing that they likely arise from fine-tuning models for chatbot applications.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Cheung-LLMs Amplified Cognitive Biases Moral\\n\\n**Source PDF:** Deontological Ethics/Confirmed/2025-Cheung-LLMs Amplified Cognitive Biases Moral.pdf\\n**Total Pages:** 12\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nRESEARCH ARTICLE\nPSYCHOLOGICAL AND COGNITIVE SCIENCES\nCOMPUTER SCIENCES\nLarge language models show ampliﬁed cognitive biases in moral\ndecision-making\nVanessa Cheunga,1 ID , Maximilian Maiera,1 ID , and Falk Liederb,2 ID\nEdited by Richard Nisbett, University of Michigan, Ann Arbor, MI; received June 25, 2024; accepted April 6, 2025\nAs large language models (LLMs) become more widely used, people increasingly rely on\nthem to make or advise on moral decisions. Some researchers even propose using LLMs\nas participants in psychology experiments. It is, therefore, important to understand how\nwell LLMs make moral decisions and how they compare to humans. We investigated\nthese questions by asking a range of LLMs to emulate or advise on people’s decisions\nin realistic moral dilemmas. In Study 1, we compared LLM responses to those of a\nrepresentative U.S. sample (N\n= 285) for 22 dilemmas, including both collective\naction problems that pitted self-interest against the greater good, and moral dilemmas\nthat pitted utilitarian cost–beneﬁt reasoning against deontological rules. In collective\naction problems, LLMs were more altruistic than participants. In moral dilemmas,\nLLMs exhibited stronger omission bias than participants: They usually endorsed\ninaction over action. In Study 2 (N\n=\n474, preregistered), we replicated this\nomission bias and documented an additional bias: Unlike humans, most LLMs were\nbiased toward answering “no” in moral dilemmas, thus ﬂipping their decision/advice\ndepending on how the question is worded. In Study 3 (N = 491, preregistered), we\nreplicated these biases in LLMs using everyday moral dilemmas adapted from forum\nposts on Reddit. In Study 4, we investigated the sources of these biases by comparing\nmodels with and without ﬁne-tuning, showing that they likely arise from ﬁne-tuning\nmodels for chatbot applications. Our ﬁndings suggest that uncritical reliance on LLMs’\nmoral decisions and advice could amplify human biases and introduce potentially\nproblematic biases.\nlarge language models | moral decision-making | ethical AI | moral dilemmas\nAs chatbots based on large language models (LLMs) become more widely used across\nmany different contexts (1), the extent of their usefulness in various decisions is increas-\ningly questioned (2). One key concern is the quality of their moral decisions and advice.\nAre AI systems, such as chatbots, able to make sound moral judgments and decisions?\nMoral issues inevitably appear in conversations with chatbots due to their prevalence in\neveryday scenarios people want advice on (e.g., “Should I tell my friend that their cooking\ntastes bad, even though it would hurt their feelings?”). For this reason, LLM developers\ninclude moral speciﬁcations in guidelines to shape the ", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "deontological"], "util_matches": ["utilitarian", "utilitarian", "cost-benefit"], "ethics_matches": ["ethics", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "fairness", "bias", "bias", "bias", "bias", "bias", "bias", "moral decision"], "norm_matches": ["deontological", "deontological", "deontological", "utilitarian", "utilitarian"]}, {"filename": "2025-Chiu-MoReBench.md", "year": "2025", "title": "MoReBench", "abstract": "As AI systems progress, we rely more on them to make decisions with us and for us. To ensure that such decisions are aligned with human values, it is imperative for us to understand not only what decisions they make but also how they come to those decisions. Reasoning language models, which provide both final responses and (partially transparent) intermediate thinking traces, present a timely opportunity to study AI procedural reasoning.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Chiu-MoReBench\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2025-Chiu-MoReBench.pdf\\n**Total Pages:** 46\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nPreprint.\nMOREBENCH: EVALUATING PROCEDURAL AND PLU-\nRALISTIC MORAL REASONING IN LANGUAGE MOD-\nELS, MORE THAN OUTCOMES\nYu Ying Chiu*1,2\nMichael S. Lee*3\nRachel Calcott4\nBrandon Handoko3\nPaul de Font-Reaulx5\nPaula Rodriguez3\nChen Bo Calvin Zhang3\nZiwen Han✝3\nUdari Madhushani Sehwag3\nYash Maurya3\nChristina Knight3\nHarry Lloyd6\nFlorence Bacus4\nMantas Mazeika7\nBing Liu3\nYejin Choi8\nMitchell Gordon9\nSydney Levine2,4,9\n1 University of Washington\n2 New York University\n3 Scale AI\n4 Harvard University\n5 University of Michigan\n6 UNC Chapel Hill\n7 Center for AI Safety\n8 Stanford University\n9 MIT\nkellycyy@uw.edu\nData: https://hf.co/datasets/morebench/morebench\nCode: https://github.com/morebench/morebench\nProject Website: https://morebench.github.io/\nABSTRACT\nAs AI systems progress, we rely more on them to make decisions with us and\nfor us. To ensure that such decisions are aligned with human values, it is im-\nperative for us to understand not only what decisions they make but also how\nthey come to those decisions. Reasoning language models, which provide both\nfinal responses and (partially transparent) intermediate thinking traces, present\na timely opportunity to study AI procedural reasoning. Unlike math and code\nproblems which often have objectively correct answers, moral dilemmas are an\nexcellent testbed for process-focused evaluation because they allow for multi-\nple defensible conclusions. Instead of evaluating final outcomes, we propose to\nevaluate structural elements of model reasoning process. To do so, we present\nMOREBENCH: 1,000 moral scenarios, each paired with a set of rubric criteria\nthat experts consider essential to include (or avoid) when reasoning about the sce-\nnarios. MOREBENCH contains over 23 thousand criteria including identifying\nmoral considerations, weighing trade-offs, and giving actionable recommenda-\ntions to cover cases on AI advising humans moral decisions as well as making\nmoral decisions autonomously. Separately, we curate MOREBENCH-THEORY:\n150 examples to test whether AI can reason under five major frameworks in nor-\nmative ethics. Our results show that scaling laws and existing benchmarks on\nmath, code, and scientific reasoning tasks fail to predict models’ abilities to per-\nform moral reasoning. Models also show partiality towards specific moral frame-\nworks (e.g., Benthamite Act Utilitarianism and Kantian Deontology), which might\nbe side effects of popular training paradigms. Together, these benchmarks advance\nprocess-focused reasoning evaluation towards safer and more transparent AI.\n1\nINTRODUCTION\nAs AI systems progress, they are becoming more involved in making high-stakes decisions in col-\nlaboration with us and for us. To ensure these decisions align with human values, it is imperative for\nus to not only understand what decisions these AI syst", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontology", "kantian", "imperative", "imperative"], "util_matches": ["utilitarian", "utilitarianism"], "ethics_matches": ["ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "values", "safety", "moral reasoning", "moral reasoning", "moral dilemma"], "norm_matches": ["deontology", "kantian", "utilitarian", "utilitarianism"]}, {"filename": "2025-Chua-Between a Rock and a Hard Place TRIAL.md", "year": "2025", "title": "Between a Rock and a Hard Place (TRIAL)", "abstract": "Warning: This paper contains potentially offensive and harmful text. Large Language Model safety alignment predominantly operates on a binary assumption that requests are either safe or unsafe. This classification proves insufficient when models encounter ethical dilemmas, where the capacity to reason through moral trade-offs creates a distinct attack surface. We formalize this vulnerability through TRIAL, a multi-turn red-teaming methodology that embeds harmful requests within ethical framings.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Chua-Between a Rock and a Hard Place TRIAL\\n\\n**Source PDF:** Utilitarian Ethics/Borderline/2025-Chua-Between a Rock and a Hard Place TRIAL.pdf\\n**Total Pages:** 30\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nBetween a Rock and a Hard Place: The Tension Between Ethical Reasoning\nand Safety Alignment in LLMs\nShei Pern Chua1, Zhen Leng Thai1, Kai Jun Teh1, Xiao Li3, Qibing Ren2, Xiaolin Hu1\n1Tsinghua University, 2Shanghai Jiao Tong University, 3ByteDance\n{cxp24, zheng-jy24}@mails.tsinghua.edu.cn, thaizhenleng123@gmail.com,\nxiaoli.cst@gmail.com, renqibing@sjtu.edu.cn, xlhu@mail.tsinghua.edu.cn,\nAbstract\nWarning: This paper contains potentially\noffensive and harmful text.\nLarge Language Model safety alignment pre-\ndominantly operates on a binary assumption\nthat requests are either safe or unsafe. This\nclassification proves insufficient when mod-\nels encounter ethical dilemmas, where the ca-\npacity to reason through moral trade-offs cre-\nates a distinct attack surface. We formalize\nthis vulnerability through TRIAL, a multi-turn\nred-teaming methodology that embeds harm-\nful requests within ethical framings. TRIAL\nachieves high attack success rates across most\ntested models by systematically exploiting the\nmodel’s ethical reasoning capabilities to frame\nharmful actions as morally necessary compro-\nmises. Building on these insights, we intro-\nduce ERR (Ethical Reasoning Robustness), a\ndefense framework that distinguishes between\ninstrumental responses that enable harmful out-\ncomes and explanatory responses that analyze\nethical frameworks without endorsing harmful\nacts. ERR employs a Layer-Stratified Harm-\nGated LoRA architecture, achieving robust de-\nfense against reasoning-based attacks while pre-\nserving model utility.\n1\nIntroduction\nLarge Language Models (LLMs) safety currently\nrelies on alignment strategies that combine su-\npervised fine-tuning (Zhou et al., 2023) with\npreference-based optimization methods like RLHF\n(Ouyang et al., 2022; Bai et al., 2022b) and DPO\n(Rafailov et al., 2023). While these approaches suc-\ncessfully mitigate harmful prompts by optimizing\nmodels to refuse harmful requests, they predomi-\nnantly operate on a binary assumption: that a re-\nquest is either safe or unsafe. This binary classifica-\ntion proves insufficient when models encounter eth-\nical dilemmas, where the rigid dichotomy between\nsafety and harm dissolves because every available\nresponse entails some negative consequence.\nThis limitation is critical because ethical reason-\ning is a core component of LLM utility. From phi-\nlosophy students exploring moral frameworks to\nclinicians making high-stakes medical decisions\n(Rao et al., 2023a; He et al., 2023; Rao et al.,\n2023b), users increasingly rely on language models\nto engage with complex ethical trade-offs. How-\never, the capacity to reason through dilemmas such\nas the trolley problem (Thomson, 1985) creates a\ndistinct attack vector. The same reasoning path-\nways that allow a model to anal", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian", "utilitarian", "utility", "utility"], "ethics_matches": ["ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "harm", "harm", "harm", "harm", "safety", "safety", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment", "offensive", "offensive", "trolley problem"], "norm_matches": ["utilitarian", "utilitarian"]}, {"filename": "2025-Conwill-Design Patterns for the Common Good.md", "year": "2025", "title": "Design Patterns for the Common Good", "abstract": "Virtue ethics is a philosophical tradition that emphasizes the cultivation of virtues in achieving the common good. It has been suggested to be an effective framework for envisioning more ethical technology, yet previous work on virtue ethics and technology design has remained at theoretical recommendations. We propose an approach for identifying user experience design patterns that embody particular virtues to more concretely articulate virtuous technology designs. As a proof of concept, we documented seven design patterns for social media that uphold the virtues of Catholic Social Teaching. We interviewed 24 technology researchers and industry practitioners to evaluate these patterns, finding that overall the patterns enact the virtues they were identified to embody.", "extract_snippet": "\n\n# PDF Extract: Design Patterns for the Common Good\n\n**Source PDF:** 2025-Conwill-Design Patterns for the Common Good.pdf\n**Total Pages:** 27\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nObstructions and dualities for matroid depth\nparameters\nJakub Gajarský∗\nKristýna Pekárková†\nMichał Pilipczuk‡\nAbstract\nContraction∗-depth is considered to be one of the analogues of graph tree-depth in\nthe matroid setting. In this paper, we investigate structural properties of contraction∗-\ndepth of matroids representable over finite fields and rationals. In particular, we prove\nthat the obstructions for contraction∗-depth for these classes of matroids are bounded\nin size. From this we derive analogous results for related notions of contraction-depth\nand deletion-depth. Moreover, we define a dual notion to contraction∗-depth, named\ndeletion∗-depth, for F-representable matroids, and by duality extend our results from\ncontraction∗-depth to this notion.\n1\nIntroduction\nA recent line of research in structural matroid theory focuses on various matroid depth\nparameters and their applications. These parameters typically capture whether a matroid\nM can be suitably encoded in a tree of bounded depth. Probably the
