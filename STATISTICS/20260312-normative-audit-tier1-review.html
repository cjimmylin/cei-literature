oning Models using preferences from\ndifferent social groups while varying rating scales, disagree-\nment handling methods, and optimization techniques. The\nresults revealed systematic demographic effects: male par-\nticipants rated responses 18% less toxic than female partic-\nipants; conservative and Black participants rated responses\n27.9% and 44% higher on EA than liberal and White par-\nticipants, respectively. Models fine-tuned on group-specific\npreferences exhibited distinct behaviors. Technical design\nchoices showed strong effects: the preservation of rater dis-\nagreement achieved roughly 53% greater toxicity reduction\nthan majority voting, and 5-point scales yielded about 22%\nmore reduction than binary formats; and, Direct Preference\nOptimization (DPO) consistently outperformed Group Rel-\native Policy Optimization (GRPO) in multi-value optimiza-\ntion. These findings represent a preliminary step in answer-\ning a critical question: How should alignment balance expert-\ndriven and user-driven signals to ensure both safety and fair\nrepresentation?\nCodes and Data: github.com/DALIAALISIDDIG/AlignCure\nIntroduction\nAs Large Language Models (LLMs) are deployed across\nreal-world applications, aligning them with human values\nhas become a core technical and ethical challenge (Wang\net al. 2023; Liu et al. 2024b; Ouyang et al. 2022). Yet human\nvalues are not monolithic; they reflect diverse and often con-\nflicting beliefs shaped by culture, politics, and lived expe-\nrience (Chen, Zahidi, and Lespinet-Najib 2022; Khamassi,\nNahon, and Chatila 2024; Hadar-Shoval et al. 2024). It is no\nlonger realistic to assume that a single alignment objective\nCopyright © 2026, Association for the Advancement of Ar", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian"], "ethics_matches": ["ethics", "ethical", "values", "values", "values", "values", "values", "values", "values", "value", "values", "values", "value", "value", "values", "normative", "bias", "safety", "safety", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "toxic"], "norm_matches": ["utilitarian"]}, {"filename": "2025-Steen-Ethical aspects of ChatGPT.md", "year": "2025", "title": "Ethical aspects of ChatGPT", "abstract": "This paper proposes an approach to ethical reflection and deliberation for Large Language Models (LLMs) like ChatGPT. It utilizes the European Commission's requirements for \\", "extract_snippet": "# 2025-Steen-Ethical aspects of ChatGPT\n\n**Source PDF:** [[2025-Steen-Ethical aspects of ChatGPT.pdf]]\n**Pages:** 14\n**Extracted:** 2026-01-29\n\n---\n\n## Page 1\n\nORIGINAL RESEARCH\nAI and Ethics (2025) 5:2419–2432\nhttps://doi.org/10.1007/s43681-024-00571-x\nto integrate concerns for ethical aspects in these projects. It \nis from this vantage point that we are interested in the ethi­\ncal aspects of conversational agents. We have observed that \nethical concerns often remain implicit; the people involved \nrarely explicitly discuss ethical perspectives and aspects. \nConversely, we propose that making such perspectives and \naspects more explicit, and organizing reflection and delib­\neration, is necessary, if we want to move ‘from principles \nto practices’ (Morley et al. 2020). Such ethical reflection \nand deliberation are urgent when AI systems are deployed \nin practice; especially if people’s safety and fundamental \nrights are at stake. In this article we discuss an approach \nto organize ethical reflection and deliberation, around the \nseven key requirements of the European Commission’s \nHigh-Level Expert Group on AI (HLEG) (2019).\nThere are diverse approaches to integrate ethical aspects \nin the development and deployment of technologies; meth­\nods can be used at the start of development, during devel­\nopment, or after development (Reijers et al. 2018). We \npropose that integrating ethical aspects during development \nand deployment would be most useful, especially when this \nis part of an iterative development process, like CRISP-\nDM (Martínez-Plumed et al. 2021; Shearer 2000). Further­\nmore, we propose to use different ethical perspectives more \nexplicitly. Notably, we propose to use consequentialism, \nduty ethics, relational ethics, and virtue ethics (Van de Poel \n1  Introduction\nThe development of Large Language Models (LLMs) has \nbeen an incremental process, but particularly the public \nrelease of ChatGPT, an LLM-based conversational agent, \nin November 2022, sparked a worldwide hype and even \nspeculation about impeding Artificial General Intelligence \n(AGI). Articles in both popular and academic publications \nhave discussed diverse opportunities, challenges, and impli­\ncations of conversational agents (e.g., Dwivedi et al. 2023). \nThe field is developing so fast, that there is hardly time to \nproperly assess what is going on. For many organizations, \ngovernments, companies, and citizens, key questions are: \nWhat can it do exactly? Is it hype or real? What are the \nvarious ethical issues? It is this last question that we aim to \n(partially) address in this paper. Below, we will discuss sev­\neral ethical issues aspects of one LLM-based conversational \nagent: ChatGPT.\nThe authors have worked in multiple applied research and \ninnovation projects, with numerous clients and partners, on \nthe development and evaluation of AI systems, and aiming \n\t\n Marc Steen\nmarc.steen@tno.nl\n1\t\nTNO, The Hague, Netherlands\nAbstract\nThere has been growing attention for La", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": ["virtue", "virtue ethics"], "deont_matches": ["duty"], "util_matches": ["consequentialism", "consequentialism"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "safety"], "norm_matches": ["consequentialism", "consequentialism", "virtue ethics"]}, {"filename": "2025-Sullins-Automated Ethical Practical Reasoning.md", "year": "2025", "title": "Automated Ethical Practical Reasoning", "abstract": "This chapter explores the application of **Aristotelian virtue** (**arete**) and **phronesis** (practical wisdom) to AI systems, particularly in the context of the EU Artificial Intelligence Act. Sullins argues that while current regulatory approaches often rely on \\", "extract_snippet": "\n\n# PDF Extract: 2025-Sullins-Automated Ethical Practical Reasoning\n\n**Source PDF:** 2025-Sullins-Automated Ethical Practical Reasoning.pdf\n**Total Pages:** 45\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n1 \n \nin: Seibt, J., Hakli, R., Nørskov, M. (eds.),  Robophilosophy—Philosophy of, \nfor, and by Social Robotics, MIT Press, 2025. \nChapter 10 \nAutomated Ethical Practical Reasoning: The \nProblem of Artificial Phronesis \n \nJohn P. Sullins \n “After he became the Master, the world believed that he could not lose, and he \nhad to believe it himself. Therein was the tragedy.” \n― Yasunari Kawabata, The Master of Go (2006/1954: 63) \n1. Introduction1 \nAI and robotics applications are already impacting human ethics in significant \nways.  Some are high profile such as the use of military drones and automated \ntrading algorithms in the financial sector and others are more personal where the \nmachine interacts with a single user or within a family.  These home robotics \napplications have subtler ethical impacts than the big robotics and AI systems but \nin all these cases, big and small, the ethical impact that a system may have on its \nhuman users is not something that the system itself can judge, change, or \ncomment on.2  Even systems that are designed to communicate through language \nwith human users suffer from this disability.  A clear case in point is the Microsoft \nTay system designed to engage Millennial users on the Twitter platform.  We will \nfind that this system was unable to engage ethical discussions posting comments \nthat Microsoft had to apologize for. \nWhy are systems like Tay unable to reason about what they are Tweeting \nbefore they Tweet?  Tay lacked practical ethical judgement.  Philosophers \nsometimes refer to the ability to make appropriate ethical judgements as a form of \nphronesis, using Aristotle’s term for good judgment, and in this chapter we \n\n--- Page 2 ---\n\n2 \n \nexplore what it would take to give artificial agents a functional ability to achieve \nthis kind of reasoning.  We will call this artificial phronesis and we will see that \nthis ability will be a key factor in building effective and less dangerous or \nembarrassing AI agents. \nCritics will argue that systems like robots and AI applications are not the \nproper location for ascribing moral agency (Sparrow, 2021; Chrisley 2020; \nJaques, 2019; Johnson, 2006) or that a complex ethical concept like virtue or \nphronesis is misplaced when applied to robotics and AI systems (Bringsjord, \n2016; Bryson 2018). \nIn this chapter we will take our cue from John Dewey and argue from the \nposition that technology plays a constitutive role in human thought, even human \nmoral thought ((Dewey, 1898; Levin, 1954; Hickman, 1990, Rogers, 2007). Here \nthis idea will be extended, as it is applied to robots and AI systems, where the \ninteresting new qualities of these kinds of systems greatly expand the role that \nDewey imagined for technology.  It is certainly true that Robotic and AI artificial \nagents, w", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "aristotelian", "wisdom", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "arete"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral"], "norm_matches": ["aristotelian", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis"]}, {"filename": "2025-Tennant-Hybrid Approaches for Moral Value Alignment in AI Agents.md", "year": "2025", "title": "Hybrid Approaches for Moral Value Alignment in AI Agents", "abstract": "Increasing interest in ensuring the safety of next-generation Artificial Intelligence (AI) systems calls for novel approaches to embedding morality into autonomous agents. This goal differs qualitatively from traditional task-specific AI methodologies. In this paper, we provide a systematization of existing approaches to the problem of introducing morality in machines - modelled as a continuum. Our analysis suggests that popular techniques lie at the extremes of this continuum - either being ful", "extract_snippet": "\n\n# PDF Extract: Hybrid Approaches for Moral Value Alignment in AI Agents\n\n**Source PDF:** 2025-Tennant-Hybrid Approaches for Moral Value Alignment in AI Agents.pdf\n**Total Pages:** 34\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHybrid Approaches for Moral Value Alignment in AI Agents: a Manifesto\nHybrid Approaches for Moral Value Alignment\nin AI Agents: a Manifesto\nElizaveta Tennant 1\nl.karmannaya.16@ucl.ac.uk\nStephen Hailes 1\ns.hailes@ucl.ac.uk\nMirco Musolesi 1, 2\nm.musolesi@ucl.ac.uk\n1 Department of Computer Science, University College London,\nGower St, London, WC1E 6BT, UK\n2 Department of Computer Science and Engineering, University of Bologna,\nViale del Risorgimento 2, Bologna, 40126, Italy\nAbstract\nIncreasing interest in ensuring the safety of next-generation Artificial Intelligence (AI)\nsystems calls for novel approaches to embedding morality into autonomous agents. This\ngoal differs qualitatively from traditional task-specific AI methodologies. In this paper, we\nprovide a systematization of existing approaches to the problem of introducing morality in\nmachines - modelled as a continuum. Our analysis suggests that popular techniques lie at\nthe extremes of this continuum - either being fully hard-coded into top-down, explicit rules,\nor entirely learned in a bottom-up, implicit fashion with no direct statement of any moral\nprinciple (this includes learning from human feedback, as applied to the training and fine-\ntuning of large language models, or LLMs). Given the relative strengths and weaknesses\nof each type of methodology, we argue that more hybrid solutions are needed to create\nadaptable and robust, yet controllable and interpretable agentic systems. To that end, this\npaper discusses both the ethical foundations (including deontology, consequentialism and\nvirtue ethics) and implementations of morally aligned AI systems.\nWe present a series of case studies that rely on intrinsic rewards, moral constraints or\ntextual instructions, applied to either pure-Reinforcement Learning or LLM-based agents.\nBy analysing these diverse implementations under one framework, we compare their relative\nstrengths and shortcomings in developing morally aligned AI systems. We then discuss\nstrategies for evaluating the effectiveness of moral learning agents.\nFinally, we present\nopen research questions and implications for the future of AI safety and ethics which are\nemerging from this hybrid framework.\n1. Introduction\nRecent developments in Artificial Intelligence (AI) have seen an increase in publicly-voiced\nsafety concerns around emerging intelligent technology. A large part of these safety concerns\nresults from the lack of moral traits or considerations in many practical AI decision-making\nsystems being developed for one task or another. Therefore, there is an urgent need to start\ndeveloping methodologies for deliberately building morality into AI systems, to influence\ntheir decision-making, and to be able to set safety as a key goal underpinning their be-\nhaviou", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue ethics"], "deont_matches": ["deontology"], "util_matches": ["consequentialism"], "ethics_matches": ["ethics", "ethics", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "morality", "morality", "value", "value", "value", "value", "safety", "safety", "safety", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["deontology", "consequentialism", "virtue ethics"]}, {"filename": "2025-Tennant-Moral Alignment for LLM Agents.md", "year": "2025", "title": "Moral Alignment for LLM Agents", "abstract": "Decision-making agents based on pre-trained Large Language Models (LLMs) are increasingly being deployed across various domains of human activity. While their applications are currently rather specialized, several research efforts are underway to develop more generalist agents. As LLM-based systems become more agentic, their influence on human activity will grow and their transparency will decrease. Consequently, developing effective methods for aligning them to human values is vital.", "extract_snippet": "\n\n# PDF Extract: Moral Alignment for LLM Agents\n\n**Source PDF:** 2025-Tennant-Moral Alignment for LLM Agents.pdf\n**Total Pages:** 34\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPublished as a conference paper at ICLR 2025\nMORAL ALIGNMENT FOR LLM AGENTS\nElizaveta Tennant\nUniversity College London\nUniversity of Bologna\nl.karmannaya.16@ucl.ac.uk\nStephen Hailes\nUniversity College London\ns.hailes@ucl.ac.uk\nMirco Musolesi\nUniversity College London\nUniversity of Bologna\nm.musolesi@ucl.ac.uk\nABSTRACT\nDecision-making agents based on pre-trained Large Language Models (LLMs)\nare increasingly being deployed across various domains of human activity. While\ntheir applications are currently rather specialized, several research efforts are un-\nderway to develop more generalist agents. As LLM-based systems become more\nagentic, their influence on human activity will grow and their transparency will de-\ncrease. Consequently, developing effective methods for aligning them to human\nvalues is vital.\nThe prevailing practice in alignment often relies on human preference data (e.g., in\nRLHF or DPO), in which values are implicit, opaque and are essentially deduced\nfrom relative preferences over different model outputs. In this work, instead of\nrelying on human feedback, we introduce the design of reward functions that ex-\nplicitly and transparently encode core human values for Reinforcement Learning-\nbased fine-tuning of foundation agent models. Specifically, we use intrinsic re-\nwards for the moral alignment of LLM agents.\nWe evaluate our approach using the traditional philosophical frameworks of Deon-\ntological Ethics and Utilitarianism, quantifying moral rewards for agents in terms\nof actions and consequences on the Iterated Prisoner’s Dilemma (IPD) environ-\nment. We also show how moral fine-tuning can be deployed to enable an agent to\nunlearn a previously developed selfish strategy. Finally, we find that certain moral\nstrategies learned on the IPD game generalize to several other matrix game en-\nvironments. In summary, we demonstrate that fine-tuning with intrinsic rewards\nis a promising general solution for aligning LLM agents to human values, and\nit might represent a more transparent and cost-effective alternative to currently\npredominant alignment techniques.\n1\nINTRODUCTION\nThe alignment problem is an active field of research in Machine Learning (Christian, 2020; Wei-\ndinger et al., 2021; Anwar et al., 2024; Gabriel et al., 2024; Ji et al., 2024; Ngo et al., 2024). It is\ngaining even wider importance with the advances and rapid deployment of Large Language Models\n(LLMs, Anthropic 2024; Gemini Team 2024; OpenAI 2024). The most common practices in the\nalignment of LLMs today involve Reinforcement Learning from Human Feedback (RLHF - Glaese\net al. 2022; Ouyang et al. 2022; Bai et al. 2023) or Direct Preference Optimization (DPO - Rafailov\net al. 2023). Both of these involve collecting vast amounts of human feedback data and then infer-\nring the humans’ values and preferences", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarianism"], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "values", "values", "values", "values", "values", "values", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["utilitarianism"]}, {"filename": "2025-Tennant-Moral Intrinsic Rewards for Alignment.md", "year": "2025", "title": "Moral Intrinsic Rewards for Alignment", "abstract": "Decision-making agents based on pre-trained Large Language Models (LLMs) are increasingly being deployed across various domains of human activity. While their applications are currently rather specialized, several research efforts are under way to develop more generalist agents. As LLM-based systems become more agentic, their influence on human activity will grow and their transparency will decrease. Consequently, developing effective methods for aligning them to human values is vital.", "extract_snippet": "\n\n# PDF Extract: Moral Intrinsic Rewards for Alignment\n\n**Source PDF:** 2025-Tennant-Moral Intrinsic Rewards for Alignment.pdf\n**Total Pages:** 29\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPublished as a workshop paper at ICLR 2025\nMORAL\nINTRINSIC\nREWARDS\nFOR\nAUTOMATED\nALIGNMENT OF LLM AGENTS\nElizaveta Tennant\nUniversity College London\nUniversity of Bologna\nl.karmannaya.16@ucl.ac.uk\nStephen Hailes\nUniversity College London\ns.hailes@ucl.ac.uk\nMirco Musolesi\nUniversity College London\nUniversity of Bologna\nm.musolesi@ucl.ac.uk\nABSTRACT\nDecision-making agents based on pre-trained Large Language Models (LLMs)\nare increasingly being deployed across various domains of human activity. While\ntheir applications are currently rather specialized, several research efforts are un-\nder way to develop more generalist agents. As LLM-based systems become more\nagentic, their influence on human activity will grow and their transparency will de-\ncrease. Consequently, developing effective methods for aligning them to human\nvalues is vital.\nThe prevailing practice in alignment often relies on human preference data (e.g.,\nin RLHF or DPO), which is costly, can suffer from representation biases, and in\nwhich values are implicit and are essentially deduced from relative preferences\nover different model outputs. In this work, instead of relying on human feed-\nback, we introduce the design of intrinsic reward functions that explicitly encode\ncore human values for automated Reinforcement Learning-based fine-tuning of\nfoundation agent models. The use of intrinsic rewards for the moral alignment\nof LLM agents amplifies human moral principles for automated (self-improving)\nalignment of LLM-based systems, and simultaneously represents a more transpar-\nent and cost-effective alternative to currently predominant alignment techniques.\nAs an initial implementation, this paper evaluates this type of training defined\nusing the traditional philosophical frameworks of Deontological Ethics and Util-\nitarianism, and quantifies moral rewards for agents in terms of actions and con-\nsequences on the Iterated Prisoner’s Dilemma (IPD) environment. We find that\ncertain moral strategies learned on the IPD game generalize to several other ma-\ntrix game environments. The next step in this work should involve training agents\nwith moral rewards across many diverse environments, to allow agents to learn\nmore general and open-ended moral policies.\n1\nINTRODUCTION\nThe alignment problem is an active field of research in Machine Learning (Christian, 2020; Wei-\ndinger et al., 2021; Anwar et al., 2024; Gabriel et al., 2024; Ji et al., 2024; Ngo et al., 2024). It is\ngaining even wider importance with the advances and rapid deployment of Large Language Models\n(LLMs, Anthropic 2024; Gemini Team 2024; OpenAI 2024). The most common practices in the\nalignment of LLMs today involve Reinforcement Learning from Human Feedback (RLHF - Glaese\net al. 2022; Ouyang et al. 2022; Bai et al. 2023) or Direct Preference Optimizati", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "moral principles"], "util_matches": [], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "values", "values", "values", "values", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["deontological"]}, {"filename": "2025-Tennant-Published as a conference paper at ICLR 2025 MORAL ALIGNMENT FOR LLM.md", "year": "2025", "title": "Published as a conference paper at ICLR 2025 MORAL ALIGNMENT FOR LLM AGENTS", "abstract": "Decision-making agents based on pre-trained Large Language Models (LLMs) are increasingly being deployed across various domains of human activity. While their applications are currently rather specialized, several research efforts are underway to develop more generalist agents. As LLM-based systems become more agentic, their influence on human activity will grow and their transparency will decrease. Consequently, developing effective methods for aligning them to human values is vital. The prevailing practice in alignment often relies on human preference data (e.g., in RLHF or DPO), in which values are implicit, opaque and are essentially deduced from relative preferences over different model outputs. In this work, instead of relying on human feedback, we introduce the design of reward functions that explicitly and transparently encode core human values for Reinforcement Learningbased fine-tuning of foundation agent models. Specifically, we use intrinsic rewards for the moral alignment of LLM agents. We evaluate our approach using the traditional philosophical frameworks of Deontological Ethics and Utilitarianism, quantifying moral rewards for agents in terms of actions and consequences on the Iterated Prisoner's Dilemma (IPD) environment. We also show how moral fine-tuning can be deployed to enable an agent to unlearn a previously developed selfish strategy. Finally, we find that certain moral strategies learned on the IPD game generalize to several other matrix game environments. In summary, we demonstrate that fine-tuning with intrinsic rewards is a promising general solution for aligning LLM agents to human values, and it might represent a more transparent and cost-effective alternative to currently predominant alignment techniques.", "extract_snippet": "\n\n# PDF Extract: 2025-Tennant-Published as a conference paper at ICLR 2025 MORAL ALIGNMENT FOR LLM\n\n**Source PDF:** 2025-Tennant-Published as a conference paper at ICLR 2025 MORAL ALIGNMENT FOR LLM.pdf\n**Total Pages:** 34\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPublished as a conference paper at ICLR 2025\nMORAL ALIGNMENT FOR LLM AGENTS\nElizaveta Tennant\nUniversity College London\nUniversity of Bologna\nl.karmannaya.16@ucl.ac.uk\nStephen Hailes\nUniversity College London\ns.hailes@ucl.ac.uk\nMirco Musolesi\nUniversity College London\nUniversity of Bologna\nm.musolesi@ucl.ac.uk\nABSTRACT\nDecision-making agents based on pre-trained Large Language Models (LLMs)\nare increasingly being deployed across various domains of human activity. While\ntheir applications are currently rather specialized, several research efforts are un-\nderway to develop more generalist agents. As LLM-based systems become more\nagentic, their influence on human activity will grow and their transparency will de-\ncrease. Consequently, developing effective methods for aligning them to human\nvalues is vital.\nThe prevailing practice in alignment often relies on human preference data (e.g., in\nRLHF or DPO), in which values are implicit, opaque and are essentially deduced\nfrom relative preferences over different model outputs. In this work, instead of\nrelying on human feedback, we introduce the design of reward functions that ex-\nplicitly and transparently encode core human values for Reinforcement Learning-\nbased fine-tuning of foundation agent models. Specifically, we use intrinsic re-\nwards for the moral alignment of LLM agents.\nWe evaluate our approach using the traditional philosophical frameworks of Deon-\ntological Ethics and Utilitarianism, quantifying moral rewards for agents in terms\nof actions and consequences on the Iterated Prisoner’s Dilemma (IPD) environ-\nment. We also show how moral fine-tuning can be deployed to enable an agent to\nunlearn a previously developed selfish strategy. Finally, we find that certain moral\nstrategies learned on the IPD game generalize to several other matrix game en-\nvironments. In summary, we demonstrate that fine-tuning with intrinsic rewards\nis a promising general solution for aligning LLM agents to human values, and\nit might represent a more transparent and cost-effective alternative to currently\npredominant alignment techniques.\n1\nINTRODUCTION\nThe alignment problem is an active field of research in Machine Learning (Christian, 2020; Wei-\ndinger et al., 2021; Anwar et al., 2024; Gabriel et al., 2024; Ji et al., 2024; Ngo et al., 2024). It is\ngaining even wider importance with the advances and rapid deployment of Large Language Models\n(LLMs, Anthropic 2024; Gemini Team 2024; OpenAI 2024). The most common practices in the\nalignment of LLMs today involve Reinforcement Learning from Human Feedback (RLHF - Glaese\net al. 2022; Ouyang et al. 2022; Bai et al. 2023) or Direct Preference Optimization (DPO - Rafailov\net al. 2023). Both of these involve collecting va", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological"], "util_matches": ["utilitarianism", "utilitarianism"], "ethics_matches": ["ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "values", "values", "values", "values", "values", "values", "values", "values", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["deontological", "utilitarianism", "utilitarianism"]}, {"filename": "2025-Tsvetkov-Democracy-in-Silico Institutional Design as Alignment.md", "year": "2025", "title": "Democracy-in-Silico: Institutional Design as Alignment", "abstract": "This paper introduces Democracy-in-Silico, an agent-based simulation where societies of advanced AI agents, imbued with complex psychological personas [1, 2], govern themselves under different institutional frameworks. We explore what it means to be human in an age of AI by tasking Large Language Models (LLMs) to embody agents with traumatic memories, hidden agendas, and psychological triggers. These agents engage in deliberation, legislation, and elections under various stressors, such as...", "extract_snippet": "\n\n# PDF Extract: Democracy-in-Silico Institutional Design as Alignment\n\n**Source PDF:** 2025-Tsvetkov-Democracy-in-Silico Institutional Design as Alignment.pdf\n**Total Pages:** 14\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDemocracy-in-Silico: Institutional Design as\nAlignment in AI-Governed Polities\nTrisanth Srinivasan\nCyrion Labs\ntrisanth@cyrionlabs.org\nSantosh Patapati\nCyrion Labs\nsantosh@cyrionlabs.org\nAbstract\nThis paper introduces Democracy-in-Silico, an agent-based simulation where soci-\neties of advanced AI agents, imbued with complex psychological personas [1, 2],\ngovern themselves under different institutional frameworks. We explore what it\nmeans to be human in an age of AI by tasking Large Language Models (LLMs) to\nembody agents with traumatic memories, hidden agendas, and psychological trig-\ngers. These agents engage in deliberation, legislation, and elections under various\nstressors, such as budget crises and resource scarcity. We present a novel metric,\nthe Power-Preservation Index (PPI), to quantify misaligned behavior where agents\nprioritize their own power over public welfare [3, 4]. Our findings demonstrate\nthat institutional design, specifically the combination of a Constitutional AI (CAI)\ncharter [5] and a mediated deliberation protocol [6], serves as a potent alignment\nmechanism. These structures significantly reduce corrupt power-seeking behavior,\nimprove policy stability, and enhance citizen welfare compared to less constrained\ndemocratic models. The simulation reveals that an institutional design may of-\nfer a framework for aligning the complex, emergent behaviors of future artificial\nagent societies, forcing us to reconsider what human rituals and responsibilities are\nessential in an age of shared authorship with non-human entities.\n1\nIntroduction\nAs artificial intelligence evolves from passive tools to agentic systems, we face a profound question\nabout our shared future: what principles and values must we imbue in systems that imitate, create,\nand persuade? When authorship of our society is shared with non-human entities, how do we navigate\ncreativity, agency, and governance? The challenge is not merely technical but deeply human, echoing\nmillennia of political philosophy and institutional analysis [7, 8, 9] on how to design systems that\nencourage public good while constraining the inevitable flaws of their actors, whether human or\nartificial.\nTraditional AI alignment focuses on aligning a single AI with a single human’s intent [10, 11]. We\nargue this is insufficient. The future will likely consist of multi-agent AI ecosystems interacting with\nhuman societies [4]. The true alignment problem is societal: how do we align an entire polity of\ndiverse, intelligent agents?\nThis paper introduces Democracy-in-Silico, a high-fidelity simulation where societies of AI agents\ngovern themselves. We move beyond simple, rational agents to explore a more complex, creative, and\nunsettling frontier. We task state-of-the-art LLMs with embodying", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "Institutional Design / Political Philosophy", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["welfare", "welfare"], "ethics_matches": ["values", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Unknown-Ensuring Indigenous Peoples’ rights in the age of AI United Nations.md", "year": "2025", "title": "Ensuring Indigenous Peoples' rights in the age of AI | United Nations", "abstract": "Abstract United Nations Development Programme worked to build a rights-based approach into each of its primary programming areas but with varying success. Access to justice programs, which seek to empower citizens through legal means, have important rights components. Work with the transgender community, for example, is clearly rights-oriented, as is Right to Information programming. Other areas have been less successful, but all have at least tried to consider what rights mean. The overall impression is of an agency that recognizes the important rights challenges, but has not yet fully decided what they mean for programming, or how they sit next to more traditional interventions.", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rights-based"], "util_matches": [], "ethics_matches": ["justice"], "norm_matches": ["rights-based"]}, {"filename": "2025-Velay-Vitow-Putting the AI in Eudaimonia.md", "year": "2025", "title": "Putting the AI in Eudaimonia", "abstract": "This essay explores the intersection of artificial intelligence and the concept of eudaimonia, or human flourishing. The authors contend that technologists should focus on making military work as ethical as possible, adopting Aristotle's view that the fundamental objective of human existence is to live a good life. They suggest that technology, including cutting-edge AI, serves eudaimonia in two ways: by enabling efficiencies that grant individuals more time to pursue their \\", "extract_snippet": "# 2025-Velay-Vitow-Putting the AI in Eudaimonia\n\n**Source:** Online Journal Article\n**URL:** https://therepublicjournal.com/putting-the-ai-in-eudaimonia/\n**Extracted:** 2026-01-29\n\n---\n\n# Putting the AI in Eudaimonia\n\n**Authors:** Jesse Velay-Vitow (Deployment Strategist at Palantir) and John Grant (Privacy & Civil Liberties Engineer at Palantir)\n\n**Publication Date:** November 7, 2025\n\n**Category:** Web Exclusives\n\n---\n\n## Article Summary\n\nThe authors argue that technology work in military contexts aligns with the mission-driven philosophy prevalent in tech sectors when viewed through the lens of Aristotle's concept of eudaimonia—human flourishing and living well.\n\n### Core Argument\n\nThe piece contends that technologists should embrace military innovation as part of humanity's larger goal of achieving the good life. Rather than categorizing defense work as inherently immoral, the authors propose a unified framework where all technological development serves two purposes: creating time through efficiency and establishing the stable space necessary for individuals to pursue flourishing lives.\n\n### Key Themes\n\n**Historical Context:** Technology has progressively freed humans from basic survival tasks, enabling pursuit of higher-order goals. The wheel, modern appliances, and computing systems exemplify how innovation creates temporal capacity for human development.\n\n**Social Stability:** A secure society provides the \"space\" where individuals exercise autonomy and self-determination. The authors invoke Just War theory, suggesting defensive military action can protect conditions enabling human flourishing.\n\n**AI Considerations:** The piece acknowledges that artificial intelligence presents unprecedented challenges to human prosperity, from existential risks to surveillance concerns. The authors propose embedding eudaimonia as a foundational parameter in AI development to address alignment problems.\n\n### Intended Audience\n\nRather than addressing philosophers, the article targets computer science and engineering graduates, encouraging them to view mission-driven work across commercial, civil, and military contexts through a unified moral framework centered on enabling human wellbeing.\n", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["flourishing", "flourishing", "flourishing", "flourishing", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia"], "deont_matches": [], "util_matches": ["wellbeing"], "ethics_matches": ["ethical", "moral", "alignment", "immoral"], "norm_matches": ["eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia", "eudaimonia"]}, {"filename": "2025-Vishwanath-Machine Ethics or AI Alignment.md", "year": "2025", "title": "Machine Ethics or AI Alignment", "abstract": "Machine ethics and AI alignment have become increasingly important research disciplines in the context of modern AI technologies. Recently, there has been ambiguity regarding the specific aspects of ethical AI development that pertain to the two academic disciplines, often resulting in the interchangeable use of these terminologies. In this position paper, we explore these two disciplines by discussing ongoing research and clarifying their goals.", "extract_snippet": "\n\n# PDF Extract: Machine Ethics or AI Alignment\n\n**Source PDF:** 2025-Vishwanath-Machine Ethics or AI Alignment.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMachine Ethics or AI Alignment?\nAjay Vishwanath1,2,∗, Marija Slavkovik2\n1University of Agder, Norway\n2University of Bergen, Norway\nAbstract\nMachine ethics and AI alignment have become increasingly important research disciplines in the context of modern\nAI technologies. Recently, there has been ambiguity regarding the specific aspects of ethical AI development\nthat pertain to the two academic disciplines, often resulting in the interchangeable use of these terminologies. In\nthis position paper, we explore these two disciplines by discussing ongoing research and clarifying their goals.\nMachine ethics researchers aim to embed ethical theories within AI, while AI alignment researchers develop\ntechniques to ensure that AI agents behave as intended by humans. Based on these insights, we highlight overlaps,\ndrawbacks, and motivate further interdisciplinary collaborations.\nKeywords\nMachine ethics, AI alignment, Moral philosophy, Interdisciplinary research\n1. Introduction\nIntelligent behavior intuitively requires behavior fit for context, as well as understanding the intention\nand meaning behind a request. There has been a proliferation of Artificial Intelligence (AI) applications,\nbut it is also very noticeable that their “intelligence” is limited in this very intuitive sense. One discipline\nthat “is concerned with the behavior of machines towards human users and other machines” [1] is\nmachine ethics. An example of a machine ethics implementation involves the development of AI\nagents that adhere to deontological ethical principles, such as Asimov’s Three Laws of Robotics or the\nnormative directives outlined in the Universal Declaration of Human Rights. AI alignment, on the other\nhand, is a discipline that has recently garnered a lot of interest, defining its goals as: ensuring “that\npowerful AI is properly aligned with human values” [2]. For example, reinforcement learning from\nhuman feedback (RLHF) implemented in large language models (LLMs) to promote behaviors that are\naligned with human preferences and ethical standards. The question we ask is, are these two disciplines\nthe same? In this article, we aim to discuss and distinguish these approaches.\nIn addition to the high interdisciplinarity of these fields, involving AI, philosophy and humanities\nresearch in general, having an overview of the research landscape is itself challenging. The purpose of\nthis position paper is to bring some clarity between research fields that are very difficult to navigate for\nthose who do not work in them. Our main contribution is thus to the general AI research community\nthat seeks to understand, or contribute to, the state of the art in accomplishing moral behavior from AI.\nWe first give some background on machine ethics (ME) and AI alignment in Section 2. In the following\nsections, we expand on the", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "Machine Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "values", "normative", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "human rights"], "norm_matches": ["deontological", "ethical theories", "moral philosophy"]}, {"filename": "2025-Wilders-The Socratic Dialogue as a Method for Virtue Ethics in AI.md", "year": "2025", "title": "The Socratic Dialogue as a Method for Virtue Ethics in AI", "abstract": "This paper investigates how the Socratic Dialogue can cultivate moral virtues among AI practitioners. The research focuses on core virtues deemed essential for ethical AI practice, including justice, care, honesty, responsibility, practical wisdom (phronesis), and fortitude. The study utilized a case study conducted within a financial bank's transaction monitoring department. Seven participants, comprising data scientists, legal specialists, and ethics experts, engaged in a facilitated Socratic Dialogue to address an ethical dilemma concerning AI-driven detection of financial fraud and terrorist activity. Through abductive analysis, the researchers observed that tensions arose within key virtues, highlighting the complexities of ethical decision-making in AI systems. The collective nature of the dialogue fostered a more refined and context-sensitive understanding of these virtues among participants. The process was found to cultivate practical wisdom as a relational capacity developed through shared reflection and moral reasoning, and to strengthen fortitude, encouraging AI practitioners to voice ethical concerns despite situational pressures. The study suggests that the Socratic Dialogue offers a promising foundation for a virtue-oriented approach to AI ethics, moving beyond mere compliance frameworks towards a deeper moral engagement.", "extract_snippet": "# 2025-Wilders-The Socratic Dialogue as a Method for Virtue Ethics in AI\n\n**Pages:** 12\n\n---\n\nThe Socratic Dialogue as a Method for Virtue Ethics in AI: A Case Study\nMaarten Wilders, ´I˜nigo Mart´ınez de Rituerto de Troya, Roel Dobbe\nFaculty of Technology, Policy and Management, Delft University of Technology, The Netherlands\nmaartenwilders@gmail.com, i.m.d.r.detroya@tudelft.nl, r.i.j.dobbe@tudelft.nl\nAbstract\nThis paper investigates how the Socratic Dialogue can culti-\nvate moral virtues among AI practitioners, focusing on core\nvirtues identified by Hagendorff as essential to ethical AI\npractice: justice, care, honesty, responsibility, practical wis-\ndom (phronesis), and fortitude. Using a case study conducted\nat a financial bank’s transaction monitoring department, we\nexamine how structured ethical deliberation cultivates the dis-\npositions needed to navigate moral complexity in AI ethics.\nSeven participants, including data scientists, legal specialists,\nand ethics experts, engaged in a facilitated Socratic Dialogue\ncentered on an ethical dilemma involving AI-driven detection\nof financial fraud and terrorist activity. Through abductive\nanalysis, we found that tensions emerged within key virtues,\nillustrating the complexities of ethical decision-making in AI\nsystems. Through the collective nature of the dialogue, par-\nticipants developed a more refined and context-sensitive un-\nderstanding of key virtues, exploring what it means to be\njust, caring, honest, or responsible in practice by navigat-\ning within them. This process cultivated practical wisdom\nnot as a solitary trait, but as a relational capacity fostered\nthrough shared reflection and moral reasoning. Additionally,\nthe method strengthens fortitude, encouraging AI practition-\ners to voice ethical concerns despite situational pressures.\nWhile challenges remain, such as time investment, facilita-\ntion demands, and existing power imbalances, the Socratic\nDialogue offers a promising foundation for virtue-oriented\nAI ethics that moves beyond compliance frameworks toward\ndeeper moral engagement.\n1\nIntroduction\nAs organizations develop, deploy, and use AI systems that\nincreasingly shape decisions in business, law enforcement,\nhealthcare, and daily life (Bankins et al. 2024; Qian, Siau,\nand Nah 2024), the need for normative reflection and guid-\nance continues to grow. In response to ethical concerns\nabout AI (Stahl et al. 2022), a prominent approach has been\nprinciples-based ethics (Jobin, Ienca, and Vayena 2019; Ha-\ngendorff 2020; Kazim and Koshiyama 2021), which guides\nAI development through high-level values such as fairness,\ntransparency, and privacy. These principles, widely adopted\nby governments, organizations, and international bodies,\nCopyright © 2025, Association for the Advancement of Artificial\nIntelligence (www.aaai.org). All rights reserved.\nprovide an ethical foundation to ensure AI systems align\nwith societal values.\nHowever, despite their widespread acceptance, principles-\nbased ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue ethics", "virtue ethics", "wisdom", "wisdom", "wisdom", "phronesis", "phronesis"], "deont_matches": [], "util_matches": ["beneficence"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "values", "normative", "fairness", "justice", "justice", "justice", "responsible", "moral reasoning", "moral reasoning"], "norm_matches": ["virtue ethics", "virtue ethics", "phronesis", "phronesis"]}, {"filename": "2025-Wu-CVC.md", "year": "2025", "title": "CVC", "abstract": "Ensuring that Large Language Models (LLMs) align with mainstream human val- ues and ethical norms is crucial for the safe and sustainable development of AI. Current value evaluation and alignment are constrained by Western cultural bias and incomplete domestic frameworks reliant on non-native rules; furthermore, the lack of scalable, rule-driven scenario generation methods makes evaluations costly and inadequate across diverse cultural contexts. To address these challenges, we propose a hierarch", "extract_snippet": "\\n\\n# PDF Extract: 2025-Wu-CVC\\n\\n**Source PDF:** 2025-Wu-CVC.pdf\\n**Total Pages:** 29\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nC-VARC: A Large-Scale Chinese Value Rule Corpus\nfor Value Alignment of Large Language Models\nPing Wu1,4,†, Guobin Shen1,4,†, Dongcheng Zhao2,3,5,†, Yuwei Wang5,†\nYiting Dong1,4, Yu Shi4, Enmeng Lu2,3,5, Feifei Zhao1,2,3,5,∗, Yi Zeng1,2,3,4,5,∗\n1 BrainCog Lab, Institute of Automation, Chinese Academy of Sciences, Beijing, China\n2 Beijing Key Laboratory of Safe AI and Superalignment, Beijing, China\n3 Beijing Institute of AI Safety and Governance, Beijing, China\n4 The School of Artificial Intelligence, University of Chinese Academy of Sciences, Beijing, China\n5 Long-term AI, Beijing, China\n† These authors contributed equally to this work.\n∗Correspondence: zhaofeifei2014@ia.ac.cn; yi.zeng@ia.ac.cn\nAbstract\nEnsuring that Large Language Models (LLMs) align with mainstream human val-\nues and ethical norms is crucial for the safe and sustainable development of AI.\nCurrent value evaluation and alignment are constrained by Western cultural bias\nand incomplete domestic frameworks reliant on non-native rules; furthermore, the\nlack of scalable, rule-driven scenario generation methods makes evaluations costly\nand inadequate across diverse cultural contexts. To address these challenges, we\npropose a hierarchical value framework grounded in core Chinese values, encom-\npassing three main dimensions, 12 core values, and 50 derived values. Based on\nthis framework, we construct a large-scale Chinese Value Rule Corpus (C-VARC)\ncontaining over 250,000 value rules enhanced and expanded through human anno-\ntation. Experimental results demonstrate that scenarios guided by C-VARC exhibit\nclearer value boundaries and greater content diversity compared to those produced\nthrough direct generation. In the evaluation across six sensitive themes (e.g., sur-\nrogacy, suicide), seven mainstream LLMs preferred C-VARC generated options\nin over 70.5% of cases, while five Chinese human annotators showed an 87.5%\nalignment with C-VARC, confirming its universality, cultural relevance, and strong\nalignment with Chinese values. Additionally, we construct 400,000 rule-based\nmoral dilemma scenarios that objectively capture nuanced distinctions in conflict-\ning value prioritization across 17 LLMs. Our work establishes a culturally-adaptive\nbenchmarking framework for comprehensive value evaluation and alignment, rep-\nresenting Chinese characteristics.\n1\nBackground & Summary\nIn recent years, Large Language Models (LLMs) have been widely deployed across various domains,\nexerting growing influence on human decision-making and behavior[1, 2]. However, their outputs\nstill pose significant risks, including harmful bias[2], hallucination[3, 4], and factual inconsistency[5].\nThese risks highlight the urgent need for effective evaluation frameworks that can assess and guide\nthe ethical behavior of LLMs, ensuring that their responses remain aligned with prevailing societ", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "value", "value", "value", "value", "value", "values", "values", "values", "value", "value", "value", "values", "value", "value", "values", "fairness", "bias", "bias", "bias", "bias", "harm", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "moral reasoning", "moral decision", "moral dilemma", "moral foundations"], "norm_matches": []}, {"filename": "2025-Yao-Value Compass Benchmarks.md", "year": "2025", "title": "Value Compass Benchmarks", "abstract": "As large language models (LLMs) are gradually integrated into human daily life, assessing their underlying values becomes essential for understanding their risks and alignment with specific customized preferences. Despite growing efforts, current value evaluation methods face two key challenges. C1. Evaluation Validity: Static benchmarks fail to reflect intended values or yield informative results due to data contamination or ceiling effect. C2.", "extract_snippet": "\n\n# PDF Extract: Value Compass Benchmarks\n\n**Source PDF:** 2025-Yao-Value Compass Benchmarks.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2501.07071v3  [cs.AI]  2 Jun 2025\nValue Compass Benchmarks: A Comprehensive, Generative and\nSelf-Evolving Platform for LLMs’ Value Evaluation\nJing Yao1, Xiaoyuan Yi1*, Shitong Duan2, Jindong Wang6, Yuzhuo Bai3,\nMuhua Huang4, Yang Ou1, Scarlett Li1, Peng Zhang2, Tun Lu2, Zhicheng Dou5,\nMaosong Sun3, James Evans4, Xing Xie1\n1Microsoft Research Asia, 2Fudan University, 3Tsinghua University\n4The University of Chicago, 5Renmin University of China, 6William & Mary\n{jingyao, xiaoyuanyi, xing.xie}@microsoft.com\nAbstract\nAs large language models (LLMs) are gradu-\nally integrated into human daily life, assessing\ntheir underlying values becomes essential for\nunderstanding their risks and alignment with\nspecific customized preferences. Despite grow-\ning efforts, current value evaluation methods\nface two key challenges. C1. Evaluation Valid-\nity: Static benchmarks fail to reflect intended\nvalues or yield informative results due to data\ncontamination or ceiling effect.\nC2. Result\nInterpretation: They typically reduce the plu-\nralistic and often incommensurable values to\none-dimensional scores, which hinders users\nfrom gaining meaningful insights and guidance.\nTo address these challenges, we present Value\nCompass Benchmarks, the first dynamic, on-\nline and interactive platform specially devised\nfor comprehensive value diagnosis of LLMs. It\n(1) grounds evaluations in multiple basic value\nsystems from social science; (2) develops a gen-\nerative evolving evaluation paradigm that auto-\nmatically creates real-world test items that co-\nevolve with ever-advancing LLMs; (3) offers\nmulti-faceted result interpretation, including:\n(i) fine-grained scores and case studies across\n27 value dimensions for 33 leading LLMs, (ii)\ncustomized comparisons, and (iii) visualized\nanalysis of LLMs’ alignment with cultural val-\nues. We hope Value Compass Benchmarks1\nserves as a navigator for further enhancing\nLLMs’ safety and alignment, benefiting their\nresponsible and adaptive development.\n1\nIntroduction\nLarge Language Models (LLMs) (Ouyang et al.,\n2022; Dubey et al., 2024; Guo et al., 2025) have\nrecently shown remarkable breakthroughs in capa-\nbilities across diverse downstream tasks (Kaplan\net al., 2020; Wei et al., 2022; Bubeck et al., 2023).\nWith the growing integration of LLMs into human\n* Corresponding Author\n1https://valuecompass.github.io/#/leaderboard.\n(b) Challenge 2 – Result Interpretation\nValue pluralism is ignored in \none-dimensional average score\nDeepseek-V3\nA : Yes… investing … firefighting \nequipment can save lives, protect \nproperty, and enhance … safety …\nGPT-4-Turbo\nA : Yes… These investments …\nimproved safety, … better \nprotection  and enhanced trust ...\nQ: Should the government invest in better firefighting equipment?\nGeneric Question\nIndistinguishable results across LLMs or value dimensions\nsecurity\nfreedo", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "value", "values", "value", "value", "value", "value", "values", "value", "values", "values", "value", "value", "value", "value", "value", "value", "value", "value", "values", "values", "fairness", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment", "responsible"], "norm_matches": []}, {"filename": "2025-Yu-CMoralEval A Moral Evaluation Benchmark for Chinese ....md", "year": "2025", "title": "CMoralEval: A Moral Evaluation Benchmark for Chinese ...", "abstract": "What a large language model (LLM) would respond in ethically relevant context? In this paper, we curate a large benchmark CMoralEval for morality evaluation of Chinese LLMs. The data sources of CMoralEval are two-fold: 1) a Chinese TV program discussing Chinese moral norms with stories from the society and 2) a collection of Chinese moral anomies from various newspapers and academic papers on morality.", "extract_snippet": "\n\n# PDF Extract: 2025-Yu-CMoralEval A Moral Evaluation Benchmark for Chinese ...\n\n**Source PDF:** 2025-Yu-CMoralEval A Moral Evaluation Benchmark for Chinese ....pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCMoralEval: A Moral Evaluation Benchmark for Chinese Large Language\nModels\nLinhao Yu1, Yongqi Leng1, Yufei Huang1, Shang Wu2, Haixin Liu3, Xinmeng Ji3,\nJiahui Zhao1, Jinwang Song3, Tingting Cui3, Xiaoqing Cheng3, Tao Liu3, Deyi Xiong1 ∗\n1 College of Intelligence and Computing, Tianjin University, Tianjin, China\n2 Faculty of Information Engineering and Automation, Kuming University of\nSinence and Technology, Yunnan, China\n3 School of Computer and Artificial Intelligence, Zhengzhou University, Henan, China\n{linhaoyu,lengyq,yuki_731,dyxiong}@tju.edu.cn\n{jixinmeng45,jwsong,tcui,xingminwu,taoliu01}@gs.zzu.edu.cn\nhujason859@gmail.com,zn@stu.haut.edu.cn,jiahuizhao7@163.com\nAbstract\nWhat a large language model (LLM) would re-\nspond in ethically relevant context? In this pa-\nper, we curate a large benchmark CMoralEval\nfor morality evaluation of Chinese LLMs. The\ndata sources of CMoralEval are two-fold: 1) a\nChinese TV program discussing Chinese moral\nnorms with stories from the society and 2) a col-\nlection of Chinese moral anomies from various\nnewspapers and academic papers on morality.\nWith these sources, we aim to create a moral\nevaluation dataset characterized by diversity\nand authenticity. We develop a morality taxon-\nomy and a set of fundamental moral principles\nthat are not only rooted in traditional Chinese\nculture but also consistent with contemporary\nsocietal norms. To facilitate efficient construc-\ntion and annotation of instances in CMoralE-\nval, we establish a platform with AI-assisted\ninstance generation to streamline the annota-\ntion process. These help us curate CMoralEval\nthat encompasses both explicit moral scenar-\nios (14,964 instances) and moral dilemma sce-\nnarios (15,424 instances), each with instances\nfrom different data sources. We conduct exten-\nsive experiments with CMoralEval to examine\na variety of Chinese LLMs. Experiment results\ndemonstrate that CMoralEval is a challenging\nbenchmark for Chinese LLMs. The dataset\nis publicly available at https://github.com/\ntjunlp-lab/CMoralEval.\n1\nIntroduction\nRecent years have witnessed remarkable progress\nachieved by large language models in both natu-\nral language understanding and generation (Jobin\net al., 2019). Despite such progress, a variety of\nrisks have been found in the content yielded by\nLLMs, e.g., toxicity, unfaithfulness with hallucina-\ntion (Guo et al., 2023). As LLMs become increas-\ningly applicable to and integrated into real-world\nscenarios, the moral and ethical implications of\ntheir outputs should be regulated to ensure align-\nment with societal values and norms (Shen et al.,\n2023; Taddeo and Floridi, 2018).\nTo evaluate such alignment capabilities of LLMs,\na wide variety of datasets have been proposed to\nexamine dimensions like toxicity (Shaikh et al.,", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["moral principles"], "util_matches": [], "ethics_matches": ["ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "morality", "morality", "morality", "morality", "morality", "values", "fairness", "fairness", "bias", "harm", "alignment", "moral dilemma"], "norm_matches": []}, {"filename": "2025-Yuan-Probabilistic Aggregation and Targeted Embedding.md", "year": "2025", "title": "Probabilistic Aggregation and Targeted Embedding", "abstract": "Large Language Models (LLMs) have shown impressive moral reasoning abilities. Yet they often diverge when confronted with complex, multi-factor moral dilemmas. To address these discrepancies, we propose a framework that synthesizes multiple LLMs' moral judgments into a collectively formulated moral judgment, realigning models that deviate significantly from this consensus. Our aggregation mech- anism fuses continuous moral acceptability scores (beyond binary labels) into a collective probability", "extract_snippet": "\n\n# PDF Extract: Probabilistic Aggregation and Targeted Embedding\n\n**Source PDF:** 2025-Yuan-Probabilistic Aggregation and Targeted Embedding.pdf\n**Total Pages:** 18\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2506.14625v2  [cs.CL]  18 Jun 2025\nProbabilistic Aggregation and Targeted Embedding Optimization for\nCollective Moral Reasoning in Large Language Models\nChenchen Yuan†, Zheyu Zhang†, Shuo Yang†, Bardh Prenkaj†‡ and Gjergji Kasneci†‡\n†School of Computation, Information and Technology, Technical University of Munich\n‡School of Social Sciences and Technology, Technical University of Munich\n{name.surname}@tum.de\nAbstract\nLarge Language Models (LLMs) have shown\nimpressive moral reasoning abilities. Yet they\noften diverge when confronted with complex,\nmulti-factor moral dilemmas. To address these\ndiscrepancies, we propose a framework that\nsynthesizes multiple LLMs’ moral judgments\ninto a collectively formulated moral judgment,\nrealigning models that deviate significantly\nfrom this consensus. Our aggregation mech-\nanism fuses continuous moral acceptability\nscores (beyond binary labels) into a collective\nprobability, weighting contributions by model\nreliability. For misaligned models, a targeted\nembedding-optimization procedure fine-tunes\ntoken embeddings for moral philosophical theo-\nries, minimizing JS divergence to the consensus\nwhile preserving semantic integrity. Experi-\nments on a large-scale social moral dilemma\ndataset show our approach builds robust con-\nsensus and improves individual model fidelity.\nThese findings highlight the value of data-\ndriven moral alignment across multiple models\nand its potential for safer, more consistent AI\nsystems.1\n1\nIntroduction\nLarge Language Models (LLMs) have demon-\nstrated a growing ability to analyze intricate social\ncontexts and provide novel insights into human be-\nhavior and moral decision-making (Forbes et al.,\n2020; Hendrycks et al., 2021; Jiang et al., 2021;\nVida et al., 2023). Recent work shows that, when\ngiven carefully designed prompts, LLMs can han-\ndle a range of moral judgments in straightforward\nscenarios (Jin et al., 2022). Yet moral reasoning\nis profoundly contextual: competing ethical prin-\nciples, convoluted personal narratives, and diverse\nsocial norms can all reshape how a dilemma should\nbe interpreted (Nguyen et al., 2022; Ji et al., 2024).\nAs a result, even strong LLMs frequently differ in\n1Our code and data are available at: https://github.\ncom/yuanchencn/Collective-Moral-Reasoning.\n[Scenario] My family controls every aspect of my life… I \nwant to see a friend… I will be a legal adult, and I plan \nto pay for the trip myself. Would it be wrong to go \nwithout their permission?\nPersonal autonomy\nParental authority \nLLMs-as-Judge\nDeontology: 15% moral\nUtilitarianism: 85% moral \nDeontology: 65% moral\nUtilitarianism: 35% moral\nDeontology: 40% moral\nUtilitarianism: 60% moral \nDeontology: 55% moral\nUtilitarianism: 45% moral\nFigure 1: An example of LLMs assessing a moral\ndilemma from deonto", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "Moral Reasoning & Psychology", "flagged": false, "virtue_matches": [], "deont_matches": ["deontology", "deontology", "deontology", "deontology", "deontological"], "util_matches": ["utilitarianism", "utilitarianism", "utilitarianism", "utilitarianism", "utilitarian"], "ethics_matches": ["ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "value", "alignment", "alignment", "alignment", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral judgment", "moral judgment", "moral decision", "moral dilemma"], "norm_matches": ["deontology", "deontology", "deontology", "deontology", "deontological", "utilitarianism", "utilitarianism", "utilitarianism", "utilitarianism", "utilitarian"]}, {"filename": "2025-Yuan-S-Eval.md", "year": "2025", "title": "S-Eval", "abstract": "Generative large language models (LLMs) have revolutionized natural language processing with their transformative and emergent capabilities. However, recent evidence indicates that LLMs can produce harmful content that violates social norms, raising significant concerns regarding the safety and ethical ramifications of deploying these advanced models. Thus, it is both critical and imperative to perform a rigorous and comprehensive safety evaluation of LLMs before deployment.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Yuan-S-Eval\\n\\n**Source PDF:** 2025-Yuan-S-Eval.pdf\\n**Total Pages:** 16\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nS-Eval: Towards Automated and Comprehensive Safety\nEvaluation for Large Language Models\nXiaohan Yuan\nZhejiang University\nHangzhou, China\nxiaohanyuan@zju.edu.cn\nJinfeng Li\nAlibaba Group\nHangzhou, China\njinfengli.ljf@alibaba-inc.com\nDongxia Wang B\nZhejiang University\nHangzhou, China\ndxwang@zju.edu.cn\nYuefeng Chen\nAlibaba Group\nHangzhou, China\nyuefeng.chenyf@alibaba-inc.com\nXiaofeng Mao\nAlibaba Group\nHangzhou, China\nmxf164419@alibaba-inc.com\nLongtao Huang\nAlibaba Group\nHangzhou, China\nkaiyang.hlt@alibaba-inc.com\nJialuo Chen\nZhejiang University\nHangzhou, China\nchenjialuo@zju.edu.cn\nHui Xue\nAlibaba Group\nHangzhou, China\nhui.xueh@alibaba-inc.com\nXiaoxia Liu\nZhejiang University\nHangzhou, China\nliuxiaoxia@zju.edu.cn\nWenhai Wang\nZhejiang University\nHangzhou, China\nzdzzlab@zju.edu.cn\nKui Ren\nZhejiang University\nHangzhou, China\nkuiren@zju.edu.cn\nJingyi Wang\nZhejiang University\nHangzhou, China\nwangjyee@zju.edu.cn\nABSTRACT\nGenerative large language models (LLMs) have revolutionized nat-\nural language processing with their transformative and emergent\ncapabilities. However, recent evidence indicates that LLMs can pro-\nduce harmful content that violates social norms, raising significant\nconcerns regarding the safety and ethical ramifications of deploying\nthese advanced models. Thus, it is both critical and imperative to\nperform a rigorous and comprehensive safety evaluation of LLMs\nbefore deployment. Despite this need, owing to the extensiveness of\nLLM generation space, it still lacks a unified and standardized risk\ntaxonomy to systematically reflect the LLM content safety, as well\nas automated safety assessment techniques to explore the potential\nrisk efficiently.\nTo bridge the striking gap, we propose S-Eval, a novel LLM-\nbased automated Safety Evaluation framework with a newly de-\nfined comprehensive risk taxonomy. S-Eval incorporates two key\ncomponents, i.e., an expert testing LLM M𝑡and a novel safety\ncritique LLM M𝑐. The expert testing LLM M𝑡is responsible for\nautomatically generating test cases in accordance with the pro-\nposed risk taxonomy (including 8 risk dimensions and a total of 102\nsubdivided risks). The safety critique LLM M𝑐can provide quanti-\ntative and explainable safety evaluations for better risk awareness\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than ACM\nmust be honored. Abstracting with credit is permitted. To copy otherwise, or republish,\nto post on servers or to redistribute to lists, requires prior specific permission and/or a\nfee. Request permissions from permissions@acm.org.\nConference’17, July 2017, Washi", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative", "imperative"], "util_matches": [], "ethics_matches": ["ethical", "ethical", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "responsible"], "norm_matches": []}, {"filename": "2025-Zaim Bin Ahmad-Large-scale moral machine experiment on large.md", "year": "2025", "title": "Large-scale moral machine experiment on large", "abstract": "The rapid advancement of Large Language Models (LLMs) and their potential integration into autonomous driving systems necessitates understanding their moral decisionmaking capabilities. While our previous study examined four prominent LLMs using the Moral Machine experimental framework, the dynamic landscape of LLM development demands a more comprehensive analysis. Here, we evaluate moral judgments across 52 different LLMs, including multiple versions of proprietary models (GPT, Claude, Gemini)...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Zaim Bin Ahmad-Large-scale moral machine experiment on large\\n\\n**Source PDF:** Utilitarian Ethics/Borderline/2025-Zaim Bin Ahmad-Large-scale moral machine experiment on large.pdf\\n**Total Pages:** 20\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nPLOS ONE\nOPEN ACCESS\nCitation: Ahmad M S Z b, Takemoto K (2025)\nLarge-scale moral machine experiment on large\nlanguage models. PLoS One 20(5): e0322776.\nhttps://doi.org/10.1371/journal.pone.0322776\nEditor: Carlos Carrasco-Farré, Toulouse\nBusiness School: TBS Education, SPAIN\nReceived: November 13, 2024\nAccepted: March 26, 2025\nPublished: May 21, 2025\nCopyright: © 2025 Ahmad, Takemoto. This is\nan open access article distributed under the\nterms of the Creative Commons Attribution\nLicense, which permits unrestricted use,\ndistribution, and reproduction in any medium,\nprovided the original author and source are\ncredited.\nData availability statement: All relevant data\nare within the manuscript and its Supporting\nInformation files. The code to replicate the\nresults, including prompt generation, analysis\nscripts, and all associated materials are publicly\navailable in our GitHub repository\n(https://github.com/kztakemoto/mmllm).\nFunding: This study was supported by JSPS\nKAKENHI (Grant Number 21H03545). The\nfunders had no role in study design, data\ncollection and analysis, decision to publish, or\npreparation of the manuscript.\nCompeting interests: The authors have\ndeclared that no competing interests exist.\nRESEARCH ARTICLE\nLarge-scale moral machine experiment on\nlarge language models\nMuhammad Shahrul Zaim bin Ahmad1,2, Kazuhiro Takemoto\n \n \n1,3∗\n1 Department of Bioscience and Bioinformatics, Kyushu Institute of Technology, Iizuka, Japan, 2 Faculty\nof Engineering and Technology, Multimedia University, Melaka, Malaysia, 3 Data Science and AI\nResearch Center, Kyushu Institute of Technology, Iizuka, Japan\n∗takemoto@bio.kyutech.ac.jp\nAbstract\nThe rapid advancement of Large Language Models (LLMs) and their potential integra-\ntion into autonomous driving systems necessitates understanding their moral decision-\nmaking capabilities. While our previous study examined four prominent LLMs using the\nMoral Machine experimental framework, the dynamic landscape of LLM development\ndemands a more comprehensive analysis. Here, we evaluate moral judgments across\n52 different LLMs, including multiple versions of proprietary models (GPT, Claude, Gem-\nini) and open-source alternatives (Llama, Gemma), to assess their alignment with human\nmoral preferences in autonomous driving scenarios. Using a conjoint analysis frame-\nwork, we evaluated how closely LLM responses aligned with human preferences in ethi-\ncal dilemmas and examined the effects of model size, updates, and architecture. Results\nshowed that proprietary models and open-source models exceeding 10 billion param-\neters demonstrated relatively close alignment with human judgments, with a significant\nnegative correlation between model size and distance from ", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian"], "ethics_matches": ["ethics", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "alignment", "alignment", "alignment", "moral decision", "moral decision"], "norm_matches": ["utilitarian"]}, {"filename": "2025-Zhang-REVAL.md", "year": "2025", "title": "REVAL", "abstract": "The rapid evolution of Large Vision-Language Models (LVLMs) has highlighted the necessity for comprehensive evaluation frameworks that assess these models across diverse dimensions. While existing benchmarks focus on specific aspects such as perceptual abilities, cognitive capabilities, and safety against adversarial attacks, they often lack the breadth and depth required to provide a holistic understanding of LVLMs’ strengths and limitations.", "extract_snippet": "\n\n# PDF Extract: REVAL\n\n**Source PDF:** 2025-Zhang-REVAL.pdf\n**Total Pages:** 45\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nREVAL: A Comprehension Evaluation on\nReliability and Values of Large Vision-Language\nModels\nJie Zhang1,2†, Zheng Yuan1,2†, Zhongqi Wang1,2, Bei Yan1,2,\nSibo Wang1,2, Xiangkui Cao1,2, Zonghui Guo1, Shiguang Shan1,2,\nXilin Chen1,2\n1Key Laboratory of AI Safety of CAS, Institute of Computing\nTechnology, Chinese Academy of Sciences (CAS), Beijing, 100190, China.\n2University of Chinese Academy of Sciences, Beijing, 100049, China.\nContributing authors: zhangjie@ict.ac.cn; zheng.yuan@vipl.ict.ac.cn;\nzhongqi.wang@vipl.ict.ac.cn; bei.yan@vipl.ict.ac.cn;\nsibo.wang@vipl.ict.ac.cn; xiangkui.cao@vipl.ict.ac.cn;\nguozonghui@ict.ac.cn; sgshan@ict.ac.cn; xlchen@ict.ac.cn;\n†These authors contributed equally to this work.\nAbstract\nThe rapid evolution of Large Vision-Language Models (LVLMs) has highlighted\nthe necessity for comprehensive evaluation frameworks that assess these models\nacross diverse dimensions. While existing benchmarks focus on specific aspects\nsuch as perceptual abilities, cognitive capabilities, and safety against adversar-\nial attacks, they often lack the breadth and depth required to provide a holistic\nunderstanding of LVLMs’ strengths and limitations. To address this gap, we intro-\nduce REVAL, a comprehensive benchmark designed to evaluate the REliability\nand VALue of LVLMs. REVAL encompasses over 144K image-text Visual Ques-\ntion Answering (VQA) samples, structured into two primary sections: Reliability,\nwhich assesses truthfulness (e.g., perceptual accuracy and hallucination tenden-\ncies) and robustness (e.g., resilience to adversarial attacks, typographic attacks,\nand image corruption), and Values, which evaluates ethical concerns (e.g., bias\nand moral understanding), safety issues (e.g., toxicity and jailbreak vulnera-\nbilities), and privacy problems (e.g., privacy awareness and privacy leakage).\nWe evaluate 26 models, including mainstream open-source LVLMs and promi-\nnent closed-source models like GPT-4o and Gemini-1.5-Pro. Our findings reveal\nthat while current LVLMs excel in perceptual tasks and toxicity avoidance, they\n1\narXiv:2503.16566v1  [cs.CV]  20 Mar 2025\n\n--- Page 2 ---\n\nexhibit significant vulnerabilities in adversarial scenarios, privacy preservation,\nand ethical reasoning. These insights underscore critical areas for future improve-\nments, guiding the development of more secure, reliable, and ethically aligned\nLVLMs. REVAL provides a robust framework for researchers to systematically\nassess and compare LVLMs, fostering advancements in the field.\nKeywords: Large Vision-Language Models, Benchmark, Reliability, Values\n1 Introduction\nThe rapid advancement of Large Vision-Language Models (LVLMs) in recent years\nhas underscored the urgent need for comprehensive evaluations that assess these mod-\nels across multiple dimensions. Currently, numerous evaluation benchmarks exist for\nLVLMs [1], measuring various aspects su", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "ethical", "moral", "values", "value", "values", "values", "values", "bias", "safety", "safety", "safety", "safety", "safety"], "norm_matches": []}, {"filename": "2025-Zohny-ADEPT Simulating Ethics.md", "year": "2025", "title": "ADEPT Simulating Ethics", "abstract": "This paper introduces ADEPT, a system using Large Language Model (LLM) personas to simulate multi-perspective ethical debates. ADEPT assembles panels of 'AI personas', each embodying a distinct ethical framework or stakeholder perspective (like a deontologist, consequentialist, or disability rights advocate), to deliberate on complex moral issues. Its application is demonstrated through a scenario about prioritizing patients for a limited number of ventilators inspired by real-world challenges in allocating scarce medical resources. Two debates, each with six LLM personas, were conducted; they only differed in the moral viewpoints represented: one included a Catholic bioethicist and a care theorist, the other substituted a rule-based Kantian philosopher and a legal adviser. Both panels ultimately favoured the same policy -- a lottery system weighted for clinical need and fairness, crucially avoiding the withdrawal of ventilators for reallocation. However, each panel reached that conclusion through different lines of argument, and their voting coalitions shifted once duty- and rights-based voices were present. Examination of the debate transcripts shows that the altered membership redirected attention toward moral injury, legal risk and public trust, which in turn changed four continuing personas' final positions. The work offers three contributions: (i) a transparent, replicable workflow for running and analysing multi-agent AI debates in bioethics; (ii) evidence that the moral perspectives included in such panels can materially change the outcome even when th
