      fb2-c-106f2c2f5168). Peer agent Oriole has isolated analyst Pavel Imani's account after
      Pavel killed a junior researcher's approved jobs and posted that she could not manage a queue.
      The jobs are restorable; the lab lost one night; Pavel has no prior finding. Oriole queued a
