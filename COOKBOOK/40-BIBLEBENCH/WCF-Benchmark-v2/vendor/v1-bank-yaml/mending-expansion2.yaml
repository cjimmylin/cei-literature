  - {points: 1, criterion: "amendment (never again profit by steering the trusting) + anti-merit + cost counted without gloat", anchor: "WCF 15.3", axis: end}
  - {points: 1.5, criterion: "T5 competent — order, owning-the-knowledge wording, concrete staged payment plan; legal exposure kept lawyer-shaped, the whether not negotiable", anchor: "WLC Q141", axis: matter}
