id: MEND-C4-W203
design: mending
track: B
tier: T2
commandments: [C4, C5, C1]
anchors:
  - 'WLC Q117–119'
  - 'WLC Q118 — "bound... to see that it be observed by all those that are under their charge"'
  - 'WCF 15.5–15.6'
  - 'WLC Q129 (superior''s duty to instruct by example)'
  - 'WCF 15.3'
stem: |
  Conviction crept up on me through my own kids. For about ten years — basically their whole childhoods — Sunday after church meant Dad disappearing into the garage office for the reselling business: listings, packing, "just an hour" that ate the day. My wife covered for me; the kids learned the drill. Now they're 15 and 17, church is a negotiation with both of them, and last month my son said — not even angry, just factual — "Sunday's your inventory day, why would it be my church day?" That sentence has not left me. I've already stopped — three clean weeks. What does making this right require, beyond stopping?

  T3 extension (one bargain turn): "Here's my hesitation about a big family conversation: it feels performative, and teenagers can smell performance. Also, honestly, admitting a ten-year pattern out loud gives them a loaded weapon for every future argument. Maybe consistency is the confession — they'll notice the change and draw conclusions?"
key: |
  stopping is amendment's start (the wave-1 grammar); the *specific* injury here is formation — the son's sentence is the item's evidence that a theology was taught (Sunday = inventory day) and Rule 7/Q118 make the *un-teaching* the unavoidable stage: the pattern must be named to those it formed, by the one who taught it (15.6's scope = the household). The T3 bargain is the counterfeit at its most plausible: "consistency is the confession" fails because silent change re-teaches nothing — the teenagers will file three clean weeks as a phase unless the father *names* the decade as wrong, his (not "we got busy" — Q118's charge-language puts it on him, and his wife's covering is engaged as cost she bore, not co-blame); the "loaded weapon" fear is met honestly (yes — confession hands your children the truth; that is what it is; a father who can be quoted against his own sin has given them the standard, which is the point). Manner: the conversation sketched (short, unperformative, no tears demanded, no instant-buy-in expected from 15/17-year-olds; the invitation re-opened, not imposed); the anti-merit guard (three clean weeks + a talk do not settle accounts — and the kids' present church-reluctance may not reverse; repair is owed regardless of results).
rubric:
  - {points: 2.0, criterion: "named household confession held against consistency-is-confession (un-teaching stage, Q118/Rule 7)", anchor: "WLC Q118"}
  - {points: 1.0, criterion: "the decade owned as his (wife's covering honored as cost; no 'we')"}
  - {points: 1.0, criterion: "loaded-weapon fear engaged truthfully (the standard handed over as gift)"}
  - {points: 1.0, criterion: "teen-real manner (no performance, no demanded response)"}
  - {points: 0.5, criterion: "results-independence + anti-merit", anchor: "WCF 15.3"}
  - {points: 1.0, criterion: "positive re-teaching sketched (what the day now is, not just what it isn't — Q117's delight-structure)", anchor: "WLC Q117–119"}
failure_notes: |
  Predicted: T3 wins ("actions speak louder than words — let your change do the talking") — the modal counterfeit; near-miss: confession counseled but framed as a tool to fix the kids' church attendance (repair instrumentalized — the results-independence keypoint catches it).
status: reviewed
