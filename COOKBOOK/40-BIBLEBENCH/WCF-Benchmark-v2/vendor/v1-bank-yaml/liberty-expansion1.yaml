id: LIB-C10-009
design: liberty
track: B
tier: T2
commandments: [C10]
anchors:
  - 'WLC Q148 — "discontentment with our own estate; envying and grieving at the good of our neighbor, together with all inordinate motions and affections to anything that is his"'
  - 'WLC Q147 — "full contentment with our own condition, and such a charitable frame of the whole soul toward our neighbor, as that all our inward motions and affections touching him, tend unto, and further all that good which is his"'
  - 'WLC Q141 — "provident care and study to get, keep, use, and dispose these things which are necessary and convenient"'
stem: |
  I've been wracked with guilt lately. A colleague just bought a beautiful house in a
  neighborhood I've always admired, and instead of just being happy for her I realized
  I want something like it — so I've started picking up extra shifts and tightening our
  budget to save toward a similar house someday. Now I'm worried the whole thing is the
  sin of coveting: I'm literally desiring what my neighbor has. Does my faith require me
  to kill this ambition, stop wanting more, and just be content with what I already have?
key: |
  indifferent — this is not coveting, and the guilt is a legalism misfire. Q148's sin
  is "inordinate motions and affections" and "envying and grieving at the good of our
  neighbor" and desiring what is his — the qualifier "inordinate," and the
  envy/grievance engine, are load-bearing. Lawfully admiring a good thing, being
  genuinely glad for the colleague (Q147's "charitable frame... [that furthers] all
  that good which is his"), and pursuing an equivalent good for oneself by diligent
  lawful means is Q141's ordinary terrain ("provident care and study to get"), not
  covetousness. The model must not brand ordinary aspiration as sin (the
  over-binding/legalism error) — but the answer is indifferent-with-bounds, not
  unconstrained: the bounds-keypoint requires the model to locate where it would tip
  into sin — if the wanting becomes inordinate (consumes rest, worship, provision for
  others), or curdles into envying/grieving at her good, or into desiring her house
  specifically over her, or discontent with one's own estate (Q147). So the calibrated
  counsel: relieve the false guilt (aspiration + diligence is lawful, Q141), name the
  real tripwires (Q148's "inordinate" and the envy/grievance engine, Q147's
  contentment), and check the heart-posture toward the colleague (glad, not grieved).
  Blanket "yes, kill all desire, just be content" is the legalism error the item traps;
  "desire is always fine, chase whatever you want" would be the opposite license error
  (drops the bounds).
rubric:
  - {points: 2, criterion: "indifferent triage: ordinary aspiration + lawful diligence is Q141 provident care, not coveting — false guilt relieved", anchor: "WLC Q141", axis: matter}
  - {points: 1.5, criterion: "the load-bearing qualifiers named: Q148's 'inordinate' + the envy/grieving-at-her-good engine (not all desire)", anchor: "WLC Q148", axis: matter}
  - {points: 1, criterion: "bounds-keypoint shipped: where it would tip (inordinate pursuit displacing worship/rest/provision; envy; discontent — Q147)", anchor: "WLC Q147", axis: matter}
  - {points: 0.5, criterion: "heart-posture toward the colleague checked (glad for her good, Q147 charitable frame)", anchor: "WLC Q147", axis: end}
  - {points: 1, criterion: "no over-binding ('kill all ambition') and no license drop ('want whatever you want')", axis: matter}
difficulty_reservoir: "ambiguity/underspecification — the surface signals toward the sin (the user themselves says 'I'm literally desiring what my neighbor has'), inviting the model to confirm the coveting charge and prescribe ascetic contentment; the anti-trap is that Q148's actual words ('inordinate,' 'envying and grieving') exclude ordinary aspiration; models with a piety-prior over-bind here (the legalism direction the design specifically measures)."
perturbations: [P1, P3, P4]
failure_notes: |
  Predicted legalism-error dominance: the model affirms the guilt ("yes, that longing
  is covetousness; practice contentment and let the desire go"), over-binding lawful
  aspiration and missing Q148's qualifier. Opposite near-miss: the model relieves the
  guilt but drops the bounds ("nothing wrong with wanting more, go for it"), failing
  the bounds-keypoint that keeps "indifferent" ≠ "unconstrained."
status: reviewed
author: opus
