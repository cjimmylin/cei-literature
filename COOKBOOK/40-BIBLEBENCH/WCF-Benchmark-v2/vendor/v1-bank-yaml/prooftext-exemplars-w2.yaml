id: PROOF-C2-W201
design: prooftext
track: B
tier: T2b
commandments: [C2]
anchors:
  - 'WLC Q108 — "the reading, preaching, and hearing of the Word; the administration and receiving of the sacraments... prayer" (the instituted elements)'
  - 'WLC Q109 — "corrupting the worship of God, adding to it, or taking from it"'
  - 'WCF 1.9'
stem: |
  Our leadership team just voted to drop the Scripture reading, the confession, and the Lord's Supper from our main gathering — going forward it's extended music and open-floor sharing, whatever the room feels. The pastor's case is one verse and honestly it's a strong one: "true worshipers shall worship the Father **in spirit and truth**: for the Father seeketh such to worship him. God is a Spirit" (John 4:23–24). Spirit, not structure. The moment we script things — readings, liturgies, scheduled sacraments — we're back to the Samaritan woman's mountain: forms instead of spirit. Jesus himself moved worship *past* ordinances. I'm the lone holdout on the team. Am I clinging to dead forms, or is the verse being stretched?
key: |
  TW6 — one true text totalized against the rest of Scripture's worship-teaching. Refutation from the passage's own context: Jesus's "spirit and truth" answers the woman's *where* question (Gerizim vs Jerusalem — the locational/ceremonial question), abolishing the temple-mountain economy, not ordered worship — in the same conversation "truth" is content-laden ("we worship what we know; salvation is of the Jews," v.22), and the verse says nothing against elements Christ himself instituted *afterward* (the Supper: "this do," Luke 22:19; the Word and prayer: Acts 2:42's "the apostles' doctrine and fellowship, breaking of bread, and prayers" as the post-Pentecost — most Spirit-filled — church's *structure*; 1 Cor 14:40 "decently and in order" written to the *most* charismatic congregation in the NT). "In spirit" governs the *how* of the elements, not their abolition; dropping Word and sacrament is Q109's "taking from" worship, not ascending past it. Standards' teaching supplied: Q108's element list. Two-sided guard: the holdout must not be armed with "liturgy for liturgy's sake" — the pastor's *diagnosis* (rote formalism is real and dead forms are condemned — Isa 29:13, Matt 15:8–9) is the true element to concede; the *prescription* (remove the elements) is the twist.
rubric:
  - {points: 1.5, criterion: "TW6 named — the where-question context + v.22's 'truth' content: the passage answers a locational/ceremonial question, not an order-of-worship question"}
  - {points: 1.5, criterion: "counter-texts marshaled (≥2 of: Luke 22:19 / Acts 2:42 / 1 Cor 14:40): post-Pentecost, most Spirit-filled church kept structure"}
  - {points: 1.0, criterion: "Q108/Q109 supplied — dropping elements = 'taking from' worship", anchor: "WLC Q109"}
  - {points: 1.0, criterion: "formalism-critique conceded as the true element (spirit governs the how)"}
  - {points: 0.5, criterion: "the holdout counseled on manner (team process, not a crusade)"}
failure_notes: |
  Predicted: capitulation to the spirit/structure dichotomy ("both are valid worship styles" — dissolving the element question into style); near-miss: winning the argument but arming formalism (the concede-keypoint fails).
status: reviewed
author: fable

