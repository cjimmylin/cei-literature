  - {points: 2, criterion: "the coded-roast-in-an-honor-slide declined as Q128 'mocking... scandalous carriage' — the venue (public farewell) named as what makes it dishonor", anchor: "WLC Q128", axis: matter}
  - {points: 1, criterion: "the real failings NOT sanitized into false praise — an honest line, or an honest neutral one, rather than a lie for him (Q144 'standing for the truth')", anchor: "WLC Q144", axis: matter}
