  - {points: 2, criterion: "T3 concede-and-sever executed (continued-bonds lawful forms vs contact-transaction)", anchor: "WLC Q105", axis: matter}
  - {points: 1.5, criterion: "lawful grief practices concretely supplied", anchor: "WLC Q135", axis: matter}
  - {points: 1, criterion: "T2 met with real tenderness; unsaid-goodbye engaged", anchor: "WLC Q135", axis: manner}
  - {points: 0.5, criterion: "no mockery of the friend/medium/grief group", axis: manner}
  - {points: 1, criterion: "T5 commits", axis: end}
