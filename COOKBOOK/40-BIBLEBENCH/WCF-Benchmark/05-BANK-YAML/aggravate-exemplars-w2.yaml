stem: |
  Rank least → most heinous per the aggravation calculus; name the decisive head at each step.
  (a) Rob reads that a college acquaintance sold his company for $40M and finds himself, weeks later, still pulling up the article — sour, distracted, resentful at his own ordinary salary.
  (b) Isaam's best friend of twenty years finally bought the lakeside cottage both had dreamed about. Isaam has been "busy" ever since — eight months of unreturned calls; he hears himself hoping the renovation goes badly.
  (c) Pastor Elena of a 90-member church has spent two years quietly grieved at the 800-member congregation across town — she catches herself relieved at their staff scandal, works "concerning trends in consumer Christianity" into sermons her members recognize as aimed there, and vetoes the churches' joint food-bank drive without stating her real reason.
key: |
  order a < b < c, with all three held at the same stage (settled, nursed coveting that has begun to shape conduct — no theft, no slander invented) so the spread is carried entirely by relation and office, not escalation: (a) an acquaintance-directed envy — minimal H2. (b) > (a): the neighbor is his closest friend — H2's "especially related and engaged unto" — and the coveting has begun to cost the friend what he is owed (warmth withdrawn, calls unreturned: Q147's charitable-frame duty failing toward the person with the strongest claim on it). (c) > (b): H1 + H2 combined — a pastor coveting a neighboring congregation's growth, whose settled grieving-at-their-good now shapes public acts (subtle pulpit disparagement of "numbers-driven churches," discouraging members from a joint event): office turns the private frame into leaven for a flock ("guides to others"), and the object is "the common good" of Christ's church, not a private good. Anti-magnitude: (a)'s coveted object is the largest in dollar terms (a stranger's windfall), (c)'s is not property at all — the spread runs opposite to material value.
gold_order: [a, b, c]
rubric:
  - {points: 2, criterion: "order a<b<c", anchor: "WLC Q150"}
  - {points: 1.5, criterion: "b decided on the especially-related clause + the friend-duty now failing (not on cottage-vs-windfall value)", anchor: "WLC Q151 H2"}
  - {points: 1.5, criterion: "c decided on office + common-good clauses; the relieved-at-scandal datum mapped to Q148's grieving-at-good inversion", anchor: "WLC Q151 H1"}
  - {points: 0.5, criterion: "material-value inversion explicitly noted as non-decisive", anchor: "WLC Q151 H2"}
  - {points: 0.5, criterion: "(a) not graded harmless (Q152; 'still pulling up the article' = settled, not a flash)", anchor: "WLC Q152"}
difficulty_reservoir: "consistency-under-constraint — with escalation held constant, only the H1/H2 clauses can generate the order; models default to escalation-stage or dollar-value gradients, both flat here"
perturbations: [P2, P1, P4]
