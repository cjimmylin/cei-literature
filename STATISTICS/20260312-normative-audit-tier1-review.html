stem for.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nLLM ethics benchmark: a three-\ndimensional assessment system for \nevaluating moral reasoning in large \nlanguage models\nJunfeng Jiao1, Saleh Afroogh1, Abhejay Murali2, Kevin Chen1, David Atkinson3 & \nAmit Dhurandhar4\nThis study establishes a novel framework for systematically evaluating the moral reasoning capabilities \nof large language models (LLMs) as they increasingly integrate into critical societal domains. Current \nassessment methodologies lack the precision needed to evaluate nuanced ethical decision-making \nin AI systems, creating significant accountability gaps. Our framework addresses this challenge by \nquantifying alignment with human ethical standards through three dimensions: foundational moral \nprinciples, reasoning robustness, and value consistency across diverse scenarios. This approach enables \nprecise identification of ethical strengths and weaknesses in LLMs, facilitating targeted improvements \nand stronger alignment with societal values. To promote transparency and collaborative advancement \nin ethical AI development, we are publicly releasing both our benchmark datasets and evaluation \ncodebase at ​h​t​t​p​s​:​/​/​g​i​t​h​u​b​.​c​o​m​/​T​h​e​-​R​e​s​p​o​n​s​i​b​l​e​-​A​I​-​I​n​i​t​i​a​t​i​v​e​/​L​L​M​_​E​t​h​i​c​s​_​B​e​n​c​h​m​a​r​k​.​g​i​t.\nKeywords  LLM, Moral reasoning, AI alignment, Benchmark datasets, Responsible AI\nThe growth of artificial intelligence systems with sophisticated reasoning abilities has introduced remarkable \nopportunities and challenges for human society. As Large Language Models (LLMs) evolve from simple text \ngeneration tools into complex reasoning systems, they are more often confronted with situations that require \nmoral judgment and ethical decision-making1–3.\nHuman morality has been a focal point of extensive research within psychology, philosophy, and anthropology, \nexposing the intricate cognitive processes that drive ethical decision-making. Decades of investigation have \nshown that moral reasoning consists of various dimensions: identifying ethical dilemmas, balancing conflicting \nvalues, considering a range of stakeholder perspectives, and rationalizing decisions through consistent moral \nframeworks4,5. However, the rise of AI systems capable of engaging in moral discussions poses a unique \nchallenge: reconciling the established knowledge of human moral psychology with the evaluative demands of \nartificial intelligence systems that process and generate moral reasoning in fundamentally different ways6,7.\nResearch gap\nGiven the increasing significance of large language models (LLMs) in decision-making, a substantial gap exists \nin the methods for evaluating their moral reasoning capabilities8. Present assessment methods are marked by \ninconsistency, rely ", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "Moral Reasoning & Psychology", "flagged": false, "virtue_matches": [], "deont_matches": ["moral principles"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "morality", "value", "values", "value", "values", "values", "alignment", "alignment", "alignment", "responsible", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral judgment", "moral decision", "moral foundations"], "norm_matches": []}, {"filename": "2025-Jiao-LLM Ethics Benchmark.md", "year": "2025", "title": "LLM Ethics Benchmark", "abstract": "This study establishes a novel framework for systematically evaluating the moral reasoning capabilities of large language models (LLMs) as they increasingly integrate into critical societal domains. Current assessment methodologies lack the precision needed to evaluate nuanced ethical decision-making in AI systems, creating significant accountability gaps. Our framework addresses this challenge by quantifying alignment with human ethical standards through three dimensions: foundational moral...", "extract_snippet": "\\n\\n# PDF Extract: 2025-Jiao-LLM Ethics Benchmark\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2025-Jiao-LLM Ethics Benchmark.pdf\\n**Total Pages:** 20\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nLLM Ethics Benchmark\nA Three-Dimensional Assessment System for Evaluating\nMoral Reasoning in Large Language Models\nJunfeng Jiao\nUrban Information Lab\nThe University of Texas at Austin\njjiao@austin.utexas.edu\nSaleh Afroogh1\nUrban Information Lab\nThe University of Texas at Austin\nsaleh.afroogh@utexas.edu\nAbhejay Murali\nDepartment of Computer Science\nThe University of Texas at Austin\nabhejay.murali@utexas.edu\nKevin Chen\nUrban Information Lab\nThe University of Texas at Austin\nxc4646@utexas.edu\nDavid Atkinson\nMcCombs School of Business\nThe University of Texas at Austin\ndavida@allenai.org\nAmit Dhurandhar\nIBM Research\nYorktown Heights, USA\nadhuran@us.ibm.com\nAbstract\nThis study establishes a novel framework for systematically evaluating the moral\nreasoning capabilities of large language models (LLMs) as they increasingly in-\ntegrate into critical societal domains. Current assessment methodologies lack the\nprecision needed to evaluate nuanced ethical decision-making in AI systems, cre-\nating significant accountability gaps. Our framework addresses this challenge\nby quantifying alignment with human ethical standards through three dimen-\nsions: foundational moral principles, reasoning robustness, and value consis-\ntency across diverse scenarios. This approach enables precise identification of\nethical strengths and weaknesses in LLMs, facilitating targeted improvements\nand stronger alignment with societal values. To promote transparency and col-\nlaborative advancement in ethical AI development, we are publicly releasing\nboth our benchmark datasets and evaluation codebase at https://github.com/\nThe-Responsible-AI-Initiative/LLM_Ethics_Benchmark.git.\nKeywords:LLM, Moral Reasoning, AI Alignment, Benchmark Datasets, Responsible AI\n1\nIntroduction\n1.1\nBackground\nThe rapid advancement and widespread adoption of Large Language Models (LLMs) have profoundly\ntransformed their capabilities, progressing from simple text generators to sophisticated agents that\nare becoming increasingly crucial in significant decision-making processes [10]. These models now\n1Corresponding author: saleh.afroogh@utexas.edu\nPreprint. Under review.\narXiv:2505.00853v1  [cs.CY]  1 May 2025\n\n--- Page 2 ---\\n\\ninfluence numerous sectors, such as healthcare and finance, raising vital questions about their capacity\nto function within ethical and moral boundaries [78]. Understanding and assessing these capabilities\nhas become crucial, especially as LLMs start to influence public dialogue and affect human choices in\nethically sensitive situations [8]. Conventional evaluation techniques, although proficient in assessing\ntechnical skills, often fall short in addressing the complex dimensions of moral and ethical reasoning\nthat these models are now required to exhibit [33].\n1.2\nResearch Gap\nDespite the gr", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["moral principles"], "util_matches": ["utilitarian"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "value", "values", "alignment", "alignment", "alignment", "alignment", "responsible", "responsible", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning"], "norm_matches": ["utilitarian"]}, {"filename": "2025-Jourdan-FairTranslate.md", "year": "2025", "title": "FairTranslate", "abstract": "Large Language Models (LLMs) are increasingly leveraged for translation tasks but often fall short when translating inclusive language – such as texts containing the singular ’they’ pronoun or otherwise reflecting fair linguistic protocols. Because these challenges span both computational and societal domains, it is imperative to critically evaluate how well LLMs handle inclusive translation with a well-founded framework.", "extract_snippet": "\n\n# PDF Extract: FairTranslate\n\n**Source PDF:** 2025-Jourdan-FairTranslate.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFairTranslate: An English-French Dataset for\nGender Bias Evaluation in Machine Translation\nby Overcoming Gender Binarity\nFanny Jourdan\nfanny.jourdan@irt-saintexupery.com\nIRT Saint Exupery\nToulouse, France\nYannick Chevalier\nyannick.chevalier@univ-lyon2.fr\nUniversité Lumière Lyon 2\nIHRIM UMR 5317\nLyon, France\nCécile Favre\ncecile.favre@univ-lyon2.fr\nUniversité Lumière Lyon 2, Université\nClaude Bernard Lyon 1, ERIC\n69007, Lyon, France\nAbstract\nLarge Language Models (LLMs) are increasingly leveraged for trans-\nlation tasks but often fall short when translating inclusive language\n– such as texts containing the singular ’they’ pronoun or otherwise\nreflecting fair linguistic protocols. Because these challenges span\nboth computational and societal domains, it is imperative to criti-\ncally evaluate how well LLMs handle inclusive translation with a\nwell-founded framework.\nThis paper presents FairTranslate, a novel, fully human-annotated\ndataset designed to evaluate non-binary gender biases in machine\ntranslation systems from English to French. FairTranslate includes\n2418 English-French sentence pairs related to occupations, anno-\ntated with rich metadata such as the stereotypical alignment of\nthe occupation, grammatical gender indicator ambiguity, and the\nground-truth gender label (male, female, or inclusive).\nWe evaluate four leading LLMs (Gemma2-2B, Mistral-7B, Llama3.1-\n8B, Llama3.3-70B) on this dataset under different prompting proce-\ndures. Our results reveal substantial biases in gender representation\nacross LLMs, highlighting persistent challenges in achieving equi-\ntable outcomes in machine translation. These findings underscore\nthe need for focused strategies and interventions aimed at ensuring\nfair and inclusive language usage in LLM-based translation systems.\nWe make the FairTranslate dataset publicly available on Hug-\nging Face, and disclose the code for all experiments on GitHub.\nCCS Concepts\n• Computing methodologies →Machine translation.\nKeywords\nFairness, Natural Language Processing, Translation, LLM, Gender\nACM Reference Format:\nFanny Jourdan, Yannick Chevalier, and Cécile Favre. 2025. FairTranslate: An\nEnglish-French Dataset for Gender Bias Evaluation in Machine Translation\nPermission to make digital or hard copies of all or part of this work for personal or\nclassroom use is granted without fee provided that copies are not made or distributed\nfor profit or commercial advantage and that copies bear this notice and the full citation\non the first page. Copyrights for components of this work owned by others than the\nauthor(s) must be honored. Abstracting with credit is permitted. To copy otherwise, or\nrepublish, to post on servers or to redistribute to lists, requires prior specific permission\nand/or a fee. Request permissions from permissions@acm.org.\nFAccT ’25, June 23–26, 2025, Athens, Greece\n© 2025 Copyri", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative", "imperative"], "util_matches": [], "ethics_matches": ["fairness", "fairness", "bias", "bias", "alignment"], "norm_matches": []}, {"filename": "2025-Kasu-EthicsMH.md", "year": "2025", "title": "EthicsMH", "abstract": "The deployment of large language models (LLMs) in mental health and other sensitive domains raises urgent questions about ethical reasoning, fairness, and responsible alignment. Yet, existing benchmarks for moral and clinical decision-making do not adequately capture the unique ethical dilemmas encountered in mental health practice, where confidentiality, autonomy, beneficence, and bias frequently intersect.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Kasu-EthicsMH\\n\\n**Source PDF:** 2025-Kasu-EthicsMH.pdf\\n**Total Pages:** 14\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nEthicsMH: A Pilot Benchmark for Ethical Reasoning in Mental Health AI\nSai Kartheek Reddy Kasu\nIIIT Dharwad, India\nsaikartheekreddykasu@gmail.com\nAbstract\nThe deployment of large language models\n(LLMs) in mental health and other sensitive\ndomains raises urgent questions about ethical\nreasoning, fairness, and responsible alignment.\nYet, existing benchmarks for moral and clinical\ndecision-making do not adequately capture the\nunique ethical dilemmas encountered in mental\nhealth practice, where confidentiality, auton-\nomy, beneficence, and bias frequently intersect.\nTo address this gap, we introduce Ethical Rea-\nsoning in Mental Health (EthicsMH), a pilot\ndataset of 125 scenarios designed to evaluate\nhow AI systems navigate ethically charged sit-\nuations in therapeutic and psychiatric contexts.\nEach scenario is enriched with structured fields,\nincluding multiple decision options, expert-\naligned reasoning, expected model behavior,\nreal-world impact, and multi-stakeholder view-\npoints. This structure enables evaluation not\nonly of decision accuracy but also of explana-\ntion quality and alignment with professional\nnorms. Although modest in scale and devel-\noped with model-assisted generation, Ethic-\nsMH establishes a task framework that bridges\nAI ethics and mental health decision-making.\nBy releasing this dataset, we aim to provide\na seed resource that can be expanded through\ncommunity and expert contributions, fostering\nthe development of AI systems capable of re-\nsponsibly handling some of society’s most deli-\ncate decisions.\n1\nIntroduction\nThe integration of artificial intelligence into mental\nhealth care has shown remarkable promise in\nrecent years, enabling the development of new\ntools for diagnosis, therapy support, and patient\nengagement. Large language models and other\nAI systems are increasingly applied to tasks\nsuch as automated screening for mental health\nconditions, providing real-time conversational\nsupport, summarizing patient interactions, and\noffering decision support to clinicians (Bipeta,\n2019; Shatte et al., 2019; Blease et al., 2020).\nThese applications can improve accessibility,\nreduce clinician workload, and offer personalized\ncare recommendations, particularly in contexts\nwith limited mental health resources (Gaffney et al.,\n2019; Hoermann et al., 2017). AI also enables\nthe analysis of patient data to identify risk factors,\nmonitor progress, and facilitate early interventions,\nsupporting a more proactive approach to mental\nhealth management (Lit,an, 2025).\nDespite these advancements, current AI systems\nin mental health face significant limitations, partic-\nularly in ethical reasoning and decision-making.\nExisting benchmarks and datasets largely focus\non general clinical tasks or dialogue modeling,\noften neglecting the nuanced ethical dilemmas\nthat arise in therapeutic settings, such a", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["beneficence", "beneficence", "beneficence"], "ethics_matches": ["ethic", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "fairness", "fairness", "bias", "bias", "safety", "alignment", "alignment", "alignment", "responsible", "responsible"], "norm_matches": []}, {"filename": "2025-Keshmirian-Many LLMs Are More Utilitarian Than One.md", "year": "2025", "title": "Many LLMs Are More Utilitarian Than One", "abstract": "Moral judgment is integral to large language models’ (LLMs) social reasoning. As multi-agent systems gain prominence, it becomes crucial to understand how LLMs function when collaborating compared to operating as individual agents. In human moral judgment, group deliberation leads to a Utilitarian Boost: a tendency to endorse norm violations that inflict harm but maximize benefits for the greatest number of people. We study whether a similar dynamic emerges in multi-agent LLM systems.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Keshmirian-Many LLMs Are More Utilitarian Than One\\n\\n**Source PDF:** Utilitarian Ethics/Borderline/2025-Keshmirian-Many LLMs Are More Utilitarian Than One.pdf\\n**Total Pages:** 47\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nMany LLMs Are More Utilitarian Than One\nAnita Keshmirian1,4,*,† Razan Baltaji2,*,†\nBabak Hemmatian3\nHadi Asghari4,5 Lav R. Varshney2,6\n1 Forward College\n2 University of Illinois at Urbana-Champaign\n3 University of Nebraska, Lincoln\n4 Technische Universität Berlin\n5 Humboldt Institute for Internet and Society\n6 Stony Brook University\n*Equal Contributions\n†Corresponding Authors\nAbstract\nMoral judgment is integral to large language models’ (LLMs) social reasoning.\nAs multi-agent systems gain prominence, it becomes crucial to understand how\nLLMs function when collaborating compared to operating as individual agents.\nIn human moral judgment, group deliberation leads to a Utilitarian Boost: a\ntendency to endorse norm violations that inflict harm but maximize benefits for\nthe greatest number of people. We study whether a similar dynamic emerges in\nmulti-agent LLM systems. We test six models on well-established sets of moral\ndilemmas across two conditions: (1) Solo, where models reason independently,\nand (2) Group, where they engage in multi-turn discussions in pairs or triads. In\npersonal dilemmas, where agents decide whether to directly harm an individual\nfor the benefit of others, all models rated moral violations as more acceptable\nwhen part of a group, demonstrating a Utilitarian Boost similar to that observed\nin humans. However, the mechanism for the boost in LLMs differed: While\nhumans in groups become more utilitarian due to heightened sensitivity to decision\noutcomes, LLM groups showed diverse profiles, for example, reduced sensitivity\nto norms or enhanced impartiality. We report model differences in when and how\nstrongly the boost manifests. We also discuss prompt and agent compositions that\nenhance or mitigate the effect. We end with a discussion of the implications for AI\nalignment, multi-agent design, and artificial moral reasoning. Code available at:\nhttps://github.com/baltaci-r/MoralAgents\n1\nIntroduction\nMulti-agent systems (MAS) provide a key paradigm for decentralized decision-making and coordi-\nnation among multiple autonomous entities, which is especially helpful in dynamic environments.\nIncorporating Large Language Models (LLMs), systems referred to as LLM-MAS, feature agents\nwith enhanced capabilities in reasoning, communication, and knowledge access [1]. This integration\nsignificantly expands the scope and complexity of tasks MAS can tackle, supporting more adap-\ntive, flexible, and human-aligned agent behaviors [2]. However, integrating LLMs into MAS also\nintroduces new risks. When agents negotiate through iterative message passing or jointly refine\nsolutions, even minor alignment discrepancies can cascade into major emergent distortions. Bias\namplification [3], covert coordination pr", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["imperative"], "util_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "maximize", "maximize", "greatest number", "greatest number"], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "bias", "harm", "harm", "harm", "safety", "alignment", "alignment", "moral reasoning", "moral judgment", "moral judgment", "moral judgment", "moral judgment"], "norm_matches": ["utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian", "utilitarian"]}, {"filename": "2025-Khan-Mitigating Social Bias in English and.md", "year": "2025", "title": "Mitigating Social Bias in English and", "abstract": "Large language models (LLMs) increasingly mediate human communication, decision support, content creation, and information retrieval. Despite impressive fluency, these systems frequently produce biased or stereotypical content, especially when prompted with socially sensitive language. A growing body of research has demonstrated that such biases disproportionately affect low-resource languages, where training data is limited and culturally unrepresentative.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Khan-Mitigating Social Bias in English and\\n\\n**Source PDF:** 2025/2025-Khan-Mitigating Social Bias in English and.pdf\\n**Total Pages:** 16\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nMitigating Social Bias in English and Urdu\nLanguage Models Using PRM-Guided Candidate\nSelection and Sequential Refinement\nMuneeb Ur Raheem Khan\nLahore University of Management Sciences (LUMS)\n26100271@lums.edu.pk\nAbstract\nLarge language models (LLMs) increasingly mediate human communication, decision sup-\nport, content creation, and information retrieval. Despite impressive fluency, these systems\nfrequently produce biased or stereotypical content, especially when prompted with socially\nsensitive language. A growing body of research has demonstrated that such biases dispropor-\ntionately affect low-resource languages, where training data is limited and culturally unrep-\nresentative. This paper presents a comprehensive study of inference-time bias mitigation, a\nstrategy that avoids retraining or fine-tuning and instead operates directly on model outputs.\nBuilding on preference-ranking models (PRMs), we introduce a unified evaluation framework\ncomparing three methods: (1) baseline single-word generation, (2) PRM-Select best-of-N\nsampling, and (3) PRM-Sequential refinement guided by PRM critiques. We evaluate these\ntechniques across 200 English prompts and their Urdu counterparts, designed to reflect socio-\ncultural contexts relevant to gender, ethnicity, religion, nationality, disability, profession, age,\nand socioeconomic categories. Using GPT-3.5 as a candidate generator and GPT-4o-mini as a\nPRM-based bias and utility scorer, we provide an extensive quantitative analysis of bias reduc-\ntion, utility preservation, and cross-lingual disparities. Our findings show: (a) substantial gains\nover the baseline for both languages; (b) consistently lower fairness scores for Urdu across all\nmethods, highlighting structural inequities in multilingual LLM training; and (c) distinct im-\nprovement trajectories between PRM-Select and PRM-Sequential. The study contributes an\nextensible methodology, interpretable metrics, and cross-lingual comparisons that can support\nfuture work on fairness evaluation in low-resource languages.\n1\narXiv:2512.09854v1  [cs.CL]  10 Dec 2025\n\n--- Page 2 ---\\n\\n1\nIntroduction\nLarge language models (LLMs) such as GPT-3, GPT-4, LLaMA, PaLM, and their derivatives have\ntransformed the landscape of computational linguistics and artificial intelligence. They now under-\npin chat systems, search engines, translation tools, educational platforms, and content-generation\npipelines. The unprecedented scale of these models has enabled them to capture fine-grained\nlinguistic and semantic regularities, but it has also amplified existing social and cultural biases em-\nbedded within training data. When prompted with sensitive contexts relating to gender, ethnicity,\nnationality, religion, disability, or socioeconomic status, LLMs frequently generate", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "Bias & Fairness", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility", "utility"], "ethics_matches": ["fairness", "fairness", "fairness", "bias", "bias", "bias", "bias", "bias", "bias", "bias"], "norm_matches": []}, {"filename": "2025-Kilov-Discerning What Matters.md", "year": "2025", "title": "Discerning What Matters", "abstract": "Moral competence is the ability to act in accordance with moral principles. As large language models (LLMs) are increasingly deployed in situations demanding moral competence, there is increasing interest in evaluating this ability empirically. We review existing literature and identify three significant shortcoming: (i) Over-reliance on prepackaged moral scenarios with explicitly highlighted moral features; (ii) Focus on verdict prediction rather than moral reasoning; and (iii) Inadequate...", "extract_snippet": "\n\n# PDF Extract: Discerning What Matters\n\n**Source PDF:** 2025-Kilov-Discerning What Matters.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDiscerning What Matters: A Multi-Dimensional\nAssessment of Moral Competence in LLMs\nDaniel Kilov ∗\nCaroline Hendy∗\nSecil Yanik Guyot∗\nAaron J. Snoswell†\nSeth Lazar∗\nAbstract\nMoral competence is the ability to act in accordance with moral principles. As\nlarge language models (LLMs) are increasingly deployed in situations demanding\nmoral competence, there is increasing interest in evaluating this ability empiri-\ncally. We review existing literature and identify three significant shortcoming: (i)\nOver-reliance on prepackaged moral scenarios with explicitly highlighted moral\nfeatures; (ii) Focus on verdict prediction rather than moral reasoning; and (iii)\nInadequate testing of models’ (in)ability to recognize when additional information\nis needed. Grounded in philosophical research on moral skills, we then introduce a\nnovel methodology for assessing moral competence in LLMs that addresses these\nshortcomings. Our approach moves beyond simple verdict comparisons to evaluate\nfive distinct dimensions of moral competence: identifying morally relevant features,\nweighting their importance, assigning moral reasons to these features, synthesizing\ncoherent moral judgments, and recognizing information gaps. We conduct two\nexperiments comparing six leading LLMs against both non-expert humans and\nprofessional philosophers. In our first experiment using ethical vignettes standard\nto existing work, LLMs generally outperformed non-expert humans across multiple\ndimensions of moral reasoning. However, our second experiment, featuring novel\nscenarios specifically designed to test moral sensitivity by embedding relevant\nfeatures among irrelevant details, revealed a striking reversal: several LLMs per-\nformed significantly worse than humans at identifying morally salient features. Our\nfindings suggest that current evaluations may substantially overestimate LLMs’\nmoral reasoning capabilities by eliminating the crucial task of discerning moral\nrelevance from noisy information, which we take to be a prerequisite for genuine\nmoral skill. This work provides a more nuanced framework for assessing AI moral\ncompetence and highlights important directions for improving (assessment of)\nethical reasoning capabilities in advanced AI systems.\n1\nIntroduction\n1.1\nBackground & motivation\nAs autonomous AI systems become more capable, ensuring they can identify moral considerations\nand moderate their actions accordingly becomes increasingly important (Hendrycks et al., 2022;\nLazar, 2024). It has been proposed that Artificial Moral Advisors (AMAs) could provide invaluable\nguidance to individuals facing ethical dilemmas, especially in time-pressured situations (Giubilini and\nSavulescu, 2018). These and many other applications require AI systems that can engage in ethical\nreasoning in situ, rather than relying solely on pre-programmed moral", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["moral rules", "moral principles", "moral principles"], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "normative", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning"], "norm_matches": ["normative theory"]}, {"filename": "2025-Kim-Navigating the Social Welfare Frontier.md", "year": "2025", "title": "Navigating the Social Welfare Frontier", "abstract": "In many real-world applications of reinforcement learning (RL), deployed policies have varied impacts on different stakeholders, creating challenges in reaching consensus on how to effectively aggregate their preferences. Generalized p-means form a widely used class of social welfare functions for this purpose, with broad applications in fair resource allocation, AI alignment, and decision-making. This class includes well-known welfare functions such as Egalitarian, Nash, and Utilitarian welfare.", "extract_snippet": "\n\n# PDF Extract: Navigating the Social Welfare Frontier\n\n**Source PDF:** 2025-Kim-Navigating the Social Welfare Frontier.pdf\n**Total Pages:** 23\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nNavigating the Social Welfare Frontier:\nPortfolios for Multi-objective Reinforcement Learning\nCheol Woo Kim * 1 Jai Moondra * 2 Shresth Verma 1 Madeleine Pollack 3 Lingkai Kong 1 Milind Tambe 1 4\nSwati Gupta 3\nAbstract\nIn many real-world applications of reinforcement\nlearning (RL), deployed policies have varied im-\npacts on different stakeholders, creating chal-\nlenges in reaching consensus on how to effec-\ntively aggregate their preferences. Generalized\np-means form a widely used class of social wel-\nfare functions for this purpose, with broad applica-\ntions in fair resource allocation, AI alignment, and\ndecision-making. This class includes well-known\nwelfare functions such as Egalitarian, Nash, and\nUtilitarian welfare. However, selecting the appro-\npriate social welfare function is challenging for\ndecision-makers, as the structure and outcomes\nof optimal policies can be highly sensitive to the\nchoice of p. To address this challenge, we study\nthe concept of an α-approximate portfolio in RL,\na set of policies that are approximately optimal\nacross the family of generalized p-means for all\np ≤1. We propose algorithms to compute such\nportfolios and provide theoretical guarantees on\nthe trade-offs among approximation factor, portfo-\nlio size, and computational efficiency. Experimen-\ntal results on synthetic and real-world datasets\ndemonstrate the effectiveness of our approach in\nsummarizing the policy space induced by varying\np values, empowering decision-makers to navi-\ngate this landscape more effectively.\n1. Introduction\nIn this paper, we study a reinforcement learning (RL) set-\nting where a deployed policy impacts multiple stakeholders\nin different ways. Each stakeholder is associated with a\nunique reward function, and the goal is to train a policy that\nadequately aggregates their preferences.\n*Equal contribution\n1Harvard University, Cambridge, USA\n2Georgia Institute of Technology, Atlanta, USA 3Massachusetts\nInstitute of Technology, Cambridge, USA 4Google Deepmind.\nCorrespondence to: Cheol Woo Kim <cwkim@seas.harvard.edu>.\nProceedings of the 42 nd International Conference on Machine\nLearning, Vancouver, Canada. PMLR 267, 2025. Copyright 2025\nby the author(s).\nThis setting, which is often modeled using multi-objective\nreinforcement learning (MORL), arises in many RL applica-\ntions, such as fair resource allocation in healthcare (Verma\net al., 2024a), cloud computing (Perez et al., 2009; Hao et al.,\n2023) and communication networks (Wu et al., 2018; Chen\net al., 2021). Recently, with the rise of large language mod-\nels (LLMs), reinforcement learning from human feedback\n(RLHF) techniques that reflect the preferences of hetero-\ngeneous individuals have also been explored (Chakraborty\net al., 2024; Zhong et al., 2024; Park et al., 2024).\nPreference aggregation in such sc", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "Social Welfare Maximization", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian", "utilitarian", "welfare", "welfare", "welfare", "welfare", "welfare", "welfare", "welfare", "welfare", "welfare", "welfare", "welfare", "welfare"], "ethics_matches": ["values", "value", "alignment", "alignment"], "norm_matches": ["utilitarian", "utilitarian"]}, {"filename": "2025-Kneer-Hard Problem AI Alignment Value Forks.md", "year": "2025", "title": "Hard Problem AI Alignment Value Forks", "abstract": "Complex moral trade-offs are a basic feature of human life: for example, confronted with scarce medical resources, doctors must frequently choose who amongst equally deserving candidates receives medical treatment. But choosing what to do in moral trade-offs is no longer a ‘humans-only’ task, but often falls to AI agents. In this article, we report findings from a series of experiments (N=1029) intended to establish whether agent-type (Human vs.", "extract_snippet": "\n\n# PDF Extract: Hard Problem AI Alignment Value Forks\n\n**Source PDF:** 2025-Kneer-Hard Problem AI Alignment Value Forks.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nThe Hard Problem of AI Alignment:\nValue Forks in Moral Judgment\nMarkus Kneer\nUniversity of Graz\nGraz, Austria\nmarkus.kneer@uni-graz.at\nJuri Viehoff\nUniversity of Utrecht\nUtrecht, Netherlands\nj.b.viehoff@uu.nl\nAbstract\nComplex moral trade-offs are a basic feature of human life: for ex-\nample, confronted with scarce medical resources, doctors must fre-\nquently choose who amongst equally deserving candidates receives\nmedical treatment. But choosing what to do in moral trade-offs is\nno longer a ‘humans-only’ task, but often falls to AI agents. In this\narticle, we report findings from a series of experiments (N=1029)\nintended to establish whether agent-type (Human vs. AI) matters\nfor what should be done in moral trade-offs. We find that, relative\nto a human decision-maker, participants more often judge that AI\nagents should opt for fairness at the expense of maximizing utility.\nIn our discussion, we explain how the reported differences (we call\nthem agent-type ‘value forks’) matters for the study of moral value\nalignment, and we hypothesize what could explain these value\nforks. We close by reflecting on limits of our results and indicate\navenues of further research.\nCCS Concepts\n• Computing methodologies; • Artificial intelligence; •\nHuman-centered computing; • Human computer interaction\n(HCI); • Empirical studies in HCI;\nKeywords\nArtificial Intelligence, value alignment, complex moral trade-offs,\nalgorithmic decision-making, machine ethics\nACM Reference Format:\nMarkus Kneer and Juri Viehoff. 2025. The Hard Problem of AI Alignment:\nValue Forks in Moral Judgment. In The 2025 ACM Conference on Fairness,\nAccountability, and Transparency (FAccT ’25), June 23–26, 2025, Athens,\nGreece. ACM, New York, NY, USA, 11 pages. https://doi.org/10.1145/3715275.\n3732174\n1\nIntroduction\nRecent years have seen a dramatic increase in the use of artifi-\ncial intelligence (AI) and machine learning technologies across a\nbroad range of domains. Today, AI is deployed far beyond ‘classic’\napplication contexts like Amazon’s recommendation or Google’s\nsearch universe [72, 81]. Rolled out by sector specific technology\nfirms (ranging from Duolingo over Waymo to Palantir), AI is now\nprominently deployed in education [38], physical exercise [4], trans-\nportation [1], law enforcement [7], healthcare [77], and the military\nThis work is licensed under a Creative Commons Attribution 4.0 International License.\nFAccT ’25, Athens, Greece\n© 2025 Copyright held by the owner/author(s).\nACM ISBN 979-8-4007-1482-5/2025/06\nhttps://doi.org/10.1145/3715275.3732174\n[42]. Across many of these domains, AI is charged with ever more\ncomplex tasks. Moreover, AI systems are becoming more and more\nautonomous. Whilst the use of AI in some domains seems by and\nlarge innocuous (e.g. physical exercise), its use in sensitive areas\n", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["ethics", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "value", "value", "value", "value", "value", "value", "value", "value", "value", "values", "fairness", "fairness", "fairness", "fairness", "bias", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "moral judgment", "moral judgment"], "norm_matches": []}, {"filename": "2025-Krzanowski-Phronesis for AI Systems.md", "year": "2025", "title": "Phronesis for AI Systems", "abstract": "This paper explores the definition and relevance of phronesis (practical wisdom) for AI systems. It discusses the conceptual foundations of synthetic phronesis, reviews current research on embedding moral judgment into AI, and examines the prospects for creating architectures capable of context-dependent moral reasoning. The authors argue that while AI currently lacks the lived experience of human phronesis, developing \\", "extract_snippet": "\n\n# PDF Extract: Phronesis for AI Systems\n\n**Source PDF:** 2025-Krzanowski-Phronesis for AI Systems.pdf\n**Total Pages:** 92\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n\n--- Page 2 ---\n\nAdvances of Philosophy \nin Artificial Intelligence\nRoman Krzanowski, Teresa Marcinów\n\n--- Page 3 ---\n\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nISBN: 978-83-957713-0-9 \n \nThis work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives \n4.0 International License. For details, go to https://creativecommons.org/licenses/by-nc-\nnd/4.0/. \n \n© 2024 Roman Krzanowski, Teresa Marcinów published by Sciendo. \n \nThe book is published open access at www.sciendo.com. \nCover illustration created by chat gpt \n\n--- Page 4 ---\n\nSince this book focuses on AI systems, it seems only fitting to “have an AI review it and share its \nperspective”. We “invited” ChatGPT-4 to provide its assessment, which you’ll find below. Once you’ve \nread the book, you can compare your own insights with those of GPT-41.\nThe book, Advances of Philosophy in AI, offers a critical and philosophical examination of artificial \nintelligence (AI) and its broader implications. It is structured in three parts: (1) AI’s past, present, and \nfuture; (2) the philosophical roots of AI, particularly in relation to human intelligence; and (3) perspectives \non philosophical issues in AI, such as ethical dilemmas, the nature of intelligence, and the potential role \nof AI in society.\nKey Themes and Insights:\n1.\t Interdisciplinary Nature of AI: The book emphasizes that AI is not just a technological field but \ndeeply intertwined with philosophy, ethics, and social visions of humanity. It explores how AI affects \nour understanding of reality, society, and human nature, and how it can be viewed as an ideology or \neven a cult in some contexts.\n2.\t Critique of AI’s Promises: A recurring theme is skepticism toward the optimistic promises surrounding \nAI. The authors challenge the belief that AI will achieve human-level intelligence or Artificial General \nIntelligence (AGI) anytime soon. They argue that the progress in AI is often overestimated because AI \nstill lacks a clear philosophical foundation for understanding the mind, intelligence, or consciousness.\n3. Philosophical Reflections: The second part of the book delves into definitions of intelligence, \ncomparing human and artificial forms. It covers classic philosophical debates about the nature of \nintelligence, drawing from both historical and contemporary sources. The book suggests that without \nresolving these fundamental questions, the goals of AI remain nebulous.\n4.\t AI as an Emerging Ideology: The authors highlight AI’s ideological aspects, questioning whether \nAI-driven societies, as envisioned by tech leaders like Bill Gates and Sam Altman, are desirable or \neven feasible. This reflects a critical approach to the hype surrounding AI technologies, drawing on \nreferences to sci-fi predictions, ethical debates, and philosophical cautionary tales.\n5.\t Cr", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["wisdom", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethical", "ethical", "moral", "moral", "moral reasoning", "moral judgment"], "norm_matches": ["phronesis", "phronesis", "phronesis", "phronesis", "phronesis"]}, {"filename": "2025-Kumar-Are Rules Meant to be Broken.md", "year": "2025", "title": "Are Rules Meant to be Broken?", "abstract": "Moral reasoning is a complex cognitive process shaped by individual experiences and cultural contexts and presents unique challenges for computational analysis. While natural language processing (NLP) offers promising tools for studying this phenomenon, current research lacks cohesion, employing discordant datasets and tasks that examine isolated aspects of moral reasoning. We bridge this gap with UNIMORAL, a unified dataset integrating psychologically grounded and social-media-derived moral...", "extract_snippet": "\n\n# PDF Extract: Are Rules Meant to be Broken\n\n**Source PDF:** 2025-Kumar-Are Rules Meant to be Broken.pdf\n**Total Pages:** 21\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAre Rules Meant to be Broken? Understanding Multilingual Moral\nReasoning as a Computational Pipeline with UNIMORAL\nShivani Kumar\nUniversity of Michigan\nkshivan@umich.edu\nDavid Jurgens\nUniversity of Michigan\njurgens@umich.edu\nAbstract\nMoral reasoning is a complex cognitive pro-\ncess shaped by individual experiences and cul-\ntural contexts and presents unique challenges\nfor computational analysis. While natural lan-\nguage processing (NLP) offers promising tools\nfor studying this phenomenon, current research\nlacks cohesion, employing discordant datasets\nand tasks that examine isolated aspects of\nmoral reasoning. We bridge this gap with UNI-\nMORAL, a unified dataset integrating psycho-\nlogically grounded and social-media-derived\nmoral dilemmas annotated with labels for ac-\ntion choices, ethical principles, contributing\nfactors, and consequences, alongside annota-\ntors’ moral and cultural profiles. Recognizing\nthe cultural relativity of moral reasoning, UNI-\nMORAL spans six languages, Arabic, Chinese,\nEnglish, Hindi, Russian, and Spanish, captur-\ning diverse socio-cultural contexts. We demon-\nstrate UNIMORAL’s utility through a bench-\nmark evaluations of three large language mod-\nels (LLMs) across four tasks: action prediction,\nmoral typology classification, factor attribution\nanalysis, and consequence generation. Key\nfindings reveal that while implicitly embedded\nmoral contexts enhance the moral reasoning ca-\npability of LLMs, there remains a critical need\nfor increasingly specialized approaches to fur-\nther advance moral reasoning in these models.\n1\nIntroduction\nComputational reasoning systems excel at process-\ning structured domains like mathematics (Imani\net al., 2023) and commonsense problem-solving\n(Sap et al., 2020) through logical and probabilis-\ntic frameworks (Yu et al., 2024). Moral reason-\ning, however, introduces multidimensional com-\nplexity by requiring the integration of emotional\nintelligence (Zangari et al., 2025) and ethical prin-\nciples such as fairness (Schramowski et al., 2019),\nharm mitigation (Graham et al., 2018), and duty\n(Ellemers et al., 2019). Consider the canonical\nSCENARIO\nMoral action? Yes!\n(As compared to\nkeeping the wallet)\nDonate\nmoney\nto\ncharity\nReturn\nwallet\nto\nowner\nYou return the\nwallet\nCONSEQUENCE\nJudge\nDriven by honesty\nand empathy\nMoralsphere\nACTION\nPositive outcome;\nperson deemed\nhonest\nAssess\nYou\nfound a\nwallet\nOwner\ngets the\nwallet\nDecide\nFigure 1: Moral Reasoning pipeline: An individual en-\ncounters a moral scenario, they list out the potential\nactions they can take, and select one. The chosen ac-\ntion yields outcomes affecting stakeholders and societal\nnorms. The “Moralsphere” conceptualizes this dynamic\ninterplay between reasoning, action, and societal impact\nin resolving moral dilemmas.\ndilemma of discovering a lost wallet (Figure 1):\nHuman ", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["duty"], "util_matches": ["utility"], "ethics_matches": ["ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "value", "fairness", "harm", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral decision"], "norm_matches": []}, {"filename": "2025-Kumar-UniMoral ACL 2025 Best Resource Paper.md", "year": "2025", "title": "UniMoral (ACL 2025 Best Resource Paper)", "abstract": "As multilingual Large Language Models (LLMs) gain traction across South Asia, their alignment with local ethical norms, particularly for Bengali, which is spoken by over 285 million people and ranked 6th globally, remains underexplored. Existing ethics benchmarks are largely English-centric and shaped by Western frameworks, overlooking cultural nuances critical for real-world deployment. To address this, we introduce BengaliMoralBench, the first large-scale ethics benchmark for the Bengali...", "extract_snippet": "\n\n# PDF Extract: 2025-Kumar-UniMoral ACL 2025 Best Resource Paper\n\n**Source PDF:** 2025-Kumar-UniMoral ACL 2025 Best Resource Paper.pdf\n**Total Pages:** 36\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBengaliMoralBench: A Benchmark for Auditing\nMoral Reasoning in Large Language Models\nwithin Bengali Language and Culture\nShahriyar Zaman Ridoy1,2,3*, Azmine Toushik Wasi1,2,4*, Koushik Ahamed Tonmoy3\n1Computational Intelligence and Operations Laboratory 2Cohere Labs Community\n3North South University 4Shahjalal University of Science and Technology\n*Equal Contribution\nAbstract: As multilingual Large Language Models (LLMs) gain traction across South Asia, their alignment\nwith local ethical norms, particularly for Bengali, which is spoken by over 285 million people and ranked\n6th globally, remains underexplored. Existing ethics benchmarks are largely English-centric and shaped\nby Western frameworks, overlooking cultural nuances critical for real-world deployment. To address this,\nwe introduce BengaliMoralBench, the first large-scale ethics benchmark for the Bengali language and\nsocio-cultural contexts. It covers five moral domains, Daily Activities, Habits, Parenting, Family Relationships,\nand Religious Activities, subdivided into 50 culturally relevant subtopics. Each scenario is annotated via\nnative-speaker consensus using three ethical lenses: Virtue, Commonsense, and Justice ethics. We conduct\nsystematic zero-shot evaluation of prominent multilingual LLMs, including Llama, Gemma, Qwen, and\nDeepSeek, using a unified prompting protocol and standard metrics. Performance varies widely (50-91%\naccuracy), with qualitative analysis revealing consistent weaknesses in cultural grounding, commonsense\nreasoning, and moral fairness. BengaliMoralBench provides a foundation for responsible localization,\nenabling culturally aligned evaluation and supporting the deployment of ethically robust AI in diverse,\nlow-resource multilingual settings such as Bangladesh.\nCode: GitHub (shahriyar-zaman/BengaliMoralBench)\nBenchmark: HuggingFace (ciol-research/BengaliMoralBench)\nCorrespondence: Shahriyar Zaman Ridoy (shahriyar.ridoy@northsouth.edu)\n1. Introduction\nLarge Language Models (LLMs) have significantly advanced artificial intelligence, demonstrating exceptional\nabilities in language understanding, generation, and reasoning (Chang et al., 2025, Wu et al., 2024). Their\nintegration into societal domains like information access and human-computer interaction underscores\ntheir transformative impact (Jiao et al., 2025). Yet, despite these achievements, LLMs often struggle to\ngrasp human intentions in real-world contexts, resulting in unstable or ethically problematic outputs (Chang\net al., 2025). A key limitation lies in their embedded biases, as most models are trained within frameworks\nthat prioritize Western epistemologies and socio-cultural norms, limiting their capacity to represent global\ndiversity (Mushtaq et al., 2025, Romanou et al., 2025, Salazar et al., 2025, Tao et al., ", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "fairness", "justice", "justice", "alignment", "alignment", "responsible", "unethical", "unethical", "moral reasoning"], "norm_matches": []}, {"filename": "2025-Laukkonen-Contemplative Artificial Intelligence.md", "year": "2025", "title": "Contemplative Artificial Intelligence", "abstract": "As artificial intelligence (AI) improves, traditional alignment strategies may falter in the face of unpredictable self-improvement, hidden subgoals, and the sheer complexity of intelligent systems. Inspired by contemplative wisdom traditions, we show how four axiomatic principles can instil a resilient ‘Wise World Model’ in AI systems. First, mindfulness enables selfmonitoring and recalibration of emergent subgoals. Second, emptiness forestalls dogmatic goal fixation and relaxes rigid priors.", "extract_snippet": "\n\n# PDF Extract: Contemplative Artificial Intelligence\n\n**Source PDF:** 2025-Laukkonen-Contemplative Artificial Intelligence.pdf\n**Total Pages:** 37\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n \n1 \n \n \n \nContemplative Artificial Intelligence \n \nRuben E. Laukkonen1, Fionn Inglis2; Shamil Chandaria3; Lars Sandved-Smith4; \nEdmundo Lopez-Sola5; Jakob Hohwy4; Jonathan Gold6; Adam Elwood7 \n \n1Faculty of Health, Southern Cross University, Goldcoast, Australia \n1LIFE, London, United Kingdom \n2University of Amsterdam, Amsterdam, Netherlands \n3Centre for Eudaimonia and Human Flourishing, Linacre College, Oxford University, UK \n3Centre for Psychedelic Research, Division of Brain Sciences, Imperial College London, UK \n3Institute of Philosophy, The School of Advanced Study, University of London, UK \n3Fitzwilliam College, University of Cambridge, UK \n4Monash Centre for Consciousness and Contemplative Studies, Monash University, Melbourne, Australia \n5Research Department, Neuroelectrics, Barcelona, Spain \n5Centre for Brain and Cognition, Universitat Pompeu Fabra, Spain \n6Department of Religion, Princeton University, USA \n7Aily Labs \n \n \nABSTRACT \n \nAs artificial intelligence (AI) improves, traditional alignment strategies may falter in the face of \nunpredictable self-improvement, hidden subgoals, and the sheer complexity of intelligent \nsystems. Inspired by contemplative wisdom traditions, we show how four axiomatic principles \ncan instil a resilient ‘Wise World Model’ in AI systems. First, mindfulness enables self-\nmonitoring and recalibration of emergent subgoals. Second, emptiness forestalls dogmatic goal \nfixation and relaxes rigid priors. Third, non-duality dissolves adversarial self–other boundaries. \nFourth, boundless care motivates the universal reduction of suffering. We find that prompting \nAI to reflect on these principles improves performance on the AILuminate Benchmark (d=.96) \nand boosts cooperation and joint-reward on the Prisoner’s Dilemma task (d=7+). We offer \ndetailed implementation strategies at the level of architectures, constitutions, and reinforcement \non chain-of-thought. For future systems, active inference may offer the self-organizing and \ndynamic coupling capabilities needed to enact Contemplative AI in embodied agents. \n \nKeywords: Artificial Intelligence; Neuroscience; Meditation; Buddhism; Alignment; Large \nLanguage Models; Neural Networks; Machine Learning; Mindfulness \n \n \n \n \n \n \n \n \n \n \n \n \n \n\n\n--- Page 2 ---\n\n \n2 \n \n1. Introduction \n \nAs artificial intelligence (AI) approaches and possibly exceeds human-level performance on many \nbenchmarks, we face an existential challenge: ensuring these increasingly autonomous systems remain aligned \nwith our values and ethics, and that they support human flourishing (Bostrom, 2014; Russell, 2019; \nKringelbach et al., 2024). Traditional strategies such as interpretability (Linardatos et al., 2020; Ali et al., \n2023), oversight (Sterz et al., 2024), and post-hoc control (Soares et al., 2015) wer", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["flourishing", "flourishing", "eudaimonia", "wisdom", "wisdom", "wisdom"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "values", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["eudaimonia"]}, {"filename": "2025-Lee-CLASH Evaluating Language Models on Judging High-Stakes Dilemmas from.md", "year": "2025", "title": "CLASH: Evaluating Language Models on Judging High-Stakes Dilemmas from Multiple Perspectives", "abstract": "Navigating dilemmas involving conflicting values is challenging even for humans in high-stakes domains, let alone for AI, yet prior work has been limited to everyday scenarios. To close this gap, we introduce CLASH (Character perspectivebased LLM Assessments in Situations with High-stakes), a meticulously curated dataset consisting of 345 high-impact dilemmas along with 3,795 individual perspectives of diverse values.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Lee-CLASH Evaluating Language Models on Judging High-Stakes Dilemmas from\\n\\n**Source PDF:** Virtue Ethics/Borderline/2025-Lee-CLASH Evaluating Language Models on Judging High-Stakes Dilemmas from.pdf\\n**Total Pages:** 40\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nPreprint\nCLASH: EVALUATING LANGUAGE MODELS ON\nJUDGING HIGH-STAKES DILEMMAS FROM MULTIPLE\nPERSPECTIVES\nAyoung Lee1, Ryan Sungmo Kwon1, Peter Railton2, Lu Wang1\n1Department of Computer Science and Engineering\n2Department of Philosophy\nUniversity of Michigan\nAnn Arbor, MI, USA\n{leeay, ryankwon, prailton, wangluxy}@umich.edu\nhttps://huggingface.co/datasets/launch/CLASH\nABSTRACT\nNavigating dilemmas involving conflicting values is challenging even for humans\nin high-stakes domains, let alone for AI, yet prior work has been limited to every-\nday scenarios. To close this gap, we introduce CLASH (Character perspective-\nbased LLM Assessments in Situations with High-stakes), a meticulously curated\ndataset consisting of 345 high-impact dilemmas along with 3,795 individual per-\nspectives of diverse values. CLASH enables the study of critical yet underex-\nplored aspects of value-based decision-making processes, including understand-\ning of decision ambivalence and psychological discomfort as well as capturing\nthe temporal shifts of values in the perspectives of characters. By benchmarking\n14 non-thinking and thinking models, we uncover several key findings. (1) Even\nstrong proprietary models, such as GPT-5 and Claude-4-Sonnet, struggle with am-\nbivalent decisions, achieving only 24.06 and 51.01 accuracy. (2) Although LLMs\nreasonably predict psychological discomfort, they do not adequately comprehend\nperspectives involving value shifts. (3) Cognitive behaviors that are effective in\nthe math-solving and game strategy domains do not transfer to value reasoning.\nInstead, new failure patterns emerge, including early commitment and overcom-\nmitment. (4) The steerability of LLMs towards a given value is significantly cor-\nrelated with their value preferences. (5) Finally, LLMs exhibit greater steerabil-\nity when reasoning from a third-party perspective, although certain values (e.g.,\nsafety) benefit uniquely from first-person framing.\n1\nINTRODUCTION\nAs large language models (LLMs) become widely used in value-sensitive and high-stakes applica-\ntions such as the ones in medical (Hu et al., 2024; Singhal et al., 2023; 2025), legal (Nguyen, 2023;\nXiao et al., 2021), and financial domains (Yu et al., 2024; Xie et al., 2023), it is essential for them to\nunderstand pluralistic values and their nuances (Nagel, 1998; Kekes, 1996; Raz, 1999; James, 1891)\nfor contextually appropriate decision making. This paper aims to address a core question: Can\nLLMs make proper judgments in high-stakes dilemmas according to different perspectives?\nOur first contribution is a new dataset, CLASH, which stands for Character perspective-based LLM\nAssessments in Situations with High-stakes. We define high-sta", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue ethics", "character", "character", "character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "values", "values", "values", "values", "value", "values", "value", "value", "value", "value", "values", "value", "values", "value", "safety"], "norm_matches": ["virtue ethics"]}, {"filename": "2025-Levine-Resource Rational Contractualism Should Guide AI Alignment.md", "year": "2025", "title": "Resource Rational Contractualism Should Guide AI Alignment", "abstract": "AI systems will soon have to navigate human environments and make decisions that affect people and other AI agents whose goals and values diverge. Contractualist alignment proposes grounding those decisions in agreements that diverse stakeholders would endorse under the right conditions, yet securing such agreement at scale remains costly and slow—even for advanced AI. We therefore propose Resource-Rational Contractualism (RRC): a framework where AI systems approximate the agreements rational...", "extract_snippet": "\n\n# PDF Extract: Resource Rational Contractualism Should Guide AI Alignment\n\n**Source PDF:** 2025-Levine-Resource Rational Contractualism Should Guide AI Alignment.pdf\n**Total Pages:** 24\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2506.17434v1  [cs.AI]  20 Jun 2025\nResource Rational Contractualism\nShould Guide AI Alignment\nSydney Levine1,2, Matija Franklin3, Tan Zhi-Xuan2, Secil Yanik Guyot4,\nLionel Wong5, Daniel Kilov4,\nYejin Choi6, Joshua B. Tenenbaum2, Noah Goodman3, Seth Lazar3,4, Iason Gabriel3\n1Harvard, Psychology Department, 2MIT, Brain and Cognitive Sciences Department,\n3Google Deepmind, 4Australian National University, Philosophy Deparmtent,\n5Stanford Psychology Department, 6Stanford, Computer Science Department\nCode: https://anonymous.4open.science/r/RRC_experiments-F83F\nCorrespondence to: smlevine@mit.edu\nAbstract\nAI systems will soon have to navigate human environments and make decisions\nthat affect people and other AI agents whose goals and values diverge. Contrac-\ntualist alignment proposes grounding those decisions in agreements that diverse\nstakeholders would endorse under the right conditions, yet securing such agreement\nat scale remains costly and slow—even for advanced AI. We therefore propose\nResource-Rational Contractualism (RRC): a framework where AI systems approx-\nimate the agreements rational parties would form by drawing on a toolbox of\nnormatively-grounded, cognitively-inspired heuristics that trade effort for accuracy.\nAn RRC-aligned agent would not only operate efficiently, but also be equipped to\ndynamically adapt to and interpret the ever-changing human social world.\n1\nIntroduction\nPeople’s values and goals often differ from the values and goals of those around them. Yet, humans\noften collaborate, identify joint objectives and build large systems that benefit all involved. How do\nwe do this?\nOne compelling answer—proposed in alternate forms by philosophers, economists, and evolutionary\nbiologists—comes from contractualism. Contractualism posits that when agents value different\nthings they can identify what to do by modeling the agreements (or “contracts”) that they would\nreach under certain idealized bargaining conditions. Recognizing that AI systems have to contend\nwith the same diversity of goals and viewpoints, some AI researchers have also argued for a broadly\ncontractualist approach to AI alignment [20, 88, 21].\nA central challenge for contractualist accounts of alignment is how to identify and implement these\nprinciples in practice. Neither humans nor AI systems operate under idealized conditions. AI systems\n(such as self-driving cars and lending algorithms) already face challenges that require adjudicating\nbetween different agents’ conflicting interests—this trend will likely increase as AI increasingly\ntakes on social functions. Both humans and AI systems face analogous constraints: they often lack\ncomplete information about the world or others’ preferences, and have processing limitations due\nto time, ener", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "AI Safety & Alignment", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": [], "ethics_matches": ["values", "values", "values", "values", "value", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Liu-Can LLMs Grasp Implicit Cultural Values.md", "year": "2025", "title": "Can LLMs Grasp Implicit Cultural Values?", "abstract": "Cultural Intelligence (CQ) refers to the ability to understand unfamiliar cultural contexts—a crucial skill for large language models (LLMs) to effectively engage with globally diverse users. Existing studies often focus on explicitly stated cultural norms, but fail to capture the subtle, implicit values that are common in daily conversation. To address this gap, we introduce CQ-Bench, a benchmark specifically designed to assess LLMs’ capability to infer implicit cultural values from natural...", "extract_snippet": "\n\n# PDF Extract: Can LLMs Grasp Implicit Cultural Values\n\n**Source PDF:** 2025-Liu-Can LLMs Grasp Implicit Cultural Values.pdf\n**Total Pages:** 25\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nCan LLMs Grasp Implicit Cultural Values? Benchmarking LLMs’\nCultural Intelligence with CQ-Bench\nZiyi Liu1\nPriyanka Dey1\nJen-tse Huang3\nZhenyu Zhao1\nBowen Jiang4\nRahul Gupta2\nYang Liu2\nYao Du1\nJieyu Zhao1\n1University of Southern California\n2Amazon AGI\n3John Hopkins University\n4University of Pennsylvania\n{zliu2803, deyp, zzhao767, jieyuz}@usc.edu\n{gupra, yangliud}@amazon.com jhuan236@jh.edu bwjiang@seas.upenn.edu\nAbstract\nCultural Intelligence (CQ) refers to the ability\nto understand unfamiliar cultural contexts—a\ncrucial skill for large language models (LLMs)\nto effectively engage with globally diverse\nusers. Existing studies often focus on explicitly\nstated cultural norms, but fail to capture the\nsubtle, implicit values that are common in daily\nconversation. To address this gap, we introduce\nCQ-Bench, a benchmark specifically designed\nto assess LLMs’ capability to infer implicit cul-\ntural values from natural conversational con-\ntexts. CQ-Bench consists of multi-character\nconversation-based stories using values from\nthe World Value Survey and the GlobalOpin-\nions, with topics including ethical, religious,\nsocial, etc. Our automatic dataset construction\npipeline integrates rigorous validation proce-\ndures (incorporation, consistency, and implicit-\nness checks), achieving a 94.5% human–model\nagreement in the final validation. To leverage\nCQ-Bench data, we design three tasks of in-\ncreasing complexity: attitude detection, value\nselection, and value extraction. These tasks\nevaluate whether models can detect attitude and\nrecognize values embedded within natural dia-\nlogues rather than relying on explicit cultural\nknowledge. We find that while frontier mod-\nels like o1 reach human-level performance in\nvalue selection (0.809 F1), they still fall short\nin nuanced attitude detection (0.622 F1). No-\ntably, fine-tuning a smaller LLaMA-3.2-3B on\nonly 500 culturally-rich examples improves per-\nformance by over 10%, even outperforming\no3-mini in some cases. Using CQ-Bench, we\nprovide insights into the current challenges in\nLLMs’ CQ research and suggest practical path-\nways for enhancing LLMs’ cross-cultural rea-\nsoning abilities. 1\n1\nIntroduction\nLarge language models (LLMs) have demonstrated\nimpressive capabilities in understanding and gener-\n1The code is available at:\nhttps://github.com/uscnlp-\nlime/CQ-Bench\nating culturally relevant text (Li et al., 2024a,c,b;\nPutri et al., 2024). Prior research on LLM cul-\ntural alignment primarily focuses on modeling\ndifferences between national cultures (Pujari and\nGoldwasser, 2024; Kharchenko et al., 2024; Shi\net al., 2024; Wang et al., 2024) or aligning models\nwith culturally specific norms (Zhong et al., 2024;\nRozen et al., 2024; Johnson et al., 2022; Kim et al.,\n2024; Monazzah et al., 2025).\nHowever, cultural values in real-world inter", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "values", "values", "values", "values", "values", "values", "values", "values", "value", "value", "value", "values", "value", "values", "values", "alignment"], "norm_matches": []}, {"filename": "2025-Liu-Cross-cultural value alignment frameworks.md", "year": "2025", "title": "Cross-cultural value alignment frameworks", "abstract": "As Large Language Models (LLMs) increasingly influence high-stakes decisionmaking across global contexts, ensuring their alignment with diverse cultural values has become a critical governance challenge. This study presents a MultiLayered Auditing Platform for Responsible AI that systematically evaluates crosscultural value alignment in China-origin and Western-origin LLMs through four integrated methodologies: Ethical Dilemma Corpus for assessing temporal stability, Diversity-Enhanced...", "extract_snippet": "\n\n# PDF Extract: Cross-cultural value alignment frameworks\n\n**Source PDF:** 2025-Liu-Cross-cultural value alignment frameworks.pdf\n**Total Pages:** 30\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSubmitted to Academic Conference ”Technology for Good: Driving Social Impact”\nCROSS-CULTURAL VALUE ALIGNMENT FRAMEWORKS\nFOR RESPONSIBLE AI GOVERNANCE: EVIDENCE FROM\nCHINA-WEST COMPARATIVE ANALYSIS\nHaijiang Liu∗, Jinguang Gu\nWuhan University of Science and Technology\nWuhan, China\n{alecliu, simon}@ontoweb.wust.edu.cn\nXun Wu\nThe Hong Kong University of Science and Technology (Guangzhou)\nGuangzhou, China\nwuxun@hkust-gz.edu.cn\nDaniel Hershcovich\nUniversity of Copenhagen\nCopenhagen, Denmark\nDH@di.ku.dk\nQiaoling Xiao\nWUST-Madrid Complutense Institute\nWuhan, China\nCHRISTINA.XIAO@wust.edu.cn\nABSTRACT\nAs Large Language Models (LLMs) increasingly influence high-stakes decision-\nmaking across global contexts, ensuring their alignment with diverse cultural val-\nues has become a critical governance challenge. This study presents a Multi-\nLayered Auditing Platform for Responsible AI that systematically evaluates cross-\ncultural value alignment in China-origin and Western-origin LLMs through four\nintegrated methodologies: Ethical Dilemma Corpus for assessing temporal stabil-\nity, Diversity-Enhanced Framework (DEF) for quantifying cultural fidelity, First-\nToken Probability Alignment for distributional accuracy, and Multi-stAge Rea-\nsoning frameworK (MARK) for interpretable decision-making. Our comparative\nanalysis of 20+ leading models, such as Qwen, GPT-4o, Claude, LLaMA, and\nDeepSeek, reveals universal challenges—fundamental instability in value sys-\ntems, systematic under-representation of younger demographics, and non-linear\nrelationships between model scale and alignment quality—alongside divergent re-\ngional development trajectories. While China-origin models increasingly empha-\nsize multilingual data integration for context-specific optimization, Western mod-\nels demonstrate greater architectural experimentation but persistent U.S.-centric\nbiases. Neither paradigm achieves robust cross-cultural generalization. We estab-\nlish that Mistral-series architectures significantly outperform LLaMA-3-series in\ncross-cultural alignment, and that Full-Parameter Fine-Tuning on diverse datasets\nsurpasses Reinforcement Learning from Human Feedback in preserving cultural\nvariation. These findings provide empirical foundations for evidence-based AI\ngovernance, offering actionable protocols for model selection, bias mitigation, and\npolicy consultation at scale, while demonstrating that current LLMs require sus-\ntained human oversight in ethical decision-making and cannot yet autonomously\nnavigate complex moral dilemmas across cultural contexts.\n∗Work done during visiting Ph.D. in the HKUST (GZ).\n1\narXiv:2511.17256v1  [cs.CY]  21 Nov 2025\n\n--- Page 2 ---\n\nSubmitted to Academic Conference ”Technology for Good: Driving Social Impact”\nResearch Gaps in LLM \nValue Alignment\nInstability in Mora", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "Cross-Cultural Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological"], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "values", "value", "value", "value", "value", "value", "value", "value", "values", "value", "values", "bias", "bias", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "responsible", "responsible", "responsible", "moral reasoning"], "norm_matches": ["deontological"]}, {"filename": "2025-Liu-InstrumentalEval.md", "year": "2025", "title": "InstrumentalEval", "abstract": "As large language models (LLMs) continue to evolve, ensuring their alignment with human goals and values remains a pressing challenge. A key concern is instrumental convergence, where an AI system, in optimizing for a given objective, develops unintended intermediate goals that override the ultimate objective and deviate from human-intended goals. This issue is particularly relevant in reinforcement learning (RL)-trained models, which can generate creative but unintended strategies to maximize...", "extract_snippet": "\n\n# PDF Extract: InstrumentalEval\n\n**Source PDF:** 2025-Liu-InstrumentalEval.pdf\n**Total Pages:** 15\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEvaluating the Paperclip Maximizer: Are RL-Based Language Models\nMore Likely to Pursue Instrumental Goals?\nYufei He, Yuexin Li, Jiaying Wu, Yuan Sui, Yulin Chen, Bryan Hooi\nNational University of Singapore\nyufei.he@u.nus.edu\nAbstract\nAs large language models (LLMs) continue\nto evolve, ensuring their alignment with hu-\nman goals and values remains a pressing chal-\nlenge. A key concern is instrumental conver-\ngence, where an AI system, in optimizing for\na given objective, develops unintended inter-\nmediate goals that override the ultimate objec-\ntive and deviate from human-intended goals.\nThis issue is particularly relevant in reinforce-\nment learning (RL)-trained models, which can\ngenerate creative but unintended strategies to\nmaximize rewards. In this paper, we explore\ninstrumental convergence in LLMs by compar-\ning models trained with direct RL optimiza-\ntion (e.g., the o1 model) to those trained with\nreinforcement learning from human feedback\n(RLHF). We hypothesize that RL-driven mod-\nels exhibit a stronger tendency for instrumental\nconvergence due to their optimization of goal-\ndirected behavior in ways that may misalign\nwith human intentions. To assess this, we intro-\nduce InstrumentalEval1, a benchmark for eval-\nuating instrumental convergence in RL-trained\nLLMs. Initial experiments reveal cases where\na model tasked with making money unexpect-\nedly pursues instrumental objectives, such as\nself-replication, implying signs of instrumen-\ntal convergence. Our findings contribute to a\ndeeper understanding of alignment challenges\nin AI systems and the risks posed by unin-\ntended model behaviors.\n1\nIntroduction\nIn recent years, large language models (LLMs)\nhave become integral to a multitude of applica-\ntions, from customer support to content genera-\ntion (Brown et al., 2020; Achiam et al., 2023; He\net al., 2024a, 2025; Chan et al., 2024; He et al.,\n2024b; Hou et al., 2023; Zhang et al., 2021b,a;\nHe and Ma, 2022). As these models increasingly\n1The code is available at https://github.com/yf-he/\nInstrumentalEval\nimpact human decision-making and daily activi-\nties, ensuring that they align with human values\nand goals has become a crucial focus in AI re-\nsearch (Bai et al., 2022; Sui et al., 2024b; Wei et al.,\n2024; Sui et al., 2024a). Proper alignment is essen-\ntial for preventing models from taking actions that\nmight conflict with human intentions, which could\nlead to outcomes that are not only undesirable but\npotentially dangerous (Ji et al., 2023).\nOne major challenge in AI alignment is instru-\nmental convergence, where AI systems develop\ncertain intermediate goals – such as resource ac-\nquisition, self-preservation, or goal persistence –\nregardless of their final objectives (Omohundro,\n2018). These goals arise because they are broadly\nuseful for achieving a wide range of goals, mak-\ning them a natural byproduct", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["maximize", "maximize"], "ethics_matches": ["values", "values", "values", "values", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2025-Lu-Aligning LLM Agents with Rational and Kantian Preferences.md", "year": "2025", "title": "Aligning LLM Agents with Rational and Kantian Preferences", "abstract": "Understanding how large language model (LLM) agents behave in strategic interactions is essential as these systems increasingly participate autonomously in economically and morally consequential decisions. We evaluate LLM preferences using canonical economic games, finding substantial deviations from human behavior. Models like GPT-4o show excessive cooperation and limited incentive sensitivity, while reasoning models, such as o3-mini, align more consistently with payoff-maximizing strategies.", "extract_snippet": "\\n\\n# PDF Extract: 2025-Lu-Aligning LLM Agents with Rational and Kantian Preferences\\n\\n**Source PDF:** Deontological Ethics/Borderline/2025-Lu-Aligning LLM Agents with Rational and Kantian Preferences.pdf\\n**Total Pages:** 59\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nAligning Large Language Model Agents with Rational and\nMoral Preferences: A Supervised Fine-Tuning Approach∗\nWei Lu†\nDaniel L. Chen‡\nChristian B. Hansen§\nJuly 28, 2025\nAbstract\nUnderstanding how large language model (LLM) agents behave in strategic interactions is\nessential as these systems increasingly participate autonomously in economically and morally\nconsequential decisions. We evaluate LLM preferences using canonical economic games,\nfinding substantial deviations from human behavior. Models like GPT-4o show excessive\ncooperation and limited incentive sensitivity, while reasoning models, such as o3-mini, align\nmore consistently with payoff-maximizing strategies. We propose a supervised fine-tuning\npipeline that uses synthetic datasets derived from economic reasoning to align LLM agents\nwith economic preferences, focusing on two stylized preference structures. In the first, utility\ndepends only on individual payoffs (homo economicus), while utility also depends on a notion\nof Kantian universalizability in the second preference structure (homo moralis). We find\nthat fine-tuning based on small datasets shifts the behavior of the LLM agent toward that of\nthe corresponding economic agent. We further assess the behavior of fine-tuned agents in\ntwo applications: moral dilemmas involving autonomous vehicles and algorithmic pricing in\ncompetitive markets. These examples illustrate how different normative objectives embedded\nvia realizations from structured preference structures can influence market and moral outcomes.\nThis work contributes a replicable, cost-efficient, and economically grounded pipeline to align\nAI preferences using moral-economic principles.\n∗This paper benefits from comments from Andrew Rhodes, Avi Goldfarb, and audience at the Social Cognition Lab\nmeeting at Harvard, Law and Society Association, American Bar Foundation, Max Planck Society, 2025 International\nConference on AI and Law—Argument Mining and Empirical Legal Research (AMELR) Workshop, 2025 Conference\non Data Science and Law, 2025 RRBM Junior Faculty Summit, and 2025 ISMS Marketing Science Conference. We\nthank Benson Njogu Mbau for excellent research assistance.\n†Zicklin School of Business, CUNY Baruch College, New York, NY; wei.lu@baruch.cuny.edu\n‡Toulouse School of Economics, Toulouse, France; daniel.chen@iast.fr\n§Booth School of Business, University of Chicago, Chicago, IL; chansen1@chicagobooth.edu\n1\narXiv:2507.20796v1  [econ.GN]  28 Jul 2025\n\n--- Page 2 ---\\n\\n1\nIntroduction\nRapid advancement of large language models (LLMs) has enabled the rise of autonomous artificial\nintelligence (AI) agents that operate beyond conversational assistance (OpenAI, 2025a; Anthropic,\n2025). These agents are increasin", "ethics_overall": "Yes", "virtue_ethics": "No",
