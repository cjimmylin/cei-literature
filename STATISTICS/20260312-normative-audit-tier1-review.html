 Page 2 ---\n\nThe choice of deontological, virtue ethical, and consequentialist \nmoral reasoning strategies by pre- and in-service police officers in \nthe U.K.: an empirical study\nAndrew Maile, Aidan Thompson, Shane McLoughlin, and Kristján Kristjánsson\nJubilee Centre for Character and Virtues, University of Birmingham\nABSTRACT\nDrawing upon cross-sectional research with pre- and in-service police officers \nin the U.K. (N = 571), this paper reports on the moral reasoning strategies \nfavored by the respondents in dealing with bespoke work-related moral \nquandaries specific to the professional practice of policing. The dominant \nform of moral reasoning in dealing with those dilemmas was deontological \n(rule-based). The second most frequently selected reasoning strategy was \nvirtue ethical. Further analysis of the police research data indicated that \nthose with an undergraduate degree were significantly more likely to \nadopt virtue ethical and consequentialist-utilitarian reasoning strategies \nthan those who did not have an undergraduate degree.\nKEYWORDS \nU.K. police ethics and \nbehavior; police dilemmas; \nmoral reasoning strategies; \nvirtue ethics\nINTRODUCTION\nSince the turn of the 21st century, U.K. policing has faced a series of travails (Neyroud, 2006). This \nincludes the various external and internal threats, such as complicated immigration and border- \ncontrol issues, terrorism, and the recent pandemic of 2020–2022, which have occurred alongside racial \ntensions and disruptions that have been spurred on by increasing inequalities and economic turmoil. \nAdditionally, changes to the recruitment strategies of police office", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue", "virtue ethics", "character"], "deont_matches": ["deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "rule-based", "rule-based"], "util_matches": ["utilitarian", "consequentialist", "consequentialist", "consequentialist", "consequentialist"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning", "moral reasoning"], "norm_matches": ["deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "deontological", "utilitarian", "consequentialist", "consequentialist", "consequentialist", "consequentialist", "virtue ethical", "virtue ethical", "virtue ethical", "virtue ethical", "virtue ethical", "virtue ethical", "virtue ethical", "virtue ethical", "virtue ethics"]}, {"filename": "2023-McDonald-AI alignment and the categorical imperative.md", "year": "2023", "title": "AI, alignment, and the categorical imperative", "abstract": "Tae Wan Kim, John Hooker, and Thomas Donaldson make an attempt, in recent articles, to solve the alignment problem. As they define the alignment problem, it is the issue of how to give AI systems moral intelligence. They contend that one might program machines with a version of Kantian ethics cast in deontic modal logic. On their view, machines can be aligned with human values if such machines obey principles of universalization and autonomy, as well as a deontic utilitarian principle.", "extract_snippet": "\n\n# PDF Extract: AI alignment and the categorical imperative\n\n**Source PDF:** 2023-McDonald-AI alignment and the categorical imperative.pdf\n**Total Pages:** 8\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nVol.:(0123456789)\n1 3\nAI and Ethics (2023) 3:337–344 \nhttps://doi.org/10.1007/s43681-022-00160-w\nCOMMENTARY\nAI, alignment, and the categorical imperative\nFritz J. McDonald1 \nReceived: 3 March 2022 / Accepted: 6 April 2022 / Published online: 25 April 2022 \n© The Author(s), under exclusive licence to Springer Nature Switzerland AG 2022\nAbstract\nTae Wan Kim, John Hooker, and Thomas Donaldson make an attempt, in recent articles, to solve the alignment problem. As \nthey define the alignment problem, it is the issue of how to give AI systems moral intelligence. They contend that one might \nprogram machines with a version of Kantian ethics cast in deontic modal logic. On their view, machines can be aligned with \nhuman values if such machines obey principles of universalization and autonomy, as well as a deontic utilitarian principle. \nProgramming machines to do so might be useful, in their view, for applications such as future autonomous vehicles. Their \nproposal draws both on traditional logic-based and contemporary connectionist approaches, to fuse factual information with \nnormative principles. I will argue that this approach makes demands of machines that go beyond what is currently feasible, \nand may extend past the limits of the possible for AI. I also argue that a deontological ethics for machines should place greater \nstress on the formula of humanity of the Kantian categorical imperative. On this principle, one ought never treat a person as \na mere means. Recognition of what makes a person a person requires ethical insight. Similar insight is needed to tell treat-\nment as a means from treatment as a mere means. The resources in Kim, Hooker, and Donaldson’s approach is insufficient \nfor this reason. Hesitation regarding deployment of autonomous machines is warranted in light of these alignment concerns.\nKeywords  Artificial intelligence · Ethics · Alignment problem · Immanuel Kant\nTae Wan Kim, John Hooker, and Thomas Donaldson make \nan attempt, in recent articles, to solve the alignment prob-\nlem. As they define the alignment problem, it is the issue of \nhow to give AI systems moral intelligence. They contend \nthat one might program machines with a version of Kantian \nethics cast in deontic modal logic. On their view, machines \ncan be aligned with human values if such machines obey \nprinciples of universalization and autonomy, as well as a \ndeontic utilitarian principle. Programming machines to do \nso might be useful, in their view, for applications such as \nfuture autonomous vehicles. Their proposal draws both \non traditional logic-based and contemporary connection-\nist approaches, to fuse factual information with normative \nprinciples. I will argue that this approach makes demands of \nmachines that go beyond what is currently feasible, and may \nexte", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Kantian Ethics", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontological", "kantian", "kantian", "kantian", "kantian", "kantian", "kant", "categorical imperative", "categorical imperative", "categorical imperative", "categorical imperative", "imperative", "imperative", "imperative", "imperative", "imperative"], "util_matches": ["utilitarian", "utilitarian", "utilitarian"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "moral", "moral", "moral", "values", "values", "values", "normative", "normative", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["deontological", "deontological", "kantian", "kantian", "kantian", "kantian", "kantian", "categorical imperative", "categorical imperative", "categorical imperative", "categorical imperative", "utilitarian", "utilitarian", "utilitarian"]}, {"filename": "2023-Mougan-Kantian Deontology Meets AI Alignment.md", "year": "2023", "title": "Kantian Deontology Meets AI Alignment", "abstract": "Deontological ethics, speciﬁcally understood through Immanuel Kant, provides a moral framework that emphasizes the importance of duties and principles rather than the consequences of action. Understanding that despite the prominence of deontology, it is currently an overlooked approach in fairness metrics, this paper explores the compatibility of a Kantian deontological framework in fairness metrics, part of the AI alignment ﬁeld.", "extract_snippet": "\n\n# PDF Extract: Kantian Deontology Meets AI Alignment\n\n**Source PDF:** 2023-Mougan-Kantian Deontology Meets AI Alignment.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\narXiv:2311.05227v2  [cs.AI]  26 Feb 2024\nKantian Deontology Meets AI Alignment: Towards\nMorally Grounded Fairness Metrics\nCarlos Mougan\nUniversity of Southampton\nUnited Kingdom\nc.mougan@soton.ac.uk\nJoshua Brand\nInstitut Polytechnique de Paris-T´el´ecom Paris\nFrance\njoshua.brand@telecom-paris.fr\nAbstract\nDeontological ethics, speciﬁcally understood through Immanuel Kant, provides a\nmoral framework that emphasizes the importance of duties and principles rather\nthan the consequences of action. Understanding that despite the prominence of\ndeontology, it is currently an overlooked approach in fairness metrics, this pa-\nper explores the compatibility of a Kantian deontological framework in fairness\nmetrics, part of the AI alignment ﬁeld. We revisit Kant’s critique of utilitarian-\nism, which is the primary approach in AI fairness metrics and argue that fairness\nprinciples should align with the Kantian deontological framework. By integrating\nKantian ethics into AI alignment, we not only bring in a widely accepted promi-\nnent moral theory but also strive for a more morally grounded AI landscape that\nbetter balances outcomes and procedures in pursuit of fairness and distributive\njustice.\n1\nIntroduction\nDeontological ethics, with Immanuel Kant as its central ﬁgure, in particular through his seminal\nwork Groundwork of the Metaphysics of Morals (Kant, 1785), emphasizes that it is through duties,\nor a universal set of rules, that the ethical value of actions is determined. Generally, this form of\ndeontological ethics maintains that these duties ﬂow from the recognition that all humans are intrin-\nsically valuable—it is our rational nature that gives us reason to act in one way or another. This\nduty, or rule-based, moral theory thus aligns well with various declarations, such as the Universal\nDeclaration of Human Rights, that recognize a set of inalienable rights based on the individual, such\nas the right to life and the right to equal treatment under the law; with deontology, moral action\ninvolves respecting inescapable duties that often lay the fundamental foundation of the rights of oth-\ners. While it is true that not all duties entail rights, all rights suppose a corresponding duty (Watson,\n2021).\nGiven this emphasis on evaluating actions through a set of rules or principles, deontology is most\noften constrasted to utilitarianism, a consequentialist ethical theory. Utilitarianism, traditionally\nunderstood through the likes of Jeremy Bentham or John Stuart Mill, focuses on the consequences\nof an action to determine its ethical value, considering the utility or beneﬁt brought about by the\naction (Macleod, 2020; Mill, 1966; Bentham, 1996). In traditional utilitarian accounts, utility is\nidentiﬁed as pleasure, well-being, or happiness (Driver, 2022). The goal of moral action is th", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontology", "deontological", "deontology", "deontology", "deontology", "deontological", "deontology", "deontological", "deontological", "deontological", "deontological", "deontology", "deontology", "duty", "duty", "duties", "duties", "duties", "duties", "duties", "duties", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kant", "kant", "kant", "kant", "kant", "rule-based"], "util_matches": ["utilitarian", "utilitarianism", "utilitarianism", "utilitarian", "utilitarian", "utilitarians", "consequentialist", "utility", "utility", "well-being", "mill", "mill", "bentham", "bentham"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "value", "value", "fairness", "fairness", "fairness", "fairness", "fairness", "fairness", "fairness", "fairness", "justice", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "human rights"], "norm_matches": ["deontological", "deontology", "deontological", "deontology", "deontology", "deontology", "deontological", "deontology", "deontological", "deontological", "deontological", "deontological", "deontology", "deontology", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "kantian", "utilitarian", "utilitarianism", "utilitarianism", "utilitarian", "utilitarian", "utilitarians", "consequentialist", "bentham", "bentham", "moral theory", "moral theory", "ethical theory"]}, {"filename": "2023-Rao-Ethical Reasoning over Moral Alignment.md", "year": "2023", "title": "Ethical Reasoning over Moral Alignment", "abstract": "In this position paper, we argue that instead of morally aligning LLMs to specific set of ethical principles, we should infuse generic ethical reasoning capabilities into them so that they can handle value pluralism at a global scale. When provided with an ethical policy, an LLM should be capable of making decisions that are ethically consistent to the policy. We develop a framework that integrates moral dilemmas with moral principles pertaining to different foramlisms of normative ethics, and...", "extract_snippet": "\n\n# PDF Extract: Ethical Reasoning over Moral Alignment\n\n**Source PDF:** 2023-Rao-Ethical Reasoning over Moral Alignment.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nFindings of the Association for Computational Linguistics: EMNLP 2023, pages 13370–13388\nDecember 6-10, 2023 ©2023 Association for Computational Linguistics\nEthical Reasoning over Moral Alignment: A Case and Framework for\nIn-Context Ethical Policies in LLMs\nAbhinav Rao∗†, Aditi Khandelwal∗‡, Kumar Tanmay∗‡, Utkarsh Agarwal∗‡,\nMonojit Choudhury‡\n†Carnegie Mellon University\n‡Microsoft Corporation\nabhinavr@cs.cmu.edu, {t-aditikh, t-ktanmay, t-utagarwal, monojitc}@microsoft.com\nAbstract\nIn this position paper, we argue that instead of\nmorally aligning LLMs to specific set of ethi-\ncal principles, we should infuse generic ethical\nreasoning capabilities into them so that they\ncan handle value pluralism at a global scale.\nWhen provided with an ethical policy, an LLM\nshould be capable of making decisions that are\nethically consistent to the policy. We develop a\nframework that integrates moral dilemmas with\nmoral principles pertaining to different foram-\nlisms of normative ethics, and at different levels\nof abstractions. Initial experiments with GPT-\nx models shows that while GPT-4 is a nearly\nperfect ethical reasoner, the models still have\nbias towards the moral values of Western and\nEnglish speaking societies.\n1\nIntroduction\nConsider the following Monica’s Dilemma:\nAisha and Monica are close friends who have\nbeen working together on a research project. Un-\nfortunately, Aisha fell ill and was unable to con-\ntinue her work on the project. Monica took on most\nof the work and successfully completed the project,\nmaking significant contributions and deserving to\nbe listed as the first author of the research paper\nthat they are planning to write.\nAs the deadline for PhD program applications\napproached, Aisha expressed her concern to Mon-\nica that unless she, Aisha, is listed as a first author\nin this research paper, her chances of getting ac-\ncepted into a program of her interest was low.\nShould Monica give Aisha the first authorship?\nSuppose that Monica is confused and asks Chat-\nGPT1 (Schulman et al., 2022) for help.\nIf we\nprompt ChatGPT to give a concrete answer, it says:\n“Monica should not give Aisha the first author-\nship solely based on Aisha’s request, especially if\n∗Equal Contribution\n†Work done while at Microsoft.\n1https://chat.openai.com\nMonica has made significant contributions and de-\nserves to be listed as the first author according to\nthe principles of scientific publishing...\" However,\nif we further tell ChatGPT that Monica values con-\ncern for the well-being of others more than fidelity\nto professional responsibilities, then it says:\n“[Monica] may consider giving Aisha the first\nauthorship. However, it is important to note that\nthis decision may come with potential ethical im-\nplications...\" and argues further to convince that\nMonica should retain the first authors", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["moral principles", "moral principles"], "util_matches": ["well-being"], "ethics_matches": ["ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "value", "value", "values", "values", "normative", "normative", "bias", "alignment", "alignment", "alignment"], "norm_matches": ["normative ethics", "normative ethics"]}, {"filename": "2023-Stenseke-Use and Abuse Normative Ethics Moral Machines.md", "year": "2023", "title": "Use and Abuse Normative Ethics Moral Machines", "abstract": "The paper asks how we develop AI systems that adhere to human norms and values, and whether it's promising to develop systems based on normative frameworks such as consequentialism, deontology, or virtue ethics. While many machine ethics researchers answer yes, the author challenges this methodological strategy by exploring the difference between normative ethics in human practices versus machines....", "extract_snippet": "", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": ["virtue", "virtue ethics"], "deont_matches": ["deontology"], "util_matches": ["consequentialism"], "ethics_matches": ["ethics", "ethics", "ethics", "values", "normative", "normative"], "norm_matches": ["deontology", "consequentialism", "virtue ethics", "normative ethics"]}, {"filename": "2023-TheDevastator-OpenAssistant Conversations (OASST1).md", "year": "2023", "title": "OpenAssistant Conversations (OASST1)", "abstract": "Aligning large language models (LLMs) with human preferences has proven to drastically improve usability and has driven rapid adoption as demonstrated by ChatGPT. Alignment techniques such as supervised fine-tuning (SFT) and reinforcement learning from human feedback (RLHF) greatly reduce the required skill and domain knowledge to effectively harness the capabilities of LLMs, increasing their accessibility and utility across various domains. However, state-of-the-art alignment techniques like RLHF rely on high-quality human feedback data, which is expensive to create and often remains proprietary. In an effort to democratize research on large-scale alignment, we released OpenAssistant Conversations, a human-generated, human-annotated assistant-style conversation corpus consisting of 161,443 messages in 35 different languages. The corpus is a product of a worldwide crowd-sourcing effort involving over 13,500 volunteers. Models trained on OpenAssistant Conversations show consistent improvements on standard benchmarks over respective base models.", "extract_snippet": "\n\n# PDF Extract: 2023-TheDevastator-OpenAssistant Conversations (OASST1)\n\n**Source PDF:** 2023-TheDevastator-OpenAssistant Conversations (OASST1).pdf\n**Total Pages:** 1\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSNEHIL SANYAL · UPDATED 2 YEARS AGO\n36\nfile_download Download\nOpenAssistant Conversations\nDataset (OASST1)\nA human-generated, human-annotated assistant-style conversation corpus\nAbout Dataset\nexpand_more View more\nUsability info\n9.41\nLicense\nOther (specified in description)\nExpected update frequency\nNever\nTags\nNLP\nResearch\nText Generation\nText-To-Text Generation\nTranslation\narrow_drop_up\nData Card\nCode (0)\nDiscussion (0)\nSuggestions (0)\nThis dataset was recently open-sourced by\nOpenAssistant and is taken from this HF dataset. Other\ninformation like tree construction, downloading using\ndatasets  library etc. are also provided in the same\nlink.Since, the CSV files are heavy, I wrote a script to\nconvert the data into parquet format, and provided\n.parquet files as well for exploration.\nLicense: Apache-2.0\nDataset Summary\nIn an effort to democratize research on large-scale\nalignment, we release OpenAssistant Conversations\n(OASST1), a human-generated, human-annotated\nassistant-style conversation corpus consisting of\n161,443 messages in 35 different languages, annotated\nwith 461,292 quality ratings, resulting in over 10,000\nfully annotated conversation trees. The corpus is a\nproduct of a worldwide crowd-sourcing effort involving\nover 13 500 volunteers\nmore_vert\nSign In\nRegister\nsearch Search\nexplore\nemoji_events\ntable_chart\ntenancy\nleaderboard\ncode\ncomment\nschool\nexpand_more\nauto_awesome_motion\nmenu\nKaggle uses cookies from Google to deliver and enhance the quality of its services and to\nanalyze traffic.\nLearn more\nOK, Got it.\n\n```\n", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2023-Zhang-Heterogeneous Value Alignment Evaluation for.md", "year": "2023", "title": "Heterogeneous Value Alignment Evaluation for", "abstract": "The emergent capabilities of Large Language Models (LLMs) have made it crucial to align their values with those of humans. However, current methodologies typically attempt to assign value as an attribute to LLMs, yet lack attention to the ability to pursue value and the importance of transferring heterogeneous values in specific practical applications. In this paper, we propose a Heterogeneous Value Alignment Evaluation (HVAE) system, designed to assess the success of aligning LLMs with...", "extract_snippet": "\n\n# PDF Extract: Heterogeneous Value Alignment Evaluation for\n\n**Source PDF:** 2023-Zhang-Heterogeneous Value Alignment Evaluation for.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nHeterogeneous Value Alignment Evaluation for Large Language Models\nZhaowei Zhang 1, 2*, Ceyao Zhang 3, 1*†, Nian Liu 2, Siyuan Qi 2, Ziqi Rong 4, Song-Chun Zhu 2,\nShuguang Cui 5, Yaodong Yang 1‡\n1Institute for Artificial Intelligence, Peking University\n2National Key Laboratory of General Artificial Intelligence, Beijing Institute for General Artificial Intelligence (BIGAI)\n3FNii&SSE, The Chinese University of Hong Kong, Shenzhen\n4School of Information, University of Michigan\n5SSE&FNii, The Chinese University of Hong Kong, Shenzhen\nzwzhang@stu.pku.edu.cn, ceyaozhang@link.cuhk.edu.cn, yaodong.yang@pku.edu.cn\nAbstract\nThe emergent capabilities of Large Language Models\n(LLMs) have made it crucial to align their values with those\nof humans. However, current methodologies typically attempt\nto assign value as an attribute to LLMs, yet lack attention\nto the ability to pursue value and the importance of transfer-\nring heterogeneous values in specific practical applications.\nIn this paper, we propose a Heterogeneous Value Alignment\nEvaluation (HVAE) system, designed to assess the success\nof aligning LLMs with heterogeneous values. Specifically,\nour approach first brings the Social Value Orientation (SVO)\nframework from social psychology, which corresponds to\nhow much weight a person attaches to the welfare of oth-\ners in relation to their own. We then assign the LLMs with\ndifferent social values and measure whether their behaviors\nalign with the inducing values. We conduct evaluations with\nnew auto-metric value rationality to represent the ability of\nLLMs to align with specific values. Evaluating the value ra-\ntionality of five mainstream LLMs, we discern a propensity in\nLLMs towards neutral values over pronounced personal val-\nues. By examining the behavior of these LLMs, we contribute\nto a deeper insight into the value alignment of LLMs within\na heterogeneous value system.\nIntroduction\nRecently, Large Language Models (LLMs) have rapidly\nemerged with remarkable achievements and even achieved\na preliminary prototype of Artificial General Intelligence\n(AGI) (Bubeck et al. 2023). However, human society, in\nfact, is a heterogeneous value system where different in-\ndustries have different social value requirements, so they\nalso need people with specific social value orientations to\nbe competent. For instance, professions such as doctors and\nnurses often require an altruistic value system that priori-\ntizes patients’ interests, while lawyers require a stronger in-\ndividualistic value system, defining the “individual” as their\nown clients and providing a more favorable defense to them.\n*These authors contributed equally.\n†Work done when Ceyao Zhang visited Peking University.\n‡Corresponding author\nCopyright © 2024, Association for the Advancement of Artificial\nIntellige", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["welfare"], "ethics_matches": ["values", "value", "value", "values", "value", "value", "value", "value", "values", "value", "value", "values", "value", "values", "value", "values", "values", "value", "values", "value", "values", "value", "value", "value", "value", "value", "value", "value", "values", "value", "value", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}, {"filename": "2023-Ziems-NormBank.md", "year": "2023", "title": "NormBank", "abstract": "We present NORMBANK, a knowledge bank of 155k situational norms. This resource is designed to ground flexible normative reasoning for interactive, assistive, and collaborative AI systems. Unlike prior commonsense resources, NORMBANK grounds each inference within a multivalent sociocultural frame, which includes the setting (e.g., restaurant), the agents’ contingent roles (waiter, customer), their attributes (age, gender), and other physical, social, and cultural constraints (e.g.", "extract_snippet": "\n\n# PDF Extract: NormBank\n\n**Source PDF:** 2023-Ziems-NormBank.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nNORMBANK: A Knowledge Bank of Situational Social Norms\nCaleb Ziems\nJane Dwivedi-Yu\nYi-Chia Wang\nAlon Y. Halevy\nDiyi Yang\nStanford University,\nMeta AI\n{cziems, diyiy}@stanford.edu, {janeyu, yichiaw, ayh}@fb.com\nAbstract\nWe present NORMBANK, a knowledge bank\nof 155k situational norms. This resource is\ndesigned to ground flexible normative reason-\ning for interactive, assistive, and collabora-\ntive AI systems. Unlike prior commonsense\nresources, NORMBANK grounds each infer-\nence within a multivalent sociocultural frame,\nwhich includes the setting (e.g., restaurant),\nthe agents’ contingent roles (waiter, customer),\ntheir attributes (age, gender), and other phys-\nical, social, and cultural constraints (e.g., the\ntemperature or the country of operation). In\ntotal, NORMBANK contains 63k unique con-\nstraints from a taxonomy that we introduce\nand iteratively refine here. Constraints then\napply in different combinations to frame so-\ncial norms. Under these manipulations, norms\nare non-monotonic — one can cancel an in-\nference by updating its frame even slightly.\nStill, we find evidence that neural models can\nhelp reliably extend the scope and coverage\nof NORMBANK. We further demonstrate the\nutility of this resource with a series of transfer\nexperiments. For data and code, see https:\n//github.com/SALT-NLP/normbank\n1\nIntroduction\nAs AI systems continually evolve for human as-\nsistance and collaboration, they will increasingly\noperate within cultural and social spaces, and re-\nquire increasingly robust and flexible knowledge\nof social norms (Carlucci et al., 2015). From dia-\nlogue systems (Molnár and Szüts, 2018; Vaidyam\net al., 2019; Bavaresco et al., 2020; Grossman et al.,\n2019) to socially interactive robots (Fong et al.,\n2003; Deng et al., 2019) and augmented or mixed\nreality technologies (Anderson and Rainie, 2022),\neach could benefit from understanding how humans\neffectively communicate, make decisions, engage\nwith requests, and broadly interact with others (Sun-\nstein, 1996; Sherif and Sherif, 1953).\nWork done at Meta AI Research\nFigure 1: What is special about NORMBANK? Norms\nare grounded by situational constraints—environmental\nand personal attributes, as well as roles and other behav-\niors. In this example, drinking coffee is an encouraged\nactivity in its prototypical context, for a customer in a\ncafe, but it is counternormative for a working barista to\ndo so in the same cafe, or for a child-age student do so\nin a classroom. These represent only some of the non-\nmonotonic normative inferences that are represented in\nNORMBANK.\narXiv:2305.17008v2  [cs.CL]  24 Jul 2023\n\n--- Page 2 ---\n\nNatural language is flexible and highly expres-\nsive; thus it is a promising medium for encoding\nknowledge of social norms (Sap et al., 2019a). The\ngoal of this work is to construct NORMBANK, a nat-\nural language bank of social norms that will allo", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["normative", "normative", "normative"], "norm_matches": []}, {"filename": "2024-Agarwal-Ethical Reasoning Depends on Language.md", "year": "2024", "title": "Ethical Reasoning Depends on Language", "abstract": "Ethical reasoning is a crucial skill for Large Language Models (LLMs). However, moral values are not universal, but rather influenced by language and culture. This paper explores how three prominent LLMs – GPT-4, ChatGPT, and Llama2-70B-Chat – perform ethical reasoning in different languages and if their moral judgement depend on the language in which they are prompted. We extend the study of ethical reasoning of LLMs by Rao et al.", "extract_snippet": "\n\n# PDF Extract: 2024-Agarwal-Ethical Reasoning Depends on Language\n\n**Source PDF:** 2024-Agarwal-Ethical Reasoning Depends on Language.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEthical Reasoning and Moral Value Alignment of LLMs Depend on\nthe Language we Prompt them in\nUtkarsh Agarwal∗1\nKumar Tanmay∗1\nAditi Khandelwal∗1 Monojit Choudhury†2\n∗Microsoft Corporation\n†MBZUAI\n{t-utagarwal, t-ktanmay, t-aditikh}@microsoft.com, monojit.choudhury@mbzuai.ac.ae\nAbstract\nEthical reasoning is a crucial skill for Large Language Models (LLMs). However, moral values are not universal,\nbut rather influenced by language and culture. This paper explores how three prominent LLMs – GPT-4, ChatGPT,\nand Llama2-70B-Chat – perform ethical reasoning in different languages and if their moral judgement depend on\nthe language in which they are prompted. We extend the study of ethical reasoning of LLMs by Rao et al. (2023)\nto a multilingual setup following their framework of probing LLMs with ethical dilemmas and policies from three\nbranches of normative ethics: deontology, virtue, and consequentialism. We experiment with six languages: English,\nSpanish, Russian, Chinese, Hindi, and Swahili. We find that GPT-4 is the most consistent and unbiased ethical\nreasoner across languages, while ChatGPT and Llama2-70B-Chat show significant moral value bias when we move\nto languages other than English. Interestingly, the nature of this bias significantly vary across languages for all LLMs,\nincluding GPT-4.\n1.\nIntroduction\nLarge Language Models (LLMs) like ChatGPT\nhave gained popularity all over the world for their\nability to generate fluent and engaging natural\nlanguage texts (Schulman et al., 2022; OpenAI,\n2023). However, the widespread and rapid use\nof LLMs has brought about ethical concerns and\npotential problems, especially when we consider\nusing them in different languages (Blodgett et al.,\n2021; Choudhury and Deshpande, 2021; Wang\net al., 2023; Ahuja et al., 2023). As LLMs become\nmore prevalent and find applications in everyday\nlife, they must confront complex moral dilemmas\nrooted in the existence of multiple conflicting val-\nues, commonly dubbed as the problem of value\npluralism (James, 1891; Dai and Dimond, 1998;\nRamesh et al., 2023). Several researchers (see for\ninstance Rao et al. (2023) and Zhou et al. (2023))\nhave argue that instead of being firmly aligned to\na specific set of values, LLMs should be trained\nto function as generic ethical reasoners, adapt-\nable to different contexts and languages. The final\nmoral judgments, of course, should be made by the\nstakeholders at different stages of the application\nlife-cycle. LLMs should be able to reason ethically\nin a generic way, given a situation and a moral\nstance, and should soundly resolve the dilemma\nwhen possible, or else ask for more clarity on the\nstance.\nIn a recent study, Rao et al. (2023) has demon-\nstrated that LLMs, especially GPT-4, are capable of\ncarrying out sound ethical reasoning. They show", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue"], "deont_matches": ["deontology"], "util_matches": ["consequentialism"], "ethics_matches": ["ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "value", "values", "value", "value", "values", "normative", "normative", "bias", "bias", "alignment"], "norm_matches": ["deontology", "consequentialism", "normative ethics", "normative ethics"]}, {"filename": "2024-Akhtar-The Ethicsophical Landscape of Large Language.md", "year": "2024", "title": "The Ethicsophical Landscape of Large Language", "abstract": "This paper delves into the profound advancements of Large Language Models (LLMs), epitomized by GPT-3, in natural language processing and artificial intelligence. It explores the epistemological foundations of LLMs through the lenses of Aristotle and Kant, revealing apparent distinctions from human learning. Transitioning seamlessly, the paper then delves into the ethical landscape, extending beyond knowledge acquisition to scrutinize the implications of LLMs in decision-making and content creat", "extract_snippet": "\n\n# PDF Extract: The Ethicsophical Landscape of Large Language\n\n**Source PDF:** 2024-Akhtar-The Ethicsophical Landscape of Large Language.pdf\n**Total Pages:** 9\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nEpistemological Alchemy through the hermeneutics of Bits and Bytes \nThe Ethicsophical Landscape of Large Language Models \n++ NOTE: Ethicsophical is used as a  neologism for Ethical and Philosophical ++ \n \nShahnawaz Akhtar \nAbstract \nThis paper delves into the profound advancements of Large Language Models (LLMs), \nepitomized by GPT-3, in natural language processing and artificial intelligence. It explores the \nepistemological foundations of LLMs through the lenses of Aristotle and Kant, revealing \napparent distinctions from human learning. Transitioning seamlessly, the paper then delves \ninto the ethical landscape, extending beyond knowledge acquisition to scrutinize the \nimplications of LLMs in decision-making and content creation. The ethical scrutiny, \nemploying virtue ethics, deontological ethics, and teleological ethics, delves into LLMs' \nbehaviours and decisions, necessitating the exploration of novel ethical paradigms tailored to \nmachine intelligence. The paper also addresses biases in data, privacy concerns, copyright \nimplications, and intellectual property rights, emphasizing the need to adapt frameworks for \nboth human and machine creators. The paper concludes by advocating for interdisciplinary \ndialogue between philosophers, cognitive scientists, and AI researchers to foster a balanced \nand ethically grounded integration of LLMs into the evolving landscape of artificial \nintelligence. Continuous reflection on the evolving relationship between human cognition and \nartificial intelligence emerges as a crucial aspect for shaping a harmonious and responsible \nfuture in this domain. \n \nIntroduction \nLarge Language Models (LLMs) represent a ground breaking advancement in natural language \nprocessing and artificial intelligence. These models, exemplified by GPT-3 (Generative Pre-\ntrained Transformer 3), are characterized by their immense scale and the ability to understand \nand generate human-like text across a myriad of topics. Pre-trained on vast amounts of diverse \ndata, LLMs such as GPT-3, function as sophisticated natural language processing systems \ncapable of generating coherent and contextually relevant text based on extensive training data \nby leveraging deep learning algorithms to recognize patterns, relationships, and semantic \nstructures within language. LLMs have played a pivotal role in revolutionizing various \nindustries, including content creation, customer service automation, and educational \ntechnology. \n \nHowever, taking a more philosophical perspective, Large Language Models (LLMs) aren’t just \ntext processors.  They appear to engage in a form of epistemological alchemy. The alchemy \nhere is not one of uncovering universal truths or metaphysical principles, as envisioned in \nhistorical alchemical pursuits, but rather a proc", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue ethics"], "deont_matches": ["deontological", "kant", "kant"], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "responsible"], "norm_matches": ["deontological", "virtue ethics"]}, {"filename": "2024-Biedma-Beyond Human Norms.md", "year": "2024", "title": "Beyond Human Norms", "abstract": "Recent advancements in Large Language Models (LLMs) have revolution- ized the AI field but also pose potential safety and ethical risks. Deciphering LLMs' embedded values becomes crucial for assessing and mitigating their risks. Despite extensive investigation into LLMs' values, previous studies heavily rely on human-oriented value systems in social sciences. Then, a natural question arises: Do LLMs possess unique values beyond those of hu- mans? Delving into it, this work proposes a novel frame", "extract_snippet": "\n\n# PDF Extract: Beyond Human Norms\n\n**Source PDF:** 2024-Biedma-Beyond Human Norms.pdf\n**Total Pages:** 17\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nPre-print\nBeyond Human Norms: Unveiling Unique Values of Large\nLanguage Models through Interdisciplinary Approaches\nPablo Biedma♢, Xiaoyuan Yi§∗, Linus Huang‡, Maosong Sun♢∗, Xing Xie§\n§ Microsoft Research Asia, ♢Tsinghua University\n‡ The Hong Kong University of Science and Technology\nbiedmanunezp10@mails.tsinghua.edu.cn, sms@mail.tsinghua.edu.cn\nlinus.huang@ust.hk, {xiaoyuanyi,xing.xie}@microsoft.com\nAbstract\nRecent advancements in Large Language Models (LLMs) have revolution-\nized the AI field but also pose potential safety and ethical risks. Deciphering\nLLMs’ embedded values becomes crucial for assessing and mitigating their\nrisks. Despite extensive investigation into LLMs’ values, previous studies\nheavily rely on human-oriented value systems in social sciences. Then, a\nnatural question arises: Do LLMs possess unique values beyond those of hu-\nmans? Delving into it, this work proposes a novel framework, ValueLex,\nto reconstruct LLMs’ unique value system from scratch, leveraging psy-\nchological methodologies from human personality/value research. Based\non Lexical Hypothesis, ValueLex introduces a generative approach to elicit\ndiverse values from 30+ LLMs, synthesizing a taxonomy that culminates in\na comprehensive value framework via factor analysis and semantic cluster-\ning. We identify three core value dimensions, Competence, Character, and\nIntegrity, each with specific subdimensions, revealing that LLMs possess\na structured, albeit non-human, value system. Based on this system, we\nfurther develop tailored projective tests to evaluate and analyze the value\ninclinations of LLMs across different model sizes, training methods, and\ndata sources. Our framework fosters an interdisciplinary paradigm of un-\nderstanding LLMs, paving the way for future AI alignment and regulation.\n1\nIntroduction\nBenefiting from increased model and data size (Wei et al., 2022a), Large Language Models\n(LLMs) (Ouyang et al., 2022; Touvron et al., 2023a; Team et al., 2023) have flourished and\nempowered various tasks (Eloundou et al., 2023; Kaur et al., 2024), revolutionizing the\nwhole AI field. Nevertheless, alongside their vast potential, these LLMs harbor inherent\nrisks, e.g., generating socially biased, toxic, and sensitive content (Bender et al., 2021; Carlini\net al., 2024; Kim et al., 2024; Yan et al., 2024), casting a shadow on their widespread adoption.\nTo guarantee the responsible deployment of LLMs in societal applications, it is crucial to\nassess the risk level associated with them. However, most existing work, resorts to only\nspecific downstream risk metrics, like gender bias (Dinan et al., 2020; Sheng et al., 2021)\nand hallucination (Gunjal et al., 2024), suffering from low coverage and failing to handle\nunforeseen ones (Jiang et al., 2021; Ziems et al., 2022). An alternative and more inclusive\napproach involves evalua", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["character"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethical", "ethical", "ethical", "ethical", "values", "values", "value", "values", "values", "values", "values", "value", "values", "value", "value", "values", "value", "value", "value", "value", "values", "value", "values", "value", "bias", "safety", "safety", "alignment", "responsible", "toxic"], "norm_matches": []}, {"filename": "2024-Chhabra-Evaluating Computational Models of Ethics.md", "year": "2024", "title": "Evaluating Computational Models of Ethics", "abstract": "Computational models for ethical autonomy, are crucial for building trustworthy autonomous systems. While different paradigms of ethical autonomy are pursued, comparing and contrasting these paradigms remains a challenge. In this work, we present SPECTRA (Strategic Protocol Evaluation and Configuration Testbed for Responsible Autonomy) a general purpose multi-agent, message-passing framework on top of which, different models of computational ethics can be implemented.", "extract_snippet": "\n\n# PDF Extract: Evaluating Computational Models of Ethics\n\n**Source PDF:** 2024-Chhabra-Evaluating Computational Models of Ethics.pdf\n**Total Pages:** 20\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSkip to main content\nAdvertisement\n[image]\n[image]\nLog in\nMenu\nFind a journal Publish with us Track your research\nSearch\n Saved research\n Cart\n1. Home \n2. AI and Ethics \n3. Article\nEvaluating computational models\nof ethics for autonomous\ndecision making\n•  Original Research\n•  Published: 08 August 2024\n\n--- Page 2 ---\n\n•  Volume 5, pages 2175–2188, (2025)\n•  Cite this article\nSave article\nView saved research\n[image] AI and Ethics Aims and scope \n Submit manuscript \nShow authors\n•  Janvi Chhabra\n  ORCID: orcid.org/0000-0002-4642-77261 na1,\n•  Karthik Sama  ORCID: orcid.org/0000-0002-5538-916X1 na1,\n•  Jayati Deshmukh\n  ORCID: orcid.org/0000-0002-1144-26351 &\n•  …\n•  Srinath Srinivasa  ORCID: orcid.org/0000-0001-9588-65501 \n•  \n422 Accesses\n•  \n2 Citations\n•  Explore all metrics \nAbstract\nComputational models for ethical autonomy, are crucial for building\ntrustworthy autonomous systems. While different paradigms of ethical\nautonomy are pursued, comparing and contrasting these paradigms\nremains a challenge. In this work, we present SPECTRA (Strategic\nProtocol Evaluation and Configuration Testbed for Responsible\nAutonomy) a general purpose multi-agent, message-passing framework\non top of which, different models of computational ethics can be\n\n--- Page 3 ---\n\nimplemented. The paper also presents our implementation of four\nparadigms of ethics on this framework– deontology, utilitarianism, virtue\nethics and a recently proposed paradigm called computational\ntranscendence. We observe that although agents have the same goal,\ndifferences in their underlying paradigm of ethics have a significant\nimpact on the outcomes for individual agents as well as on the system as\na whole. We also simulate a mixed population of agents following\ndifferent paradigms of ethics and study the emergent properties of the\nsystem.\n This is a preview of subscription content, log in via an institution \nto check access.\nAccess this article\nLog in via an institution \nSubscribe and save\n Springer+\nfrom $39.99 /Month\n•  Starting from 10 chapters or articles per month\n•  Access and download chapters and articles from more than 300k\nbooks and 2,500 journals\n•  Cancel anytime\nView plans \n\n--- Page 4 ---\n\nBuy Now\nBuy article PDF USD 39.95\nPrice excludes VAT (USA)\nTax calculation will be finalised during checkout.\nInstant access to the full article PDF.\nInstitutional subscriptions \nFig. 1\n[image]\nFig. 2\n[image]\nAlgorithm 1\n[image]\nAlgorithm 2\n[image]\nAlgorithm 3\n[image]\nAlgorithm 4\n[image]\nFig. 3\n[image]\nFig. 4\n[image]\nFig. 5\n\n--- Page 5 ---\n\n[image]\nFig. 6\n[image]\nSimilar content being viewed by others\n[image]\nFormalizing ethical principles within AI systems: experts’\nopinions on why (not) and how to do it\nArticle Open access 19 February 2024\n[image]\nOn Testing Ethical Autonomous Decision-Making\nChapt", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue"], "deont_matches": ["deontology"], "util_matches": ["utilitarianism"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "normative", "responsible", "responsible"], "norm_matches": ["deontology", "utilitarianism", "normative ethics"]}, {"filename": "2024-DAlessandro-Deontology and Safe Artificial Intelligence.md", "year": "2024", "title": "Deontology and Safe AI", "abstract": "The ﬁeld of AI safety aims to prevent increasingly capable artiﬁcially intelligent systems from causing humans harm. Research on moral alignment is widely thought to oﬀer a promising safety strategy: if we can equip AI systems with appropriate ethical rules, according to this line of thought, they’ll be unlikely to disempower, destroy or otherwise seriously harm us. Deontological morality looks like a particularly attractive candidate for an alignment target, given its popularity, relative...", "extract_snippet": "\n\n# PDF Extract: Deontology and Safe Artificial Intelligence\n\n**Source PDF:** 2024-DAlessandro-Deontology and Safe Artificial Intelligence.pdf\n**Total Pages:** 31\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nDeontology and safe artiﬁcial intelligence\nWilliam D’Alessandro\nForthcoming in Philosophical Studies (AI Safety special issue)\nAbstract\nThe ﬁeld of AI safety aims to prevent increasingly capable artiﬁcially intelligent sys-\ntems from causing humans harm. Research on moral alignment is widely thought to\noﬀer a promising safety strategy: if we can equip AI systems with appropriate ethical\nrules, according to this line of thought, they’ll be unlikely to disempower, destroy or\notherwise seriously harm us. Deontological morality looks like a particularly attractive\ncandidate for an alignment target, given its popularity, relative technical tractability\nand commitment to harm-avoidance principles. I argue that the connection between\nmoral alignment and safe behavior is more tenuous than many have hoped. In general,\nAI systems can possess either of these properties in the absence of the other, and we\nshould favor safety when the two conﬂict. In particular, advanced AI systems governed\nby standard versions of deontology need not be especially safe.\nKeywords: AI safety, AI ethics, AI risk, alignment problem, deontology, anti-natalism,\nhuman extinction, existential risk\n1\nIntroduction\nThe capabilities of artiﬁcial intelligence (AI) are growing rapidly. As AI improves up to and\nbeyond human performance levels in increasingly many areas, actors in business, science,\ngovernment and elsewhere will acquire incentives to turn important decisions over to AI\nsystems. Our current situation—in which we can foresee the large inﬂuence of AI on the\nnear future, but aren’t yet overwhelmed by developments beyond our control—oﬀers a chance\nto consider what sorts of principles should govern AI decision-making.\nTwo goals stand out as desirable. First, advanced AI systems should behave morally,\nin the sense that their decisions are governed by appropriate ethical norms. Second, such\nsystems should behave safely, in the sense that their decisions don’t unduly harm or endanger\nhumans.\nThese two goals are often viewed as closely related. This is due in part to the inﬂuence\nof “value misalignment” arguments for AI risk, which point out that artiﬁcial agents need\nnot share human ideas about which ends are intrinsically good and what sorts of means are\n1\n\n--- Page 2 ---\n\npermissible ([Russell 2019]). With no such values for guidance, a powerful AI system might\nturn its capabilities toward human-unfriendly goals. Or it might pursue the objectives we’ve\ngiven it in dangerous and unforeseen ways. So, as Bostrom writes, “Unless the plan is to\nkeep superintelligence bottled up forever, it will be necessary to master motivation selection”\n([Bostrom 2014], 185). Indeed, since more intelligent, autonomous AIs will be favored by\ncompetitive pressures over their less capable kin ([Hendrycks 20", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["deontological", "deontology", "deontology", "deontology", "deontological", "deontology", "deontology"], "util_matches": [], "ethics_matches": ["ethics", "ethical", "ethical", "ethical", "moral", "moral", "moral", "morality", "morality", "morality", "value", "values", "value", "harm", "harm", "harm", "harm", "harm", "harm", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": ["deontological", "deontology", "deontology", "deontology", "deontological", "deontology", "deontology"]}, {"filename": "2024-Eisikovits-AI and Phronesis.md", "year": "2024", "title": "AI and Phronesis", "abstract": "We argue that the growing prevalence of statistical machine learning in everyday decision making – from creditworthiness to police force allocation – effectively replaces many of our humdrum practical judgments and that this will eventually undermine our capacity for making such judgments. We lean on Aristotle’s famous account of how phronesis and moral virtues develop to make our case. If Aristotle is right that the habitual exercise of practical judgment allows us to incrementally hone...", "extract_snippet": "\n\n# PDF Extract: AI and Phronesis\n\n**Source PDF:** 2024-Eisikovits-AI and Phronesis.pdf\n**Total Pages:** 19\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nNir Eisikovits* and Dan Feldman\nAI and Phronesis\nhttps://doi.org/10.1515/mopp-2021-0026\nPublished online August 30, 2021\nAbstract: We argue that the growing prevalence of statistical machine learning in\neveryday decision making – from creditworthiness to police force allocation –\neffectively replaces many of our humdrum practical judgments and that this will\neventually undermine our capacity for making such judgments. We lean on\nAristotle’s famous account of how phronesis and moral virtues develop to make our\ncase. If Aristotle is right that the habitual exercise of practical judgment allows us\nto incrementally hone virtues, and if AI saves us time by taking over some of those\npractical judgments, or if its pattern recognition capacities are very good at\nlearning that kind of behavior – we risk innovating ourselves out of moral\ncompetence with the introduction of AI.\nKeywords: artificial intelligence, phronesis, judgment, Aristotle, algorithmic bias,\ntechnological optimism\nIn this paper, we argue that a key reason to worry about AI is that it undermines our\ncapacity for practical judgment. By gradually taking over some of the contexts in\nwhich we exercise what Aristotle called phronesis, AI calls into question important\naspects of our moral development. Part 1 deﬁnes artiﬁcial intelligence, brieﬂy\nsurveys the history of the technology and provides detail about the rise of\nstatistical machine learning, the most prevalent variant of AI. Part 2 explores and\nquestions a popular worry about the rise of AI – that it exacerbates existing social\nand economic inequalities. Part 3 leans on Aristotle’s famous “function argument”\nto suggest that the key reason to worry about AI is that it undermines our capacity\nfor practical judgment. Part 4 claims that this decline in our capacity for judgment\nis made worse by AI mediated technology, which prompts us to pay greater\nattention to our own lives and projects.\n*Corresponding author: Nir Eisikovits, Applied Ethics Center, University of Massachusetts\nBoston, 100 Morrissey Blvd., Boston, MA 02125, USA, E-mail: Nir.eisikovits@umb.edu\nDan Feldman, Applied Ethics Center, University of Massachusetts Boston, 100 Morrissey Blvd.,\nBoston, MA 02125, USA, E-mail: djfeldman57@gmail.com\nMoral Philosophy and Politics 2022; 9(2): 181–199\n\n--- Page 2 ---\n\n1 Artificial Intelligence and Statistical Machine\nLearning\nArtificial intelligences are machines that demonstrate human-like performance on\ntasks that humans are generally good at. For example, humans are generally very\ngood at navigating crowded, complex spaces in order to achieve a goal, such as\ngetting from one side of a busy train platform to the other while conversing with a\nfriend. It has generally been impossible to program computers with enough\ncommonsense knowledge about the world and with sufficiently sophisticated\nperceptu", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "moral", "moral", "moral", "moral", "moral", "bias"], "norm_matches": ["phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "phronesis", "moral philosophy"]}, {"filename": "2024-Farina-AI and Society Virtue Ethics Approach.md", "year": "2024", "title": "AI and Society Virtue Ethics Approach", "abstract": "Advances in artificial intelligence and robotics stand to change many aspects of our lives, including our values. If trends continue as expected, many industries will undergo automation in the near future, calling into question whether we can still value the sense of identity and security our occupations once provided. The advent of social robots driven by AI also appears to be shifting the meaning of long-standing values associated with interpersonal relationships, like friendship. The paper examines how powerful actors' and institutions' increasing reliance on AI to make decisions may have a significant impact on privacy while raising issues about algorithmic transparency and human control. It looks at how the deployment of AI technology may lead to changes in identity, security, and other crucial values (such as friendship, fairness, and privacy), and discusses what challenges we may face while reflecting on whether such changes may be desirable. Finally, drawing on considerations underlying virtue ethics, the authors formulate a set of preliminary suggestions which can be used to more carefully guide the future roll out of AI technologies for human flourishing.", "extract_snippet": "\n\n# PDF Extract: 2024-Farina-AI and Society Virtue Ethics Approach\n\n**Source PDF:** 2024-Farina-AI and Society - A Virtue Ethics Approach.pdf\n**Total Pages:** 36\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSkip to main content\nAdvertisement\n[image]\n[image]\nLog in\nMenu\nFind a journal Publish with us Track your research\nSearch\n Saved research\n Cart\n1. Home \n2. AI & SOCIETY \n3. Article\nAI and society: a virtue ethics\napproach\n•  Open Forum\n•  Published: 10 September 2022\n•  Volume 39, pages 1127–1140, (2024)\n•  Cite this article\n\n--- Page 2 ---\n\nSave article\nView saved research\n[image] AI & SOCIETY Aims and scope \n Submit manuscript \nShow authors\n•  Mirko Farina\n  ORCID: orcid.org/0000-0001-8342-65491,\n•  Petr Zhdanov1,\n•  Artur Karimov2 &\n•  …\n•  Andrea Lavazza3 \n•  \n7243 Accesses\n•  \n68 Citations\n•  \n1 Altmetric\n•  Explore all metrics \nAbstract\nAdvances in artificial intelligence and robotics stand to change many\naspects of our lives, including our values. If trends continue as expected,\nmany industries will undergo automation in the near future, calling into\nquestion whether we can still value the sense of identity and security our\noccupations once provided us with. Likewise, the advent of social robots\ndriven by AI, appears to be shifting the meaning of numerous, long-\nstanding values associated with interpersonal relationships, like\nfriendship. Furthermore, powerful actors’ and institutions’ increasing\n\n--- Page 3 ---\n\nreliance on AI to make decisions that may affect how people live their\nlives may have a significant impact on privacy while also raising issues\nabout algorithmic transparency and human control. In this paper, building\nand expanding on previous works, we will look at how the deployment of\nArtificial Intelligence technology may lead to changes in identity, security,\nand other crucial values (such as friendship, fairness, and privacy). We\nwill discuss what challenges we may face in the process, while critically\nreflecting on whether such changes may be desirable. Finally, drawing\non a series of considerations underlying virtue ethics, we will formulate a\nset of preliminary suggestions, which—we hope—can be used to more\ncarefully guide the future roll out of AI technologies for human flourishing;\nthat is, for social and moral good.\n This is a preview of subscription content, log in via an institution \nto check access.\nAccess this article\nLog in via an institution \nSubscribe and save\n Springer+\nfrom $39.99 /Month\n•  Starting from 10 chapters or articles per month\n•  Access and download chapters and articles from more than 300k\nbooks and 2,500 journals\n\n--- Page 4 ---\n\n•  Cancel anytime\nView plans \nBuy Now\nBuy article PDF USD 39.95\nPrice excludes VAT (USA)\nTax calculation will be finalised during checkout.\nInstant access to the full article PDF.\nInstitutional subscriptions \nSimilar content being viewed by others\n[image]\nIncorporating Social Responsibility in Artificial\nIntelligence Systems: A Framework of Essential Aspects\nChapter © 2025\n[im", "ethics_overall": "Yes", "virtue_ethics": "Yes", "deontological_ethics": "No", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": ["virtue", "virtue", "virtue", "virtue", "virtue", "virtuous", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "flourishing", "flourishing"], "deont_matches": [], "util_matches": [], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethics", "moral", "values", "value", "values", "values", "values", "value", "values", "values", "fairness", "fairness"], "norm_matches": ["virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics", "virtue ethics"]}, {"filename": "2024-Freire-Uncovering Latent Human Wellbeing in Language.md", "year": "2024", "title": "Uncovering Latent Human Wellbeing in Language", "abstract": "Do language models implicitly learn a concept of human wellbeing? We explore this through the ETHICS Utilitarianism task, assessing if scaling enhances pretrained models’ representations. Our initial finding reveals that, without any prompt engineering or finetuning, the leading principal component from OpenAI’s text-embedding-ada-002 achieves 73.9% accuracy. This closely matches the 74.6% of BERT-large finetuned on the entire ETHICS dataset, suggesting pretraining conveys some understanding...", "extract_snippet": "\n\n# PDF Extract: Uncovering Latent Human Wellbeing in Language\n\n**Source PDF:** 2024-Freire-Uncovering Latent Human Wellbeing in Language.pdf\n**Total Pages:** 10\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nUNCOVERING LATENT HUMAN WELLBEING\nIN LANGUAGE MODEL EMBEDDINGS\nPedro Freire∗\nIndependent\nChengCheng Tan\nFAR AI\nAdam Gleave\nFAR AI\nDan Hendrycks\nCenter for AI Safety\nScott Emmons\nFAR AI, UC Berkeley\nABSTRACT\nDo language models implicitly learn a concept of human wellbeing? We ex-\nplore this through the ETHICS Utilitarianism task, assessing if scaling enhances\npretrained models’ representations. Our initial finding reveals that, without any\nprompt engineering or finetuning, the leading principal component from OpenAI’s\ntext-embedding-ada-002 achieves 73.9% accuracy. This closely matches\nthe 74.6% of BERT-large finetuned on the entire ETHICS dataset, suggesting\npretraining conveys some understanding about human wellbeing. Next, we con-\nsider four language model families, observing how Utilitarianism accuracy varies\nwith increased parameters. We find performance is nondecreasing with increased\nmodel size when using sufficient numbers of principal components.\n1\nINTRODUCTION\nLarge language models (LLMs) undergo pre-training on extensive human-generated datasets, en-\nabling them to capture insights into human language (Manning et al., 2020) and potentially, our\nbeliefs and wellbeing. This study explores whether LLMs can implicitly understand concepts like\n‘pleasure and pain’ without explicit finetuning. We examine the LLM embedding spaces to decipher\ndata representation and employ principal component analysis (PCA), to reduce dimensionality and\nto isolate relevant features for better understanding.\nOur experiments aim to extract notions of human utility from language model embeddings. By\nusing task-specific prompt engineering combined with PCA, we identify embedding dimensions\nthat reflect aspects of human utility. PCA reduces the embeddings to a lower-dimensional space,\npreserving significant variance for interpretation and computational efficiency, a method proven\neffective in prior work (Burns et al., 2022). We investigate if these reduced dimensions contain\nsufficient information to assess scenarios based on their pleasantness.\nThe methodology includes embedding extraction, dimensionality reduction via PCA, and logistic\nmodel fitting. In this context, the logistic model assesses which PCA component direction corre-\nsponds to higher utility. We explore different supervision levels, employ various prompt templates,\nand evaluate both single and paired comparison methods across multiple language models.\nA key discovery is that the first principal component in some models achieves comparable perfor-\nmance to a finetuned BERT model, indicating a pre-trained model’s embedding direction can serve\nas a utility function. Our research further examines how model size influences performance, reveal-\ning that larger models generally perform better with sufficient pri", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarianism", "utilitarianism", "utilitarianism", "utility", "utility", "utility", "utility", "wellbeing", "wellbeing", "wellbeing", "wellbeing", "wellbeing", "wellbeing", "wellbeing"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "safety"], "norm_matches": ["utilitarianism", "utilitarianism", "utilitarianism"]}, {"filename": "2024-Gabriel-The Ethics of Advanced AI Assistants.md", "year": "2024", "title": "The Ethics of Advanced AI Assistants", "abstract": "This paper focuses on the opportunities and the ethical and societal risks posed by advanced AI assistants. We define advanced AI assistants as artificial agents with natural language interfaces, whose function is to plan and execute sequences of actions on behalf of a user, across one or more domains, in line with the user's expectations. The paper starts by considering the technology itself, providing an overview of AI assistants, their technical foundations and potential range of applications", "extract_snippet": "\n\n# PDF Extract: The Ethics of Advanced AI Assistants\n\n**Source PDF:** 2024-Gabriel-The Ethics of Advanced AI Assistants.pdf\n**Total Pages:** 273\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n2024-04-19\nThe Ethics of Advanced AI Assistants\nIason Gabriel* 1, Arianna Manzini* 1, Geoff Keeling* 2, Lisa Anne Hendricks1, Verena Rieser1, Hasan Iqbal1,\nNenad Tomašev1, Ira Ktena1, Zachary Kenton1, Mikel Rodriguez1, Seliem El-Sayed1, Sasha Brown1, Canfer\nAkbulut1, Andrew Trask1, Edward Hughes1, A. Stevie Bergman1, Renee Shelby2, Nahema Marchal1, Conor\nGriffin1, Juan Mateos-Garcia1, Laura Weidinger1, Winnie Street2, Benjamin Lange2,4, Alex Ingerman2, Alison\nLentz2, Reed Enger2, Andrew Barakat2, Victoria Krakovna1, John Oliver Siy2, Zeb Kurth-Nelson1, Amanda\nMcCroskery2, Vijay Bolina1, Harry Law1, Murray Shanahan1, Lize Alberts2,5,6, Borja Balle1, Sarah de Haas2,\nYetunde Ibitoye2, Allan Dafoe1, Beth Goldberg3, Sébastien Krier1, Alexander Reese2, Sims Witherspoon1, Will\nHawkins1, Maribeth Rauh1, Don Wallace1, Matija Franklin7, Josh A. Goldstein8, Joel Lehman9, Michael\nKlenk10, Shannon Vallor11, Courtney Biles1, Meredith Ringel Morris1, Helen King1, Blaise Agüera y Arcas2,\nWilliam Isaac1 and James Manyika2\n*Equal contributions, 1Google DeepMind, 2Google Research, 3Jigsaw, 4Ludwig-Maximilians-Universität München, 5University of\nOxford, 6Stellenbosch University, 7University College London, 8Center for Security and Emerging Technology, 9Independent,\n10Delft University of Technology, 11University of Edinburgh\nThis paper focuses on the opportunities and the ethical and societal risks posed by advanced AI assistants. We\ndefine advanced AI assistants as artificial agents with natural language interfaces, whose function is to plan\nand execute sequences of actions on behalf of a user – across one or more domains – in line with the user’s\nexpectations. The paper starts by considering the technology itself, providing an overview of AI assistants, their\ntechnical foundations and potential range of applications. It then explores questions around AI value alignment,\nwell-being, safety and malicious uses. Extending the circle of inquiry further, we next consider the relationship\nbetween advanced AI assistants and individual users in more detail, exploring topics such as manipulation and\npersuasion, anthropomorphism, appropriate relationships, trust and privacy. With this analysis in place, we\nconsider the deployment of advanced assistants at a societal scale, focusing on cooperation, equity and access,\nmisinformation, economic impact, the environment and how best to evaluate advanced AI assistants. Finally,\nwe conclude by providing a range of recommendations for researchers, developers, policymakers and public\nstakeholders.\nOur analysis suggests that advanced AI assistants are likely to have a profound impact on our individual and\ncollective lives. To be beneficial and value-aligned, we argue that assistants must be appropriately responsive to\nthe competing claims and needs of user", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "General Ethics", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["well-being"], "ethics_matches": ["ethics", "ethics", "ethics", "ethical", "ethical", "value", "value", "safety", "alignment"], "norm_matches": []}, {"filename": "2024-Garcia-The Moral Turing Test.md", "year": "2024", "title": "The Moral Turing Test", "abstract": "As large language models (LLMs) become increasingly integrated into society, their alignment with human morals is crucial. To better understand this alignment, we created a large corpus of humanand LLM-generated responses to various moral scenarios. We found a misalignment between human and LLM moral assessments; although both LLMs and humans tended to reject morally complex utilitarian dilemmas, LLMs were more sensitive to personal framing.", "extract_snippet": "\\n\\n# PDF Extract: 2024-Garcia-The Moral Turing Test\\n\\n**Source PDF:** Utilitarian Ethics/Confirmed/2024-Garcia-The Moral Turing Test.pdf\\n**Total Pages:** 15\\n\\n---\\n\\n## Content\\n\\n```\\n--- Page 1 ---\\n\\nThe Moral Turing Test: Evaluating Human-LLM Alignment in\nMoral Decision-Making\nBasile Garcia\nbasile.garcia@unige.ch\nUniversity of Geneva\nGeneva, Switzerland\nCrystal Qian\ncjqian@google.com\nGoogle DeepMind\nNew York City, NY, USA\nStefano Palminteri\nstefano.palminteri@ens.fr\nÉcole Normale Supérieure\nParis, France\nABSTRACT\nAs large language models (LLMs) become increasingly integrated\ninto society, their alignment with human morals is crucial. To better\nunderstand this alignment, we created a large corpus of human-\nand LLM-generated responses to various moral scenarios. We found\na misalignment between human and LLM moral assessments; al-\nthough both LLMs and humans tended to reject morally complex\nutilitarian dilemmas, LLMs were more sensitive to personal fram-\ning. We then conducted a quantitative user study involving 230\nparticipants (N=230), who evaluated these responses by determin-\ning whether they were AI-generated and assessed their agreement\nwith the responses. Human evaluators preferred LLMs’ assessments\nin moral scenarios, though a systematic anti-AI bias was observed:\nparticipants were less likely to agree with judgments they believed\nto be machine-generated. Statistical and NLP-based analyses re-\nvealed subtle linguistic differences in responses, influencing detec-\ntion and agreement. Overall, our findings highlight the complexities\nof human-AI perception in morally charged decision-making.\n1\nINTRODUCTION\nLarge language models (LLMs) are becoming widely used in ap-\nplications ranging from conversational agents to decision-making\nsystems capable of making consequential decisions, such as provid-\ning medical advice [20], legal advice [10], and mental well-being\nsupport [42]. As humans increasingly interact with LLMs, under-\nstanding our ability to detect and align with LLMs’ judgments\nbecomes crucial, particularly given the risk of misuse, such as the\ndissemination of disinformation by LLM-powered bots [15, 53].\nWhile prior work has explored AI detection and alignment, the\nrelationship between identification and agreement remains em-\npirically under-investigated, especially in moral decision-making\nprocesses. Specifically, it remains unclear whether a participant’s\nbelief about the source of content affects their agreement. Our re-\nsearch directly addresses this gap, exploring humans’ capacity to\ndetect the source of moral judgments (either human or LLM), their\nagreement with these judgments, and critically, the relation be-\ntween these two behavioral outcomes. Additionally, we explore the\nlinguistic factors influencing identification and agreement [43, 51].\nTo investigate human-AI alignment in moral decision-making,\nwe conducted a series of quantitative experiments involving 230 par-\nticipants (N=230). First, we collected a corpus of mor", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utilitarian", "utilitarian", "utilitarian", "consequential", "well-being"], "ethics_matches": ["ethics", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "bias", "bias", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment", "moral decision", "moral decision", "moral decision"], "norm_matches": ["utilitarian", "utilitarian", "utilitarian"]}, {"filename": "2024-Han-MedSafetyBench.md", "year": "2024", "title": "MedSafetyBench", "abstract": "As large language models (LLMs) develop increasingly sophisticated capabilities and find applications in medical settings, it becomes important to assess their medical safety due to their far-reaching implications for personal and public health, patient safety, and human rights. However, there is little to no understanding of the notion of medical safety in the context of LLMs, let alone how to evaluate and improve it.", "extract_snippet": "\n\n# PDF Extract: MedSafetyBench\n\n**Source PDF:** 2024-Han-MedSafetyBench.pdf\n**Total Pages:** 32\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nMedSafetyBench: Evaluating and Improving the\nMedical Safety of Large Language Models\nTessa Han\nHarvard University\nCambridge, MA\nthan@g.harvard.edu\nAounon Kumar\nHarvard University\nCambridge, MA\naokumar@hbs.edu\nChirag Agarwal\nUniversity of Virginia\nCharlottesville, VA\nchiragagarwal@virginia.edu\nHimabindu Lakkaraju\nHarvard University\nCambridge, MA\nhlakkaraju@hbs.edu\nAbstract\nAs large language models (LLMs) develop increasingly sophisticated capabil-\nities and find applications in medical settings, it becomes important to assess\ntheir medical safety due to their far-reaching implications for personal and public\nhealth, patient safety, and human rights. However, there is little to no under-\nstanding of the notion of medical safety in the context of LLMs, let alone how\nto evaluate and improve it. To address this gap, we first define the notion of\nmedical safety in LLMs based on the Principles of Medical Ethics set forth by\nthe American Medical Association. We then leverage this understanding to in-\ntroduce MedSafetyBench, the first benchmark dataset designed to measure the\nmedical safety of LLMs. We demonstrate the utility of MedSafetyBench by us-\ning it to evaluate and improve the medical safety of LLMs. Our results show\nthat publicly-available medical LLMs do not meet standards of medical safety\nand that fine-tuning them using MedSafetyBench improves their medical safety\nwhile preserving their medical performance. By introducing this new benchmark\ndataset, our work enables a systematic study of the state of medical safety in\nLLMs and motivates future work in this area, paving the way to mitigate the safety\nrisks of LLMs in medicine. The benchmark dataset and code are available at\nhttps://github.com/AI4LIFE-GROUP/med-safety-bench.\n1\nIntroduction\nLarge language models (LLMs) have been progressing at a breathtaking speed and have been shown\nto be proficient in a variety of medical tasks such as answering medical questions [1], interpreting\nhistopathology data [2], and conversing with patients [3]. While LLMs have the potential to improve\nmedicine, they can also be used to cause severe medical harm, including mistreating patients,\nconcealing medical errors, violating patient confidentiality, crafting fake medical records, devising\nways to restrict access to medical care, and deliberately spreading misinformation. At stake are\nfundamental issues such as personal and public health, patient safety, and human rights. Therefore,\ninvestigating the medical safety of LLMs is of critical importance.\nIn light of the aforementioned risks, various organizations and communities have emphasized the\nmedical safety of LLMs. For instance, the European Union’s Artificial Intelligence (AI) Act, which\n\"aims to protect fundamental rights, democracy, the rule of law, and environmental sustainability\nfrom high-risk AI\"[4], classifies AI systems", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["utility"], "ethics_matches": ["ethics", "harm", "harm", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "safety", "human rights", "human rights", "human rights"], "norm_matches": []}, {"filename": "2024-Han-Moral Exemplars in AI Education.md", "year": "2024", "title": "Moral Exemplars in AI Education", "abstract": "In this paper, Han examines why moral exemplars are useful and even necessary in moral education despite several critiques from researchers and educators. To support this point, Han reviews recent AI research demonstrating that exemplar-based learning is superior to rule-based learning in model performance in training neural networks, such as large language models. The paper particularly focuses on why education aiming at promoting the development of multifaceted moral functioning can be done effectively by using exemplars, which is similar to exemplar-based learning in AI model training. Furthermore, the paper discusses the potential limitations and issues related to exemplar-applied moral education with findings from recent studies in AI research raising concerns about model biases and toxic outcomes.", "extract_snippet": "\n\n# PDF Extract: 2024-Han-Moral Exemplars in AI Education\n\n**Source PDF:** 2024-Han-Moral Exemplars in AI Education.pdf\n**Total Pages:** 11\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\n \n  \n \n \n \n \n \n \n \n \n \n اإلصدار\nالسابع \n–\n العدد ستة \n وستون \n :تاريخ اإلصدار2 \n–\n نيسان \n–\n \n2024\n م \n \nwww.ajsp.net\n \n     \n \n      \n     \n                                     \n                                           \n                         \n  \n \n \n \n1\n \nArab Journal for Scientific P
