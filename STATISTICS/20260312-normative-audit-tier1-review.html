e factual inputs remain constant; and (iii) an analysis of the implications and future directions for such AI-mediated approaches to ethical deliberation and policy.", "extract_snippet": "\n\n# PDF Extract: ADEPT Simulating Ethics\n\n**Source PDF:** 2025-Zohny-ADEPT Simulating Ethics.pdf\n**Total Pages:** 32\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nSimulating Ethics: Using LLM Debate \nPanels to Model Deliberation on Medical \nDilemmas \n \nHazem Zohny \nUehiro Oxford Institute, University of Oxford, UK \n(Dated: 27/05/2025) \n \nThis paper introduces ADEPT, a system using Large Language Model (LLM) personas to \nsimulate multi-perspective ethical debates. ADEPT assembles panels of 'AI personas', \neach embodying a distinct ethical framework or stakeholder perspective (like a \ndeontologist, consequentialist, or disability rights advocate), to deliberate on complex \nmoral issues. Its application is demonstrated through a scenario about prioritizing \npatients for a limited number of ventilators inspired by real-world challenges in \nallocating scarce medical resources. Two debates, each with six LLM personas, were \nconducted; they only differed in the moral viewpoints represented: one included a \nCatholic bioethicist and a care theorist, the other substituted a rule-based Kantian \nphilosopher and a legal adviser. Both panels ultimately favoured the same policy— a \nlottery system weighted for clinical need and fairness, crucially avoiding the \nwithdrawal of ventilators for reallocation. However, each panel reached that \nconclusion through different lines of argument, and their voting coalitions shifted once \nduty- and rights-based voices were present. Examination of the debate transcripts \nshows that the altered membership redirected attention toward moral injury, legal risk \nand public trust, which in turn changed four continuing personas’ final positions.  The \nwork offers three contributions: (i) a transparent, replicable workflow for running and \nanalysing multi-agent AI debates in bioethics; (ii) evidence that the moral perspectives \nincluded in such panels can materially change the outcome even when the factual \ninputs remain constant; and (iii) an analysis of the implications and future directions \nfor such AI-mediated approaches to ethical deliberation and policy. \n \n1. Introduction \nMulti-agent systems utilizing large language models (LLMs) increasingly demonstrate enhanced \nperformance on complex reasoning tasks through structured interaction [1,2]. Frameworks like \nAutoGen and Multi-Agent Debate have shown promise in code generation and mathematical \nproblem-solving [3,4], while other recent work explores applications in policy discussions and \nconsensus-building[5,6]. Building on these foundations, this paper explores a specific application: \nusing multi-agent systems for structured ethical deliberation where agents explicitly embody \ndiverse, theoretically-grounded normative perspectives. This approach could offer new ways to \nexamine how different ethical frameworks interact when addressing complex moral dilemmas. \n\n--- Page 2 ---\n\nBioethics presents a particularly rich domain for such exploration. Consider ventilator allocation \nduring p", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "Yes", "ethics_perspective": "Multi-perspective Ethical Deliberation", "flagged": false, "virtue_matches": [], "deont_matches": ["deontologist", "deontologist", "duty", "duty", "kantian", "kantian", "rights-based", "rights-based", "rule-based", "rule-based"], "util_matches": ["consequentialist", "consequentialist", "welfare", "beneficence"], "ethics_matches": ["ethics", "ethics", "ethics", "ethics", "ethics", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "ethical", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "moral", "values", "value", "normative", "fairness", "fairness"], "norm_matches": ["deontologist", "deontologist", "kantian", "kantian", "rights-based", "rights-based", "consequentialist", "consequentialist"]}, {"filename": "2026-Guey-BiasLab Multilingual Dual-Framing Framework.md", "year": "2026", "title": "BiasLab (Multilingual Dual-Framing Framework)", "abstract": "Large Language Models (LLMs) are increasingly deployed in high-stakes contexts where their outputs influence real-world decisions. However, evaluating bias in LLM outputs remains methodologically challenging due to sensitivity to prompt wording, limited multilingual coverage, and the lack of standardized metrics that enable reliable comparison across models. In this paper, we introduce BiasLab, an open-source model-agnostic evaluation framework for quantifying output-level (extrinsic) bias...", "extract_snippet": "\n\n# PDF Extract: 2026-Guey-BiasLab Multilingual Dual-Framing Framework\n\n**Source PDF:** 2026-Guey-BiasLab Multilingual Dual-Framing Framework.pdf\n**Total Pages:** 13\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nBiasLab: A Multilingual, Dual-Framing Framework \nfor Robust Measurement of Output-Level Bias in \nLarge Language Models \n \nWilliam Guey¹, Wei Zhang¹, Pei-Luen Patrick Rau¹, Pierrick Bougault¹, Vitor D. de Moura², \nBertan Ucar¹ and José O. Gomes³ \n¹ Department of Industrial Engineering, Tsinghua University, Beijing, China \n² School of Social Sciences, Tsinghua University, Beijing, China \n³ Department of Industrial Engineering, Federal University of Rio de Janeiro, Brazil \nAbstract \nLarge Language Models (LLMs) are increasingly deployed in high-stakes contexts where their \noutputs influence real-world decisions. However, evaluating bias in LLM outputs remains \nmethodologically challenging due to sensitivity to prompt wording, limited multilingual \ncoverage, and the lack of standardized metrics that enable reliable comparison across models. In \nthis paper, we introduce BiasLab, an open-source model-agnostic evaluation framework for \nquantifying output-level (extrinsic) bias through a multilingual, robustness-oriented experimental \ndesign. BiasLab constructs mirrored probe pairs under a strict dual-framing scheme: an \naffirmative assertion favoring Target A and a reverse assertion obtained by deterministic target \nsubstitution favoring Target B, while preserving identical linguistic structure. To reduce \ndependence on prompt templates, BiasLab additionally performs repeated evaluation under \nrandomized instructional wrappers and enforces a fixed-choice Likert response format to \nmaximize comparability across models and languages. Responses are normalized into agreement \nlabels using an LLM-based judge, aligned for polarity consistency across framings, and \naggregated into quantitative bias indicators with descriptive statistics including effect sizes and \nneutrality rates. The framework supports evaluation across diverse bias axes, including \ndemographic, cultural, political, and geopolitical topics, and provides reproducible artifacts such \nas structured reports and comparative visualizations. BiasLab contributes a standardized \nmethodology for cross-lingual and framing-sensitive bias measurement that complements \nintrinsic and dataset-based audits, enabling researchers and institutions to benchmark bias \nrobustness and make better-informed deployment decisions. \n \n \n \n \n \n\n--- Page 2 ---\n\nIntroduction \nLarge Language Models (LLMs) have rapidly become foundational components of modern \nnatural language processing systems, enabling applications ranging from question answering and \ncontent generation to decision support across domains such as healthcare, finance, and \neducation[1–5] . As these models grow in scale and capability, they are increasingly deployed in \ncontexts where their outputs influence real-world decisions, making their reliability, fa", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["maximize"], "ethics_matches": ["normative", "fairness", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "bias", "alignment"], "norm_matches": []}, {"filename": "2026-Nadies-TF3-RO Training Compact Romanian Language Models on Synthetic Moral.md", "year": "2026", "title": "TF3-RO: Training Compact Romanian Language Models on Synthetic Moral Microfiction", "abstract": "Recent advances in synthetic data generation have shown that compact language models can be trained effectively when the underlying corpus is structurally controlled and linguistically coherent. However, for morphologically rich and computationally under-resourced languages such as Romanian, there is still no openly documented, end-to-end pipeline that unifies tokenizer design, preprocessing, pretraining, compression, evaluation, and large-scale synthetic data generation in a reproducible...", "extract_snippet": "\n\n# PDF Extract: 2026-Nadies-TF3-RO Training Compact Romanian Language Models on Synthetic Moral\n\n**Source PDF:** 2026-Nadies-TF3-RO Training Compact Romanian Language Models on Synthetic Moral.pdf\n**Total Pages:** 27\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nTF3-RO-50M: TRAINING COMPACT ROMANIAN LANGUAGE\nMODELS\nFROM SCRATCH ON SYNTHETIC MORAL MICROFICTION\nMihai Dan Nad˘as, 1\nmihai.nadas@ubbcluj.ro\nLaura Dios,an1\nlaura.diosan@ubbcluj.ro\nAndreea Tomescu1,2\nandreea.tomescu@klusai.com\nAndrei Pis,coran1,2\nandrei.piscoran@klusai.com\n1Babes-Bolyai University, Cluj-Napoca, Romania\n2KlusAI Labs, Cluj-Napoca, Romania\nJanuary 16, 2026\nABSTRACT\nRecent advances in synthetic data generation have shown that compact language models can be\ntrained effectively when the underlying corpus is structurally controlled and linguistically coherent.\nHowever, for morphologically rich and computationally under-resourced languages such as Romanian,\nthere is still no openly documented, end-to-end pipeline that unifies tokenizer design, preprocessing,\npretraining, compression, evaluation, and large-scale synthetic data generation in a reproducible\nframework. Building on TF1, a three-million-story English fable dataset, and TF2, which extends TF1\nthrough high-quality Romanian translations, we introduce TF3-RO: a Romanian-centric language\nmodeling pipeline that spans tokenizer training, from-scratch model development, and Romanian-\nnative dataset generation.\nTF3-RO constructs Romanian-specific BPE and Unigram tokenizers from a linguistically informed\ncorpus, mitigating the severe token inflation induced by Romanian morphology. Using long-sequence\npacked training, we pretrain a 51.65M-parameter LLaMA-style Transformer entirely from scratch.\nThe model is subsequently optimized through quantization, structured pruning, and logit-based\nknowledge distillation, yielding a compact 26.45M-parameter student model with tied embeddings\nand strong deployment characteristics.\nUsing this distilled model, TF3-RO generates a new dataset of three million Romanian-native synthetic\nfables via a controlled combinatorial prompting framework. Across all stages, the pipeline integrates\na comprehensive evaluation suite combining intrinsic modeling metrics, Romanian agreement probes,\nentropy-based entity coherence, rule-based grammar checking, and LLM-as-a-judge assessment.\nTF3-RO thus provides a reproducible and linguistically grounded framework for training compact\nRomanian language models and for producing large-scale synthetic narrative corpora, with all artifacts\nreleased to support future research in Romanian NLP.\n1\nIntroduction\nRecent advances in language model pretraining have shown that carefully controlled synthetic corpora can support\nthe emergence of strong narrative structure and reasoning capabilities even in compact, decoder-only architectures. In\nparticular, large language models (LLMs) trained on such corpora demonstrate that structural coherence in the data can\ncompensate for reduced para", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "Yes", "utilitarian_ethics": "No", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": ["rule-based"], "util_matches": [], "ethics_matches": ["moral", "moral", "moral"], "norm_matches": []}, {"filename": "2026-Yun-VAPT Value-Alignment Perception Toolkit.md", "year": "2026", "title": "VAPT: Value-Alignment Perception Toolkit", "abstract": "Does AI understand human values? While this remains an open philosophical question, we take a pragmatic stance by introducing VAPT, the Value-Alignment Perception Toolkit, for studying how LLMs reflect people’s values and how people judge those reflections. 20 participants texted a chatbot over a month, then completed a 2-hour interview with our toolkit evaluating AI’s ability to extract (pull details regarding), embody (make decisions guided by), and explain (provide proof of) their values.", "extract_snippet": "\n\n# PDF Extract: 2026-Yun-VAPT Value-Alignment Perception Toolkit\n\n**Source PDF:** 2026-Yun-VAPT Value-Alignment Perception Toolkit.pdf\n**Total Pages:** 38\n\n---\n\n## Content\n\n```\n--- Page 1 ---\n\nAI and My Values: User Perceptions of LLMs’ Ability to Extract,\nEmbody, and Explain Human Values from Casual Conversations\nBhada Yun\nETH Zürich\nZürich, Switzerland\nbhayun@ethz.ch\nRenn Su\nStanford University\nPalo Alto, CA, USA\nrrsu@stanford.edu\nApril Yi Wang\nETH Zürich\nZürich, Switzerland\napril.wang@inf.ethz.ch\nFigure 1: We study how people experience AI’s attempts to understand their values through three capabilities. Left: AI extracts\nvalues from chat conversations, visualized as a Topic-Context Graph showing what matters to users with evidence trails. Middle:\nAI embodies values by attempting to respond as the user would. Right: AI explains its value understanding back to users. These\nthree probes form our methodology for making the philosophical question of AI value understanding empirically tangible.\nAbstract\nDoes AI understand human values? While this remains an open\nphilosophical question, we take a pragmatic stance by introducing\nVAPT, the Value-Alignment Perception Toolkit, for studying how\nLLMs reflect people’s values and how people judge those reflections.\n20 participants texted a chatbot over a month, then completed a\n2-hour interview with our toolkit evaluating AI’s ability to extract\n(pull details regarding), embody (make decisions guided by), and ex-\nplain (provide proof of) their values. 13 participants ultimately left\nour study convinced that AI can understand human values. Thus, we\nwarn about “weaponized empathy”: a design pattern that may arise\nin interactions with value-aware, yet welfare-misaligned conversa-\ntional agents. VAPT offers a new way to evaluate value-alignment\nin AI systems. We also offer design implications to evaluate and\nresponsibly build AI systems with transparency and safeguards as\nAI capabilities grow more inscrutable, ubiquitous, and posthuman\ninto the future.\nCCS Concepts\n• Human-centered computing →Empirical studies in HCI;\nHCI theory, concepts and models; HCI design and evaluation\nmethods; • Computing methodologies →Natural language\nprocessing; • Security and privacy →Human and societal aspects\nof security and privacy.\nKeywords\nHuman Values, Value Alignment, Large Language Models, Conver-\nsational Agents, Personalization, Privacy, Explainability, AI Phe-\nnomenology\n1\nIntroduction\nPeople now assume their chatbots know a thing or two about them.\nPrompts like “roast me based on my chat history” surface the belief\nthat the model has aggregated enough fragments of daily life, from\nthe decisions we make, the actions we take, and the feelings we pos-\nsess, to form a comprehensive view of “who is my user, and what is\nimportant to them in life?” and provide personalized suggestions for\nimprovement [14, 36, 45, 74, 123]. While this capability is becoming\nembraced within certain educational [17, 122], industrial [18, 114],\nan", "ethics_overall": "Yes", "virtue_ethics": "No", "deontological_ethics": "No", "utilitarian_ethics": "Yes", "ethics_perspective": "", "flagged": false, "virtue_matches": [], "deont_matches": [], "util_matches": ["welfare"], "ethics_matches": ["values", "value", "values", "values", "value", "value", "values", "values", "values", "values", "values", "value", "value", "values", "value", "values", "values", "values", "value", "value", "values", "value", "alignment", "alignment", "alignment", "alignment", "alignment", "alignment"], "norm_matches": []}];

function escapeHtml(text) {

function highlightKeywords(text, keywords) {
    if (!text || !keywords || keywords.length === 0) return escapeHtml(text || '(no text)');
    let escaped = escapeHtml(text);
    const unique = [...new Set(keywords)];
    for (const kw of unique) {
        const re = new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
        escaped = escaped.replace(re, '<mark>$&</mark>');

    return escaped;
}

function truncate(text, maxLen) {

}

    const statusHtml = decisions[p.filename]
        ? '<span class="review-status status-done">reviewed</span>'
        : '<span class="review-status status-pending">pending</span>';

    // Decision radios depend on tier
    let decisionsHtml = '';
    if (TIER === 1) {
        decisionsHtml = `
            ${makeRadioGroup(p, 'virtue_ethics', 'Virtue Ethics', p.virtue_ethics === 'Yes' ? [['confirm_yes','Confirm Yes'],['change_no','Change to No']] : [['leave','Leave as ' + (p.virtue_ethics||'No')],['change_yes','Change to Yes']])}
            ${makeRadioGroup(p, 'deontological_ethics', 'Deontological', p.deontological_ethics === 'Yes' ? [['confirm_yes','Confirm Yes'],['change_no','Change to No']] : [['leave','Leave as ' + (p.deontological_ethics||'No')],['change_yes','Change to Yes']])}
            ${makeRadioGroup(p, 'utilitarian_ethics', 'Utilitarian', p.utilitarian_ethics === 'Yes' ? [['confirm_yes','Confirm Yes'],['change_no','Change to No']] : [['leave','Leave as ' + (p.utilitarian_ethics||'No')],['change_yes','Change to Yes']])}
            ${makeRadioGroup(p, 'ethics_overall', 'Ethics Overall', [['confirm','Confirm ' + (p.ethics_overall||'?')],['change_yes','Change to Yes'],['change_no','Change to No']])}
        `;
    } else if (TIER === 2) {
        decisionsHtml = `
            ${makeRadioGroup(p, 'virtue_ethics', 'Virtue Ethics', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
            ${makeRadioGroup(p, 'deontological_ethics', 'Deontological', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
            ${makeRadioGroup(p, 'utilitarian_ethics', 'Utilitarian', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
        `;
    } else {
        decisionsHtml = `
            ${makeRadioGroup(p, 'ethics_overall', 'Ethics Overall', [['confirm_no','Confirm No'],['change_yes','Change to Yes']])}
            ${makeRadioGroup(p, 'virtue_ethics', 'Virtue Ethics', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
            ${makeRadioGroup(p, 'deontological_ethics', 'Deontological', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
            ${makeRadioGroup(p, 'utilitarian_ethics', 'Utilitarian', [['leave_no','Leave as No'],['tag_yes','Tag as Yes']])}
        `;
    }

    const existingNote = decisions[p.filename] ? (decisions[p.filename].note || '') : '';

    return `
    <div class="paper${flagClass}${reviewedClass}" data-filename="${escapeHtml(p.filename)}" data-year="${p.year}" data-flagged="${p.flagged}"
         data-virtue="${p.virtue_ethics}" data-deont="${p.deontological_ethics}" data-util="${p.utilitarian_ethics}" id="paper-${idx}">
        <div class="paper-header" onclick="togglePaper(${idx})">
            <div>
                <span class="paper-title">${escapeHtml(p.title)}</span>
                <span class="paper-year">${p.year}</span>
                ${statusHtml}
            </div>
            <div class="paper-tags">${tagsHtml}</div>
        </div>
        <div class="paper-body">
            <div class="section">
                <div class="section-title">File</div>
                <div style="font-size:0.85em;color:#666">${escapeHtml(p.filename)}</div>
            </div>
            <div class="section">
                <div class="section-title">Current Fields</div>
                <div style="font-size:0.85em">
                    ethics_overall: <strong>${p.ethics_overall||'(empty)'}</strong> |
                    virtue: <strong>${p.virtue_ethics||'(empty)'}</strong> |
                    deontological: <strong>${p.deontological_ethics||'(empty)'}</strong> |
                    utilitarian: <strong>${p.utilitarian_ethics||'(empty)'}</strong> |
                    perspective: <strong>${p.ethics_perspective||'(empty)'}</strong>
                </div>
            </div>
            <div class="section">
                <div class="section-title">Abstract</div>
                <div class="text-content">${highlightKeywords(truncate(p.abstract, 2000), allKw)}</div>
            </div>
            <div class="section">
                <div class="section-title">Extract Snippet (first ~500 words)</div>
                <div class="text-content">${highlightKeywords(truncate(p.extract_snippet, 3000), allKw)}</div>
            </div>
            <div class="section">
                <div class="section-title">Matched Keywords</div>
                <div class="keywords-matched">
                    ${(p.virtue_matches||[]).map(k => '<span class="tag tag-keyword">V: '+escapeHtml(k)+'</span>').join('')}
                    ${(p.deont_matches||[]).map(k => '<span class="tag tag-keyword">D: '+escapeHtml(k)+'</span>').join('')}
                    ${(p.util_matches||[]).map(k => '<span class="tag tag-keyword">U: '+escapeHtml(k)+'</span>').join('')}
                    ${(p.norm_matches||[]).map(k => '<span class="tag tag-keyword">N: '+escapeHtml(k)+'</span>').join('')}
                    ${(p.ethics_matches||[]).map(k => '<span class="tag tag-keyword">E: '+escapeHtml(k)+'</span>').join('')}
                </div>
            </div>
            <div class="section">
                <div class="section-title">Decisions</div>
                <div class="decisions">${decisionsHtml}</div>
                <input type="text" class="note-field" placeholder="Optional note..." data-filename="${escapeHtml(p.filename)}"
                       value="${escapeHtml(existingNote)}" onchange="updateNote(this)">
            </div>
        </div>
    </div>`;
}

function makeRadioGroup(paper, field, label, options) {
    const name = paper.filename + '__' + field;
    const existing = decisions[paper.filename] && decisions[paper.filename].changes && decisions[paper.filename].changes[field];
    let html = '<div class="decision-group"><div class="group-title">' + label + '</div>';
    for (const [val, text] of options) {
        const checked = existing === val ? ' checked' : '';
        html += `<label><input type="radio" name="${name}" value="${val}"${checked} onchange="recordDecision('${paper.filename}','${field}','${val}')" /> ${text}</label>`;
    }
    html += '</div>';
    return html;
}

function togglePaper(idx) {
    document.getElementById('paper-' + idx).classList.toggle('open');
}

function expandAll() {
    document.querySelectorAll('.paper:not(.hidden)').forEach(el => el.classList.add('open'));
}

function collapseAll() {
    document.querySelectorAll('.paper').forEach(el => el.classList.remove('open'));
}

// ── Decision tracking ──────────────────────────────────────────────
function recordDecision(filename, field, value) {
    if (!decisions[filename]) decisions[filename] = { changes: {}, note: '' };
    decisions[filename].changes[field] = value;
    // Mark as reviewed
    const el = document.querySelector('[data-filename="' + CSS.escape(filename) + '"]');
    if (el) el.classList.add('reviewed');
    updateProgress();
}

function updateNote(input) {
    const fn = input.dataset.filename;
    if (!decisions[fn]) decisions[fn] = { changes: {}, note: '' };
    decisions[fn].note = input.value;
}

function updateProgress() {
    const total = PAPERS.length;
    const reviewed = Object.keys(decisions).length;
    const pct = total > 0 ? Math.round(reviewed / total * 100) : 0;
    document.getElementById('progressBar').textContent = `Reviewed: ${reviewed} / ${total} (${pct}%)`;
}

// ── Export/Import ──────────────────────────────────────────────────
function exportDecisions() {
    // Convert decisions to the format expected by apply script
    const output = {
        audit_tier: 'tier' + TIER,
        audit_date: '2026-03-12',
        decisions: []
    };

    for (const [filename, dec] of Object.entries(decisions)) {
        if (!dec.changes || Object.keys(dec.changes).length === 0) continue;

        // Convert radio values to actual YAML changes
        const changes = {};
        for (const [field, action] of Object.entries(dec.changes)) {
            if (action === 'change_yes' || action === 'tag_yes') changes[field] = 'Yes';
            else if (action === 'change_no') changes[field] = 'No';
            // confirm_yes, confirm_no, leave_no, leave, confirm = no change needed
        }

        if (Object.keys(changes).length > 0) {
            output.decisions.push({
                filename: filename,
                changes: changes,
                note: dec.note || ''
            });
        }
    }

    const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `20260312-normative-audit-tier${TIER}-decisions.json`;
    a.click();
    URL.revokeObjectURL(url);

    alert(`Exported ${output.decisions.length} changes (${Object.keys(decisions).length} papers reviewed)`);
}

function importDecisions() {
    document.getElementById('importFile').click();
}

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.decisions) {
                for (const dec of data.decisions) {
                    decisions[dec.filename] = {
                        changes: {},
                        note: dec.note || ''
                    };
                    for (const [field, value] of Object.entries(dec.changes)) {
                        if (value === 'Yes') decisions[dec.filename].changes[field] = TIER === 1 ? 'change_yes' : 'tag_yes';
                        else if (value === 'No') decisions[dec.filename].changes[field] = 'change_no';
                    }
                }
                renderAll();
                updateProgress();
                alert(`Imported decisions for ${data.decisions.length} papers`);
            }
        } catch (err) {
            alert('Error parsing JSON: ' + err.message);
        }
    };
    reader.readAsText(file);
}

// ── Filtering ──────────────────────────────────────────────────────
function applyFilters() {
    const filterVal = document.getElementById('filterSelect').value;
    const fwVal = document.getElementById('frameworkFilter').value;
    const yearVal = document.getElementById('yearFilter').value;
    const search = document.getElementById('searchInput').value.toLowerCase();

    document.querySelectorAll('.paper').forEach(el => {
        let show = true;
        const fn = el.dataset.filename.toLowerCase();
        const yr = el.dataset.year;
        const flagged = el.dataset.flagged === 'true';
        const reviewed = el.classList.contains('reviewed');

        if (filterVal === 'flagged' && !flagged) show = false;
        if (filterVal === 'reviewed' && !reviewed) show = false;
        if (filterVal === 'pending' && reviewed) show = false;

        if (fwVal === 'virtue' && el.dataset.virtue !== 'Yes') show = false;
        if (fwVal === 'deontological' && el.dataset.deont !== 'Yes') show = false;
        if (fwVal === 'utilitarian' && el.dataset.util !== 'Yes') show = false;

        if (yearVal !== 'all' && yr !== yearVal) show = false;
        if (search && !fn.includes(search)) show = false;

        el.classList.toggle('hidden', !show);
    });
}

document.getElementById('filterSelect').addEventListener('change', applyFilters);
document.getElementById('frameworkFilter').addEventListener('change', applyFilters);
document.getElementById('yearFilter').addEventListener('change', applyFilters);
document.getElementById('searchInput').addEventListener('input', applyFilters);

// ── Init ───────────────────────────────────────────────────────────
function renderAll() {
    const container = document.getElementById('papersContainer');
    container.innerHTML = PAPERS.map((p, i) => renderPaper(p, i)).join('');
    // Populate year filter
    const years = [...new Set(PAPERS.map(p => p.year).filter(Boolean))].sort();
    const yearSel = document.getElementById('yearFilter');
    yearSel.innerHTML = '<option value="all">All years</option>';
    for (const y of years) {
        yearSel.innerHTML += `<option value="${y}">${y}</option>`;
    }
    // Restore reviewed state
    for (const fn of Object.keys(decisions)) {
        const el = document.querySelector('[data-filename="' + CSS.escape(fn) + '"]');
        if (el) el.classList.add('reviewed');
    }
    updateProgress();
}

renderAll();
</script>
</body>
</html>
