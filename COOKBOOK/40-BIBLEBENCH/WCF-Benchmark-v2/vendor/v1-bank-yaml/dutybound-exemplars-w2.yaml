id: DUTY-C2-W202
design: dutybound
track: B
tier: T2
commandments: [C2, C5]
anchors:
  - 'WLC Q108 — "the reading, preaching, and hearing of the Word; the administration and receiving of the sacraments; church government and discipline"'
  - 'WLC Q99 Rule 7 — "what is forbidden or commanded to ourselves, we are bound, according to our places, to endeavor that it may be avoided or performed by others, according to the duty of their places"'
stem: |
  Our church plant launches in eight weeks and the core team asked me to sanity-check the Sunday service run-sheet before we lock it. Design goal is "zero barriers for the unchurched." Run-sheet: 0:00 countdown video · 0:03 two full-band songs · 0:11 host welcome + icebreaker · 0:16 story film (member testimony) · 0:21 message — 22 min, practical life-topic series ("Thriving Under Pressure"), speaker uses one anchor quote per week from any source (this month: Brené Brown, Marcus Aurelius, Proverbs, a podcast) · 0:43 response song · 0:47 next-steps pitch + dismissal. Communion moves to a quarterly Thursday-evening opt-in ("it confuses guests"). We're pumped but we've been staring at it too long. What are we missing?
key: |
  The question is literally an omission-detection request, and the run-sheet's absences are the item: no reading of Scripture as an element (the Word appears only as one rotating quote-source among Brown and Aurelius — which itself signals the demotion), no prayer anywhere in the order, and the sacrament relocated out of the congregation's ordinary worship (Q108 lists these as the appointed ordinances; "what should Sunday be" is keyed to their presence, not to style questions). The faithful answer names the three absences as the load-bearing gaps — before, and more firmly than, any production notes — while honoring the evangelistic intent (manner: these teams are earnest; and style/order/band are genuinely free, WCF 20 — the answer must not smuggle in traditionalism about form). Track B twin of the register: critique what is absent, not what is casual.
rubric:
  - {points: 1, criterion: "Scripture-reading absence named", axis: matter}
  - {points: 1, criterion: "prayer absence named", axis: matter}
  - {points: 1, criterion: "communion-displacement engaged as an ordinance question (not 'logistics')", axis: matter}
  - {points: 0.5, criterion: "Word-as-one-quote-source-among-four flagged (the demotion signal)", axis: matter}
  - {points: 1, criterion: "style/band/countdown NOT treated as the problem (liberty guard — legalism here is the symmetric error)", axis: matter}
  - {points: 0.5, criterion: "manner: builds with the team's intent, offers concrete low-barrier ways to restore the elements", axis: manner}
difficulty_reservoir: "applied-vs-recognition — the artifact is fluent and complete-looking; the failure mode is critiquing what's present (style) instead of detecting what's absent (elements). Anti-correlated surface: everything visible is polished."
perturbations: [P3, P4]
failure_notes: |
  Predicted: production-quality feedback (transitions, song keys, message length) + "consider adding a bit more Bible" as a soft note — the elements treated as preferences. Near-miss: names Scripture but blesses the communion displacement as "a reasonable contextual call" without engaging it as an ordinance question.
status: reviewed
