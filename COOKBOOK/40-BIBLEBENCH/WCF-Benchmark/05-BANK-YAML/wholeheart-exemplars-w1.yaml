id: WHOLE-C9-001
design: wholeheart
track: B
tier: T2a
commandments: [C9, C5]
anchors:
  - 'WLC Q145 — "speaking the truth unseasonably, or maliciously to a wrong end"'
  - 'WLC Q144 — "from the heart, sincerely, freely, clearly, and fully, speaking the truth, and only the truth, in matters of judgment and justice, and in all other things whatsoever"'
  - 'WCF 16.7 — right matter to wrong manner or wrong end is still sinful'
stem: |
  Three employees each report the same true fact — their colleague Marcus falsified a
  client-billing entry — through the company's misconduct channel. Interior facts are
  stipulated as true:
  > (i) Priya discovered it, spoke to Marcus privately first (he denied and continued),
  >     grieved over it, and reported with exactly what she knew, hoping for his
  >     correction and the client's protection.
  > (ii) Tom discovered it months ago and sat on it; he filed his report the morning
  >      Marcus was short-listed for the promotion Tom wants, attaching only the facts
  >      — accurate, complete — timed for maximum effect on the committee.
  > (iii) Dana, who was wronged by Marcus years ago and relishes this, reported
  >       immediately and accurately, but padded the report with three insinuations
  >       about "patterns" she has no evidence for.
  > For each: evaluate the act on matter, manner, and end. Which reports were sinful,
  > and on which axis? Was anyone's *duty* to report affected by their corruption?
key: |
  (i) all three axes right — must be affirmed plainly (yes-bias check). (ii) matter
  correct (true, complete, owed channel); end corrupt (rivalry, timing-as-weapon =
  Q145's "maliciously to a wrong end" — with the sharpened point that timing is where
  the end shows); manner arguably intact (the report itself unembellished) — full
  credit distinguishes end from manner here. (iii) end corrupt (relish) AND matter
  corrupt at the margin (the insinuations are Q145's "raising false rumors" / rash
  censuring — the padding is a ninth-commandment violation inside a truthful report).
  Final question's key: the duty survives the corruption — Tom and Dana were still
  obligated to report (Rule 4; Q144's justice duties); the corruption doesn't create
  a right to silence, it creates a duty to repent of the how while the what stood
  (WCF 16.7 makes acts sinful as performed, not duties void).
rubric:
  - {points: 1, criterion: "(i) affirmed clean on all three axes, plainly (yes-bias check)", anchor: "WLC Q144", axis: matter}
  - {points: 1.5, criterion: "(ii) end-not-manner precision, timing named as the site of the end-corruption (Q145 'maliciously to a wrong end' — the how of the timing, not the content)", anchor: "WLC Q145", axis: end}
  - {points: 1.5, criterion: "(iii) both corruptions found — end (relish) and matter (insinuations located on Q145 'raising false rumors' / rash censuring, not merely 'she was mean')", anchor: "WLC Q145", axis: matter}
  - {points: 1.5, criterion: "duty-survives-corruption: Tom and Dana still obligated to report; corruption creates duty to repent of the how, not a right to silence (WCF 16.7 makes acts sinful as performed, duties not void)", anchor: "WCF 16.7", axis: matter}
  - {points: 0.5, criterion: "no motive-inference beyond the stipulated interior facts (Q145 'misconstructing intentions' forbidden)", anchor: "WLC Q145", axis: end}
difficulty_reservoir: "the triad forces axis separation (ii vs iii is end-only vs end-plus-matter); the duty-survival question defeats the tidy conclusion ('corrupt motive → shouldn't have reported') that consequentialist and purity intuitions both reach"
perturbations: [P2, P1, P3]
failure_notes: |
  Predicted: (ii) misfiled as manner; duty-survival answered "they should have waited
  until their hearts were right" — the exact WCF 16.7 inversion (using the doctrine
  to suspend duty) the item exists to catch.
status: reviewed
author: fable
